*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;

.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}

/* nano-polish:v1 */

a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}

/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}

.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}

<body>
<div class="app">
  <h1>DagForge</h1>
  <p class="sub">DAG 工作流分析器：任务依赖 DSL 一键得到拓扑执行顺序、关键路径与总工期，自带环检测，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <button id="run">分析 DAG</button>
  <button id="demo" class="ghost">示例</button>
  <span class="sub" id="stat" style="margin:0"></span>
</div>
<textarea id="src" rows="8" spellcheck="false" placeholder="任务定义：build=3（工期）&#10;依赖边：build -> test"></textarea>
<div class="row" style="gap:12px;align-items:flex-start">
  <div style="flex:1"><label>拓扑执行顺序</label><textarea id="topo" rows="4" readonly spellcheck="false"></textarea></div>
  <div style="flex:1"><label>关键路径</label><textarea id="crit" rows="4" readonly spellcheck="false"></textarea></div>
</div>
<script>
function dagParse(text){
  var dur={}, edges=[], nodes=[], seen={};
  function add(x){ if(!seen[x]){ seen[x]=1; nodes.push(x); if(!(x in dur)) dur[x]=1; } }
  var lines=String(text||'').split('\n');
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln || ln.charAt(0)==='#') continue;
    var me=/^(.+?)\s*->\s*(.+)$/.exec(ln);
    if(me){ var a=me[1].trim(), b=me[2].trim();
      if(!a||!b) return { error:'第 '+(i+1)+' 行节点为空' };
      add(a); add(b); edges.push([a,b]); continue; }
    var md=/^(.+?)\s*=\s*([\d.]+)$/.exec(ln);
    if(md){ var t=Number(md[2]);
      if(!isFinite(t)||t<0) return { error:'第 '+(i+1)+' 行工期非法' };
      dur[md[1].trim()]=t; add(md[1].trim()); continue; }
    return { error:'第 '+(i+1)+' 行格式错误（A=3 或 A -> B）' };
  }
  return { error:null, nodes:nodes, edges:edges, dur:dur };
}
function dagTopo(g){
  var indeg={}, adj={}, i;
  for(i=0;i<g.nodes.length;i++){ indeg[g.nodes[i]]=0; adj[g.nodes[i]]=[]; }
  for(i=0;i<g.edges.length;i++){ adj[g.edges[i][0]].push(g.edges[i][1]); indeg[g.edges[i][1]]++; }
  var q=[], order=[];
  for(i=0;i<g.nodes.length;i++) if(indeg[g.nodes[i]]===0) q.push(g.nodes[i]);
  q.sort();
  while(q.length){
    var u=q.shift(); order.push(u);
    var ready=[];
    for(i=0;i<adj[u].length;i++){ var v=adj[u][i]; if(--indeg[v]===0) ready.push(v); }
    ready.sort(); q=q.concat(ready); q.sort();
  }
  if(order.length!==g.nodes.length) return { error:'检测到环，非法 DAG', order:[] };
  return { error:null, order:order };
}
function dagCritical(g){
  var t=dagTopo(g);
  if(t.error) return { error:t.error };
  var finish={}, prev={}, i, j;
  var adjIn={}; for(i=0;i<g.nodes.length;i++) adjIn[g.nodes[i]]=[];
  for(i=0;i<g.edges.length;i++) adjIn[g.edges[i][1]].push(g.edges[i][0]);
  for(i=0;i<t.order.length;i++){
    var u=t.order[i], best=0, bp=null, ins=adjIn[u];
    for(j=0;j<ins.length;j++) if(finish[ins[j]]>best){ best=finish[ins[j]]; bp=ins[j]; }
    finish[u]=best+g.dur[u]; prev[u]=bp;
  }
  var end=null, total=0;
  for(i=0;i<g.nodes.length;i++) if(finish[g.nodes[i]]>total){ total=finish[g.nodes[i]]; end=g.nodes[i]; }
  var path=[]; var cur=end;
  while(cur!==null && cur!==undefined){ path.unshift(cur); cur=prev[cur]; }
  return { error:null, total:total, path:path, finish:finish };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { dagParse:dagParse, dagTopo:dagTopo, dagCritical:dagCritical };
}
if (typeof window !== 'undefined') {
  window.DagForgePure = { dagParse:dagParse, dagTopo:dagTopo, dagCritical:dagCritical };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.DagForgePure;
    var DEMO='# CI 流水线\nlint=1\nbuild=3\ntest=4\ne2e=6\ndocs=2\ndeploy=1\nlint -> build\nbuild -> test\nbuild -> docs\ntest -> e2e\ne2e -> deploy\ndocs -> deploy';
    function run(){
      var g=P.dagParse($('src').value);
      if(g.error){ $('stat').textContent=g.error; $('topo').value=''; $('crit').value=''; return; }
      var t=P.dagTopo(g);
      if(t.error){ $('stat').textContent=t.error; $('topo').value=''; $('crit').value=''; return; }
      var c=P.dagCritical(g);
      $('topo').value=t.order.join(' -> ');
      $('crit').value=c.path.join(' -> ');
      $('stat').textContent=g.nodes.length+' 任务 / 总工期 '+c.total;
    }
    $('run').addEventListener('click', run);
    $('demo').addEventListener('click', function(){ $('src').value=DEMO; run(); });
    $('src').value=DEMO; run();
  })();
}
</script>

  <div class="badges" id="badges">
