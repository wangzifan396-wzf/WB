<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>AgeForge — 年龄 / 日期差计算：精确到岁/月/天与总天数，离线可用。</title>
<meta property="og:title" content="AgeForge">
<meta property="og:description" content="年龄与日期差计算：岁月天与总天数，离线可用">
<meta property="og:image" content="./og.png">
<meta name="description" content="年龄与日期差计算：岁月天与总天数，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>AgeForge</h1>
  <p class="sub">年龄与日期差计算：精确到岁 / 月 / 天与合计天数 · 单文件 · 零依赖 · 本地优先</p>

<label>出生日期（YYYY-MM-DD）</label>
<input type="text" id="from" value="1990-05-20">
<label>目标日期（默认今天）</label>
<input type="text" id="to" placeholder="留空=今天">
<div class="row">
  <button id="run">计算年龄</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>

function ageParse(s){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
  if(!m) return { error:'日期格式应为 YYYY-MM-DD' };
  var y=+m[1], mo=+m[2], d=+m[3];
  var dt=new Date(Date.UTC(y,mo-1,d));
  if(isNaN(dt.getTime())|| dt.getUTCFullYear()!==y || dt.getUTCMonth()!==mo-1 || dt.getUTCDate()!==d) return { error:'非法日期' };
  return { error:null, t:dt.getTime() };
}
function ageDays(a,b){
  if(typeof a==='string'){ var pa=ageParse(a); a=pa.error?NaN:pa.t; }
  if(typeof b==='string'){ var pb=ageParse(b); b=pb.error?NaN:pb.t; }
  return Math.floor((b-a)/86400000);
}
function ageDiff(fromS, toS){
  var a=ageParse(fromS), b=ageParse(toS);
  if(a.error) return { error:a.error };
  if(b.error) return { error:b.error };
  if(b.t < a.t) return { error:'结束日期不能早于开始日期' };
  var d0=new Date(a.t), d1=new Date(b.t);
  var years=d1.getUTCFullYear()-d0.getUTCFullYear();
  var months=d1.getUTCMonth()-d0.getUTCMonth();
  var days=d1.getUTCDate()-d0.getUTCDate();
  if(days<0){ months--; var prev=new Date(Date.UTC(d1.getUTCFullYear(), d1.getUTCMonth(),0)); days+=prev.getUTCDate(); }
  if(months<0){ years--; months+=12; }
  return { error:null, years:years, months:months, days:days, totalDays:ageDays(a.t,b.t) };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { ageParse:ageParse, ageDays:ageDays, ageDiff:ageDiff };
}
if (typeof window !== 'undefined') {
  window.AgeForgePure = { ageParse:ageParse, ageDays:ageDays, ageDiff:ageDiff };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.AgeForgePure;
  function run(){
    var to=$('to').value.trim() || new Date().toISOString().slice(0,10);
    var r=P.ageDiff($('from').value.trim(), to);
    if(r.error){ $('err').textContent=r.error; $('out').innerHTML=''; return; }
    $('err').textContent='';
    $('out').innerHTML='<div class="grid">'+
      '<div class="kv"><b>岁</b><span>'+r.years+'</span></div>'+
      '<div class="kv"><b>月</b><span>'+r.months+'</span></div>'+
      '<div class="kv"><b>天</b><span>'+r.days+'</span></div>'+
      '<div class="kv"><b>合计天数</b><span>'+r.totalDays+'</span></div>'+
      '</div>';
  }
  $('run').addEventListener('click', run);
  $('clear').addEventListener('click', function(){ $('from').value=''; $('to').value=''; $('out').innerHTML=''; $('err').textContent=''; });
  run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
