<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TableForge — 单文件表格工具</title>
<style>
  :root{
    --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
    --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg);padding:28px 16px;min-height:100vh}
  .app{width:100%;max-width:1080px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
  textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
       color:var(--fg);padding:9px 10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  textarea{resize:vertical}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  button.sm{padding:6px 10px;font-size:12px}
  .gridwrap{margin-top:14px;max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
  th,td{border:1px solid var(--line);padding:6px 8px;min-width:90px;outline:none}
  th{background:var(--surface);color:var(--fg);font-weight:600;position:sticky;top:0}
  td[contenteditable=true]:focus{background:rgba(94,106,210,.18);box-shadow:inset 0 0 0 1px var(--accent)}
  .opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
  .opts .field{flex:1;min-width:140px}
  .status{margin-top:12px;color:var(--dim);font-size:12px;min-height:18px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .badge.flag{color:#fff;background:var(--accent);border-color:transparent}
  footer{margin-top:20px;color:var(--dim);font-size:12px}
  a{color:var(--info);text-decoration:none}
  .row2{display:flex;gap:16px;flex-wrap:wrap}
  .row2>*{flex:1;min-width:280px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线表格工作台：粘贴 CSV/TSV/JSON 即解析，单元格编辑、增删行列、排序、筛选、分组聚合，导出 Markdown/HTML/JSON/CSV/TSV。">
</head>
<body>
<div class="app">
  <h1>TableForge</h1>
  <p class="sub">离线表格工作台 · 单文件 · 零依赖 · 本地优先</p>

  <div class="row2">
    <div>
      <label for="import">粘贴 CSV / TSV / JSON 数组（或直接点「示例」）</label>
      <textarea id="import" rows="6" placeholder="name,age,city&#10;Alice,30,NYC&#10;Bob,25,LA"></textarea>
      <div class="toolbar">
        <button id="parse">解析为表格</button>
        <button id="sample" class="ghost">载入示例</button>
        <button id="addRow" class="ghost sm">+ 行</button>
        <button id="addCol" class="ghost sm">+ 列</button>
        <button id="delRow" class="ghost sm">- 行</button>
        <button id="delCol" class="ghost sm">- 列</button>
        <label style="margin:0 0 0 6px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px">
          <input type="checkbox" id="hasHeader" checked style="width:auto"> 首行为表头
        </label>
      </div>
    </div>
    <div>
      <label>排序</label>
      <div class="opts">
        <div class="field"><select id="sortCol"></select></div>
        <div class="field"><select id="sortDir"><option value="asc">升序</option><option value="desc">降序</option></select></div>
        <button id="sortBtn" class="sm">应用排序</button>
      </div>
      <label>筛选（列包含文本）</label>
      <div class="opts">
        <div class="field"><select id="filterCol"></select></div>
        <div class="field"><input type="text" id="filterQ" placeholder="关键词"></div>
        <button id="filterBtn" class="sm">筛选</button>
        <button id="resetBtn" class="ghost sm">还原</button>
      </div>
      <label>分组聚合（按组列对值列计算）</label>
      <div class="opts">
        <div class="field"><select id="aggGroup"></select></div>
        <div class="field"><select id="aggVal"></select></div>
        <div class="field"><select id="aggOp"><option value="sum">求和</option><option value="avg">均值</option><option value="count">计数</option><option value="min">最小</option><option value="max">最大</option></select></div>
        <button id="aggBtn" class="sm">聚合</button>
      </div>
    </div>
  </div>

  <div class="gridwrap"><div id="grid"></div></div>
  <div class="status" id="status">就绪</div>

  <label>导出</label>
  <div class="toolbar">
    <button id="copyTsv" class="ghost">复制 TSV</button>
    <button id="dlCsv" class="ghost">下载 CSV</button>
    <button id="copyMd" class="ghost">复制 Markdown</button>
    <button id="copyHtml" class="ghost">复制 HTML</button>
    <button id="copyJson" class="ghost">复制 JSON</button>
    <button id="dlJson" class="ghost">下载 JSON</button>
    <button id="transposeBtn" class="ghost">转置</button>
  </div>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>

<script>
/* ===== 纯函数区（首个无属性 script）：可被 Node _test.js 提取并断言 ===== */
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function num(v){ var n=parseFloat(String(v==null?'':v).replace(/,/g,'')); return isNaN(n)?NaN:n; }
  function detectDelimiter(text){
    var first = (text.split(/\r?\n/)[0]||'');
    var c=(first.match(/,/g)||[]).length, t=(first.match(/\t/g)||[]).length, s=(first.match(/;/g)||[]).length;
    if (t>=c && t>=s && t>0) return '\t';
    if (s>=c && s>0) return ';';
    return ',';
  }
  function parseDelimited(text, delim, quote){
    delim = delim || ','; quote = (quote==null)?'"':quote;
    var rows=[], row=[], field='', i=0, n=text.length, q=false;
    while(i<n){
      var ch=text[i];
      if(q){
        if(ch===quote){ if(text[i+1]===quote){ field+=quote; i+=2; continue; } q=false; i++; continue; }
        field+=ch; i++; continue;
      }
      if(ch===quote && field===''){ q=true; i++; continue; }
      if(ch===delim){ row.push(field); field=''; i++; continue; }
      if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
      field+=ch; i++;
    }
    if(field!=='' || row.length>0){ row.push(field); rows.push(row); }
    while(rows.length && rows[rows.length-1].length===1 && rows[rows.length-1][0]==='') rows.pop();
    while(rows.length && rows[rows.length-1].every(function(x){return x==='';})) rows.pop();
    return rows;
  }
  function toDelimited(rows, delim, quote){
    delim = delim || ','; quote = (quote==null)?'"':quote;
    return rows.map(function(r){
      return r.map(function(cell){
        var s=String(cell==null?'':cell);
        if(s.indexOf(delim)>=0 || s.indexOf(quote)>=0 || s.indexOf('\n')>=0 || s.indexOf('\r')>=0){
          return quote + s.split(quote).join(quote+quote) + quote;
        }
        return s;
      }).join(delim);
    }).join('\n');
  }
  function toMarkdown(rows){
    if(!rows.length) return '';
    function cells(r){ return '| ' + r.map(function(c){return String(c==null?'':c).trim();}).join(' | ') + ' |'; }
    var head = cells(rows[0]);
    var sep = '| ' + rows[0].map(function(){return '---';}).join(' | ') + ' |';
    var body = rows.slice(1).map(cells).join('\n');
    return head + '\n' + sep + (body ? '\n' + body : '');
  }
  function toHTML(rows){
    if(!rows.length) return '<table></table>';
    var head = rows[0].map(function(c){return '<th>'+esc(c)+'</th>';}).join('');
    var body = rows.slice(1).map(function(r){ return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>'; }).join('');
    return '<table border="1" cellspacing="0" cellpadding="6"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table>';
  }
  function toJSON(rows){
    if(!rows.length) return '[]';
    var header = rows[0];
    var objs = rows.slice(1).map(function(r){
      var o={}; header.forEach(function(h,i){ o[String(h).trim()] = (r[i]==null?'':r[i]); }); return o;
    });
    return JSON.stringify(objs, null, 2);
  }
  function transpose(rows){
    if(!rows.length) return [];
    var cols = Math.max.apply(null, rows.map(function(r){return r.length;}));
    var out=[];
    for(var c=0;c<cols;c++){ var nr=[]; for(var ri=0;ri<rows.length;ri++){ nr.push(rows[ri][c]==null?'':rows[ri][c]); } out.push(nr); }
    return out;
  }
  function sortRows(rows, colIdx, dir, hasHeader){
    if(!rows.length) return rows;
    var head = hasHeader ? rows[0] : null;
    var body = (hasHeader ? rows.slice(1) : rows.slice()).map(function(r){return r.slice();});
    var mul = dir==='desc' ? -1 : 1;
    body.sort(function(a,b){
      var va=num(a[colIdx]), vb=num(b[colIdx]);
      if(!isNaN(va)&&!isNaN(vb)) return (va-vb)*mul;
      var sa=String(a[colIdx]==null?'':a[colIdx]).toLowerCase();
      var sb=String(b[colIdx]==null?'':b[colIdx]).toLowerCase();
      return sa.localeCompare(sb)*mul;
    });
    return hasHeader ? [head].concat(body) : body;
  }
  function filterRows(rows, colIdx, query, hasHeader){
    if(!rows.length) return [];
    var q=String(query).toLowerCase(), out=[];
    for(var i=0;i<rows.length;i++){
      if(hasHeader && i===0){ out.push(rows[i]); continue; }
      var cell=String(rows[i][colIdx]==null?'':rows[i][colIdx]).toLowerCase();
      if(cell.indexOf(q)>=0) out.push(rows[i]);
    }
    return out;
  }
  function aggregate(rows, groupCol, valCol, op, hasHeader){
    if(!rows.length) return [];
    var body = hasHeader ? rows.slice(1) : rows;
    var groups={};
    body.forEach(function(r){ var g=String(r[groupCol]==null?'':r[groupCol]); (groups[g]=groups[g]||[]).push(num(r[valCol])); });
    var out=[];
    Object.keys(groups).forEach(function(g){
      var vals=groups[g].filter(function(v){return !isNaN(v);});
      var res;
      if(op==='count') res=groups[g].length;
      else if(op==='sum') res=vals.reduce(function(a,b){return a+b;},0);
      else if(op==='avg') res= vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : 0;
      else if(op==='min') res= vals.length ? Math.min.apply(null,vals) : 0;
      else if(op==='max') res= vals.length ? Math.max.apply(null,vals) : 0;
      else res=vals.length;
      out.push([g, res]);
    });
    return out;
  }
  function columnStats(values){
    var nums = values.map(num).filter(function(v){return !isNaN(v);});
    var nonempty = values.filter(function(v){return String(v==null?'':v).trim()!=='';}).length;
    var sum = nums.reduce(function(a,b){return a+b;},0);
    return { count:values.length, nonempty:nonempty,
      min: nums.length?Math.min.apply(null,nums):NaN,
      max: nums.length?Math.max.apply(null,nums):NaN,
      sum:sum, avg: nums.length? sum/nums.length : NaN };
  }
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      esc:esc, num:num, detectDelimiter:detectDelimiter, parseDelimited:parseDelimited,
      toDelimited:toDelimited, toMarkdown:toMarkdown, toHTML:toHTML, toJSON:toJSON,
      transpose:transpose, sortRows:sortRows, filterRows:filterRows, aggregate:aggregate, columnStats:columnStats
    };
  }
if (typeof window !== 'undefined') {
  window.TableForgePure = {
    esc:esc, num:num, detectDelimiter:detectDelimiter, parseDelimited:parseDelimited,
    toDelimited:toDelimited, toMarkdown:toMarkdown, toHTML:toHTML, toJSON:toJSON,
    transpose:transpose, sortRows:sortRows, filterRows:filterRows, aggregate:aggregate, columnStats:columnStats
  };
}
</script>

<script>
/* ===== UI 区（第二个 script）：仅在浏览器中运行 ===== */
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var KEY = 'tableforge.rows.v1';
    function sample(){ return 'name,age,city,active\nAlice,30,NYC,true\nBob,25,LA,false\nCarol,41,SYD,true\nDavid,33,BER,true'; }
    var state = { base:null, rows:[] };
    function tryLoad(){ try{ var s=localStorage.getItem(KEY); if(s){ state.rows=JSON.parse(s); state.base=state.rows.map(function(r){return r.slice();}); return true; } }catch(e){} return false; }
    function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state.rows)); }catch(e){} }
    function setStatus(t){ $('status').textContent = t; }

    function renderTable(){
      var rows = state.rows;
      if(!rows.length){ $('grid').innerHTML = '<div style="padding:14px;color:var(--dim)">暂无数据，粘贴后点「解析为表格」。</div>'; return; }
      var html = '<table><thead><tr>';
      rows[0].forEach(function(c,ci){ html += '<th>'+escCell(c)+'</th>'; });
      html += '</tr></thead><tbody>';
      for(var ri=1; ri<rows.length; ri++){
        html += '<tr>';
        rows[ri].forEach(function(c,ci){ html += '<td contenteditable="true" data-r="'+ri+'" data-c="'+ci+'">'+escCell(c)+'</td>'; });
        html += '</tr>';
      }
      html += '</tbody></table>';
      $('grid').innerHTML = html;
    }
    function escCell(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function refreshCols(){
      var n = state.rows.length ? state.rows[0].length : 0;
      var opts = ''; for(var i=0;i<n;i++){ opts += '<option value="'+i+'">'+(i+1)+'</option>'; }
      ['sortCol','filterCol','aggGroup','aggVal'].forEach(function(id){ $(id).innerHTML = opts; });
    }
    function fromText(t){
      var delim = window.TableForgePure.detectDelimiter(t) || ',';
      var rows = window.TableForgePure.parseDelimited(t, delim);
      if(!rows.length){ setStatus('解析为空，请检查输入格式'); return; }
      state.rows = rows; state.base = rows.map(function(r){return r.slice();});
      renderTable(); refreshCols(); save();
      setStatus('已解析 '+rows.length+' 行 × '+rows[0].length+' 列（分隔符：'+(delim==='\t'?'Tab':delim)+'）');
    }
    function doParse(){
      var t = $('import').value.trim();
      if(!t){ setStatus('请先粘贴内容'); return; }
      fromText(t);
    }
    function loadSample(){ $('import').value = sample(); doParse(); }

    // 编辑单元格
    $('grid').addEventListener('input', function(e){
      var td = e.target;
      if(td && td.tagName==='TD' && td.hasAttribute('data-r')){
        var r = +td.getAttribute('data-r'), c = +td.getAttribute('data-c');
        if(state.rows[r] && c < state.rows[r].length){ state.rows[r][c] = td.textContent; save(); }
      }
    });

    function addRow(){ var w = state.rows.length? state.rows[0].length : 1; state.rows.push(new Array(w).fill('')); renderTable(); refreshCols(); save(); }
    function addCol(){ state.rows.forEach(function(r){ r.push(''); }); renderTable(); refreshCols(); save(); }
    function delRow(){ if(state.rows.length>1){ state.rows.pop(); renderTable(); refreshCols(); save(); } }
    function delCol(){ if(state.rows.length && state.rows[0].length>1){ state.rows.forEach(function(r){ r.pop(); }); renderTable(); refreshCols(); save(); } }

    function doSort(){
      var ci = +$('sortCol').value, dir=$('sortDir').value, hh=$('hasHeader').checked;
      state.rows = window.TableForgePure.sortRows(state.rows, ci, dir, hh);
      renderTable(); save(); setStatus('已按第 '+(ci+1)+' 列'+(dir==='asc'?'升':'降')+'序排序');
    }
    function doFilter(){
      var ci=+$('filterCol').value, q=$('filterQ').value, hh=$('hasHeader').checked;
      var res = window.TableForgePure.filterRows(state.rows, ci, q, hh);
      state.rows = res; renderTable(); refreshCols(); save();
      setStatus('筛选后 '+res.length+' 行（含表头）');
    }
    function doReset(){ if(state.base){ state.rows = state.base.map(function(r){return r.slice();}); renderTable(); refreshCols(); save(); setStatus('已还原到解析时状态'); } }
    function doAgg(){
      var g=+$('aggGroup').value, v=+$('aggVal').value, op=$('aggOp').value, hh=$('hasHeader').checked;
      var res = window.TableForgePure.aggregate(state.rows, g, v, op, hh);
      res.unshift([op,'value']); state.rows = res; renderTable(); refreshCols(); save();
      setStatus('已按第 '+(g+1)+' 列聚合（'+op+'）');
    }
    function doTranspose(){ state.rows = window.TableForgePure.transpose(state.rows); renderTable(); refreshCols(); save(); setStatus('已转置'); }

    function copyText(t){ if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t); else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); } }
    function download(name, content, mime){ var b=new Blob([content],{type:mime}); var u=URL.createObjectURL(b); var a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(function(){URL.revokeObjectURL(u);},1000); }

    $('parse').addEventListener('click', doParse);
    $('sample').addEventListener('click', loadSample);
    $('addRow').addEventListener('click', addRow);
    $('addCol').addEventListener('click', addCol);
    $('delRow').addEventListener('click', delRow);
    $('delCol').addEventListener('click', delCol);
    $('sortBtn').addEventListener('click', doSort);
    $('filterBtn').addEventListener('click', doFilter);
    $('resetBtn').addEventListener('click', doReset);
    $('aggBtn').addEventListener('click', doAgg);
    $('transposeBtn').addEventListener('click', doTranspose);
    $('copyTsv').addEventListener('click', function(){ copyText(window.TableForgePure.toDelimited(state.rows,'\t')); setStatus('已复制 TSV'); });
    $('dlCsv').addEventListener('click', function(){ download('table.csv', window.TableForgePure.toDelimited(state.rows,','), 'text/csv'); });
    $('copyMd').addEventListener('click', function(){ copyText(window.TableForgePure.toMarkdown(state.rows)); setStatus('已复制 Markdown 表格'); });
    $('copyHtml').addEventListener('click', function(){ copyText(window.TableForgePure.toHTML(state.rows)); setStatus('已复制 HTML 表格'); });
    $('copyJson').addEventListener('click', function(){ copyText(window.TableForgePure.toJSON(state.rows)); setStatus('已复制 JSON'); });
    $('dlJson').addEventListener('click', function(){ download('table.json', window.TableForgePure.toJSON(state.rows), 'application/json'); });

    // 初始化
    state.hasHeader = $('hasHeader').checked;
    $('hasHeader').addEventListener('change', function(){ state.hasHeader = this.checked; });
    if(!tryLoad()){ var t=sample(); $('import').value=t; fromText(t); }
    else { renderTable(); refreshCols(); }
  })();
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
