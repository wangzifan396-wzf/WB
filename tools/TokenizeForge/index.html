<body>
<div class="app">
  <h1>TokenizeForge</h1>
  <p class="sub">BPE 分词可视化：在语料上训练字节对合并规则，对任意文本切分子词并着色展示，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<label>训练语料（空格分词）</label>
<textarea id="corpus" rows="4">low low low low lower lower lowest newest newest newest wider wide widest</textarea>
<label>合并次数</label>
<input id="merges" type="number" value="8" min="1" max="200" aria-label="merges">
<label>待切分文本</label>
<input id="text" type="text" value="lowest wideness" aria-label="text">
<div class="row">
  <button id="run">训练并切分</button>
</div>
<div class="err" id="err"></div>
<div id="mergesOut" style="margin-top:12px;font-family:ui-monospace,monospace;font-size:12px;color:#A1A1AA;"></div>
<div id="tokensOut" style="margin-top:12px;line-height:2.2;"></div>
<script>
function tkWords(text){ return String(text||'').trim().split(/\s+/).filter(Boolean); }
function tkPairCounts(words){
  var c = {};
  for(var i=0;i<words.length;i++){
    var w = words[i];
    for(var j=0;j<w.length-1;j++){
      var k = w[j] + '\u0001' + w[j+1];
      c[k] = (c[k]||0) + 1;
    }
  }
  return c;
}
function tkBestPair(counts){
  var best = null, bestN = 1;
  for(var k in counts){
    if(counts[k] > bestN || (counts[k] === bestN && best !== null && k < best)){
      best = k; bestN = counts[k];
    }
  }
  return best ? { pair: best.split('\u0001'), count: bestN } : null;
}
function tkMergeWord(w, a, b){
  var out = [], i = 0;
  while(i < w.length){
    if(i < w.length-1 && w[i] === a && w[i+1] === b){ out.push(a+b); i += 2; }
    else { out.push(w[i]); i++; }
  }
  return out;
}
function tkTrain(text, numMerges){
  var words = tkWords(text).map(function(w){ return w.split(''); });
  var merges = [];
  for(var m=0;m<numMerges;m++){
    var best = tkBestPair(tkPairCounts(words));
    if(!best || best.count < 2) break;
    merges.push(best.pair);
    for(var i=0;i<words.length;i++) words[i] = tkMergeWord(words[i], best.pair[0], best.pair[1]);
  }
  return merges;
}
function tkEncodeWord(word, merges){
  var w = String(word).split('');
  for(var m=0;m<merges.length;m++) w = tkMergeWord(w, merges[m][0], merges[m][1]);
  return w;
}
function tkEncode(text, merges){
  var out = [];
  var ws = tkWords(text);
  for(var i=0;i<ws.length;i++) out.push(tkEncodeWord(ws[i], merges));
  return out;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { tkWords:tkWords, tkPairCounts:tkPairCounts, tkBestPair:tkBestPair, tkMergeWord:tkMergeWord, tkTrain:tkTrain, tkEncodeWord:tkEncodeWord, tkEncode:tkEncode };
}
if (typeof window !== 'undefined') {
  window.TokenizeForgePure = { tkWords:tkWords, tkPairCounts:tkPairCounts, tkBestPair:tkBestPair, tkMergeWord:tkMergeWord, tkTrain:tkTrain, tkEncodeWord:tkEncodeWord, tkEncode:tkEncode };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.TokenizeForgePure;
    var COLORS = ['#5E6AD2','#10B981','#F5A623','#22D3EE','#A78BFA','#EF4444'];
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function run(){
      var merges = P.tkTrain($('corpus').value, Number($('merges').value)||8);
      var mh = merges.map(function(p,i){ return (i+1)+'. '+esc(p[0])+' + '+esc(p[1])+' \u2192 '+esc(p[0]+p[1]); }).join('<br>');
      $('mergesOut').innerHTML = merges.length ? '<b style="color:#FFF;">合并规则</b><br>'+mh : '语料太小，未产生合并规则';
      var enc = P.tkEncode($('text').value, merges), html = '';
      for(var i=0;i<enc.length;i++){
        for(var j=0;j<enc[i].length;j++){
          var c = COLORS[(i*7+j) % COLORS.length];
          html += '<span style="background:'+c+'22;border:1px solid '+c+'66;color:'+c+';border-radius:6px;padding:2px 8px;margin:2px;display:inline-block;font-family:ui-monospace,monospace;">'+esc(enc[i][j])+'</span>';
        }
        html += '<span style="display:inline-block;width:14px;"></span>';
      }
      $('tokensOut').innerHTML = html;
    }
    $('run').addEventListener('click', run);
    run();
  })();
}
</script>
