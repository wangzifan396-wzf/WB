<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>DkimForge — DKIM 记录分析：标签逐条解读、密钥强度估算与签名评级。</title>
<meta property="og:title" content="DkimForge">
<meta property="og:description" content="DKIM 记录分析：标签解读、密钥强度估算与签名评级，离线可用">
<meta property="og:image" content="./og.png">
<meta name="description" content="DKIM 记录分析：标签解读、密钥强度估算与签名评级，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>DkimForge</h1>
  <p class="sub">DKIM 记录分析：v/k/p/t/h 标签解读、RSA 密钥强度估算、签名评分与 A-F 评级 · 单文件 · 零依赖 · 本地优先</p>

<label>DKIM 记录（TXT 值）</label>
<textarea id="src" rows="4" spellcheck="false" style="font:13px ui-monospace,Consolas,monospace"></textarea>
<div class="row">
  <button id="run">分析</button>
  <button id="sample" class="ghost">示例</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>

function dkParse(record){
  record=String(record||'').replace(/\s+/g,' ').trim();
  var segs=record.split(';').map(function(s){return s.trim();}).filter(Boolean);
  var tags={};
  for(var i=0;i<segs.length;i++){
    var eq=segs[i].indexOf('=');
    if(eq<0) continue;
    var k=segs[i].slice(0,eq).trim().toLowerCase();
    var v=segs[i].slice(eq+1).trim();
    tags[k]=v;
  }
  return { version: tags.v||'', tags:tags, ok: !!(tags.v && tags.p) };
}
function dkKeyBits(p){
  if(!p) return 0;
  var clean=String(p).replace(/\s+/g,'');
  var bytes=Math.floor(clean.length*3/4);
  return bytes*8;
}
function dkScore(tags){
  var checks=[];
  function add(name,pass,weight){ checks.push({name:name,pass:!!pass,weight:weight}); }
  add('含 v=DKIM1 版本', /dkim1/i.test(tags.v||''), 10);
  add('含公钥 p=', !!tags.p, 30);
  add('指定密钥算法 k', !!tags.k, 10);
  var bits=dkKeyBits(tags.p);
  add('密钥长度 ≥ 1024', bits>=1024, 15);
  add('密钥长度 ≥ 2048', bits>=2048, 15);
  add('签名范围 t=s 已声明(可选)', !!tags.t, 10);
  add('哈希算法 h 已声明(可选)', !!tags.h, 10);
  var got=0,total=0;
  for(var j=0;j<checks.length;j++){ total+=checks[j].weight; if(checks[j].pass) got+=checks[j].weight; }
  var grade='F';
  if(got>=90)grade='A'; else if(got>=75)grade='B'; else if(got>=60)grade='C'; else if(got>=40)grade='D';
  return { score:got, max:total, grade:grade, bits:bits, checks:checks };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { dkParse:dkParse, dkKeyBits:dkKeyBits, dkScore:dkScore };
}
if (typeof window !== 'undefined') {
  window.DkimForgePure = { dkParse:dkParse, dkKeyBits:dkKeyBits, dkScore:dkScore };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.DkimForgePure;
  var CHUNK='MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA';
  var SAMPLE='v=DKIM1; k=rsa; t=s; h=sha256; p='+(CHUNK+CHUNK+CHUNK+CHUNK+CHUNK+CHUNK+CHUNK+CHUNK);
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function run(){
    var rec=P.dkParse($('src').value);
    if(!rec.ok){ $('err').textContent='不是有效的 DKIM 记录（需含 v= 与 p=）'; $('out').innerHTML=''; return; }
    var s=P.dkScore(rec.tags);
    $('err').textContent='';
    var g='<div class="grid">'+
      '<div class="kv"><b>签名评级</b><span>'+s.grade+' ('+s.score+'/'+s.max+')</span></div>'+
      '<div class="kv"><b>密钥类型</b><span>'+esc(rec.tags.k||'未指定')+'</span></div>'+
      '<div class="kv"><b>估算强度</b><span>'+s.bits+' bit</span></div></div>';
    var c='';
    for(var j=0;j<s.checks.length;j++) c+='<div class="kv"><b>'+(s.checks[j].pass?'✓':'✗')+' '+esc(s.checks[j].name)+'</b><span>'+s.checks[j].weight+'</span></div>';
    $('out').innerHTML=g+'<div style="margin-top:6px">'+c+'</div>';
  }
  $('run').addEventListener('click', run);
  $('sample').addEventListener('click', function(){ $('src').value=SAMPLE; run(); });
  $('src').value=SAMPLE; run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
