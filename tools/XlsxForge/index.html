<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<body>
<div class="app">
  <h1>XlsxForge</h1>
  <p class="sub">纯前端 Excel 生成器：粘贴 CSV 即打包为标准 .xlsx（inline string + 数字类型自动识别，自实现 STORED ZIP），零依赖离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <button id="make">生成 .xlsx</button>
  <button id="demo" class="ghost">示例</button>
  <span class="sub" id="stat" style="margin:0"></span>
</div>
<textarea id="src" rows="9" spellcheck="false" placeholder="粘贴 CSV，每行一条记录，逗号分隔"></textarea>
<script>
function xlCrc32(bytes){
  var table=xlCrc32._t;
  if(!table){
    table=xlCrc32._t=[];
    for(var i=0;i<256;i++){ var c=i;
      for(var k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
      table[i]=c>>>0; }
  }
  var crc=0xFFFFFFFF;
  for(var j=0;j<bytes.length;j++) crc=(crc>>>8) ^ table[(crc ^ bytes[j]) & 0xFF];
  return (crc ^ 0xFFFFFFFF)>>>0;
}
function xlUtf8(str){
  var out=[], s=String(str);
  for(var i=0;i<s.length;i++){
    var c=s.codePointAt(i);
    if(c>0xFFFF) i++;
    if(c<0x80) out.push(c);
    else if(c<0x800){ out.push(0xC0|(c>>6), 0x80|(c&63)); }
    else if(c<0x10000){ out.push(0xE0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63)); }
    else { out.push(0xF0|(c>>18), 0x80|((c>>12)&63), 0x80|((c>>6)&63), 0x80|(c&63)); }
  }
  return out;
}
function xlZip(files){
  var chunks=[], central=[], offset=0, i;
  function u16(v){ return [v&255,(v>>8)&255]; }
  function u32(v){ return [v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255]; }
  for(i=0;i<files.length;i++){
    var nameB=xlUtf8(files[i].name), data=files[i].data, crc=xlCrc32(data);
    var local=[0x50,0x4B,0x03,0x04].concat(u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0),nameB,data);
    central.push({ name:nameB, crc:crc, size:data.length, offset:offset });
    chunks.push(local); offset+=local.length;
  }
  var cd=[], cdStart=offset;
  for(i=0;i<central.length;i++){
    var e=central[i];
    cd=cd.concat([0x50,0x4B,0x01,0x02],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(e.crc),u32(e.size),u32(e.size),u16(e.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(e.offset),e.name);
  }
  var eocd=[0x50,0x4B,0x05,0x06].concat(u16(0),u16(0),u16(files.length),u16(files.length),u32(cd.length),u32(cdStart),u16(0));
  var all=[]; for(i=0;i<chunks.length;i++) all=all.concat(chunks[i]);
  return new Uint8Array(all.concat(cd, eocd));
}
function xlColName(n){
  var s='';
  while(n>0){ var r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); }
  return s;
}
function xlParseCsv(text){
  var rows=[], lines=String(text||'').split('\n');
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].replace(/\r$/,'');
    if(!ln.trim()) continue;
    rows.push(ln.split(',').map(function(c){ return c.trim(); }));
  }
  return rows;
}
function xlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function xlIsNum(s){ return s!=='' && isFinite(Number(s)); }
function xlSheetXml(rows){
  var body='';
  for(var r=0;r<rows.length;r++){
    body+='<row r="'+(r+1)+'">';
    for(var c=0;c<rows[r].length;c++){
      var v=rows[r][c], ref=xlColName(c+1)+(r+1);
      if(xlIsNum(v)) body+='<c r="'+ref+'"><v>'+Number(v)+'</v></c>';
      else body+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xlEsc(v)+'</t></is></c>';
    }
    body+='</row>';
  }
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+body+'</sheetData></worksheet>';
}
function xlBuild(text){
  var rows=xlParseCsv(text);
  var ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>';
  var rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  var wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>';
  var wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>';
  return xlZip([
    { name:'[Content_Types].xml', data:xlUtf8(ct) },
    { name:'_rels/.rels', data:xlUtf8(rels) },
    { name:'xl/workbook.xml', data:xlUtf8(wb) },
    { name:'xl/_rels/workbook.xml.rels', data:xlUtf8(wbRels) },
    { name:'xl/worksheets/sheet1.xml', data:xlUtf8(xlSheetXml(rows)) }
  ]);
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { xlCrc32:xlCrc32, xlUtf8:xlUtf8, xlZip:xlZip, xlColName:xlColName, xlParseCsv:xlParseCsv, xlIsNum:xlIsNum, xlSheetXml:xlSheetXml, xlBuild:xlBuild, xlEsc:xlEsc };
}
if (typeof window !== 'undefined') {
  window.XlsxForgePure = { xlCrc32:xlCrc32, xlUtf8:xlUtf8, xlZip:xlZip, xlColName:xlColName, xlParseCsv:xlParseCsv, xlIsNum:xlIsNum, xlSheetXml:xlSheetXml, xlBuild:xlBuild, xlEsc:xlEsc };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.XlsxForgePure;
    var DEMO='批次,工具数,断言\n批三十六,238,4106\n批三十七,248,4209\n批三十八,258,4390';
    $('make').addEventListener('click', function(){
      var bytes=P.xlBuild($('src').value);
      var rows=P.xlParseCsv($('src').value);
      $('stat').textContent=rows.length+' 行 / '+bytes.length+' 字节';
      try{
        var blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        var a=document.createElement('a');
        a.href=URL.createObjectURL(blob); a.download='xlsxforge.xlsx';
        document.body.appendChild(a); a.click(); a.remove();
      }catch(e){}
    });
    $('demo').addEventListener('click', function(){ $('src').value=DEMO; });
    $('src').value=DEMO;
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>

    <span class="badge flag">旗舰</span>
  </div>

</div>
