:root{

  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}

.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

<body>
<div class="app">
  <h1>UnionForge</h1>
  <p class="sub">并查集 Union-Find：路径压缩 + 按秩合并，动态连通性 · 单文件 · 零依赖 · 本地优先</p>

<label>操作序列（每行：union a b | find a | connected a b | count）</label>
<textarea id="ops" rows="6">union 0 1
union 2 3
union 1 2
connected 0 3
count</textarea>
<div class="row">
  <button id="run">运行</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">运行并查集操作，观察连通分量</div>
<script>
function ufMake(){ return {parent:{}, rank:{}}; }
function ufAdd(uf, x){ x=String(x); if(!(x in uf.parent)){ uf.parent[x]=x; uf.rank[x]=0; } }
function ufFind(uf, x){
  x=String(x); ufAdd(uf,x);
  var root=x; while(uf.parent[root]!==root){ root=uf.parent[root]; }
  var cur=x;
  while(uf.parent[cur]!==root){ var nxt=uf.parent[cur]; uf.parent[cur]=root; cur=nxt; }
  return root;
}
function ufUnion(uf, a, b){
  a=String(a); b=String(b); ufAdd(uf,a); ufAdd(uf,b);
  var ra=ufFind(uf,a), rb=ufFind(uf,b);
  if(ra===rb) return;
  if(uf.rank[ra]<uf.rank[rb]){ uf.parent[ra]=rb; }
  else if(uf.rank[ra]>uf.rank[rb]){ uf.parent[rb]=ra; }
  else { uf.parent[rb]=ra; uf.rank[ra]++; }
}
function ufConnected(uf, a, b){ return ufFind(uf,a)===ufFind(uf,b); }
function ufCount(uf){
  var sets={}; for(var k in uf.parent){ sets[ufFind(uf,k)]=1; }
  return Object.keys(sets).length;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { ufMake:ufMake, ufAdd:ufAdd, ufFind:ufFind, ufUnion:ufUnion, ufConnected:ufConnected, ufCount:ufCount };
}
if (typeof window !== 'undefined') {
  window.UnionForgePure = { ufMake:ufMake, ufAdd:ufAdd, ufFind:ufFind, ufUnion:ufUnion, ufConnected:ufConnected, ufCount:ufCount };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.UnionForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var uf=P.ufMake(); var log=[];
        var lines=$('ops').value.split(/[\n]+/).map(function(x){return x.trim();}).filter(function(x){return x.length;});
        for(var i=0;i<lines.length;i++){
          var tk=lines[i].split(/\s+/);
          if(tk[0]==='union'){ P.ufUnion(uf, tk[1], tk[2]); log.push('union '+tk[1]+' '+tk[2]); }
          else if(tk[0]==='find'){ log.push('find '+tk[1]+' = '+P.ufFind(uf, tk[1])); }
          else if(tk[0]==='connected'){ log.push(tk[1]+'~'+tk[2]+' = '+P.ufConnected(uf, tk[1], tk[2])); }
          else if(tk[0]==='count'){ log.push('components = '+P.ufCount(uf)); }
        }
        $('out').textContent=log.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('ops').value=''; $('out').textContent='运行并查集操作，观察连通分量'; });
  })();
}
</script>
