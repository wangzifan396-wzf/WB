/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}

/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}

<body>
<div class="app">
  <h1>SequenceForge</h1>
  <p class="sub">时序图：mermaid 风格 DSL 一键生成 SVG 时序图 · 单文件 · 零依赖 · 本地优先</p>

<label>时序图 DSL（A->B: 消息 为实线，A-->B: 为虚线回包）</label>
<textarea id="txt" rows="8">Client->Gateway: POST /login
Gateway->Auth: verify(token)
Auth-->Gateway: ok
Gateway->DB: load profile
DB-->Gateway: row
Gateway-->Client: 200 OK</textarea>
<div class="row">
  <button id="run">生成时序图</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>SVG 时序图</label>
<div class="out" id="out" aria-live="polite" style="overflow:auto">生成结果显示在这里</div>
<script>
function sqParse(text){
  if(typeof text!=='string'||!text.trim()) return { value:null, error:'DSL 为空' };
  var lines=text.split('\n'), actors=[], seen={}, msgs=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line||line.charAt(0)==='#') continue;
    var m=line.match(/^([^-<>]+?)\s*(-->|->)\s*([^:]+?)\s*:\s*(.+)$/);
    if(!m) return { value:null, error:'第 '+(i+1)+' 行语法错误（应为 A->B: 消息）' };
    var from=m[1].trim(), to=m[3].trim();
    if(!seen[from]){ seen[from]=1; actors.push(from); }
    if(!seen[to]){ seen[to]=1; actors.push(to); }
    msgs.push({ from:from, to:to, text:m[4].trim(), dashed:m[2]==='-->', self:from===to });
  }
  if(!msgs.length) return { value:null, error:'没有有效消息行' };
  return { value:{ actors:actors, messages:msgs }, error:null };
}
function sqLayout(model){
  var COLW=150, TOP=52, ROWH=42;
  var lanes={}, i;
  for(i=0;i<model.actors.length;i++) lanes[model.actors[i]]=40+i*COLW+COLW/2;
  var arrows=[];
  for(i=0;i<model.messages.length;i++){
    var mg=model.messages[i], y=TOP+28+i*ROWH;
    arrows.push({ x1:lanes[mg.from], x2:lanes[mg.to], y:y, text:mg.text, dashed:mg.dashed, self:mg.self });
  }
  return { lanes:lanes, arrows:arrows,
    width:40+model.actors.length*COLW+20,
    height:TOP+28+model.messages.length*ROWH+30 };
}
function sqEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function sqSvg(text){
  var p=sqParse(text);
  if(p.error) return { value:null, error:p.error };
  var L=sqLayout(p.value);
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+L.width+'" height="'+L.height+'" viewBox="0 0 '+L.width+' '+L.height+'">';
  s+='<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#5E6AD2"/></marker></defs>';
  s+='<rect width="'+L.width+'" height="'+L.height+'" fill="#0A0A0B"/>';
  var a, x;
  for(a in L.lanes){
    x=L.lanes[a];
    s+='<line x1="'+x+'" y1="46" x2="'+x+'" y2="'+(L.height-16)+'" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>';
    s+='<rect x="'+(x-58)+'" y="14" width="116" height="28" rx="7" fill="#141417" stroke="#5E6AD2" stroke-width="1.2"/>';
    s+='<text x="'+x+'" y="32" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="system-ui,sans-serif">'+sqEsc(a.length>13?a.slice(0,12)+'…':a)+'</text>';
  }
  for(var i=0;i<L.arrows.length;i++){
    var ar=L.arrows[i], dash=ar.dashed?' stroke-dasharray="5,4"':'';
    if(ar.self){
      s+='<path d="M'+ar.x1+' '+(ar.y-8)+' h46 v16 h-46" fill="none" stroke="#22D3EE" stroke-width="1.4" marker-end="url(#arr)"'+dash+'/>';
      s+='<text x="'+(ar.x1+52)+'" y="'+ar.y+'" font-size="11" fill="#A1A1AA" font-family="system-ui,sans-serif">'+sqEsc(ar.text)+'</text>';
    } else {
      s+='<line x1="'+ar.x1+'" y1="'+ar.y+'" x2="'+ar.x2+'" y2="'+ar.y+'" stroke="'+(ar.dashed?'#10B981':'#5E6AD2')+'" stroke-width="1.4" marker-end="url(#arr)"'+dash+'/>';
      s+='<text x="'+((ar.x1+ar.x2)/2)+'" y="'+(ar.y-6)+'" text-anchor="middle" font-size="11" fill="#A1A1AA" font-family="system-ui,sans-serif">'+sqEsc(ar.text)+'</text>';
    }
  }
  s+='</svg>';
  return { value:s, error:null };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { sqParse:sqParse, sqLayout:sqLayout, sqSvg:sqSvg, sqEsc:sqEsc };
}
if (typeof window !== 'undefined') {
  window.SequenceForgePure = { sqParse:sqParse, sqLayout:sqLayout, sqSvg:sqSvg, sqEsc:sqEsc };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.SequenceForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var r=P.sqSvg($('txt').value);
      if(r.error){ $('err').textContent=r.error; return; }
      $('out').innerHTML=r.value;
    });
    $('clear').addEventListener('click', function(){ $('txt').value=''; $('out').textContent='生成结果显示在这里'; });
  })();
}
</script>
