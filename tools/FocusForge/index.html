<style>
:root{
  --bg:#0A0A0B; --surface:#141417; --surface-2:#1A1B1E; --surface-3:#202125;
  --text:#FFFFFF; --muted:#A1A1AA; --faint:#71717A;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
  --accent:#5E6AD2; --accent-soft:rgba(94,106,210,0.16);
  --ok:#10B981; --warn:#F5A623; --danger:#F5365C;
  --radius:10px;
}
[data-theme="light"]{
  --bg:#FFFFFF; --surface:#F7F8FA; --surface-2:#EEF0F3; --surface-3:#E4E7EC;
  --text:#18181B; --muted:#52525B; --faint:#71717A;
  --border:rgba(0,0,0,0.10); --border-strong:rgba(0,0,0,0.16);
  --accent-soft:rgba(94,106,210,0.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 80px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:.2px}
.brand svg{width:26px;height:26px}
.brand .g{color:var(--accent)}
.tabs{display:flex;gap:6px;margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.tab{border:0;background:transparent;color:var(--muted);font:600 13px system-ui;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.12s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:#fff}
.panel{display:none;animation:fade .18s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.card h2{margin:0 0 14px;font-size:15px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:9px;padding:9px 11px;font:14px system-ui;outline:none;transition:.12s;min-width:0;
}
input:focus,select:focus{border-color:var(--accent)}
label{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);
  border-radius:9px;padding:9px 15px;font:600 13px system-ui;cursor:pointer;transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{border-color:transparent;color:var(--danger);background:transparent;padding:6px 8px}
.btn.danger:hover{background:rgba(245,54,92,0.10)}
.small{font-size:12px;color:var(--faint)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
/* Pomodoro */
.pomo-wrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:8px 0}
.ring{position:relative;width:220px;height:220px}
.ring svg{transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--surface-3);stroke-width:14}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time{font-size:46px;font-weight:700;letter-spacing:1px}
.ring .phase{font-size:14px;color:var(--muted);margin-top:2px}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;width:100%}
.cfg-grid .field{display:flex;flex-direction:column;gap:5px}
.cfg-grid input{width:100%}
.done-badge{font-size:13px;color:var(--ok);font-weight:600}
/* Timer list */
.titem{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;transition:.15s}
.titem.done{border-color:var(--ok);background:rgba(16,185,129,0.08)}
.titem .tname{font-weight:600;min-width:90px}
.titem .trem{font-size:26px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.titem .tbar{flex:1;height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;min-width:60px}
.titem .tbar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s linear}
.titem.done .tbar>i{background:var(--ok)}
.empty{color:var(--faint);font-size:13px;padding:14px;text-align:center;border:1px dashed var(--border);border-radius:12px}
/* World clock */
.city{display:flex;align-items:baseline;gap:14px;padding:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.city .cname{font-weight:600;min-width:70px}
.city .ctime{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.city .coff{color:var(--muted);font-size:12px;margin-left:auto}
/* Stopwatch */
.stop-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
.stop-time{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.laps{width:100%;max-height:200px;overflow:auto}
.lap{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.lap .ln{color:var(--muted)}
.hint{color:var(--faint);font-size:12px;margin-top:8px}
.datalist-hidden{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--surface-3);color:var(--text);
  padding:10px 18px;border-radius:99px;border:1px solid var(--border-strong);font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9999}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media(max-width:560px){.titem .trem{font-size:20px}.stop-time{font-size:40px}.ring{width:180px;height:180px}}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>

<body>
<h1 class="nt-sr-only">FocusForge</h1>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="13" r="8"/><path d="M12 13V9"/><path d="M9 2h6"/>
      </svg>
      <span>Focus<span class="g">Forge</span></span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="pomo" data-i18n="专注">专注</button>
      <button class="tab" data-tab="timers" data-i18n="倒计时">倒计时</button>
      <button class="tab" data-tab="stop" data-i18n="秒表">秒表</button>
      <button class="tab" data-tab="world" data-i18n="世界时钟">世界时钟</button>
    </nav>
  </div>
  <main id="app"></main>

<datalist id="tzList" class="datalist-hidden"></datalist>

<script>
/* FocusForge 应用主脚本（也是 _test.js 抽取的首个 <script>） */
(function(){
  'use strict';

  // ---------- 纯函数（可在 node / vm 下测试） ----------
  function escapeHtml(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function uid(p){ return (p||'id') + '_' + Math.random().toString(36).slice(2,9); }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function pad2(n){ n=Math.floor(n); return (n<10?'0':'')+n; }

  function fmtTime(sec){
    sec = Math.max(0, Math.round(sec||0));
    var s = sec % 60, m = Math.floor(sec/60) % 60, h = Math.floor(sec/3600);
    return (h>0 ? h+':' : '') + pad2(m) + ':' + pad2(s);
  }
  // 时长输入：支持 MM:SS / HH:MM:SS；纯数字按「分钟」解释
  function parseDur(str){
    if(str===null||str===undefined) return 0;
    str = String(str).trim();
    if(!str) return 0;
    if(str.indexOf(':')>=0){
      var parts = str.split(':').map(function(x){ return parseFloat(x)||0; });
      if(parts.length>=3) return parts[0]*3600 + parts[1]*60 + parts[2];
      return parts[0]*60 + (parts[1]||0);
    }
    var n = parseFloat(str);
    return isNaN(n) ? 0 : Math.round(n*60);
  }

  function todayStr(){ try{ return new Date().toISOString().slice(0,10); }catch(e){ return ''; } }

  function defaultState(){
    return {
      pomodoro:{ work:25, short:5, long:15, longEvery:4, auto:true, phase:'work',
        completed:0, remaining:25*60, running:false, startedAt:null, today:todayStr(), todayCount:0 },
      timers:[],
      stopwatch:{ running:false, elapsed:0, startedAt:null, laps:[] },
      cities:[
        {id:uid('c'),name:'北京',tz:'Asia/Shanghai'},
        {id:uid('c'),name:'UTC',tz:'Etc/UTC'},
        {id:uid('c'),name:'纽约',tz:'America/New_York'},
        {id:uid('c'),name:'伦敦',tz:'Europe/London'},
        {id:uid('c'),name:'东京',tz:'Asia/Tokyo'}
      ]
    };
  }

  function pomodoroPhaseDuration(cfg, phase){
    var m = (phase==='work')?cfg.work : (phase==='long')?cfg.long : cfg.short;
    return Math.max(1, m*60);
  }
  // 推进一个阶段，返回新的 pomodoro 子对象
  function pomodoroAdvance(p){
    var np = clone(p);
    if(np.phase==='work'){
      np.completed = (np.completed||0) + 1;
      var d = todayStr();
      if(np.today!==d){ np.today=d; np.todayCount=0; }
      np.todayCount = (np.todayCount||0) + 1;
      np.phase = ((np.completed % Math.max(1,np.longEvery))===0) ? 'long' : 'short';
    } else {
      np.phase = 'work';
    }
    return np;
  }

  function remainingFor(t, now){
    if(t.running && t.startedAt){
      var r = t.total - (now - t.startedAt)/1000;
      return r>0 ? r : 0;
    }
    return t.remaining;
  }
  function addTimer(state, name, total){
    var s = clone(state);
    var total0 = Math.max(1, Math.round(total||0));
    s.timers = s.timers.concat([{id:uid('t'),name:name||'计时器',total:total0,remaining:total0,running:false,startedAt:null}]);
    return s;
  }
  function updateTimer(state, id, patch){
    var s = clone(state);
    s.timers = s.timers.map(function(t){ return t.id===id ? Object.assign({}, t, patch) : t; });
    return s;
  }
  function removeTimer(state, id){
    var s = clone(state);
    s.timers = s.timers.filter(function(t){ return t.id!==id; });
    return s;
  }
  function startTimer(t, now){
    var nt = clone(t);
    if(nt.remaining<=0) nt.remaining = nt.total;
    nt.running = true; nt.startedAt = now;
    return nt;
  }
  function pauseTimer(t, now){
    var nt = clone(t);
    nt.remaining = remainingFor(t, now);
    nt.running = false; nt.startedAt = null;
    return nt;
  }
  function resetTimer(t){
    var nt = clone(t);
    nt.running = false; nt.remaining = nt.total; nt.startedAt = null;
    return nt;
  }
  function addCity(state, name, tz){
    var s = clone(state);
    s.cities = s.cities.concat([{id:uid('c'),name:name||'城市',tz:tz||'Etc/UTC'}]);
    return s;
  }
  function removeCity(state, id){
    var s = clone(state);
    s.cities = s.cities.filter(function(c){ return c.id!==id; });
    return s;
  }
  function fmtZone(tz, now, opts){
    opts = opts || {};
    try{
      var f = new Intl.DateTimeFormat('zh-CN', Object.assign({
        timeZone:tz, hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'
      }, opts));
      return f.format(now);
    }catch(e){ return '—'; }
  }
  function zoneOffset(tz, now){
    try{
      var parts = new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset'}).formatToParts(now);
      for(var i=0;i<parts.length;i++){ if(parts[i].type==='timeZoneName') return parts[i].value; }
      return '';
    }catch(e){ return ''; }
  }
  function exportState(state){ return JSON.stringify(state); }
  function normTimer(t){
    t = t || {};
    return { id:t.id||uid('t'), name:String(t.name||'计时器'),
      total:Number(t.total)||0, remaining:(typeof t.remaining==='number')?t.remaining:(Number(t.total)||0),
      running:!!t.running, startedAt:t.startedAt||null };
  }
  function normCity(c){
    c = c || {};
    return { id:c.id||uid('c'), name:String(c.name||'城市'), tz:String(c.tz||'Etc/UTC') };
  }
  function importState(json){
    var s = (typeof json==='string') ? JSON.parse(json) : json;
    if(!s || typeof s!=='object') throw new Error('invalid state');
    var d = defaultState();
    if(s.pomodoro && typeof s.pomodoro==='object'){
      var p = s.pomodoro;
      ['work','short','long','longEvery','completed','remaining','todayCount'].forEach(function(k){
        if(typeof p[k]==='number') d.pomodoro[k]=p[k];
      });
      if(typeof p.phase==='string') d.pomodoro.phase=p.phase;
      d.pomodoro.today = p.today || d.pomodoro.today;
      d.pomodoro.auto = (typeof p.auto==='boolean') ? p.auto : true;
      d.pomodoro.running=false; d.pomodoro.startedAt=null;
    }
    if(Array.isArray(s.timers)) d.timers = s.timers.map(normTimer);
    if(Array.isArray(s.cities)) d.cities = s.cities.map(normCity);
    return d;
  }
  function statsOf(state){
    return {
      timers: state.timers.length,
      running: state.timers.filter(function(t){ return t.running; }).length,
      cities: state.cities.length,
      totalSeconds: state.timers.reduce(function(a,t){ return a + (t.total||0); }, 0)
    };
  }

  var API = {
    escapeHtml:escapeHtml, uid:uid, clone:clone, fmtTime:fmtTime, parseDur:parseDur,
    todayStr:todayStr, defaultState:defaultState,
    pomodoroPhaseDuration:pomodoroPhaseDuration, pomodoroAdvance:pomodoroAdvance,
    remainingFor:remainingFor, addTimer:addTimer, updateTimer:updateTimer, removeTimer:removeTimer,
    startTimer:startTimer, pauseTimer:pauseTimer, resetTimer:resetTimer,
    addCity:addCity, removeCity:removeCity, fmtZone:fmtZone, zoneOffset:zoneOffset,
    exportState:exportState, importState:importState, statsOf:statsOf
  };

  if(typeof module!=='undefined' && module.exports){ module.exports = API; }

  // ---------- 浏览器 UI（node 下跳过） ----------
  if(typeof window==='undefined' || !window.document) return;

  var LSK = 'focusforge.state.v1';
  var EN = { '专注':'Focus','短休息':'Short Break','长休息':'Long Break','时间到！':'Time\'s up!' };
  function tr(s){ return (document.documentElement.getAttribute('data-lang')==='en' && EN[s]) ? EN[s] : s; }
  function $(sel,root){ return (root||document).querySelector(sel); }
  function $all(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function lsGet(){
    try{ var v=localStorage.getItem(LSK); return v?JSON.parse(v):null; }catch(e){ return null; }
  }
  function lsSet(v){ try{ localStorage.setItem(LSK, JSON.stringify(v)); }catch(e){} }
  function storeGet(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
  function storeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  // 主题
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t==='light'?'light':'dark');
  }
  function initTheme(){ applyTheme(storeGet('focusforge.theme','dark')); }

  var state = lsGet() || defaultState();
  // 防旧数据缺字段
  (function(){ var d=defaultState(); state.pomodoro=Object.assign(d.pomodoro, state.pomodoro||{});
    state.stopwatch=Object.assign(d.stopwatch, state.stopwatch||{});
    if(!Array.isArray(state.timers)) state.timers=[];
    if(!Array.isArray(state.cities)||!state.cities.length) state.cities=d.cities;
  })();
  function save(){ lsSet(state); }

  var C = 2*Math.PI*54; // 环周长
  var app = $('#app');
  var activeTab = 'pomo';

  function toast(msg){
    var t=$('#toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },1600);
  }

  // ---------- 渲染骨架 ----------
  function buildUI(){
    app.innerHTML =
      // 专注
      '<section class="panel active" id="panel-pomo">' +
        '<div class="card"><div class="pomo-wrap">' +
          '<div class="ring"><svg width="220" height="220" viewBox="0 0 220 220">' +
            '<circle class="track" cx="110" cy="110" r="54"/>' +
            '<circle class="fg" id="ringFg" cx="110" cy="110" r="54" stroke-dasharray="'+C+'" stroke-dashoffset="0"/>' +
          '</svg><div class="center"><div class="time mono" id="pomoTime">25:00</div><div class="phase" id="pomoPhase">专注</div></div>' +
          '</div>' +
          '<div class="row" style="justify-content:center">' +
            '<button class="btn primary" data-act="pomo-toggle" id="pomoToggle">开始</button>' +
            '<button class="btn" data-act="pomo-reset">重置</button>' +
            '<button class="btn ghost" data-act="pomo-skip">跳过</button>' +
          '</div>' +
          '<div class="hint" id="pomoDone"></div>' +
        '</div></div>' +
        '<div class="card"><h2>设置</h2><div class="cfg-grid">' +
          '<div class="field"><label>专注时长（分钟）</label><input type="number" min="1" max="180" id="cfgWork" data-cfg="work" aria-label="cfgWork"></div>' +
          '<div class="field"><label>短休息（分钟）</label><input type="number" min="1" max="60" id="cfgShort" data-cfg="short" aria-label="cfgShort"></div>' +
          '<div class="field"><label>长休息（分钟）</label><input type="number" min="1" max="120" id="cfgLong" data-cfg="long" aria-label="cfgLong"></div>' +
          '<div class="field"><label>每 N 个专注后长休息</label><input type="number" min="1" max="12" id="cfgLongEvery" data-cfg="longEvery" aria-label="cfgLongEvery"></div>' +
        '</div>' +
        '<label class="row" style="margin-top:12px"><input type="checkbox" id="cfgAuto" data-cfg="auto"> 自动进入下一阶段</label>' +
        '</div>' +
      '</section>' +
      // 倒计时
      '<section class="panel" id="panel-timers">' +
        '<div class="card"><h2>添加倒计时</h2>' +
          '<div class="row">' +
            '<input id="timerName" placeholder="名称（如：泡茶）" style="flex:1;min-width:120px" aria-label="名称（如：泡茶）">' +
            '<input id="timerDur" placeholder="时长 25:00 或 5（分钟）" style="flex:1;min-width:120px" aria-label="时长 25:00 或 5（分钟）">' +
            '<button class="btn primary" data-act="timer-add">添加</button>' +
          '</div>' +
        '</div>' +
        '<div id="timerList"></div>' +
      '</section>' +
      // 秒表
      '<section class="panel" id="panel-stop">' +
        '<div class="card"><div class="stop-wrap">' +
          '<div class="stop-time mono" id="stopTime">00:00.00</div>' +
          '<div class="row">' +
            '<button class="btn primary" data-act="stop-toggle" id="stopToggle">开始</button>' +
            '<button class="btn" data-act="stop-lap">计圈</button>' +
            '<button class="btn ghost" data-act="stop-reset">重置</button>' +
          '</div>' +
        '</div></div>' +
        '<div class="card"><h2>计圈</h2><div class="laps" id="lapList"></div></div>' +
      '</section>' +
      // 世界时钟
      '<section class="panel" id="panel-world">' +
        '<div class="card"><h2>添加城市</h2>' +
          '<div class="row">' +
            '<input id="cityName" placeholder="城市名（如：巴黎）" style="flex:1;min-width:110px" aria-label="城市名（如：巴黎）">' +
            '<input id="cityTz" placeholder="时区（如：Europe/Paris）" list="tzList" style="flex:1;min-width:140px" aria-label="时区（如：Europe/Paris）">' +
            '<button class="btn primary" data-act="city-add">添加</button>' +
          '</div>' +
          '<div class="hint">常见：Asia/Shanghai · America/New_York · Europe/London · Europe/Paris · Asia/Tokyo · Etc/UTC</div>' +
        '</div>' +
        '<div id="cityList"></div>' +
      '</section>';
    bindUI();
    buildTzList();
    buildTimerList();
    buildCityList();
    syncCfgInputs();
    update();
  }

  function buildTzList(){
    var dl = $('#tzList'); if(!dl) return;
    var zones = ['Asia/Shanghai','Asia/Tokyo','Asia/Singapore','Asia/Dubai','Asia/Kolkata',
      'Europe/Moscow','Europe/London','Europe/Paris','Europe/Berlin','Africa/Cairo',
      'America/New_York','America/Chicago','America/Los_Angeles','America/Sao_Paulo',
      'Australia/Sydney','Pacific/Auckland','Etc/UTC'];
    dl.innerHTML = zones.map(function(z){ return '<option value="'+z+'">'+z+'</option>'; }).join('');
  }

  function bindUI(){
    $('#tabs').addEventListener('click', function(e){
      var b = e.target.closest('[data-tab]'); if(!b) return;
      activeTab = b.getAttribute('data-tab');
      $all('.tab').forEach(function(t){ t.classList.toggle('active', t===b); });
      $all('.panel').forEach(function(p){ p.classList.toggle('active', p.id==='panel-'+activeTab); });
      update();
    });
    app.addEventListener('click', function(e){
      var b = e.target.closest('[data-act]'); if(!b) return;
      var act = b.getAttribute('data-act');
      if(act==='pomo-toggle') togglePomo();
      else if(act==='pomo-reset') resetPomo();
      else if(act==='pomo-skip') skipPomo();
      else if(act==='timer-add') addTimerFromForm();
      else if(act==='timer-toggle') toggleTimer(b.getAttribute('data-id'));
      else if(act==='timer-reset') doResetTimer(b.getAttribute('data-id'));
      else if(act==='timer-del') delTimer(b.getAttribute('data-id'));
      else if(act==='stop-toggle') toggleStop();
      else if(act==='stop-lap') lapStop();
      else if(act==='stop-reset') resetStop();
      else if(act==='city-add') addCityFromForm();
      else if(act==='city-del') delCity(b.getAttribute('data-id'));
    });
    app.addEventListener('change', function(e){
      var i = e.target.closest('[data-cfg]'); if(!i) return;
      var k = i.getAttribute('data-cfg');
      var p = state.pomodoro;
      if(k==='auto'){ p.auto = i.checked; }
      else { var v = parseInt(i.value,10); if(!isNaN(v)&&v>0){ p[k]=v; if(!p.running){ p.remaining=pomodoroPhaseDuration(p,p.phase); } } }
      save(); update();
    });
    app.addEventListener('keydown', function(e){
      if(e.key!=='Enter') return;
      if(e.target.id==='timerName'||e.target.id==='timerDur') addTimerFromForm();
      else if(e.target.id==='cityName'||e.target.id==='cityTz') addCityFromForm();
    });
  }

  function syncCfgInputs(){
    $('#cfgWork').value = state.pomodoro.work;
    $('#cfgShort').value = state.pomodoro.short;
    $('#cfgLong').value = state.pomodoro.long;
    $('#cfgLongEvery').value = state.pomodoro.longEvery;
    $('#cfgAuto').checked = !!state.pomodoro.auto;
  }

  // ---------- 番茄钟 ----------
  function startPomo(){
    var p = state.pomodoro;
    if(p.remaining<=0) p.remaining = pomodoroPhaseDuration(p, p.phase);
    p.running = true; p.startedAt = Date.now();
    save();
  }
  function togglePomo(){
    var p = state.pomodoro;
    if(p.running){ p.running=false; p.startedAt=null; }
    else startPomo();
    save(); update();
  }
  function resetPomo(){
    var p = state.pomodoro;
    p.running=false; p.startedAt=null; p.remaining = pomodoroPhaseDuration(p,p.phase);
    save(); update();
  }
  function skipPomo(){
    state.pomodoro = pomodoroAdvance(state.pomodoro);
    state.pomodoro.remaining = pomodoroPhaseDuration(state.pomodoro, state.pomodoro.phase);
    state.pomodoro.running=false; state.pomodoro.startedAt=null;
    save(); update();
  }
  function onPomoEnd(){
    beep();
    var p = state.pomodoro;
    state.pomodoro = pomodoroAdvance(p);
    state.pomodoro.remaining = pomodoroPhaseDuration(state.pomodoro, state.pomodoro.phase);
    if(state.pomodoro.auto) startPomo();
    save();
  }

  // ---------- 倒计时 ----------
  function addTimerFromForm(){
    var name = $('#timerName').value.trim() || '计时器';
    var dur = parseDur($('#timerDur').value);
    if(dur<=0){ toast('请输入有效时长'); return; }
    state = addTimer(state, name, dur);
    $('#timerName').value=''; $('#timerDur').value='';
    buildTimerList(); save(); update();
  }
  function toggleTimer(id){
    var now = Date.now();
    var t = state.timers.filter(function(x){ return x.id===id; })[0]; if(!t) return;
    state.timers = state.timers.map(function(x){ return x.id===id ? (x.running?pauseTimer(x,now):startTimer(x,now)) : x; });
    save(); update();
  }
  function doResetTimer(id){
    state.timers = state.timers.map(function(x){ return x.id===id?resetTimer(x):x; });
    save(); update();
  }
  function delTimer(id){
    state = removeTimer(state, id); buildTimerList(); save(); update();
  }
  function buildTimerList(){
    var box = $('#timerList'); if(!box) return;
    if(!state.timers.length){ box.innerHTML='<div class="empty">还没有倒计时，添加一个吧。</div>'; return; }
    box.innerHTML = state.timers.map(function(t){
      return '<div class="titem" id="titem-'+t.id+'">' +
        '<button class="btn danger" data-act="timer-del" data-id="'+t.id+'" title="删除">✕</button>' +
        '<span class="tname">'+escapeHtml(t.name)+'</span>' +
        '<span class="tbar"><i id="tbar-'+t.id+'"></i></span>' +
        '<span class="trem mono" id="trem-'+t.id+'">'+fmtTime(t.remaining)+'</span>' +
        '<button class="btn" data-act="timer-toggle" data-id="'+t.id+'">'+(t.running?'暂停':'开始')+'</button>' +
        '<button class="btn ghost" data-act="timer-reset" data-id="'+t.id+'">重置</button>' +
      '</div>';
    }).join('');
  }

  // ---------- 秒表 ----------
  function toggleStop(){
    var s = state.stopwatch;
    if(s.running){ s.running=false; s.startedAt=null; }
    else { s.running=true; s.startedAt=Date.now(); }
    save(); update();
  }
  function lapStop(){
    var s = state.stopwatch;
    var now = Date.now();
    if(s.running) s.elapsed += (now - s.startedAt);
    s.startedAt = now;
    s.laps = s.laps.concat([s.elapsed]);
    save(); renderLaps();
  }
  function resetStop(){
    state.stopwatch = { running:false, elapsed:0, startedAt:null, laps:[] };
    save(); renderLaps(); update();
  }
  function renderLaps(){
    var box = $('#lapList'); if(!box) return;
    var laps = state.stopwatch.laps;
    if(!laps.length){ box.innerHTML='<div class="empty">还没有计圈。</div>'; return; }
    box.innerHTML = laps.map(function(ms,i){
      return '<div class="lap"><span class="ln">第 '+(i+1)+' 圈</span><span class="mono">'+fmtStop(ms)+'</span></div>';
    }).join('');
  }
  function fmtStop(ms){
    ms = Math.max(0, ms||0);
    var cs = Math.floor(ms/10)%100, s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000)%60, h=Math.floor(ms/3600000);
    return (h>0?h+':':'') + pad2(m)+':'+pad2(s)+'.'+pad2(cs);
  }

  // ---------- 世界时钟 ----------
  function addCityFromForm(){
    var name = $('#cityName').value.trim();
    var tz = $('#cityTz').value.trim();
    if(!name||!tz){ toast('请填写城市名与时区'); return; }
    state = addCity(state, name, tz);
    $('#cityName').value=''; $('#cityTz').value='';
    buildCityList(); save(); update();
  }
  function delCity(id){
    state = removeCity(state, id); buildCityList(); save(); update();
  }
  function buildCityList(){
    var box = $('#cityList'); if(!box) return;
    if(!state.cities.length){ box.innerHTML='<div class="empty">还没有城市，添加一个吧。</div>'; return; }
    box.innerHTML = state.cities.map(function(c){
      return '<div class="city" id="city-'+c.id+'">' +
        '<button class="btn danger" data-act="city-del" data-id="'+c.id+'" title="删除">✕</button>' +
        '<span class="cname">'+escapeHtml(c.name)+'</span>' +
        '<span class="ctime mono" id="ctime-'+c.id+'">--:--:--</span>' +
        '<span class="coff" id="coff-'+c.id+'"></span>' +
      '</div>';
    }).join('');
  }

  // ---------- 提示音 ----------
  function beep(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ac = new Ctx();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(0.001, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.2, ac.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.4);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime+0.42);
      setTimeout(function(){ try{ ac.close(); }catch(e){} }, 600);
    }catch(e){}
  }

  // ---------- 主循环 ----------
  function tick(){
    var now = Date.now();
    // 番茄钟
    var p = state.pomodoro;
    if(p.running && p.startedAt){
      var rem = p.remaining - (now - p.startedAt)/1000;
      if(rem<=0){ p.running=false; p.startedAt=null; p.remaining=0; onPomoEnd(); }
      else p.remaining = rem;
    }
    // 倒计时
    var changed=false;
    state.timers.forEach(function(t){
      if(t.running && t.startedAt){
        var r = t.total - (now - t.startedAt)/1000;
        if(r<=0){ t.running=false; t.startedAt=null; t.remaining=0; beep(); changed=true; }
        else t.remaining = r;
      }
    });
    // 秒表
    var s = state.stopwatch;
    if(s.running && s.startedAt){ s.elapsed += (now - s.startedAt); s.startedAt = now; }
    if(changed) save();
    update();
  }

  function update(){
    var now = Date.now();
    // 番茄钟
    var p = state.pomodoro;
    var dur = pomodoroPhaseDuration(p, p.phase);
    var fg = $('#ringFg');
    if(fg){
      var prog = dur>0 ? Math.max(0,Math.min(1, p.remaining/dur)) : 0;
      fg.style.strokeDashoffset = (C*(1-prog)).toFixed(2);
    }
    var pt = $('#pomoTime'); if(pt) pt.textContent = fmtTime(p.remaining);
    var pp = $('#pomoPhase'); if(pp) pp.textContent = tr(p.phase==='work'?'专注':(p.phase==='long'?'长休息':'短休息'));
    var ptg = $('#pomoToggle'); if(ptg) ptg.textContent = p.running?'暂停':'开始';
    var pd = $('#pomoDone'); if(pd) pd.innerHTML = '今日完成 <b>'+ (p.todayCount||0) +'</b> 个专注 · 累计 '+(p.completed||0);
    // 倒计时行
    state.timers.forEach(function(t){
      var rem = $('#trem-'+t.id), bar = $('#tbar-'+t.id), item=$('#titem-'+t.id);
      if(rem) rem.textContent = fmtTime(remainingFor(t, now));
      if(bar) bar.style.width = (t.total>0?Math.max(0,Math.min(100, remainingFor(t,now)/t.total*100)):0)+'%';
      if(item){ item.classList.toggle('done', remainingFor(t,now)<=0); }
      var tbtn = $('[data-act="timer-toggle"][data-id="'+t.id+'"]');
      if(tbtn) tbtn.textContent = t.running ? '暂停' : '开始';
    });
    // 秒表
    var st = $('#stopTime'); if(st) st.textContent = fmtStop(state.stopwatch.elapsed);
    var stg = $('#stopToggle'); if(stg) stg.textContent = state.stopwatch.running?'暂停':'开始';
    // 世界时钟
    state.cities.forEach(function(c){
      var ct = $('#ctime-'+c.id), co = $('#coff-'+c.id);
      if(ct) ct.textContent = fmtZone(c.tz, now);
      if(co) co.textContent = zoneOffset(c.tz, now);
    });
  }

  function init(){
    initTheme();
    buildUI();
    renderLaps();
    setInterval(tick, 200);
  }
  if(document.readyState!=='loading') init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>

      });
      var n;
      while(n = w.nextNode()){ n.__zh = n.nodeValue; n.nodeValue = d[n.nodeValue.trim()]; }
      var els = root.querySelectorAll('[data-i18n-html]');
      for(var ei=0; ei<els.length; ei++){ var el=els[ei]; if(el.__zhtml===undefined){ el.__zhtml = el.innerHTML; } el.innerHTML = el.getAttribute('data-i18n-html'); }
    } else {
      var w2 = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function(n){ return (n.__zh!==undefined) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
      });
      var m;
      while(m = w2.nextNode()){ m.nodeValue = m.__zh; m.__zh = undefined; }
      var els2 = root.querySelectorAll('[data-i18n-html]');
      for(var ej=0; ej<els2.length; ej++){ var el2=els2[ej]; if(el2.__zhtml!==undefined){ el2.innerHTML = el2.__zhtml; el2.__zhtml = undefined; } }
    }
    root.setAttribute('lang', lang==='en'?'en':'zh-CN');
    root.setAttribute('data-lang', lang);
    try{ localStorage.setItem('nano-lang', lang); }catch(e){}
  }
  function toggle(){
    applyLang(current==='en' ? 'zh' : 'en');
    var b = document.getElementById('nano-lang-btn');
    if(b) b.textContent = (current==='en'?'中':'EN');
  }
  function mountBtn(){
    if(document.getElementById('nano-bar')) return;
    var bar = document.createElement('div');
    bar.id = 'nano-bar';
    bar.setAttribute('style','position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;align-items:center;gap:8px;font:600 13px system-ui,-apple-system,sans-serif');
    var brand = document.createElement('a');
    brand.id = 'nano-brand';
    brand.href = 'https://wangzifan396-wzf.github.io/WB/';
    brand.target = '_blank';
    brand.rel = 'noopener';
    brand.textContent = 'nano·tools';
    brand.title = 'nano-tools · 全部工具';
    brand.setAttribute('style','text-decoration:none;padding:0 13px;height:42px;border-radius:11px;border:1px solid var(--border,#222);background:var(--surface,#16181b);color:var(--text,#e6e6e6);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .12s ease,border-color .12s ease,color .12s ease');
    brand.onmouseenter = function(){ brand.style.transform='translateY(-2px)'; brand.style.borderColor='var(--accent,#5E6AD2)'; brand.style.color='var(--accent,#5E6AD2)'; };
    brand.onmouseleave = function(){ brand.style.transform='none'; brand.style.color='var(--text,#e6e6e6)'; };
    var b = document.createElement('button');
    b.id = 'nano-lang-btn';
    b.title = 'Switch language / 切换语言';
    b.textContent = 'EN';
    b.setAttribute('style','width:42px;height:42px;border-radius:11px;border:1px solid var(--border,#222);background:var(--surface,#16181b);color:var(--text,#fff);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4);display:grid;place-items:center;transition:transform .12s ease,border-color .12s ease');
    b.onmouseenter = function(){ b.style.transform='translateY(-2px)'; b.style.borderColor='var(--accent,#5E6AD2)'; };
    b.onmouseleave = function(){ b.style.transform='none'; };
    b.onclick = toggle;
    bar.appendChild(brand);
    bar.appendChild(b);
    document.body.appendChild(bar);
  }
  function init(){
    var saved; try{ saved = localStorage.getItem('nano-lang'); }catch(e){}
    if(!saved){ saved = ((navigator.language||'zh').slice(0,2).toLowerCase()==='en') ? 'en' : 'zh'; }
    applyLang(saved);
    mountBtn();
    var b = document.getElementById('nano-lang-btn');
    if(b) b.textContent = (saved==='en'?'中':'EN');
    [200,600,1200].forEach(function(ms){ setTimeout(function(){ applyLang(current); if(b) b.textContent=(current==='en'?'中':'EN'); }, ms); });
  }
  if(document.readyState!=='loading') init();
  else document.addEventListener('DOMContentLoaded',init);
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
