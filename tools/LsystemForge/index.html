<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">

<meta property="og:title" content="LsystemForge">
<meta property="og:description" content="L 系统分形：内置 Koch / 龙曲线 /  Plants / Sierpinski，可调迭代次数生成 SVG。">
<meta property="og:image" content="./og.png">
<meta name="description" content="L 系统分形：内置 Koch / 龙曲线 /  Plants / Sierpinski，可调迭代次数生成 SVG。 · 单文件 · 零依赖 · 本地优先">

<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="app">
  <h1>LsystemForge</h1>
  <p class="sub">L 系统分形：内置 Koch / 龙曲线 /  Plants / Sierpinski，可调迭代次数生成 SVG。 · 单文件 · 零依赖 · 本地优先</p>

<label>预设</label>
<select id="preset">
  <option value="koch">Koch 曲线</option>
  <option value="dragon">龙曲线 Dragon</option>
  <option value="plant">分形植物 Plant</option>
  <option value="sierp">Sierpinski 箭头</option>
</select>
<label>迭代次数 <span id="itv">4</span></label>
<input id="iter" type="range" min="0" max="7" value="4">
<label>转角（度）</label>
<input id="ang" type="number" value="25" min="1" max="120">
<div class="row">
  <button id="run">生成</button>
  <button id="copy" class="ghost">复制 SVG</button>
</div>
<div class="err" id="err"></div>
<label>预览（<span id="segc">0</span> 段）</label>
<div class="canvas" id="cv"></div>
<script>
function lsParse(axiom, rules, iter){
  var s=axiom;
  for(var k=0;k<iter;k++){
    var n='';
    for(var i=0;i<s.length;i++){ var c=s[i]; n += (rules[c]!==undefined)? rules[c] : c; }
    s=n;
  }
  return s;
}
function lsTurtle(cmds, angleDeg){
  var a=angleDeg*Math.PI/180, x=0, y=0, dir=-Math.PI/2, stack=[], segs=[];
  for(var i=0;i<cmds.length;i++){
    var c=cmds[i];
    if(c==='F'||c==='G'){ var nx=x+Math.cos(dir), ny=y+Math.sin(dir); segs.push([x,y,nx,ny]); x=nx; y=ny; }
    else if(c==='f'){ x+=Math.cos(dir); y+=Math.sin(dir); }
    else if(c==='+'){ dir+=a; }
    else if(c==='-'){ dir-=a; }
    else if(c==='['){ stack.push([x,y,dir]); }
    else if(c===']'){ var st=stack.pop(); x=st[0]; y=st[1]; dir=st[2]; }
  }
  return segs;
}
function lsBounds(segs){
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(var i=0;i<segs.length;i++){ var s=segs[i];
    minX=Math.min(minX,s[0],s[2]); maxX=Math.max(maxX,s[0],s[2]);
    minY=Math.min(minY,s[1],s[3]); maxY=Math.max(maxY,s[1],s[3]); }
  return {minX:minX,minY:minY,maxX:maxX,maxY:maxY};
}
function lsSvg(segs, W, H){
  if(!segs.length) return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"></svg>';
  var b=lsBounds(segs), w=b.maxX-b.minX||1, h=b.maxY-b.minY||1;
  var sc=Math.min(W/w, H/h)*0.92, ox=(W-w*sc)/2 - b.minX*sc, oy=(H-h*sc)/2 - b.minY*sc;
  var d='';
  for(var i=0;i<segs.length;i++){ var s=segs[i];
    d+='M'+(s[0]*sc+ox).toFixed(1)+' '+(s[1]*sc+oy).toFixed(1)+'L'+(s[2]*sc+ox).toFixed(1)+' '+(s[3]*sc+oy).toFixed(1); }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'
    +'<rect width="'+W+'" height="'+H+'" fill="#0A0A0B"/>'
    +'<path d="'+d+'" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-linecap="round"/></svg>';
}
var LS_PRESETS = {
  koch:{axiom:'F', rules:{F:'F+F-F-F+F'}, angle:90, base:60},
  dragon:{axiom:'FX', rules:{X:'X+YF+',Y:'-FX-Y'}, angle:90, base:90},
  plant:{axiom:'X', rules:{X:'F+[[X]-X]-F[-FX]+X',F:'FF'}, angle:25, base:25},
  sier:{axiom:'A', rules:{A:'B-A-B',B:'A+B+A'}, angle:60, base:60}
};
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { lsParse:lsParse, lsTurtle:lsTurtle, lsBounds:lsBounds, lsSvg:lsSvg, LS_PRESETS:LS_PRESETS };
}
if (typeof window !== 'undefined') {
  window.LsystemForgePure = { lsParse:lsParse, lsTurtle:lsTurtle, lsBounds:lsBounds, lsSvg:lsSvg, LS_PRESETS:LS_PRESETS };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.LsystemForgePure;
    function build(){
      var pr=$('preset').value, p=P.LS_PRESETS[pr];
      var ang=Number($('ang').value)||p.base;
      var iter=Number($('iter').value);
      var cmds=P.lsParse(p.axiom, p.rules, iter);
      var segs=P.lsTurtle(cmds, ang);
      $('cv').innerHTML = P.lsSvg(segs, 640, 420);
      $('segc').textContent = segs.length;
    }
    $('iter').addEventListener('input', function(){ $('itv').textContent=this.value; build(); });
    $('preset').addEventListener('change', function(){ var p=P.LS_PRESETS[this.value]; $('ang').value=p.base; build(); });
    $('ang').addEventListener('input', build);
    $('run').addEventListener('click', build);
    $('copy').addEventListener('click', function(){
      var svg=$('cv').querySelector('svg'); if(svg) navigator.clipboard && navigator.clipboard.writeText(svg.outerHTML);
    });
    build();
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>

</div>

</script>
