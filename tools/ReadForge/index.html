body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}

     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}

<body>
<div class="app">
  <h1>ReadForge</h1>
  <p class="sub">文本可读性评分：Flesch Reading Ease 与 Flesch-Kincaid 年级，写作质量 · 单文件 · 零依赖 · 本地优先</p>

<label for="rtext">英文文本</label>
<textarea id="rtext" rows="5">The cat sat on the mat. We like to read simple books.</textarea>
<div class="row">
  <button id="calc">评分</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">粘贴英文文本后评分</div>
<script>
function countSyllables(word){
  word=word.toLowerCase().replace(/[^a-z]/g,'');
  if(word.length===0) return 0;
  if(word.length<=3) return 1;
  word=word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'');
  word=word.replace(/^y/,'');
  var m=word.match(/[aeiouy]+/g);
  return m?m.length:1;
}
function countWords(text){ var m=text.trim().match(/\S+/g); return m?m.length:0; }
function countSentences(text){ var n=(text.match(/[.!?]+/g)||[]).length; return n>0?n:1; }
function fleschReadingEase(text){
  var w=countWords(text), s=countSentences(text), syl=0;
  (text.match(/\S+/g)||[]).forEach(function(x){ syl+=countSyllables(x); });
  if(w===0) return {error:'empty', score:0};
  var score=206.835 - 1.015*(w/s) - 84.6*(syl/w);
  return {words:w, sentences:s, syllables:syl, score:Math.round(score*10)/10, error:null};
}
function fleschKincaidGrade(text){
  var w=countWords(text), s=countSentences(text), syl=0;
  (text.match(/\S+/g)||[]).forEach(function(x){ syl+=countSyllables(x); });
  if(w===0) return {error:'empty'};
  var grade=0.39*(w/s)+11.8*(syl/w)-15.59;
  return {grade:Math.round(grade*10)/10, words:w, sentences:s, syllables:syl, error:null};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { countSyllables:countSyllables, countWords:countWords, countSentences:countSentences,
    fleschReadingEase:fleschReadingEase, fleschKincaidGrade:fleschKincaidGrade };
}
if (typeof window !== 'undefined') {
  window.ReadForgePure = { countSyllables:countSyllables, countWords:countWords, countSentences:countSentences,
    fleschReadingEase:fleschReadingEase, fleschKincaidGrade:fleschKincaidGrade };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.ReadForgePure;
    $('calc').addEventListener('click', function(){
      var e=P.fleschReadingEase($('rtext').value);
      var g=P.fleschKincaidGrade($('rtext').value);
      if(e.error){ $('out').textContent='错误：'+e.error; return; }
      $('out').textContent='Flesch Reading Ease: '+e.score+'\nFlesch-Kincaid Grade: '+g.grade+
        '\n词数 '+e.words+' · 句数 '+e.sentences+' · 音节 '+e.syllables;
    });
    $('clear').addEventListener('click', function(){ $('out').textContent='\u7c98\u8d34\u82f1\u6587\u6587\u672c\u540e\u8bc4\u5206'; });
  })();
}
</script>
