<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAForge — 离线 User-Agent 解析器：浏览器 / 系统 / 设备</title>
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:90px}
.preview svg{max-width:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.big{font:40px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线 User-Agent 解析器：浏览器 / 内核 / 系统 / 设备类型识别，含爬虫检测。">
</head>
<body>
<div class="app">
  <h1>UAForge</h1>
  <p class="sub">离线 User-Agent 解析器：浏览器 / 系统 / 设备 · 单文件 · 零依赖 · 本地优先</p>

<label for="in">User-Agent 字符串</label>
<textarea id="in" rows="4" placeholder="粘贴 UA，或点「用我的 UA」">Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36</textarea>
<div class="row">
  <button id="run">解析</button>
  <button id="mine" class="ghost">用我的 UA</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>解析结果</label>
<div class="out" id="out" aria-live="polite">结果会显示在这里</div>
<script>
function parseUA(ua){
  ua=String(ua||'').trim();
  if(!ua) throw new Error('UA 不能为空');
  var r={browser:'未知',browserVersion:'',engine:'未知',os:'未知',osVersion:'',device:'桌面',bot:false};
  var m;
  if(/bot|crawler|spider|slurp|bingpreview|facebookexternalhit/i.test(ua)){ r.bot=true; r.device='爬虫'; }
  if((m=ua.match(/Windows NT ([\d.]+)/))){ r.os='Windows'; var NT={'10.0':'10/11','6.3':'8.1','6.2':'8','6.1':'7'}; r.osVersion=NT[m[1]]||('NT '+m[1]); }
  else if((m=ua.match(/iPhone OS ([\d_]+)/))){ r.os='iOS'; r.osVersion=m[1].replace(/_/g,'.'); r.device='手机'; }
  else if((m=ua.match(/iPad; CPU OS ([\d_]+)/))){ r.os='iPadOS'; r.osVersion=m[1].replace(/_/g,'.'); r.device='平板'; }
  else if((m=ua.match(/Mac OS X ([\d_.]+)/))){ r.os='macOS'; r.osVersion=m[1].replace(/_/g,'.'); }
  else if((m=ua.match(/Android ([\d.]+)/))){ r.os='Android'; r.osVersion=m[1]; r.device=/Mobile/.test(ua)?'手机':'平板'; }
  else if(/CrOS/.test(ua)){ r.os='ChromeOS'; }
  else if(/Linux/.test(ua)){ r.os='Linux'; }
  if((m=ua.match(/Edg(?:e|A|iOS)?\/([\d.]+)/))){ r.browser='Edge'; r.browserVersion=m[1]; r.engine='Blink'; }
  else if((m=ua.match(/OPR\/([\d.]+)/))){ r.browser='Opera'; r.browserVersion=m[1]; r.engine='Blink'; }
  else if((m=ua.match(/SamsungBrowser\/([\d.]+)/))){ r.browser='Samsung Internet'; r.browserVersion=m[1]; r.engine='Blink'; }
  else if((m=ua.match(/MicroMessenger\/([\d.]+)/))){ r.browser='微信内置浏览器'; r.browserVersion=m[1]; r.engine='Blink'; }
  else if((m=ua.match(/UCBrowser\/([\d.]+)/))){ r.browser='UC 浏览器'; r.browserVersion=m[1]; r.engine='Blink'; }
  else if((m=ua.match(/Firefox\/([\d.]+)/))){ r.browser='Firefox'; r.browserVersion=m[1]; r.engine='Gecko'; }
  else if((m=ua.match(/CriOS\/([\d.]+)/))){ r.browser='Chrome (iOS)'; r.browserVersion=m[1]; r.engine='WebKit'; }
  else if((m=ua.match(/FxiOS\/([\d.]+)/))){ r.browser='Firefox (iOS)'; r.browserVersion=m[1]; r.engine='WebKit'; }
  else if((m=ua.match(/Chrome\/([\d.]+)/))){ r.browser='Chrome'; r.browserVersion=m[1]; r.engine='Blink'; }
  else if((m=ua.match(/Version\/([\d.]+).*Safari/))){ r.browser='Safari'; r.browserVersion=m[1]; r.engine='WebKit'; }
  else if(/Safari/.test(ua)){ r.browser='Safari'; r.engine='WebKit'; }
  else if((m=ua.match(/MSIE ([\d.]+)/))||/Trident/.test(ua)){ r.browser='IE'; r.browserVersion=m?m[1]:'11'; r.engine='Trident'; }
  if(r.engine==='未知'){
    if(/AppleWebKit/.test(ua)) r.engine='WebKit';
    else if(/Gecko\//.test(ua)) r.engine='Gecko';
  }
  return r;
}
function formatUA(r){
  var L=[];
  L.push('浏览器: '+r.browser+(r.browserVersion?' '+r.browserVersion:''));
  L.push('内核: '+r.engine);
  L.push('系统: '+r.os+(r.osVersion?' '+r.osVersion:''));
  L.push('设备类型: '+r.device);
  if(r.bot) L.push('识别为爬虫 / 机器人');
  return L.join('\n');
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parseUA:parseUA, formatUA:formatUA };
}
if (typeof window !== 'undefined') {
  window.UAForgePure = { parseUA:parseUA, formatUA:formatUA };
}
</script>
<script>
if (typeof window !== 'undefined' && window.document) {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.UAForgePure;
    function run(){
      $('err').textContent='';
      try { var r=P.parseUA($('in').value); $('out').textContent=P.formatUA(r); }
      catch(e){ $('err').textContent=e.message; $('out').textContent='结果会显示在这里'; }
    }
    $('run').addEventListener('click', run);
    $('in').addEventListener('input', run);
    $('mine').addEventListener('click', function(){ $('in').value=navigator.userAgent; run(); });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('out').textContent='结果会显示在这里'; });
    run();
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
