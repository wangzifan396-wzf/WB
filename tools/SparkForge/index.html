<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:140px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
svg.out{background:var(--bg)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
.flag-ok{color:var(--ok)} .flag-bad{color:var(--warn)} .flag-info{color:var(--info)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
#nanoToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#1A1B1E;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:9px 16px;font-size:13px;line-height:1.4;letter-spacing:.01em;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;max-width:80vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#nanoToast.bad{border-color:rgba(239,68,68,.55)}
@media (prefers-reduced-motion:reduce){#nanoToast{transition:none}}

<body>
<div class="app">
  <h1>SparkForge</h1>
  <p class="sub">数据序列一键生成 SVG 迷你折线图与柱状图 · 单文件 · 零依赖 · 本地优先</p>

<label for="sdata">数据序列（逗号、空格或换行分隔的数字）</label>
<textarea id="sdata" rows="3">5, 8, 3, 12, 7, 15, 9, 20, 11</textarea>
<div class="opt">
  <label>宽 <input type="number" id="sw" value="240" min="80" max="800" style="width:70px"></label>
  <label>高 <input type="number" id="sh" value="80" min="40" max="400" style="width:70px"></label>
  <label><input type="checkbox" id="sfill" checked> 面积填充</label>
  <label><input type="checkbox" id="sdot" checked> 末点圆点</label>
</div>
<div class="row">
  <button id="gen">生成迷你图</button>
  <button id="copy" class="ghost">复制 SVG</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>预览</label>
<div class="out" id="out" aria-live="polite">点击「生成迷你图」</div>
<script>
function sparkParse(s){
  if(typeof s!=='string') return [];
  return s.split(/[\s,;]+/).map(function(x){ return parseFloat(x); }).filter(function(x){ return !isNaN(x); });
}
function sparkLine(values, opts){
  opts=opts||{};
  values=values.map(Number);
  if(values.length===0) return {error:'empty', svg:''};
  var w=opts.width||240, h=opts.height||80, pad=opts.pad||4;
  var fill=opts.fill!==false, dot=opts.dot!==false;
  var stroke=opts.stroke||'#22D3EE', fillc=opts.fillColor||'rgba(34,211,238,0.18)';
  var min=Math.min.apply(null,values), max=Math.max.apply(null,values);
  if(min===max){ min-=1; max+=1; }
  var n=values.length;
  var innerW=w-pad*2, innerH=h-pad*2;
  var pts=[];
  for(var i=0;i<n;i++){
    var x = pad + (n===1?innerW/2:(innerW*i/(n-1)));
    var y = pad + innerH*(1-(values[i]-min)/(max-min));
    pts.push([x,y]);
  }
  var poly=pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
  var body='<polyline fill="none" stroke="'+stroke+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+poly+'"/>';
  if(fill){
    var areaPoly=poly+' '+pts[n-1][0].toFixed(1)+','+(h-pad).toFixed(1)+' '+pts[0][0].toFixed(1)+','+(h-pad).toFixed(1);
    body='<polygon fill="'+fillc+'" points="'+areaPoly+'"/>'+body;
  }
  if(dot){
    var last=pts[n-1];
    body+='<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3" fill="'+stroke+'"/>';
  }
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
          '<rect width="'+w+'" height="'+h+'" fill="#0A0A0B"/>'+body+'</svg>';
  return {svg:svg, points:pts, min:min, max:max, error:null};
}
function sparkBars(values, opts){
  opts=opts||{};
  values=values.map(Number);
  if(values.length===0) return {error:'empty', svg:''};
  var w=opts.width||240, h=opts.height||80, pad=opts.pad||4;
  var color=opts.color||'#5E6AD2';
  var min=Math.min.apply(null,values), max=Math.max.apply(null,values);
  if(min===max){ min=0; }
  var n=values.length;
  var innerW=w-pad*2, innerH=h-pad*2;
  var bw=innerW/n;
  var bars='';
  for(var i=0;i<n;i++){
    var vh=max===min?innerH:(innerH*(values[i]-min)/(max-min));
    if(vh<1) vh=1;
    var x=pad+bw*i, y=pad+innerH-vh;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.7).toFixed(1)+'" height="'+vh.toFixed(1)+'" rx="1" fill="'+color+'"/>';
  }
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
          '<rect width="'+w+'" height="'+h+'" fill="#0A0A0B"/>'+bars+'</svg>';
  return {svg:svg, min:min, max:max, error:null};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { line:sparkLine, bars:sparkBars, parse:sparkParse };
}
if (typeof window !== 'undefined') {
  window.SparkForgePure = { line:sparkLine, bars:sparkBars, parse:sparkParse };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.SparkForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function gen(){
      $('err').textContent='';
      try {
        var vals=P.parse($('sdata').value);
        if(vals.length===0){ $('err').textContent='请输入至少一个数字'; return; }
        var r=P.line(vals,{width:Number($('sw').value),height:Number($('sh').value),fill:$('sfill').checked,dot:$('sdot').checked});
        $('out').innerHTML=r.svg;
      } catch(e){ $('err').textContent=e.message; }
    }
    $('gen').addEventListener('click', gen);
    $('copy').addEventListener('click', function(){ copyText($('out').innerHTML); });
    $('clear').addEventListener('click', function(){ $('out').textContent='\u70b9\u51fb\u300c\u751f\u6210\u8ff7\u4f60\u56fe\u300d'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}

<!-- nano-polish:toast -->
<div id="nanoToast" role="status" aria-live="polite"></div>
<script data-nano-polish>
(function(){var el=document.getElementById('nanoToast');if(!el)return;var t;
function zh(){try{var l=localStorage.getItem('nano-lang')||document.documentElement.lang||'zh';return String(l).indexOf('en')!==0;}catch(e){return true;}}
function show(m,bad){el.textContent=m;el.className='on'+(bad?' bad':'');clearTimeout(t);t=setTimeout(function(){el.className='';},1700);}
window.nanoToast=show;
try{var nc=navigator.clipboard;if(nc&&nc.writeText){var ow=nc.writeText.bind(nc);nc.writeText=function(s){return ow(s).then(function(r){show(zh()?'已复制':'Copied');return r;},function(e){show(zh()?'复制失败':'Copy failed',1);throw e;});};}}catch(e){}
try{if(document.execCommand){var oe=document.execCommand.bind(document);document.execCommand=function(c){var r=oe.apply(null,arguments);if(String(c).toLowerCase()==='copy'){show(r?(zh()?'已复制':'Copied'):(zh()?'复制失败':'Copy failed'),!r);}return r;};}}catch(e){}
})();
</script>
