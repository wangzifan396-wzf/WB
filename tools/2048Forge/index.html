<canvas id="cv" width="400" height="400" style="width:100%;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;"></canvas>
<script>
function g2Rng(seed){ var s=seed>>>0; return function(){ s=(s+0x6D2B79F5)|0; var t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function g2Empty(board){ var e=[]; for(var i=0;i<16;i++) if(board[i]===0) e.push(i); return e; }
function g2Spawn(board, rng){ var e=g2Empty(board); if(!e.length) return board; var idx=e[Math.floor(rng()*e.length)]; board[idx]= rng()<0.9?2:4; return board; }
function g2Init(seed){ var board=new Array(16).fill(0); var rng=g2Rng(seed); g2Spawn(board,rng); g2Spawn(board,rng); return board; }
function g2Move(board, dir){ var b=board.slice(); var moved=false; var score=0;
  function slide(arr){ var out=arr.filter(function(v){return v;}); for(var i=0;i<out.length-1;i++){ if(out[i]===out[i+1]){ out[i]*=2; score+=out[i]; out.splice(i+1,1); } } while(out.length<4) out.push(0); return out; }
  for(var i=0;i<4;i++){ var line=[]; for(var j=0;j<4;j++){ var idx; if(dir===3) idx=i*4+j; else if(dir===0) idx=j*4+i; else if(dir===1) idx=i*4+(3-j); else idx=(3-j)*4+i; line.push(b[idx]); } var slid=slide(line); for(var j=0;j<4;j++){ var idx2; if(dir===3) idx2=i*4+j; else if(dir===0) idx2=j*4+i; else if(dir===1) idx2=i*4+(3-j); else idx2=(3-j)*4+i; if(b[idx2]!==slid[j]) moved=true; b[idx2]=slid[j]; } }
  return {board:b, score:score, moved:moved};
}
function g2Over(board){ if(g2Empty(board).length) return false; for(var i=0;i<16;i++){ var r=(i/4)|0,c=i%4; if(c<3&&board[i]===board[i+1]) return false; if(r<3&&board[i]===board[i+4]) return false; } return true; }
function g2Won(board){ return board.indexOf(2048)>=0; }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { g2Init:g2Init, g2Move:g2Move, g2Spawn:g2Spawn, g2Over:g2Over, g2Won:g2Won, g2Rng:g2Rng };
}
if (typeof window !== 'undefined') {
  window.G2048ForgePure = { g2Init:g2Init, g2Move:g2Move, g2Spawn:g2Spawn, g2Over:g2Over, g2Won:g2Won, g2Rng:g2Rng };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.G2048ForgePure;
    var board=null, score=0, rng=null, seed=12345;
    var COL={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
    function restart(){ seed=(Date.now()&0xffff)+1; rng=P.g2Rng(seed); board=P.g2Init(seed); score=0; render(); }
    function render(){
      var cv=$('cv'); var ctx=cv.getContext('2d'); if(!ctx) return; var W=cv.width,H=cv.height,s=W/4;
      ctx.fillStyle='#0A0A0B'; ctx.fillRect(0,0,W,H);
      for(var i=0;i<16;i++){ var r=(i/4)|0,c=i%4,v=board[i],px=c*s,py=r*s; ctx.fillStyle=v?'#141417':'#1A1B1E'; ctx.fillRect(px+4,py+4,s-8,s-8); if(v){ ctx.fillStyle=COL[v]||'#3c3a32'; ctx.fillRect(px+4,py+4,s-8,s-8); ctx.fillStyle='#0A0A0B'; ctx.font='bold '+Math.floor(s*0.34)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(v, px+s/2, py+s/2); } }
      $('score').textContent='分数: '+score;
      if(P.g2Won(board)) $('status').textContent='你赢了！按重新开始';
      else if(P.g2Over(board)) $('status').textContent='游戏结束';
      else $('status').textContent='方向键移动';
    }
    function move(dir){ if(!board||P.g2Over(board)) return; var res=P.g2Move(board,dir); if(res.moved){ board=res.board; score+=res.score; rng=P.g2Rng((seed*31+score)&0xffff); P.g2Spawn(board,rng); render(); } }
    $('restart').addEventListener('click', restart);
    window.addEventListener('keydown', function(e){ var d={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key]; if(d!==undefined){ e.preventDefault(); move(d); } });
    restart();
  })();
}
