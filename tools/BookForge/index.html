<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookForge — 离线书签生成器：JS 一键转 javascript: 书签，可反向解析</title>
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:90px}
.preview svg{max-width:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.big{font:40px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线书签生成器：粘贴 JavaScript 一键生成可拖入书签栏的 javascript: 书签，支持反向解析与语法校验。">
</head>
<body>
<div class="app">
  <h1>BookForge</h1>
  <p class="sub">离线书签生成器：JS 一键转 javascript: 书签，可反向解析 · 单文件 · 零依赖 · 本地优先</p>

<style>
.bk{display:inline-block;margin-top:8px;padding:8px 14px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;font-size:13px}
.bk:active{transform:translateY(1px)}
.note{font-size:12px;color:var(--dim);margin-top:6px}
.cols{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1;min-width:240px}
</style>
<label for="code">JavaScript 代码（将转为书签）</label>
<textarea id="code" rows="7" placeholder="alert('Hello from bookmarklet!');"></textarea>
<div class="row">
  <button id="gen">生成书签</button>
  <button id="decode" class="ghost">反向解析 → 代码</button>
  <button id="copy" class="ghost">复制书签</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>书签 URL（把下方按钮拖到书签栏即可一键运行）</label>
<div class="out" id="out" aria-live="polite" style="word-break:break-all">生成后显示在这里</div>
<div id="bkwrap"></div>
<label>原始代码（反向解析结果）</label>
<div class="out" id="src" aria-live="polite">—</div>
<script>
function stripShebang(code){ return String(code).replace(/^#!.*(\r?\n)/,''); }
function wrapIife(code){ return '(function(){"use strict";\n'+code+'\n})();'; }
function toBookmarklet(code){
  var src=stripShebang(code);
  return 'javascript:'+encodeURIComponent(wrapIife(src));
}
function fromBookmarklet(url){
  url=String(url||'').trim();
  var pre='javascript:';
  if(url.indexOf(pre)===0) url=url.slice(pre.length);
  var dec;
  try{ dec=decodeURIComponent(url); }catch(e){ dec=url; }
  var m=dec.match(/^\(function\(\)\{"use strict";([\s\S]*)\}\)\(\);?$/);
  return m?m[1].replace(/^\s+|\s+$/g,'') : dec;
}
function validateJs(code){
  try{ new Function(stripShebang(code)); return {ok:true,error:''}; }
  catch(e){ return {ok:false,error:String((e&&e.message)||e)}; }
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports={ toBookmarklet:toBookmarklet, fromBookmarklet:fromBookmarklet, validateJs:validateJs, stripShebang:stripShebang };
}
if (typeof window !== 'undefined') {
  window.BookForgePure={ toBookmarklet:toBookmarklet, fromBookmarklet:fromBookmarklet, validateJs:validateJs, stripShebang:stripShebang };
}
</script>
<script>
if (typeof window !== 'undefined' && window.document) {
  (function(){
    var $=function(id){return document.getElementById(id);};
    var P=window.BookForgePure;
    function copyText(t){
      if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function gen(){
      var code=$('code').value; $('err').textContent='';
      var v=P.validateJs(code);
      if(!v.ok){ $('err').textContent='语法错误: '+v.error; return; }
      var url=P.toBookmarklet(code);
      $('out').textContent=url;
      $('bkwrap').innerHTML='<a class="bk" href="'+url.replace(/"/g,'%22')+'" title="拖到书签栏">📑 运行书��</a>';
    }
    function decode(){
      var url=$('code').value.trim();
      if(url.indexOf('javascript:')!==0){ $('err').textContent='请粘贴以 javascript: 开头的书签'; return; }
      $('src').textContent=P.fromBookmarklet(url);
    }
    $('gen').addEventListener('click',gen);
    $('decode').addEventListener('click',decode);
    $('copy').addEventListener('click',function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click',function(){ $('code').value=''; $('out').textContent='生成后显示在这里'; $('src').textContent='—'; $('bkwrap').innerHTML=''; $('err').textContent=''; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
