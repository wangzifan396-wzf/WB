<!DOCTYPE html>
<html lang="zh-CN">
<!-- MindForge · nano-tools · https://wangzifan396-wzf.github.io/mindforge/ -->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>MindForge · 本地优先思维导图</title>
<meta name="description" content="MindForge — 本地优先的思维导图 / 节点图编辑器：结构化节点树、自动布局、离线可用。" />
<meta name="theme-color" content="#5E6AD2" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="og.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#0A0A0B; --card:#141417; --card2:#1A1B1E;
    --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.14);
    --txt:#FFFFFF; --txt2:#A1A1AA; --txt3:#71717A;
    --acc:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE; --purple:#A78BFA;
    --shadow:0 8px 24px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;}
  button{font-family:inherit;}
  header{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.3px;}
  .brand .mark{width:24px;height:24px;border-radius:7px;background:var(--acc);display:flex;align-items:center;justify-content:center;}
  .brand small{color:var(--txt3);font-weight:500;}
  .spacer{flex:1;}
  .lang-btn{background:var(--card2);border:1px solid var(--line);color:var(--txt2);border-radius:8px;
    padding:6px 12px;cursor:pointer;font-size:13px;transition:border-color .15s,color .15s;}
  .lang-btn:hover{border-color:var(--line2);color:var(--txt);}

  .toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center;}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:7px 12px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;
    transition:transform .12s,background .12s,border-color .12s,opacity .12s;}
  .btn:hover{border-color:var(--line2);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.4;cursor:default;transform:none;}
  .btn.primary{background:var(--acc);border-color:var(--acc);}
  .btn.primary:hover{background:#6b76e0;}
  .btn .k{font-size:11px;color:var(--txt3);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:2px;}
  .btn.primary .k{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.25);}
  .sep{width:1px;height:22px;background:var(--line);margin:0 3px;}
  .search{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
    border-radius:8px;padding:5px 10px;}
  .search input{background:transparent;border:none;outline:none;color:var(--txt);font-size:13px;width:160px;}
  .search input::placeholder{color:var(--txt3);}

  .workspace{display:flex;height:calc(100% - 110px);min-height:0;}
  .viewport{position:relative;flex:1;min-width:0;overflow:hidden;cursor:grab;
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.045) 1px, transparent 0) 0 0 / 26px 26px,
      var(--bg);}
  .viewport.panning{cursor:grabbing;}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
  #edges{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px;pointer-events:none;}
  .node{position:absolute;max-width:260px;user-select:none;cursor:grab;}
  .node:active{cursor:grabbing;}
  .node-body{background:var(--card);border:1px solid var(--line2);border-left:3px solid var(--c,var(--acc));
    border-radius:10px;padding:9px 13px;box-shadow:var(--shadow);color:var(--txt);font-size:14px;line-height:1.4;
    transition:border-color .12s, box-shadow .12s, transform .12s;}
  .node:hover .node-body{border-color:rgba(255,255,255,0.26);}
  .node.selected .node-body{border-color:var(--c,var(--acc));box-shadow:0 0 0 2px color-mix(in srgb,var(--c,var(--acc)) 45%,transparent),var(--shadow);}
  .node.hit .node-body{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 40%,transparent),var(--shadow);}
  .node-text{display:block;white-space:pre-wrap;word-break:break-word;outline:none;}
  .node-text[contenteditable="true"]{cursor:text;background:rgba(0,0,0,0.25);border-radius:4px;}
  .collapse-dot{position:absolute;right:-11px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);
    color:var(--txt2);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    z-index:2;transition:background .12s,color .12s,border-color .12s;}
  .collapse-dot:hover{color:var(--txt);border-color:var(--acc);}
  .collapse-dot.collapsed{background:var(--acc);color:#fff;border-color:var(--acc);}

  .side{width:248px;border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;padding:14px;gap:16px;overflow:auto;}
  .side h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--txt3);font-weight:600;}
  .palette{display:flex;flex-wrap:wrap;gap:8px;}
  .swatch{width:26px;height:26px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s;}
  .swatch:hover{transform:scale(1.08);}
  .swatch.active{border-color:#fff;}
  .hint-list{font-size:12px;color:var(--txt2);line-height:1.9;}
  .hint-list kbd{background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;color:var(--txt);}
  .meta{font-size:12px;color:var(--txt3);line-height:1.7;}
  .meta b{color:var(--txt2);font-weight:600;}

  .brand-strip{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.4px;
    background:rgba(10,10,11,0.6);border:1px solid var(--line);border-radius:8px;padding:4px 10px;backdrop-filter:blur(4px);}
  .brand-strip span{color:var(--txt3);font-weight:500;}
  .hint-tip{position:absolute;left:14px;top:12px;font-size:12px;color:var(--txt3);background:rgba(10,10,11,0.55);
    border:1px solid var(--line);border-radius:8px;padding:4px 10px;}

  .minimap{position:absolute;left:14px;bottom:12px;width:190px;height:120px;background:rgba(20,20,23,0.82);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;backdrop-filter:blur(4px);}
  .minimap svg{width:100%;height:100%;display:block;}
  .mm-view{fill:rgba(94,106,210,0.18);stroke:var(--acc);stroke-width:1.5;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--card2);
    border:1px solid var(--line2);color:var(--txt);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;
    pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;box-shadow:var(--shadow);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .menu{position:relative;}
  .menu-pop{position:absolute;top:calc(100% + 6px);left:0;background:var(--card2);border:1px solid var(--line2);
    border-radius:10px;padding:6px;min-width:160px;box-shadow:var(--shadow);display:none;z-index:40;flex-direction:column;gap:2px;}
  .menu-pop.open{display:flex;}
  .menu-pop button{background:transparent;border:none;color:var(--txt);text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;}
  .menu-pop button:hover{background:var(--card);}
  input[type=file]{display:none;}

  @media (max-width:720px){ .side{display:none;} }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>

<body>
<h1 class="nt-sr-only">MindForge · 本地优先思维导图</h1>
  <header>
    <div class="brand">
      <span class="mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.2"/><circle cx="18" cy="18" r="2.2"/>
          <path d="M7.2 11 15.8 6.8M7.2 13 15.8 17.2"/>
        </svg>
      </span>
      <span>MindForge</span>
      <small id="subtitle">本地优先思维导图</small>
    </div>
    <div class="spacer"></div>
    <button class="lang-btn" id="langBtn" title="切换语言">EN</button>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="addChild" title="添加子节点 (Tab)"><span data-i18n="addChild">添加子节点</span><span class="k">Tab</span></button>
    <button class="btn" id="addSibling" title="添加同级 (Enter)"><span data-i18n="addSibling">添加同级</span><span class="k">↵</span></button>
    <button class="btn" id="delNode" title="删除 (Del)"><span data-i18n="del">删除</span><span class="k">Del</span></button>
    <span class="sep"></span>
    <button class="btn" id="collapseAll" data-i18n="collapseAll">折叠全部</button>
    <button class="btn" id="expandAll" data-i18n="expandAll">展开全部</button>
    <button class="btn" id="relayout" data-i18n="relayout">重新布局</button>
    <span class="sep"></span>
    <button class="btn" id="fit" title="适应屏幕 (F)"><span data-i18n="fit">适应屏幕</span><span class="k">F</span></button>
    <button class="btn" id="zoomIn">+</button>
    <button class="btn" id="zoomOut">−</button>
    <div class="spacer"></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--txt3)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="searchInput" type="text" data-i18n-ph="searchPh" placeholder="搜索节点…" / aria-label="搜索节点…">
    </div>
    <button class="btn" id="newMap" data-i18n="newMap">新建</button>
    <button class="btn" id="sample" data-i18n="sample">示例</button>

      <button class="btn" id="exportBtn" data-i18n="export">导出 ▾</button>
      <div class="menu-pop" id="exportPop">
        <button data-export="json" data-i18n="expJson">导出 JSON</button>
        <button data-export="png" data-i18n="expPng">导出 PNG</button>
        <button data-export="svg" data-i18n="expSvg">导出 SVG</button>
      </div>
    </div>
    <input type="file" id="fileInput" accept="application/json,.json" />
  </div>

  <div class="workspace">
    <div class="viewport" id="viewport">
      <div id="world">
        <svg id="edges"></svg>

      <div class="minimap" id="minimap"><svg id="mmSvg" viewBox="0 0 190 120" preserveAspectRatio="none"></svg></div>
      <div class="brand-strip">nano·tools <span>· MindForge</span></div>
    </div>
    <aside class="side">
      <div>
        <h4 data-i18n="branchColor">分支颜色</h4>

      </div>

        <h4 data-i18n="selected">当前节点</h4>

      </div>

        <h4 data-i18n="shortcuts">快捷键</h4>

  <div class="toast" id="toast"></div>

<script>
/* ============================================================
 *  PURE FUNCTIONS (testable, no DOM references)
 * ============================================================ */
function uid(nodes){
  let max = 0;
  (nodes || []).forEach(function(n){
    var m = /^n(\d+)$/.exec(String(n.id));
    if (m) max = Math.max(max, +m[1]);
  });
  return 'n' + (max + 1);
}
function makeNode(nodes, opts){
  opts = opts || {};
  return {
    id: opts.id != null ? String(opts.id) : uid(nodes),
    parentId: opts.parentId != null ? String(opts.parentId) : null,
    text: typeof opts.text === 'string' ? opts.text : '新节点',
    color: typeof opts.color === 'string' ? opts.color : null,
    collapsed: !!opts.collapsed,
    x: Number(opts.x) || 0,
    y: Number(opts.y) || 0,
    manual: !!opts.manual
  };
}
function addNode(nodes, opts){ return nodes.concat([makeNode(nodes, opts)]); }

function removeNode(nodes, id){
  var dead = {}, stack = [id], out = [];
  dead[id] = true;
  // mark all descendants
  var changed = true;
  while (changed) {
    changed = false;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.parentId != null && dead[n.parentId] && !dead[n.id]) { dead[n.id] = true; changed = true; }
    }
  }
  for (var j = 0; j < nodes.length; j++) if (!dead[nodes[j].id]) out.push(nodes[j]);
  return out;
}

function moveNode(nodes, id, x, y, parentId){
  return nodes.map(function(n){
    if (n.id !== id) return n;
    var o = {}; for (var k in n) o[k] = n[k];
    if (typeof x === 'number') { o.x = x; o.manual = true; }
    if (typeof y === 'number') { o.y = y; o.manual = true; }
    if (parentId !== undefined && parentId !== null && parentId !== id) {
      // guard against creating a cycle
      var p = parentId, ok = true;
      while (p != null) { if (p === id) { ok = false; break; } var pn = null; for (var i=0;i<nodes.length;i++) if (nodes[i].id===p){pn=nodes[i];break;} p = pn ? pn.parentId : null; }
      if (ok) o.parentId = String(parentId);
    }
    return o;
  });
}

function toggleCollapse(nodes, id){
  return nodes.map(function(n){ return n.id === id ? assign({}, n, { collapsed: !n.collapsed }) : n; });
}

function collectDescendants(nodes, id){
  var kids = {};
  nodes.forEach(function(n){ (kids[n.parentId] = kids[n.parentId] || []).push(n.id); });
  var out = [], stack = [id];
  while (stack.length) {
    var cur = stack.pop();
    (kids[cur] || []).forEach(function(c){ out.push(c); stack.push(c); });
  }
  return out;
}

function layout(nodes, opts){
  opts = opts || {};
  var dx = opts.dx || 250, dy = opts.dy || 86;
  var byId = {}, childrenOf = {};
  nodes.forEach(function(n){ byId[n.id] = n; });
  nodes.forEach(function(n){ (childrenOf[n.parentId] = childrenOf[n.parentId] || []).push(n); });
  function hidden(id){
    var p = byId[id] ? byId[id].parentId : null;
    while (p != null) { if (byId[p] && byId[p].collapsed) return true; p = byId[p] ? byId[p].parentId : null; }
    return false;
  }
  var pos = {}, cursor = 0;
  function place(n, depth, baseX){
    var kids = (childrenOf[n.id] || []).filter(function(k){ return !hidden(k.id); });
    var x = n.manual ? n.x : (baseX != null ? baseX : depth * dx);
    if (kids.length === 0) {
      pos[n.id] = { x: x, y: cursor }; cursor += dy;
    } else {
      var kidX = n.manual ? n.x + dx : x + dx;
      kids.forEach(function(k){ place(k, depth + 1, kidX); });
      if (n.manual) { pos[n.id] = { x: n.x, y: n.y }; }
      else {
        var ys = kids.map(function(k){ return pos[k.id].y; });
        var cy = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
        pos[n.id] = { x: x, y: cy };
      }
    }
  }
  nodes.filter(function(n){ return n.parentId == null && !hidden(n.id); })
       .forEach(function(r){ place(r, 0, undefined); });
  return nodes.map(function(n){
    var p = pos[n.id];
    return assign({}, n, p ? { x: p.x, y: p.y } : { x: null, y: null });
  });
}

function exportJSON(nodes, meta){
  var data = {
    version: 1, app: 'mindforge',
    nodes: nodes.map(function(n){ return { id:n.id, parentId:n.parentId, text:n.text, color:n.color, collapsed:n.collapsed, x:n.x, y:n.y, manual:n.manual }; }),
    meta: meta || {}
  };
  return JSON.stringify(data, null, 2);
}

function importJSON(str){
  var data;
  try { data = JSON.parse(str); } catch (e) { return { ok: false, error: 'invalid JSON' }; }
  if (!data || typeof data !== 'object') return { ok: false, error: 'not an object' };
  var arr = Array.isArray(data) ? data : (data.nodes);
  if (!Array.isArray(arr)) return { ok: false, error: 'missing nodes array' };
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var n = arr[i];
    if (!n || n.id == null || typeof n.text !== 'string')
      return { ok: false, error: 'bad node shape' };
    out.push({
      id: String(n.id),
      parentId: (n.parentId == null ? null : String(n.parentId)),
      text: n.text,
      color: (typeof n.color === 'string' ? n.color : null),
      collapsed: !!n.collapsed,
      x: Number(n.x) || 0,
      y: Number(n.y) || 0,
      manual: !!n.manual
    });
  }
  return { ok: true, nodes: out };
}

function searchNodes(nodes, q){
  if (!q) return [];
  var s = String(q).toLowerCase();
  return nodes.filter(function(n){ return n.text && n.text.toLowerCase().indexOf(s) >= 0; })
              .map(function(n){ return n.id; });
}

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function sanitize(s){ return escapeHtml(s); }

function assign(t){ for (var i=1;i<arguments.length;i++){ var s=arguments[i]; for (var k in s) t[k]=s[k]; } return t; }

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    uid: uid, makeNode: makeNode, addNode: addNode, removeNode: removeNode,

      toast(t('imported').replace('N', String(r.nodes.length)));
    };
    reader.onerror = function(){ toast(t('badImport')); };
    reader.readAsText(file);
  }

  /* ---------- toast ---------- */
  var toastT;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  /* ---------- i18n ---------- */
  var lang = (function(){ try { return localStorage.getItem(LS_LANG) || 'zh'; } catch(e){ return 'zh'; } })();
  function t(key){ return (I18N[lang] && I18N[lang][key] != null) ? I18N[lang][key] : (I18N.zh[key] != null ? I18N.zh[key] : key); }
  function applyLang(){
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    $('#langBtn').textContent = lang === 'zh' ? 'EN' : '中';
    $('#subtitle').textContent = t('subtitle');
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
    $('#hintTip').textContent = t('hintTip');
    $('#hintList').innerHTML = [t('sh1'),t('sh2'),t('sh3'),t('sh4'),t('sh5'),t('sh6'),t('sh7')].map(function(s){ return '<div>' + s + '</div>'; }).join('');
  }

  function buildPalette(){
    var pal = $('#palette'); pal.innerHTML = '';
    COLOR_KEYS.forEach(function(k){
      var s = document.createElement('div'); s.className = 'swatch'; s.dataset.color = k;
      s.style.background = COLORS[k]; s.title = k;
      s.addEventListener('click', function(){ setColor(k); markPalette(); });
      pal.appendChild(s);
    });
  }
  function markPalette(){
    var node = getNode(state.selectedId);
    document.querySelectorAll('.swatch').forEach(function(s){
      s.classList.toggle('active', node && node.color === s.dataset.color);
    });
  }
  function updateSelMeta(){
    var el = $('#selMeta');
    if (!state.selectedId) { el.innerHTML = '<span>' + t('none') + '</span>'; markPalette(); return; }
    var n = getNode(state.selectedId);
    var kids = childrenOf(n.id).length;
    el.innerHTML = '<div><b>' + t('selected') + '</b></div>' +
      '<div>' + escapeHtml(n.text) + '</div>' +
      '<div>' + (n.parentId == null ? t('root') : (kids + ' ' + (lang==='zh'?'个子节点':'children'))) + '</div>' +
      '<div>color: ' + (n.color || 'inherit') + '</div>';
    markPalette();
  }

  /* ---------- events ---------- */
  function onPointerDown(e){
    if (e.button !== 0) return;
    var nodeEl = e.target.closest ? e.target.closest('.node') : null;
    if (nodeEl) {
      var dot = e.target.closest ? e.target.closest('.collapse-dot') : null;
      if (dot) { state.nodes = toggleCollapse(state.nodes, dot.dataset.id); render(); autosave(); return; }
      var id = nodeEl.dataset.id;
      select(id);
      var n = getNode(id);
      drag = { id: id, sx: e.clientX, sy: e.clientY, ox: n.x, oy: n.y, moved: false };
      try { viewport.setPointerCapture(e.pointerId); } catch(err){}
    } else {
      pan = { sx: e.clientX, sy: e.clientY, otx: view.tx, oty: view.ty };
      viewport.classList.add('panning');
      try { viewport.setPointerCapture(e.pointerId); } catch(err){}
    }
  }
  var drag = null, pan = null;
  function onPointerMove(e){
    if (drag) {
      var dx = (e.clientX - drag.sx) / view.scale, dy = (e.clientY - drag.sy) / view.scale;
      if (Math.abs(e.clientX - drag.sx) > 3 || Math.abs(e.clientY - drag.sy) > 3) drag.moved = true;
      if (drag.moved) { state.nodes = moveNode(state.nodes, drag.id, drag.ox + dx, drag.oy + dy); render(); }
    } else if (pan) {
      view.tx = pan.otx + (e.clientX - pan.sx); view.ty = pan.oty + (e.clientY - pan.sy);
      applyView(); updateMinimap();
    }
  }
  function onPointerUp(){
    if (drag) { if (drag.moved) autosave(); drag = null; }
    if (pan) { pan = null; viewport.classList.remove('panning'); }
  }
  viewport.addEventListener('pointerdown', onPointerDown);
  viewport.addEventListener('pointermove', onPointerMove);
  viewport.addEventListener('pointerup', onPointerUp);
  viewport.addEventListener('pointercancel', onPointerUp);

  viewport.addEventListener('wheel', function(e){
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.1 : 1/1.1);
  }, { passive: false });

  world.addEventListener('dblclick', function(e){
    var nodeEl = e.target.closest ? e.target.closest('.node') : null;
    if (nodeEl && !e.target.closest('.collapse-dot')) editNode(nodeEl.dataset.id);
  });

  document.addEventListener('keydown', function(e){
    if (state.editingId) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === 'Tab') { e.preventDefault(); if (state.selectedId) addChild(state.selectedId); }
    else if (e.key === 'Enter') { e.preventDefault(); if (state.selectedId) addSibling(state.selectedId); }
    else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); if (state.selectedId) delNode(state.selectedId); }
    else if (e.key === 'f' || e.key === 'F') { fit(); }
    else if (e.key === '+' || e.key === '=') { var r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width/2, r.top + r.height/2, 1.15); }
    else if (e.key === '-' || e.key === '_') { var r2 = viewport.getBoundingClientRect(); zoomAt(r2.left + r2.width/2, r2.top + r2.height/2, 1/1.15); }
  });

  // toolbar
  $('#addChild').addEventListener('click', function(){ if (state.selectedId) addChild(state.selectedId); else toast(t('none')); });
  $('#addSibling').addEventListener('click', function(){ if (state.selectedId) addSibling(state.selectedId); else toast(t('none')); });
  $('#delNode').addEventListener('click', function(){ if (state.selectedId) delNode(state.selectedId); else toast(t('none')); });
  $('#collapseAll').addEventListener('click', collapseAll);
  $('#expandAll').addEventListener('click', expandAll);
  $('#relayout').addEventListener('click', relayout);
  $('#fit').addEventListener('click', fit);
  $('#zoomIn').addEventListener('click', function(){ var r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width/2, r.top + r.height/2, 1.15); });
  $('#zoomOut').addEventListener('click', function(){ var r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width/2, r.top + r.height/2, 1/1.15); });
  $('#newMap').addEventListener('click', function(){ state.nodes = [makeNode([], { id:'n1', parentId:null, text: t('newIdea') })]; state.selectedId = 'n1'; render(); fit(); autosave(); });
  $('#sample').addEventListener('click', function(){ state.nodes = sampleData(); state.selectedId = null; render(); fit(); autosave(); toast(t('sampleLoaded')); });
  $('#importBtn').addEventListener('click', function(){ $('#fileInput').click(); });
  $('#fileInput').addEventListener('change', function(e){ if (e.target.files && e.target.files[0]) doImport(e.target.files[0]); e.target.value = ''; });
  $('#exportBtn').addEventListener('click', function(e){ e.stopPropagation(); $('#exportPop').classList.toggle('open'); });
  document.addEventListener('click', function(){ $('#exportPop').classList.remove('open'); });
  $('#exportPop').addEventListener('click', function(e){
    var b = e.target.closest('[data-export]'); if (!b) return;
    var k = b.dataset.export;
    if (k === 'json') exportJSONFile(); else if (k === 'png') exportPNG(); else if (k === 'svg') exportSVG();
  });

  $('#searchInput').addEventListener('input', function(e){
    state.matchIds = searchNodes(state.nodes, e.target.value);
    render();
  });

  $('#langBtn').addEventListener('click', function(){
    lang = lang === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem(LS_LANG, lang); } catch(e){}
    applyLang();
  });

  window.addEventListener('resize', function(){ applyView(); updateMinimap(); });

  /* ---------- init ---------- */
  function init(){
    load();
    applyLang();
    buildPalette();
    render();
    fit();
    // PWA
    if ('serviceWorker' in navigator) {
      try { navigator.serviceWorker.register('sw.js').catch(function(){}); } catch(e){}
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  // expose a tiny debug handle (optional)
  window.MindForge = { state: state, view: view };
})();
}
</script>
