<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="app">
  <h1>ImgConvertForge</h1>
  <p class="sub">图片格式转换器：PNG/JPEG/WebP 互转，可调质量与最大宽高，Canvas 本地转换不上传，显示前后体积对比，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <input id="file" type="file" accept="image/*">
</div>
<div class="row">
  <label style="margin:0">目标格式</label>
  <select id="fmt"><option value="png">PNG</option><option value="jpeg" selected>JPEG</option><option value="webp">WebP</option></select>
  <label style="margin:0">质量</label>
  <input id="q" type="number" value="0.85" min="0.05" max="1" step="0.05" style="width:80px">
  <label style="margin:0">最大宽</label>
  <input id="maxw" type="number" value="1600" min="0" step="100" style="width:90px">
</div>
<div class="row">
  <button id="conv">转换</button>
  <a id="dl" download style="display:none"><button class="ghost">下载结果</button></a>
  <span class="sub" id="stat" style="margin:0">选择图片后点击转换</span>
</div>
<canvas id="cv" width="480" height="300" style="width:100%;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;"></canvas>
<script>
function icMime(fmt){ var m={png:'image/png',jpeg:'image/jpeg',jpg:'image/jpeg',webp:'image/webp'}; return m[String(fmt||'').toLowerCase()]||'image/png'; }
function icExt(fmt){ var mime=icMime(fmt); return mime==='image/jpeg'?'jpg':mime.split('/')[1]; }
function icName(orig,fmt){ var base=String(orig||'image').replace(/\.[^.]+$/,''); if(!base) base='image'; return base+'.'+icExt(fmt); }
function icQuality(fmt,q){ if(icMime(fmt)==='image/png') return undefined; var v=Number(q); if(!isFinite(v)) v=0.92; return Math.min(1,Math.max(0.05,v)); }
function icFit(w,h,maxW,maxH){ w=Math.max(1,Math.floor(Number(w)||1)); h=Math.max(1,Math.floor(Number(h)||1)); var s=1; if(maxW>0&&w*s>maxW) s=maxW/w; if(maxH>0&&h*s>maxH) s=Math.min(s,maxH/h); var nw=Math.max(1,Math.round(w*s)), nh=Math.max(1,Math.round(h*s)); return {w:nw,h:nh,scale:s}; }
function icSizeLabel(bytes){ var b=Number(bytes); if(!isFinite(b)||b<0) return '0 B'; if(b<1024) return Math.round(b)+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(2)+' MB'; }
function icDataUrlBytes(durl){ var s=String(durl||''); var i=s.indexOf(','); if(i<0) return 0; var b64=s.slice(i+1); var pad=(b64.match(/=+$/)||[''])[0].length; return Math.max(0, Math.floor(b64.length*3/4)-pad); }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { icMime:icMime, icExt:icExt, icName:icName, icQuality:icQuality, icFit:icFit, icSizeLabel:icSizeLabel, icDataUrlBytes:icDataUrlBytes };
}
if (typeof window !== 'undefined') {
  window.ImgConvertForgePure = { icMime:icMime, icExt:icExt, icName:icName, icQuality:icQuality, icFit:icFit, icSizeLabel:icSizeLabel, icDataUrlBytes:icDataUrlBytes };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.ImgConvertForgePure;
    var img=null, srcBytes=0, srcName='image.png';
    $('file').addEventListener('change', function(e){
      var f=e.target.files && e.target.files[0]; if(!f) return;
      srcBytes=f.size; srcName=f.name;
      var url=URL.createObjectURL(f);
      var im=new Image();
      im.onload=function(){ img=im; $('stat').textContent='已载入 '+im.width+'×'+im.height+'（'+P.icSizeLabel(srcBytes)+'），点击转换'; preview(); };
      im.src=url;
    });
    function preview(){
      if(!img) return;
      var cv=$('cv'); var fit=P.icFit(img.width,img.height,480,300);
      cv.width=fit.w; cv.height=fit.h;
      var ctx=cv.getContext('2d'); if(ctx){ ctx.drawImage(img,0,0,fit.w,fit.h); }
    }
    $('conv').addEventListener('click', function(){
      if(!img){ $('stat').textContent='请先选择图片'; return; }
      var fmt=$('fmt').value, q=P.icQuality(fmt, $('q').value);
      var maxw=Number($('maxw').value)||0;
      var fit=P.icFit(img.width,img.height,maxw,0);
      var oc=document.createElement('canvas'); oc.width=fit.w; oc.height=fit.h;
      var ctx=oc.getContext('2d'); if(!ctx){ $('stat').textContent='canvas 不可用'; return; }
      if(P.icMime(fmt)==='image/jpeg'){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,fit.w,fit.h); }
      ctx.drawImage(img,0,0,fit.w,fit.h);
      var durl=oc.toDataURL(P.icMime(fmt), q);
      var outBytes=P.icDataUrlBytes(durl);
      var a=$('dl'); a.href=durl; a.download=P.icName(srcName,fmt); a.style.display='';
      $('stat').textContent=P.icSizeLabel(srcBytes)+' → '+P.icSizeLabel(outBytes)+'（'+fit.w+'×'+fit.h+' '+P.icExt(fmt).toUpperCase()+'）';
    });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>

    <span class="badge flag">旗舰</span>

</div>
