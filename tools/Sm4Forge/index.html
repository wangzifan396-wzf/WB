body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;

<script>

if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.Sm4ForgePure;
    function hexToBytes(h){ h=(h||'').replace(/[^0-9a-fA-F]/g,''); if(h.length%2) h='0'+h; var b=[]; for(var i=0;i<h.length;i+=2)b.push(parseInt(h.substr(i,2),16)); return b; }
    function bytesToHex(b){ var s=''; for(var i=0;i<b.length;i++) s+=('0'+b[i].toString(16)).slice(-2); return s; }
    function strToBytes(s){ return P.utf8(s); }
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var key = hexToBytes($('key').value);
        if(key.length!==16) throw new Error('密钥必须为 16 字节（32 位十六进制）');
        var data = strToBytes($('in').value);
        if($('mode').value==='dec'){
          if(data.length%16!==0) throw new Error('密文长度必须是 16 的倍数');
          var dec = P.sm4DecBytes(data, key);
          $('out').textContent = bytesToHex(dec) + '\n\n文本（尝试）: ' + dec.map(function(x){return (x>=32&&x<127)?String.fromCharCode(x):'.';}).join('');
        } else {
          $('out').textContent = bytesToHex(P.sm4EncBytes(data, key));
        }
      } catch(e){ $('err').textContent = e.message; }
    });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('out').textContent='等待计算'; });
  })();
}
