<input id="label" type="text" value="例子.中国" placeholder="如 例子.中国 或 münchen.de">

<script>
var PUNY_BASE=36, PUNY_TMIN=1, PUNY_TMAX=26, PUNY_SKEW=38, PUNY_DAMP=700, PUNY_INITIAL_BIAS=72, PUNY_INITIAL_N=128, PUNY_DELIMITER='-', PUNY_MAXINT=2147483647;
var PUNY_BASE_MINUS_TMIN = PUNY_BASE - PUNY_TMIN;
function punyFloor(x){ return Math.floor(x); }
function punyUcs2Decode(str){
  var out=[], counter=0, length=str.length;
  while(counter<length){
    var value=str.charCodeAt(counter++);
    if(value>=0xD800 && value<=0xDBFF && counter<length){
      var extra=str.charCodeAt(counter++);
      if((extra & 0xFC00)===0xDC00){ out.push(((value & 0x3FF)<<10) + (extra & 0x3FF) + 0x10000); }
      else { out.push(value); counter--; }
    } else { out.push(value); }
  }
  return out;
}
function punyUcs2Encode(cps){
  var out='';
  for(var i=0;i<cps.length;i++){ out += String.fromCodePoint(cps[i]); }
  return out;
}
function punyBasicToDigit(cp){
  if(cp>=0x30 && cp<0x3A) return 26+(cp-0x30);
  if(cp>=0x41 && cp<0x5B) return cp-0x41;
  if(cp>=0x61 && cp<0x7B) return cp-0x61;
  return PUNY_BASE;
}
function punyDigitToBasic(digit, flag){
  return digit + 22 + 75*(digit<26?1:0) - ((flag!==0)?32:0);
}
function punyAdapt(delta, numPoints, firstTime){
  var k=0;
  delta = firstTime ? punyFloor(delta/PUNY_DAMP) : delta>>1;
  delta += punyFloor(delta/numPoints);
  for(; delta > PUNY_BASE_MINUS_TMIN*PUNY_TMAX>>1; k+=PUNY_BASE){
    delta = punyFloor(delta/PUNY_BASE_MINUS_TMIN);
  }
  return punyFloor(k + (PUNY_BASE_MINUS_TMIN+1)*delta/(delta+PUNY_SKEW));
}
function punyDecode(input){
  var output=[]; var inputLength=input.length; var i=0; var n=PUNY_INITIAL_N; var bias=PUNY_INITIAL_BIAS;
  var basic=input.lastIndexOf(PUNY_DELIMITER);
  if(basic<0) basic=0;
  for(var j=0;j<basic;++j){
    if(input.charCodeAt(j)>=0x80) return null;
    output.push(input.charCodeAt(j));
  }
  for(var index=(basic>0?basic+1:0); index<inputLength; ){
    var oldi=i;
    for(var w=1, k=PUNY_BASE; ; k+=PUNY_BASE){
      if(index>=inputLength) return null;
      var digit=punyBasicToDigit(input.charCodeAt(index++));
      if(digit>=PUNY_BASE) return null;
      if(digit>punyFloor((PUNY_MAXINT - i)/w)) return null;
      i += digit*w;
      var t = k<=bias ? PUNY_TMIN : (k>=bias+PUNY_TMAX ? PUNY_TMAX : k-bias);
      if(digit<t) break;
      var baseMinusT = PUNY_BASE - t;
      if(w>punyFloor(PUNY_MAXINT/baseMinusT)) return null;
      w *= baseMinusT;
    }
    var out = output.length+1;
    bias = punyAdapt(i-oldi, out, oldi===0);
    if(punyFloor(i/out) > PUNY_MAXINT - n) return null;
    n += punyFloor(i/out);
    i %= out;
    output.splice(i++, 0, n);
  }
  return punyUcs2Encode(output);
}
function punyEncode(input){
  input = punyUcs2Decode(input);
  var inputLength=input.length;
  var output=[]; var n=PUNY_INITIAL_N; var delta=0; var bias=PUNY_INITIAL_BIAS;
  for(var ci=0; ci<inputLength; ci++){
    var currentValue=input[ci];
    if(currentValue<0x80) output.push(String.fromCharCode(currentValue));
  }
  var basicLength=output.length; var handledCPCount=basicLength;
  if(basicLength) output.push(PUNY_DELIMITER);
  while(handledCPCount<inputLength){
    var m=PUNY_MAXINT;
    for(var ci2=0; ci2<inputLength; ci2++){
      var v=input[ci2];
      if(v>=n && v<m) m=v;
    }
    var handledCPCountPlusOne=handledCPCount+1;
    if(m-n > punyFloor((PUNY_MAXINT-delta)/handledCPCountPlusOne)) return null;
    delta += (m-n)*handledCPCountPlusOne;
    n=m;
    for(var ci3=0; ci3<inputLength; ci3++){
      var cv=input[ci3];
      if(cv<n && ++delta>PUNY_MAXINT) return null;
      if(cv===n){
        var q=delta;
        for(var kk=PUNY_BASE; ; kk+=PUNY_BASE){
          var t = kk<=bias ? PUNY_TMIN : (kk>=bias+PUNY_TMAX ? PUNY_TMAX : kk-bias);
          if(q<t) break;
          var qMinusT=q-t; var baseMinusT=PUNY_BASE-t;
          output.push(String.fromCharCode(punyDigitToBasic(t + qMinusT%baseMinusT, 0)));
          q = punyFloor(qMinusT/baseMinusT);
        }
        output.push(String.fromCharCode(punyDigitToBasic(q,0)));
        bias = punyAdapt(delta, handledCPCountPlusOne, handledCPCount===basicLength);
        delta=0;
        ++handledCPCount;
      }
    }
    ++delta; ++n;
  }
  return output.join('');
}
function punyEncodeDomain(domain){
  var labels=domain.split('.');
  for(var i=0;i<labels.length;i++){
    var lab=labels[i];
    if(/[^\0-\x7F]/.test(lab)) labels[i]='xn--'+punyEncode(lab);
  }
  return labels.join('.');
}
function punyDecodeDomain(domain){
  var labels=domain.split('.');
  for(var i=0;i<labels.length;i++){
    var lab=labels[i].toLowerCase();
    if(lab.indexOf('xn--')===0) labels[i]=punyDecode(lab.slice(4));
  }
  return labels.join('.');
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { encode:punyEncode, decode:punyDecode, encodeDomain:punyEncodeDomain, decodeDomain:punyDecodeDomain };
}
if (typeof window !== 'undefined') {
  window.PunyForgePure = { encode:punyEncode, decode:punyDecode, encodeDomain:punyEncodeDomain, decodeDomain:punyDecodeDomain };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.PunyForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function set(v){ $('out').textContent = v; }
    $('enc').addEventListener('click', function(){ try{ set(P.encode($('label').value)); }catch(e){ $('err').textContent=e.message; } });
    $('dec').addEventListener('click', function(){ var r=P.decode($('label').value.trim()); set(r===null?'解码失败（非法输入）':r); });
    $('encd').addEventListener('click', function(){ try{ set(P.encodeDomain($('label').value)); }catch(e){ $('err').textContent=e.message; } });
    $('decd').addEventListener('click', function(){ set(P.decodeDomain($('label').value.trim())); });
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('label').value=''; $('out').textContent='结果会显示在这里'; });
  })();
}
</script>

function zh(){try{var l=localStorage.getItem('nano-lang')||document.documentElement.lang||'zh';return String(l).indexOf('en')!==0;}catch(e){return true;}}
