<html lang="zh-CN">

<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
#nanoToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#1A1B1E;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:9px 16px;font-size:13px;line-height:1.4;letter-spacing:.01em;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;max-width:80vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#nanoToast.bad{border-color:rgba(239,68,68,.55)}
@media (prefers-reduced-motion:reduce){#nanoToast{transition:none}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>CspForge</h1>
  <p class="sub">CSP 工具：三档策略生成（strict/basic/lockdown）、nonce 生成、策略解析与 A–F 评分、unsafe-inline 与通配符风险检测、策略差异对比 · 单文件 · 零依赖 · 本地优先</p>

<div class="grid">
  <section class="panel">
    <h2>策略生成</h2>
    <div class="row">
      <label>模式</label>
      <select id="mode">
        <option value="strict">Strict（nonce + strict-dynamic）</option>
        <option value="basic">Basic（self 白名单）</option>
        <option value="lockdown">Lockdown（default-src none）</option>
      </select>
    </div>
    <div class="row"><label>nonce 种子</label><input id="seed" value="build-2026"><button id="gen" class="btn">重算</button></div>
    <div class="row"><label>report-uri</label><input id="rep" placeholder="/csp-report"></div>
    <div class="row chk">
      <label><input type="checkbox" id="upg" checked> upgrade-insecure-requests</label>
      <label><input type="checkbox" id="ro"> Report-Only</label>
    </div>
    <pre id="out" class="out"></pre>
    <div class="row"><button id="copy" class="btn">复制</button><button id="toAudit" class="btn">送去体检</button></div>
  </section>
  <section class="panel">
    <h2>策略体检</h2>
    <textarea id="pol" rows="5">default-src 'self'; script-src 'self' 'unsafe-inline' *; style-src 'self' 'unsafe-inline'</textarea>
    <div id="score" class="out"></div>
    <div id="issues" class="list"></div>
    <h2 style="margin-top:18px">指令速查</h2>
    <div id="ref" class="meta"></div>
  </section>
</div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>

var FETCH_DIRECTIVES = ['default-src','script-src','style-src','img-src','font-src','connect-src','media-src','object-src','frame-src','worker-src','manifest-src','child-src'];
var OTHER_DIRECTIVES = ['base-uri','form-action','frame-ancestors','report-uri','report-to','upgrade-insecure-requests','block-all-mixed-content','require-trusted-types-for','sandbox'];
var KEYWORDS = ["'self'","'none'","'unsafe-inline'","'unsafe-eval'","'strict-dynamic'","'unsafe-hashes'","'wasm-unsafe-eval'"];
function parsePolicy(str){
  var out={directives:{}, order:[], errors:[]};
  var s=String(str||'').replace(/^\s*content-security-policy(-report-only)?\s*:\s*/i,'');
  var segs=s.split(';');
  for(var i=0;i<segs.length;i++){
    var seg=segs[i].trim();
    if(!seg) continue;
    var toks=seg.split(/\s+/);
    var name=toks.shift().toLowerCase();
    if(out.directives.hasOwnProperty(name)){ out.errors.push('重复指令: '+name+'（浏览器只取第一个）'); continue; }
    out.directives[name]=toks;
    out.order.push(name);
  }
  return out;
}
function serialize(dirs, order){
  var keys = order && order.length ? order : Object.keys(dirs);
  var parts=[];
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    if(!dirs.hasOwnProperty(k)) continue;
    var v=dirs[k];
    parts.push(v && v.length ? (k+' '+v.join(' ')) : k);
  }
  return parts.join('; ');
}
function isSourceValid(src){
  var s=String(src||'').trim();
  if(!s) return false;
  if(KEYWORDS.indexOf(s)>-1) return true;
  if(/^'nonce-[A-Za-z0-9+/=_-]{8,}'$/.test(s)) return true;
  if(/^'sha(256|384|512)-[A-Za-z0-9+/=]+'$/.test(s)) return true;
  if(s==='*' ) return true;
  if(/^[a-z][a-z0-9+.-]*:$/i.test(s)) return true;
  if(/^\*\.[^\s*]+$/.test(s)) return true;
  if(/^(https?:\/\/)?[^\s'";]+$/.test(s)) return true;
  return false;
}
function auditPolicy(str){
  var p=parsePolicy(str), issues=[], d=p.directives;
  function add(level,msg){ issues.push({level:level, msg:msg}); }
  for(var i=0;i<p.errors.length;i++) add('error', p.errors[i]);
  var known = FETCH_DIRECTIVES.concat(OTHER_DIRECTIVES);
  for(var k in d){
    if(!d.hasOwnProperty(k)) continue;
    if(known.indexOf(k)===-1) add('info','未识别指令: '+k);
    var vals=d[k];
    for(var j=0;j<vals.length;j++){
      if(!isSourceValid(vals[j])) add('error','非法源表达式: '+k+' '+vals[j]);
    }
  }
  if(!d['default-src'] && !d['script-src']) add('error','缺少 default-src 与 script-src，脚本无任何限制');
  var script = d['script-src'] || d['default-src'] || [];
  if(script.indexOf("'unsafe-inline'")>-1){
    var hasNonce = script.some(function(v){ return /^'nonce-/.test(v) || /^'sha\d/.test(v); });
    if(hasNonce) add('info',"script-src 同时含 nonce/hash 与 'unsafe-inline'：CSP3 浏览器会忽略 unsafe-inline，仅作旧浏览器降级");
    else add('error',"script-src 允许 'unsafe-inline'，XSS 防护基本失效");
  }
  if(script.indexOf("'unsafe-eval'")>-1) add('warn',"script-src 允许 'unsafe-eval'，eval/new Function 可被利用");
  if(script.indexOf('*')>-1) add('error','script-src 使用通配符 *，等同不设防');
  if(script.indexOf('data:')>-1) add('error','script-src 允许 data:，可被注入任意脚本');
  if(script.indexOf('http:')>-1) add('warn','script-src 允许明文 http:，存在中间人注入风险');
  var style = d['style-src'] || d['default-src'] || [];
  if(style.indexOf("'unsafe-inline'")>-1) add('warn',"style-src 允许 'unsafe-inline'，存在样式注入与数据泄露风险");
  if(!d['object-src'] && !(d['default-src']||[]).length) add('warn',"建议显式设置 object-src 'none' 以封堵 Flash/插件向量");
  else {
    var obj = d['object-src'] || d['default-src'];
    if(obj.indexOf("'none'")===-1) add('warn',"object-src 建议设为 'none'");
  }
  if(!d['base-uri']) add('warn',"缺少 base-uri，攻击者可注入 <base> 劫持相对路径");
  if(!d['frame-ancestors']) add('warn',"缺少 frame-ancestors，无法防御点击劫持");
  if(!d['form-action']) add('info','建议设置 form-action 限制表单提交目标');
  if(script.indexOf("'strict-dynamic'")>-1 && !script.some(function(v){return /^'nonce-|^'sha\d/.test(v);}))
    add('error',"'strict-dynamic' 必须配合 nonce 或 hash 使用");
  var errors=0, warnings=0, infos=0;
  for(var q=0;q<issues.length;q++){
    if(issues[q].level==='error') errors++;
    else if(issues[q].level==='warn') warnings++;
    else infos++;
  }
  var score = 100 - errors*25 - warnings*8;
  if(score<0) score=0;
  var grade = errors>0 ? (score>=50?'C':score>0?'D':'F') : (warnings===0?'A': warnings<=2?'B':'C');
  return {parsed:p, issues:issues, errors:errors, warnings:warnings, infos:infos, score:score, grade:grade};
}
function buildPolicy(opt){
  opt=opt||{};
  var d={}, order=[];
  function set(k,v){ d[k]=v; order.push(k); }
  var mode = opt.mode || 'strict';
  if(mode==='strict'){
    var script=["'strict-dynamic'"];
    if(opt.nonce) script.unshift("'nonce-"+opt.nonce+"'");
    script.push('https:',"'unsafe-inline'");
    set('default-src',["'self'"]);
    set('script-src', script);
    set('object-src',["'none'"]);
    set('base-uri',["'self'"]);
    set('frame-ancestors',["'none'"]);
    set('form-action',["'self'"]);
  } else if(mode==='basic'){
    set('default-src',["'self'"]);
    set('script-src',["'self'"]);
    set('style-src',["'self'","'unsafe-inline'"]);
    set('img-src',["'self'",'data:','https:']);
    set('object-src',["'none'"]);
    set('base-uri',["'self'"]);
    set('frame-ancestors',["'self'"]);
    set('form-action',["'self'"]);
  } else if(mode==='lockdown'){
    set('default-src',["'none'"]);
    set('script-src',["'self'"]);
    set('style-src',["'self'"]);
    set('img-src',["'self'"]);
    set('connect-src',["'self'"]);
    set('font-src',["'self'"]);
    set('base-uri',["'none'"]);
    set('frame-ancestors',["'none'"]);
    set('form-action',["'self'"]);
  } else {
    set('default-src',["'self'"]);
  }
  if(opt.extra){
    for(var k in opt.extra){
      if(!opt.extra.hasOwnProperty(k)) continue;
      if(d.hasOwnProperty(k)){
        var cur=d[k].slice();
        var add=opt.extra[k];
        for(var i=0;i<add.length;i++) if(cur.indexOf(add[i])===-1) cur.push(add[i]);
        d[k]=cur;
      } else set(k, opt.extra[k]);
    }
  }
  if(opt.upgradeInsecure){ d['upgrade-insecure-requests']=[]; order.push('upgrade-insecure-requests'); }
  if(opt.reportUri){ d['report-uri']=[opt.reportUri]; order.push('report-uri'); }
  var value=serialize(d, order);
  var name = opt.reportOnly ? 'Content-Security-Policy-Report-Only' : 'Content-Security-Policy';
  return {directives:d, order:order, value:value, header:name+': '+value, reportOnly: !!opt.reportOnly};
}
function makeNonce(seed){
  var s=String(seed===undefined? 'nano':seed), h=2166136261;
  var A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', out='';
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = (h*16777619)>>>0; }
  for(var j=0;j<22;j++){ h = (h*1103515245 + 12345)>>>0; out += A.charAt(h % A.length); }
  return out;
}
function diffPolicy(a,b){
  var pa=parsePolicy(a).directives, pb=parsePolicy(b).directives;
  var added=[], removed=[], changed=[];
  for(var k in pb){ if(pb.hasOwnProperty(k) && !pa.hasOwnProperty(k)) added.push(k); }
  for(var j in pa){ if(pa.hasOwnProperty(j) && !pb.hasOwnProperty(j)) removed.push(j); }
  for(var m in pa){
    if(!pa.hasOwnProperty(m) || !pb.hasOwnProperty(m)) continue;
    if(pa[m].join(' ')!==pb[m].join(' ')) changed.push({name:m, from:pa[m], to:pb[m]});
  }
  return {added:added, removed:removed, changed:changed, same: !added.length && !removed.length && !changed.length};
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { FETCH_DIRECTIVES:FETCH_DIRECTIVES, OTHER_DIRECTIVES:OTHER_DIRECTIVES, KEYWORDS:KEYWORDS, parsePolicy:parsePolicy, serialize:serialize, isSourceValid:isSourceValid, auditPolicy:auditPolicy, buildPolicy:buildPolicy, makeNonce:makeNonce, diffPolicy:diffPolicy }; }
if (typeof window !== 'undefined') { window.CspForgePure = { FETCH_DIRECTIVES:FETCH_DIRECTIVES, OTHER_DIRECTIVES:OTHER_DIRECTIVES, KEYWORDS:KEYWORDS, parsePolicy:parsePolicy, serialize:serialize, isSourceValid:isSourceValid, auditPolicy:auditPolicy, buildPolicy:buildPolicy, makeNonce:makeNonce, diffPolicy:diffPolicy }; }

</script>
<script>

(function(){
  if(typeof window==='undefined' || !window.document) return;
  var $=function(id){return document.getElementById(id);};
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function build(){
    var b=buildPolicy({
      mode:$('mode').value,
      nonce: makeNonce($('seed').value),
      reportUri: $('rep').value.trim() || null,
      upgradeInsecure: $('upg').checked,
      reportOnly: $('ro').checked
    });
    $('out').textContent=b.header;
    return b;
  }
  function audit(){
    var a=auditPolicy($('pol').value);
    var cls = a.grade==='A'?'ok': a.grade==='B'?'i': a.grade==='C'?'w':'e';
    $('score').innerHTML='<span class="tag '+cls+'">'+a.grade+'</span> 得分 '+a.score+' · '+a.errors+' 错误 / '+a.warnings+' 警告 / '+a.infos+' 提示';
    $('issues').innerHTML = a.issues.length
      ? a.issues.map(function(i){
          var c=i.level==='error'?'e':i.level==='warn'?'w':'i';
          return '<div class="item"><span class="tag '+c+'">'+i.level.toUpperCase()+'</span> '+esc(i.msg)+'</div>';
        }).join('')
      : '<div class="okmsg">未发现问题</div>';
  }
  ['mode','seed','rep','upg','ro'].forEach(function(id){
    var el=$(id); if(el){ el.addEventListener('input', build); el.addEventListener('change', build); }
  });
  $('pol').addEventListener('input', audit);
  $('gen').addEventListener('click', build);
  $('copy').addEventListener('click', function(){ if(navigator.clipboard) navigator.clipboard.writeText($('out').textContent||''); });
  $('toAudit').addEventListener('click', function(){
    $('pol').value = build().value; audit();
  });
  $('ref').textContent = '取回类: '+FETCH_DIRECTIVES.join(' · ') + '\n其他: ' + OTHER_DIRECTIVES.join(' · ');
  build(); audit();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>

<div id="nanoToast" role="status" aria-live="polite"></div>
<script data-nano-polish>
(function(){var el=document.getElementById('nanoToast');if(!el)return;var t;
function zh(){try{var l=localStorage.getItem('nano-lang')||document.documentElement.lang||'zh';return String(l).indexOf('en')!==0;}catch(e){return true;}}
function show(m,bad){el.textContent=m;el.className='on'+(bad?' bad':'');clearTimeout(t);t=setTimeout(function(){el.className='';},1700);}
window.nanoToast=show;
try{var nc=navigator.clipboard;if(nc&&nc.writeText){var ow=nc.writeText.bind(nc);nc.writeText=function(s){return ow(s).then(function(r){show(zh()?'已复制':'Copied');return r;},function(e){show(zh()?'复制失败':'Copy failed',1);throw e;});};}}catch(e){}
try{if(document.execCommand){var oe=document.execCommand.bind(document);document.execCommand=function(c){var r=oe.apply(null,arguments);if(String(c).toLowerCase()==='copy'){show(r?(zh()?'已复制':'Copied'):(zh()?'复制失败':'Copy failed'),!r);}return r;};}}catch(e){}
})();
</script>
