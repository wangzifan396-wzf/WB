  <p class="sub">PBKDF2 · 密钥派生 · KDF</p>

  <label for="pb_pwd">口令（Password）</label>

  <div class="row">
    <button id="pb_run">派生密钥</button>
    <button id="pb_rand" class="ghost">随机盐</button>

  <div class="err" id="pb_err"></div>

  <label>派生结果</label>
  <div class="grid" id="pb_out"></div>

function derLenBytes(n){

  while(v>0){ b.unshift(v&0xff); v=Math.floor(v/256); }

function encodeOid(dotted){
  var p=String(dotted).split('.').map(Number);

  for(var i=2;i<p.length;i++){
    var v=p[i], st=[v&0x7f];

    var n=((buf[i]<<24)|(buf[i+1]<<16)|(buf[i+2]<<8)|buf[i+3])>>>0;
    i+=4;
    if(n>buf.length-i){ trunc={at:i, reason:'声明 '+n+' 字节，实际只剩 '+(buf.length-i)+' 字节'}; break; }

/* ============ Pbkdf2Forge 内核 ============

var Pbkdf2ForgePure = (function(){
  // 口令/盐均为 UTF-8 字符串；可选以 0x 前缀表示十六进制盐。
  function bytesOf(s){
    s = String(s);
    if(/^0x/i.test(s)) return fromHex(s.slice(2));

  }
  function derive(password, salt, iterations, keylen, hashName){

    if(keylen < 1) return {error:'派生长度必须 >= 1'};
    var P = utf8Bytes(password);
    var S = bytesOf(salt);
    var hmac = (hashName === 'SHA1') ? hmacSha1 : hmacSha256;
    var hlen = (hashName === 'SHA1') ? 20 : 32;

    if(iterations >= min/10) return {tone:'warn', msg:'可用，但建议提高到 '+min+' 次以上'};

  }

<script>

(function(){
  var P = window.Pbkdf2ForgePure;
  var $ = function(id){ return document.getElementById(id); };
  function run(){
    var r = P.derive($('pb_pwd').value, $('pb_salt').value, +$('pb_iter').value, +$('pb_len').value, $('pb_hash').value);
    if(r.error){ $('pb_err').textContent = r.error; $('pb_out').innerHTML=''; $('pb_adv').innerHTML=''; return; }
    $('pb_err').textContent = '';
    var b64 = P.deriveB64($('pb_pwd').value, $('pb_salt').value, +$('pb_iter').value, +$('pb_len').value, $('pb_hash').value);
    $('pb_out').innerHTML =
      '<div class="kv"><b>Hex</b><span style="word-break:break-all">'+r.hex+'</span></div>' +
      '<div class="kv"><b>Base64url</b><span style="word-break:break-all">'+b64.b64url+'</span></div>';
    var a = P.advise(+$('pb_iter').value, $('pb_hash').value);
    var color = a.tone==='ok' ? 'var(--ok)' : (a.tone==='warn' ? 'var(--warn)' : 'var(--bad)');
    $('pb_adv').innerHTML = '<span style="color:'+color+'">'+a.msg+'</span>';
  }
  $('pb_run').addEventListener('click', run);
  $('pb_rand').addEventListener('click', function(){ $('pb_salt').value = '0x'+P.genSalt(16); run(); });
  ['pb_pwd','pb_salt','pb_iter','pb_len','pb_hash'].forEach(function(id){
    $(id).addEventListener('input', run); $(id).addEventListener('change', run);
  });
  run();
})();
