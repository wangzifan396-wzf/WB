<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AsciiForge — 离线 ASCII 艺术：横幅 / 文本框 / 黑客语</title>
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:90px}
.preview svg{max-width:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.big{font:40px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线 ASCII 艺术：A-Z 0-9 点阵横幅 / 文本框 / 黑客语转换。">
</head>
<body>
<div class="app">
  <h1>AsciiForge</h1>
  <p class="sub">离线 ASCII 艺术：横幅 / 文本框 / 黑客语 · 单文件 · 零依赖 · 本地优先</p>

<label for="in">文本（横幅仅支持 A-Z 0-9 与空格）</label>
<input id="in" type="text" value="Nano" placeholder="输入文字">
<div class="row">
  <select id="style">
    <option value="banner">横幅 Banner</option>
    <option value="box">文本框 Box</option>
    <option value="leet">黑客语 Leet</option>
  </select>
  <button id="run">生成</button>
  <button id="copy" class="ghost">复制结果</button>
  <button id="clear" class="ghost">清空</button>
</div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">结果会显示在这里</div>
<script>
var FONT = {
  'A':[14,17,17,31,17],'B':[30,17,30,17,30],'C':[15,16,16,16,15],'D':[30,17,17,17,30],
  'E':[31,16,30,16,31],'F':[31,16,30,16,16],'G':[15,16,19,17,15],'H':[17,17,31,17,17],
  'I':[31,4,4,4,31],'J':[7,2,2,18,14],'K':[17,18,20,18,17],'L':[16,16,16,16,31],
  'M':[17,27,21,17,17],'N':[17,25,21,19,17],'O':[14,17,17,17,14],'P':[30,17,30,16,16],
  'Q':[14,17,17,19,13],'R':[30,17,30,18,17],'S':[15,16,14,1,15],'T':[31,4,4,4,4],
  'U':[17,17,17,17,14],'V':[17,17,17,10,4],'W':[17,17,21,27,17],'X':[17,10,4,10,17],
  'Y':[17,10,4,4,4],'Z':[31,2,4,8,31],
  '0':[14,19,21,25,14],'1':[4,12,4,4,14],'2':[14,17,12,8,31],'3':[30,1,14,1,30],
  '4':[18,18,31,2,2],'5':[31,16,30,1,30],'6':[14,16,30,17,14],'7':[31,2,4,8,8],
  '8':[14,17,14,17,14],'9':[14,17,15,1,14],' ':[0,0,0,0,0]
};
function glyphRows(ch){
  var a=FONT[ch]; if(!a) a=FONT[' '];
  return a.map(function(row){
    var s=''; for(var b=4;b>=0;b--) s+=((row>>b)&1)?'#':'.'; return s;
  });
}
function render(text){
  text=String(text).toUpperCase();
  var glyphs=[]; for(var i=0;i<text.length;i++) glyphs.push(glyphRows(text[i]));
  var lines=[];
  for(var r=0;r<5;r++){
    var line='';
    for(var g=0;g<glyphs.length;g++){ line+=glyphs[g][r]+(g<glyphs.length-1?' ':''); }
    lines.push(line.replace(/\s+$/,''));
  }
  return lines.join('\n');
}
function repeat(ch,n){ var s=''; for(var i=0;i<n;i++) s+=ch; return s; }
function box(text){
  text=String(text); var w=text.length+2;
  return ['┌'+repeat('─',w)+'┐','│ '+text+' │','└'+repeat('─',w)+'┘'].join('\n');
}
var LEET={'a':'4','e':'3','i':'1','o':'0','s':'5','t':'7','b':'8','g':'9','l':'1','z':'2'};
function leet(text){
  return String(text).replace(/[a-zA-Z]/g, function(m){ var low=m.toLowerCase(); return LEET[low]?LEET[low]:m; });
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { render:render, box:box, leet:leet, FONT:FONT };
}
if (typeof window !== 'undefined') {
  window.AsciiForgePure = { render:render, box:box, leet:leet, FONT:FONT };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.AsciiForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function run(){
      var text=$('in').value, st=$('style').value, out;
      if(st==='banner') out=P.render(text);
      else if(st==='box') out=P.box(text);
      else out=P.leet(text);
      $('out').textContent=out;
    }
    $('run').addEventListener('click', run);
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('out').textContent='结果会显示在这里'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
