<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CsvForge — 离线 CSV 工具箱：解析 / 转换 / 转置 / 概览</title>
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:90px}
.preview svg{max-width:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.big{font:40px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线 CSV 工具箱：解析 / 转 JSON / 转置 / 概览，零上传。">
</head>
<body>
<div class="app">
  <h1>CsvForge</h1>
  <p class="sub">离线 CSV 工具箱：解析 / 转换 / 转置 / 概览 · 单文件 · 零依赖 · 本地优先</p>

<label for="in">CSV 文本</label>
<textarea id="in" rows="6" placeholder="name,age&#10;Alice,30&#10;Bob,25"></textarea>
<div class="row">
  <select id="mode">
    <option value="tojson">CSV → JSON</option>
    <option value="fromjson">JSON → CSV</option>
    <option value="transpose">转置</option>
    <option value="summary">概览</option>
  </select>
  <label style="margin:0;display:flex;align-items:center;gap:6px"><input type="checkbox" id="header" checked style="width:auto"> 首行表头</label>
</div>
<div class="row">
  <button id="run">运行</button>
  <button id="copy" class="ghost">复制结果</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">结果会显示在这里</div>
<script>
function parseCsv(text){
  var rows=[]; var row=[]; var field=''; var i=0; var inQ=false;
  text=String(text);
  while(i<text.length){
    var c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQ=false; i++; continue; }
      field+=c; i++; continue;
    } else {
      if(c==='"'){ inQ=true; i++; continue; }
      if(c===','){ row.push(field); field=''; i++; continue; }
      if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
      if(c==='\r'){ i++; continue; }
      field+=c; i++; continue;
    }
  }
  row.push(field); rows.push(row);
  if(rows.length && rows[rows.length-1].length===1 && rows[rows.length-1][0]==='' && /\n$/.test(text)) rows.pop();
  return rows;
}
function toCsv(rows){
  return rows.map(function(r){
    return r.map(function(f){
      f=String(f);
      if(/[",\n\r]/.test(f)) return '"'+f.replace(/"/g,'""')+'"';
      return f;
    }).join(',');
  }).join('\n');
}
function toObjects(rows, header){
  if(!rows.length) return [];
  if(header){
    var keys=rows[0]; var out=[];
    for(var r=1;r<rows.length;r++){ var o={}; for(var c=0;c<keys.length;c++) o[keys[c]]=rows[r][c]; out.push(o); }
    return out;
  }
  return rows;
}
function transpose(rows){
  if(!rows.length) return [];
  var cols=rows[0].length; var out=[];
  for(var c=0;c<cols;c++){ var nr=[]; for(var r=0;r<rows.length;r++) nr.push(rows[r][c]); out.push(nr); }
  return out;
}
function summarize(rows, header){
  var cols = rows.length? rows[0].length : 0;
  return { rows: rows.length, cols: cols, headers: (header && rows.length)? rows[0] : [] };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parseCsv:parseCsv, toCsv:toCsv, toObjects:toObjects, transpose:transpose, summarize:summarize };
}
if (typeof window !== 'undefined') {
  window.CsvForgePure = { parseCsv:parseCsv, toCsv:toCsv, toObjects:toObjects, transpose:transpose, summarize:summarize };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.CsvForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function run(){
      var src=$('in').value, mode=$('mode').value, header=$('header').checked;
      $('err').textContent='';
      try {
        var res;
        if(mode==='tojson'){ res=JSON.stringify(P.toObjects(P.parseCsv(src), header), null, 2); }
        else if(mode==='fromjson'){
          var data=JSON.parse(src);
          var rows=(Array.isArray(data)&&data.length&&typeof data[0]==='object')
            ? [Object.keys(data[0])].concat(data.map(function(o){ return Object.keys(data[0]).map(function(k){ return o[k]; }); }))
            : data;
          res=P.toCsv(rows);
        }
        else if(mode==='transpose'){ res=P.toCsv(P.transpose(P.parseCsv(src))); }
        else { var s=P.summarize(P.parseCsv(src), header); res='行数: '+s.rows+'\n列数: '+s.cols+(s.headers.length?('\n表头: '+s.headers.join(', ')):''); }
        $('out').textContent=res;
      } catch(e){ $('err').textContent=e.message; }
    }
    $('run').addEventListener('click', run);
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('out').textContent='结果会显示在这里'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>

</div>

</body>
