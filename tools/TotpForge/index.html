<script>
function rotl(x,n){ return (x<<n)|(x>>>(32-n)); }
function sha1bytes(bytes){
  function r1(x,n){ return (x<<n)|(x>>>(32-n)); }
  var h0=0x67452301,h1=0xEFCDAB89,h2=0x98BADCFE,h3=0x10325476,h4=0xC3D2E1F0;
  var msg=bytes.slice(); var bitLen=msg.length*8; msg.push(0x80);
  while(msg.length%64!==56) msg.push(0);
  var hi=Math.floor(bitLen/4294967296), lo=bitLen>>>0;
  for(var s=3;s>=0;s--) msg.push((hi>>>(8*s))&0xff);
  for(var s=3;s>=0;s--) msg.push((lo>>>(8*s))&0xff);
  for(var off=0; off<msg.length; off+=64){
    var w=new Array(80);
    for(var t=0;t<16;t++){ w[t]=((msg[off+4*t]<<24)|(msg[off+4*t+1]<<16)|(msg[off+4*t+2]<<8)|(msg[off+4*t+3]))>>>0; }
    for(var t=16;t<80;t++){ w[t]=r1(w[t-3]^w[t-8]^w[t-14]^w[t-16],1)>>>0; }
    var a=h0,b=h1,c=h2,d=h3,e=h4;
    for(var t=0;t<80;t++){
      var f,k;
      if(t<20){ f=(b&c)|((~b)&d); k=0x5A827999; }
      else if(t<40){ f=b^c^d; k=0x6ED9EBA1; }
      else if(t<60){ f=(b&c)|(b&d)|(c&d); k=0x8F1BBCDC; }
      else { f=b^c^d; k=0xCA62C1D6; }
      var tmp=(r1(a,5)+f+e+k+(w[t]>>>0))>>>0;
      e=d; d=c; c=r1(b,30); b=a; a=tmp;
    }
    h0=(h0+a)>>>0; h1=(h1+b)>>>0; h2=(h2+c)>>>0; h3=(h3+d)>>>0; h4=(h4+e)>>>0;
  }
  var out=[]; [h0,h1,h2,h3,h4].forEach(function(x){ for(var s=3;s>=0;s--) out.push((x>>>(8*s))&0xff); });
  return out;
}
function hmacSha1(keyBytes, msgBytes){
  var B=64;
  if(keyBytes.length>B) keyBytes=sha1bytes(keyBytes);
  var k=new Array(B).fill(0);
  for(var i=0;i<keyBytes.length;i++) k[i]=keyBytes[i];
  var ipad=new Array(B), opad=new Array(B);
  for(var i=0;i<B;i++){ ipad[i]=k[i]^0x36; opad[i]=k[i]^0x5c; }
  var inner=ipad.concat(msgBytes);
  var innerHash=sha1bytes(inner);
  var outer=opad.concat(innerHash);
  return sha1bytes(outer);
}
function hotp(keyBytes, counter, digits){
  digits=digits||6;
  var c=counter>>>0;
  var C=[0,0,0,0,(c>>>24)&0xff,(c>>>16)&0xff,(c>>>8)&0xff,c&0xff];
  var mac=hmacSha1(keyBytes, C);
  var off=mac[19]&0x0f;
  var bin=((mac[off]&0x7f)<<24)|((mac[off+1]&0xff)<<16)|((mac[off+2]&0xff)<<8)|(mac[off+3]&0xff);
  var otp=(bin%Math.pow(10,digits)).toString();
  while(otp.length<digits) otp='0'+otp;
  return otp;
}
function totp(keyBytes, opts){
  opts=opts||{};
  var X=opts.period||30;
  var T=opts.time!=null?opts.time:(Date.now()/1000);
  var counter=Math.floor(T/X);
  return hotp(keyBytes, counter, opts.digits||6);
}
function base32Decode(s){
  s=String(s).toUpperCase().replace(/=+$/,'').replace(/\s+/g,'');
  var alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  var bits=0, value=0, out=[];
  for(var i=0;i<s.length;i++){
    var idx=alpha.indexOf(s[i]); if(idx<0) continue;
    value=(value<<5)|idx; bits+=5;
    if(bits>=8){ out.push((value>>>(bits-8))&0xff); bits-=8; }
  }
  return out;
}
function asciiBytes(s){ var o=[]; s=String(s); for(var i=0;i<s.length;i++) o.push(s.charCodeAt(i)&0xff); return o; }
function secretToBytes(s, isAscii){
  if(isAscii) return asciiBytes(s);
  var b=base32Decode(s);
  if(b.length) return b;
  return asciiBytes(s);
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { sha1bytes:sha1bytes, hmacSha1:hmacSha1, hotp:hotp, totp:totp, base32Decode:base32Decode, asciiBytes:asciiBytes, secretToBytes:secretToBytes };
}
if (typeof window !== 'undefined') {
  window.TotpForgePure = { sha1bytes:sha1bytes, hmacSha1:hmacSha1, hotp:hotp, totp:totp, base32Decode:base32Decode, asciiBytes:asciiBytes, secretToBytes:secretToBytes };
}

<script>
if (typeof window !== 'undefined' && window.document) {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.TotpForgePure;
    var timer=null;
    function b32(){ return $('ascii').checked ? $('secret').value : ($('secret').value||'JBSWY3DPEHPK3PXP'); }
    function tick(){
      $('err').textContent='';
      try {
        var key=P.secretToBytes(b32(), $('ascii').checked);
        var code=P.totp(key,{digits:parseInt($('digits').value,10)||6, period:parseInt($('period').value,10)||30});
        $('code').textContent=code;
        var X=parseInt($('period').value,10)||30;
        var rem=X-Math.floor((Date.now()/1000)%X);
        $('bar').style.width=((rem/X)*100)+'%';
      } catch(e){ $('err').textContent=e.message; }
    }
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    ['secret','digits','period','ascii'].forEach(function(id){ $(id).addEventListener('input', tick); $(id).addEventListener('change', tick); });
    $('copy').addEventListener('click', function(){ copyText($('code').textContent); });
    $('reveal').addEventListener('click', function(){ var i=$('secret'); if(i.type==='password'){i.type='text';} else {i.type='password';} });
    $('secret').type='password';
    tick(); timer=setInterval(tick,1000);
  })();
}
</script>
