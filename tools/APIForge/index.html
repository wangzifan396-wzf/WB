<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>APIForge · 离线 REST / GraphQL 客户端</title>
<style>
  :root{
    --bg:#0A0A0B; --card:#141417; --card2:#1A1B1E; --line:rgba(255,255,255,0.08);
    --line2:rgba(255,255,255,0.14); --txt:#FFFFFF; --txt2:#A1A1AA; --txt3:#71717A;
    --acc:#5E6AD2; --ok:#10B981; --warn:#F5A623; --err:#EF4444;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.3px;}
  .brand .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--acc),#8b94f0);
    display:flex;align-items:center;justify-content:center;font-size:13px;}
  .brand small{color:var(--txt3);font-weight:500;}
  .spacer{flex:1;}
  .lang-btn{background:var(--card2);border:1px solid var(--line);color:var(--txt2);border-radius:8px;
    padding:6px 12px;cursor:pointer;font-size:13px;}
  .lang-btn:hover{border-color:var(--line2);color:var(--txt);}

  .reqbar{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center;}
  select{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:9px 10px;font-size:14px;}
  #url{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:9px 12px;font-size:14px;font-family:"SF Mono",Consolas,"Courier New",monospace;outline:none;}
  #url:focus{border-color:var(--acc);}
  .btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:9px 16px;cursor:pointer;font-size:14px;transition:transform .12s,background .12s,border-color .12s;}
  .btn:hover{border-color:var(--line2);transform:translateY(-1px);}
  .btn.primary{background:var(--acc);border-color:var(--acc);}
  .btn.primary:hover{background:#6b76e0;}
  .btn.ghost{background:transparent;}

  .tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto;}
  .tab{background:none;border:none;color:var(--txt2);padding:11px 14px;cursor:pointer;font-size:13.5px;
    border-bottom:2px solid transparent;white-space:nowrap;}
  .tab:hover{color:var(--txt);}
  .tab.active{color:var(--txt);border-bottom-color:var(--acc);}

  .panel-wrap{padding:14px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto;}
  .panel{display:none;}
  .panel.active{display:block;}
  .hint{color:var(--txt3);font-size:13px;}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  table.kv{width:100%;border-collapse:collapse;}
  table.kv td{padding:4px 6px;}
  table.kv input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:"SF Mono",Consolas,monospace;outline:none;}
  table.kv input:focus{border-color:var(--acc);}
  .kv-del{background:none;border:1px solid var(--line);color:var(--txt3);border-radius:6px;cursor:pointer;
    width:30px;height:30px;}
  .kv-del:hover{color:var(--err);border-color:var(--err);}
  .mini{font-size:12.5px;color:var(--txt2);background:var(--card2);border:1px solid var(--line);
    border-radius:7px;padding:6px 10px;cursor:pointer;}
  .mini:hover{border-color:var(--line2);color:var(--txt);}

  textarea.body{flex:1;width:100%;min-height:180px;resize:vertical;background:var(--bg);color:var(--txt);
    border:1px solid var(--line);border-radius:9px;padding:12px;font-family:"SF Mono",Consolas,monospace;
    font-size:13.5px;line-height:1.6;outline:none;}
  textarea.body:focus{border-color:var(--acc);}

  .radio{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
  .radio label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--txt2);}
  .auth-field{display:none;margin-bottom:8px;}
  .auth-field.show{display:block;}
  .auth-field input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:7px;padding:9px 11px;font-size:13.5px;outline:none;}
  .auth-field input:focus{border-color:var(--acc);}

  .res-head{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .pill{font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px;}
  .pill.ok{background:rgba(16,185,129,.14);color:var(--ok);}
  .pill.warn{background:rgba(245,166,35,.14);color:var(--warn);}
  .pill.err{background:rgba(239,68,68,.14);color:var(--err);}
  .pill.idle{background:var(--card2);color:var(--txt3);}
  .meta{color:var(--txt3);font-size:13px;}
  .res-tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--line);}
  .res-body-wrap{padding:14px 18px;height:calc(100% - 0px);}
  pre.res{flex:1;margin:0;white-space:pre-wrap;word-break:break-word;background:var(--bg);color:var(--txt);
    border:1px solid var(--line);border-radius:9px;padding:14px;font-family:"SF Mono",Consolas,monospace;
    font-size:13px;line-height:1.6;max-height:46vh;overflow:auto;}
  table.res-h{width:100%;border-collapse:collapse;font-family:"SF Mono",Consolas,monospace;font-size:13px;}
  table.res-h td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.res-h td:first-child{color:var(--txt3);width:34%;}

  .hist-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
    border-radius:9px;margin-bottom:8px;cursor:pointer;background:var(--card);}
  .hist-item:hover{border-color:var(--line2);}
  .hist-item .m{font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--acc);}
  .hist-item .u{flex:1;color:var(--txt2);font-family:"SF Mono",Consolas,monospace;font-size:12.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hist-item .t{color:var(--txt3);font-size:11.5px;}
  .hist-item .x{color:var(--txt3);cursor:pointer;padding:2px 6px;}
  .hist-item .x:hover{color:var(--err);}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--line2);padding:10px 18px;border-radius:10px;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:14px;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .split{display:flex;flex-direction:column;height:calc(100% - 113px);min-height:0;}
  .top-pane{display:flex;flex-direction:column;min-height:0;flex:1 1 50%;overflow:auto;}
  .bot-pane{display:flex;flex-direction:column;min-height:0;flex:1 1 50%;border-top:1px solid var(--line);}
  .gql-on{display:none;}
  .gql-on.show{display:block;}
  @media(max-width:760px){.split{flex-direction:column;}}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>

<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线 REST / GraphQL 客户端：请求构建、Bearer/Basic 鉴权、响应计时与体积、历史记录，零依赖。">
<style>.nt-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}

<body>
<h1 class="nt-sr-only">APIForge · 离线 REST / GraphQL 客户端</h1>
<header>
  <div class="brand"><span class="dot">⚡</span> nano·tools <small>/ APIForge</small></div>
  <div class="spacer"></div>
  <button class="lang-btn" id="langBtn">EN</button>
</header>

<div class="reqbar">
  <select id="method">
    <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option>
    <option>DELETE</option><option>HEAD</option><option>OPTIONS</option>
  </select>
  <input id="url" placeholder="https://api.example.com/v1/users" spellcheck="false" / aria-label="https://api.example.com/v1/users">
  <button class="btn primary" id="sendBtn" data-i18n="send">发送</button>
  <button class="btn ghost" id="saveBtn" data-i18n="save">保存</button>
</div>

<div class="split">
  <div class="top-pane">
    <div class="tabs">
      <button class="tab active" data-tab="params" data-i18n="params">参数</button>
      <button class="tab" data-tab="headers" data-i18n="headers">请求头</button>
      <button class="tab" data-tab="body" data-i18n="body">请求体</button>
      <button class="tab" data-tab="auth" data-i18n="auth">鉴权</button>
      <button class="tab" data-tab="history" data-i18n="history">历史</button>
    </div>
    <div class="panel-wrap" style="flex:1;min-height:0;">
      <!-- Params -->
      <div class="panel active" id="panel-params">
        <div class="row"><button class="mini" id="addParam" data-i18n="addRow">+ 添加行</button>
          <span class="hint" id="paramUrlHint"></span></div>
        <table class="kv" id="paramTable"></table>
      </div>
      <!-- Headers -->
      <div class="panel" id="panel-headers">
        <div class="row"><button class="mini" id="addHeader" data-i18n="addRow">+ 添加行</button></div>
        <table class="kv" id="headerTable"></table>
      </div>
      <!-- Body -->
      <div class="panel" id="panel-body">
        <div class="row" style="align-items:flex-start;flex-direction:column;gap:8px;">
          <label class="radio"><input type="radio" name="bodyType" value="none" checked /> <span data-i18n="bodyNone">无</span></label>
          <label class="radio"><input type="radio" name="bodyType" value="json" /> JSON</label>
          <label class="radio"><input type="radio" name="bodyType" value="text" /> Text</label>
          <label class="radio"><input type="radio" name="bodyType" value="xml" /> XML</label>
          <label class="radio"><input type="radio" name="bodyType" value="form" /> Form</label>
        </div>
        <label style="display:flex;align-items:center;gap:7px;margin-bottom:8px;color:var(--txt2);font-size:13px;">
          <input type="checkbox" id="gqlChk" /> <span data-i18n="gql">GraphQL 查询</span></label>
        <div class="gql-on" id="gqlBox">
          <div class="hint" data-i18n="gqlQuery">Query（graphql 字段）：</div>
          <textarea class="body" id="gqlQuery" placeholder="query { viewer { login } }"></textarea>
          <div class="hint" data-i18n="gqlVars">Variables（JSON，可选）：</div>
          <textarea class="body" id="gqlVars" placeholder='{ "id": 1 }' style="min-height:90px;"></textarea>
        </div>
        <textarea class="body" id="bodyText"></textarea>
      </div>
      <!-- Auth -->
      <div class="panel" id="panel-auth">
        <div class="radio">
          <label><input type="radio" name="authType" value="none" checked /> <span data-i18n="authNone">无</span></label>
          <label><input type="radio" name="authType" value="bearer" /> Bearer</label>
          <label><input type="radio" name="authType" value="basic" /> Basic</label>
        </div>
        <div class="auth-field" id="fBearer"><span class="hint" data-i18n="token">Token：</span>
          <input id="bearerToken" placeholder="eyJhbGciOi…" / aria-label="eyJhbGciOi…"></div>
        <div class="auth-field" id="fBasic">
          <span class="hint" data-i18n="user">User：</span>
          <input id="basicUser" placeholder="username" / aria-label="username">
          <span class="hint" data-i18n="pass">Password：</span>
          <input id="basicPass" type="password" placeholder="password" / aria-label="password">
        </div>
      </div>
      <!-- History -->
      <div class="panel" id="panel-history">
        <div class="row"><button class="mini" id="clearHist" data-i18n="clearHist">清空历史</button></div>
        <div id="histList"></div>
      </div>
    </div>
  </div>

  <div class="bot-pane">
    <div class="res-head">
      <span class="pill idle" id="statusPill" data-i18n="idle">待发送</span>
      <span class="meta" id="resMeta"></span>
    </div>
    <div class="res-tabs">
      <button class="tab active" data-restab="body" data-i18n="resBody">响应体</button>
      <button class="tab" data-restab="headers" data-i18n="resHeaders">响应头</button>
      <button class="tab" data-restab="raw" data-i18n="resRaw">原始</button>
    </div>
    <div class="res-body-wrap" style="flex:1;min-height:0;display:flex;flex-direction:column;">
      <pre class="res" id="resBody" style="flex:1;"></pre>
      <div class="panel" id="resHeaders" style="display:none;flex:1;overflow:auto;">
        <table class="res-h" id="resHeaderTable"></table>
      </div>
      <pre class="res" id="resRaw" style="display:none;flex:1;"></pre>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ===================== 应用逻辑 ===================== -->
<script>
var __LS=(function(){try{var s=(typeof window!=='undefined'&&window.localStorage)?window.localStorage:null;if(!s)throw 0;s.setItem('__lsprobe','1');s.removeItem('__lsprobe');return s;}catch(e){var m={};return{getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];},clear:function(){m={};},key:function(i){return Object.keys(m)[i]||null;}};}})();

/* ---------- 纯函数（供 node 单测，不依赖浏览器） ---------- */
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function validateUrl(u){
  try{ const x=new URL(u); return x.protocol==='http:'||x.protocol==='https:'; }
  catch(e){ return false; }
}

function parseUrlParams(url){
  const out={base:url, params:[]};
  const qi=url.indexOf('?');
  if(qi>=0){
    out.base=url.slice(0,qi);
    const qs=url.slice(qi+1);
    qs.split('&').forEach(pair=>{
      if(!pair) return;
      const eq=pair.indexOf('=');
      const k=decodeURIComponent(eq<0?pair:pair.slice(0,eq));
      const v=decodeURIComponent(eq<0?'':pair.slice(eq+1));
      out.params.push({k:k,v:v});
    });
  }
  return out;
}

function buildUrl(base, params){
  const ps=(params||[]).filter(p=>p.k!==''||p.v!=='');
  if(!ps.length) return base;
  const qs=ps.map(p=>encodeURIComponent(p.k)+'='+encodeURIComponent(p.v)).join('&');
  return base+(base.indexOf('?')>=0?'&':'?')+qs;
}

function parseHeaders(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const i=l.indexOf(':');
    if(i<0) return {k:l,v:''};
    return {k:l.slice(0,i).trim(), v:l.slice(i+1).trim()};
  });
}

function buildHeaders(headerArr, auth){
  const h={};
  (headerArr||[]).forEach(p=>{ if(p.k) h[p.k]=p.v; });
  if(auth && auth.type==='bearer' && auth.token){
    h['Authorization']='Bearer '+auth.token;
  }
  if(auth && auth.type==='basic' && auth.user){
    const raw=auth.user+':'+(auth.pass||'');
    const enc=(typeof btoa!=='undefined')?btoa(raw):Buffer.from(raw).toString('base64');
    h['Authorization']='Basic '+enc;
  }
  return h;
}

function getStatusClass(status){
  if(status>=200&&status<300) return 'ok';
  if(status>=300&&status<400) return 'warn';
  return 'err';
}

function formatDuration(ms){
  if(ms==null||isNaN(ms)) return '—';
  if(ms<1000) return Math.round(ms)+' ms';
  return (ms/1000).toFixed(2)+' s';
}

function formatBytes(n){
  if(n==null||isNaN(n)) return '—';
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}

function prettyJSON(text){
  try{ return JSON.stringify(JSON.parse(text), null, 2); }
  catch(e){ return null; }
}

const DEFAULT_HEADERS=[{k:'Content-Type',v:'application/json'}];

/* ---------- 导出（node 单测用） ---------- */
if(typeof module!=='undefined'&&module.exports){
  module.exports={escapeHTML,validateUrl,parseUrlParams,buildUrl,parseHeaders,
    buildHeaders,getStatusClass,formatDuration,formatBytes,prettyJSON,DEFAULT_HEADERS};
}

/* ---------- 以下仅浏览器执行 ---------- */
if(typeof window!=='undefined'){
  const I18N={
    zh:{send:'发送',save:'保存',params:'参数',headers:'请求头',body:'请求体',auth:'鉴权',history:'历史',
        addRow:'+ 添加行',bodyNone:'无',gql:'GraphQL 查询',gqlQuery:'Query（graphql 字段）：',gqlVars:'Variables（JSON，可选）：',
        token:'Token：',user:'User：',pass:'Password：',authNone:'无',clearHist:'清空历史',
        idle:'待发送',resBody:'响应体',resHeaders:'响应头',resRaw:'原始',
        sent:'已发送',saved:'已保存到历史',copied:'已复制',invalidUrl:'URL 非法（需 http/https）',
        noHist:'暂无历史记录',del:'删除',badJson:'Body 不是合法 JSON',sending:'请求中…'},
    en:{send:'Send',save:'Save',params:'Params',headers:'Headers',body:'Body',auth:'Auth',history:'History',
        addRow:'+ Add row',bodyNone:'None',gql:'GraphQL query',gqlQuery:'Query (graphql field):',gqlVars:'Variables (JSON, optional):',
        token:'Token:',user:'User:',pass:'Password:',authNone:'None',clearHist:'Clear history',
        idle:'Idle',resBody:'Body',resHeaders:'Headers',resRaw:'Raw',
        sent:'Sent',saved:'Saved to history',copied:'Copied',invalidUrl:'Invalid URL (need http/https)',
        noHist:'No history yet',del:'del',badJson:'Body is not valid JSON',sending:'Sending…'}
  };
  let lang=__LS.getItem('apiforge_lang')||'zh';
  const $=id=>document.getElementById(id);
  const t=k=>(I18N[lang]&&I18N[lang][k])||k;

  function applyLang(){
    document.documentElement.lang=lang==='zh'?'zh-CN':'en';
    document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
    $('langBtn').textContent=lang==='zh'?'EN':'中';
    document.title=lang==='zh'?'APIForge · 离线 REST / GraphQL 客户端':'APIForge · Offline REST / GraphQL Client';
  }
  let toastTimer;
  function toast(msg){
    $('toast').textContent=msg;$('toast').classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800);
  }

  // ---- 状态 ----
  let state={ params:[], headers:[{k:'',v:''}], bodyType:'none', body:'',
    auth:{type:'none',token:'',user:'',pass:''}, gql:false, gqlQuery:'', gqlVars:'' };

  // ---- KV 表格渲染 ----
  function renderKV(tableId, arr, onChange){
    const tbl=$(tableId);
    tbl.innerHTML='';
    arr.forEach((row,i)=>{
      const tr=document.createElement('tr');
      const td1=document.createElement('td'); const i1=document.createElement('input');
      i1.value=row.k; i1.placeholder='key';
      i1.addEventListener('input',()=>{arr[i].k=i1.value;onChange&&onChange();});
      const td2=document.createElement('td'); const i2=document.createElement('input');
      i2.value=row.v; i2.placeholder='value';
      i2.addEventListener('input',()=>{arr[i].v=i2.value;onChange&&onChange();});
      const td3=document.createElement('td'); const del=document.createElement('button');
      del.className='kv-del'; del.textContent='×';
      del.addEventListener('click',()=>{arr.splice(i,1);renderKV(tableId,arr,onChange);});
      td1.appendChild(i1); td2.appendChild(i2); td3.appendChild(del);
      tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(td3);
      tbl.appendChild(tr);
    });
  }
  function addKV(arr, tableId, onChange){
    arr.push({k:'',v:''}); renderKV(tableId,arr,onChange);
  }

  // ---- URL 与参数同步 ----
  function syncUrlFromParams(){
    const base=parseUrlParams($('url').value).base;
    $('url').value=buildUrl(base, state.params);
    updateParamHint();
  }
  function updateParamHint(){
    const p=parseUrlParams($('url').value).params;
    $('paramUrlHint').textContent=p.length?('? '+p.length+' 个参数'):'';
  }
  function loadParamsFromUrl(){
    const {params}=parseUrlParams($('url').value);
    state.params=params.length?params.map(p=>({k:p.k,v:p.v})):[{k:'',v:''}];
    renderKV('paramTable',state.params,syncUrlFromParams);
    updateParamHint();
  }

  // ---- 鉴权 UI ----
  function refreshAuthUI(){
    const ty=document.querySelector('input[name="authType"]:checked').value;
    state.auth.type=ty;
    $('fBearer').classList.toggle('show', ty==='bearer');
    $('fBasic').classList.toggle('show', ty==='basic');
    state.auth.token=$('bearerToken').value;
    state.auth.user=$('basicUser').value;
    state.auth.pass=$('basicPass').value;
  }

  // ---- Body 处理 ----
  function getBodyAndHeaders(){
    const headers=state.headers.filter(h=>h.k||h.v);
    if(state.gql){
      const q=state.gqlQuery;
      const payload={query:q};
      const v=state.gqlVars.trim();
      if(v){ try{ payload.variables=JSON.parse(v);}catch(e){} }
      return {body:JSON.stringify(payload), headers:headers, forcedType:'json'};
    }
    const bt=state.bodyType;
    if(bt==='none') return {body:undefined, headers:headers, forcedType:null};
    let body=state.body;
    if(bt==='json'){
      if(body.trim() && !prettyJSON(body)){ throw new Error('badJson'); }
      return {body:body, headers:headers, forcedType:'json'};
    }
    if(bt==='form'){
      const sp=state.body.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
        const i=l.indexOf('='); return i<0?[l,'']:[l.slice(0,i),l.slice(i+1)];
      });
      const fd=new URLSearchParams(); sp.forEach(([k,v])=>fd.append(k,v));
      return {body:fd.toString(), headers:headers, forcedType:'form'};
    }
    return {body:body, headers:headers, forcedType:bt};
  }

  // ---- 发送请求 ----
  async function send(){
    const url=($('url').value||'').trim();
    if(!validateUrl(url)){ toast(t('invalidUrl')); return; }
    let bh;
    try{ bh=getBodyAndHeaders(); }
    catch(e){ toast(t('badJson')); return; }
    const headers=buildHeaders(bh.headers, state.auth);
    // 自动补 content-type
    if(bh.forcedType==='json' && !headers['Content-Type']) headers['Content-Type']='application/json';
    if(bh.forcedType==='xml' && !headers['Content-Type']) headers['Content-Type']='application/xml';
    if(bh.forcedType==='form' && !headers['Content-Type']) headers['Content-Type']='application/x-www-form-urlencoded';

    const method=$('method').value;
    const opts={method, headers};
    if(method!=='GET'&&method!=='HEAD'&&bh.body!==undefined) opts.body=bh.body;

    $('statusPill').className='pill idle';
    $('statusPill').textContent=t('sending');
    $('resMeta').textContent='';
    const t0=performance.now();
    try{
      const resp=await fetch(url, opts);
      const ms=performance.now()-t0;
      const buf=await resp.arrayBuffer();
      const bytes=buf.byteLength;
      const text=new TextDecoder('utf-8').decode(buf);
      const cls=getStatusClass(resp.status);
      $('statusPill').className='pill '+cls;
      $('statusPill').textContent=resp.status+' '+(resp.statusText||'');
      $('resMeta').textContent=formatDuration(ms)+' · '+formatBytes(bytes);
      // body 显示
      const pretty=prettyJSON(text);
      $('resBody').textContent=pretty!==null?pretty:(text||'(empty)');
      $('resRaw').textContent=text||'(empty)';
      // 响应头
      const hdr=$('resHeaderTable'); hdr.innerHTML='';
      resp.headers.forEach((val,key)=>{
        const tr=document.createElement('tr');
        const td1=document.createElement('td');td1.textContent=key;
        const td2=document.createElement('td');td2.textContent=val;
        tr.appendChild(td1);tr.appendChild(td2);hdr.appendChild(tr);
      });
      switchResTab('body');
      pushHistory(method,url);
    }catch(e){
      const ms=performance.now()-t0;
      $('statusPill').className='pill err';
      $('statusPill').textContent='ERR';
      $('resMeta').textContent=formatDuration(ms);
      $('resBody').textContent=escapeHTML(String(e&&e.message?e.message:e));
      $('resRaw').textContent=String(e&&e.message?e.message:e);
      switchResTab('body');
    }
  }

  // ---- 响应 tab ----
  function switchResTab(which){
    document.querySelectorAll('[data-restab]').forEach(b=>b.classList.toggle('active',b.dataset.restab===which));
    $('resBody').style.display=which==='body'?'flex':'none';
    $('resHeaders').style.display=which==='headers'?'block':'none';
    $('resRaw').style.display=which==='raw'?'block':'none';
  }

  // ---- 历史 ----
  function getHistory(){
    try{ return JSON.parse(__LS.getItem('apiforge_history')||'[]'); }catch(e){ return []; }
  }
  function pushHistory(method,url){
    let h=getHistory();
    h=h.filter(x=>!(x.method===method&&x.url===url));
    h.unshift({method,url,ts:Date.now()});
    h=h.slice(0,30);
    __LS.setItem('apiforge_history',JSON.stringify(h));
    renderHistory();
  }
  function renderHistory(){
    const list=$('histList'); list.innerHTML='';
    const h=getHistory();
    if(!h.length){ list.innerHTML='<p class="hint">'+t('noHist')+'</p>'; return; }
    h.forEach((x,i)=>{
      const div=document.createElement('div'); div.className='hist-item';
      const m=document.createElement('span'); m.className='m'; m.textContent=x.method;
      const u=document.createElement('span'); u.className='u'; u.textContent=x.url;
      const tm=document.createElement('span'); tm.className='t';
      tm.textContent=new Date(x.ts).toLocaleString();
      const x2=document.createElement('span'); x2.className='x'; x2.textContent='×';
      x2.addEventListener('click',(ev)=>{ev.stopPropagation();let hh=getHistory();hh.splice(i,1);
        __LS.setItem('apiforge_history',JSON.stringify(hh));renderHistory();});
      div.appendChild(m);div.appendChild(u);div.appendChild(tm);div.appendChild(x2);
      div.addEventListener('click',()=>{ $('url').value=x.url; loadParamsFromUrl(); switchTab('history'); });
      list.appendChild(div);
    });
  }

  // ---- 顶部 tab ----
  function switchTab(which){
    document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===which));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    const map={params:'panel-params',headers:'panel-headers',body:'panel-body',auth:'panel-auth',history:'panel-history'};
    $(map[which]).classList.add('active');
  }

  // ---- 事件绑定 ----
  $('sendBtn').addEventListener('click',send);
  $('saveBtn').addEventListener('click',()=>{
    const url=($('url').value||'').trim();
    if(!validateUrl(url)){toast(t('invalidUrl'));return;}
    pushHistory($('method').value,url); toast(t('saved'));
  });
  $('langBtn').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';__LS.setItem('apiforge_lang',lang);applyLang();});
  $('addParam').addEventListener('click',()=>addKV(state.params,'paramTable',syncUrlFromParams));
  $('addHeader').addEventListener('click',()=>addKV(state.headers,'headerTable'));
  $('url').addEventListener('change',loadParamsFromUrl);
  $('clearHist').addEventListener('click',()=>{__LS.removeItem('apiforge_history');renderHistory();});
  document.querySelectorAll('.tab[data-tab]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  document.querySelectorAll('.tab[data-restab]').forEach(b=>b.addEventListener('click',()=>switchResTab(b.dataset.restab)));
  document.querySelectorAll('input[name="bodyType"]').forEach(r=>r.addEventListener('change',()=>{state.bodyType=r.value;}));
  document.querySelectorAll('input[name="authType"]').forEach(r=>r.addEventListener('change',refreshAuthUI));
  $('bearerToken').addEventListener('input',refreshAuthUI);
  $('basicUser').addEventListener('input',refreshAuthUI);
  $('basicPass').addEventListener('input',refreshAuthUI);
  $('gqlChk').addEventListener('change',e=>{state.gql=e.target.checked;$('gqlBox').classList.toggle('show',state.gql);});
  $('gqlQuery').addEventListener('input',e=>state.gqlQuery=e.target.value);
  $('gqlVars').addEventListener('input',e=>state.gqlVars=e.target.value);
  $('bodyText').addEventListener('input',e=>state.body=e.target.value);

  // ---- 启动 ----
  applyLang();
  renderKV('paramTable',state.params,syncUrlFromParams);
  renderKV('headerTable',state.headers);
  $('url').value='https://api.github.com/repos/wangzifan396-wzf/GraphForge';
  loadParamsFromUrl();
  refreshAuthUI();
  renderHistory();
  switchResTab('body');
  $('statusPill').textContent=t('idle');
}
</script>
