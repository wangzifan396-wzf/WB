body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;

/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<body>
<div class="app">
  <h1>MinhashForge</h1>
  <p class="sub">MinHash 签名 + Jaccard 估计：文档去重的核心草图 · 单文件 · 零依赖 · 本地优先</p>

<label>文档 A</label>
<textarea id="da" rows="3">the quick brown fox jumps over the lazy dog</textarea>
<label>文档 B</label>
<textarea id="db" rows="3">the quick brown fox leaps over the lazy cat</textarea>
<div class="grid2">
  <label>shingle 长度 k</label><input id="k" type="number" value="3" min="1" max="12">
  <label>哈希函数个数</label><input id="nh" type="number" value="128" min="16" max="512">
</div>
<div class="row">
  <button id="run">估算相似度</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入两段文本后估算</div>
<script>
function mhFnv1a(str, seed){
  var h=(0x811c9dc5 ^ (seed||0))>>>0;
  for(var i=0;i<str.length;i++){
    h=(h^str.charCodeAt(i))>>>0;
    h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0;
  }
  return h>>>0;
}
function mhShingles(text, k){
  var s=String(text).toLowerCase().replace(/\s+/g,' ').trim();
  var kk=Math.max(1, Math.floor(k||3));
  var set={};
  if(s.length<kk){ if(s) set[s]=true; return set; }
  for(var i=0;i+kk<=s.length;i++) set[s.substr(i,kk)]=true;
  return set;
}
function mhJaccard(setA, setB){
  var inter=0, uni=0, g;
  for(g in setA){ uni++; if(setB[g]) inter++; }
  for(g in setB){ if(!setA[g]) uni++; }
  return uni===0?1:inter/uni;
}
function mhSignature(set, numHashes){
  var n=Math.max(1, Math.floor(numHashes||128));
  var sig=new Array(n).fill(0xffffffff);
  var g;
  for(g in set){
    for(var i=0;i<n;i++){
      var h=mhFnv1a(g, i*0x9e3779b9>>>0);
      if(h<sig[i]) sig[i]=h;
    }
  }
  return sig;
}
function mhEstimate(sigA, sigB){
  if(!sigA||!sigB||sigA.length!==sigB.length||sigA.length===0)
    return { value:null, error:'签名长度不一致或为空' };
  var eq=0;
  for(var i=0;i<sigA.length;i++) if(sigA[i]===sigB[i]) eq++;
  return { value:eq/sigA.length, error:null };
}
function mhCompare(textA, textB, k, numHashes){
  var sa=mhShingles(textA,k), sb=mhShingles(textB,k);
  var exact=mhJaccard(sa,sb);
  var est=mhEstimate(mhSignature(sa,numHashes), mhSignature(sb,numHashes));
  if(est.error) return { value:null, error:est.error };
  return { value:{ exact:exact, estimate:est.value,
    shinglesA:Object.keys(sa).length, shinglesB:Object.keys(sb).length }, error:null };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { mhFnv1a:mhFnv1a, mhShingles:mhShingles, mhJaccard:mhJaccard,
    mhSignature:mhSignature, mhEstimate:mhEstimate, mhCompare:mhCompare };
}
if (typeof window !== 'undefined') {
  window.MinhashForgePure = { mhFnv1a:mhFnv1a, mhShingles:mhShingles, mhJaccard:mhJaccard,
    mhSignature:mhSignature, mhEstimate:mhEstimate, mhCompare:mhCompare };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.MinhashForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var r=P.mhCompare($('da').value, $('db').value, Number($('k').value), Number($('nh').value));
      if(r.error){ $('err').textContent=r.error; return; }
      var v=r.value;
      $('out').textContent=['shingles: A='+v.shinglesA+'  B='+v.shinglesB,
        '精确 Jaccard: '+v.exact.toFixed(4),
        'MinHash 估计: '+v.estimate.toFixed(4),
        '绝对误差: '+Math.abs(v.exact-v.estimate).toFixed(4)].join('\n');
    });
    $('clear').addEventListener('click', function(){ $('da').value=''; $('db').value=''; $('out').textContent='输入两段文本后估算'; });
  })();
}
</script>
