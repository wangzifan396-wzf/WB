:root{

  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}

.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}

     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}

<body>
<div class="app">
  <h1>TokenForge</h1>
  <p class="sub">LLM Token 估算与成本计算器：确定性子词分词 + 多模型单价表 · 单文件 · 零依赖 · 本地优先</p>

<label>待估算文本</label>
<textarea id="text" rows="4">def hello(name):
    return "hi " + name</textarea>
<label>模型（单价 / 百万 token）</label>
<select id="model">
  <option value="gpt-4o-mini">gpt-4o-mini (in 0.15 / out 0.60)</option>
  <option value="gpt-4o">gpt-4o (in 2.5 / out 10)</option>
  <option value="claude-3.5-sonnet">claude-3.5-sonnet (in 3 / out 15)</option>
  <option value="deepseek-chat">deepseek-chat (in 0.27 / out 1.1)</option>
  <option value="gemini-1.5-pro">gemini-1.5-pro (in 1.25 / out 5)</option>
</select>
<div class="row">
  <button id="run">估算</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入文本后估算 token 数与 API 成本</div>
<script>
// 确定性 GPT 风格子词近似分词（小写 + 4 字符分块 + 标点/空白独立成 token）
function tokenize(text){
  if(text==null) return [];
  var raw=String(text);
  var parts=raw.split(/(\s+)/);
  var toks=[];
  var PUNCT=/^[.,!?;:'"()\[\]{}<>\/\\@#$%^&*\-_=+~`|]$/;
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(p==='') continue;
    if(/^\s+$/.test(p)){ toks.push(p); continue; }
    var sub=p.split(/([.,!?;:'"()\[\]{}<>\/\\@#$%^&*\-_=+~`|])/).filter(function(x){return x.length;});
    for(var j=0;j<sub.length;j++){
      var s=sub[j];
      if(s.length===0) continue;
      if(PUNCT.test(s)){ toks.push(s); }
      else {
        var lower=s.toLowerCase(), k=0;
        while(k<lower.length){ toks.push(lower.slice(k,k+4)); k+=4; }
      }
    }
  }
  return toks;
}
function countTokens(text){ return tokenize(text).length; }
var PRICING={
  'gpt-4o-mini':{in:0.15,out:0.60},
  'gpt-4o':{in:2.5,out:10},
  'claude-3.5-sonnet':{in:3,out:15},
  'deepseek-chat':{in:0.27,out:1.1},
  'gemini-1.5-pro':{in:1.25,out:5}
};
function estimateCost(text, model){
  var t=countTokens(text);
  var p=PRICING[model]; if(!p) throw new Error('UNKNOWN_MODEL');
  return { tokens:t, inputCost:t*p.in/1e6, outputCost:t*p.out/1e6 };
}
function breakdown(text){
  var t=String(text||'');
  var words=(t.trim().match(/\S+/g)||[]).length;
  return { chars:t.length, words:words, estTokens:countTokens(t) };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { tokenize:tokenize, countTokens:countTokens, estimateCost:estimateCost, breakdown:breakdown, PRICING:PRICING };
}
if (typeof window !== 'undefined') {
  window.TokenForgePure = { tokenize:tokenize, countTokens:countTokens, estimateCost:estimateCost, breakdown:breakdown, PRICING:PRICING };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.TokenForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var m=$('model').value;
        var c=P.estimateCost($('text').value, m);
        var b=P.breakdown($('text').value);
        var p=P.PRICING[m];
        var lines=['估算 tokens: '+c.tokens,
                   '单价(in/out): $'+p.in+' / $'+p.out+' 每百万',
                   '输入成本: $'+c.inputCost.toExponential(3),
                   '输出成本: $'+c.outputCost.toExponential(3),
                   '字符: '+b.chars+'  词: '+b.words];
        $('out').textContent=lines.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('text').value=''; $('out').textContent='输入文本后估算 token 数与 API 成本'; });
  })();
}
</script>
