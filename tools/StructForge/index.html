<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StructForge — JSON 转 TypeScript / Go / Python / JSON Schema</title>
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:90px}
.preview svg{max-width:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.big{font:40px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线结构生成：粘贴 JSON 一键转 TypeScript interface / Go struct / Python dataclass / JSON Schema，嵌套自动拆分。">
</head>
<body>
<div class="app">
  <h1>StructForge</h1>
  <p class="sub">JSON 转 TypeScript / Go / Python / JSON Schema · 单文件 · 零依赖 · 本地优先</p>

<label for="in">JSON 输入</label>
<textarea id="in" rows="7" placeholder='{"name":"Alice","age":30,"tags":["a","b"]}'>{"name":"Alice","age":30,"active":true,"profile":{"city":"Beijing"},"tags":["x","y"]}</textarea>
<div class="row">
  <select id="target">
    <option value="ts">TypeScript interface</option>
    <option value="go">Go struct</option>
    <option value="py">Python dataclass</option>
    <option value="schema">JSON Schema</option>
  </select>
  <input id="root" type="text" value="Root" placeholder="根类型名" style="max-width:160px">
  <button id="run">生成</button>
  <button id="copy" class="ghost">复制结果</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">结果会显示在这里</div>
<script>
function pascal(s){
  return String(s).replace(/[_\-\s]+(.)?/g,function(_,c){return c?c.toUpperCase():'';})
                  .replace(/^(.)/,function(_,c){return c.toUpperCase();});
}
function inferTs(val,key,ints){
  if(val===null) return 'any';
  if(Array.isArray(val)){ if(!val.length) return 'any[]'; return inferTs(val[0],key,ints)+'[]'; }
  var t=typeof val;
  if(t==='number') return 'number';
  if(t==='boolean') return 'boolean';
  if(t==='string') return 'string';
  if(t==='object'){ var name=pascal(key); buildTs(val,name,ints); return name; }
  return 'any';
}
function buildTs(obj,name,ints){
  var lines=['export interface '+name+' {'];
  for(var k in obj){ if(!Object.prototype.hasOwnProperty.call(obj,k)) continue;
    lines.push('  '+k+': '+inferTs(obj[k],k,ints)+';'); }
  lines.push('}'); ints.push(lines.join('\n'));
}
function toTypeScript(obj,root){ var ints=[]; buildTs(obj,pascal(root||'Root'),ints); return ints.join('\n\n'); }
function goType(val,key,structs){
  if(val===null) return 'interface{}';
  if(Array.isArray(val)){ if(!val.length) return '[]interface{}'; return '[]'+goType(val[0],key,structs); }
  var t=typeof val;
  if(t==='number') return Number.isInteger(val)?'int':'float64';
  if(t==='boolean') return 'bool';
  if(t==='string') return 'string';
  if(t==='object'){ var name=pascal(key); buildGo(val,name,structs); return name; }
  return 'interface{}';
}
function buildGo(obj,name,structs){
  var lines=['type '+name+' struct {'];
  for(var k in obj){ if(!Object.prototype.hasOwnProperty.call(obj,k)) continue;
    lines.push('\t'+pascal(k)+' '+goType(obj[k],k,structs)+' `json:"'+k+'"`'); }
  lines.push('}'); structs.push(lines.join('\n'));
}
function toGoStruct(obj,root){ var s=[]; buildGo(obj,pascal(root||'Root'),s); return s.join('\n\n'); }
function pyType(val,key,classes){
  if(val===null) return 'Optional[Any]';
  if(Array.isArray(val)){ if(!val.length) return 'List[Any]'; return 'List['+pyType(val[0],key,classes)+']'; }
  var t=typeof val;
  if(t==='number') return Number.isInteger(val)?'int':'float';
  if(t==='boolean') return 'bool';
  if(t==='string') return 'str';
  if(t==='object'){ var name=pascal(key); buildPy(val,name,classes); return name; }
  return 'Any';
}
function buildPy(obj,name,classes){
  var lines=['@dataclass','class '+name+':'];
  var keys=[]; for(var k in obj){ if(Object.prototype.hasOwnProperty.call(obj,k)) keys.push(k); }
  if(!keys.length) lines.push('    pass');
  for(var i=0;i<keys.length;i++){ lines.push('    '+keys[i]+': '+pyType(obj[keys[i]],keys[i],classes)); }
  classes.push(lines.join('\n'));
}
function toPython(obj,root){ var c=[]; buildPy(obj,pascal(root||'Root'),c); return c.join('\n\n'); }
function schemaOf(val){
  if(val===null) return {type:'null'};
  if(Array.isArray(val)) return {type:'array', items: val.length?schemaOf(val[0]):{}};
  var t=typeof val;
  if(t==='number') return {type: Number.isInteger(val)?'integer':'number'};
  if(t==='boolean') return {type:'boolean'};
  if(t==='string') return {type:'string'};
  if(t==='object'){
    var props={}, req=[];
    for(var k in val){ if(!Object.prototype.hasOwnProperty.call(val,k)) continue; props[k]=schemaOf(val[k]); req.push(k); }
    var o={type:'object', properties:props}; if(req.length) o.required=req; return o;
  }
  return {};
}
function toJsonSchema(obj){ var s=schemaOf(obj); s['$schema']='http://json-schema.org/draft-07/schema#'; return s; }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { pascal:pascal, toTypeScript:toTypeScript, toGoStruct:toGoStruct, toPython:toPython, toJsonSchema:toJsonSchema };
}
if (typeof window !== 'undefined') {
  window.StructForgePure = { pascal:pascal, toTypeScript:toTypeScript, toGoStruct:toGoStruct, toPython:toPython, toJsonSchema:toJsonSchema };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.StructForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function run(){
      $('err').textContent='';
      try {
        var obj=JSON.parse($('in').value);
        var t=$('target').value, root=$('root').value||'Root', out;
        if(t==='ts') out=P.toTypeScript(obj,root);
        else if(t==='go') out='package main\n\n'+P.toGoStruct(obj,root);
        else if(t==='py') out='from dataclasses import dataclass\nfrom typing import List, Optional, Any\n\n'+P.toPython(obj,root);
        else out=JSON.stringify(P.toJsonSchema(obj),null,2);
        $('out').textContent=out;
      } catch(e){ $('err').textContent='JSON 解析失败：'+e.message; }
    }
    $('run').addEventListener('click', run);
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('out').textContent='结果会显示在这里'; });
    run();
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
