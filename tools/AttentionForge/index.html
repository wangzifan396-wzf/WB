body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}

/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}

<body>
<div class="app">
  <h1>AttentionForge</h1>
  <p class="sub">Transformer 注意力：缩放点积打分、softmax 归一化、因果掩码、多头切换、行熵与 Top-K 关注 · 单文件 · 零依赖 · 本地优先</p>

<label>输入句子（按空格切分为 token）</label>
<textarea id="src" rows="3" spellcheck="false"></textarea>
<div class="row">
  <label style="margin:0">注意力头</label>
  <select id="head" style="max-width:110px">
    <option value="0">Head 0</option><option value="1">Head 1</option>
    <option value="2">Head 2</option><option value="3">Head 3</option>
  </select>
  <label style="margin:0">维度</label>
  <input type="text" id="dim" value="8" style="max-width:80px">
  <label style="margin:0"><input type="checkbox" id="causal" checked> 因果掩码</label>
  <button id="run">计算注意力</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>
<div class="out" id="grid" style="overflow-x:auto"></div>
<div class="out" id="top"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>

function atTokenize(text){
  var raw=String(text||'').trim();
  if(!raw) return [];
  var parts=raw.split(/\s+/), out=[];
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    var m=p.match(/^([\w'\u4e00-\u9fa5-]+)([.,!?;:]*)$/);
    if(m){ out.push(m[1]); if(m[2]) for(var j=0;j<m[2].length;j++) out.push(m[2][j]); }
    else out.push(p);
  }
  return out;
}
function atHash(s, seed){
  var h=2166136261 ^ (seed||0);
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h>>>0)/4294967296;
}
function atEmbed(token, dim, seed){
  var v=[];
  for(var d=0; d<dim; d++) v.push(atHash(token+'#'+d, seed)*2-1);
  return v;
}
function atDot(a,b){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]*b[i]; return s; }
function atSoftmax(arr){
  if(!arr.length) return [];
  var mx=Math.max.apply(null, arr), ex=[], sum=0;
  for(var i=0;i<arr.length;i++){ var e=Math.exp(arr[i]-mx); ex.push(e); sum+=e; }
  for(var j=0;j<ex.length;j++) ex[j]=ex[j]/sum;
  return ex;
}
function atScores(tokens, head, dim, causal){
  dim = dim || 8;
  var n=tokens.length, emb=[], i, j;
  for(i=0;i<n;i++) emb.push(atEmbed(tokens[i], dim, (head||0)*7919+1));
  var scale=Math.sqrt(dim), rows=[];
  for(i=0;i<n;i++){
    var raw=[];
    for(j=0;j<n;j++){
      var s = atDot(emb[i], emb[j])/scale;
      if(i===j) s += 0.6;
      if(causal && j>i) s = -Infinity;
      raw.push(s);
    }
    var finite = raw.map(function(x){ return x===-Infinity ? -1e9 : x; });
    rows.push(atSoftmax(finite));
  }
  return rows;
}
function atRowEntropy(row){
  var h=0;
  for(var i=0;i<row.length;i++){ var p=row[i]; if(p>1e-12) h -= p*Math.log(p)/Math.LN2; }
  return Math.round(h*1000)/1000;
}
function atTopK(row, tokens, k){
  var pairs=[];
  for(var i=0;i<row.length;i++) pairs.push({ i:i, token:tokens[i], w:row[i] });
  pairs.sort(function(a,b){ return b.w-a.w || a.i-b.i; });
  return pairs.slice(0, k||3);
}
function atSummary(rows, tokens){
  if(!rows.length) return { error:'请输入至少一个 token' };
  var n=rows.length, colSum=new Array(n), i, j;
  for(i=0;i<n;i++) colSum[i]=0;
  var entTotal=0, diag=0;
  for(i=0;i<n;i++){
    entTotal += atRowEntropy(rows[i]);
    diag += rows[i][i];
    for(j=0;j<n;j++) colSum[j]+=rows[i][j];
  }
  var best=0;
  for(i=1;i<n;i++) if(colSum[i]>colSum[best]) best=i;
  return { error:null, tokens:n, avgEntropy:Math.round(entTotal/n*1000)/1000,
           selfWeight:Math.round(diag/n*1000)/1000,
           focusToken:tokens[best], focusScore:Math.round(colSum[best]/n*1000)/1000,
           maxEntropy:Math.round(Math.log(n)/Math.LN2*1000)/1000 };
}
function atCell(v){
  var t=Math.max(0, Math.min(1, v));
  return { alpha:Math.round(t*100)/100, label:(t*100).toFixed(1)+'%' };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { atTokenize:atTokenize, atHash:atHash, atEmbed:atEmbed, atDot:atDot,
    atSoftmax:atSoftmax, atScores:atScores, atRowEntropy:atRowEntropy, atTopK:atTopK,
    atSummary:atSummary, atCell:atCell };
}
if (typeof window !== 'undefined') {
  window.AttentionForgePure = { atTokenize:atTokenize, atHash:atHash, atEmbed:atEmbed, atDot:atDot,
    atSoftmax:atSoftmax, atScores:atScores, atRowEntropy:atRowEntropy, atTopK:atTopK,
    atSummary:atSummary, atCell:atCell };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.AttentionForgePure;
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function run(){
    var toks=P.atTokenize($('src').value);
    if(!toks.length){ $('err').textContent='请输入至少一个 token'; $('out').innerHTML=''; $('grid').innerHTML=''; $('top').innerHTML=''; return; }
    if(toks.length>24) toks=toks.slice(0,24);
    var dim=parseInt($('dim').value,10); if(!(dim>0)) dim=8;
    var rows=P.atScores(toks, parseInt($('head').value,10), dim, $('causal').checked);
    var s=P.atSummary(rows, toks);
    $('err').textContent = toks.length>=24 ? '已截断为前 24 个 token' : '';
    $('out').innerHTML='<div class="grid">'+
      '<div class="kv"><b>Token 数</b><span>'+s.tokens+'</span></div>'+
      '<div class="kv"><b>平均行熵</b><span>'+s.avgEntropy+' / '+s.maxEntropy+'</span></div>'+
      '<div class="kv"><b>平均自注意力</b><span>'+s.selfWeight+'</span></div>'+
      '<div class="kv"><b>最受关注 token</b><span>'+esc(s.focusToken)+' ('+s.focusScore+')</span></div></div>';
    var html='<table style="border-collapse:collapse;font:12px ui-monospace,Consolas,monospace"><tr><td></td>';
    for(var j=0;j<toks.length;j++) html+='<td style="padding:2px 4px;color:#A1A1AA;text-align:center">'+esc(toks[j])+'</td>';
    html+='</tr>';
    for(var i=0;i<rows.length;i++){
      html+='<tr><td style="padding:2px 6px;color:#A1A1AA;white-space:nowrap">'+esc(toks[i])+'</td>';
      for(var k=0;k<rows[i].length;k++){
        var c=P.atCell(rows[i][k]*rows[i].length*0.6);
        html+='<td title="'+c.label+'" style="width:22px;height:20px;background:rgba(94,106,210,'+c.alpha+');border:1px solid rgba(255,255,255,.06)"></td>';
      }
      html+='</tr>';
    }
    $('grid').innerHTML=html+'</table>';
    var last=P.atTopK(rows[rows.length-1], toks, 3), t='';
    for(var q=0;q<last.length;q++)
      t+='<div class="kv"><b>末位 token 关注 #'+(q+1)+'</b><span>'+esc(last[q].token)+' · '+(last[q].w*100).toFixed(1)+'%</span></div>';
    $('top').innerHTML=t;
  }
  $('run').addEventListener('click', run);
  $('head').addEventListener('change', run);
  $('causal').addEventListener('change', run);
  $('src').value='the cat sat on the mat because it was warm';
  run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
