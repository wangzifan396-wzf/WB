<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="app">
  <h1>EasingForge</h1>
  <p class="sub">缓动函数：linear/quad/cubic/sine 系列 + cubic-bezier 牛顿迭代求值，SVG 曲线预览 · 单文件 · 零依赖 · 本地优先</p>

<label>选择缓动曲线</label>
<select id="sel"></select>
<div class="row"><button id="draw">绘制曲线</button></div>
<div class="out" id="out" style="padding:0"><svg id="svg" viewBox="0 0 320 200" width="100%" height="200"></svg></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>

var EASINGS={
  linear:function(t){return t;},
  easeInQuad:function(t){return t*t;},
  easeOutQuad:function(t){return t*(2-t);},
  easeInOutQuad:function(t){return t<0.5?2*t*t:-1+(4-2*t)*t;},
  easeInCubic:function(t){return t*t*t;},
  easeOutCubic:function(t){return (--t)*t*t+1;},
  easeInOutCubic:function(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;},
  easeInSine:function(t){return 1-Math.cos(t*Math.PI/2);},
  easeOutSine:function(t){return Math.sin(t*Math.PI/2);},
  easeInOutSine:function(t){return -(Math.cos(Math.PI*t)-1)/2;}
};
function easingFn(name,t){ var f=EASINGS[name]; if(!f) return t; return f(t); }
function bezier(x1,y1,x2,y2,t){
  if(x1===y1 && x2===y2) return t;
  function A(a,b){return 1-3*b+3*a;} function B(a,b){return 3*b-6*a;} function C(a){return 3*a;}
  function calc(t,a,b){return ((A(a,b)*t+B(a,b))*t+C(a))*t;}
  function slope(t,a,b){return 3*A(a,b)*t*t+2*B(a,b)*t+C(a);}
  function tForX(x){ var t=x; for(var i=0;i<8;i++){ var xs=calc(t,x1,x2)-x; var d=slope(t,x1,x2); if(Math.abs(d)<1e-6)break; t-=xs/d; } return t; }
  return calc(tForX(t),y1,y2);
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { easingFn:easingFn, bezier:bezier, EASINGS:EASINGS }; }
if (typeof window !== 'undefined') { window.EasingForgePure = { easingFn:easingFn, bezier:bezier, EASINGS:EASINGS }; }

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.EasingForgePure;
  var names=Object.keys(P.EASINGS);
  var sel=$('sel');
  for(var i=0;i<names.length;i++){ var o=document.createElement('option'); o.value=names[i]; o.textContent=names[i]; sel.appendChild(o); }
  function draw(){
    var name=sel.value;
    var pts=[];
    for(var i=0;i<=40;i++){ var t=i/40; var y=P.easingFn(name,t); pts.push((t*300+10).toFixed(1)+','+(180-y*160).toFixed(1)); }
    $('svg').innerHTML='<line x1="10" y1="180" x2="310" y2="180" stroke="rgba(255,255,255,.14)"/><line x1="10" y1="20" x2="10" y2="180" stroke="rgba(255,255,255,.14)"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="#5E6AD2" stroke-width="2"/><text x="14" y="40" fill="#A1A1AA" font-size="12">'+name+'</text>';
  }
  $('draw').addEventListener('click', draw);
  draw();
})();

</script>
