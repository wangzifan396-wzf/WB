<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>ArgForge — 命令行参数解析：options/flags/位置参数，支持短旗与取反</title>
<meta property="og:title" content="ArgForge">
<meta property="og:description" content="命令行参数解析：options/flags/位置参数，支持短旗与取反">
<meta property="og:image" content="./og.png">
<meta name="description" content="命令行参数解析：options/flags/位置参数，支持短旗与取反 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="app">
  <h1>ArgForge</h1>
  <p class="sub">命令行参数解析：options/flags/位置参数，支持短旗与取反 · 单文件 · 零依赖 · 本地优先</p>

<label>argv（空格分隔，可含引号）</label>
<textarea id="argv" rows="3">node --port 8080 --watch -vxz file.txt --no-color --name=foo</textarea>
<div class="row">
  <button id="run">解析</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">解析命令行参数为 options / flags / 位置参数</div>
<script>
function parseArgs(argv, opts){
  opts=opts||{};
  var result={options:{}, flags:{}, positionals:[]};
  var i=opts.skipFirst?1:0;
  for(; i<argv.length; i++){
    var a=String(argv[i]);
    if(a.indexOf('--')===0){
      var body=a.slice(2);
      if(body.indexOf('no-')===0){ result.flags[body.slice(3)]=false; continue; }
      if(body.indexOf('=')>=0){ var kv=body.split('='); result.options[kv[0]]=kv.slice(1).join('='); continue; }
      if(i+1<argv.length && String(argv[i+1]).indexOf('-')!==0){ result.options[body]=String(argv[i+1]); i++; }
      else { result.flags[body]=true; }
    } else if(a.indexOf('-')===0 && a.length>1){
      var shorts=a.slice(1).split('');
      for(var s=0;s<shorts.length;s++){ result.flags[shorts[s]]=true; }
    } else { result.positionals.push(a); }
  }
  return result;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parseArgs:parseArgs };
}
if (typeof window !== 'undefined') {
  window.ArgForgePure = { parseArgs:parseArgs };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.ArgForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var argv=$('argv').value.match(/"[^"]*"|'[^']*'|\S+/g).map(function(x){ return x.replace(/^["']|["']$/g,''); });
        var r=P.parseArgs(argv, {skipFirst:true});
        var lines=['options: '+JSON.stringify(r.options),
                   'flags: '+JSON.stringify(r.flags),
                   'positionals: '+JSON.stringify(r.positionals)];
        $('out').textContent=lines.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('argv').value=''; $('out').textContent='解析命令行参数为 options / flags / 位置参数'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
</body>
</html>
