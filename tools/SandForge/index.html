/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}

.seg button{border-radius:0;box-shadow:none}

.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);

:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){

<div class="app">
  <h1>SandForge</h1>
  <p class="sub">落沙模拟：元胞自动机，沙粒受重力下落/斜滑，遇墙堆积，可绘制沙与障碍物，实时观察堆积形态，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <button id="play">暂停/继续</button>
  <button id="clear" class="ghost">清空</button>
  <label style="flex:1;">笔刷
    <select id="brush"><option value="1">沙</option><option value="2">墙</option><option value="0">橡皮</option></select>
  </label>
</div>
<canvas id="cv" width="450" height="300" style="width:100%;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;cursor:crosshair;"></canvas>
<script>
function sandInit(w,h){ return {w:w,h:h,cells:new Int8Array(w*h)}; }
function sandSet(s,x,y,v){ if(x>=0&&x<s.w&&y>=0&&y<s.h) s.cells[y*s.w+x]=v; }
function sandCount(s){ var c=0; for(var i=0;i<s.cells.length;i++) if(s.cells[i]===1) c++; return c; }
function sandStep(s){
  var w=s.w,h=s.h,cells=s.cells,nc=Int8Array.from(cells);
  for(var y=h-1;y>=0;y--){ for(var x=0;x<w;x++){ var i=y*w+x; if(cells[i]!==1) continue;
    if(y+1<h){ var d=cells[(y+1)*w+x];
      if(d===0){ nc[i]=0; nc[(y+1)*w+x]=1; continue; }
      var dl = x>0 ? cells[(y+1)*w+x-1] : 9;
      var dr = x<w-1 ? cells[(y+1)*w+x+1] : 9;
      if(dl===0 && dr===0){ if(((x+(y&1))&1)===0){ nc[i]=0; nc[(y+1)*w+x-1]=1; } else { nc[i]=0; nc[(y+1)*w+x+1]=1; } }
      else if(dl===0){ nc[i]=0; nc[(y+1)*w+x-1]=1; }
      else if(dr===0){ nc[i]=0; nc[(y+1)*w+x+1]=1; }
    }
  } }
  return {w:w,h:h,cells:nc};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { sandInit:sandInit, sandSet:sandSet, sandCount:sandCount, sandStep:sandStep };
}
if (typeof window !== 'undefined') {
  window.SandForgePure = { sandInit:sandInit, sandSet:sandSet, sandCount:sandCount, sandStep:sandStep };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.SandForgePure;
    var GW=150, GH=100, W=450, H=300, state=P.sandInit(GW,GH), playing=true;
    function draw(){
      var cv=$('cv'); var ctx=cv.getContext('2d'); if(!ctx) return;
      var sx=W/GW, sy=H/GH;
      ctx.fillStyle='#0A0A0B'; ctx.fillRect(0,0,W,H);
      for(var y=0;y<GH;y++){ for(var x=0;x<GW;x++){ var v=state.cells[y*GW+x]; if(v===0) continue; ctx.fillStyle = v===1 ? '#E0C068' : '#5A5A66'; ctx.fillRect(x*sx,y*sy,sx+1,sy+1); } }
    }
    function frame(){ if(playing){ state=P.sandStep(state); draw(); } if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame); }
    function paint(e){ var r=$('cv').getBoundingClientRect(); var gx=Math.floor((e.clientX-r.left)/r.width*GW), gy=Math.floor((e.clientY-r.top)/r.height*GH); var v=Number($('brush').value); for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++) P.sandSet(state,gx+dx,gy+dy,v); draw(); }
    $('play').addEventListener('click', function(){ playing=!playing; });
    $('clear').addEventListener('click', function(){ state=P.sandInit(GW,GH); draw(); });
    $('cv').addEventListener('mousedown', paint);
    $('cv').addEventListener('mousemove', function(e){ if(e.buttons&1) paint(e); });
    draw(); frame();
  })();
}
</script>
