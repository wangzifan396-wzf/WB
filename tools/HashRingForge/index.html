<body>
<div class="app">
  <h1>HashRingForge</h1>
  <p class="sub">一致性哈希环：稳定 key 路由，分布式缓存 / 分片 / 负载均衡 · 单文件 · 零依赖 · 本地优先</p>

<label>节点（逗号分隔）</label>
<input id="nodes" type="text" value="node-a,node-b,node-c">
<label>虚拟节点数（每节点）</label>
<input id="rep" type="number" value="100" min="1">
<label>查询 key</label>
<input id="key" type="text" value="user-42">
<div class="row">
  <button id="run">定位节点</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">填入节点后运行</div>
<script>
function hashStr(str){
  var h=0x811c9dc5;
  for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193)>>>0; }
  return h>>>0;
}
function ringCreate(nodes, replicas){
  replicas=replicas||100;
  var ring={ replicas:replicas, keys:[], map:{} };
  for(var n=0;n<nodes.length;n++) ringAddNode(ring, nodes[n]);
  return ring;
}
function ringAddNode(ring, node){
  for(var i=0;i<ring.replicas;i++){
    var vh=hashStr(node + '#' + i);
    ring.map[vh]=node;
    ring.keys.push(vh);
  }
  ring.keys.sort(function(a,b){return a-b;});
  return ring;
}
function ringRemoveNode(ring, node){
  var keep=[];
  for(var i=0;i<ring.keys.length;i++){
    var key=ring.keys[i];
    if(ring.map[key]!==node) keep.push(key);
    else delete ring.map[key];
  }
  ring.keys=keep;
  return ring;
}
function ringGet(ring, key){
  var h=hashStr(key);
  var keys=ring.keys;
  var lo=0, hi=keys.length;
  while(lo<hi){ var mid=(lo+hi)>>1; if(keys[mid]<h) lo=mid+1; else hi=mid; }
  var idx = lo<keys.length ? lo : 0;
  return ring.map[keys[idx]];
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { hashStr:hashStr, ringCreate:ringCreate, ringAddNode:ringAddNode, ringRemoveNode:ringRemoveNode, ringGet:ringGet };
}
if (typeof window !== 'undefined') {
  window.HashRingForgePure = { hashStr:hashStr, ringCreate:ringCreate, ringAddNode:ringAddNode, ringRemoveNode:ringRemoveNode, ringGet:ringGet };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.HashRingForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var nodes=$('nodes').value.split(',').map(function(x){return x.trim();}).filter(Boolean);
        var rep=Number($('rep').value);
        var ring=P.ringCreate(nodes,rep);
        var node=P.ringGet(ring,$('key').value.trim());
        $('out').textContent='\u73af\u4e0a\u6709 '+ring.keys.length+' \u4e2a\u865a\u62df\u8282\u70b9\n\u300c'+$('key').value+'\u300d \u2192 '+node;
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('out').textContent='\u586b\u5165\u8282\u70b9\u540e\u8fd0\u884c'; });
  })();
}
</script>
