<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarcodeForge — 一维条码生成器</title>
<style>
  :root{
    --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
    --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
  .app{width:100%;max-width:700px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
  input[type=text],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
       color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  textarea{resize:vertical}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .out{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;text-align:center}
  .out svg{max-width:100%;height:auto}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .badge.flag{color:#fff;background:var(--accent);border-color:transparent}
  .err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
  footer{margin-top:20px;color:var(--dim);font-size:12px}
  a{color:var(--info);text-decoration:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线一维条码生成器：Code 128 / EAN-13 / UPC-A（含校验位），矢量 SVG 导出，零依赖。">
</head>
<body>
<div class="app">
  <h1>BarcodeForge</h1>
  <p class="sub">一维条码生成器 (Code 128 / EAN-13 / UPC-A) · 单文件 · 零依赖 · 本地优先</p>

  <label for="text">内容</label>
  <input id="text" type="text" placeholder="文本 / 数字串" value="HELLO-WORLD-123">
  <div class="row">
    <select id="sym">
      <option value="CODE128">Code 128 (任意文本)</option>
      <option value="EAN13">EAN-13 (13 位数字)</option>
      <option value="UPCA">UPC-A (12 位数字)</option>
    </select>
    <button id="gen">生成</button>
    <button id="copy" class="ghost">复制 SVG</button>
  </div>
  <div class="err" id="err"></div>

  <label>条码</label>
  <div class="out" id="out" aria-live="polite">生成后显示在这里</div>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>

  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>

<script>
/* ===== 纯函数区（第一个无属性 script）：可被 Node _test.js 提取并断言 ===== */
// Code 128 图案表（符号 0..106，6 元素宽度，停符 7 元素）
var C128 = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213',
'221312','231212','112232','122132','122231','113222','123122','123221','223211','221132',
'221231','213212','223112','312131','311222','321122','321221','312212','322112','322211',
'212123','212321','232121','111323','131123','131321','112313','132113','132311','211313',
'231113','231311','112133','112331','132131','113123','113321','133121','313121','211331',
'231131','213113','213311','213131','311123','311321','331121','312113','312311','332111',
'314111','221411','431111','111224','111422','121124','121421','141122','141221','112214',
'112412','122114','122411','142112','142211','241211','221114','413111','241112','134111',
'111242','121142','121241','114212','124112','124211','411212','421112','421211','212141',
'214121','214211','412121','111143','111341','131141','114113','114311','411113','411311',
'113141','114131','311141','411131','211412','211214','2331112'];

function expandPattern(p){
  var mods='', i;
  for(i=0;i<p.length;i++){
    var ch = (i % 2 === 0) ? '1' : '0';
    mods += ch.repeat(parseInt(p[i],10));
  }
  return mods;
}
function code128B(text){
  var vals=[105], i;
  for(i=0;i<text.length;i++){
    var c=text.charCodeAt(i);
    var v = (c>=32 && c<=126) ? (c-32) : 31; // 31 = '?'
    vals.push(v);
  }
  var sum=105;
  for(i=0;i<text.length;i++) sum += (i+1)*vals[i+1];
  vals.push(sum % 103);
  vals.push(106);
  var mods='';
  for(i=0;i<vals.length;i++) mods += expandPattern(C128[vals[i]]);
  return { modules: mods, text: text };
}
// EAN-13: 返回 13 位（含校验位），校验位缺失时计算
function ean13Checksum(d12){
  var s=0;
  for(var i=0;i<12;i++){
    var d=parseInt(d12[i],10);
    s += (i % 2 === 0) ? d : d*3; // i 从 0 起：奇位×1，偶位×3
  }
  return (10 - (s % 10)) % 10;
}
var EAN_L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
var EAN_G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
var EAN_R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
var EAN_PARITY = ['AAAAAA','AABABB','AABBAB','AABBBA','ABAABB','ABBAAB','ABBBAA','ABABAB','ABABBA','ABBABA'];
function ean13(input){
  var d = String(input).replace(/\D/g,'');
  if(d.length === 12) d = d + ean13Checksum(d);
  if(d.length !== 13) return null;
  var first = parseInt(d[0],10);
  var mods = '101'; // 起始保护
  for(var i=1;i<=6;i++){
    var v = parseInt(d[i],10);
    mods += (EAN_PARITY[first][i-1] === 'A') ? EAN_L[v] : EAN_G[v];
  }
  mods += '01010'; // 中间保护
  for(var j=7;j<=12;j++){
    mods += EAN_R[parseInt(d[j],10)];
  }
  mods += '101'; // 结束保护
  return { modules: mods, text: d };
}
function upca(input){
  var d = String(input).replace(/\D/g,'');
  if(d.length === 11) d = d + ean13Checksum('0'+d);
  if(d.length === 12) d = '0' + d; // 转为 EAN-13（首位 0）
  if(d.length !== 13) return null;
  var r = ean13(d);
  if(!r) return null;
  // UPC-A 标签：首数字在左、末数字在右（视觉约定）
  return { modules: r.modules, text: r.text.slice(1), upcaLabel: d.slice(1,7)+' '+d.slice(7,12) };
}
function escapeXml(s){
  return String(s).replace(/[<>&'"]/g, function(c){
    return {'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c];
  });
}
function renderSvg(modules, label, opts){
  opts = opts || {};
  var mw = opts.moduleWidth || 3, height = opts.height || 110, qz = opts.quiet || 10;
  var totalMods = modules.length + qz*2;
  var width = totalMods * mw;
  var bars='', x = qz*mw, i;
  for(i=0;i<modules.length;i++){
    if(modules[i]==='1') bars += '<rect x="'+x+'" y="0" width="'+mw+'" height="'+height+'" fill="#0A0A0B"/>';
    x += mw;
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+(height+28)+'" viewBox="0 0 '+width+' '+(height+28)+'">'
    + '<rect x="0" y="0" width="'+width+'" height="'+(height+28)+'" fill="#FFFFFF"/>'
    + bars
    + '<text x="'+(width/2)+'" y="'+(height+20)+'" text-anchor="middle" font-family="monospace" font-size="16" fill="#0A0A0B">'+escapeXml(label)+'</text>'
    + '</svg>';
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { C128:C128, expandPattern:expandPattern, code128B:code128B, ean13Checksum:ean13Checksum,
    ean13:ean13, upca:upca, renderSvg:renderSvg };
}
if (typeof window !== 'undefined') {
  window.BarcodeForgePure = { C128:C128, expandPattern:expandPattern, code128B:code128B, ean13Checksum:ean13Checksum,
    ean13:ean13, upca:upca, renderSvg:renderSvg };
}
</script>

<script>
/* ===== UI 区（第二个 script）：仅在浏览器中运行 ===== */
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.BarcodeForgePure;
    function setErr(e){ $('err').textContent = e || ''; }
    function gen(){
      setErr('');
      var sym=$('sym').value, text=$('text').value;
      var res=null;
      if(sym==='CODE128'){
        if(!text){ setErr('请输入要编码的文本'); return; }
        res=P.code128B(text);
      } else if(sym==='EAN13'){
        var d=text.replace(/\D/g,'');
        if(d.length!==12 && d.length!==13){ setErr('EAN-13 需要 12 或 13 位数字'); return; }
        res=P.ean13(d);
      } else if(sym==='UPCA'){
        var u=text.replace(/\D/g,'');
        if(u.length!==11 && u.length!==12){ setErr('UPC-A 需要 11 或 12 位数字'); return; }
        res=P.upca(u);
      }
      if(!res){ setErr('内容无法编码'); return; }
      var label = res.upcaLabel || res.text;
      $('out').innerHTML = P.renderSvg(res.modules, label, {moduleWidth:3});
    }
    function copy(){
      var svg=$('out').querySelector('svg');
      if(!svg) return;
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(svg.outerHTML);
      else { var ta=document.createElement('textarea'); ta.value=svg.outerHTML; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    $('gen').addEventListener('click', gen);
    $('copy').addEventListener('click', copy);
    gen();
  })();
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
