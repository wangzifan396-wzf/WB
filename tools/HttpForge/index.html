<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HttpForge — 离线 HTTP 速查：状态码 / 方法 / MIME</title>
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:90px}
.preview svg{max-width:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.big{font:40px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线 HTTP 速查：状态码（1xx-5xx 可搜索）/ 请求方法特性 / 常见 MIME 类型。">
</head>
<body>
<div class="app">
  <h1>HttpForge</h1>
  <p class="sub">离线 HTTP 速查：状态码 / 方法 / MIME · 单文件 · 零依赖 · 本地优先</p>

<label for="q">搜索状态码 / 名称（如 404、not found、429）</label>
<input id="q" type="text" placeholder="留空显示全部" value="">
<div class="row">
  <select id="tab">
    <option value="status">状态码</option>
    <option value="method">请求方法</option>
    <option value="mime">MIME 类型</option>
  </select>
  <button id="run">查询</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>结果</label>
<div class="out" id="out" aria-live="polite">结果会显示在这里</div>
<script>
var STATUS = {
  100:'Continue',101:'Switching Protocols',102:'Processing',103:'Early Hints',
  200:'OK',201:'Created',202:'Accepted',203:'Non-Authoritative Information',204:'No Content',205:'Reset Content',206:'Partial Content',
  300:'Multiple Choices',301:'Moved Permanently',302:'Found',303:'See Other',304:'Not Modified',307:'Temporary Redirect',308:'Permanent Redirect',
  400:'Bad Request',401:'Unauthorized',402:'Payment Required',403:'Forbidden',404:'Not Found',405:'Method Not Allowed',406:'Not Acceptable',407:'Proxy Authentication Required',408:'Request Timeout',409:'Conflict',410:'Gone',411:'Length Required',412:'Precondition Failed',413:'Payload Too Large',414:'URI Too Long',415:'Unsupported Media Type',416:'Range Not Satisfiable',417:'Expectation Failed',418:"I'm a teapot",422:'Unprocessable Entity',425:'Too Early',426:'Upgrade Required',428:'Precondition Required',429:'Too Many Requests',431:'Request Header Fields Too Large',451:'Unavailable For Legal Reasons',
  500:'Internal Server Error',501:'Not Implemented',502:'Bad Gateway',503:'Service Unavailable',504:'Gateway Timeout',505:'HTTP Version Not Supported',507:'Insufficient Storage',508:'Loop Detected',511:'Network Authentication Required'
};
var CAT = {'1':'1xx 信息','2':'2xx 成功','3':'3xx 重定向','4':'4xx 客户端错误','5':'5xx 服务端错误'};
function statusCategory(code){ code=parseInt(code,10); if(!code) return ''; return CAT[String(code)[0]]||''; }
function lookupStatus(code){
  code=parseInt(code,10); var text=STATUS[code];
  if(!text) return null;
  return { code:code, text:text, category:statusCategory(code) };
}
function searchStatus(query){
  query=String(query||'').trim().toLowerCase();
  var out=[];
  for(var k in STATUS){
    if(!STATUS.hasOwnProperty(k)) continue;
    var code=parseInt(k,10), text=STATUS[k];
    if(!query || String(code).indexOf(query)>=0 || text.toLowerCase().indexOf(query)>=0){
      out.push({ code:code, text:text, category:statusCategory(code) });
    }
  }
  out.sort(function(a,b){ return a.code-b.code; });
  return out;
}
var METHODS = [
  {name:'GET',safe:true,idempotent:true,body:false,desc:'获取资源，不应产生副作用'},
  {name:'HEAD',safe:true,idempotent:true,body:false,desc:'同 GET 但只返回响应头'},
  {name:'POST',safe:false,idempotent:false,body:true,desc:'提交数据 / 创建资源'},
  {name:'PUT',safe:false,idempotent:true,body:true,desc:'整体替换资源'},
  {name:'PATCH',safe:false,idempotent:false,body:true,desc:'局部更新资源'},
  {name:'DELETE',safe:false,idempotent:true,body:false,desc:'删除资源'},
  {name:'OPTIONS',safe:true,idempotent:true,body:false,desc:'查询支持的方法 / CORS 预检'},
  {name:'CONNECT',safe:false,idempotent:false,body:false,desc:'建立隧道（代理）'},
  {name:'TRACE',safe:true,idempotent:true,body:false,desc:'回显请求用于诊断'}
];
var MIME = {
  'json':'application/json','xml':'application/xml','html':'text/html','htm':'text/html','css':'text/css',
  'js':'text/javascript','mjs':'text/javascript','txt':'text/plain','csv':'text/csv','md':'text/markdown',
  'png':'image/png','jpg':'image/jpeg','jpeg':'image/jpeg','gif':'image/gif','webp':'image/webp','svg':'image/svg+xml','ico':'image/x-icon',
  'pdf':'application/pdf','zip':'application/zip','gz':'application/gzip','tar':'application/x-tar',
  'mp3':'audio/mpeg','wav':'audio/wav','mp4':'video/mp4','webm':'video/webm','woff':'font/woff','woff2':'font/woff2','ttf':'font/ttf',
  'wasm':'application/wasm','yaml':'application/yaml','yml':'application/yaml'
};
function lookupMime(ext){ ext=String(ext||'').trim().toLowerCase().replace(/^\./,''); return MIME[ext]||null; }
function searchMime(query){
  query=String(query||'').trim().toLowerCase();
  var out=[];
  for(var k in MIME){ if(!MIME.hasOwnProperty(k)) continue;
    if(!query || k.indexOf(query)>=0 || MIME[k].toLowerCase().indexOf(query)>=0) out.push({ext:k,mime:MIME[k]});
  }
  out.sort(function(a,b){ return a.ext<b.ext?-1:1; });
  return out;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { STATUS:STATUS, statusCategory:statusCategory, lookupStatus:lookupStatus, searchStatus:searchStatus, METHODS:METHODS, MIME:MIME, lookupMime:lookupMime, searchMime:searchMime };
}
if (typeof window !== 'undefined') {
  window.HttpForgePure = { STATUS:STATUS, statusCategory:statusCategory, lookupStatus:lookupStatus, searchStatus:searchStatus, METHODS:METHODS, MIME:MIME, lookupMime:lookupMime, searchMime:searchMime };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.HttpForgePure;
    function run(){
      var q=$('q').value, tab=$('tab').value; $('err').textContent='';
      var lines=[];
      if(tab==='status'){
        var r=P.searchStatus(q);
        if(!r.length){ $('out').textContent='无匹配状态码'; return; }
        r.forEach(function(s){ lines.push(s.code+'  '+s.text+'   ['+s.category+']'); });
      } else if(tab==='method'){
        P.METHODS.forEach(function(m){
          if(q && m.name.toLowerCase().indexOf(q.trim().toLowerCase())<0) return;
          lines.push(m.name+'   安全:'+(m.safe?'是':'否')+'  幂等:'+(m.idempotent?'是':'否')+'  请求体:'+(m.body?'常有':'一般无')+'\n    '+m.desc);
        });
        if(!lines.length) lines.push('无匹配方法');
      } else {
        var mr=P.searchMime(q);
        if(!mr.length){ $('out').textContent='无匹配 MIME'; return; }
        mr.forEach(function(x){ lines.push('.'+x.ext+'   →   '+x.mime); });
      }
      $('out').textContent=lines.join('\n');
    }
    $('run').addEventListener('click', run);
    $('q').addEventListener('input', run);
    $('tab').addEventListener('change', run);
    $('clear').addEventListener('click', function(){ $('q').value=''; run(); });
    run();
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>

</body>
</html>
