<label>图灵机定义（tape / start / accept / reject / 转移 q,s -> q',w,D）</label>
<textarea id="spec" rows="9" spellcheck="false">tape: 1011
start: q0
accept: qa
reject: qr
q0,1 -> q0,1,R
q0,0 -> q0,0,R
q0,_ -> q1,_,L
q1,0 -> qa,1,L
q1,1 -> q1,0,L
q1,_ -> qa,1,L</textarea>
<label>最大步数</label>
<input id="max" type="number" value="200" min="1">
<div class="row">
  <button id="run">运行到停机</button>

  <button id="clear" class="ghost">清空</button>
</div>

<label>磁带</label>
<div class="tape" id="tape"></div>
<script>
function tmParse(spec){
  var lines = spec.split(/\r?\n/);
  var blank='_', start='q0', accept='qa', reject='qr', tapeStr='', trans={};
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line || line[0]==='#') continue;
    var m;
    if((m=line.match(/^tape:\s*(.*)$/))) tapeStr=m[1];
    else if((m=line.match(/^start:\s*(\S+)$/))) start=m[1];
    else if((m=line.match(/^accept:\s*(\S+)$/))) accept=m[1];
    else if((m=line.match(/^reject:\s*(\S+)$/))) reject=m[1];
    else if((m=line.match(/^blank:\s*(\S+)$/))) blank=m[1];
    else if((m=line.match(/^([^,]+),\s*([^ ]+)\s*->\s*([^,]+),\s*([^,]+),\s*([LRS])$/))){
      trans[m[1].trim()+'\u0000'+m[2].trim()]={state:m[3].trim(), write:m[4].trim(), dir:m[5].trim()};
    } else throw new Error('无法解析规则: '+line);
  }
  return {blank:blank, start:start, accept:accept, reject:reject, transitions:trans, tape:tapeStr};
}
function tmRun(program, opts){
  opts=opts||{};
  var maxSteps=opts.maxSteps||1000, blank=program.blank;
  var tape=String(program.tape||'').split('');
  if(opts.initTape!==undefined) tape=String(opts.initTape).split('');
  var head=opts.head||0, state=program.start, steps=0, trace=[];
  function snap(){ trace.push({state:state, head:head, tape:tape.join('')}); }
  snap();
  while(steps<maxSteps){
    while(head<0){ tape.unshift(blank); head=0; }
    while(head>=tape.length){ tape.push(blank); }
    var key=state+'\u0000'+tape[head];
    var rule=program.transitions[key];
    if(!rule) return {steps:steps,status:'halt',state:state,head:head,tape:tape.join(''),trace:trace,accepted:state===program.accept};
    tape[head]=rule.write; state=rule.state;
    if(rule.dir==='L') head--; else if(rule.dir==='R') head++;
    steps++; snap();
    if(state===program.accept) return {steps:steps,status:'accept',state:state,head:head,tape:tape.join(''),trace:trace,accepted:true};
    if(state===program.reject) return {steps:steps,status:'reject',state:state,head:head,tape:tape.join(''),trace:trace,accepted:false};
  }
  return {steps:steps,status:'timeout',state:state,head:head,tape:tape.join(''),trace:trace,accepted:false};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { tmParse:tmParse, tmRun:tmRun };
}
if (typeof window !== 'undefined') {
  window.TuringForgePure = { tmParse:tmParse, tmRun:tmRun };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.TuringForgePure, prog=null, st=null;
    function render(res){
      $('out').textContent = '状态: '+res.state+' | 步数: '+res.steps+' | 结果: '+
        (res.status==='accept'?'接受 ✓':res.status==='reject'?'拒绝 ✗':res.status==='halt'?'停机(非接受)':'超时');
      var t=res.tape.split(''), h=res.head, html='';
      for(var i=0;i<t.length;i++){
        html += '<span class="cell'+(i===h?' on':'')+'">'+ (t[i]==='_'?'·':t[i]) +'</span>';
      }
      $('tape').innerHTML = html;
    }
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        prog = P.tmParse($('spec').value);
        var res = P.tmRun(prog, {maxSteps:Number($('max').value)||200});
        render(res);
      } catch(e){ $('err').textContent=e.message; }
    });
    $('step').addEventListener('click', function(){
      $('err').textContent='';
      try {
        if(!prog){ prog = P.tmParse($('spec').value); st={tape:prog.tape.split(''),head:0,state:prog.start,steps:0}; }
        var blank=prog.blank;
        while(st.head<0){ st.tape.unshift(blank); st.head=0; }
        while(st.head>=st.tape.length){ st.tape.push(blank); }
        var key=st.state+'\u0000'+st.tape[st.head], rule=prog.transitions[key];
        if(!rule){ render({tape:st.tape.join(''),head:st.head,state:st.state,steps:st.steps,status:'halt'}); return; }
        st.tape[st.head]=rule.write; st.state=rule.state;
        if(rule.dir==='L') st.head--; else if(rule.dir==='R') st.head++;
        st.steps++;
        render({tape:st.tape.join(''),head:st.head,state:st.state,steps:st.steps,status: st.state===prog.accept?'accept':st.state===prog.reject?'reject':'run'});
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ prog=null; st=null; $('out').textContent='定义后运行'; $('tape').innerHTML=''; });
  })();
}
</script>
