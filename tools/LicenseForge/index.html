<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LicenseForge — 开源许可证生成器</title>
<style>
  :root{
    --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
    --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
  .app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
  textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
       color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
       font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;min-height:200px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  footer{margin-top:20px;color:var(--dim);font-size:12px}
  a{color:var(--info);text-decoration:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线开源许可证生成器：MIT/BSD-3-Clause/ISC/Apache-2.0/Unlicense 全文，填充年份与版权人。">
</head>
<body>
<div class="app">
  <h1>LicenseForge</h1>
  <p class="sub">开源许可证文件生成器 · 单文件 · 零依赖 · 本地优先</p>

  <label for="lic">许可证</label>
  <select id="lic">
    <option value="MIT">MIT License</option>
    <option value="BSD-3-Clause">BSD 3-Clause</option>
    <option value="ISC">ISC License</option>
    <option value="Apache-2.0">Apache License 2.0</option>
    <option value="Unlicense">The Unlicense (Public Domain)</option>
  </select>

  <div class="grid">
    <div>
      <label for="year">年份</label>
      <input id="year" type="text" value="2026">
    </div>
    <div>
      <label for="name">版权人 / 组织</label>
      <input id="name" type="text" placeholder="Your Name" value="nano-tools">
    </div>
  </div>

  <div class="row">
    <button id="gen">生成</button>
    <button id="copy" class="ghost">复制</button>
    <button id="download" class="ghost">下载 LICENSE</button>
  </div>

  <label>结果</label>
  <div class="out" id="out" aria-live="polite"></div>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
  </div>

  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>

<script>

function fill(text, vars){
  return String(text).replace(/\{year\}/g, vars.year || '').replace(/\{name\}/g, vars.name || '');
}
function render(id, vars){
  vars = vars || {};
  var t = LICENSES[id];
  if(!t) return null;
  return fill(t, vars);
}
function ids(){ return Object.keys(LICENSES); }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { LICENSES:LICENSES, fill:fill, render:render, ids:ids };
}
if (typeof window !== 'undefined') {
  window.LicenseForgePure = { LICENSES:LICENSES, fill:fill, render:render, ids:ids };
}
</script>

<script>
/* ===== UI 区（第二个 script）：仅在浏览器中运行 ===== */
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.LicenseForgePure;
    function gen(){
      var id=$('lic').value;
      var txt=P.render(id, {year:$('year').value, name:$('name').value});
      $('out').textContent = txt || '未知许可证';
    }
    function copy(){
      var t=$('out').textContent;
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function download(){
      var t=$('out').textContent, id=$('lic').value;
      var blob=new Blob([t], {type:'text/plain'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='LICENSE-'+id; a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    }
    $('lic').addEventListener('change', gen);
    $('gen').addEventListener('click', gen);
    $('copy').addEventListener('click', copy);
    $('download').addEventListener('click', download);
    gen();
  })();
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
