<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:90px}
.preview svg{max-width:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.big{font:40px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<textarea id="code" rows="10" placeholder="// 粘贴代码，实时生成截图预览&#10;function hello(name) {&#10;  return `Hi, ${name}!`;&#10;}">function hello(name) {

  const msg = `Hi, ${name}!`;
  return msg;

<script>
var KW={var:1,let:1,const:1,function:1,return:1,if:1,else:1,for:1,while:1,do:1,switch:1,case:1,break:1,continue:1,new:1,class:1,extends:1,super:1,this:1,typeof:1,instanceof:1,in:1,of:1,void:1,delete:1,throw:1,try:1,catch:1,finally:1,async:1,await:1,yield:1,def:1,import:1,from:1,export:1,default:1,as:1,public:1,private:1,protected:1,static:1,interface:1,type:1,enum:1,namespace:1,func:1,package:1,go:1,chan:1,map:1,struct:1,impl:1,pub:1,fn:1,mut:1,use:1,module:1,and:1,or:1,not:1,end:1,then:1,elseif:1,elif:1,fi:1,esac:1,select:1,where:1,group:1,by:1,order:1,limit:1,SELECT:1,FROM:1,WHERE:1,AND:1,OR:1,INSERT:1,UPDATE:1,DELETE:1,CREATE:1,TABLE:1,NULL:1,echo:1,print:1,require:1,include:1,true:1,false:1,null:1,None:1,True:1,False:1,undefined:1};
var HASH_LANGS={python:1,py:1,sh:1,bash:1,shell:1,yaml:1,yml:1,ruby:1,rb:1,toml:1,ini:1,cfg:1,nginx:1};
function isKw(w){ return Object.prototype.hasOwnProperty.call(KW,w); }
function tokenizeToTokens(code, lang){
  code=String(code); lang=lang||'';
  var hashLang = HASH_LANGS[lang]===1;
  var tokens=[]; var i=0, n=code.length;
  function push(t,c){ tokens.push({t:t,c:c}); }
  while(i<n){
    var c=code[i];
    if(c==='/'&&code[i+1]==='/'){ var j=code.indexOf('\n',i); if(j<0)j=n; push(code.slice(i,j),'com'); i=j; continue; }
    if(c==='/'&&code[i+1]==='*'){ var j=code.indexOf('*/',i+2); if(j<0)j=n-2; push(code.slice(i,j+2),'com'); i=(j<0?n:j+2); continue; }
    if(hashLang&&c==='#'){ var j=code.indexOf('\n',i); if(j<0)j=n; push(code.slice(i,j),'com'); i=j; continue; }
    if(c==='"'||c==="'"||c==='`'){
      var q=c,j=i+1,buf=c,esc=false;
      while(j<n){ var d=code[j]; buf+=d; if(esc){esc=false;j++;continue;} if(d==='\\'){esc=true;j++;continue;} if(d===q){j++;break;} if(q!=='`'&&d==='\n'){break;} j++; }
      push(buf,'str'); i=j; continue;
    }
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(code[i+1]||''))){ var j=i; while(j<n&&/[0-9a-fA-FxX._]/.test(code[j]))j++; push(code.slice(i,j),'num'); i=j; continue; }
    if(/[A-Za-z_$]/.test(c)){ var j=i; while(j<n&&/[A-Za-z0-9_$]/.test(code[j]))j++; var w=code.slice(i,j); var nc=code[j]; while(nc===' '||nc==='\t'||nc==='\n'||nc==='\r'){nc=code[++j];} var c2=isKw(w)?'kw':(nc==='('?'fn':'id'); push(w,c2); i=j; continue; }
    if(/\s/.test(c)){ var j=i; while(j<n&&/\s/.test(code[j]))j++; push(code.slice(i,j),null); i=j; continue; }
    push(c,'punc'); i++; continue;
  }
  return tokens;
}
function escapeXml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function htmlFromTokens(tokens){ return tokens.map(function(t){ if(t.c) return '<span class="tok-'+t.c+'">'+escHtml(t.t)+'</span>'; return escHtml(t.t); }).join(''); }
function svgFromTokens(tokens, opts){
  opts=opts||{};
  var fontSize=opts.fontSize||14;
  var lineH=Math.round(fontSize*1.5);
  var padX=opts.padX||24, padTop=opts.padTop||44, padBottom=opts.padBottom||22;
  var charW=fontSize*0.6;
  var lines=[]; var cur=[]; var curLen=0; var maxLen=0;
  tokens.forEach(function(t){
    var parts=String(t.t).split('\n');
    for(var k=0;k<parts.length;k++){
      if(k>0){ lines.push({toks:cur,len:curLen}); cur=[]; curLen=0; }
      if(parts[k].length){ cur.push({text:parts[k], c:t.c}); curLen+=parts[k].length; }
    }
  });
  lines.push({toks:cur,len:curLen});
  lines.forEach(function(l){ if(l.len>maxLen) maxLen=l.len; });
  var innerW=Math.ceil(maxLen*charW)+padX*2;
  var innerH=lines.length*lineH+padTop+padBottom;
  var bg=opts.bg||'#0d1117';
  var title=opts.title||'code';
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+innerW+'" height="'+innerH+'" viewBox="0 0 '+innerW+' '+innerH+'" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">';
  s+='<rect x="0" y="0" width="'+innerW+'" height="'+innerH+'" rx="12" fill="'+bg+'"/>';
  s+='<circle cx="22" cy="22" r="6" fill="#ff5f56"/>';
  s+='<circle cx="42" cy="22" r="6" fill="#ffbd2e"/>';
  s+='<circle cx="62" cy="22" r="6" fill="#27c93f"/>';
  s+='<text x="'+(innerW/2)+'" y="27" text-anchor="middle" font-size="12" fill="#8b949e">'+escapeXml(title)+'</text>';
  var colors={kw:'#ff7b72',str:'#a5d6ff',com:'#8b949e',num:'#79c0ff',fn:'#d2a8ff',id:'#e6edf3',punc:'#c9d1d9',null:'#e6edf3'};
  for(var i=0;i<lines.length;i++){
    var row=lines[i]; if(!row.toks.length) continue;
    var y=padTop+i*lineH+fontSize;
    s+='<text x="'+padX+'" y="'+y+'" font-size="'+fontSize+'" xml:space="preserve">';
    row.toks.forEach(function(tok){
      var col=colors[tok.c!=null?tok.c:'null'];
      s+='<tspan fill="'+col+'">'+escapeXml(tok.text)+'</tspan>';
    });
    s+='</text>';
  }
  s+='</svg>';
  return s;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { tokenizeToTokens:tokenizeToTokens, htmlFromTokens:htmlFromTokens, svgFromTokens:svgFromTokens, escapeXml:escapeXml };
}
if (typeof window !== 'undefined') {
  window.ShotForgePure = { tokenizeToTokens:tokenizeToTokens, htmlFromTokens:htmlFromTokens, svgFromTokens:svgFromTokens, escapeXml:escapeXml };
}
</script>
<script>
if (typeof window !== 'undefined' && window.document) {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.ShotForgePure;
    var lastSvg='';
    function build(){
      var code=$('code').value, lang=$('lang').value, title=$('title').value, bg=$('bg').value;
      var tokens=P.tokenizeToTokens(code, lang);
      var html='<div class="cf-win" style="background:'+bg+'"><div class="cf-bar"><span class="cf-dot r"></span><span class="cf-dot y"></span><span class="cf-dot g"></span><span class="cf-title">'+P.escapeXml(title||'code')+'</span></div><pre class="cf-code">'+P.htmlFromTokens(tokens)+'</pre></div>';
      $('preview').innerHTML=html;
      lastSvg=P.svgFromTokens(tokens, {bg:bg, title:title||'code'});
    }
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function downloadPng(){
      if(!lastSvg) return;
      var blob=new Blob([lastSvg],{type:'image/svg+xml'});
      var url=URL.createObjectURL(blob);
      var img=new Image();
      img.onload=function(){
        var scale=2, canvas=document.createElement('canvas');
        canvas.width=img.width*scale; canvas.height=img.height*scale;
        var ctx=canvas.getContext('2d'); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
        canvas.toBlob(function(b){ if(!b) return; var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='shotforge.png'; a.click(); });
      };
      img.onerror=function(){ alert('当前浏览器无法导出 PNG，请改用「复制 SVG」'); };
      img.src=url;
    }
    ['code','lang','title','bg'].forEach(function(id){ $(id).addEventListener('input', build); $(id).addEventListener('change', build); });
    $('copy').addEventListener('click', function(){ copyText(lastSvg); });
    $('png').addEventListener('click', downloadPng);
    $('clear').addEventListener('click', function(){ $('code').value=''; build(); });
    build();
  })();
}
</script>
