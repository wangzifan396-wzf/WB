<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <h1>TlsForge</h1>
  <p class="sub">TLS 安全：密码套件解析与评分（PFS/AEAD/弱算法）、协议版本风险表、HSTS 响应头生成与 preload 校验、证书到期提醒 · 单文件 · 零依赖 · 本地优先</p>

<div class="grid">
  <section class="panel">
    <h2>密码套件体检</h2>
    <div class="row">
      <label>配置档</label>
      <select id="lvl">
        <option value="intermediate">Intermediate（推荐）</option>
        <option value="modern">Modern</option>
        <option value="old">Old</option>
      </select>
      <button id="load" class="btn">载入</button>
    </div>
    <textarea id="ciphers" rows="7" placeholder="每行一个套件，或用逗号/冒号分隔">TLS_AES_128_GCM_SHA256
ECDHE-RSA-AES128-GCM-SHA256
ECDHE-RSA-AES128-SHA
DES-CBC3-SHA</textarea>
    <div id="sum" class="out"></div>
    <div id="rows" class="list"></div>
  </section>
  <section class="panel">
    <h2>协议版本</h2>
    <div id="protos" class="list"></div>
    <h2 style="margin-top:18px">HSTS 响应头</h2>
    <div class="row"><label>max-age</label><input id="hma" value="31536000"></div>
    <div class="row chk">
      <label><input type="checkbox" id="isd" checked> includeSubDomains</label>
      <label><input type="checkbox" id="pre"> preload</label>
    </div>
    <pre id="hsts" class="out"></pre>
    <div id="hwarn" class="notes"></div>
    <h2 style="margin-top:18px">证书到期</h2>
    <div class="row"><label>剩余天数</label><input id="days" value="21"></div>
    <div id="cert" class="out"></div>
  </section>
</div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>

var PROTOCOLS = [
  {id:'SSLv3', year:1996, grade:'F', note:'POODLE 攻击，必须禁用'},
  {id:'TLS1.0', year:1999, grade:'D', note:'PCI DSS 已弃用，浏览器 2020 起移除'},
  {id:'TLS1.1', year:2006, grade:'D', note:'弱 MAC/密钥交换，已弃用'},
  {id:'TLS1.2', year:2008, grade:'B', note:'仍广泛可用，需限制弱套件'},
  {id:'TLS1.3', year:2018, grade:'A', note:'仅保留 AEAD 套件，默认前向保密'}
];
function protocolInfo(id){
  var key=String(id||'').toUpperCase().replace(/\s+/g,'').replace(/^TLSV/,'TLS').replace(/^SSLV/,'SSLv');
  for(var i=0;i<PROTOCOLS.length;i++){
    if(PROTOCOLS[i].id.toUpperCase()===key.toUpperCase()) return PROTOCOLS[i];
  }
  return null;
}
function parseCipher(name){
  var s=String(name||'').trim().toUpperCase();
  if(!s) return {name:'', valid:false, reason:'空套件名'};
  var out={name:String(name).trim(), valid:true, tls13:false, kx:'', auth:'', enc:'', mac:'', aead:false, pfs:false};
  if(/^TLS_(AES|CHACHA20)/.test(s)){
    out.tls13=true; out.kx='ECDHE'; out.auth='any'; out.pfs=true; out.aead=true;
    out.enc = s.indexOf('CHACHA20')>-1 ? 'CHACHA20-POLY1305' : (s.indexOf('AES_256')>-1 ? 'AES-256-GCM' : (s.indexOf('AES_128_CCM')>-1?'AES-128-CCM':'AES-128-GCM'));
    out.mac='AEAD';
    return out;
  }
  if(s.indexOf('ECDHE')>-1) out.kx='ECDHE';
  else if(s.indexOf('DHE')>-1) out.kx='DHE';
  else if(s.indexOf('ECDH_')>-1 || /\bECDH\b/.test(s)) out.kx='ECDH';
  else if(s.indexOf('RSA')>-1) out.kx='RSA';
  else out.kx='unknown';
  out.pfs = (out.kx==='ECDHE' || out.kx==='DHE');
  if(s.indexOf('ECDSA')>-1) out.auth='ECDSA';
  else if(s.indexOf('RSA')>-1) out.auth='RSA';
  else if(s.indexOf('ANON')>-1 || s.indexOf('_ADH')>-1) out.auth='anon';
  else out.auth='unknown';
  if(s.indexOf('CHACHA20')>-1){ out.enc='CHACHA20-POLY1305'; out.aead=true; }
  else if(s.indexOf('AES_256_GCM')>-1||s.indexOf('AES256-GCM')>-1){ out.enc='AES-256-GCM'; out.aead=true; }
  else if(s.indexOf('AES_128_GCM')>-1||s.indexOf('AES128-GCM')>-1){ out.enc='AES-128-GCM'; out.aead=true; }
  else if(s.indexOf('AES_256_CBC')>-1||s.indexOf('AES256-CBC')>-1||/AES256(?!-GCM)/.test(s)){ out.enc='AES-256-CBC'; }
  else if(s.indexOf('AES_128_CBC')>-1||s.indexOf('AES128-CBC')>-1||/AES128(?!-GCM)/.test(s)){ out.enc='AES-128-CBC'; }
  else if(s.indexOf('3DES')>-1||s.indexOf('DES-CBC3')>-1){ out.enc='3DES'; }
  else if(s.indexOf('RC4')>-1){ out.enc='RC4'; }
  else if(s.indexOf('NULL')>-1){ out.enc='NULL'; }
  else out.enc='unknown';
  if(out.aead) out.mac='AEAD';
  else if(s.indexOf('SHA384')>-1) out.mac='SHA384';
  else if(s.indexOf('SHA256')>-1) out.mac='SHA256';
  else if(/SHA(?!\d)/.test(s)) out.mac='SHA1';
  else if(s.indexOf('MD5')>-1) out.mac='MD5';
  else out.mac='unknown';
  return out;
}
function gradeCipher(name){
  var c=parseCipher(name);
  if(!c.valid) return {cipher:c, grade:'F', score:0, issues:['无法解析']};
  var issues=[], score=100;
  if(c.enc==='NULL'){ issues.push('NULL 加密：明文传输'); score-=100; }
  if(c.enc==='RC4'){ issues.push('RC4 存在偏置攻击，已被 RFC 7465 禁止'); score-=70; }
  if(c.enc==='3DES'){ issues.push('3DES 受 Sweet32 生日攻击影响'); score-=60; }
  if(c.auth==='anon'){ issues.push('匿名密钥交换，无身份认证'); score-=100; }
  if(!c.pfs){ issues.push('无前向保密：私钥泄露可解密历史流量'); score-=35; }
  if(c.mac==='MD5'){ issues.push('MD5 完整性校验已破解'); score-=60; }
  else if(c.mac==='SHA1' && !c.aead){ issues.push('SHA1 MAC 偏弱，且 CBC 模式易受填充攻击'); score-=20; }
  if(!c.aead && c.enc.indexOf('CBC')>-1){ issues.push('CBC 模式需谨慎处理填充（Lucky13）'); score-=15; }
  if(c.enc==='unknown'){ issues.push('未识别加密算法'); score-=30; }
  if(score<0) score=0;
  var grade = score>=90?'A': score>=75?'B': score>=55?'C': score>=35?'D': score>0?'E':'F';
  return {cipher:c, grade:grade, score:score, issues:issues};
}
function auditSuite(list){
  var arr = Array.isArray(list) ? list : String(list||'').split(/[\n,:]+/);
  var rows=[], worst=100, pfsCount=0, aeadCount=0, valid=0;
  for(var i=0;i<arr.length;i++){
    var nm=String(arr[i]).trim();
    if(!nm) continue;
    var g=gradeCipher(nm);
    rows.push(g); valid++;
    if(g.score<worst) worst=g.score;
    if(g.cipher.pfs) pfsCount++;
    if(g.cipher.aead) aeadCount++;
  }
  if(!valid) return {rows:[], total:0, grade:'-', pfsRatio:0, aeadRatio:0, worstScore:0};
  var grade = worst>=90?'A': worst>=75?'B': worst>=55?'C': worst>=35?'D': worst>0?'E':'F';
  return {
    rows:rows, total:valid, grade:grade, worstScore:worst,
    pfsRatio: Math.round(pfsCount/valid*100),
    aeadRatio: Math.round(aeadCount/valid*100)
  };
}
function buildHsts(opt){
  opt = opt||{};
  var maxAge = typeof opt.maxAge==='number' ? opt.maxAge : 31536000;
  var parts=['max-age='+maxAge];
  if(opt.includeSubDomains) parts.push('includeSubDomains');
  if(opt.preload) parts.push('preload');
  var warns=[];
  if(opt.preload && !opt.includeSubDomains) warns.push('提交 preload 列表必须同时开启 includeSubDomains');
  if(opt.preload && maxAge < 31536000) warns.push('preload 要求 max-age 至少 31536000（1 年）');
  if(maxAge>0 && maxAge<86400) warns.push('max-age 过短，建议先用 300 试运行再逐步提升');
  var v=parts.join('; ');
  return {header:'Strict-Transport-Security: '+v, value:v, warnings:warns, preloadReady: !!opt.preload && !!opt.includeSubDomains && maxAge>=31536000};
}
function certDays(notAfterDays){
  var d = typeof notAfterDays==='number' ? notAfterDays : NaN;
  if(!isFinite(d)) return {level:'unknown', days:null, msg:'无效天数'};
  if(d<0) return {level:'expired', days:d, msg:'证书已过期 '+Math.abs(d)+' 天'};
  if(d<=7) return {level:'critical', days:d, msg:'剩余 '+d+' 天，立即续期'};
  if(d<=30) return {level:'warn', days:d, msg:'剩余 '+d+' 天，安排续期'};
  return {level:'ok', days:d, msg:'剩余 '+d+' 天'};
}
function recommendConfig(level){
  var C = {
    modern: {label:'Modern（仅 TLS1.3）', protocols:['TLS1.3'],
      ciphers:['TLS_AES_128_GCM_SHA256','TLS_AES_256_GCM_SHA384','TLS_CHACHA20_POLY1305_SHA256'],
      note:'放弃 IE11 与旧安卓，换取最简攻击面'},
    intermediate: {label:'Intermediate（TLS1.2+1.3）', protocols:['TLS1.2','TLS1.3'],
      ciphers:['TLS_AES_128_GCM_SHA256','TLS_AES_256_GCM_SHA384','ECDHE-ECDSA-AES128-GCM-SHA256','ECDHE-RSA-AES128-GCM-SHA256','ECDHE-ECDSA-CHACHA20-POLY1305'],
      note:'通用推荐，兼容 2016 年后的绝大多数客户端'},
    old: {label:'Old（含 TLS1.0/1.1）', protocols:['TLS1.0','TLS1.1','TLS1.2','TLS1.3'],
      ciphers:['ECDHE-RSA-AES128-GCM-SHA256','ECDHE-RSA-AES128-SHA','DES-CBC3-SHA'],
      note:'仅在必须兼容远古客户端时使用，存在已知风险'}
  };
  return C[level] || null;
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { PROTOCOLS:PROTOCOLS, protocolInfo:protocolInfo, parseCipher:parseCipher, gradeCipher:gradeCipher, auditSuite:auditSuite, buildHsts:buildHsts, certDays:certDays, recommendConfig:recommendConfig }; }
if (typeof window !== 'undefined') { window.TlsForgePure = { PROTOCOLS:PROTOCOLS, protocolInfo:protocolInfo, parseCipher:parseCipher, gradeCipher:gradeCipher, auditSuite:auditSuite, buildHsts:buildHsts, certDays:certDays, recommendConfig:recommendConfig }; }

</script>
<script>

(function(){
  if(typeof window==='undefined' || !window.document) return;
  var $=function(id){return document.getElementById(id);};
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function gcls(g){ return g==='A'?'ok': g==='B'?'i': (g==='C'||g==='D')?'w':'e'; }
  function renderCiphers(){
    var a=auditSuite($('ciphers').value);
    $('sum').textContent = a.total? ('共 '+a.total+' 个套件 · 整体评级 '+a.grade+' · 前向保密 '+a.pfsRatio+'% · AEAD '+a.aeadRatio+'%') : '未输入套件';
    $('rows').innerHTML = a.rows.map(function(r){
      var c=r.cipher;
      return '<div class="item"><div class="hd"><b>'+esc(c.name)+'</b><span class="tag '+gcls(r.grade)+'">'+r.grade+' · '+r.score+'</span></div>'
        + '<div class="meta">'+esc(c.kx)+' / '+esc(c.auth)+' / '+esc(c.enc)+' / '+esc(c.mac)+(c.pfs?' · PFS':'')+(c.aead?' · AEAD':'')+'</div>'
        + (r.issues.length? '<ul>'+r.issues.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')
        + '</div>';
    }).join('');
  }
  function renderProtos(){
    $('protos').innerHTML = PROTOCOLS.map(function(p){
      return '<div class="item"><div class="hd"><b>'+p.id+'</b><span class="tag '+gcls(p.grade)+'">'+p.grade+'</span></div><div class="meta">'+p.year+' · '+p.note+'</div></div>';
    }).join('');
  }
  function renderHsts(){
    var ma=parseInt($('hma').value,10); if(isNaN(ma)) ma=0;
    var h=buildHsts({maxAge:ma, includeSubDomains:$('isd').checked, preload:$('pre').checked});
    $('hsts').textContent=h.header;
    $('hwarn').innerHTML = h.warnings.length
      ? h.warnings.map(function(w){return '<div class="w">! '+esc(w)+'</div>';}).join('')
      : '<div class="okmsg">'+(h.preloadReady?'满足 preload 提交要求':'配置有效')+'</div>';
  }
  function renderCert(){
    var d=parseInt($('days').value,10);
    var c=certDays(isNaN(d)?NaN:d);
    $('cert').textContent='['+c.level+'] '+c.msg;
  }
  function all(){ renderCiphers(); renderHsts(); renderCert(); }
  ['ciphers','hma','isd','pre','days'].forEach(function(id){
    var el=$(id); if(el){ el.addEventListener('input', all); el.addEventListener('change', all); }
  });
  $('load').addEventListener('click', function(){
    var c=recommendConfig($('lvl').value); if(!c) return;
    $('ciphers').value=c.ciphers.join('\n'); all();
  });
  renderProtos(); all();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
