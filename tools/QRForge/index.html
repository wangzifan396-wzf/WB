<style>
  :root{
    --bg:#0A0A0B; --surface:#141417; --surface-2:#1A1B1E;
    --text:#FFFFFF; --text-2:#A1A1AA; --text-3:#71717A;
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
    --accent:#5E6AD2; --accent-soft:rgba(94,106,210,0.14);
    --success:#10B981; --warning:#F5A623; --danger:#EF4444;
    --radius:10px; --radius-sm:6px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  [data-theme="light"]{
    --bg:#FFFFFF; --surface:#F7F7F8; --surface-2:#EFEFF1;
    --text:#18191C; --text-2:#52525B; --text-3:#8E8E96;
    --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14);
    --accent:#5E6AD2; --accent-soft:rgba(94,106,210,0.12);
    --success:#0E9F6E; --warning:#D97706; --danger:#DC2626;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:14px; line-height:1.5; display:flex; flex-direction:column;
    overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  /* Top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; border-bottom:1px solid var(--border);
    background:var(--surface); flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px}
  .brand .logo{
    width:26px;height:26px;border-radius:7px;background:var(--accent-soft);
    display:grid;place-items:center;color:var(--accent);
  }
  .brand .logo svg{width:16px;height:16px}
  .brand-sub{color:var(--text-3); font-weight:500; font-size:13px}
  .top-actions{display:flex; gap:8px}
  .icon-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-2);
    height:32px;padding:0 10px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:6px;
    transition:.15s; font-size:13px;
  }
  .icon-btn:hover{border-color:var(--border-strong); color:var(--text)}
  .icon-btn svg{width:16px;height:16px}

  /* Toolbar */
  .toolbar{
    display:flex; align-items:center; gap:8px; padding:8px 16px;
    border-bottom:1px solid var(--border); background:var(--bg); flex-shrink:0;
    flex-wrap:wrap;
  }
  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 12px;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius-sm); font-size:13px; transition:.15s;
  }
  .btn:hover{border-color:var(--border-strong)}
  .btn svg{width:14px;height:14px}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .toolbar .spacer{flex:1}
  .hint{color:var(--text-3); font-size:12px}

  /* Layout */
  .layout{flex:1; display:grid; grid-template-columns:340px 1fr; min-height:0}
  .panel{border-right:1px solid var(--border); background:var(--surface); overflow:auto; padding:14px 16px}
  .panel h3{
    margin:0 0 10px; font-size:12px; color:var(--text-2); text-transform:uppercase;
    letter-spacing:.5px; font-weight:600;
  }
  .field{margin-bottom:12px}
  .field label{display:block; color:var(--text-2); font-size:12px; margin-bottom:5px}
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius-sm); padding:8px 10px; font-size:13px; font-family:var(--sans);
    outline:none;
  }
  .field textarea{resize:vertical; min-height:64px; font-family:var(--mono); line-height:1.5}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent)}
  .row{display:flex; gap:10px}
  .row > *{flex:1}
  .color-row{display:flex; align-items:center; gap:8px}
  .color-row input[type=color]{width:38px; height:32px; padding:2px; border:1px solid var(--border); border-radius:6px; background:var(--bg)}
  .color-row input[type=text]{flex:1; font-family:var(--mono)}
  .opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  select#mode{font-size:14px; font-weight:600}

  /* Preview */
  .preview-wrap{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0}
  .preview-head{display:flex; align-items:center; gap:10px; padding:8px 16px; border-bottom:1px solid var(--border); background:var(--surface); font-size:12px; color:var(--text-3)}
  .preview-head .spacer{flex:1}
  .qr-stage{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
    overflow:auto; background:
      radial-gradient(circle at 30% 20%, rgba(94,106,210,0.10), transparent 60%), var(--bg);
  }
  #qrSvg svg{display:block; max-width:min(70vh,520px); height:auto; box-shadow:0 10px 40px rgba(0,0,0,0.35); border-radius:4px}
  .empty-note{color:var(--text-3); font-size:13px; text-align:center}

  /* Footer brand bar */
  .brandbar{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:6px; border-top:1px solid var(--border); background:var(--surface);
    color:var(--text-3); font-size:11px; flex-shrink:0;
  }
  .brandbar .nt{color:var(--accent); font-weight:600}
  .brandbar a{color:var(--text-3); text-decoration:none}
  .brandbar a:hover{color:var(--accent)}

  /* Toast */
  .toast{
    position:fixed; bottom:48px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
    padding:10px 16px; border-radius:var(--radius); font-size:13px; opacity:0;
    transition:.2s; pointer-events:none; z-index:50; max-width:80vw;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (max-width:760px){
    .layout{grid-template-columns:1fr}
    .panel{border-right:none; border-bottom:1px solid var(--border); max-height:46vh}
  }

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

    function wireColor(idColor, idText){
      $(idColor).addEventListener('input', () => { $(idText).value = $(idColor).value; generate(); });
      $(idText).addEventListener('input', () => { $(idColor).value = $(idText).value; generate(); });
    }

    // 事件绑定
    $('mode').addEventListener('change', () => { renderFields(); generate(); });
    document.querySelectorAll('#fields').forEach(()=>{});
    $('fields').addEventListener('input', () => { clearTimeout($('fields')._t); $('fields')._t = setTimeout(generate, 250); });
    ['ecl','size','margin'].forEach(id => $(id).addEventListener('input', generate));
    wireColor('fgColor', 'fgText');
    wireColor('bgColor', 'bgText');
    $('genBtn').addEventListener('click', generate);
    $('svgBtn').addEventListener('click', exportSVG);
    $('pngBtn').addEventListener('click', exportPNG);
    $('copyBtn').addEventListener('click', () => {
      const mode = $('mode').value;
      const text = parseInput(mode, readFields());
      if (!text){ toast(t('errEmpty')); return; }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(() => toast(t('copied'))).catch(() => toast(t('copied')));
      } else {
        toast(t('copied'));
      }
    });
    $('langBtn').addEventListener('click', () => {
      LANG = LANG === 'zh' ? 'en' : 'zh';
      __LS.setItem('qrforge.lang', LANG); applyLang(); renderFields();
    });
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      __LS.setItem('qrforge.theme', next);
    });

    // 启动
    applyLang();
    const savedTheme = __LS.getItem('qrforge.theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    // 初始示例
    $('mode').value = 'url';
    renderFields();
    const urlInput = document.querySelector('#fields [data-k="url"]');
    if (urlInput){ urlInput.value = 'https://nano.tools'; }
    generate();

    // PWA 注册
    if ('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
  </script>
</body>
</html>
