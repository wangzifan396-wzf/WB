<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>StrengthForge — 密码强度估计：按字符集熵估算强度等级与暴力破解耗时，识别常见弱口令与模式，离线可用。</title>
<meta property="og:title" content="StrengthForge">
<meta property="og:description" content="密码强度估计：按字符集熵估算强度等级与暴力破解耗时，识别常见弱口令与模式，离线可用。">
<meta property="og:image" content="./og.png">
<meta name="description" content="密码强度估计：按字符集熵估算强度等级与暴力破解耗时，识别常见弱口令与模式 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE; --bad:#EF4444;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Sego UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:680px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.bar{height:10px;border-radius:6px;background:var(--surface);overflow:hidden;margin-top:14px;border:1px solid var(--line)}
.bar>i{display:block;height:100%;transition:width .2s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;margin:3px 4px 0 0}
.warns{margin-top:12px;font-size:13px;color:var(--warn)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>StrengthForge</h1>
  <p class="sub">密码强度估计：按字符集熵估算强度等级与暴力破解耗时，识别常见弱口令与模式 · 单文件 · 零依赖 · 本地优先</p>

  <label>密码</label>
  <input id="pw" type="text" placeholder="输入密码以评估强度" autocomplete="off">
  <div class="row">
    <button id="run">评估</button>
    <button id="gen" class="ghost">随机强密码</button>
    <button id="clear" class="ghost">清空</button>
  </div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
  <div class="grid" id="out"></div>
  <div class="warns" id="warns"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>
var STRENGTH_SYMBOLS=" !\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~";
var STRENGTH_COMMON=["password","123456","12345678","qwerty","abc123","admin","welcome","iloveyou","111111","letmein"];
function strengthClasses(pw){
  var c={lower:false,upper:false,digit:false,symbol:false};
  for(var i=0;i<pw.length;i++){ var ch=pw[i];
    if(ch>='a'&&ch<='z') c.lower=true;
    else if(ch>='A'&&ch<='Z') c.upper=true;
    else if(ch>='0'&&ch<='9') c.digit=true;
    else c.symbol=true;
  }
  return c;
}
function strengthCharset(pw){
  var c=strengthClasses(pw), n=0;
  if(c.lower) n+=26; if(c.upper) n+=26; if(c.digit) n+=10; if(c.symbol) n+=STRENGTH_SYMBOLS.length;
  return n;
}
function strengthEntropy(pw){
  var cs=strengthCharset(pw); if(!cs) return 0;
  return pw.length*Math.log(cs)/Math.log(2);
}
function strengthScore(ent){
  if(ent<28) return 0; if(ent<36) return 1; if(ent<60) return 2; if(ent<120) return 3; return 4;
}
function strengthPenalty(pw){
  var w=[];
  if(pw.length<8) w.push('长度不足 8 位');
  if(/^(.)\1+$/.test(pw)) w.push('全部字符重复');
  if(/(.)\1{2,}/.test(pw)) w.push('存在连续重复字符');
  var low=pw.toLowerCase();
  if(STRENGTH_COMMON.indexOf(low)>=0) w.push('命中常见弱口令字典');
  if(/^[a-z]+$/.test(low) && low.length>=3){
    var seq='abcdefghijklmnopqrstuvwxyz', ok=false;
    for(var i=0;i+low.length<=seq.length;i++){ if(seq.substr(i,low.length)===low){ok=true;break;} }
    if(ok) w.push('连续字母序列');
  }
  return w;
}
function strengthCrack(ent){
  var sps=1e9; var sec=Math.pow(2,ent)/sps;
  if(sec<1) return '<1 秒';
  if(sec<60) return Math.round(sec)+' 秒';
  if(sec<3600) return Math.round(sec/60)+' 分钟';
  if(sec<86400) return Math.round(sec/3600)+' 小时';
  if(sec<31536000) return Math.round(sec/86400)+' 天';
  if(sec<31536000*100) return Math.round(sec/31536000)+' 年';
  return (sec/31536000).toExponential(1)+' 年';
}
function strengthAnalyze(pw){
  if(pw==='') return { empty:true };
  var ent=strengthEntropy(pw);
  var pen=strengthPenalty(pw);
  var score=strengthScore(ent);
  if(pen.length) score=Math.max(0,score-1);
  return { length:pw.length, charset:strengthCharset(pw), entropy:ent, score:score,
    crack:strengthCrack(ent), warnings:pen };
}
function strengthRand(len){
  len=len||16; var cs='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*';
  var s=''; for(var i=0;i<len;i++) s+=cs[Math.floor(Math.random()*cs.length)]; return s;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { strengthClasses:strengthClasses, strengthCharset:strengthCharset,
    strengthEntropy:strengthEntropy, strengthScore:strengthScore, strengthPenalty:strengthPenalty,
    strengthCrack:strengthCrack, strengthAnalyze:strengthAnalyze, strengthRand:strengthRand,
    STRENGTH_SYMBOLS:STRENGTH_SYMBOLS };
}
if (typeof window !== 'undefined') {
  window.StrengthForgePure = { strengthClasses:strengthClasses, strengthCharset:strengthCharset,
    strengthEntropy:strengthEntropy, strengthScore:strengthScore, strengthPenalty:strengthPenalty,
    strengthCrack:strengthCrack, strengthAnalyze:strengthAnalyze, strengthRand:strengthRand,
    STRENGTH_SYMBOLS:STRENGTH_SYMBOLS };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.StrengthForgePure;
    var VERD=['很弱','弱','中等','强','很强'];
    var COL=['#EF4444','#F5A623','#F5A623','#10B981','#10B981'];
    function run(){
      var pw=$('pw').value;
      var a=P.strengthAnalyze(pw);
      if(a.empty){ $('out').innerHTML=''; $('bar').style.width='0%'; $('warns').textContent=''; return; }
      $('bar').style.width=((a.score+1)/5*100)+'%';
      $('bar').style.background=COL[a.score];
      var html='';
      html+='<div class="kv"><b>长度</b><span>'+a.length+'</span></div>';
      html+='<div class="kv"><b>字符集</b><span>'+a.charset+' 类</span></div>';
      html+='<div class="kv"><b>熵</b><span>'+a.entropy.toFixed(1)+' bit</span></div>';
      html+='<div class="kv"><b>等级</b><span style="color:'+COL[a.score]+'">'+VERD[a.score]+'</span></div>';
      html+='<div class="kv"><b>暴力破解</b><span>约 '+a.crack+'</span></div>';
      html+='<div class="kv"><b>建议</b><span>'+(a.score>=3?'达标':'需增强')+'</span></div>';
      $('out').innerHTML=html;
      $('warns').textContent=a.warnings.length? '⚠ '+a.warnings.join('；') : '';
    }
    $('run').addEventListener('click', run);
    $('pw').addEventListener('input', run);
    $('gen').addEventListener('click', function(){ $('pw').value=P.strengthRand(16); run(); });
    $('clear').addEventListener('click', function(){ $('pw').value=''; run(); });
    run();
  })();
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
