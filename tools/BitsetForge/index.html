body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}

<body>
<div class="app">
  <h1>BitsetForge</h1>
  <p class="sub">位集合 Bitset：置位 / 位运算 / 汉明权重，定长零依赖 · 单文件 · 零依赖 · 本地优先</p>

<label>位数 N</label>
<input id="n" type="number" value="33" min="1" max="1024">
<label>操作序列（每行：set i | clear i | flip i | count）</label>
<textarea id="ops" rows="6">set 0
set 32
count
set 5
count</textarea>
<div class="row">
  <button id="run">运行</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">运行位集合操作，观察置位与计数</div>
<script>
function bitsetCreate(n){
  var words=Math.ceil(n/32)||1;
  var arr=new Array(words); for(var i=0;i<words;i++) arr[i]=0;
  return {n:n, words:words, arr:arr};
}
function bitsetSet(bs,i){
  if(i<0||i>=bs.n) throw new Error('BIT_OUT_OF_RANGE');
  var w=(i/32)|0, b=i%32; bs.arr[w]|=(1<<b);
}
function bitsetClear(bs,i){
  if(i<0||i>=bs.n) throw new Error('BIT_OUT_OF_RANGE');
  var w=(i/32)|0, b=i%32; bs.arr[w]&=~(1<<b);
}
function bitsetGet(bs,i){
  if(i<0||i>=bs.n) throw new Error('BIT_OUT_OF_RANGE');
  var w=(i/32)|0, b=i%32; return (bs.arr[w]>>b)&1;
}
function bitsetFlip(bs,i){
  if(i<0||i>=bs.n) throw new Error('BIT_OUT_OF_RANGE');
  var w=(i/32)|0, b=i%32; bs.arr[w]^=(1<<b);
}
function bitsetCount(bs){
  var c=0; for(var i=0;i<bs.words;i++){ var v=bs.arr[i]; while(v){ v&=v-1; c++; } }
  return c;
}
function bitsetOp(a,b,op){
  if(a.n!==b.n) throw new Error('BITSET_SIZE_MISMATCH');
  var r=bitsetCreate(a.n);
  for(var i=0;i<a.words;i++){ r.arr[i]=(op(a.arr[i], b.arr[i]))>>>0; }
  return r;
}
function bitsetOr(a,b){ return bitsetOp(a,b,function(x,y){return x|y;}); }
function bitsetAnd(a,b){ return bitsetOp(a,b,function(x,y){return x&y;}); }
function bitsetXor(a,b){ return bitsetOp(a,b,function(x,y){return x^y;}); }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { bitsetCreate:bitsetCreate, bitsetSet:bitsetSet, bitsetClear:bitsetClear, bitsetGet:bitsetGet, bitsetFlip:bitsetFlip, bitsetCount:bitsetCount, bitsetOr:bitsetOr, bitsetAnd:bitsetAnd, bitsetXor:bitsetXor };
}
if (typeof window !== 'undefined') {
  window.BitsetForgePure = { bitsetCreate:bitsetCreate, bitsetSet:bitsetSet, bitsetClear:bitsetClear, bitsetGet:bitsetGet, bitsetFlip:bitsetFlip, bitsetCount:bitsetCount, bitsetOr:bitsetOr, bitsetAnd:bitsetAnd, bitsetXor:bitsetXor };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.BitsetForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var bs=P.bitsetCreate(parseInt($('n').value,10)||32); var log=[];
        var lines=$('ops').value.split(/[\n]+/).map(function(x){return x.trim();}).filter(function(x){return x.length;});
        for(var i=0;i<lines.length;i++){
          var tk=lines[i].split(/\s+/);
          if(tk[0]==='set'){ P.bitsetSet(bs, +tk[1]); }
          else if(tk[0]==='clear'){ P.bitsetClear(bs, +tk[1]); }
          else if(tk[0]==='flip'){ P.bitsetFlip(bs, +tk[1]); }
          else if(tk[0]==='get'){ log.push('get '+tk[1]+' = '+P.bitsetGet(bs, +tk[1])); continue; }
          else if(tk[0]==='count'){ log.push('count = '+P.bitsetCount(bs)); continue; }
          log.push(tk[0]+' '+tk[1]+' -> count '+P.bitsetCount(bs));
        }
        $('out').textContent=log.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('ops').value=''; $('out').textContent='运行位集合操作，观察置位与计数'; });
  })();
}
</script>
