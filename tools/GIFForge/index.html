<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIFForge — 离线 GIF 动画制作器 · 单文件零依赖</title>
<meta name="description" content="单文件、零依赖、完全离线的 GIF 动画制作器：拖入图片或雪碧图，排帧、调延时、设循环，纯 JS GIF89a 编码导出。数据不出浏览器。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="GIFForge — 离线 GIF 动画制作器">
<meta property="og:description" content="拖入图片或雪碧图，排帧调延时，纯 JS GIF89a 编码导出。单文件、零依赖、离线优先。">

<style>
:root{
  --bg:#0A0A0B; --card:#141417; --panel:#1A1B1E;
  --text:#FFFFFF; --text2:#A1A1AA; --text3:#71717A;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE; --purple:#A78BFA;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.5; overflow:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
input[type=range]{padding:0;border:none;background:transparent;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

.app{display:flex;flex-direction:column;height:100vh}
header{
  display:flex;align-items:center;gap:12px;padding:0 16px;height:52px;flex:none;
  border-bottom:1px solid var(--border);background:var(--card);
}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.2px}
.logo svg{flex:none}
.logo .tag{font-size:11px;font-weight:600;color:var(--purple);border:1px solid rgba(167,139,250,.35);border-radius:99px;padding:1px 8px}
.spacer{flex:1}
.hbtn{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:7px;
  border:1px solid var(--border);color:var(--text2);font-size:12.5px;font-weight:500;background:var(--panel);
}
.hbtn:hover{color:var(--text);border-color:var(--border-strong)}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.hbtn.primary:hover{filter:brightness(1.1)}
.hbtn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}

main{display:flex;flex:1;min-height:0}
.panel{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.panel h2{
  font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;
  padding:12px 14px 8px;flex:none;
}
.frames-panel{width:216px;flex:none}
.frames-list{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.frame-item{
  position:relative;border:1px solid var(--border);border-radius:8px;background:var(--panel);
  padding:8px;display:flex;gap:9px;align-items:center;cursor:grab;
}
.frame-item.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.frame-item.dragover{border-color:var(--info)}
.frame-thumb{
  width:52px;height:52px;flex:none;border-radius:5px;border:1px solid var(--border);
  background:
    linear-gradient(45deg,#232326 25%,transparent 25%,transparent 75%,#232326 75%),
    linear-gradient(45deg,#232326 25%,transparent 25%,transparent 75%,#232326 75%);
  background-size:12px 12px;background-position:0 0,6px 6px;background-color:#1c1c20;
  image-rendering:pixelated;object-fit:contain;
}
.frame-meta{flex:1;min-width:0}
.frame-meta .idx{font-size:12px;font-weight:600;color:var(--text2)}
.frame-meta .dly{display:flex;align-items:center;gap:4px;margin-top:4px}
.frame-meta .dly input{width:52px;padding:2px 5px;font-size:12px}
.frame-meta .dly span{font-size:11px;color:var(--text3)}
.frame-x{
  position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:5px;line-height:1;
  color:var(--text3);font-size:13px;display:flex;align-items:center;justify-content:center;
}
.frame-x:hover{color:#F87171;background:rgba(248,113,113,.12)}
.frames-actions{flex:none;padding:10px;border-top:1px solid var(--border);display:flex;gap:6px}
.frames-actions .hbtn{flex:1;justify-content:center;padding:0 4px}

.stage{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:22px;position:relative}
#previewCanvas{
  max-width:100%;max-height:100%;border:1px solid var(--border-strong);border-radius:6px;
  background:
    linear-gradient(45deg,#1b1b1f 25%,transparent 25%,transparent 75%,#1b1b1f 75%),
    linear-gradient(45deg,#1b1b1f 25%,transparent 25%,transparent 75%,#1b1b1f 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;background-color:#121215;
  image-rendering:auto;
}
.empty-hint{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  color:var(--text3);pointer-events:none;text-align:center;padding:20px;
}
.empty-hint svg{opacity:.5}
.empty-hint b{color:var(--text2);font-size:15px;font-weight:600}
.empty-hint span{font-size:12.5px;max-width:340px}
.transport{
  flex:none;display:flex;align-items:center;gap:10px;justify-content:center;
  padding:10px 16px;border-top:1px solid var(--border);background:var(--card);
}
.tbtn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel);
  display:inline-flex;align-items:center;justify-content:center;color:var(--text2);
}
.tbtn:hover{color:var(--text);border-color:var(--border-strong)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.transport .pos{font-size:12px;color:var(--text3);min-width:74px;text-align:center;font-variant-numeric:tabular-nums}

.settings{width:248px;flex:none;border-right:none;border-left:1px solid var(--border);overflow-y:auto}
.set-group{padding:4px 14px 14px;border-bottom:1px solid var(--border)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
.row label{font-size:12.5px;color:var(--text2);flex:none}
.row .val{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.row input[type=number]{width:74px}
.row select{width:118px}
.row input[type=range]{flex:1;min-width:0}
.stat{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-top:7px}
.stat b{color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums}
.export-box{padding:14px}
.export-box .hbtn{width:100%;justify-content:center;height:36px;font-size:13px}
.export-note{font-size:11.5px;color:var(--text3);margin-top:9px;text-align:center}
#exportStatus{font-size:12px;margin-top:9px;text-align:center;min-height:18px}
#exportStatus.ok{color:var(--ok)} #exportStatus.err{color:#F87171}

.dropzone{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(10,10,11,.82);backdrop-filter:blur(2px);
}
.dropzone.show{display:flex}
.dropzone .inner{
  border:2px dashed var(--accent);border-radius:16px;padding:44px 64px;text-align:center;
  color:var(--text);font-size:16px;font-weight:600;background:var(--card);
}
.dropzone .inner small{display:block;margin-top:8px;color:var(--text2);font-weight:400;font-size:12.5px}

dialog{
  background:var(--card);color:var(--text);border:1px solid var(--border-strong);border-radius:12px;
  padding:0;width:min(420px,92vw);
}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .dhead{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
dialog .dbody{padding:14px 18px}
dialog .dfoot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
#sheetPreview{width:100%;border:1px solid var(--border);border-radius:6px;margin-top:10px;image-rendering:pixelated;background:#121215}

footer{
  flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
  height:30px;border-top:1px solid var(--border);background:var(--card);
  font-size:11.5px;color:var(--text3);
}
footer a{color:var(--text3);text-decoration:none}
footer a:hover{color:var(--text2)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:5px;border:2px solid var(--card)}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:860px){.settings{width:210px}.frames-panel{width:180px}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>

<script>
'use strict';
/* =====================================================================
   GIFForge pure-function kernel — GIF89a encoder (LZW + median-cut)
   All functions below are side-effect free and Node-testable.
   ===================================================================== */

function gfU16le(n){ n = Math.max(0, Math.min(65535, n|0)); return [n & 255, (n >> 8) & 255]; }

function gfDelayCs(ms){
  var cs = Math.round((+ms || 0) / 10);
  if (cs < 2) cs = 2;
  if (cs > 65535) cs = 65535;
  return cs;
}

function gfFit(w, h, maxSide){
  w = Math.max(1, w|0); h = Math.max(1, h|0);
  if (!maxSide || (w <= maxSide && h <= maxSide)) return { w: w, h: h, scale: 1 };
  var s = maxSide / Math.max(w, h);
  return { w: Math.max(1, Math.round(w * s)), h: Math.max(1, Math.round(h * s)), scale: s };
}

function gfSliceSheet(sheetW, sheetH, cols, rows){
  cols = Math.max(1, cols|0); rows = Math.max(1, rows|0);
  var cw = Math.floor(sheetW / cols), ch = Math.floor(sheetH / rows);
  if (cw < 1 || ch < 1) return [];
  var rects = [];
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++)
    rects.push({ x: c * cw, y: r * ch, w: cw, h: ch });
  return rects;
}

function gfChunkBytes(bytes){
  var out = [];
  for (var i = 0; i < bytes.length; i += 255){
    var n = Math.min(255, bytes.length - i);
    out.push(n);
    for (var j = 0; j < n; j++) out.push(bytes[i + j]);
  }
  out.push(0);
  return out;
}

function gfPaletteBits(len){
  var bits = 0;
  while ((1 << (bits + 1)) < Math.max(2, len) && bits < 7) bits++;
  return bits; /* GCT entry count = 2^(bits+1) */
}

function gfQuantize(pixels, maxColors){

    for (var b = 0; b < boxes.length; b++){

    var r = 0, g = 0, bl = 0, n = box.length || 1;
    for (var j = 0; j < box.length; j++){ r += box[j][0]; g += box[j][1]; bl += box[j][2]; }

   emit code first, then grow code size when the entry about to be added

function gfLzwEncode(indices, minCodeSize){
  if (minCodeSize < 2) minCodeSize = 2;
  var CLEAR = 1 << minCodeSize, EOI = CLEAR + 1;

    acc |= code << nbits; nbits += codeSize;
    while (nbits >= 8){ out.push(acc & 255); acc >>>= 8; nbits -= 8; }
  }
  emit(CLEAR);
  if (!indices.length){
    emit(EOI);
    if (nbits) out.push(acc & 255);
    return out;
  }
  var mask = CLEAR - 1;
  var prefix = indices[0] & mask;
  for (var i = 1; i < indices.length; i++){
    var k = indices[i] & mask;
    var key = (prefix << 8) | k;

      emit(CLEAR);

  /* ---------- wiring ---------- */
  $('btnImport').addEventListener('click', function(){ $('fileInput').click(); });
  $('fileInput').addEventListener('change', function(){ loadFiles(this.files); this.value = ''; });
  $('btnSheet').addEventListener('click', function(){ $('sheetInput').click(); });
  $('sheetInput').addEventListener('change', function(){
    var f = this.files[0]; this.value = '';
    if (!f) return;
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function(){
      state.sheetImg = img;
      $('dlgSheet').showModal();
      drawSheetPreview();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });
  $('inpCols').addEventListener('input', drawSheetPreview);
  $('inpRows').addEventListener('input', drawSheetPreview);
  $('btnSheetCancel').addEventListener('click', function(){ $('dlgSheet').close(); });
  $('btnSheetOk').addEventListener('click', sliceAndImport);

  $('btnDup').addEventListener('click', function(){
    if (state.sel < 0) return;
    var fr = state.frames[state.sel];
    var cv = document.createElement('canvas');
    cv.width = fr.w; cv.height = fr.h;
    var cx = cv.getContext('2d');
    if (cx) cx.drawImage(fr.canvas, 0, 0);
    state.frames.splice(state.sel + 1, 0, { canvas: cv, w: fr.w, h: fr.h, delayMs: fr.delayMs });
    state.sel++;
    renderAll();
  });
  $('btnClear').addEventListener('click', function(){
    stopPlay();
    state.frames = []; state.sel = -1;
    renderAll();
  });
  $('btnApplyDelay').addEventListener('click', function(){
    var d = Math.max(20, +$('inpDelay').value || 100);
    state.frames.forEach(function(f){ f.delayMs = d; });
    renderAll();
  });
  $('btnPlay').addEventListener('click', togglePlay);
  $('btnPrev').addEventListener('click', function(){
    if (!state.frames.length) return;
    stopPlay();
    state.sel = (state.sel - 1 + state.frames.length) % state.frames.length;
    renderAll();
  });
  $('btnNext').addEventListener('click', function(){
    if (!state.frames.length) return;
    stopPlay();
    state.sel = (state.sel + 1) % state.frames.length;
    renderAll();
  });
  $('btnExport').addEventListener('click', exportGif);
  $('selSize').addEventListener('change', function(){ renderPreview(); renderStats(); });
  $('btnLang').addEventListener('click', function(){
    state.lang = state.lang === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem('gifforge-lang', state.lang); } catch (e){}
    applyLang();
  });

  /* drag & drop + paste */
  var dz = $('dropzone'), dragDepth = 0;
  window.addEventListener('dragenter', function(e){
    if (e.dataTransfer && Array.prototype.some.call(e.dataTransfer.types || [], function(x){ return x === 'Files'; })){
      dragDepth++; dz.classList.add('show');
    }
  });
  window.addEventListener('dragleave', function(){
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dz.classList.remove('show');
  });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('drop', function(e){
    e.preventDefault();
    dragDepth = 0; dz.classList.remove('show');
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
  });
  document.addEventListener('paste', function(e){
    if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length) loadFiles(e.clipboardData.files);
  });

  /* boot */
  try {
    var saved = localStorage.getItem('gifforge-lang');
    if (saved === 'en' || saved === 'zh') state.lang = saved;
  } catch (e){}
  applyLang();
  renderAll();

  if ('serviceWorker' in navigator){
    try { navigator.serviceWorker.register('sw.js'); } catch (e){}
  }

  /* test hook */
  window.__GIFFORGE__ = {
    version: GF.version,
    kernel: GF,
    state: state,
    addFrameFromCanvas: addFrameFromCanvas,
    exportGif: exportGif,
    applyLang: applyLang,
    renderAll: renderAll,
    t: t
  };
})(); }
</script>
</body>
</html>
