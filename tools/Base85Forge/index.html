<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>Base85Forge — Ascii85 + Z85 编解码，z 压缩 + 尾组截断 + RFC 32 向量</title>
<meta property="og:title" content="Base85Forge">
<meta property="og:description" content="Ascii85 + Z85 编解码，z 压缩 + 尾组截断 + RFC 32 向量">
<meta property="og:image" content="./og.png">
<meta name="description" content="Ascii85 + Z85 编解码，z 压缩 + 尾组截断 + RFC 32 向量 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
</head>
<body>
<div class="app">
  <h1>Base85Forge</h1>
  <p class="sub">Ascii85 + Z85 编解码，z 压缩 + 尾组截断 + RFC 32 向量 · 单文件 · 零依赖 · 本地优先</p>

<div class="opt">
  <label>变体
    <select id="variant">
      <option value="ascii85">Ascii85（Adobe，含 z 压缩）</option>
      <option value="z85">Z85（ZeroMQ，需 4 字节对齐）</option>
    </select>
  </label>
  <label>方向
    <select id="mode">
      <option value="enc">文本 → Base85</option>
      <option value="dec">Base85 → 文本</option>
    </select>
  </label>
</div>
<label>输入</label>
<textarea id="txt" rows="4">Man is distinguished, not only by his reason</textarea>
<div class="row">
  <button id="run">转换</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">比 Base64 省 ~7% 的编码</div>
<script>
var Z85_CHARS='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.-:+=^!/*?&<>()[]{}@%$#';
function b85StrToBytes(s){
  var out=[], str=String(s);
  for(var i=0;i<str.length;i++){
    var c=str.codePointAt(i);
    if(c>0xFFFF) i++;
    if(c<0x80) out.push(c);
    else if(c<0x800){ out.push(0xC0|(c>>6), 0x80|(c&63)); }
    else if(c<0x10000){ out.push(0xE0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63)); }
    else { out.push(0xF0|(c>>18), 0x80|((c>>12)&63), 0x80|((c>>6)&63), 0x80|(c&63)); }
  }
  return out;
}
function b85BytesToStr(bytes){
  var s='';
  for(var i=0;i<bytes.length;){
    var b=bytes[i];
    if(b<0x80){ s+=String.fromCharCode(b); i++; }
    else if(b<0xE0){ s+=String.fromCharCode(((b&31)<<6)|(bytes[i+1]&63)); i+=2; }
    else if(b<0xF0){ s+=String.fromCharCode(((b&15)<<12)|((bytes[i+1]&63)<<6)|(bytes[i+2]&63)); i+=3; }
    else { var cp=((b&7)<<18)|((bytes[i+1]&63)<<12)|((bytes[i+2]&63)<<6)|(bytes[i+3]&63);
      s+=String.fromCodePoint(cp); i+=4; }
  }
  return s;
}
function b85Encode(bytes){
  var out='';
  for(var i=0;i<bytes.length;i+=4){
    var chunk=bytes.slice(i,i+4), pad=4-chunk.length;
    while(chunk.length<4) chunk.push(0);
    var v=((chunk[0]*16777216)+(chunk[1]*65536)+(chunk[2]*256)+chunk[3]);
    if(v===0&&pad===0){ out+='z'; continue; }
    var cs=[];
    for(var j=0;j<5;j++){ cs.unshift(String.fromCharCode(33+v%85)); v=Math.floor(v/85); }
    out+=cs.join('').slice(0,5-pad);
  }
  return { value:'<~'+out+'~>', error:null };
}
function b85Decode(text){
  var s=String(text).replace(/\s+/g,'');
  if(s.slice(0,2)==='<~') s=s.slice(2);
  if(s.slice(-2)==='~>') s=s.slice(0,-2);
  var out=[], group=[];
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if(ch==='z'){
      if(group.length) return { value:null, error:'z 出现在组内（位置 '+i+'）' };
      out.push(0,0,0,0); continue;
    }
    var c=ch.charCodeAt(0);
    if(c<33||c>117) return { value:null, error:'非法字符 "'+ch+'"（位置 '+i+'）' };
    group.push(c-33);
    if(group.length===5){
      var v=0;
      for(var j=0;j<5;j++) v=v*85+group[j];
      if(v>4294967295) return { value:null, error:'组溢出（位置 '+i+'）' };
      out.push(Math.floor(v/16777216)&255,(v>>>16)&255,(v>>>8)&255,v&255);
      group=[];
    }
  }
  if(group.length===1) return { value:null, error:'尾组长度不能为 1' };
  if(group.length){
    var pad=5-group.length, g2=group.slice();
    for(var k=0;k<pad;k++) g2.push(84);
    var v2=0;
    for(var j2=0;j2<5;j2++) v2=v2*85+g2[j2];
    var bs=[Math.floor(v2/16777216)&255,(v2>>>16)&255,(v2>>>8)&255,v2&255];
    for(var t=0;t<4-pad;t++) out.push(bs[t]);
  }
  return { value:out, error:null };
}
function z85Encode(bytes){
  if(bytes.length%4!==0) return { value:null, error:'Z85 要求字节数为 4 的倍数（当前 '+bytes.length+'）' };
  var out='';
  for(var i=0;i<bytes.length;i+=4){
    var v=(bytes[i]*16777216)+(bytes[i+1]*65536)+(bytes[i+2]*256)+bytes[i+3];
    var cs=[];
    for(var j=0;j<5;j++){ cs.unshift(Z85_CHARS[v%85]); v=Math.floor(v/85); }
    out+=cs.join('');
  }
  return { value:out, error:null };
}
function z85Decode(text){
  var s=String(text).replace(/\s+/g,'');
  if(s.length%5!==0) return { value:null, error:'Z85 字符数须为 5 的倍数（当前 '+s.length+'）' };
  var out=[];
  for(var i=0;i<s.length;i+=5){
    var v=0;
    for(var j=0;j<5;j++){
      var idx=Z85_CHARS.indexOf(s[i+j]);
      if(idx<0) return { value:null, error:'非法字符 "'+s[i+j]+'"（位置 '+(i+j)+'）' };
      v=v*85+idx;
    }
    if(v>4294967295) return { value:null, error:'组溢出（位置 '+i+'）' };
    out.push(Math.floor(v/16777216)&255,(v>>>16)&255,(v>>>8)&255,v&255);
  }
  return { value:out, error:null };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { b85Encode:b85Encode, b85Decode:b85Decode, z85Encode:z85Encode, z85Decode:z85Decode,
    b85StrToBytes:b85StrToBytes, b85BytesToStr:b85BytesToStr };
}
if (typeof window !== 'undefined') {
  window.Base85ForgePure = { b85Encode:b85Encode, b85Decode:b85Decode, z85Encode:z85Encode, z85Decode:z85Decode,
    b85StrToBytes:b85StrToBytes, b85BytesToStr:b85BytesToStr };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.Base85ForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var variant=$('variant').value, mode=$('mode').value, t=$('txt').value;
      var r;
      if(mode==='enc'){
        var bytes=P.b85StrToBytes(t);
        r=variant==='ascii85'?P.b85Encode(bytes):P.z85Encode(bytes);
        if(r.error){ $('err').textContent=r.error; return; }
        $('out').textContent=r.value+'\n\n原始 '+bytes.length+' 字节 → 编码 '+r.value.length+' 字符';
      } else {
        r=variant==='ascii85'?P.b85Decode(t):P.z85Decode(t);
        if(r.error){ $('err').textContent=r.error; return; }
        $('out').textContent=P.b85BytesToStr(r.value);
      }
    });
    $('clear').addEventListener('click', function(){ $('txt').value=''; $('out').textContent='比 Base64 省 ~7% 的编码'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
</body>
</html>
