<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */

a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}

/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}

<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>McpForge</h1>
  <p class="sub">MCP 配置：服务器校验、传输方式识别、命令行参数与环境变量解析、硬编码密钥审计，一键产出 mcpServers JSON · 单文件 · 零依赖 · 本地优先</p>

<label>服务器名称</label>
<input type="text" id="name" value="filesystem">
<label>启动命令（stdio，留空则用 URL）</label>
<input type="text" id="cmd" value="npx">
<label>命令参数（空格分隔，支持引号）</label>
<input type="text" id="args" value="-y @modelcontextprotocol/server-filesystem /tmp">
<label>远程 URL（sse / http 传输，与命令二选一）</label>
<input type="text" id="url" value="">
<label>环境变量（每行 KEY=VALUE）</label>
<textarea id="env" rows="3">API_TOKEN=${MY_TOKEN}</textarea>
<div class="row"><button id="gen">生成配置</button><button class="ghost" id="copy">复制 JSON</button></div>
<div class="err" id="err"></div>
<div class="out" id="out">MCP 配置将显示在这里</div>
<label>或粘贴现有配置做体检</label>
<textarea id="audit" rows="5">{"mcpServers":{"demo":{"command":"npx","args":["-y","server"]}}}</textarea>
<div class="row"><button id="run">体检配置</button></div>
<div class="out" id="report">体检报告将显示在这里</div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>

var TRANSPORTS = ['stdio','sse','http'];
function validateServer(name, cfg){
  var errs=[], warns=[];
  if(!name || !/^[A-Za-z0-9_-]+$/.test(name)) errs.push('服务器名只能包含字母、数字、连字符和下划线');
  if(!cfg || typeof cfg!=='object'){ errs.push('配置必须是对象'); return {valid:false, errors:errs, warnings:warns}; }
  var hasCmd = typeof cfg.command === 'string' && cfg.command.length>0;
  var hasUrl = typeof cfg.url === 'string' && cfg.url.length>0;
  if(!hasCmd && !hasUrl) errs.push('必须提供 command（stdio）或 url（sse/http）');
  if(hasCmd && hasUrl) warns.push('同时提供 command 与 url，客户端行为未定义');
  if(cfg.args !== undefined && !Array.isArray(cfg.args)) errs.push('args 必须是数组');
  if(cfg.env !== undefined && (typeof cfg.env!=='object' || Array.isArray(cfg.env))) errs.push('env 必须是对象');
  if(hasUrl && !/^https?:\/\//.test(cfg.url)) errs.push('url 必须以 http:// 或 https:// 开头');
  if(hasUrl && /^http:\/\//.test(cfg.url) && !/^http:\/\/(localhost|127\.0\.0\.1)/.test(cfg.url))
    warns.push('非本地地址建议使用 https，避免凭据明文传输');
  if(cfg.env){
    for(var k in cfg.env){
      if(!cfg.env.hasOwnProperty(k)) continue;
      var v=String(cfg.env[k]);
      if(/^(gh[pousr]_|sk-|xox[baprs]-|AKIA)/.test(v)) warns.push('env.'+k+' 疑似硬编码真实密钥，建议改用 ${ENV_VAR} 占位');
    }
  }
  return {valid: errs.length===0, errors:errs, warnings:warns};
}
function detectTransport(cfg){
  if(!cfg || typeof cfg!=='object') return 'unknown';
  if(typeof cfg.command === 'string' && cfg.command) return 'stdio';
  if(typeof cfg.url === 'string' && /\/sse\b/.test(cfg.url)) return 'sse';
  if(typeof cfg.url === 'string' && cfg.url) return 'http';
  return 'unknown';
}
function buildConfig(servers){
  var out={mcpServers:{}};
  for(var i=0;i<servers.length;i++){
    var s=servers[i];
    if(!s || !s.name) continue;
    var c={};
    if(s.command){ c.command=s.command; if(s.args && s.args.length) c.args=s.args; }
    else if(s.url){ c.url=s.url; }
    if(s.env && Object.keys(s.env).length) c.env=s.env;
    out.mcpServers[s.name]=c;
  }
  return out;
}
function parseArgs(str){
  if(!str) return [];
  var out=[], cur='', q=null;
  for(var i=0;i<str.length;i++){
    var ch=str.charAt(i);
    if(q){ if(ch===q){ q=null; } else { cur+=ch; } }
    else if(ch==='"' || ch==="'"){ q=ch; }
    else if(ch===' '){ if(cur){ out.push(cur); cur=''; } }
    else { cur+=ch; }
  }
  if(cur) out.push(cur);
  return out;
}
function parseEnv(str){
  var out={};
  if(!str) return out;
  var lines=String(str).split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln || ln.charAt(0)==='#') continue;
    var eq=ln.indexOf('=');
    if(eq<1) continue;
    out[ln.slice(0,eq).trim()]=ln.slice(eq+1).trim();
  }
  return out;
}
function auditConfig(obj){
  var res={servers:[], totalErrors:0, totalWarnings:0};
  if(!obj || typeof obj!=='object' || !obj.mcpServers){
    return {servers:[], totalErrors:1, totalWarnings:0, fatal:'缺少顶层 mcpServers 字段'};
  }
  for(var name in obj.mcpServers){
    if(!obj.mcpServers.hasOwnProperty(name)) continue;
    var cfg=obj.mcpServers[name];
    var v=validateServer(name, cfg);
    res.servers.push({name:name, transport:detectTransport(cfg), valid:v.valid, errors:v.errors, warnings:v.warnings});
    res.totalErrors += v.errors.length;
    res.totalWarnings += v.warnings.length;
  }
  return res;
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { validateServer:validateServer, detectTransport:detectTransport, buildConfig:buildConfig, parseArgs:parseArgs, parseEnv:parseEnv, auditConfig:auditConfig, TRANSPORTS:TRANSPORTS }; }
if (typeof window !== 'undefined') { window.McpForgePure = { validateServer:validateServer, detectTransport:detectTransport, buildConfig:buildConfig, parseArgs:parseArgs, parseEnv:parseEnv, auditConfig:auditConfig, TRANSPORTS:TRANSPORTS }; }

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.McpForgePure;
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function gen(){
    var name=$('name').value.trim();
    var cmd=$('cmd').value.trim();
    var url=$('url').value.trim();
    var spec={name:name, env:P.parseEnv($('env').value)};
    if(cmd){ spec.command=cmd; spec.args=P.parseArgs($('args').value); }
    else if(url){ spec.url=url; }
    var cfg=P.buildConfig([spec]);
    var v=P.validateServer(name, cfg.mcpServers[name]||{});
    $('err').textContent = v.errors.join('；');
    var warn = v.warnings.length ? '<div style="color:var(--warn);font-size:13px;margin-top:8px">⚠ '+v.warnings.map(esc).join('<br>⚠ ')+'</div>' : '';
    $('out').innerHTML = '<div class="kv"><b>传输方式</b><span>'+esc(P.detectTransport(cfg.mcpServers[name]||{}))+'</span></div>'
      + '<pre style="margin:10px 0 0;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace">'
      + esc(JSON.stringify(cfg,null,2)) + '</pre>' + warn;
  }
  function run(){
    var obj;
    try { obj=JSON.parse($('audit').value); }
    catch(e){ $('report').innerHTML='<span style="color:var(--warn)">JSON 解析失败：'+esc(e.message)+'</span>'; return; }
    var r=P.auditConfig(obj);
    if(r.fatal){ $('report').innerHTML='<span style="color:var(--warn)">'+esc(r.fatal)+'</span>'; return; }
    var h='<div class="grid"><div class="kv"><b>服务器数</b><span>'+r.servers.length+'</span></div>'
        + '<div class="kv"><b>错误 / 警告</b><span>'+r.totalErrors+' / '+r.totalWarnings+'</span></div></div>';
    for(var i=0;i<r.servers.length;i++){
      var s=r.servers[i];
      h += '<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line)">'
        + '<b>'+esc(s.name)+'</b> <span class="badge">'+esc(s.transport)+'</span> '
        + (s.valid?'<span style="color:var(--ok)">✓ 通过</span>':'<span style="color:var(--warn)">✗ 有问题</span>');
      for(var j=0;j<s.errors.length;j++) h+='<div style="color:var(--warn);font-size:13px">✗ '+esc(s.errors[j])+'</div>';
      for(var k=0;k<s.warnings.length;k++) h+='<div style="color:var(--muted);font-size:13px">⚠ '+esc(s.warnings[k])+'</div>';
      h += '</div>';
    }
    $('report').innerHTML=h;
  }
  $('gen').addEventListener('click', gen);
  $('run').addEventListener('click', run);
  $('copy').addEventListener('click', function(){
    var t=$('out').textContent||'';
    if(navigator.clipboard) navigator.clipboard.writeText(t);
  });
  gen(); run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
