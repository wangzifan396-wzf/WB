*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}

#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#nanoToast.bad{border-color:rgba(239,68,68,.55)}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>

(function(){
  'use strict';
  /* bencode: i<int>e / <len>:<bytes> / l...e / d...e
     字节串按 UTF-8 尝试解码，失败或含控制字符时降级为 <hex:...> 表示。 */

  function toBytes(s){
    if(s instanceof Uint8Array) return s;
    var str=String(s), out=[], i, c;
    for(i=0;i<str.length;i++){
      c=str.charCodeAt(i);
      if(c<0x80) out.push(c);
      else if(c<0x800){ out.push(0xC0|c>>6, 0x80|c&63); }
      else if(c>=0xD800 && c<0xDC00 && i+1<str.length){
        var c2=str.charCodeAt(i+1), cp=0x10000+((c-0xD800)<<10)+(c2-0xDC00); i++;
        out.push(0xF0|cp>>18, 0x80|cp>>12&63, 0x80|cp>>6&63, 0x80|cp&63);
      } else { out.push(0xE0|c>>12, 0x80|c>>6&63, 0x80|c&63); }
    }
    return new Uint8Array(out);
  }
  function utf8(b){
    var s='', i=0, c;
    while(i<b.length){
      c=b[i];
      if(c<0x80){ s+=String.fromCharCode(c); i++; }
      else if(c>=0xC0 && c<0xE0 && i+1<b.length){ s+=String.fromCharCode((c&31)<<6|b[i+1]&63); i+=2; }
      else if(c>=0xE0 && c<0xF0 && i+2<b.length){ s+=String.fromCharCode((c&15)<<12|(b[i+1]&63)<<6|b[i+2]&63); i+=3; }
      else if(c>=0xF0 && i+3<b.length){
        var cp=((c&7)<<18|(b[i+1]&63)<<12|(b[i+2]&63)<<6|b[i+3]&63)-0x10000;
        s+=String.fromCharCode(0xD800+(cp>>10), 0xDC00+(cp&1023)); i+=4;
      } else return null;
    }
    return s;
  }
  function printable(b){
    for(var i=0;i<b.length;i++){ if(b[i]<0x09 || (b[i]>0x0D && b[i]<0x20)) return false; }
    var s=utf8(b);
    return s===null ? false : s;
  }
  function toHex(b){ var o=''; for(var i=0;i<b.length;i++){var x=b[i].toString(16); o+= x.length<2?'0'+x:x;} return o; }

  function decode(input){
    var b = toBytes(input), pos = 0, MAXDEPTH = 64;

    function err(m){ throw new Error(m + '（偏移 ' + pos + '）'); }
    function readInt(stop){
      var s = '';
      while(pos < b.length && b[pos] !== stop){ s += String.fromCharCode(b[pos]); pos++; }
      if(pos >= b.length) err('缺少终止符 "' + String.fromCharCode(stop) + '"');
      pos++;
      if(!/^-?\d+$/.test(s)) err('非法整数 "' + s + '"');
      if(/^-0$/.test(s)) err('不允许 -0');
      if(/^0\d/.test(s) || /^-0\d/.test(s)) err('整数不允许前导零 "' + s + '"');
      return parseInt(s, 10);
    }
    function parse(depth){
      if(depth > MAXDEPTH) err('嵌套过深（>' + MAXDEPTH + '）');
      if(pos >= b.length) err('数据意外结束');
      var ch = b[pos];
      if(ch === 0x69){ pos++; return {t:'int', v:readInt(0x65)}; }               // 'i'
      if(ch === 0x6C){ pos++;                                                     // 'l'
        var arr=[];
        while(pos<b.length && b[pos]!==0x65) arr.push(parse(depth+1));
        if(pos>=b.length) err('列表缺少 "e"');
        pos++; return {t:'list', v:arr};
      }
      if(ch === 0x64){ pos++;                                                     // 'd'
        var d=[], prev=null;
        while(pos<b.length && b[pos]!==0x65){
          var k = parse(depth+1);
          if(k.t!=='str') err('字典键必须是字符串');
          if(prev!==null && k.raw < prev) err('字典键未按字节序升序："'+k.v+'" 在 "'+prev+'" 之后');
          prev = k.raw;
          if(pos>=b.length || b[pos]===0x65) err('字典键 "'+k.v+'" 缺少值');
          d.push([k, parse(depth+1)]);
        }
        if(pos>=b.length) err('字典缺少 "e"');
        pos++; return {t:'dict', v:d};
      }
      if(ch>=0x30 && ch<=0x39){                                                   // 数字 -> 字符串
        var n = readInt(0x3A);
        if(n < 0) err('字符串长度为负');
        if(pos + n > b.length) err('字符串长度 '+n+' 超出剩余字节 '+(b.length-pos));
        var slice = b.subarray(pos, pos+n); pos += n;
        var p = printable(slice);
        return {t:'str', v: p===false ? '<hex:'+toHex(slice)+'>' : p, raw: toHex(slice), bin: p===false, len:n};
      }
      err('未知类型标记 "'+String.fromCharCode(ch)+'"');
    }
    try{
      var v = parse(0);
      if(pos !== b.length) return {value:null, error:'尾部有 '+(b.length-pos)+' 字节未消费（偏移 '+pos+'）'};
      return {value:v, error:''};
    }catch(e){ return {value:null, error:e.message}; }
  }

  function toPlain(node){
    if(!node) return null;
    if(node.t==='int') return node.v;
    if(node.t==='str') return node.v;
    if(node.t==='list'){ var a=[]; for(var i=0;i<node.v.length;i++) a.push(toPlain(node.v[i])); return a; }
    var o={}; for(var j=0;j<node.v.length;j++) o[node.v[j][0].v]=toPlain(node.v[j][1]); return o;
  }

  function encode(val){
    var parts = [];
    function put(s){ parts.push(s); }
    function walk(v, depth){
      if(depth > 64) throw new Error('嵌套过深');
      if(typeof v === 'number'){
        if(!isFinite(v) || Math.floor(v)!==v) throw new Error('bencode 只支持整数，收到 '+v);
        put('i'+v+'e'); return;
      }
      if(typeof v === 'string'){ var by=toBytes(v); put(by.length+':'+v); return; }
      if(v instanceof Array){ put('l'); for(var i=0;i<v.length;i++) walk(v[i], depth+1); put('e'); return; }
      if(v && typeof v === 'object'){
        var ks = Object.keys(v).sort();
        put('d');
        for(var j=0;j<ks.length;j++){ put(toBytes(ks[j]).length+':'+ks[j]); walk(v[ks[j]], depth+1); }
        put('e'); return;
      }
      throw new Error('不支持的类型：'+(v===null?'null':typeof v));
    }
    try{ walk(val, 0); return {value:parts.join(''), error:''}; }
    catch(e){ return {value:null, error:e.message}; }
  }

  function summary(node){
    var s={int:0,str:0,list:0,dict:0,bytes:0};
    (function w(n){
      if(!n) return;
      s[n.t]=(s[n.t]||0)+1;
      if(n.t==='str') s.bytes += (n.len||0);
      if(n.t==='list'){ for(var i=0;i<n.v.length;i++) w(n.v[i]); }
      if(n.t==='dict'){ for(var j=0;j<n.v.length;j++){ w(n.v[j][0]); w(n.v[j][1]); } }
    })(node);
    return s;
  }

  var API={decode:decode, encode:encode, toPlain:toPlain, summary:summary, toBytes:toBytes};
  if(typeof module!=='undefined' && module.exports) module.exports=API;
  if(typeof window!=='undefined') window.__BencodeForge__=API;
})();

</script>
<script>

(function(){
  if(typeof window==='undefined' || !window.document) return;
  var C=window.__BencodeForge__, D=document, $=function(i){return D.getElementById(i);};
  var DEMO='d8:announce30:http://tracker.example.com/ann4:infod6:lengthi1024e4:name9:hello.txt12:piece lengthi16384eee';
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function kv(k,v){return '<div class="kv"><b>'+esc(k)+'</b><span>'+esc(v)+'</span></div>';}
  function T(k){return (window.nanoT||function(x){return x;})(k);}
  function dec(){
    var r=C.decode($('bc_in').value);
    $('bc_err').textContent=r.error||'';
    if(!r.value){ $('bc_out').value=''; $('bc_stat').innerHTML=''; return; }
    $('bc_out').value=JSON.stringify(C.toPlain(r.value),null,2);
    var s=C.summary(r.value);
    $('bc_stat').innerHTML=kv(T('s_dict'),s.dict)+kv(T('s_list'),s.list)
      +kv(T('s_str'),s.str)+kv(T('s_int'),s.int)+kv(T('s_bytes'),s.bytes);
  }
  function enc(){
    var v;
    try{ v=JSON.parse($('bc_out').value||$('bc_in').value); }
    catch(e){ $('bc_err').textContent=T('e_json')+'：'+e.message; return; }
    var r=C.encode(v);
    $('bc_err').textContent=r.error||'';
    if(r.value){ $('bc_in').value=r.value; $('bc_stat').innerHTML=''; }
  }
  window.nanoRerender=dec;
  $('bc_dec').addEventListener('click',dec);
  $('bc_enc').addEventListener('click',enc);
  $('bc_in').addEventListener('input',dec);
  $('bc_demo').addEventListener('click',function(){ $('bc_in').value=DEMO; dec(); });
  $('bc_copy').addEventListener('click',function(){
    var t=$('bc_out').value; if(!t){ if(window.nanoToast) window.nanoToast(T('nores'),1); return; }
    if(navigator.clipboard) navigator.clipboard.writeText(t);
  });
  $('bc_in').value=DEMO; dec();
})();

</script>

<script>

window.nanoToast=show;

})();

(function(){
  function cur(){try{return localStorage.getItem('nano-lang')==='en'?'en':'zh';}catch(e){return 'zh';}}
  function dict(){return I18N[cur()]||I18N.zh;}
  function apply(){
    var l=cur(), d=dict();
    document.documentElement.lang = (l==='en'?'en':'zh-CN');
    var ns=document.querySelectorAll('[data-i18n]');
    for(var i=0;i<ns.length;i++){var k=ns[i].getAttribute('data-i18n');if(d[k]!=null)ns[i].textContent=d[k];}
    var ps=document.querySelectorAll('[data-i18n-ph]');
    for(var j=0;j<ps.length;j++){var k2=ps[j].getAttribute('data-i18n-ph');if(d[k2]!=null)ps[j].setAttribute('placeholder',d[k2]);}
    var b=document.getElementById('langBtn'); if(b) b.textContent=(l==='en'?'中文':'EN');
    if(d.title) document.title=d.title;
  }
  window.nanoT=function(k){var d=dict();return d[k]!=null?d[k]:k;};
  window.nanoApplyI18n=apply;
  var b=document.getElementById('langBtn');
  if(b) b.addEventListener('click', function(){
    try{localStorage.setItem('nano-lang', cur()==='en'?'zh':'en');}catch(e){}
    apply(); if(window.nanoRerender) window.nanoRerender();
  });
  apply();
})();
