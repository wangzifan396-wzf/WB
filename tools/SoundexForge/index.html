/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}

<body>
<div class="app">
  <h1>SoundexForge</h1>
  <p class="sub">Soundex + Metaphone 语音编码，人名纠错与同音异拼分组 · 单文件 · 零依赖 · 本地优先</p>

<label>单词列表（每行一个英文单词）</label>
<textarea id="txt" rows="6">Robert
Rupert
Smith
Smyth
Johnson
Jonson</textarea>
<label>查询词（可留空只看分组）</label>
<input id="q" type="text" value="Smithe" style="width:100%">
<div class="row">
  <button id="run">语音匹配</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>结果</label>
<div class="out" id="out" aria-live="polite">同音异拼分组与近似检索</div>
<script>
function sxSoundex(word){
  var w=String(word).toUpperCase().replace(/[^A-Z]/g,'');
  if(!w) return { value:null, error:'需要至少一个英文字母' };
  var codes={ B:'1',F:'1',P:'1',V:'1', C:'2',G:'2',J:'2',K:'2',Q:'2',S:'2',X:'2',Z:'2',
    D:'3',T:'3', L:'4', M:'5',N:'5', R:'6' };
  var first=w[0], out=first, prev=codes[first]||'';
  for(var i=1;i<w.length;i++){
    var ch=w[i], c=codes[ch]||'';
    if(ch==='H'||ch==='W') continue; // H/W transparent: keep prev
    if(c && c!==prev) out+=c;
    prev=c;
  }
  out=(out+'000').slice(0,4);
  return { value:out, error:null };
}
function sxMetaphone(word){
  var w=String(word).toUpperCase().replace(/[^A-Z]/g,'');
  if(!w) return { value:null, error:'需要至少一个英文字母' };
  // simplified metaphone: transformations on common digraphs
  var s=w;
  s=s.replace(/^KN|^GN|^PN|^WR|^AE/,function(m){ return m.slice(1); });
  s=s.replace(/^X/,'S');
  s=s.replace(/MB$/,'M');
  s=s.replace(/PH/g,'F').replace(/TH/g,'0').replace(/SH/g,'X').replace(/CH/g,'X');
  s=s.replace(/CK/g,'K').replace(/SCH/g,'SK');
  s=s.replace(/C(?=[IEY])/g,'S').replace(/C/g,'K');
  s=s.replace(/G(?=[IEY])/g,'J').replace(/GH(?![AEIOU])/g,'').replace(/G/g,'K');
  s=s.replace(/D(?=G[IEY])/g,'J').replace(/D/g,'T');
  s=s.replace(/Z/g,'S').replace(/V/g,'F').replace(/Q/g,'K').replace(/W(?![AEIOU])/g,'').replace(/Y(?![AEIOU])/g,'');
  s=s.replace(/X/g,'KS');
  var first=s[0]||'';
  var rest=s.slice(1).replace(/[AEIOU]/g,'');
  s=first+rest;
  s=s.replace(/(.)\1+/g,'$1');
  return { value:s, error:null };
}
function sxGroup(words, algo){
  if(!Array.isArray(words)||!words.length) return { value:null, error:'单词列表为空' };
  var f=algo==='metaphone'?sxMetaphone:sxSoundex;
  var map={};
  for(var i=0;i<words.length;i++){
    var r=f(words[i]);
    if(r.error) return { value:null, error:'"'+words[i]+'": '+r.error };
    (map[r.value]=map[r.value]||[]).push(words[i]);
  }
  return { value:map, error:null };
}
function sxMatch(query, words, algo){
  var f=algo==='metaphone'?sxMetaphone:sxSoundex;
  var q=f(query);
  if(q.error) return { value:null, error:q.error };
  var out=[];
  for(var i=0;i<words.length;i++){
    var r=f(words[i]);
    if(!r.error && r.value===q.value) out.push(words[i]);
  }
  return { value:{ code:q.value, matches:out }, error:null };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { sxSoundex:sxSoundex, sxMetaphone:sxMetaphone, sxGroup:sxGroup, sxMatch:sxMatch };
}
if (typeof window !== 'undefined') {
  window.SoundexForgePure = { sxSoundex:sxSoundex, sxMetaphone:sxMetaphone, sxGroup:sxGroup, sxMatch:sxMatch };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.SoundexForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var words=$('txt').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
      var g=P.sxGroup(words, 'soundex');
      if(g.error){ $('err').textContent=g.error; return; }
      var lines=['Soundex 分组:'];
      for(var code in g.value){
        var mark=g.value[code].length>1?'  ← 同音异拼':'';
        lines.push('  '+code+': '+g.value[code].join(', ')+mark);
      }
      var q=$('q').value.trim();
      if(q){
        var mr=P.sxMatch(q, words, 'soundex');
        if(mr.error){ $('err').textContent=mr.error; return; }
        lines.push('', '查询 "'+q+'" ('+mr.value.code+') → '+(mr.value.matches.length?mr.value.matches.join(', '):'无匹配'));
        var mm=P.sxMatch(q, words, 'metaphone');
        lines.push('Metaphone ('+mm.value.code+') → '+(mm.value.matches.length?mm.value.matches.join(', '):'无匹配'));
      }
      $('out').textContent=lines.join('\n');
    });
    $('clear').addEventListener('click', function(){ $('txt').value=''; $('q').value=''; $('out').textContent='同音异拼分组与近似检索'; });
  })();
}
</script>
