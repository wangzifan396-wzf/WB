/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;

button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}

<body>
<div class="app">
  <h1>InterestForge</h1>
  <p class="sub">复利终值与等额本息贷款摊销表计算 · 单文件 · 零依赖 · 本地优先</p>

<label for="ip">本金</label>
<input id="ip" type="number" value="12000" min="0">
<label for="ir">年利率（%）</label>
<input id="ir" type="number" value="6" min="0" step="0.01">
<label for="iy">年限</label>
<input id="iy" type="number" value="3" min="0.1" step="0.5">
<div class="opt">
  <label>复利频率
    <select id="ifreq">
      <option value="1">年</option>
      <option value="12" selected>月</option>
      <option value="4">季</option>
      <option value="365">日</option>
    </select>
  </label>
</div>
<div class="row">
  <button id="comp">复利终值</button>
  <button id="amort">贷款摊销表</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">选择计算方式</div>
<script>
function round2(x){ return Math.round((x+Number.EPSILON)*100)/100; }
function compound(principal, rate, years, opts){
  opts=opts||{};
  var n=opts.frequency||1;
  principal=Number(principal); rate=Number(rate); years=Number(years);
  if(isNaN(principal) || !(principal>=0)) return {error:'principal invalid'};
  if(isNaN(rate) || isNaN(years) || years<=0) return {error:'rate/years invalid'};
  var fv = principal*Math.pow(1+rate/n, n*years);
  return {futureValue:fv, principal:principal, interest:fv-principal, rate:rate, years:years, frequency:n, error:null};
}
function amortize(principal, annualRate, years, opts){
  opts=opts||{};
  principal=Number(principal); annualRate=Number(annualRate); years=Number(years);
  if(isNaN(principal) || !(principal>0)) return {error:'principal must be > 0'};
  if(isNaN(years) || years<=0) return {error:'years must be > 0'};
  var n=Math.round(years*12);
  var r=annualRate/12;
  var payment;
  if(r===0){ payment=principal/n; }
  else { payment=principal*r/(1-Math.pow(1+r,-n)); }
  var balance=principal, schedule=[], totalInterest=0;
  for(var m=1;m<=n;m++){
    var interestPaid = balance*r;
    var principalPaid = payment - interestPaid;
    balance -= principalPaid;
    if(m===n){ principalPaid += balance; balance=0; }
    totalInterest += interestPaid;
    schedule.push({month:m, payment:round2(payment), principalPaid:round2(principalPaid), interestPaid:round2(interestPaid), balance:round2(Math.max(balance,0))});
  }
  return {monthlyPayment:round2(payment), totalPayment:round2(payment*n), totalInterest:round2(totalInterest), schedule:schedule, error:null};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { compound:compound, amortize:amortize };
}
if (typeof window !== 'undefined') {
  window.InterestForgePure = { compound:compound, amortize:amortize };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.InterestForgePure;
    $('comp').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var r=P.compound(Number($('ip').value), Number($('ir').value)/100, Number($('iy').value), {frequency:Number($('ifreq').value)});
        if(r.error){ $('out').textContent='错误：'+r.error; return; }
        $('out').textContent='终值 '+r.futureValue.toFixed(2)+'\n本金 '+r.principal+'\n利息 '+r.interest.toFixed(2)+'\n频率 '+(r.frequency)+'/年';
      } catch(e){ $('err').textContent=e.message; }
    });
    $('amort').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var r=P.amortize(Number($('ip').value), Number($('ir').value)/100, Number($('iy').value));
        if(r.error){ $('out').textContent='错误：'+r.error; return; }
        var lines=['月供 '+r.monthlyPayment+' · 总利息 '+r.totalInterest+' · 总还款 '+r.totalPayment,''];
        r.schedule.forEach(function(s){ lines.push('第'+s.month+'期  本金 '+s.principalPaid+' / 利息 '+s.interestPaid+' / 余额 '+s.balance); });
        $('out').textContent=lines.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('out').textContent='\u9009\u62e9\u8ba1\u7b97\u65b9\u5f0f'; });
  })();
}
</script>
