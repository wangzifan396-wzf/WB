<script>

(function(){
  'use strict';
  var MAXLEN = 4000;

  function toBytes(s){
    // UTF-8 编码，保证任意文本可逆
    var out=[];
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if(c<0x80) out.push(c);
      else if(c<0x800){ out.push(0xC0|(c>>6), 0x80|(c&63)); }
      else if(c>=0xD800 && c<0xDC00 && i+1<s.length){
        var c2=s.charCodeAt(i+1), cp=0x10000+((c-0xD800)<<10)+(c2-0xDC00); i++;
        out.push(0xF0|(cp>>18), 0x80|((cp>>12)&63), 0x80|((cp>>6)&63), 0x80|(cp&63));
      }
      else { out.push(0xE0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63)); }
    }
    return out;
  }
  function fromBytes(b){
    var s='', i=0;
    while(i<b.length){
      var c=b[i++];
      if(c<0x80) s+=String.fromCharCode(c);
      else if((c&0xE0)===0xC0) s+=String.fromCharCode(((c&31)<<6)|(b[i++]&63));
      else if((c&0xF0)===0xE0) s+=String.fromCharCode(((c&15)<<12)|((b[i++]&63)<<6)|(b[i++]&63));
      else {
        var cp=((c&7)<<18)|((b[i++]&63)<<12)|((b[i++]&63)<<6)|(b[i++]&63);
        cp-=0x10000;
        s+=String.fromCharCode(0xD800+(cp>>10), 0xDC00+(cp&1023));
      }
    }
    return s;
  }

  /* ---- BWT：对所有旋转排序，取末列 ---- */
  function bwt(bytes){
    var n=bytes.length;
    if(!n) return {last:[], index:0};
    var idx=new Array(n);
    for(var i=0;i<n;i++) idx[i]=i;
    idx.sort(function(a,b){
      for(var k=0;k<n;k++){
        var x=bytes[(a+k)%n], y=bytes[(b+k)%n];
        if(x!==y) return x-y;
      }
      return a-b;
    });
    var last=new Array(n), primary=0;
    for(var j=0;j<n;j++){
      last[j]=bytes[(idx[j]+n-1)%n];
      if(idx[j]===0) primary=j;
    }
    return {last:last, index:primary, order:idx};
  }
  function ibwt(last, primary){
    var n=last.length;
    if(!n) return [];
    if(primary<0 || primary>=n) return null;
    var counts=new Array(256).fill(0);
    for(var i=0;i<n;i++) counts[last[i]]++;
    var starts=new Array(256), sum=0;
    for(var c=0;c<256;c++){ starts[c]=sum; sum+=counts[c]; }
    var next=new Array(n), seen=new Array(256).fill(0);
    for(var j=0;j<n;j++){ next[starts[last[j]]+seen[last[j]]++] = j; }
    var out=new Array(n), p=next[primary];
    for(var k=0;k<n;k++){ out[k]=last[p]; p=next[p]; }
    return out;
  }

  /* ---- MTF ---- */
  function mtf(bytes){
    var tbl=[]; for(var i=0;i<256;i++) tbl.push(i);
    var out=[];
    for(var j=0;j<bytes.length;j++){
      var v=bytes[j], pos=tbl.indexOf(v);
      out.push(pos);
      tbl.splice(pos,1); tbl.unshift(v);
    }
    return out;
  }
  function imtf(codes){
    var tbl=[]; for(var i=0;i<256;i++) tbl.push(i);
    var out=[];
    for(var j=0;j<codes.length;j++){
      var pos=codes[j];
      if(pos<0||pos>255) return null;
      var v=tbl[pos];
      out.push(v);
      tbl.splice(pos,1); tbl.unshift(v);
    }
    return out;
  }

  /* ---- RLE（对 MTF 输出的 0 游程做编码：[值, 次数]） ---- */
  function rle(nums){
    var out=[], i=0;
    while(i<nums.length){
      var v=nums[i], n=1;
      while(i+n<nums.length && nums[i+n]===v) n++;
      out.push([v,n]);
      i+=n;
    }
    return out;
  }
  function irle(pairs){
    var out=[];
    for(var i=0;i<pairs.length;i++){
      for(var j=0;j<pairs[i][1];j++) out.push(pairs[i][0]);
    }
    return out;
  }

  function entropy(nums){
    if(!nums.length) return 0;
    var f={};
    for(var i=0;i<nums.length;i++) f[nums[i]]=(f[nums[i]]||0)+1;
    var h=0;
    for(var k in f){ var p=f[k]/nums.length; h -= p*Math.log(p)/Math.LN2; }
    return Math.round(h*1000)/1000;
  }
  function runs(nums){
    if(!nums.length) return 0;
    var r=1;
    for(var i=1;i<nums.length;i++) if(nums[i]!==nums[i-1]) r++;
    return r;
  }

  function pipeline(text){
    var s=String(text||'');
    if(!s) return {value:null, error:'输入为空'};
    var bytes=toBytes(s);
    if(bytes.length>MAXLEN) return {value:null, error:'输入 '+bytes.length+' 字节，超过上限 '+MAXLEN+'（旋转排序是 O(n² log n)）'};
    var t=bwt(bytes);
    var m=mtf(t.last);
    var r=rle(m);
    // 校验可逆
    var back=irle(r);
    var un=imtf(back);
    var orig=ibwt(un, t.index);
    var restored = orig ? fromBytes(orig) : null;
    var zeros=0;
    for(var i=0;i<m.length;i++) if(m[i]===0) zeros++;
    return {value:{
      bytes:bytes, n:bytes.length,
      bwt:t.last, index:t.index,
      mtf:m, rle:r,
      restored:restored, lossless: restored===s,
      stats:{
        srcEntropy:entropy(bytes), bwtEntropy:entropy(t.last), mtfEntropy:entropy(m),
        srcRuns:runs(bytes), bwtRuns:runs(t.last),
        mtfZeros:zeros, mtfZeroPct: m.length?Math.round(zeros/m.length*1000)/10:0,
        rlePairs:r.length, rleRatio: m.length?Math.round(r.length*2/m.length*1000)/10:0
      }
    }, error:''};
  }

  function preview(bytes, limit){
    limit=limit||120;
    var s='';
    for(var i=0;i<Math.min(bytes.length,limit);i++){
      var c=bytes[i];
      s += (c>=32 && c<127) ? String.fromCharCode(c) : ('·');
    }
    return s + (bytes.length>limit?'…':'');
  }

  var API={bwt:bwt, ibwt:ibwt, mtf:mtf, imtf:imtf, rle:rle, irle:irle,
           pipeline:pipeline, toBytes:toBytes, fromBytes:fromBytes,
           entropy:entropy, runs:runs, preview:preview, MAXLEN:MAXLEN};
  if(typeof module!=='undefined' && module.exports) module.exports=API;
  if(typeof window!=='undefined') window.__BwtForge__=API;
})();

</script>
<script>

(function(){
  if(typeof window==='undefined' || !window.document) return;
  var C=window.__BwtForge__, D=document, $=function(i){return D.getElementById(i);};
  var DEMO='banana banana banana bandana bananas';
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function kv(k,v){return '<div class="kv"><b>'+esc(k)+'</b><span>'+esc(v)+'</span></div>';}
  function T(k){return (window.nanoT||function(x){return x;})(k);}
  var lastText='';
  function render(){
    var r=C.pipeline($('bw_in').value);
    $('bw_err').textContent=r.error||'';
    if(!r.value){ $('bw_out').textContent=''; $('bw_stat').innerHTML=''; lastText=''; return; }
    var v=r.value, s=v.stats;
    var st=kv(T('s_len'), v.n+' B')
      +kv(T('s_index'), v.index)
      +kv(T('s_ent'), s.srcEntropy+' → '+s.bwtEntropy+' → '+s.mtfEntropy+' bit/符号')
      +kv(T('s_runs'), s.srcRuns+' → '+s.bwtRuns)
      +kv(T('s_zeros'), s.mtfZeros+'  ('+s.mtfZeroPct+'%)')
      +kv(T('s_rle'), s.rlePairs+' '+T('s_pairs')+'  ('+s.rleRatio+'% '+T('s_ofsrc')+')')
      +kv(T('s_lossless'), v.lossless?'✓ '+T('s_yes'):'✗ '+T('s_no'));
    $('bw_stat').innerHTML=st;
    lastText=C.preview(v.bwt, 4000);
    var L=[];
    L.push(T('s_src')+':  '+C.preview(v.bytes));
    L.push(T('s_bwt')+':  '+C.preview(v.bwt));
    L.push(T('s_mtf')+':  '+v.mtf.slice(0,80).join(' ')+(v.mtf.length>80?' …':''));
    L.push(T('s_rleo')+':  '+v.rle.slice(0,40).map(function(p){return p[1]>1?(p[0]+'×'+p[1]):String(p[0]);}).join(' ')+(v.rle.length>40?' …':''));
    L.push('');
    L.push(T('s_back')+':  '+String(v.restored).slice(0,160)+(String(v.restored).length>160?'…':''));
    $('bw_out').textContent=L.join('\n');
  }
  window.nanoRerender=render;
  $('bw_go').addEventListener('click',render);
  $('bw_in').addEventListener('input',render);
  $('bw_demo').addEventListener('click',function(){ $('bw_in').value=DEMO; render(); });
  $('bw_copy').addEventListener('click',function(){
    if(!lastText){ if(window.nanoToast) window.nanoToast(T('nores'),1); return; }
    if(navigator.clipboard) navigator.clipboard.writeText(lastText);
  });
  $('bw_in').value=DEMO; render();
})();

</script>

    for(var j=0;j<ps.length;j++){var k2=ps[j].getAttribute('data-i18n-ph');if(d[k2]!=null)ps[j].setAttribute('placeholder',d[k2]);}
    var b=document.getElementById('langBtn'); if(b) b.textContent=(l==='en'?'中文':'EN');
    if(d.title) document.title=d.title;
  }
  window.nanoT=function(k){var d=dict();return d[k]!=null?d[k]:k;};
  window.nanoApplyI18n=apply;
  var b=document.getElementById('langBtn');
  if(b) b.addEventListener('click', function(){
    try{localStorage.setItem('nano-lang', cur()==='en'?'zh':'en');}catch(e){}
    apply(); if(window.nanoRerender) window.nanoRerender();
  });
  apply();
})();
</script>
