<body>
<div class="app">
  <div class="hd">
    <div>
      <h1>DtmfForge</h1>
      <p class="sub" data-i18n="sub">电话拨号音本质上是两个正弦波叠加。粘贴一串按键，立刻得到每一键对应的双频；反过来输入频率也能认出按了什么。</p>
    </div>

  </div>

  <label for="dt_in" data-i18n="lb_in">要编码的按键（数字 / * # A-D）</label>
  <input id="dt_in" type="text" value="123#" spellcheck="false" data-i18n-ph="ph_in">
  <div class="row">
    <button id="dt_enc" type="button" data-i18n="btn_enc">编码</button>
    <button id="dt_copy" class="ghost" type="button" data-i18n="btn_copy">复制结果</button>
  </div>
  <div class="err" id="dt_err" role="alert"></div>
  <div class="out"><pre id="dt_encout" style="margin:0;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all"></pre></div>

  <hr style="border:none;border-top:1px dashed var(--line);margin:18px 0">
  <div id="dt_pad" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px"></div>

  <label style="margin-top:0" data-i18n="lb_dec">解码 / 识别（填入低频 + 高频 Hz）</label>
  <div class="grid">
    <input id="dt_lo" type="text" value="697" spellcheck="false" data-i18n-ph="ph_lo">
    <input id="dt_hi" type="text" value="1209" spellcheck="false" data-i18n-ph="ph_hi">
  </div>
  <div class="row">
    <button id="dt_dec" type="button" data-i18n="btn_dec">解码</button>
  </div>
  <div class="out" style="margin-top:12px"><pre id="dt_decout" style="margin:0;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all"></pre></div>

  <div class="badges">
    <span class="badge" data-i18n="b1">零依赖</span>
    <span class="badge" data-i18n="b2">离线可用</span>
    <span class="badge" data-i18n="b3">数据不出本机</span>
    <span class="badge flag" data-i18n="b4">旗舰</span>

</div>
<script>

(function(){
  'use strict';
  var LOW=[697,770,852,941];
  var HIGH=[1209,1336,1477,1633];
  var KEYS=[
    ['1','2','3','A'],
    ['4','5','6','B'],
    ['7','8','9','C'],
    ['*','0','#','D']
  ];
  function encodeChar(ch){
    ch=String(ch).toUpperCase();
    for(var r=0;r<4;r++) for(var c=0;c<4;c++) if(KEYS[r][c]===ch)
      return {key:ch, low:LOW[r], high:HIGH[c]};
    return null;
  }
  function encode(str){
    if(str==null) return {value:null,error:'输入为空'};
    str=String(str);
    var arr=[];
    for(var i=0;i<str.length;i++){
      var e=encodeChar(str[i]);
      if(!e) return {value:null,error:'非法字符：'+str[i]+'（仅支持 0-9 * # A-D）'};
      arr.push(e);
    }
    return {value:arr, error:''};
  }
  function decode(low,high){
    var r=LOW.indexOf(low), c=HIGH.indexOf(high);
    if(r<0||c<0) return {value:null,error:'频率不在 DTMF 标准集内'};
    return {value:{key:KEYS[r][c], low:low, high:high}, error:''};
  }
  function nearest(set,f){
    var bi=-1, bd=1e9;
    for(var i=0;i<set.length;i++){ var d=Math.abs(set[i]-f); if(d<bd){bd=d;bi=i;} }
    return {idx:bi, dist:bd};
  }
  function detect(lowHz, highHz, tolPct){
    tolPct=(tolPct==null)?1.5:tolPct;
    var ln=nearest(LOW, lowHz), hn=nearest(HIGH, highHz);
    if(ln.idx<0||hn.idx<0) return {value:null,error:'频率超出范围'};
    if(ln.dist > LOW[ln.idx]*tolPct/100) return {value:null,error:'低频 '+lowHz+' Hz 偏离 '+LOW[ln.idx]+' 超出容差'};
    if(hn.dist > HIGH[hn.idx]*tolPct/100) return {value:null,error:'高频 '+highHz+' Hz 偏离 '+HIGH[hn.idx]+' 超出容差'};
    return {value:{key:KEYS[ln.idx][hn.idx], low:LOW[ln.idx], high:HIGH[hn.idx]}, error:''};
  }
  function keypad(){
    var rows=[];
    for(var r=0;r<4;r++){
      var row=[];
      for(var c=0;c<4;c++) row.push({key:KEYS[r][c], low:LOW[r], high:HIGH[c]});
      rows.push(row);
    }
    return {low:LOW, high:HIGH, rows:rows};
  }
  var API={LOW:LOW,HIGH:HIGH,KEYS:KEYS,encode:encode,encodeChar:encodeChar,
           decode:decode,detect:detect,keypad:keypad,nearest:nearest};
  if(typeof module!=='undefined' && module.exports) module.exports=API;
  if(typeof window!=='undefined') window.__DtmfForge__=API;
})();

</script>
<script>

(function(){
  if(typeof window==='undefined' || !window.document) return;
  var C=window.__DtmfForge__, D=document, $=function(i){return D.getElementById(i);};
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function T(k){return (window.nanoT||function(x){return x;})(k);}
  var lastText='';

  // 画 4x4 键盘
  (function(){
    var pad=$('dt_pad'), kp=C.keypad();
    for(var r=0;r<4;r++) for(var c=0;c<4;c++){
      var cell=kp.rows[r][c];
      var b=D.createElement('button');
      b.type='button';
      b.style.cssText='background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:10px 0;cursor:pointer;font-size:16px';
      b.textContent=cell.key;
      b.title=cell.low+' / '+cell.high+' Hz';
      b.addEventListener('click',function(evt){
        var k=evt.currentTarget.textContent;
        $('dt_in').value=($('dt_in').value+k);
        render();
      });
      pad.appendChild(b);
    }
  })();

  function render(){
    var r=C.encode($('dt_in').value);
    $('dt_err').textContent=r.error||'';
    if(!r.value){ $('dt_encout').textContent=''; lastText=''; return; }
    var L=['# '+T('s_enc')+'  '+r.value.length+' '+T('s_syms')];
    for(var i=0;i<r.value.length;i++){
      var e=r.value[i];
      L.push('  '+e.key+'\t'+e.low+' Hz + '+e.high+' Hz');
    }
    lastText=L.join('\n');
    $('dt_encout').textContent=lastText;
  }
  function decodeUI(){
    var lo=parseFloat($('dt_lo').value), hi=parseFloat($('dt_hi').value);
    if(isNaN(lo)||isNaN(hi)){ $('dt_decout').textContent=T('s_num'); return; }
    var r=C.decode(lo,hi);
    if(r.error){
      var d=C.detect(lo,hi);
      if(d.value) $('dt_decout').textContent=T('s_near')+'  '+d.value.key+'  ('+d.value.low+'/'+d.value.high+' Hz)';
      else $('dt_decout').textContent=r.error;
      return;
    }
    $('dt_decout').textContent=r.value.key+'  =  '+r.value.low+' Hz + '+r.value.high+' Hz';
  }
  window.nanoRerender=render;
  $('dt_enc').addEventListener('click',render);
  $('dt_in').addEventListener('input',render);
  $('dt_copy').addEventListener('click',function(){
    if(!lastText){ if(window.nanoToast)window.nanoToast(T('nores'),1); return; }
    if(navigator.clipboard) navigator.clipboard.writeText(lastText);
  });
  $('dt_dec').addEventListener('click',decodeUI);
  render();
})();

</script>

var I18N = {"en": {"b1": "Zero deps", "b2": "Offline", "b3": "Local only", "b4": "Flagship", "btn_copy": "Copy result", "btn_dec": "Decode", "btn_enc": "Encode", "copied": "Copied", "copyfail": "Copy failed", "lb_dec": "Decode / detect", "lb_in": "Keys to encode", "nores": "Nothing to copy", "ph_hi": "high Hz", "ph_in": "123#ABC", "ph_lo": "low Hz", "s_enc": "Encoded", "s_near": "nearest (within tolerance):", "s_num": "enter numbers", "s_syms": "symbols", "sub": "Offline DTMF dual-tone workbench: encode keys to frequencies, decode and detect tones", "title": "DtmfForge - offline DTMF dual-tone workbench"}, "zh": {"b1": "零依赖", "b2": "离线可用", "b3": "数据不出本机", "b4": "旗舰", "btn_copy": "复制结果", "btn_dec": "解码", "btn_enc": "编码", "copied": "已复制", "copyfail": "复制失败", "lb_dec": "解码 / 识别", "lb_in": "要编码的按键", "nores": "没有可复制的结果", "ph_hi": "高频 Hz", "ph_in": "123#ABC", "ph_lo": "低频 Hz", "s_enc": "编码", "s_near": "容差内最近匹配：", "s_num": "请输入数字", "s_syms": "个符号", "sub": "电话拨号音本质上是两个正弦波叠加。粘贴一串按键，立刻得到每一键对应的双频；反过来输入频率也能认出按了什么。", "title": "DtmfForge — 离线 DTMF 双音多频工作台：按键↔频率 编码 / 解码 / 识别"}};
(function(){
  function cur(){try{return localStorage.getItem('nano-lang')==='en'?'en':'zh';}catch(e){return 'zh';}}
  function dict(){return I18N[cur()]||I18N.zh;}
  function apply(){
    var l=cur(), d=dict();
    document.documentElement.lang = (l==='en'?'en':'zh-CN');
    var ns=document.querySelectorAll('[data-i18n]');
    for(var i=0;i<ns.length;i++){var k=ns[i].getAttribute('data-i18n');if(d[k]!=null)ns[i].textContent=d[k];}
    var ps=document.querySelectorAll('[data-i18n-ph]');
    for(var j=0;j<ps.length;j++){var k2=ps[j].getAttribute('data-i18n-ph');if(d[k2]!=null)ps[j].setAttribute('placeholder',d[k2]);}
    var b=document.getElementById('langBtn'); if(b) b.textContent=(l==='en'?'中文':'EN');
    if(d.title) document.title=d.title;
  }
  window.nanoT=function(k){var d=dict();return d[k]!=null?d[k]:k;};
  window.nanoApplyI18n=apply;
  var b=document.getElementById('langBtn');
  if(b) b.addEventListener('click', function(){
    try{localStorage.setItem('nano-lang', cur()==='en'?'zh':'en');}catch(e){}
    apply(); if(window.nanoRerender) window.nanoRerender();
  });
  apply();
})();
</script>
