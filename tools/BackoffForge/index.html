<head>
<meta charset="utf-8">

<title>BackoffForge — 指数退避与抖动计算器：full/equal/decorrelated 策略，API 重试韧性</title>
<meta property="og:title" content="BackoffForge">

<meta name="description" content="指数退避与抖动计算器：full/equal/decorrelated 策略，API 重试韧性 · 单文件 · 零依赖 · 本地优先">

<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:140px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <h1>BackoffForge</h1>
  <p class="sub">指数退避与抖动计算器：full/equal/decorrelated 策略，API 重试韧性 · 单文件 · 零依赖 · 本地优先</p>

<label for="battempt">重试次数（0 为首次失败后）</label>
<input id="battempt" type="number" value="3" min="0">
<div class="grid2">
  <label for="bbase">基准延迟 ms</label>
  <input id="bbase" type="number" value="1000" min="1">
  <label for="bcap">上限 ms</label>
  <input id="bcap" type="number" value="30000" min="1">
  <label for="bfactor">增长因子</label>
  <input id="bfactor" type="number" value="2" min="1" step="0.1">
</div>
<div class="opt">
  <label>抖动策略
    <select id="bstrat">
      <option value="full">Full Jitter (0~d)</option>
      <option value="equal">Equal Jitter (d/2~d)</option>
      <option value="none">No Jitter (d)</option>
      <option value="decorrelated">Decorrelated (AWS)</option>
    </select>
  </label>
</div>
<div class="row">
  <button id="calc">计算延迟</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">配置后计算重试延迟</div>
<script>
function expDelay(attempt, opts){
  opts=opts||{};
  var base=opts.base||1000, cap=opts.cap||30000, factor=opts.factor||2;
  attempt=(attempt<0?0:attempt)|0;
  return Math.min(cap, Math.round(base*Math.pow(factor, attempt)));
}
function backoff(attempt, opts, rng){
  opts=opts||{};
  var strategy=opts.strategy||'full';
  var base=opts.base||1000, cap=opts.cap||30000, factor=opts.factor||2;
  if(typeof rng!=='function') rng=Math.random;
  var d=expDelay(attempt,{base:base,cap:cap,factor:factor});
  if(strategy==='none') return {base:d, min:d, max:d, value:d, error:null};
  if(strategy==='full'){ var hi=Math.floor(rng()*d); return {base:d, min:0, max:d, value:hi, error:null}; }
  if(strategy==='equal'){ var half=Math.floor(d/2); var hi2=half+Math.floor(rng()*(d-half)); return {base:d, min:half, max:d, value:hi2, error:null}; }
  if(strategy==='decorrelated'){
    var prev=opts.prev!=null?opts.prev:base;
    var sleep=Math.min(cap, prev*3 + Math.floor(rng()*base));
    return {base:d, min:Math.min(cap,prev*3), max:cap, value:sleep, prev:prev, error:null};
  }
  return {error:'unknown strategy'};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { expDelay:expDelay, backoff:backoff };
}
if (typeof window !== 'undefined') {
  window.BackoffForgePure = { expDelay:expDelay, backoff:backoff };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.BackoffForgePure;
    $('calc').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var r=P.backoff(Number($('battempt').value), {
          base:Number($('bbase').value), cap:Number($('bcap').value),
          factor:Number($('bfactor').value), strategy:$('bstrat').value
        });
        if(r.error){ $('out').textContent='错误：'+r.error; return; }
        $('out').textContent='基准延迟 '+r.base+'ms\n建议范围 '+r.min+' ~ '+r.max+'ms\n本次样本 '+r.value+'ms';
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('out').textContent='\u914d\u7f6e\u540e\u8ba1\u7b97\u91cd\u8bd5\u5ef6\u8fdf'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>

</div>
