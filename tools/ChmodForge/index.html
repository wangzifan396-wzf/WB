<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChmodForge — 离线权限计算器：八进制 与 rwx 符号互转</title>
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:90px}
.preview svg{max-width:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.big{font:40px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线 UNIX 权限计算器：八进制 ↔ rwx 符号互转，支持 setuid/setgid/sticky。">
</head>
<body>
<div class="app">
  <h1>ChmodForge</h1>
  <p class="sub">离线权限计算器：八进制 与 rwx 符号互转 · 单文件 · 零依赖 · 本地优先</p>

<label for="in">输入八进制（如 755 / 4755）或符号权限（如 rwxr-xr-x）</label>
<input id="in" type="text" value="755" placeholder="755 或 rwxr-xr-x">
<div class="row">
  <button id="run">转换</button>
  <button id="copy" class="ghost">复制结果</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>结果</label>
<div class="out" id="out" aria-live="polite">结果会显示在这里</div>
<script>
function setBit(str,idx,ch){ return str.slice(0,idx)+ch+str.slice(idx+1); }
function octalToSymbolic(octal){
  octal=String(octal).trim();
  if(!/^[0-7]{3,4}$/.test(octal)) throw new Error('无效八进制权限（需 3-4 位 0-7）');
  var special=0, perms=octal;
  if(octal.length===4){ special=parseInt(octal[0],10); perms=octal.slice(1); }
  var map=['---','--x','-w-','-wx','r--','r-x','rw-','rwx'];
  var parts=[map[+perms[0]],map[+perms[1]],map[+perms[2]]];
  if(special&4) parts[0]=setBit(parts[0],2,(parts[0][2]==='x')?'s':'S');
  if(special&2) parts[1]=setBit(parts[1],2,(parts[1][2]==='x')?'s':'S');
  if(special&1) parts[2]=setBit(parts[2],2,(parts[2][2]==='x')?'t':'T');
  return parts.join('');
}
function symbolicToOctal(sym){
  sym=String(sym).trim();
  if(sym.length===10) sym=sym.slice(1);
  if(!/^[rwxsStT-]{9}$/.test(sym)) throw new Error('无效符号权限（需 9 位 rwx，可含 s/t）');
  function execVal(ch){ return (ch==='x'||ch==='s'||ch==='t')?1:0; }
  var o=(sym[0]==='r'?4:0)+(sym[1]==='w'?2:0)+execVal(sym[2]);
  var g=(sym[3]==='r'?4:0)+(sym[4]==='w'?2:0)+execVal(sym[5]);
  var t=(sym[6]==='r'?4:0)+(sym[7]==='w'?2:0)+execVal(sym[8]);
  var special=0;
  if(sym[2]==='s'||sym[2]==='S') special+=4;
  if(sym[5]==='s'||sym[5]==='S') special+=2;
  if(sym[8]==='t'||sym[8]==='T') special+=1;
  return (special?String(special):'')+''+o+g+t;
}
function parsePerms(octal){
  octal=String(octal).trim();
  if(!/^[0-7]{3,4}$/.test(octal)) throw new Error('无效八进制');
  var special=0, perms=octal;
  if(octal.length===4){ special=parseInt(octal[0],10); perms=octal.slice(1); }
  function trip(d){ d=+d; return { r:!!(d&4), w:!!(d&2), x:!!(d&1) }; }
  return { owner:trip(perms[0]), group:trip(perms[1]), other:trip(perms[2]),
           setuid:!!(special&4), setgid:!!(special&2), sticky:!!(special&1) };
}
function describe(octal){
  var p=parsePerms(octal);
  function line(who,t){ return who+': '+(t.r?'读':'-')+' '+(t.w?'写':'-')+' '+(t.x?'执行':'-'); }
  var out=[line('所有者',p.owner),line('用户组',p.group),line('其他人',p.other)];
  var sp=[]; if(p.setuid) sp.push('setuid'); if(p.setgid) sp.push('setgid'); if(p.sticky) sp.push('sticky');
  if(sp.length) out.push('特殊位: '+sp.join(', '));
  return out.join('\n');
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { octalToSymbolic:octalToSymbolic, symbolicToOctal:symbolicToOctal, parsePerms:parsePerms, describe:describe };
}
if (typeof window !== 'undefined') {
  window.ChmodForgePure = { octalToSymbolic:octalToSymbolic, symbolicToOctal:symbolicToOctal, parsePerms:parsePerms, describe:describe };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.ChmodForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function run(){
      var v=$('in').value.trim(); $('err').textContent='';
      try {
        var octal, sym;
        if(/^[0-7]{3,4}$/.test(v)){ octal=v; sym=P.octalToSymbolic(v); }
        else { sym=v; octal=P.symbolicToOctal(v); }
        var out='八进制: '+octal+'\n符号: '+sym+'\n命令: chmod '+octal+' <文件>\n\n'+P.describe(octal);
        $('out').textContent=out;
      } catch(e){ $('err').textContent=e.message; $('out').textContent='结果会显示在这里'; }
    }
    $('run').addEventListener('click', run);
    $('in').addEventListener('input', run);
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('out').textContent='结果会显示在这里'; });
    run();
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
