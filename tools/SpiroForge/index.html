/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}

button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}

<div class="app">
  <h1>SpiroForge</h1>
  <p class="sub">万花尺生成艺术：内旋轮线/外旋轮线参数方程绘制，周期自动计算，SVG 导出，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <label style="flex:1;">大环 R <input id="R" type="number" value="96" min="10" max="200"></label>
  <label style="flex:1;">小轮 r <input id="r" type="number" value="36" min="2" max="150"></label>
  <label style="flex:1;">笔距 d <input id="d" type="number" value="60" min="0" max="200"></label>
</div>
<label>类型</label>
<select id="kind">
  <option value="hypo">内旋轮线（轮内滚动）</option>
  <option value="epi">外旋轮线（轮外滚动）</option>
</select>
<div class="row">
  <button id="draw">绘制</button>
  <button id="rand" class="ghost">随机参数</button>
  <button id="dl" class="ghost">下载 SVG</button>
</div>
<div id="info" style="color:#A1A1AA;font-size:13px;margin-top:8px;"></div>
<div class="err" id="err"></div>
<div id="out" style="margin-top:10px;"></div>
<script>
function spGcd(a, b){ a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b)); while(b){ var t = a % b; a = b; b = t; } return a || 1; }
function spPeriods(R, r){ return Math.round(r / spGcd(R, r)); }
function spPoint(kind, R, r, d, t){
  if(kind === 'epi'){
    var k = (R + r) / r;
    return { x: (R + r) * Math.cos(t) - d * Math.cos(k * t), y: (R + r) * Math.sin(t) - d * Math.sin(k * t) };
  }
  var k2 = (R - r) / r;
  return { x: (R - r) * Math.cos(t) + d * Math.cos(k2 * t), y: (R - r) * Math.sin(t) - d * Math.sin(k2 * t) };
}
function spCurve(kind, R, r, d, steps){
  var per = spPeriods(R, r), total = Math.PI * 2 * per;
  var n = steps || Math.max(720, per * 240), pts = [];
  for(var i=0;i<=n;i++) pts.push(spPoint(kind, R, r, d, total * i / n));
  return pts;
}
function spSvg(kind, R, r, d, size, color){
  var pts = spCurve(kind, R, r, d);
  var maxR = kind === 'epi' ? R + r + d : Math.abs(R - r) + d;
  var sc = (size/2 - 10) / Math.max(maxR, 1);
  var path = '';
  for(var i=0;i<pts.length;i++){
    var x = (size/2 + pts[i].x * sc).toFixed(2), y = (size/2 + pts[i].y * sc).toFixed(2);
    path += (i === 0 ? 'M' : 'L') + x + ' ' + y;
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">'
    + '<rect width="' + size + '" height="' + size + '" fill="#0A0A0B"/>'
    + '<path d="' + path + '" fill="none" stroke="' + (color || '#22D3EE') + '" stroke-width="1.2" stroke-opacity="0.9"/></svg>';
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { spGcd:spGcd, spPeriods:spPeriods, spPoint:spPoint, spCurve:spCurve, spSvg:spSvg };
}
if (typeof window !== 'undefined') {
  window.SpiroForgePure = { spGcd:spGcd, spPeriods:spPeriods, spPoint:spPoint, spCurve:spCurve, spSvg:spSvg };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.SpiroForgePure;
    var COLORS = ['#22D3EE','#5E6AD2','#10B981','#F5A623','#A78BFA'];
    var lastSvg = '';
    function draw(){
      var R = Number($('R').value)||96, r = Number($('r').value)||36, d = Number($('d').value)||60;
      var kind = $('kind').value;
      var color = COLORS[(R + r + d) % COLORS.length];
      lastSvg = P.spSvg(kind, R, r, d, 480, color);
      $('out').innerHTML = lastSvg;
      $('info').textContent = '旋转周期：' + P.spPeriods(R, r) + ' 圈闭合 · 采样点 ' + P.spCurve(kind, R, r, d).length;
    }
    $('draw').addEventListener('click', draw);
    $('rand').addEventListener('click', function(){
      $('R').value = 60 + Math.floor(Math.random()*120);
      $('r').value = 10 + Math.floor(Math.random()*80);
      $('d').value = 20 + Math.floor(Math.random()*100);
      draw();
    });
    $('dl').addEventListener('click', function(){
      var blob = new Blob([lastSvg], { type: 'image/svg+xml' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'spiro.svg';
      a.click();
      URL.revokeObjectURL(a.href);
    });
    draw();
  })();
}
</script>
