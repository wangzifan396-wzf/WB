<style>
  :root{
    --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
    --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
  .app{width:100%;max-width:680px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
  input[type=text],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
       color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  textarea{resize:vertical}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .code{margin-top:18px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
  .code b{font:32px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:3px;color:var(--ok)}
  .meta{color:var(--muted);font-size:12px;margin-top:6px}
  .bar{height:6px;background:var(--surface);border-radius:999px;margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--info);transition:width .9s linear}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .badge.flag{color:#fff;background:var(--accent);border-color:transparent}
  .err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
  footer{margin-top:20px;color:var(--dim);font-size:12px}
  a{color:var(--info);text-decoration:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}

#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}

  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线 TOTP 身份验证器：自写 SHA1/HMAC-SHA1/RFC6238，生成 2FA 动态验证码与密钥，数据永不离机。">

<body>
<div class="app">
  <h1>AuthForge</h1>
  <p class="sub">离线 TOTP 身份验证器 · 单文件 · 零依赖 · 本地优先</p>

  <label for="secret">2FA 密钥（Base32，如 JBSWY3DPEHPK3PXP）</label>
  <input id="secret" type="text" spellcheck="false" placeholder="JBSWY3DPEHPK3PXP" value="JBSWY3DPEHPK3PXP">
  <div class="row">
    <button id="gen">生成随机密钥</button>
    <button id="verify" class="ghost">验证并显示</button>
    <button id="copy" class="ghost">复制验证码</button>
  </div>
  <div class="err" id="err"></div>

  <div class="code">
    <b id="code">------</b>
    <div class="meta" id="meta">填入密钥后点击「验证并显示」</div>
    <div class="bar"><i id="bar" style="width:100%"></i></div>
  </div>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>

  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>

<script>
/* ===== 纯函数区（第一个无属性 script）：可被 Node _test.js 提取并断言 ===== */
function sha1(bytes){
  var H=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0];
  var msg = bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes);
  var l = msg.length;
  // pad so that (l + 1 + pad + 8) is a multiple of 64
  var k = (l + 1 + 8) % 64;
  var pad = k === 0 ? 0 : (64 - k);
  var total = l + 1 + pad + 8;
  var p = new Uint8Array(total);
  p.set(msg);
  p[l] = 0x80;
  var bitLen = l * 8;
  var hi = Math.floor(bitLen / 0x100000000);
  var lo = bitLen >>> 0;
  p[total-8]=(hi>>>24)&0xff; p[total-7]=(hi>>>16)&0xff; p[total-6]=(hi>>>8)&0xff; p[total-5]=hi&0xff;
  p[total-4]=(lo>>>24)&0xff; p[total-3]=(lo>>>16)&0xff; p[total-2]=(lo>>>8)&0xff; p[total-1]=lo&0xff;
  var w = new Array(80);
  for(var off=0; off<total; off+=64){
    for(var i=0;i<16;i++){
      var j=off+i*4;
      w[i]=(p[j]<<24)|(p[j+1]<<16)|(p[j+2]<<8)|p[j+3];
    }
    for(var i=16;i<80;i++){
      var n=w[i-3]^w[i-8]^w[i-14]^w[i-16];
      w[i]=(n<<1)|(n>>>31);
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4];
    for(var i=0;i<80;i++){
      var f,k;
      if(i<20){f=(b&c)|((~b)&d);k=0x5A827999;}
      else if(i<40){f=b^c^d;k=0x6ED9EBA1;}
      else if(i<60){f=(b&c)|(b&d)|(c&d);k=0x8F1BBCDC;}
      else{f=b^c^d;k=0xCA62C1D6;}
      var tmp=(((a<<5)|(a>>>27))+f+e+k+w[i])>>>0;
      e=d;d=c;c=(b<<30)|(b>>>2);b=a;a=tmp;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;
  }
  var out=new Uint8Array(20);
  for(var i=0;i<5;i++){
    out[i*4]=(H[i]>>>24)&0xff;out[i*4+1]=(H[i]>>>16)&0xff;out[i*4+2]=(H[i]>>>8)&0xff;out[i*4+3]=H[i]&0xff;
  }
  return out;
}
function bytesToHex(b){
  var s='';
  for(var i=0;i<b.length;i++) s+=(b[i]>>>4).toString(16)+(b[i]&0xf).toString(16);
  return s;
}
function concatBytes(a,b){
  var o=new Uint8Array(a.length+b.length);
  o.set(a,0); o.set(b,a.length);
  return o;
}
function hmacSha1(keyBytes, msgBytes){
  var BS=64;
  var key=keyBytes;
  if(key.length>BS) key=sha1(key);
  if(key.length<BS){ var k2=new Uint8Array(BS); k2.set(key); key=k2; }
  var oKey=new Uint8Array(BS), iKey=new Uint8Array(BS);
  for(var i=0;i<BS;i++){ oKey[i]=key[i]^0x5c; iKey[i]=key[i]^0x36; }
  var inner=sha1(concatBytes(iKey,msgBytes));
  return sha1(concatBytes(oKey,inner));
}
var B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function base32Decode(s){
  s=String(s).toUpperCase().replace(/=+$/,'').replace(/\s+/g,'');
  var bits=0, value=0, out=[];
  for(var i=0;i<s.length;i++){
    var idx=B32.indexOf(s[i]);
    if(idx<0) continue;
    value=(value<<5)|idx; bits+=5;
    if(bits>=8){ bits-=8; out.push((value>>bits)&0xff); }
  }
  return Uint8Array.from(out);
}
function base32Encode(bytes){
  var out='', buffer=0, bits=0;
  for(var i=0;i<bytes.length;i++){
    buffer=(buffer<<8)|bytes[i]; bits+=8;
    while(bits>=5){ bits-=5; out+=B32[(buffer>>bits)&0x1f]; }
  }
  if(bits>0) out+=B32[(buffer<<(5-bits))&0x1f];
  return out;
}
function hotp(secret, counter, digits){
  digits=digits||6;
  var buf=new Uint8Array(8);
  var c=counter>>>0;
  buf[4]=(c>>>24)&0xff;buf[5]=(c>>>16)&0xff;buf[6]=(c>>>8)&0xff;buf[7]=c&0xff;
  var mac=hmacSha1(secret,buf);
  var off=mac[19]&0x0f;
  var bin=((mac[off]&0x7f)<<24)|((mac[off+1]&0xff)<<16)|((mac[off+2]&0xff)<<8)|(mac[off+3]&0xff);
  var code=(bin%Math.pow(10,digits)).toString();
  while(code.length<digits) code='0'+code;
  return code;
}
function totp(secret, timeMs, step, digits){
  step=step||30; digits=digits||6;
  var counter=Math.floor((timeMs/1000)/step);
  return hotp(secret, counter, digits);
}
function remaining(timeMs, step){
  step=step||30;
  var t=Math.floor(timeMs/1000);
  return step-(t%step);
}
function genSecret(byteLen){
  byteLen=byteLen||20;
  var b=new Uint8Array(byteLen);
  if(typeof crypto!=='undefined' && crypto.getRandomValues) crypto.getRandomValues(b);
  else for(var i=0;i<byteLen;i++) b[i]=Math.floor(Math.random()*256);
  return base32Encode(b);
}
function validateSecret(s){
  if(!s) return false;
  s=String(s).toUpperCase().replace(/=+$/,'').replace(/\s+/g,'');
  if(s.length===0) return false;
  for(var i=0;i<s.length;i++) if(B32.indexOf(s[i])<0) return false;
  return true;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { sha1:sha1, bytesToHex:bytesToHex, hmacSha1:hmacSha1, base32Decode:base32Decode,
    base32Encode:base32Encode, hotp:hotp, totp:totp, remaining:remaining, genSecret:genSecret, validateSecret:validateSecret };
}
if (typeof window !== 'undefined') {
  window.AuthForgePure = { sha1:sha1, bytesToHex:bytesToHex, hmacSha1:hmacSha1, base32Decode:base32Decode,
    base32Encode:base32Encode, hotp:hotp, totp:totp, remaining:remaining, genSecret:genSecret, validateSecret:validateSecret };
}
</script>

<script>
/* ===== UI 区（第二个 script）：仅在浏览器中运行 ===== */
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.AuthForgePure;
    var timer = null;
    function render(){
      var raw = $('secret').value.trim();
      if(!P.validateSecret(raw)){ $('err').textContent='密钥不是合法的 Base32（仅含 A-Z 与 2-7）'; $('code').textContent='------'; return; }
      $('err').textContent='';
      var secret = P.base32Decode(raw);
      var now = Date.now();
      $('code').textContent = P.totp(secret, now, 30, 6);
      var rem = P.remaining(now, 30);
      $('meta').textContent = '每 30 秒刷新 · 剩余 ' + rem + ' 秒';
      $('bar').style.width = (rem/30*100) + '%';
    }
    function verify(){
      var raw = $('secret').value.trim();
      if(!P.validateSecret(raw)){ $('err').textContent='密钥不是合法的 Base32（仅含 A-Z 与 2-7）'; return; }
      if(timer) clearInterval(timer);
      render();
      timer = setInterval(render, 1000);
    }
    function copy(){
      var t=$('code').textContent;
      if(t==='------') return;
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    $('gen').addEventListener('click', function(){
      $('secret').value = P.genSecret(20);
      $('err').textContent=''; verify();
    });
    $('verify').addEventListener('click', verify);
    $('copy').addEventListener('click', copy);
  })();
}
</script>

<script data-nano-polish>
(function(){var el=document.getElementById('nanoToast');if(!el)return;var t;
function zh(){try{var l=localStorage.getItem('nano-lang')||document.documentElement.lang||'zh';return String(l).indexOf('en')!==0;}catch(e){return true;}}

window.nanoToast=show;
try{var nc=navigator.clipboard;if(nc&&nc.writeText){var ow=nc.writeText.bind(nc);nc.writeText=function(s){return ow(s).then(function(r){show(zh()?'已复制':'Copied');return r;},function(e){show(zh()?'复制失败':'Copy failed',1);throw e;});};}}catch(e){}
try{if(document.execCommand){var oe=document.execCommand.bind(document);document.execCommand=function(c){var r=oe.apply(null,arguments);if(String(c).toLowerCase()==='copy'){show(r?(zh()?'已复制':'Copied'):(zh()?'复制失败':'Copy failed'),!r);}return r;};}}catch(e){}
})();
</script>
