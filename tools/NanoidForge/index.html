<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>NanoidForge — 短 ID / UUID 生成器：URL 安全/十六进制/去歧义字符集、UUID v4。</title>
<meta property="og:title" content="NanoidForge">
<meta property="og:description" content="短 ID 与 UUID 生成器：多种字符集、UUID v4，离线可用">
<meta property="og:image" content="./og.png">
<meta name="description" content="短 ID 与 UUID 生成器：多种字符集、UUID v4，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>NanoidForge</h1>
  <p class="sub">短 ID 与 UUID 生成器：URL 安全 / 十六进制 / 去歧义字符集、UUID v4 · 单文件 · 零依赖 · 本地优先</p>

<label>长度</label>
<input type="text" id="len" value="21" style="max-width:120px">
<label>字符集</label>
<select id="alpha">
  <option value="url">URL 安全 (64)</option>
  <option value="hex">十六进制 (16)</option>
  <option value="upper">大写无歧义 (32)</option>
  <option value="no-look">去歧义 (31)</option>
</select>
<div class="row">
  <button id="gen">生成 ID</button>
  <button id="uuid">UUID v4</button>
  <button id="copy" class="ghost">复制</button>
</div>
<div class="out" id="out"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>

function nidAlphabet(preset){
  preset=preset||'url';
  if(preset==='hex') return '0123456789abcdef';
  if(preset==='upper') return 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  if(preset==='no-look') return '23456789abcdefghjkmnpqrstuvwxyz';
  return 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_~';
}
function nidRng(){
  if(typeof window!=='undefined' && window.crypto && window.crypto.getRandomValues){
    var a=new Uint32Array(1); return function(){ window.crypto.getRandomValues(a); return a[0]/4294967296; };
  }
  return Math.random;
}
function nidGenerate(size, alphabet, rnd){
  if(!rnd) rnd=nidRng();
  if(size<1||size>128) return { error:'长度需在 1–128' };
  var s=''; for(var i=0;i<size;i++) s+=alphabet.charAt(Math.floor(rnd()*alphabet.length));
  return { error:null, id:s };
}
function nidUuid(){
  if(typeof window!=='undefined' && window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  var hex='0123456789abcdef', r=nidRng(), s='';
  for(var i=0;i<32;i++){ if(i===8||i===12||i===16||i===20) s+='-'; s+=hex.charAt(Math.floor(r()*16)); }
  return s;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { nidAlphabet:nidAlphabet, nidGenerate:nidGenerate, nidUuid:nidUuid, nidRng:nidRng };
}
if (typeof window !== 'undefined') {
  window.NanoidForgePure = { nidAlphabet:nidAlphabet, nidGenerate:nidGenerate, nidUuid:nidUuid, nidRng:nidRng };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.NanoidForgePure;
  function gen(){
    var len=parseInt($('len').value,10)||21;
    var g=P.nidGenerate(len, P.nidAlphabet($('alpha').value));
    if(g.error){ $('out').innerHTML='<div class="err">'+g.error+'</div>'; return; }
    $('out').innerHTML='<div class="kv"><b>ID</b><span style="word-break:break-all">'+g.id+'</span></div>';
  }
  function uuid(){ $('out').innerHTML='<div class="kv"><b>UUID</b><span style="word-break:break-all">'+P.nidUuid()+'</span></div>'; }
  $('gen').addEventListener('click', gen);
  $('uuid').addEventListener('click', uuid);
  $('copy').addEventListener('click', function(){ if(navigator.clipboard) navigator.clipboard.writeText($('out').textContent); });
  gen();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
