<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <h1>ChordForge</h1>
  <p class="sub">音乐理论计算器：输入音符识别和弦，生成大小调/五声/布鲁斯音阶，钢琴键盘高亮，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<label>模式</label>
<select id="mode">
  <option value="chord">和弦识别（输入音符）</option>
  <option value="scale">音阶生成（选根音与调式）</option>
</select>
<div id="chordBox">
  <label>音符（空格分隔，如 C E G）</label>
  <input id="notes" type="text" value="C E G B">
</div>
<div id="scaleBox" style="display:none;">
  <div class="row">
    <label style="flex:1;">根音
      <select id="root"></select>
    </label>
    <label style="flex:1;">调式
      <select id="stype">
        <option value="major">自然大调</option>
        <option value="minor">自然小调</option>
        <option value="pentMajor">大调五声</option>
        <option value="pentMinor">小调五声</option>
        <option value="blues">布鲁斯</option>
      </select>
    </label>
  </div>
</div>
<div class="row">
  <button id="run">计算</button>
</div>
<div id="result" style="margin-top:10px;color:#FFF;font-size:15px;"></div>
<div class="err" id="err"></div>
<div id="piano" style="margin-top:14px;"></div>
<script>
var CF_NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var CF_FLAT = { 'DB':'C#','EB':'D#','GB':'F#','AB':'G#','BB':'A#' };
var CF_CHORDS = [
  { name: '大三和弦', formula: [0,4,7] },
  { name: '小三和弦', formula: [0,3,7] },
  { name: '减三和弦', formula: [0,3,6] },
  { name: '增三和弦', formula: [0,4,8] },
  { name: '挂四和弦 sus4', formula: [0,5,7] },
  { name: '挂二和弦 sus2', formula: [0,2,7] },
  { name: '大七和弦 maj7', formula: [0,4,7,11] },
  { name: '属七和弦 7', formula: [0,4,7,10] },
  { name: '小七和弦 m7', formula: [0,3,7,10] },
  { name: '半减七和弦 m7b5', formula: [0,3,6,10] },
  { name: '减七和弦 dim7', formula: [0,3,6,9] }
];
var CF_SCALES = {
  major: [0,2,4,5,7,9,11],
  minor: [0,2,3,5,7,8,10],
  pentMajor: [0,2,4,7,9],
  pentMinor: [0,3,5,7,10],
  blues: [0,3,5,6,7,10]
};
function cfParseNote(s){
  var u = String(s||'').trim().toUpperCase();
  if(CF_FLAT[u] !== undefined) u = CF_FLAT[u];
  var i = CF_NOTES.indexOf(u);
  return i < 0 ? null : i;
}
function cfParseNotes(text){
  var parts = String(text||'').trim().split(/[\s,]+/).filter(Boolean);
  var out = [];
  for(var i=0;i<parts.length;i++){
    var p = cfParseNote(parts[i]);
    if(p === null) return { error: '无法识别音符：' + parts[i] };
    if(out.indexOf(p) < 0) out.push(p);
  }
  if(out.length < 2) return { error: '至少输入 2 个不同音符' };
  return { pcs: out };
}
function cfDetect(pcs){
  var hits = [];
  for(var r=0;r<pcs.length;r++){
    var root = pcs[r];
    var rel = pcs.map(function(p){ return ((p - root) % 12 + 12) % 12; }).sort(function(a,b){ return a-b; });
    for(var c=0;c<CF_CHORDS.length;c++){
      var f = CF_CHORDS[c].formula.slice().sort(function(a,b){ return a-b; });
      if(rel.length === f.length && rel.every(function(v,i){ return v === f[i]; })){
        hits.push({ root: CF_NOTES[root], name: CF_CHORDS[c].name, inversion: r > 0 });
      }
    }
  }
  return hits;
}
function cfScale(rootPc, type){
  var iv = CF_SCALES[type];
  if(!iv) return null;
  return iv.map(function(s){ return (rootPc + s) % 12; });
}
function cfNames(pcs){ return pcs.map(function(p){ return CF_NOTES[p]; }); }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { CF_NOTES:CF_NOTES, CF_CHORDS:CF_CHORDS, CF_SCALES:CF_SCALES, cfParseNote:cfParseNote, cfParseNotes:cfParseNotes, cfDetect:cfDetect, cfScale:cfScale, cfNames:cfNames };
}
if (typeof window !== 'undefined') {
  window.ChordForgePure = { CF_NOTES:CF_NOTES, CF_CHORDS:CF_CHORDS, CF_SCALES:CF_SCALES, cfParseNote:cfParseNote, cfParseNotes:cfParseNotes, cfDetect:cfDetect, cfScale:cfScale, cfNames:cfNames };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.ChordForgePure;
    P.CF_NOTES.forEach(function(nm, i){
      var o = document.createElement('option');
      o.value = i; o.textContent = nm;
      $('root').appendChild(o);
    });
    function piano(active){
      var white = [0,2,4,5,7,9,11], blackAfter = { 0:1, 2:3, 5:6, 7:8, 9:10 };
      var h = '<div style="position:relative;height:110px;display:flex;">';
      var bl = '';
      for(var i=0;i<white.length;i++){
        var pc = white[i], on = active.indexOf(pc) >= 0;
        h += '<div style="flex:1;border:1px solid rgba(255,255,255,.15);border-radius:0 0 6px 6px;background:' + (on ? '#22D3EE' : '#E4E4E7') + ';margin-right:2px;position:relative;"><span style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:11px;color:#0A0A0B;">' + P.CF_NOTES[pc] + '</span></div>';
        if(blackAfter[pc] !== undefined){
          var bpc = blackAfter[pc], bon = active.indexOf(bpc) >= 0;
          bl += '<div style="position:absolute;left:' + ((i+1) * 100/7 - 7) + '%;top:0;width:10%;height:62px;background:' + (bon ? '#22D3EE' : '#141417') + ';border:1px solid rgba(255,255,255,.2);border-radius:0 0 4px 4px;z-index:2;"></div>';
        }
      }
      return h + bl + '</div>';
    }
    function run(){
      $('err').textContent = '';
      if($('mode').value === 'chord'){
        var pr = P.cfParseNotes($('notes').value);
        if(pr.error){ $('err').textContent = pr.error; $('result').textContent=''; $('piano').innerHTML=''; return; }
        var hits = P.cfDetect(pr.pcs);
        $('result').innerHTML = hits.length
          ? hits.map(function(hh){ return '<b style="color:#22D3EE;">' + hh.root + ' ' + hh.name + '</b>' + (hh.inversion ? ' <span style="color:#71717A;">(转位)</span>' : ''); }).join('　')
          : '<span style="color:#F5A623;">未匹配到常见和弦</span>';
        $('piano').innerHTML = piano(pr.pcs);
      } else {
        var pcs = P.cfScale(Number($('root').value), $('stype').value);
        $('result').innerHTML = '<b style="color:#22D3EE;">' + P.cfNames(pcs).join(' — ') + '</b>';
        $('piano').innerHTML = piano(pcs);
      }
    }
    $('mode').addEventListener('change', function(){
      var chord = $('mode').value === 'chord';
      $('chordBox').style.display = chord ? '' : 'none';
      $('scaleBox').style.display = chord ? 'none' : '';
      run();
    });
    $('run').addEventListener('click', run);
    run();
  })();
}
</script>

    <span class="badge">离线可用</span>

    <span class="badge flag">旗舰</span>
