<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
.flag-ok{color:var(--ok)} .flag-bad{color:var(--warn)} .flag-info{color:var(--info)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<body>
<div class="app">
  <h1>SemverForge</h1>
  <p class="sub">离线 SemVer 检查器：版本解析、比较、范围匹配（^ ~ > < x ||） · 单文件 · 零依赖 · 本地优先</p>

<label for="range">版本范围</label>
<input id="range" type="text" value="^1.2.3" placeholder="^1.2.3 / ~1.2.3 / >=1.0.0 <2.0.0 / 1.2.x / * / A||B">
<label for="ver">待检查版本</label>
<input id="ver" type="text" value="1.2.5" placeholder="1.2.5">
<div class="row">
  <button id="check">检查匹配</button>
  <button id="copy" class="ghost">复制结果</button>
  <button id="clear" class="ghost">清空</button>
</div>
<label>比较两个版本</label>
<div class="row">
  <input id="a" type="text" value="1.2.3" placeholder="版本 A" style="max-width:200px">
  <input id="b" type="text" value="1.2.4" placeholder="版本 B" style="max-width:200px">
  <button id="cmp" class="ghost">比较 A / B</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">结果会显示在这里</div>
<script>
function parse(v){
  if(typeof v !== 'string') return null;
  var m=/^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+([0-9A-Za-z.-]+))?$/.exec(v.trim());
  if(!m) return null;
  return {major:+m[1], minor:+m[2], patch:+m[3], pre:m[4]?m[4].split('.'):[], build:m[5]?m[5].split('.'):[], raw:v};
}
function valid(v){ return parse(v) !== null; }
function cmpPre(a,b){
  if(a.length===0 && b.length===0) return 0;
  if(a.length===0) return 1;
  if(b.length===0) return -1;
  var len=Math.max(a.length,b.length);
  for(var i=0;i<len;i++){
    if(i>=a.length) return -1;
    if(i>=b.length) return 1;
    var x=a[i], y=b[i];
    var xn=/^\d+$/.test(x), yn=/^\d+$/.test(y);
    if(xn && yn){ var d=(+x)-(+y); if(d) return d; }
    else if(xn && !yn) return -1;
    else if(!xn && yn) return 1;
    else { if(x<y) return -1; if(x>y) return 1; }
  }
  return 0;
}
function compare(a,b){
  var A=parse(a), B=parse(b); if(!A||!B) return null;
  if(A.major!==B.major) return A.major<B.major?-1:1;
  if(A.minor!==B.minor) return A.minor<B.minor?-1:1;
  if(A.patch!==B.patch) return A.patch<B.patch?-1:1;
  return cmpPre(A.pre,B.pre);
}
function parsePartial(s){
  s=String(s).trim().replace(/^v/,'');
  function w(x){ if(x==='x'||x==='X') return null; return parseInt(x,10); }
  var segs=s.split('.');
  var major=segs.length>0?w(segs[0]):null;
  var minor=segs.length>1?w(segs[1]):null;
  var patch=segs.length>2?w(segs[2]):null;
  var pre=[];
  if(segs.length>2 && segs[2].indexOf('-')>0){ var pp=segs[2].split('-'); patch=parseInt(pp[0],10); pre=pp[1]?pp[1].split('.'):[]; }
  return {major:major, minor:minor, patch:patch, pre:pre};
}
function carets(s){
  var p=parsePartial(s);
  if(p.major===null) p.major=0; if(p.minor===null) p.minor=0; if(p.patch===null) p.patch=0;
  var lower={op:'>=',major:p.major,minor:p.minor,patch:p.patch,pre:p.pre||[]};
  var upper;
  if(p.major>0) upper={op:'<',major:p.major+1,minor:0,patch:0,pre:[]};
  else if(p.minor>0) upper={op:'<',major:0,minor:p.minor+1,patch:0,pre:[]};
  else upper={op:'<',major:0,minor:0,patch:p.patch+1,pre:[]};
  return [lower,upper];
}
function tildes(s){
  var p=parsePartial(s);
  if(p.major===null) p.major=0; if(p.minor===null) p.minor=0; if(p.patch===null) p.patch=0;
  var lower={op:'>=',major:p.major,minor:p.minor,patch:p.patch,pre:p.pre||[]};
  var hasMinor = String(s).indexOf('.')>=0;
  var upper;
  if(hasMinor) upper={op:'<',major:p.major,minor:(p.minor||0)+1,patch:0,pre:[]};
  else upper={op:'<',major:(p.major||0)+1,minor:0,patch:0,pre:[]};
  return [lower,upper];
}
function expandOne(tok){
  var mm=/^(>=|<=|>|<|=)?\s*(.+)$/.exec(tok);
  if(!mm) return null;
  var op=mm[1]||'=';
  var p=parsePartial(mm[2].trim());
  if(p.major===null) return null;
  if(op==='=') return [{op:'=',major:p.major,minor:p.minor||0,patch:p.patch||0,pre:p.pre||[]}];
  return [{op:op,major:p.major,minor:p.minor||0,patch:p.patch||0,pre:[]}];
}
function expandRange(range){
  range=range.trim();
  if(range==='' ) return null;
  var h=range.indexOf(' - ');
  if(h>=0){
    var ca=expandRange(range.slice(0,h).trim()), cb=expandRange(range.slice(h+3).trim());
    if(!ca||!cb) return null;
    var out=ca.slice();
    for(var i=0;i<out.length;i++){ if(out[i].op==='=') out[i].op='>='; }
    for(var i=0;i<cb.length;i++){ var c=cb[i]; out.push({op:(c.op==='='?'<=':c.op),major:c.major,minor:c.minor,patch:c.patch,pre:c.pre}); }
    return out;
  }
  if(range==='*'||range==='x'||range==='X') return [{op:'>=',major:0,minor:0,patch:0,pre:[]}];
  if(/^\^/.test(range)) return carets(range.slice(1));
  if(/^~/.test(range)) return tildes(range.slice(1));
  if(/[xX]/.test(range)){
    var p=parsePartial(range);
    if(p.major===null) return [{op:'>=',major:0,minor:0,patch:0,pre:[]}];
    if(p.minor===null) return [{op:'>=',major:p.major,minor:0,patch:0,pre:[]},{op:'<',major:p.major+1,minor:0,patch:0,pre:[]}];
    return [{op:'>=',major:p.major,minor:p.minor,patch:0,pre:[]},{op:'<',major:p.major,minor:p.minor+1,patch:0,pre:[]}];
  }
  if(/\s/.test(range)){
    var parts=range.split(/\s+/); var out2=[];
    for(var j=0;j<parts.length;j++){ var c2=expandOne(parts[j]); if(!c2) return null; out2=out2.concat(c2); }
    return out2;
  }
  return expandOne(range);
}
function cmpCmp(version, c){
  var vs = c.major+'.'+c.minor+'.'+c.patch+(c.pre.length?('-'+c.pre.join('.')):'');
  var r = compare(version, vs);
  if(r===null) return false;
  switch(c.op){
    case '>=': return r>=0;
    case '>': return r>0;
    case '<=': return r<=0;
    case '<': return r<0;
    case '=': return r===0;
  }
  return false;
}
function satisfies(range, version){
  if(!valid(version)) return false;
  var ors = range.split('||');
  for(var i=0;i<ors.length;i++){ if(satisfiesAnd(ors[i].trim(), version)) return true; }
  return false;
}
function satisfiesAnd(range, version){
  var comps = expandRange(range);
  if(!comps) return false;
  for(var i=0;i<comps.length;i++){ if(!cmpCmp(version, comps[i])) return false; }
  return true;
}
function inc(version, release){
  var P=parse(version); if(!P) return null;
  if(release==='major') return (P.major+1)+'.0.0';
  if(release==='minor') return P.major+'.'+(P.minor+1)+'.0';
  if(release==='patch') return P.major+'.'+P.minor+'.'+(P.patch+1);
  return null;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parse:parse, valid:valid, compare:compare, satisfies:satisfies, inc:inc };
}
if (typeof window !== 'undefined') {
  window.SemverForgePure = { parse:parse, valid:valid, compare:compare, satisfies:satisfies, inc:inc };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.SemverForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function check(){
      $('err').textContent='';
      try {
        var ok = P.satisfies($('range').value.trim(), $('ver').value.trim());
        if(ok===null) ok=false;
        $('out').textContent = ($('ver').value.trim()) + (ok ? ' ✓ 匹配 ' : ' ✗ 不匹配 ') + ($('range').value.trim());
      } catch(e){ $('err').textContent=e.message; }
    }
    function cmp(){
      $('err').textContent='';
      try {
        var r = P.compare($('a').value.trim(), $('b').value.trim());
        var sym = r===0?'=' : (r<0?'<':'>');
        $('out').textContent = $('a').value.trim()+' '+sym+' '+$('b').value.trim();
      } catch(e){ $('err').textContent=e.message; }
    }
    $('check').addEventListener('click', check);
    $('cmp').addEventListener('click', cmp);
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('range').value=''; $('ver').value=''; $('out').textContent='结果会显示在这里'; });
  })();
}
</script>

    <span class="badge">零依赖</span>
