<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>RecipeForge — 食谱管理：录入配料一键按份量缩放，本地保存多个食谱，离线可用。</title>
<meta property="og:title" content="RecipeForge">
<meta property="og:description" content="食谱管理：录入配料一键按份量缩放，本地保存多个食谱，离线可用。">
<meta property="og:image" content="./og.png">
<meta name="description" content="食谱管理：配料缩放 + 多食谱本地保存 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A; --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:10px 0 6px}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.flex{display:flex;gap:10px}.flex>div{flex:1}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px}
.item{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.item .n{color:var(--muted)}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>RecipeForge</h1>
  <p class="sub">食谱管理：配料缩放 + 多食谱本地保存 · 单文件 · 零依赖 · 本地优先</p>

  <label>食谱名称</label>
  <input id="name" type="text" placeholder="戚风蛋糕">
  <label>配料（每行「数量 单位 名称」，如 200 g 面粉）</label>
  <textarea id="items" rows="6" spellcheck="false" placeholder="200 g 面粉&#10;100 g 糖&#10;2 鸡蛋&#10;盐 适量"></textarea>
  <div class="flex">
    <div><label>原份量</label><input id="from" type="number" value="2"></div>
    <div><label>目标份量</label><input id="to" type="number" value="4"></div>
  </div>
  <div class="row">
    <button id="scale">缩放配料</button>
    <button id="save" class="ghost">保存食谱</button>
    <select id="recipes" class="ghost" style="flex:1"><option value="">— 已存食谱 —</option></select>
  </div>
  <div class="err" id="err"></div>
  <div class="box" id="out"></div>

  <div class="badges">
    <span class="badge">零依赖</span><span class="badge">离线可用</span><span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>
function recipeParseLine(line){
  line=String(line||'').trim(); if(!line) return null;
  var m=line.match(/^([0-9]+(?:\.[0-9]+)?)\s+(\S+)\s*(.*)$/);
  if(m){
    var amt=Number(m[1]), tok=m[2], rest=m[3].trim();
    if(/^[A-Za-z%]+$/.test(tok)) return { amount:amt, unit:tok, name:rest||tok };
    return { amount:amt, unit:'', name:tok+(rest?(' '+rest):'') };
  }
  return { amount:null, unit:'', name:line };
}
function recipeParse(text){
  var items=[], lines=String(text||'').split('\n');
  for(var i=0;i<lines.length;i++){ var r=recipeParseLine(lines[i]); if(r) items.push(r); }
  return items;
}
function recipeScale(items, factor){
  factor=Number(factor);
  return items.map(function(it){ return { amount: it.amount==null?null:Math.round(it.amount*factor*100)/100, unit:it.unit, name:it.name }; });
}
function recipeRender(items){
  var html='';
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var amt = it.amount==null? '适量' : (it.amount+ (it.unit?(' '+it.unit):''));
    html+='<div class="item"><span>'+it.name+'</span><span class="n">'+amt+'</span></div>';
  }
  return html;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { recipeParseLine:recipeParseLine, recipeParse:recipeParse, recipeScale:recipeScale, recipeRender:recipeRender };
}
if (typeof window !== 'undefined') {
  window.RecipeForgePure = { recipeParseLine:recipeParseLine, recipeParse:recipeParse, recipeScale:recipeScale, recipeRender:recipeRender };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.RecipeForgePure;
    var store=null; try{ store=window.localStorage; }catch(e){}
    function save(){ if(store) store.setItem('recipe_list', JSON.stringify(recipes())); }
    function recipes(){ if(!store) return []; try{ return JSON.parse(store.getItem('recipe_list'))||[]; }catch(e){ return []; } }
    function refresh(){
      var sel=$('recipes'); sel.innerHTML='<option value="">— 已存食谱 —</option>';
      recipes().forEach(function(r,i){ var o=document.createElement('option'); o.value=i; o.textContent=r.name||('食谱'+(i+1)); sel.appendChild(o); });
    }
    function scale(){
      var items=P.recipeParse($('items').value);
      if(!items.length){ $('err').textContent='请录入配料'; $('out').innerHTML=''; return; }
      $('err').textContent='';
      var f=($('to').value||0)/($('from').value||1);
      if(!isFinite(f)||f<=0){ $('err').textContent='份量无效'; return; }
      $('out').innerHTML=P.recipeRender(P.recipeScale(items,f));
    }
    $('scale').addEventListener('click', scale);
    $('save').addEventListener('click', function(){
      var items=P.recipeParse($('items').value);
      if(!items.length){ $('err').textContent='没有可保存的配料'; return; }
      var rs=recipes(); rs.push({ name:$('name').value||('食谱'+(rs.length+1)), items:items, from:$('from').value, to:$('to').value });
      if(store) store.setItem('recipe_list', JSON.stringify(rs));
      refresh();
    });
    $('recipes').addEventListener('change', function(){
      var rs=recipes(); var i=Number(this.value); if(isNaN(i)||!rs[i]) return;
      var r=rs[i]; $('name').value=r.name; $('items').value=r.items.map(function(it){ return (it.amount==null?'':it.amount+(it.unit?' '+it.unit:''))+' '+it.name; }).join('\n');
      $('from').value=r.from||1; $('to').value=r.to||1; scale();
    });
    refresh(); scale();
  })();
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
