<meta property="og:title" content="BreakerForge">
<meta property="og:description" content="熔断器状态机：CLOSED/OPEN/HALF_OPEN 容错切换，时间可注入">

<meta name="description" content="熔断器状态机：CLOSED/OPEN/HALF_OPEN 容错切换，时间可注入 · 单文件 · 零依赖 · 本地优先">

<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
</style>

<body>
<div class="app">
  <h1>BreakerForge</h1>
  <p class="sub">熔断器状态机：CLOSED/OPEN/HALF_OPEN 容错切换，时间可注入 · 单文件 · 零依赖 · 本地优先</p>

<label>故障阈值 / 成功阈值 / 超时(ms)</label>
<div class="opt">
  <input id="ft" type="number" value="3" min="1" max="20">
  <input id="st" type="number" value="2" min="1" max="20">
  <input id="to" type="number" value="1000" min="100" max="60000">
</div>
<label>事件序列（每行：success | failure | allow@t，t 为毫秒）</label>
<textarea id="ops" rows="6">failure
failure
failure
allow@0
allow@1500
success
success</textarea>
<div class="row">
  <button id="run">运行</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">运行熔断器状态机，观察 CLOSED/OPEN/HALF_OPEN 切换</div>
<script>
function cbCreate(opts){
  opts=opts||{};
  return { state:'CLOSED', failureThreshold:opts.failureThreshold||5, successThreshold:opts.successThreshold||2,
           timeoutMs:opts.timeoutMs||1000, failures:0, successes:0, openedAt:0 };
}
function cbAllow(cb, now){
  now = (now===undefined)?0:now;
  if(cb.state==='OPEN'){
    if(now - cb.openedAt >= cb.timeoutMs){ cb.state='HALF_OPEN'; cb.successes=0; return {state:cb.state, allow:true}; }
    return {state:cb.state, allow:false};
  }
  return {state:cb.state, allow:true};
}
function cbSuccess(cb, now){
  now=now||0;
  if(cb.state==='HALF_OPEN'){ cb.successes++; if(cb.successes>=cb.successThreshold){ cb.state='CLOSED'; cb.failures=0; cb.successes=0; } }
  else if(cb.state==='CLOSED'){ cb.failures=0; }
  return {state:cb.state, allow: cb.state!=='OPEN'};
}
function cbFailure(cb, now){
  now=now||0;
  if(cb.state==='HALF_OPEN'){ cb.state='OPEN'; cb.openedAt=now; cb.successes=0; }
  else { cb.failures++; if(cb.failures>=cb.failureThreshold){ cb.state='OPEN'; cb.openedAt=now; } }
  return {state:cb.state, allow: cb.state!=='OPEN'};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { cbCreate:cbCreate, cbAllow:cbAllow, cbSuccess:cbSuccess, cbFailure:cbFailure };
}
if (typeof window !== 'undefined') {
  window.BreakerForgePure = { cbCreate:cbCreate, cbAllow:cbAllow, cbSuccess:cbSuccess, cbFailure:cbFailure };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.BreakerForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var cb=P.cbCreate({failureThreshold:+$('ft').value, successThreshold:+$('st').value, timeoutMs:+$('to').value});
        var log=[], cur=cb.state;
        var lines=$('ops').value.split(/[\n]+/).map(function(x){return x.trim();}).filter(function(x){return x.length;});
        for(var i=0;i<lines.length;i++){
          var tk=lines[i].split(/[@\s]+/);
          if(tk[0]==='failure'){ P.cbFailure(cb); log.push('failure -> '+cb.state); }
          else if(tk[0]==='success'){ P.cbSuccess(cb); log.push('success -> '+cb.state); }
          else if(tk[0]==='allow'){ var r=P.cbAllow(cb, +tk[1]); log.push('allow@'+tk[1]+' = '+r.allow+' ('+r.state+')'); }
        }
        $('out').textContent=log.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('ops').value=''; $('out').textContent='运行熔断器状态机，观察 CLOSED/OPEN/HALF_OPEN 切换'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>

</div>
