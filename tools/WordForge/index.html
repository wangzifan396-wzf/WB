<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordForge — 离线文本统计：字数 / 词数 / 行数 / 阅读时长 + 高频词</title>
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:90px}
.preview svg{max-width:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.big{font:40px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线文本统计：字符 / 词数 / 行数 / 句子 / 段落 / 阅读时长 + 高频英文词，中英文混排友好。">
</head>
<body>
<div class="app">
  <h1>WordForge</h1>
  <p class="sub">离线文本统计：字数 / 词数 / 行数 / 阅读时长 + 高频词 · 单文件 · 零依赖 · 本地优先</p>

<style>
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.stat .num{font:20px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--fg)}
.stat .lab{font-size:11px;color:var(--muted);margin-top:4px}
#words{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
.tw b{color:var(--accent)}
.empty{color:var(--dim);font-size:13px}
</style>
<label for="in">文本（中英文混排均可，实时统计）</label>
<textarea id="in" rows="8" placeholder="粘贴或输入文本，下方实时统计字数 / 词数 / 行数 / 阅读时长……"></textarea>
<div class="stats">
  <div class="stat"><div class="num" id="c_chars">0</div><div class="lab">字符</div></div>
  <div class="stat"><div class="num" id="c_nospace">0</div><div class="lab">去空白</div></div>
  <div class="stat"><div class="num" id="c_words">0</div><div class="lab">英文词</div></div>
  <div class="stat"><div class="num" id="c_cjk">0</div><div class="lab">汉字</div></div>
  <div class="stat"><div class="num" id="c_lines">0</div><div class="lab">行数</div></div>
  <div class="stat"><div class="num" id="c_sent">0</div><div class="lab">句子</div></div>
  <div class="stat"><div class="num" id="c_para">0</div><div class="lab">段落</div></div>
  <div class="stat"><div class="num" id="c_read">0</div><div class="lab">阅读(分)</div></div>
</div>
<label>高频英文词（Top 12）</label>
<div id="words"></div>
<script>
function analyze(text){
  text=String(text);
  var chars=text.length;
  var noSpace=text.replace(/\s/g,'').length;
  var latin=(text.match(/[A-Za-z0-9]+/g)||[]).length;
  var cjk=(text.match(/[㐀-鿿豈-﫿]/g)||[]).length;
  var lines=text.length? text.split(/\n/).length : 0;
  var sentences=(text.match(/[.!?。！？…]+/g)||[]).length;
  var paras=text.split(/\n\s*\n/).filter(function(p){return p.replace(/\s/g,'').length;}).length;
  var readingMin=Math.max(0.1, Math.round((cjk/300 + latin/200)*10)/10);
  return {chars:chars,noSpace:noSpace,latin:latin,cjk:cjk,lines:lines,sentences:sentences,paragraphs:paras,readingMin:readingMin};
}
function topWords(text, n){
  var m=text.toLowerCase().match(/[a-z0-9]+/g)||[];
  var f={}; m.forEach(function(w){f[w]=(f[w]||0)+1;});
  var arr=Object.keys(f).map(function(k){return [k,f[k]];});
  arr.sort(function(a,b){return b[1]-a[1];});
  return arr.slice(0, n||10);
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports={analyze:analyze,topWords:topWords};
}
if (typeof window !== 'undefined') {
  window.WordForgePure={analyze:analyze,topWords:topWords};
}
</script>
<script>
if (typeof window !== 'undefined' && window.document) {
  (function(){
    var $=function(id){return document.getElementById(id);};
    var P=window.WordForgePure;
    function render(){
      var t=$('in').value; var s=P.analyze(t);
      $('c_chars').textContent=s.chars;
      $('c_nospace').textContent=s.noSpace;
      $('c_words').textContent=s.latin;
      $('c_cjk').textContent=s.cjk;
      $('c_lines').textContent=s.lines;
      $('c_sent').textContent=s.sentences;
      $('c_para').textContent=s.paragraphs;
      $('c_read').textContent=s.readingMin;
      var tw=P.topWords(t,12);
      $('words').innerHTML=tw.length? tw.map(function(w){return '<span class="tw">'+w[0]+' <b>'+w[1]+'</b></span>';}).join('') : '<span class="empty">输入英文以查看高频词</span>';
    }
    $('in').addEventListener('input',render);
    render();
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
