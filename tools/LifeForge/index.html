<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
</head>
<body>
<div class="app">
  <h1>LifeForge</h1>
  <p class="sub">康威生命游戏：B3/S23 步进 + 环检测 + 经典图案库 · 单文件 · 零依赖 · 本地优先</p>

<div class="opt">
  <label>预置图案
    <select id="pat">
      <option value="glider">滑翔机 Glider</option>
      <option value="blinker">闪烁器 Blinker</option>
      <option value="block">方块 Block（静物）</option>
      <option value="pulsar">脉冲星 Pulsar</option>
    </select>
  </label>
  <label>网格 <input id="size" type="number" value="20" min="8" max="60" style="width:70px" aria-label="size"></label>
</div>
<label>或直接编辑棋盘（. 死 O 活，每行一排）</label>
<textarea id="txt" rows="8" style="font-family:ui-monospace,monospace">....................
..O.................
...O................
.OOO................
....................</textarea>
<div class="row">
  <button id="load">载入图案</button>
  <button id="step">步进 1 代</button>
  <button id="run10">快进 10 代</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>棋盘（SVG）</label>
<div class="out" id="out" aria-live="polite" style="overflow:auto">载入或步进后显示</div>
<script>
function lfParse(text){
  if(typeof text!=='string'||!text.trim()) return { value:null, error:'棋盘为空' };
  var rows=text.split('\n').filter(function(r){ return r.length>0; });
  var w=rows[0].length;
  var grid=[];
  for(var y=0;y<rows.length;y++){
    if(rows[y].length!==w) return { value:null, error:'第 '+(y+1)+' 行宽度不一致' };
    var row=[];
    for(var x=0;x<w;x++){
      var ch=rows[y].charAt(x);
      if(ch!=='.'&&ch!=='O'&&ch!=='o'&&ch!=='*') return { value:null, error:'第 '+(y+1)+' 行含非法字符 "'+ch+'"（只允许 . O o *）' };
      row.push(ch==='.'?0:1);
    }
    grid.push(row);
  }
  return { value:grid, error:null };
}
function lfStep(grid){
  var h=grid.length, w=grid[0].length, next=[];
  for(var y=0;y<h;y++){
    var row=[];
    for(var x=0;x<w;x++){
      var n=0;
      for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
        if(dx===0&&dy===0) continue;
        var yy=(y+dy+h)%h, xx=(x+dx+w)%w;
        n+=grid[yy][xx];
      }
      row.push(grid[y][x]===1 ? (n===2||n===3?1:0) : (n===3?1:0));
    }
    next.push(row);
  }
  return next;
}
function lfRun(grid, gens){
  var g=grid, hist=[lfHash(g)];
  for(var i=0;i<gens;i++){
    g=lfStep(g);
    var hsh=lfHash(g);
    if(hist.indexOf(hsh)!==-1) return { grid:g, generations:i+1, cycle:true, period:i+1-hist.indexOf(hsh) };
    hist.push(hsh);
  }
  return { grid:g, generations:gens, cycle:false, period:0 };
}
function lfHash(grid){
  var s='';
  for(var y=0;y<grid.length;y++) s+=grid[y].join('');
  return s;
}
function lfCount(grid){
  var n=0;
  for(var y=0;y<grid.length;y++) for(var x=0;x<grid[0].length;x++) n+=grid[y][x];
  return n;
}
function lfPattern(name, size){
  var s=Math.max(8, size||20), grid=[], y, x;
  for(y=0;y<s;y++){ var r=[]; for(x=0;x<s;x++) r.push(0); grid.push(r); }
  var P={
    glider:[[1,2],[2,3],[3,1],[3,2],[3,3]],
    blinker:[[2,1],[2,2],[2,3]],
    block:[[1,1],[1,2],[2,1],[2,2]],
    pulsar:[]
  };
  if(name==='pulsar'){
    var seg=[2,3,4,8,9,10], off=[0,5,7,12], i, j;
    for(i=0;i<seg.length;i++) for(j=0;j<off.length;j++){
      P.pulsar.push([off[j]+1, seg[i]+1]); P.pulsar.push([seg[i]+1, off[j]+1]);
    }
    if(s<16) return { value:null, error:'Pulsar 需要至少 16×16 网格' };
  }
  var cells=P[name];
  if(!cells) return { value:null, error:'未知图案: '+name };
  for(var k=0;k<cells.length;k++){
    if(cells[k][0]>=s||cells[k][1]>=s) return { value:null, error:'网格太小放不下该图案' };
    grid[cells[k][0]][cells[k][1]]=1;
  }
  return { value:grid, error:null };
}
function lfText(grid){
  var lines=[];
  for(var y=0;y<grid.length;y++){
    var s='';
    for(var x=0;x<grid[0].length;x++) s+=grid[y][x]?'O':'.';
    lines.push(s);
  }
  return lines.join('\n');
}
function lfSvg(grid){
  var h=grid.length, w=grid[0].length, C=Math.max(8, Math.min(22, Math.floor(560/w)));
  var W=w*C+2, H=h*C+2;
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  s+='<rect width="'+W+'" height="'+H+'" fill="#0A0A0B"/>';
  for(var y=0;y<h;y++) for(var x=0;x<w;x++){
    s+='<rect x="'+(x*C+1)+'" y="'+(y*C+1)+'" width="'+(C-1)+'" height="'+(C-1)+'" rx="2" fill="'+(grid[y][x]?'#10B981':'#141417')+'"/>';
  }
  s+='</svg>';
  return s;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { lfParse:lfParse, lfStep:lfStep, lfRun:lfRun, lfCount:lfCount, lfPattern:lfPattern, lfText:lfText, lfHash:lfHash, lfSvg:lfSvg };
}
if (typeof window !== 'undefined') {
  window.LifeForgePure = { lfParse:lfParse, lfStep:lfStep, lfRun:lfRun, lfCount:lfCount, lfPattern:lfPattern, lfText:lfText, lfHash:lfHash, lfSvg:lfSvg };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.LifeForgePure;
    var gen=0;
    function render(grid, note){
      $('txt').value=P.lfText(grid);
      $('out').innerHTML=P.lfSvg(grid)+'<div style="margin-top:8px;color:#A1A1AA;font-size:12px">第 '+gen+' 代 · 活细胞 '+P.lfCount(grid)+(note||'')+'</div>';
    }
    function current(){
      var p=P.lfParse($('txt').value);
      if(p.error){ $('err').textContent=p.error; return null; }
      return p.value;
    }
    $('load').addEventListener('click', function(){
      $('err').textContent='';
      var r=P.lfPattern($('pat').value, Number($('size').value)||20);
      if(r.error){ $('err').textContent=r.error; return; }
      gen=0; render(r.value);
    });
    $('step').addEventListener('click', function(){
      $('err').textContent='';
      var g=current(); if(!g) return;
      gen++; render(P.lfStep(g));
    });
    $('run10').addEventListener('click', function(){
      $('err').textContent='';
      var g=current(); if(!g) return;
      var r=P.lfRun(g, 10);
      gen+=r.generations;
      render(r.grid, r.cycle?' · 检测到周期 '+r.period:'');
    });
    $('clear').addEventListener('click', function(){ $('txt').value=''; $('out').textContent='载入或步进后显示'; gen=0; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
</body>
