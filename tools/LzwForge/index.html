<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>LzwForge — LZW 无损压缩编解码器：文本压缩为码表并可无损还原</title>
<meta property="og:title" content="LzwForge">
<meta property="og:description" content="LZW 无损压缩编解码器：文本压缩为码表并可无损还原">
<meta property="og:image" content="./og.png">
<meta name="description" content="LZW 无损压缩编解码器：文本压缩为码表并可无损还原 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="app">
  <h1>LzwForge</h1>
  <p class="sub">LZW 无损压缩编解码器：文本压缩为码表并可无损还原 · 单文件 · 零依赖 · 本地优先</p>

<label>输入文本</label>
<textarea id="in" rows="4">TOBEORNOTTOBEORTOBEORNOT</textarea>
<label>码表（压缩输出）</label>
<textarea id="codes" rows="3" placeholder="压缩后显示，可手动编辑后解压"></textarea>
<div class="row">
  <button id="compress">压缩</button>
  <button id="decompress">解压</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">压缩或解压</div>
<script>
function lzwCompress(str){
  var dict={}, dictSize=256;
  for(var i=0;i<256;i++) dict[String.fromCharCode(i)]=i;
  var w='';
  var codes=[];
  for(var i=0;i<str.length;i++){
    var c=str.charAt(i);
    var wc=w+c;
    if(dict[wc]!==undefined){ w=wc; }
    else { codes.push(dict[w]); if(dictSize<65536) dict[wc]=dictSize++; w=c; }
  }
  if(w!=='') codes.push(dict[w]);
  return codes;
}
function lzwDecompress(codes){
  if(!codes.length) return '';
  var dict={}, dictSize=256;
  for(var i=0;i<256;i++) dict[i]=String.fromCharCode(i);
  if(dict[codes[0]]===undefined) throw new Error('bad code '+codes[0]);
  var w=dict[codes[0]];
  var result=w;
  for(var i=1;i<codes.length;i++){
    var k=codes[i];
    var entry;
    if(dict[k]!==undefined) entry=dict[k];
    else if(k===dictSize) entry=w+w.charAt(0);
    else throw new Error('bad code '+k);
    result+=entry;
    if(dictSize<65536) dict[dictSize++]=w+entry.charAt(0);
    w=entry;
  }
  return result;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { lzwCompress:lzwCompress, lzwDecompress:lzwDecompress };
}
if (typeof window !== 'undefined') {
  window.LzwForgePure = { lzwCompress:lzwCompress, lzwDecompress:lzwDecompress };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.LzwForgePure;
    $('compress').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var codes=P.lzwCompress($('in').value);
        $('codes').value=codes.join(',');
        var ratio=(codes.length/($('in').value.length||1)*100).toFixed(1);
        $('out').textContent='码数 '+codes.length+' / 原长 '+$('in').value.length+' → '+ratio+'%';
      } catch(e){ $('err').textContent=e.message; }
    });
    $('decompress').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var arr=$('codes').value.split(',').map(function(x){return parseInt(x,10);}).filter(function(x){return !isNaN(x);});
        $('out').textContent=P.lzwDecompress(arr);
      } catch(e){ $('err').textContent='\u89e3\u538b\u5931\u8d25\uff1a'+e.message; }
    });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('codes').value=''; $('out').textContent='\u538b\u7f29\u6216\u89e3\u538b'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>

</div>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
</body>
</html>
