:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}

label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;

input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

<body>
<div class="app">
  <h1>WordleForge</h1>
  <p class="sub">Wordle 猜词游戏：内置词库离线可玩，双字母精确判定（绿/黄/灰两遍扫描算法），6 次机会，键盘着色提示，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <input id="guess" type="text" maxlength="5" placeholder="输入 5 字母单词" style="flex:1;text-transform:uppercase">
  <button id="submit">提交</button>
  <button id="restart" class="ghost">新游戏</button>
  <span class="sub" id="stat" style="margin:0"></span>
</div>
<div id="board" style="display:grid;grid-template-rows:repeat(6,1fr);gap:6px;max-width:340px;"></div>
<div class="sub" id="kbd" style="letter-spacing:2px;line-height:1.9;font-family:ui-monospace,monospace;"></div>
<script>
function wdWords(){
  return ["APPLE","BRAVE","CRANE","DREAM","EAGLE","FLAME","GRAPE","HOUSE","INPUT","JUICE",
    "KNIFE","LEMON","MOUSE","NIGHT","OCEAN","PIANO","QUERY","RIVER","STONE","TIGER",
    "ULTRA","VIVID","WHALE","XENON","YOUTH","ZEBRA","CODER","DEBUG","ARRAY","STACK",
    "QUEUE","GRAPH","TOKEN","CACHE","PIXEL","LOGIC","SHELL","LINUX","REGEX","ASYNC"];
}
function wdPick(seed){
  var ws=wdWords();
  var s=Math.abs(Math.floor(Number(seed)||0));
  return ws[s%ws.length];
}
function wdValid(guess){
  return /^[A-Za-z]{5}$/.test(String(guess||''));
}
function wdScore(guess, answer){
  guess=String(guess||'').toUpperCase(); answer=String(answer||'').toUpperCase();
  if(guess.length!==5 || answer.length!==5) return null;
  var res=['b','b','b','b','b'];
  var remain={};
  for(var i=0;i<5;i++){
    if(guess[i]===answer[i]){ res[i]='g'; }
    else { remain[answer[i]]=(remain[answer[i]]||0)+1; }
  }
  for(var j=0;j<5;j++){
    if(res[j]==='b' && remain[guess[j]]>0){ res[j]='y'; remain[guess[j]]--; }
  }
  return res.join('');
}
function wdWin(score){ return score==='ggggg'; }
function wdKeyStates(history){
  var rank={b:1,y:2,g:3}, st={};
  (history||[]).forEach(function(h){
    for(var i=0;i<5;i++){
      var ch=h.guess[i], sc=h.score[i];
      if(!st[ch] || rank[sc]>rank[st[ch]]) st[ch]=sc;
    }
  });
  return st;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { wdWords:wdWords, wdPick:wdPick, wdValid:wdValid, wdScore:wdScore, wdWin:wdWin, wdKeyStates:wdKeyStates };
}
if (typeof window !== 'undefined') {
  window.WordleForgePure = { wdWords:wdWords, wdPick:wdPick, wdValid:wdValid, wdScore:wdScore, wdWin:wdWin, wdKeyStates:wdKeyStates };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.WordleForgePure;
    var COLORS={g:'#10B981',y:'#F5A623',b:'#26272B'};
    var answer, history, over;
    function reset(){
      answer=P.wdPick(Date.now());
      history=[]; over=false;
      $('stat').textContent='6 次机会，猜一个 5 字母单词';
      draw();
    }
    function draw(){
      var b=$('board'); b.innerHTML='';
      for(var r=0;r<6;r++){
        var row=document.createElement('div');
        row.style.cssText='display:grid;grid-template-columns:repeat(5,1fr);gap:6px;';
        var h=history[r];
        for(var c=0;c<5;c++){
          var cell=document.createElement('div');
          cell.style.cssText='aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;border-radius:8px;border:1px solid rgba(255,255,255,.08);color:#fff;background:'+(h?COLORS[h.score[c]]:'#141417')+';';
          cell.textContent=h?h.guess[c]:'';
          row.appendChild(cell);
        }
        b.appendChild(row);
      }
      var ks=P.wdKeyStates(history), rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
      $('kbd').innerHTML=rows.map(function(r){
        return r.split('').map(function(ch){
          var s=ks[ch], col=s==='g'?'#10B981':s==='y'?'#F5A623':s==='b'?'#3F3F46':'#A1A1AA';
          return '<span style="color:'+col+'">'+ch+'</span>';
        }).join(' ');
      }).join('<br>');
    }
    $('submit').addEventListener('click', function(){
      if(over){ $('stat').textContent='游戏已结束，点新游戏'; return; }
      var g=$('guess').value.toUpperCase();
      if(!P.wdValid(g)){ $('stat').textContent='需要 5 个英文字母'; return; }
      var sc=P.wdScore(g,answer);
      history.push({guess:g,score:sc});
      $('guess').value='';
      if(P.wdWin(sc)){ over=true; $('stat').textContent='胜利！'+history.length+' 次猜中'; }
      else if(history.length>=6){ over=true; $('stat').textContent='失败，答案是 '+answer; }
      else { $('stat').textContent='还剩 '+(6-history.length)+' 次'; }
      draw();
    });
    $('restart').addEventListener('click', reset);
    $('guess').addEventListener('keydown', function(e){ if(e.key==='Enter') $('submit').click(); });
    reset();
  })();
}
</script>

  <div class="badges" id="badges">
