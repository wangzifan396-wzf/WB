*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;

.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}

label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;

<body>
<div class="app">
  <h1>DistForge</h1>
  <p class="sub">字符串距离六合一：Levenshtein/Damerau/Hamming/Jaro-Winkler/Dice · 单文件 · 零依赖 · 本地优先</p>

<div class="grid2">
  <label>字符串 A</label><input id="sa" type="text" value="kitten">
  <label>字符串 B</label><input id="sb" type="text" value="sitting">
</div>
<div class="row">
  <button id="run">全部计算</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入两个字符串后计算</div>
<script>
function dsLevenshtein(a, b){
  a=String(a); b=String(b);
  var m=a.length, n=b.length;
  if(m===0) return n;
  if(n===0) return m;
  var prev=new Array(n+1), cur=new Array(n+1), i, j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;
    for(j=1;j<=n;j++){
      var cost=a[i-1]===b[j-1]?0:1;
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    var t=prev; prev=cur; cur=t;
  }
  return prev[n];
}
function dsDamerauOSA(a, b){
  a=String(a); b=String(b);
  var m=a.length, n=b.length;
  if(m===0) return n;
  if(n===0) return m;
  var d=[], i, j;
  for(i=0;i<=m;i++){ d[i]=[i]; }
  for(j=0;j<=n;j++) d[0][j]=j;
  for(i=1;i<=m;i++){
    for(j=1;j<=n;j++){
      var cost=a[i-1]===b[j-1]?0:1;
      d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])
        d[i][j]=Math.min(d[i][j], d[i-2][j-2]+1);
    }
  }
  return d[m][n];
}
function dsHamming(a, b){
  a=String(a); b=String(b);
  if(a.length!==b.length) return { value:null, error:'汉明距离要求等长' };
  var d=0;
  for(var i=0;i<a.length;i++) if(a[i]!==b[i]) d++;
  return { value:d, error:null };
}
function dsJaro(a, b){
  a=String(a); b=String(b);
  if(a===b) return 1;
  var m=a.length, n=b.length;
  if(m===0||n===0) return 0;
  var win=Math.max(0, Math.floor(Math.max(m,n)/2)-1);
  var am=new Array(m).fill(false), bm=new Array(n).fill(false);
  var matches=0, i, j;
  for(i=0;i<m;i++){
    var lo=Math.max(0,i-win), hi=Math.min(n-1,i+win);
    for(j=lo;j<=hi;j++){
      if(!bm[j]&&a[i]===b[j]){ am[i]=true; bm[j]=true; matches++; break; }
    }
  }
  if(matches===0) return 0;
  var k=0, trans=0;
  for(i=0;i<m;i++){
    if(am[i]){
      while(!bm[k]) k++;
      if(a[i]!==b[k]) trans++;
      k++;
    }
  }
  trans=trans/2;
  return (matches/m + matches/n + (matches-trans)/matches)/3;
}
function dsJaroWinkler(a, b, p){
  var jw=dsJaro(a,b);
  var scale=(typeof p==='number')?p:0.1;
  var l=0, max=Math.min(4, Math.min(String(a).length, String(b).length));
  while(l<max && String(a)[l]===String(b)[l]) l++;
  return jw + l*scale*(1-jw);
}
function dsBigrams(s){
  var out={}, str=String(s);
  for(var i=0;i<str.length-1;i++){
    var g=str.substr(i,2);
    out[g]=(out[g]||0)+1;
  }
  return out;
}
function dsDice(a, b){
  a=String(a); b=String(b);
  if(a===b) return 1;
  if(a.length<2||b.length<2) return 0;
  var ga=dsBigrams(a), gb=dsBigrams(b), inter=0, na=0, nb=0, g;
  for(g in ga) na+=ga[g];
  for(g in gb) nb+=gb[g];
  for(g in ga) if(gb[g]) inter+=Math.min(ga[g], gb[g]);
  return 2*inter/(na+nb);
}
function dsAll(a, b){
  var h=dsHamming(a,b);
  return {
    levenshtein: dsLevenshtein(a,b),
    damerau: dsDamerauOSA(a,b),
    hamming: h.error?null:h.value,
    jaro: dsJaro(a,b),
    jaroWinkler: dsJaroWinkler(a,b),
    dice: dsDice(a,b)
  };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { dsLevenshtein:dsLevenshtein, dsDamerauOSA:dsDamerauOSA, dsHamming:dsHamming,
    dsJaro:dsJaro, dsJaroWinkler:dsJaroWinkler, dsDice:dsDice, dsBigrams:dsBigrams, dsAll:dsAll };
}
if (typeof window !== 'undefined') {
  window.DistForgePure = { dsLevenshtein:dsLevenshtein, dsDamerauOSA:dsDamerauOSA, dsHamming:dsHamming,
    dsJaro:dsJaro, dsJaroWinkler:dsJaroWinkler, dsDice:dsDice, dsBigrams:dsBigrams, dsAll:dsAll };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.DistForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var r=P.dsAll($('sa').value, $('sb').value);
      $('out').textContent=['Levenshtein 编辑距离: '+r.levenshtein,
        'Damerau-OSA（含换位）: '+r.damerau,
        '汉明距离: '+(r.hamming===null?'—（长度不等）':r.hamming),
        'Jaro 相似度: '+r.jaro.toFixed(6),
        'Jaro-Winkler: '+r.jaroWinkler.toFixed(6),
        'Dice 二元组系数: '+r.dice.toFixed(6)].join('\n');
    });
    $('clear').addEventListener('click', function(){ $('sa').value=''; $('sb').value=''; $('out').textContent='输入两个字符串后计算'; });
  })();
}
</script>
