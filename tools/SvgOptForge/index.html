<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>SvgOptForge — SVG 压缩优化：去注释、合并空白、数值取整，体积即时下降。</title>
<meta property="og:title" content="SvgOptForge">
<meta property="og:description" content="SVG 压缩优化：去注释、折叠空白、数值取整，离线可用">
<meta property="og:image" content="./og.png">
<meta name="description" content="SVG 压缩优化：去注释、折叠空白、数值取整，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>SvgOptForge</h1>
  <p class="sub">SVG 压缩优化：去除注释、折叠冗余空白、坐标数值取整、统计压缩率 · 单文件 · 零依赖 · 本地优先</p>

<label>SVG 源码</label>
<textarea id="src" rows="8" spellcheck="false" style="font:13px ui-monospace,Consolas,monospace"></textarea>
<div class="row">
  <button id="run">压缩</button>
  <button id="sample" class="ghost">示例</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="stat"></div>
<label>压缩结果</label>
<textarea id="dst" rows="6" spellcheck="false" style="font:13px ui-monospace,Consolas,monospace"></textarea>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>

function svStripComments(svg){
  return String(svg||'').replace(/<!--[\s\S]*?-->/g,'');
}
function svRoundNums(svg){
  return svg.replace(/(-?\d*\.\d{3,})/g, function(mm){ return (Math.round(parseFloat(mm)*100)/100).toString(); });
}
function svCollapse(svg){
  return svg.replace(/>\s+</g,'><').replace(/\s{2,}/g,' ').replace(/\s+\/>/g,'/>').replace(/\s+=/g,'=').replace(/=\s+/g,'=').trim();
}
function svOptimize(svg){
  return svCollapse(svRoundNums(svStripComments(String(svg||''))));
}
function svStats(orig, opt){
  var o=String(orig||'').length, n=String(opt||'').length;
  return { original:o, optimized:n, saved: o? Math.round((1-n/o)*1000)/10 : 0 };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { svStripComments:svStripComments, svRoundNums:svRoundNums, svCollapse:svCollapse, svOptimize:svOptimize, svStats:svStats };
}
if (typeof window !== 'undefined') {
  window.SvgOptForgePure = { svStripComments:svStripComments, svRoundNums:svRoundNums, svCollapse:svCollapse, svOptimize:svOptimize, svStats:svStats };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.SvgOptForgePure;
  var SAMPLE='<?xml version="1.0"?>\n<svg width="100" height="100">\n  <!-- a comment -->\n  <rect x="10.12345" y="20.98765" width="30.50000" height="40.00000" fill="#5E6AD2" />\n  <circle cx="50" cy="50" r="25.33333" />\n</svg>';
  function run(){
    var o=$('src').value;
    if(!o.trim()){ $('err').textContent='请粘贴 SVG 或点击示例'; return; }
    var opt=P.svOptimize(o);
    var st=P.svStats(o, opt);
    $('err').textContent='';
    $('dst').value=opt;
    $('stat').innerHTML='<div class="grid">'+
      '<div class="kv"><b>压缩率</b><span>'+st.saved+'%</span></div>'+
      '<div class="kv"><b>原始体积</b><span>'+st.original+' B</span></div>'+
      '<div class="kv"><b>压缩后</b><span>'+st.optimized+' B</span></div></div>';
  }
  $('run').addEventListener('click', run);
  $('sample').addEventListener('click', function(){ $('src').value=SAMPLE; run(); });
  $('src').value=SAMPLE; run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
