<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <h1>SnakeForge</h1>
  <p class="sub">贪吃蛇：纯逻辑内核（移动/进食/墙撞/自撞）+ Canvas 游戏，方向键操作。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <canvas id="cv" width="320" height="320"></canvas>
  <div class="side">
    <div class="out" id="score">得分 0</div>
    <button id="reset">重新开始</button>
    <p class="hint">方向键控制移动，吃到食物变长，撞墙或撞自己结束。</p>
  </div>
</div>
<div class="err" id="err"></div>
<script>
var SK_W=20, SK_H=20, SK_CELL=16;
function skNew(w,h){
  w=w||SK_W; h=h||SK_H;
  var snake=[[Math.floor(w/2),Math.floor(h/2)],[Math.floor(w/2)-1,Math.floor(h/2)]];
  var s={ w:w, h:h, snake:snake, dir:[1,0], food:null, score:0, over:false };
  skSpawnFood(s); return s;
}
function skSpawnFood(s){
  var occ={}; s.snake.forEach(function(c){ occ[c[0]+','+c[1]]=1; });
  var free=[];
  for(var y=0;y<s.h;y++) for(var x=0;x<s.w;x++) if(!occ[x+','+y]) free.push([x,y]);
  if(!free.length){ s.food=null; return; }
  s.food=free[Math.floor(Math.random()*free.length)];
}
function skSetDir(s, d){
  if(s.over) return;
  if(s.dir[0]===-d[0] && s.dir[1]===-d[1]) return; // no reverse
  s.dir=d;
}
function skStep(s){
  if(s.over) return s;
  var head=s.snake[0], nx=head[0]+s.dir[0], ny=head[1]+s.dir[1];
  if(nx<0||nx>=s.w||ny<0||ny>=s.h){ s.over=true; return s; }
  for(var i=0;i<s.snake.length;i++){ if(s.snake[i][0]===nx&&s.snake[i][1]===ny){ s.over=true; return s; } }
  s.snake.unshift([nx,ny]);
  if(s.food && nx===s.food[0] && ny===s.food[1]){ s.score++; skSpawnFood(s); }
  else { s.snake.pop(); }
  return s;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { SK_W:SK_W, SK_H:SK_H, skNew:skNew, skSpawnFood:skSpawnFood, skSetDir:skSetDir, skStep:skStep };
}
if (typeof window !== 'undefined') {
  window.SnakeForgePure = { SK_W:SK_W, SK_H:SK_H, skNew:skNew, skSpawnFood:skSpawnFood, skSetDir:skSetDir, skStep:skStep };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.SnakeForgePure, s=P.skNew();
    function draw(){
      var cv=$('cv'), ctx=cv.getContext('2d');
      ctx.fillStyle='#0A0A0B'; ctx.fillRect(0,0,320,320);
      for(var i=0;i<s.snake.length;i++){ ctx.fillStyle=i===0?'#10B981':'#5E6AD2'; var c=s.snake[i]; ctx.fillRect(c[0]*SK_CELL+1,c[1]*SK_CELL+1,SK_CELL-2,SK_CELL-2); }
      if(s.food){ ctx.fillStyle='#F5A623'; ctx.fillRect(s.food[0]*SK_CELL+1,s.food[1]*SK_CELL+1,SK_CELL-2,SK_CELL-2); }
      $('score').textContent='得分 '+s.score;
      if(s.over) $('score').textContent='结束 得分 '+s.score;
    }
    function loop(){ if(s.over) return; s=P.skStep(s); draw(); }
    var timer=setInterval(loop, 120);
    document.addEventListener('keydown', function(e){
      var m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
      if(!m[e.key]) return; e.preventDefault(); P.skSetDir(s, m[e.key]);
    });
    $('reset').addEventListener('click', function(){ s=P.skNew(); draw(); });
    draw();
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
