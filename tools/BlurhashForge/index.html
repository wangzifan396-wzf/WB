<script>

var BASE83 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#$%*+,-.:;=?@[]^_{|}~';
function decode83(str){
  var v=0, s=String(str);
  for(var i=0;i<s.length;i++){
    var d=BASE83.indexOf(s.charAt(i));
    if(d<0) return -1;
    v = v*83 + d;
  }
  return v;
}
function encode83(value, length){
  var out='', v=Math.floor(value);
  for(var i=1;i<=length;i++){
    var digit = Math.floor(v / Math.pow(83, length-i)) % 83;
    out += BASE83.charAt(digit);
  }
  return out;
}
function srgbToLinear(v){
  var x = v/255;
  return x<=0.04045 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4);
}
function linearToSrgb(v){
  var x = Math.max(0, Math.min(1, v));
  return x<=0.0031308 ? Math.trunc(x*12.92*255+0.5) : Math.trunc((1.055*Math.pow(x, 1/2.4)-0.055)*255+0.5);
}
function signPow(val, exp){ return (val<0?-1:1) * Math.pow(Math.abs(val), exp); }
function parseHash(hash){
  var h = String(hash||'').trim();
  if(h.length < 6) return {valid:false, error:'BlurHash 至少 6 个字符', length:h.length};
  for(var i=0;i<h.length;i++){
    if(BASE83.indexOf(h.charAt(i))<0) return {valid:false, error:'含非 base83 字符: '+h.charAt(i), length:h.length};
  }
  var sizeFlag = decode83(h.charAt(0));
  var numY = Math.floor(sizeFlag/9)+1;
  var numX = (sizeFlag%9)+1;
  var expected = 4 + 2*numX*numY;
  if(h.length !== expected) return {valid:false, error:'长度应为 '+expected+'，实际 '+h.length, componentX:numX, componentY:numY, length:h.length};
  return {valid:true, error:null, componentX:numX, componentY:numY, length:h.length, sizeFlag:sizeFlag, hash:h};
}
function decodeDC(value){
  var r = value>>16, g = (value>>8)&255, b = value&255;
  return [srgbToLinear(r), srgbToLinear(g), srgbToLinear(b)];
}
function decodeAC(value, maximumValue){
  var quantR = Math.floor(value/(19*19));
  var quantG = Math.floor(value/19)%19;
  var quantB = value%19;
  return [
    signPow((quantR-9)/9, 2)*maximumValue,
    signPow((quantG-9)/9, 2)*maximumValue,
    signPow((quantB-9)/9, 2)*maximumValue
  ];
}
function encodeDC(v){
  return (linearToSrgb(v[0])<<16) + (linearToSrgb(v[1])<<8) + linearToSrgb(v[2]);
}
function encodeAC(v, maximumValue){
  function q(x){ return Math.max(0, Math.min(18, Math.floor(signPow(x/maximumValue, 0.5)*9+9.5))); }
  return q(v[0])*19*19 + q(v[1])*19 + q(v[2]);
}
function averageColor(hash){
  var p=parseHash(hash);
  if(!p.valid) return {error:p.error, hex:null};
  var value = decode83(p.hash.substring(2,6));
  var r = value>>16, g=(value>>8)&255, b=value&255;
  function hx(n){ return ('0'+n.toString(16)).slice(-2); }
  return {r:r, g:g, b:b, hex:'#'+hx(r)+hx(g)+hx(b), error:null};
}
function decodeBlurhash(hash, width, height, punch){
  var p=parseHash(hash);
  if(!p.valid) return {error:p.error, pixels:null};
  var w = Math.max(1, Math.floor(width||32)), hgt = Math.max(1, Math.floor(height||32));
  var pu = punch===undefined ? 1 : punch;
  var numX=p.componentX, numY=p.componentY, h=p.hash;
  var quantMax = decode83(h.charAt(1));
  var maximumValue = (quantMax+1)/166;
  var colors = new Array(numX*numY);
  colors[0] = decodeDC(decode83(h.substring(2,6)));
  for(var i=1;i<numX*numY;i++){
    colors[i] = decodeAC(decode83(h.substring(4+i*2, 6+i*2)), maximumValue*pu);
  }
  var bpr = w*4, pixels = new Array(bpr*hgt);
  for(var y=0;y<hgt;y++){
    for(var x=0;x<w;x++){
      var r=0,g=0,b=0;
      for(var j=0;j<numY;j++){
        for(var ii=0;ii<numX;ii++){
          var basis = Math.cos(Math.PI*x*ii/w) * Math.cos(Math.PI*y*j/hgt);
          var c = colors[ii + j*numX];
          r += c[0]*basis; g += c[1]*basis; b += c[2]*basis;
        }
      }
      var idx = 4*x + y*bpr;
      pixels[idx]=linearToSrgb(r); pixels[idx+1]=linearToSrgb(g); pixels[idx+2]=linearToSrgb(b); pixels[idx+3]=255;
    }
  }
  return {pixels:pixels, width:w, height:hgt, componentX:numX, componentY:numY, error:null};
}
function multiplyBasis(pixels, width, height, i, j){
  var r=0,g=0,b=0, norm = (i===0 && j===0) ? 1 : 2, bpr = width*4;
  for(var x=0;x<width;x++){
    for(var y=0;y<height;y++){
      var basis = norm * Math.cos(Math.PI*i*x/width) * Math.cos(Math.PI*j*y/height);
      var idx = 4*x + y*bpr;
      r += basis * srgbToLinear(pixels[idx]);
      g += basis * srgbToLinear(pixels[idx+1]);
      b += basis * srgbToLinear(pixels[idx+2]);
    }
  }
  var scale = 1/(width*height);
  return [r*scale, g*scale, b*scale];
}
function encodeBlurhash(pixels, width, height, compX, compY){
  var cx = Math.max(1, Math.min(9, Math.floor(compX||4)));
  var cy = Math.max(1, Math.min(9, Math.floor(compY||3)));
  if(!pixels || pixels.length !== width*height*4) return {hash:null, error:'像素数组长度应为 width*height*4'};
  var factors=[];
  for(var j=0;j<cy;j++){
    for(var i=0;i<cx;i++){
      factors.push(multiplyBasis(pixels, width, height, i, j));
    }
  }
  var dc = factors[0], ac = factors.slice(1);
  var hash = encode83((cx-1)+(cy-1)*9, 1);
  var maximumValue, quantMax;
  if(ac.length){
    var actualMax = 0;
    for(var k=0;k<ac.length;k++){
      for(var c=0;c<3;c++) actualMax = Math.max(Math.abs(ac[k][c]), actualMax);
    }
    quantMax = Math.max(0, Math.min(82, Math.floor(actualMax*166-0.5)));
    maximumValue = (quantMax+1)/166;
  } else { quantMax = 0; maximumValue = 1; }
  hash += encode83(quantMax, 1);
  hash += encode83(encodeDC(dc), 4);
  for(var m=0;m<ac.length;m++) hash += encode83(encodeAC(ac[m], maximumValue), 2);
  return {hash:hash, error:null, componentX:cx, componentY:cy};
}
function solidPixels(width, height, r, g, b){
  var out=new Array(width*height*4);
  for(var i=0;i<width*height;i++){
    out[i*4]=r; out[i*4+1]=g; out[i*4+2]=b; out[i*4+3]=255;
  }
  return out;
}
function toCssGradient(hash, grid){
  var n = Math.max(2, Math.min(6, Math.floor(grid||3)));
  var d = decodeBlurhash(hash, n, n, 1);
  if(d.error) return {css:null, error:d.error};
  var parts=[];
  for(var y=0;y<n;y++){
    for(var x=0;x<n;x++){
      var i=4*x + y*n*4;
      var px = Math.round(x/(n-1)*100), py = Math.round(y/(n-1)*100);
      parts.push('radial-gradient(at '+px+'% '+py+'%, rgba('+d.pixels[i]+','+d.pixels[i+1]+','+d.pixels[i+2]+',1) 0px, transparent 55%)');
    }
  }
  var avg = averageColor(hash);
  return {css:'background-color: '+avg.hex+';\nbackground-image: '+parts.join(',\n  ')+';', error:null, layers:parts.length};
}
function hashCost(hash){
  var p=parseHash(hash);
  if(!p.valid) return {bytes:0, error:p.error};
  var bytes = p.length;
  return {
    bytes: bytes,
    components: p.componentX*p.componentY,
    vsBase64Jpeg: Math.round(2400/bytes),
    note: bytes+' 字节即可内联进 HTML/JSON，约为最小 base64 JPEG 占位图的 1/'+Math.round(2400/bytes)
  };
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { BASE83:BASE83, decode83:decode83, encode83:encode83, srgbToLinear:srgbToLinear, linearToSrgb:linearToSrgb, signPow:signPow, parseHash:parseHash, decodeDC:decodeDC, decodeAC:decodeAC, encodeDC:encodeDC, encodeAC:encodeAC, averageColor:averageColor, decodeBlurhash:decodeBlurhash, multiplyBasis:multiplyBasis, encodeBlurhash:encodeBlurhash, solidPixels:solidPixels, toCssGradient:toCssGradient, hashCost:hashCost }; }
if (typeof window !== 'undefined') { window.BlurhashForgePure = { BASE83:BASE83, decode83:decode83, encode83:encode83, srgbToLinear:srgbToLinear, linearToSrgb:linearToSrgb, signPow:signPow, parseHash:parseHash, decodeDC:decodeDC, decodeAC:decodeAC, encodeDC:encodeDC, encodeAC:encodeAC, averageColor:averageColor, decodeBlurhash:decodeBlurhash, multiplyBasis:multiplyBasis, encodeBlurhash:encodeBlurhash, solidPixels:solidPixels, toCssGradient:toCssGradient, hashCost:hashCost }; }

</script>
<script>

(function(){
  if(typeof window==='undefined' || !window.document) return;
  var $=function(id){return document.getElementById(id);};
  function hexToRgb(hx){
    var s=String(hx).replace('#','');
    return [parseInt(s.slice(0,2),16), parseInt(s.slice(2,4),16), parseInt(s.slice(4,6),16)];
  }
  function draw(){
    var hash=$('hash').value.trim();
    var w=parseInt($('w').value,10)||240, h=parseInt($('h').value,10)||160;
    var pu=parseFloat($('punch').value); if(isNaN(pu)) pu=1;
    var p=parseHash(hash);
    if(!p.valid){ $('info').textContent='无效: '+p.error; return; }
    var d=decodeBlurhash(hash, Math.min(w,400), Math.min(h,400), pu);
    var cv=$('cv');
    if(cv){
      cv.width=d.width; cv.height=d.height;
      var ctx=cv.getContext && cv.getContext('2d');
      if(ctx){
        var img=ctx.createImageData(d.width, d.height);
        for(var i=0;i<d.pixels.length;i++) img.data[i]=d.pixels[i];
        ctx.putImageData(img,0,0);
      }
    }
    var avg=averageColor(hash), cost=hashCost(hash);
    $('info').textContent = '组件 '+p.componentX+'×'+p.componentY+' · 平均色 '+avg.hex+' · '+cost.bytes+' 字节';
    var g=toCssGradient(hash, 3);
    $('css').textContent = g.css || g.error;
    $('cost').textContent = cost.note;
  }
  function encode(){
    var a=hexToRgb($('ca').value), b=hexToRgb($('cb').value);
    var W=32, H=32, px=new Array(W*H*4);
    for(var y=0;y<H;y++){
      for(var x=0;x<W;x++){
        var t=(x/(W-1)+y/(H-1))/2, i=4*x + y*W*4;
        px[i]=Math.round(a[0]+(b[0]-a[0])*t);
        px[i+1]=Math.round(a[1]+(b[1]-a[1])*t);
        px[i+2]=Math.round(a[2]+(b[2]-a[2])*t);
        px[i+3]=255;
      }
    }
    var r=encodeBlurhash(px, W, H, parseInt($('cx').value,10)||4, parseInt($('cy').value,10)||3);
    $('out').textContent = r.hash || r.error;
    if(r.hash){ $('hash').value=r.hash; draw(); }
  }
  ['hash','w','h','punch'].forEach(function(id){ var el=$(id); if(el) el.addEventListener('input', draw); });
  $('enc').addEventListener('click', encode);
  $('copy').addEventListener('click', function(){ if(navigator.clipboard) navigator.clipboard.writeText($('out').textContent||$('hash').value); });
  draw();
})();

</script>

try{if(document.execCommand){var oe=document.execCommand.bind(document);document.execCommand=function(c){var r=oe.apply(null,arguments);if(String(c).toLowerCase()==='copy'){show(r?(zh()?'已复制':'Copied'):(zh()?'复制失败':'Copy failed'),!r);}return r;};}}catch(e){}
})();
</script>
