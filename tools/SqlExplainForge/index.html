<body>
<div class="app">
  <h1>SqlExplainForge</h1>
  <p class="sub">SQL 解析：拆解查询子句并按 FROM→JOIN→WHERE→SELECT→ORDER 还原执行顺序，定位性能瓶颈 · 单文件 · 零依赖 · 本地优先</p>

<label>粘贴 SQL 语句</label>
<textarea id="src" rows="5" spellcheck="false">SELECT id, name FROM users WHERE age > 18 AND active = 1 ORDER BY name LIMIT 10</textarea>
<div class="row"><button id="ex">解析执行顺序</button></div>
<div class="err" id="err"></div>
<div class="out" id="out">执行顺序将显示在这里</div>

  <div class="badges">
    <span class="badge">零依赖</span>

    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>

</div>
<script>

function sqlExplain(sql){
  var r={select:[], from:'', joins:[], where:[], groupBy:'', orderBy:'', limit:null, valid:false, raw:sql};
  if(!sql) return r;
  var s=sql.replace(/--[^\n]*\n/g,' ').replace(/\s+/g,' ').trim();
  var m=s.match(/select\s+(.*?)\s+from\s+/i);
  if(m){ r.select=m[1].split(',').map(function(x){return x.trim();}).filter(Boolean); }
  var fm=s.match(/from\s+([`"']?\w+[`"']?)/i);
  if(fm) r.from=fm[1].replace(/[`"']/g,'');
  var jm=s.match(/join\s+([`"']?\w+[`"']?)(?:\s+(?!on\b)[`"']?\w+[`"']?)?\s+on\s+([^\s]+)\s*=\s*([^\s]+)/gi);
  if(jm){ for(var i=0;i<jm.length;i++){ var p=jm[i].match(/join\s+([`"']?\w+[`"']?)(?:\s+(?!on\b)[`"']?\w+[`"']?)?\s+on\s+([^\s]+)\s*=\s*([^\s]+)/i); if(p) r.joins.push({table:p[1].replace(/[`"']/g,''), on:p[2]+'='+p[3]}); } }
  var wm=s.match(/where\s+(.*?)(?:\s+group by|\s+order by|\s+limit|$)/i);
  if(wm){ var cond=wm[1].trim(); if(cond) r.where=cond.split(/\s+and\s+/i).map(function(x){return x.trim();}); }
  var gm=s.match(/group by\s+([^\s]+)/i); if(gm) r.groupBy=gm[1];
  var om=s.match(/order by\s+([^\s]+)/i); if(om) r.orderBy=om[1];
  var lm=s.match(/limit\s+(\d+)/i); if(lm) r.limit=parseInt(lm[1],10);
  r.valid = r.select.length>0 && !!r.from;
  return r;
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { sqlExplain:sqlExplain }; }
if (typeof window !== 'undefined') { window.SqlExplainForgePure = { sqlExplain:sqlExplain }; }

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.SqlExplainForgePure;
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function ex(){
    var r=P.sqlExplain($('src').value);
    if(!r.valid){ $('err').textContent='无法解析：需要 SELECT ... FROM ...'; return; }
    $('err').textContent='';
    var order=[['FROM', r.from]];
    for(var i=0;i<r.joins.length;i++) order.push(['JOIN', r.joins[i].table+' ON '+r.joins[i].on]);
    for(var w=0;w<r.where.length;w++) order.push(['WHERE', r.where[w]]);
    if(r.groupBy) order.push(['GROUP BY', r.groupBy]);
    order.push(['SELECT', r.select.join(', ')]);
    if(r.orderBy) order.push(['ORDER BY', r.orderBy]);
    if(r.limit!=null) order.push(['LIMIT', r.limit]);
    var h='<div class="grid">';
    for(var k=0;k<order.length;k++){ h+='<div class="kv"><b>'+(k+1)+'. '+esc(order[k][0])+'</b><span>'+esc(order[k][1])+'</span></div>'; }
    h+='</div>';
    $('out').innerHTML=h;
  }
  $('ex').addEventListener('click', ex);
  ex();
})();

</script>
