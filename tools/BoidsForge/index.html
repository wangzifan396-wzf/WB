/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}

.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}

<body>
<div class="app">
  <h1>BoidsForge</h1>
  <p class="sub">Boids 群体模拟：分离、对齐、聚合三规则驱动的鸟群行为，可调参数实时观察涌现，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<label>数量</label>
<input id="count" type="number" value="60" min="5" max="200">
<div class="row">
  <label style="flex:1;">分离 <input id="sep" type="range" min="0" max="3" step="0.1" value="1.5"></label>
  <label style="flex:1;">对齐 <input id="ali" type="range" min="0" max="3" step="0.1" value="1.0"></label>
  <label style="flex:1;">聚合 <input id="coh" type="range" min="0" max="3" step="0.1" value="1.0"></label>
</div>
<div class="row">
  <button id="restart">重置</button>
  <button id="pause" class="ghost">暂停/继续</button>
</div>
<div class="err" id="err"></div>
<canvas id="cv" width="640" height="400" style="width:100%;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;"></canvas>
<script>
function bdRng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function bdInit(n, w, h, seed){
  var rnd = bdRng(seed||1), bs = [];
  for(var i=0;i<n;i++){
    var ang = rnd()*Math.PI*2;
    bs.push({ x: rnd()*w, y: rnd()*h, vx: Math.cos(ang)*2, vy: Math.sin(ang)*2 });
  }
  return bs;
}
function bdStep(boids, w, h, cfg){
  var R = cfg.radius || 60, sepR = 22;
  var maxV = cfg.maxV || 3.2;
  var out = [];
  for(var i=0;i<boids.length;i++){
    var b = boids[i];
    var cx=0, cy=0, ax=0, ay=0, sx=0, sy=0, cnt=0;
    for(var j=0;j<boids.length;j++){
      if(i===j) continue;
      var o = boids[j], dx = o.x-b.x, dy = o.y-b.y, d2 = dx*dx+dy*dy;
      if(d2 < R*R){
        cnt++;
        cx += o.x; cy += o.y;
        ax += o.vx; ay += o.vy;
        if(d2 < sepR*sepR && d2 > 0){ sx -= dx/Math.sqrt(d2); sy -= dy/Math.sqrt(d2); }
      }
    }
    var vx = b.vx, vy = b.vy;
    if(cnt > 0){
      vx += ((cx/cnt - b.x) * 0.005) * cfg.coh;
      vy += ((cy/cnt - b.y) * 0.005) * cfg.coh;
      vx += ((ax/cnt - b.vx) * 0.05) * cfg.ali;
      vy += ((ay/cnt - b.vy) * 0.05) * cfg.ali;
    }
    vx += sx * 0.25 * cfg.sep;
    vy += sy * 0.25 * cfg.sep;
    var sp = Math.sqrt(vx*vx+vy*vy) || 1;
    if(sp > maxV){ vx = vx/sp*maxV; vy = vy/sp*maxV; }
    if(sp < 1){ vx = vx/sp; vy = vy/sp; }
    var nx = b.x + vx, ny = b.y + vy;
    if(nx < 0) nx += w; if(nx >= w) nx -= w;
    if(ny < 0) ny += h; if(ny >= h) ny -= h;
    out.push({ x: nx, y: ny, vx: vx, vy: vy });
  }
  return out;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { bdRng:bdRng, bdInit:bdInit, bdStep:bdStep };
}
if (typeof window !== 'undefined') {
  window.BoidsForgePure = { bdRng:bdRng, bdInit:bdInit, bdStep:bdStep };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.BoidsForgePure;
    var W = 640, H = 400, boids = [], paused = false;
    function restart(){ boids = P.bdInit(Math.max(5, Math.min(200, Number($('count').value)||60)), W, H, Date.now() & 0xffff); }
    function frame(){
      if(!paused && boids.length){
        var cfg = { sep: Number($('sep').value), ali: Number($('ali').value), coh: Number($('coh').value), radius: 60, maxV: 3.2 };
        boids = P.bdStep(boids, W, H, cfg);
        var cv = $('cv'), ctx = cv.getContext('2d');
        if(ctx){
        ctx.fillStyle = '#0A0A0B'; ctx.fillRect(0,0,W,H);
        for(var i=0;i<boids.length;i++){
          var b = boids[i], a = Math.atan2(b.vy, b.vx);
          ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
          ctx.fillStyle = '#22D3EE';
          ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-5,4); ctx.lineTo(-5,-4); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
        }
      }
      if(typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
    }
    $('restart').addEventListener('click', restart);
    $('pause').addEventListener('click', function(){ paused = !paused; });
    restart();
    frame();
  })();
}
</script>
