:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;

}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}

input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}

a{color:var(--info);text-decoration:none}

<body>
<div class="app">
  <h1>WaveForge</h1>
  <p class="sub">水波模拟：二维波动方程离散求解，点击激起波纹，阻尼控制扩散与衰减，实时观察干涉，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <button id="pause" class="ghost">暂停/继续</button>
  <button id="reset">清屏</button>
  <label style="flex:1;">阻尼 <input id="damp" type="range" min="0.9" max="1" step="0.002" value="0.996"></label>
</div>
<canvas id="cv" width="480" height="320" style="width:100%;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;cursor:crosshair;"></canvas>
<script>
function waveInit(w,h){ var cur=new Float64Array(w*h), prev=new Float64Array(w*h); return {w:w,h:h,cur:cur,prev:prev}; }
function wavePoke(s,x,y,amp){ if(x>=0&&x<s.w&&y>=0&&y<s.h) s.cur[y*s.w+x]+=amp; }
function waveStep(s,damp){ var w=s.w,h=s.h,cur=s.cur,prev=s.prev,next=new Float64Array(w*h); for(var y=0;y<h;y++){ for(var x=0;x<w;x++){ var i=y*w+x; var l=x>0?cur[i-1]:0, r=x<w-1?cur[i+1]:0, u=y>0?cur[i-w]:0, d=y<h-1?cur[i+w]:0; var val=(l+r+u+d)/2 - prev[i]; val*=damp; next[i]=val; } } return {w:w,h:h,cur:next,prev:cur}; }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { waveInit:waveInit, wavePoke:wavePoke, waveStep:waveStep };
}
if (typeof window !== 'undefined') {
  window.WaveForgePure = { waveInit:waveInit, wavePoke:wavePoke, waveStep:waveStep };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.WaveForgePure;
    var GW=160, GH=107, W=480, H=320, state=P.waveInit(GW,GH), paused=false;
    function draw(){
      var cv=$('cv'); var ctx=cv.getContext('2d'); if(!ctx) return;
      ctx.fillStyle='#0A0A0B'; ctx.fillRect(0,0,W,H);
      var sx=W/GW, sy=H/GH;
      for(var y=0;y<GH;y++){ for(var x=0;x<GW;x++){ var v=state.cur[y*GW+x]; var c=Math.max(-1,Math.min(1,v)); var g=Math.round(128+c*127); ctx.fillStyle='rgb('+Math.round(128-c*80)+','+g+','+Math.round(128+c*40)+')'; ctx.fillRect(x*sx,y*sy,sx+1,sy+1); } }
    }
    function frame(){ if(!paused){ state=P.waveStep(state, Number($('damp').value)||0.996); draw(); } if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame); }
    $('pause').addEventListener('click', function(){ paused=!paused; });
    $('reset').addEventListener('click', function(){ state=P.waveInit(GW,GH); draw(); });
    $('cv').addEventListener('click', function(e){ var r=$('cv').getBoundingClientRect(); var x=Math.floor((e.clientX-r.left)/r.width*GW), y=Math.floor((e.clientY-r.top)/r.height*GH); P.wavePoke(state,x,y,2); });
    draw();
    frame();
  })();
}
</script>
