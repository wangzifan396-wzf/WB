<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge — 离线像素画 / 精灵图编辑器</title>
<meta name="description" content="单文件、零依赖、完全离线的像素画与精灵图编辑器。画笔/填充/取色/镜像、动画帧洋葱皮、调色板、撤销重做、PNG 与雪碧图导出、本地多项目。">
<meta property="og:title" content="PixelForge — Offline Pixel Art & Sprite Editor">
<meta property="og:description" content="Single-file, zero-dependency, fully offline pixel art editor with animation frames, onion skin, palette, undo/redo, PNG & sprite-sheet export.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.svg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0A0B">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --panel:#1A1B1E;
  --text:#FFFFFF; --text2:#A1A1AA; --text3:#71717A;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE; --purple:#A78BFA;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.5; overflow:hidden;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 8px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---- layout ---- */
#app{display:flex;flex-direction:column;height:100vh}
header{
  display:flex;align-items:center;gap:12px;padding:8px 14px;
  background:var(--card);border-bottom:1px solid var(--border);flex:0 0 auto;
}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.logo svg{flex:0 0 auto}
.logo .tag{font-size:11px;color:var(--text3);font-weight:400;border:1px solid var(--border);border-radius:999px;padding:1px 8px}
.spacer{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;
  border:1px solid var(--border-strong);background:var(--panel);color:var(--text2);
  font-size:13px;transition:background .15s,color .15s;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#6E7AE2}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:3px 8px;font-size:12px}

main{display:flex;flex:1;min-height:0}
/* toolbar */
#toolbar{
  flex:0 0 52px;background:var(--card);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;
}
.tool{
  width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--text3);transition:background .15s,color .15s;position:relative;
}
.tool:hover{background:rgba(255,255,255,.06);color:var(--text)}
.tool.active{background:rgba(94,106,210,.18);color:var(--accent)}
.tool svg{width:20px;height:20px}
.tb-sep{width:26px;height:1px;background:var(--border);margin:4px 0}

/* canvas area */
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative;overflow:auto;padding:20px}
#canvasWrap{position:relative;box-shadow:0 8px 40px rgba(0,0,0,.5);border:1px solid var(--border-strong)}
#pixelCanvas,#overlayCanvas{display:block;image-rendering:pixelated}
#overlayCanvas{position:absolute;left:0;top:0;pointer-events:none}
#statusBar{
  position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--text3);
  background:rgba(20,20,23,.85);border:1px solid var(--border);border-radius:6px;padding:3px 10px;
}

/* right panel */
#side{
  flex:0 0 244px;background:var(--card);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;
}
.sec{padding:12px 14px;border-bottom:1px solid var(--border)}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.row label{font-size:12px;color:var(--text2);flex:1}

/* palette */
#palette{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.swatch{
  aspect-ratio:1;border-radius:5px;border:1px solid var(--border-strong);cursor:pointer;position:relative;
}
.swatch.active{outline:2px solid var(--accent);outline-offset:1px}
.swatch.trans{background:
  repeating-conic-gradient(#2A2A2E 0 25%,#1A1B1E 0 50%) 0 0/8px 8px}
#curColorBox{width:26px;height:26px;border-radius:6px;border:1px solid var(--border-strong)}
#colorInput{width:100%;height:28px;padding:1px;background:var(--panel);border:1px solid var(--border);border-radius:6px;cursor:pointer}

/* frames */
#frames{display:flex;flex-wrap:wrap;gap:6px}
.frame{
  width:44px;height:44px;border-radius:6px;border:1px solid var(--border-strong);cursor:pointer;
  background:repeating-conic-gradient(#232327 0 25%,#1A1B1E 0 50%) 0 0/8px 8px;position:relative;overflow:hidden;
}
.frame.active{outline:2px solid var(--accent);outline-offset:1px}
.frame canvas{width:100%;height:100%;image-rendering:pixelated}
.frame .fno{position:absolute;left:2px;top:0;font-size:9px;color:var(--text2);text-shadow:0 0 3px #000}
#previewBox{width:64px;height:64px;border:1px solid var(--border-strong);border-radius:6px;
  background:repeating-conic-gradient(#232327 0 25%,#1A1B1E 0 50%) 0 0/8px 8px}
#previewBox canvas{width:100%;height:100%;image-rendering:pixelated}

/* projects */
.proj{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);
  margin-bottom:6px;font-size:12px;color:var(--text2);
}
.proj:hover{background:rgba(255,255,255,.04)}
.proj .pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--text)}
.proj button{color:var(--text3);font-size:11px}
.proj button:hover{color:var(--warn)}

/* dialog */
dialog{
  background:var(--card);color:var(--text);border:1px solid var(--border-strong);border-radius:12px;
  padding:20px;max-width:340px;width:90%;
}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{font-size:15px;margin-bottom:12px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* toast */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel);border:1px solid var(--border-strong);color:var(--text);
  padding:8px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:99;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:760px){
  #side{display:none}
  #toolbar{flex-basis:46px}
}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>

  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">

<script>
'use strict';
/* ============================================================
 * PixelForge — pure functional core (testable in Node)
 * Grid model: flat array length w*h; cell = '#RRGGBB' string or null (transparent)
 * ============================================================ */

var PF_APP = 'PixelForge';
var PF_VERSION = '1.0.0';
var PF_STORE_KEY = 'pixelforge_projects_v1';
var PF_MAX_UNDO = 60;

var PF_DEFAULT_PALETTE = [
  '#000000', '#FFFFFF', '#5E6AD2', '#A78BFA', '#22D3EE', '#10B981', '#F5A623', '#EF4444',
  '#71717A', '#A1A1AA', '#7C3AED', '#2563EB', '#0EA5E9', '#84CC16', '#F97316', '#EC4899',
  '#3F3F46', '#D4D4D8', '#1E293B', '#78350F', '#14532D', '#7F1D1D', '#FDE68A', null
];

function pfCreateGrid(w, h) {
  var n = (w | 0) * (h | 0);
  if (n <= 0) return [];
  var g = new Array(n);
  for (var i = 0; i < n; i++) g[i] = null;
  return g;
}

function pfIdx(x, y, w) { return y * w + x; }

function pfInBounds(x, y, w, h) { return x >= 0 && y >= 0 && x < w && y < h; }

function pfClone(grid) { return grid.slice(); }

function pfSetPixel(grid, w, h, x, y, color) {
  if (!pfInBounds(x, y, w, h)) return false;
  var i = pfIdx(x, y, w);
  if (grid[i] === color) return false;
  grid[i] = color;
  return true;
}

function pfGetPixel(grid, w, h, x, y) {
  if (!pfInBounds(x, y, w, h)) return undefined;
  return grid[pfIdx(x, y, w)];
}

/* Flood fill (4-connected, iterative). Returns number of cells changed. */
function pfFloodFill(grid, w, h, x, y, color) {
  if (!pfInBounds(x, y, w, h)) return 0;
  var target = grid[pfIdx(x, y, w)];
  if (target === color) return 0;
  var stack = [[x, y]], count = 0;
  while (stack.length) {
    var p = stack.pop(), px = p[0], py = p[1];
    if (!pfInBounds(px, py, w, h)) continue;
    var i = pfIdx(px, py, w);
    if (grid[i] !== target) continue;
    grid[i] = color;
    count++;
    stack.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
  }
  return count;
}

/* Bresenham line -> array of [x,y] points inclusive. */
function pfLine(x0, y0, x1, y1) {
  var pts = [];
  var dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  var err = dx - dy;
  for (;;) {
    pts.push([x0, y0]);
    if (x0 === x1 && y0 === y1) break;
    var e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx) { err += dx; y0 += sy; }
  }
  return pts;
}

/* Rectangle outline points (normalized corners, dedup for 1xN). */
function pfRect(x0, y0, x1, y1) {
  var xa = Math.min(x0, x1), xb = Math.max(x0, x1);
  var ya = Math.min(y0, y1), yb = Math.max(y0, y1);
  var pts = [], seen = {};
  function add(x, y) { var k = x + ',' + y; if (!seen[k]) { seen[k] = 1; pts.push([x, y]); } }

/* Horizontal mirror of full grid -> new grid. */
function pfMirrorH(grid, w, h) {
  var out = pfCreateGrid(w, h);
  for (var y = 0; y < h; y++)
    for (var x = 0; x < w; x++)
      out[pfIdx(w - 1 - x, y, w)] = grid[pfIdx(x, y, w)];
  return out;
}

/* Mirror an x coordinate across vertical axis. */
function pfMirrorX(x, w) { return w - 1 - x; }

/* Resize grid preserving top-left content -> new grid. */
function pfResizeGrid(grid, w, h, nw, nh) {
  var out = pfCreateGrid(nw, nh);

    for (var x = 0; x < mw; x++)

  return out;
}

/* Shift grid by dx,dy (cells falling off are lost) -> new grid. */
function pfShiftGrid(grid, w, h, dx, dy) {
  var out = pfCreateGrid(w, h);
  for (var y = 0; y < h; y++) {
    for (var x = 0; x < w; x++) {

      if (pfInBounds(nx, ny, w, h)) out[pfIdx(nx, ny, w)] = grid[pfIdx(x, y, w)];

  return out;
}

/* '#RGB' or '#RRGGBB' -> [r,g,b] or null on invalid. */
function pfHexToRgb(hex) {
  if (typeof hex !== 'string') return null;
  var m = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.exec(hex.trim());
  if (!m) return null;
  var s = m[1];
  if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
  return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];

  function p(v) { v = Math.max(0, Math.min(255, v | 0)); var s = v.toString(16); return s.length < 2 ? '0' + s : s; }

/* Sprite-sheet layout: near-square, cols >= rows. */
function pfSheetLayout(frameCount) {

  var cols = Math.ceil(Math.sqrt(n));
  var rows = Math.ceil(n / cols);

}

  var s = Math.max(1, scale | 0);
  return { w: w * s, h: h * s };

/* ---- project (de)serialization ---- */
function pfSerializeProject(p) {
  return JSON.stringify({
    app: PF_APP, v: PF_VERSION,
    name: p.name || 'untitled',
    w: p.w, h: p.h,
    frames: p.frames,
    palette: p.palette || null,
    savedAt: p.savedAt || new Date().toISOString()

}

function pfParseProject(json) {
  var o;
  try { o = JSON.parse(json); } catch (e) { return null; }
  if (!o || typeof o !== 'object' || o.app !== PF_APP) return null;
  if (!Array.isArray(o.frames) || !o.frames.length) return null;
  var w = o.w | 0, h = o.h | 0;
  if (w < 1 || h < 1 || w > 256 || h > 256) return null;
  for (var i = 0; i < o.frames.length; i++) {
    if (!Array.isArray(o.frames[i]) || o.frames[i].length !== w * h) return null;
  }
  return { name: String(o.name || 'untitled'), w: w, h: h, frames: o.frames, palette: Array.isArray(o.palette) ? o.palette : null, savedAt: o.savedAt || '' };
}

/* ---- store list helpers (pure over a plain object map) ---- */
function pfUpsertProject(list, proj) {
  var out = [], replaced = false;
  for (var i = 0; i < list.length; i++) {

    else out.push(list[i]);

  return out;
}

  for (var i = 0; i < list.length; i++) if (list[i].name !== name) out.push(list[i]);

  }
  $('saveBtn').onclick = function () {
    $('projNameInput').value = projName || '';
    $('nameDlg').showModal();
  };
  $('dlgCancel').onclick = function () { $('nameDlg').close(); };
  $('dlgOk').onclick = function () {
    var n = $('projNameInput').value.trim();
    if (!n) { toast(t('needName')); return; }
    projName = n;
    var proj = { name: n, w: W, h: H, frames: frames, palette: null, savedAt: new Date().toISOString() };
    saveList(pfUpsertProject(loadList(), proj));
    $('nameDlg').close(); renderProjects(); toast(t('saved') + ': ' + n);
  };
  $('newProjBtn').onclick = function () {
    snapshot();
    frames = [pfCreateGrid(W, H)]; cur = 0; projName = '';
    renderFrames(); renderAll(); toast(t('newDoc'));
  };

  /* ---- toast ---- */
  var toastTimer = null;
  function toast(msg) {
    var el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }

  /* ---- lang ---- */
  $('langBtn').onclick = function () {
    lang = lang === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem('pixelforge_lang', lang); } catch (e) {}
    applyLang();
  };

  /* ---- boot ---- */
  window.addEventListener('resize', function () { layout(); renderAll(); });
  applyLang(); layout(); renderPalette(); setColor(color); renderFrames(); renderAll(); renderProjects(); syncUndoBtns();

  /* test hook */
  window.__PIXELFORGE__ = {
    version: PF_VERSION,
    getState: function () { return { w: W, h: H, frames: frames, cur: cur, tool: tool, color: color }; },
    setTool: function (tl) { tool = tl; },
    setColor: setColor,
    drawAt: function (x, y) { snapshot(); applyPoint(x, y); },
    fillAt: function (x, y) { snapshot(); pfFloodFill(frames[cur], W, H, x, y, color); renderAll(); },
    addFrame: function () { $('addFrameBtn').click(); },
    undo: undo, redo: redo,
    save: function (name) {
      var proj = { name: name, w: W, h: H, frames: frames, palette: null, savedAt: new Date().toISOString() };
      saveList(pfUpsertProject(loadList(), proj)); renderProjects();
    },
    listProjects: loadList,
    toggleLang: function () { $('langBtn').click(); return lang; }
  };

  /* PWA */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
}
</script>
</body>
</html>
