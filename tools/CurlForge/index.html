<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CurlForge — 离线 curl 命令生成器：headers / body / 认证</title>
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:90px}
.preview svg{max-width:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.big{font:40px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线 curl 命令生成器：method / headers / body / 认证可视化配置，粘贴即用。">
</head>
<body>
<div class="app">
  <h1>CurlForge</h1>
  <p class="sub">离线 curl 命令生成器：headers / body / 认证 · 单文件 · 零依赖 · 本地优先</p>

<label for="url">请求 URL</label>
<input id="url" type="text" value="https://api.example.com/users" placeholder="https://...">
<div class="row">
  <select id="method">
    <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option>
  </select>
  <select id="bodyType">
    <option value="none">无请求体</option>
    <option value="json">JSON</option>
    <option value="form">表单 urlencoded</option>
  </select>
</div>
<label for="headers">请求头（每行一个 Key: Value）</label>
<textarea id="headers" rows="3" placeholder="Authorization: Bearer TOKEN&#10;X-Api-Key: xxx"></textarea>
<label for="body">请求体</label>
<textarea id="body" rows="4" placeholder='{"name":"nano"}'></textarea>
<div class="row">
  <input id="user" type="text" placeholder="Basic 认证 user:pass（可选）" style="flex:1">
</div>
<div class="row">
  <label class="chk"><input id="optI" type="checkbox"> 含响应头 (-i)</label>
  <label class="chk"><input id="optL" type="checkbox" checked> 跟随重定向 (-L)</label>
  <label class="chk"><input id="optS" type="checkbox"> 静默 (-s)</label>
  <label class="chk"><input id="optK" type="checkbox"> 跳过证书 (-k)</label>
</div>
<div class="row">
  <button id="run">生成 curl</button>
  <button id="copy" class="ghost">复制结果</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>curl 命令</label>
<div class="out" id="out" aria-live="polite">结果会显示在这里</div>
<script>
function shq(s){
  s=String(s);
  if(/^[A-Za-z0-9_\/:.=@%+-]+$/.test(s)) return s;
  return "'"+s.replace(/'/g,"'\\''")+"'";
}
function parseHeaders(text){
  var out=[];
  String(text||'').split(/\r?\n/).forEach(function(line){
    line=line.trim(); if(!line) return;
    var i=line.indexOf(':');
    if(i<1) throw new Error('无效请求头: '+line);
    out.push({key:line.slice(0,i).trim(), value:line.slice(i+1).trim()});
  });
  return out;
}
function buildCurl(opt){
  opt=opt||{};
  var url=String(opt.url||'').trim();
  if(!url) throw new Error('URL 不能为空');
  var method=(opt.method||'GET').toUpperCase();
  var parts=['curl'];
  if(opt.silent) parts.push('-s');
  if(opt.includeHeaders) parts.push('-i');
  if(opt.followRedirect) parts.push('-L');
  if(opt.insecure) parts.push('-k');
  if(method!=='GET') parts.push('-X '+method);
  var headers=(opt.headers||[]).slice();
  var bodyType=opt.bodyType||'none';
  var body=opt.body!=null?String(opt.body):'';
  if(bodyType==='json' && !headers.some(function(h){return h.key.toLowerCase()==='content-type';}))
    headers.push({key:'Content-Type',value:'application/json'});
  if(bodyType==='form' && !headers.some(function(h){return h.key.toLowerCase()==='content-type';}))
    headers.push({key:'Content-Type',value:'application/x-www-form-urlencoded'});
  headers.forEach(function(h){ parts.push('-H '+shq(h.key+': '+h.value)); });
  if(opt.user) parts.push('-u '+shq(opt.user));
  if(bodyType!=='none' && body) parts.push('-d '+shq(body));
  parts.push(shq(url));
  return parts.join(' \\\n  ');
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { shq:shq, parseHeaders:parseHeaders, buildCurl:buildCurl };
}
if (typeof window !== 'undefined') {
  window.CurlForgePure = { shq:shq, parseHeaders:parseHeaders, buildCurl:buildCurl };
}
</script>
<script>
if (typeof window !== 'undefined' && window.document) {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.CurlForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function run(){
      $('err').textContent='';
      try {
        var cmd=P.buildCurl({
          url:$('url').value, method:$('method').value,
          headers:P.parseHeaders($('headers').value),
          bodyType:$('bodyType').value, body:$('body').value,
          user:$('user').value.trim(),
          includeHeaders:$('optI').checked, followRedirect:$('optL').checked,
          silent:$('optS').checked, insecure:$('optK').checked
        });
        $('out').textContent=cmd;
      } catch(e){ $('err').textContent=e.message; $('out').textContent='结果会显示在这里'; }
    }
    ['url','headers','body','user'].forEach(function(id){ $(id).addEventListener('input', run); });
    ['method','bodyType'].forEach(function(id){ $(id).addEventListener('change', run); });
    ['optI','optL','optS','optK'].forEach(function(id){ $(id).addEventListener('change', run); });
    $('run').addEventListener('click', run);
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('headers').value=''; $('body').value=''; $('user').value=''; run(); });
    run();
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
