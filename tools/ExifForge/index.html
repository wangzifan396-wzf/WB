<title>ExifForge — 图片 EXIF 查看与清除</title>
<style>
  :root{
    --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
    --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
  .app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
  .drop{background:var(--surface);border:1px dashed var(--line2);border-radius:10px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
  .drop b{color:var(--fg)}
  table{width:100%;border-collapse:collapse;margin-top:14px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
  td.k{color:var(--info);width:42%;word-break:break-all}
  td.v{color:var(--fg);word-break:break-all}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .out{margin-top:12px;color:var(--muted);font-size:13px;min-height:18px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  footer{margin-top:20px;color:var(--dim);font-size:12px}
  a{color:var(--info);text-decoration:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
#nanoToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#1A1B1E;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:9px 16px;font-size:13px;line-height:1.4;letter-spacing:.01em;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;max-width:80vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#nanoToast.bad{border-color:rgba(239,68,68,.55)}
@media (prefers-reduced-motion:reduce){#nanoToast{transition:none}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线图片 EXIF 元数据查看与清除：解析 JPEG APP1 / TIFF IFD，一键剥离拍摄隐私信息。">
</head>
<body>
<div class="app">
  <h1>ExifForge</h1>
  <p class="sub">图片 EXIF 元数据查看与清除 · 单文件 · 零依赖 · 本地优先</p>

  <label>选择 JPEG 图片（EXIF 位于 JPEG 的 APP1 段）</label>
  <div class="drop" id="drop"><b>点击选择</b> 或拖拽 JPEG 到此处 · 全程在本机解析</div>
  <input id="file" type="file" accept="image/jpeg" hidden>

  <div class="row">
    <button id="strip" disabled>清除 EXIF 并下载</button>
  </div>
  <div class="out" id="out">尚未选择文件</div>

  <table id="tbl" style="display:none"><tbody id="rows"></tbody></table>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
  </div>

  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>

<script>
/* ===== 纯函数区（第一个无属性 script）：可被 Node _test.js 提取并断言 ===== */
function parseTiff(tiff){
  var dv = new DataView(tiff.buffer, tiff.byteOffset, tiff.byteLength);
  var le = (dv.getUint8(0)===0x49 && dv.getUint8(1)===0x49); // II = little endian
  function u16(o){ return dv.getUint16(o, le); }
  function u32(o){ return dv.getUint32(o, le); }
  if(dv.getUint16(2, le)!==0x2A) return null;
  var result = {};
  function readIfd(off){
    if(off+2 > dv.byteLength) return;
    var n = u16(off);
    for(var i=0;i<n;i++){
      var e = off + 2 + i*12;
      var tag = u16(e), type = u16(e+2), count = u32(e+4);
      var valOff = e+8;
      var value;
      if(type===2){ // ASCII
        var bytes = count, strOff = (bytes<=4) ? valOff : u32(valOff), s='';
        for(var k=0;k<bytes;k++){ var c=dv.getUint8(strOff+k); if(c===0) break; s+=String.fromCharCode(c); }
        value = s;
      } else if(type===3){ value = u16(valOff); }
      else if(type===4){ value = u32(valOff); }
      else if(type===1){ value = dv.getUint8(valOff); }
      else { value = null; }
      result[tag] = value;
    }
  }
  readIfd(u32(4));
  if(result[0x8769]!=null) readIfd(result[0x8769]); // Exif sub-IFD
  var NAMES = {0x010F:'Make',0x0110:'Model',0x0132:'DateTime',0x0112:'Orientation',
    0x829A:'ExposureTime',0x8827:'ISO',0x9003:'DateTimeOriginal',0xA002:'PixelXDimension',0xA003:'PixelYDimension'};
  var named = {};
  Object.keys(result).forEach(function(t){ var n=NAMES[t]; if(n) named[n]=result[t]; });
  return named;
}
function parseExifFromJpeg(bytes){
  if(bytes[0]!==0xFF || bytes[1]!==0xD8) return null;
  var i=2;
  while(i+3 < bytes.length){
    if(bytes[i]!==0xFF) break;
    var marker=bytes[i+1];
    if(marker===0xD9) break;
    if(marker>=0xD0 && marker<=0xD9){ i+=2; continue; }
    var len=(bytes[i+2]<<8)|bytes[i+3];
    if(marker===0xE1 && bytes[i+4]===0x45 && bytes[i+5]===0x78 && bytes[i+6]===0x69 &&
        bytes[i+7]===0x66 && bytes[i+8]===0x00 && bytes[i+9]===0x00){
      var tiff = bytes.subarray(i+10, i+2+len);
      return parseTiff(tiff);
    }
    i += len+2;
  }
  return null;
}
function stripExif(bytes){
  if(bytes[0]!==0xFF || bytes[1]!==0xD8) return bytes;
  var out=[0xFF,0xD8], i=2;
  while(i+1 < bytes.length){
    if(bytes[i]!==0xFF){ break; }
    var marker=bytes[i+1];
    if(marker===0xD9){ out.push(0xFF,0xD9); break; }
    if(marker>=0xD0 && marker<=0xD9){ out.push(0xFF,marker); i+=2; continue; }
    var len=(bytes[i+2]<<8)|bytes[i+3];
    var isExif = (marker===0xE1) && bytes[i+4]===0x45 && bytes[i+5]===0x78 && bytes[i+6]===0x69 &&
                 bytes[i+7]===0x66 && bytes[i+8]===0x00 && bytes[i+9]===0x00;
    if(!isExif){ for(var k=0;k<len+2;k++) out.push(bytes[i+k]); }
    i += len+2;
  }
  return Uint8Array.from(out);
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parseTiff:parseTiff, parseExifFromJpeg:parseExifFromJpeg, stripExif:stripExif };
}
if (typeof window !== 'undefined') {
  window.ExifForgePure = { parseTiff:parseTiff, parseExifFromJpeg:parseExifFromJpeg, stripExif:stripExif };
}
</script>

<script>
/* ===== UI 区（第二个 script）：仅在浏览器中运行 ===== */
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.ExifForgePure;
    var current = null;
    function setOut(t){ $('out').textContent = t; }
    function renderTags(tags){
      var rows=$('rows'); rows.innerHTML='';
      var keys=Object.keys(tags);
      if(keys.length===0){ $('tbl').style.display='none'; setOut('未检测到可解析的 EXIF 元数据'); return; }
      keys.forEach(function(k){
        var tr=document.createElement('tr');
        var td1=document.createElement('td'); td1.className='k'; td1.textContent=k;
        var td2=document.createElement('td'); td2.className='v'; td2.textContent=String(tags[k]);
        tr.appendChild(td1); tr.appendChild(td2); rows.appendChild(tr);
      });
      $('tbl').style.display='table';
      setOut('共解析出 '+keys.length+' 条 EXIF 元数据 · 清除后可去除这些隐私信息');
    }
    function handleFile(file){
      if(!file) return;
      var reader=new FileReader();
      reader.onload=function(){
        var buf=new Uint8Array(reader.result);
        current=buf;
        var tags=P.parseExifFromJpeg(buf);
        $('strip').disabled = !tags;
        if(tags) renderTags(tags);
        else { $('tbl').style.display='none'; setOut('该图片没有 EXIF 数据（或未使用 JPEG 格式）'); }
      };
      reader.readAsArrayBuffer(file);
    }
    $('drop').addEventListener('click', function(){ $('file').click(); });
    $('file').addEventListener('change', function(e){ handleFile(e.target.files[0]); });
    ['dragover','drop'].forEach(function(ev){
      $('drop').addEventListener(ev, function(e){ e.preventDefault(); if(ev==='drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    });
    $('strip').addEventListener('click', function(){
      if(!current) return;
      var cleaned=P.stripExif(current);
      var blob=new Blob([cleaned], {type:'image/jpeg'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='cleaned.jpg'; a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
      setOut('已生成清除 EXIF 的副本（cleaned.jpg）');
    });
  })();
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<!-- nano-polish:toast -->
<div id="nanoToast" role="status" aria-live="polite"></div>
<script data-nano-polish>
(function(){var el=document.getElementById('nanoToast');if(!el)return;var t;
function zh(){try{var l=localStorage.getItem('nano-lang')||document.documentElement.lang||'zh';return String(l).indexOf('en')!==0;}catch(e){return true;}}
function show(m,bad){el.textContent=m;el.className='on'+(bad?' bad':'');clearTimeout(t);t=setTimeout(function(){el.className='';},1700);}
window.nanoToast=show;
try{var nc=navigator.clipboard;if(nc&&nc.writeText){var ow=nc.writeText.bind(nc);nc.writeText=function(s){return ow(s).then(function(r){show(zh()?'已复制':'Copied');return r;},function(e){show(zh()?'复制失败':'Copy failed',1);throw e;});};}}catch(e){}
try{if(document.execCommand){var oe=document.execCommand.bind(document);document.execCommand=function(c){var r=oe.apply(null,arguments);if(String(c).toLowerCase()==='copy'){show(r?(zh()?'已复制':'Copied'):(zh()?'复制失败':'Copy failed'),!r);}return r;};}}catch(e){}
})();
</script>
</body>
