<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}

label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}

footer{margin-top:20px;color:var(--dim);font-size:12px}

<body>
<div class="app">
  <h1>CuckooForge</h1>
  <p class="sub">布谷鸟过滤器：可删除的概率型成员判定，指纹 + 双桶 + 踢出重放 · 单文件 · 零依赖 · 本地优先</p>

<label>元素（每行一个）</label>
<textarea id="items" rows="4">alice
bob
carol</textarea>
<div class="grid2">
  <label>桶数 m（2 的幂）</label><input id="m" type="number" value="64" min="4">
  <label>桶容量 b</label><input id="b" type="number" value="4" min="1">
</div>
<label>查询 / 删除目标</label>
<input id="q" type="text" value="alice">
<div class="row">
  <button id="run">加入并查询</button>
  <button id="del" class="ghost">删除目标</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">填入元素后运行</div>
<script>
function fnv1a(str, seed){
  var h=(0x811c9dc5 ^ (seed>>>0))>>>0;
  for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193)>>>0; }
  return h>>>0;
}
function fingerprint(item){
  var f=fnv1a(String(item), 0x1234) & 0xff;
  return f===0 ? 1 : f;
}
function cuckooCreate(buckets, bucketSize){
  if((buckets & (buckets-1))!==0 || buckets<2) throw new Error('BUCKETS_POW2');
  var b=[];
  for(var i=0;i<buckets;i++) b.push([]);
  return { m:buckets, b:(bucketSize||4), buckets:b, count:0 };
}
function idx1(item, m){ return fnv1a(String(item), 0) % m; }
function altIndex(i, fp, m){ return (i ^ (fnv1a(String(fp), 0x5bd1) % m)) % m; }
function cuckooInsert(cf, item){
  var fp=fingerprint(item);
  var i1=idx1(item, cf.m), i2=altIndex(i1, fp, cf.m);
  if(cf.buckets[i1].length<cf.b){ cf.buckets[i1].push(fp); cf.count++; return { ok:true, kicks:0 }; }
  if(cf.buckets[i2].length<cf.b){ cf.buckets[i2].push(fp); cf.count++; return { ok:true, kicks:0 }; }
  var i=Math.random()<0.5?i1:i2, cur=fp;
  for(var k=0;k<500;k++){
    var slot=Math.floor(Math.random()*cf.b);
    var evicted=cf.buckets[i][slot];
    cf.buckets[i][slot]=cur;
    cur=evicted;
    i=altIndex(i, cur, cf.m);
    if(cf.buckets[i].length<cf.b){ cf.buckets[i].push(cur); cf.count++; return { ok:true, kicks:k+1 }; }
  }
  return { ok:false, kicks:500 };
}
function cuckooContains(cf, item){
  var fp=fingerprint(item);
  var i1=idx1(item, cf.m), i2=altIndex(i1, fp, cf.m);
  return cf.buckets[i1].indexOf(fp)>=0 || cf.buckets[i2].indexOf(fp)>=0;
}
function cuckooDelete(cf, item){
  var fp=fingerprint(item);
  var i1=idx1(item, cf.m), i2=altIndex(i1, fp, cf.m);
  var p=cf.buckets[i1].indexOf(fp);
  if(p>=0){ cf.buckets[i1].splice(p,1); cf.count--; return true; }
  p=cf.buckets[i2].indexOf(fp);
  if(p>=0){ cf.buckets[i2].splice(p,1); cf.count--; return true; }
  return false;
}
function loadFactor(cf){ return cf.count/(cf.m*cf.b); }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { fnv1a:fnv1a, fingerprint:fingerprint, cuckooCreate:cuckooCreate,
    cuckooInsert:cuckooInsert, cuckooContains:cuckooContains, cuckooDelete:cuckooDelete,
    loadFactor:loadFactor, altIndex:altIndex, idx1:idx1 };
}
if (typeof window !== 'undefined') {
  window.CuckooForgePure = { cuckooCreate:cuckooCreate, cuckooInsert:cuckooInsert,
    cuckooContains:cuckooContains, cuckooDelete:cuckooDelete, loadFactor:loadFactor };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.CuckooForgePure;
    var cf=null;
    function rebuild(){
      cf=P.cuckooCreate(Number($('m').value)||64, Number($('b').value)||4);
      var items=$('items').value.split(/\r?\n/).filter(function(x){return x.trim();});
      var fails=0;
      items.forEach(function(x){ if(!P.cuckooInsert(cf, x.trim()).ok) fails++; });
      return { items:items, fails:fails };
    }
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var r=rebuild();
        var q=$('q').value.trim();
        var lines=['已加入 '+(r.items.length-r.fails)+' / '+r.items.length+' 个元素',
                   '负载因子: '+(Math.round(P.loadFactor(cf)*1000)/10)+'%', '',
                   '查询 "'+q+'": '+(P.cuckooContains(cf,q)?'可能存在 ✓':'一定不存在 ✗')];
        $('out').textContent=lines.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('del').addEventListener('click', function(){
      $('err').textContent='';
      try {
        if(!cf) rebuild();
        var q=$('q').value.trim();
        var okd=P.cuckooDelete(cf,q);
        $('out').textContent='删除 "'+q+'": '+(okd?'成功':'未找到')+'\n再查询: '+(P.cuckooContains(cf,q)?'可能存在':'一定不存在');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('items').value=''; cf=null; $('out').textContent='填入元素后运行'; });
  })();
}
</script>
