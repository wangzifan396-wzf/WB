*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}

<body>
<div class="app">
  <h1>HllForge</h1>
  <p class="sub">HyperLogLog 基数估计：O(1) 内存近似去重计数，支持合并 · 单文件 · 零依赖 · 本地优先</p>

<label>待去重元素（每行一个，或逗号分隔）</label>
<textarea id="items" rows="5">apple
banana
apple
cherry
banana
date</textarea>
<label>精度 p（寄存器 = 2^p）</label>
<input id="p" type="number" value="12" min="4" max="16">
<div class="row">
  <button id="run">估算基数</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入元素后估算不重复数量（概率近似）</div>
<script>
function fnv1a32(str){
  var h=0x811c9dc5;
  for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return h >>> 0;
}
function hllCreate(p){
  p = p || 12;
  var m = 1 << p;
  var regs = new Array(m); for(var i=0;i<m;i++) regs[i]=0;
  return {p:p, m:m, regs:regs};
}
function hllAdd(hll, item){
  var h = fnv1a32(String(item));
  var idx = h & (hll.m - 1);
  var w = h >>> hll.p;
  var rho = Math.clz32(w) - hll.p + 1;
  if(rho > hll.regs[idx]) hll.regs[idx] = rho;
  return hll;
}
function hllCount(hll){
  var m=hll.m, p=hll.p, alpha;
  if(m===16) alpha=0.673; else if(m===32) alpha=0.697; else if(m===64) alpha=0.709; else alpha=0.7213/(1+1.079/m);
  var sum=0, zeros=0;
  for(var i=0;i<m;i++){ sum += Math.pow(2, -hll.regs[i]); if(hll.regs[i]===0) zeros++; }
  var est = alpha * m * m / sum;
  if(est < 2.5*m && zeros>0){ est = m * Math.log(m/zeros); }
  return Math.round(est);
}
function hllMerge(a, b){
  if(a.p!==b.p) throw new Error('HLL_P_MISMATCH');
  for(var i=0;i<a.m;i++){ if(b.regs[i]>a.regs[i]) a.regs[i]=b.regs[i]; }
  return a;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { fnv1a32:fnv1a32, hllCreate:hllCreate, hllAdd:hllAdd, hllCount:hllCount, hllMerge:hllMerge };
}
if (typeof window !== 'undefined') {
  window.HllForgePure = { fnv1a32:fnv1a32, hllCreate:hllCreate, hllAdd:hllAdd, hllCount:hllCount, hllMerge:hllMerge };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.HllForgePure;
    function parseItems(){
      return $('items').value.split(/[\n,]+/).map(function(x){return x.trim();}).filter(function(x){return x.length;});
    }
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var hll=P.hllCreate(parseInt($('p').value,10)||12);
        var its=parseItems();
        for(var i=0;i<its.length;i++) P.hllAdd(hll, its[i]);
        var uniq={}; for(var j=0;j<its.length;j++) uniq[its[j]]=1;
        var lines=['输入元素: '+its.length, '真实去重: '+Object.keys(uniq).length, 'HLL 估算: '+P.hllCount(hll)];
        $('out').textContent=lines.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('items').value=''; $('out').textContent='输入元素后估算不重复数量（概率近似）'; });
  })();
}
</script>

  <div class="badges" id="badges">

</div>
