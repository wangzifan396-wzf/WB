body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;

/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}

<body>
<div class="app">
  <h1>PrngForge</h1>
  <p class="sub">可复现随机数：mulberry32 / sfc32 / xoshiro128**，种子确定序列 · 单文件 · 零依赖 · 本地优先</p>

<label>种子（任意文本或数字）</label>
<input id="seed" type="text" value="nano-tools" aria-label="seed">
<div class="opt">
  <label>算法
    <select id="algo">
      <option value="mulberry32">mulberry32</option>
      <option value="sfc32">sfc32</option>
      <option value="xoshiro128ss">xoshiro128**</option>
    </select>
  </label>
</div>
<label>生成个数</label>
<input id="n" type="number" value="10" min="1" max="1000" aria-label="n">
<div class="row">
  <button id="run">生成随机数</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">同一种子永远得到同一序列</div>
<script>
function seedHash(str){
  var h=1779033703^String(str).length;
  for(var i=0;i<String(str).length;i++){
    h=Math.imul(h^String(str).charCodeAt(i),3432918353);
    h=(h<<13)|(h>>>19);
  }
  return function(){
    h=Math.imul(h^(h>>>16),2246822507);
    h=Math.imul(h^(h>>>13),3266489909);
    h^=h>>>16;
    return h>>>0;
  };
}
function mulberry32(seed){
  var a=seed>>>0;
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    var t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function sfc32(a,b,c,d){
  return function(){
    a>>>=0; b>>>=0; c>>>=0; d>>>=0;
    var t=(a+b)|0;
    a=b^(b>>>9);
    b=(c+(c<<3))|0;
    c=(c<<21)|(c>>>11);
    d=(d+1)|0;
    t=(t+d)|0;
    c=(c+t)|0;
    return (t>>>0)/4294967296;
  };
}
function xoshiro128ss(a,b,c,d){
  return function(){
    var t=b<<9, r=Math.imul(b,5);
    r=((r<<7)|(r>>>25))>>>0;
    r=Math.imul(r,9)>>>0;
    c^=a; d^=b; b^=c; a^=d; c^=t;
    d=(d<<11)|(d>>>21);
    return r/4294967296;
  };
}
function prngCreate(algo, seedStr){
  var h=seedHash(seedStr);
  if(algo==='mulberry32') return mulberry32(h());
  if(algo==='sfc32') return sfc32(h(),h(),h(),h());
  if(algo==='xoshiro128ss') return xoshiro128ss(h(),h(),h(),h());
  throw new Error('unknown algo: '+algo);
}
function prngSequence(algo, seedStr, n){
  var f=prngCreate(algo, seedStr), out=[];
  for(var i=0;i<n;i++) out.push(f());
  return out;
}
function prngIntRange(algo, seedStr, n, lo, hi){
  var f=prngCreate(algo, seedStr), out=[];
  for(var i=0;i<n;i++) out.push(lo+Math.floor(f()*(hi-lo+1)));
  return out;
}
function prngShuffle(algo, seedStr, arr){
  var f=prngCreate(algo, seedStr), a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(f()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { seedHash:seedHash, mulberry32:mulberry32, sfc32:sfc32, xoshiro128ss:xoshiro128ss,
    prngCreate:prngCreate, prngSequence:prngSequence, prngIntRange:prngIntRange, prngShuffle:prngShuffle };
}
if (typeof window !== 'undefined') {
  window.PrngForgePure = { prngCreate:prngCreate, prngSequence:prngSequence,
    prngIntRange:prngIntRange, prngShuffle:prngShuffle };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.PrngForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var n=Math.min(1000, Math.max(1, Number($('n').value)||10));
        var seq=P.prngSequence($('algo').value, $('seed').value, n);
        $('out').textContent=seq.map(function(x,i){ return '#'+i+'  '+x.toFixed(10); }).join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('out').textContent='同一种子永远得到同一序列'; });
  })();
}
</script>
