<script>
function sfParse(idStr, opts){
  opts = opts || {};
  var epoch = (opts.epoch !== undefined) ? Number(opts.epoch) : 1288834974657;
  if(typeof idStr !== 'string') idStr = String(idStr);
  idStr = idStr.trim();
  if(!/^[0-9]+$/.test(idStr)) return {error:'ID 必须为非负整数'};
  var bi;
  try { bi = BigInt(idStr); } catch(e){ return {error:'ID 解析失败'}; }
  var SEQ_BITS=12n, MACHINE_BITS=10n, TS_BITS=41n;
  var seqMask=(1n<<SEQ_BITS)-1n;
  var machineMask=(1n<<MACHINE_BITS)-1n;
  var sequence=Number(bi & seqMask);
  var machine=Number((bi >> SEQ_BITS) & machineMask);
  var dcBits = (opts.datacenterBits !== undefined) ? Number(opts.datacenterBits) : 5;
  var workerBits = 10 - dcBits;
  var datacenterId = (machine >> workerBits) & ((1 << dcBits) - 1);
  var workerId = machine & ((1 << workerBits) - 1);
  var ts = Number((bi >> (SEQ_BITS + MACHINE_BITS)) & ((1n<<TS_BITS)-1n));
  var ms = ts + epoch;
  var date = new Date(ms);
  return { id:idStr, timestamp:ms, date:isNaN(date.getTime())?null:date.toISOString(),
           machineId:machine, datacenterId:datacenterId, workerId:workerId,
           sequence:sequence, epoch:epoch, error:null };
}
function sfCompose(o){
  o = o || {};
  var epoch = (o.epoch !== undefined) ? Number(o.epoch) : 1288834974657;
  var offset = Math.floor(Number(o.timestamp)) - epoch;
  if(offset < 0) return {error:'timestamp 早于 epoch'};
  var dcBits = (o.datacenterBits !== undefined) ? Number(o.datacenterBits) : 5;
  var workerBits = 10 - dcBits;
  var machine = (BigInt(o.datacenterId||0) << BigInt(workerBits)) | BigInt(o.workerId||0);
  var id = (BigInt(offset) << 22n) | (machine << 12n) | BigInt(o.sequence||0);
  return { id:id.toString(), error:null };
}
function sfIsValid(idStr){ return typeof idStr==='string' && /^[0-9]+$/.test(idStr.trim()) && idStr.trim().length>0; }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parse:sfParse, compose:sfCompose, isValid:sfIsValid, epochDefault:1288834974657 };
}
if (typeof window !== 'undefined') {
  window.SnowflakeForgePure = { parse:sfParse, compose:sfCompose, isValid:sfIsValid };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.SnowflakeForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function run(){
      $('err').textContent='';
      try {
        var epoch = $('sepoch').value.trim()==='' ? 1288834974657 : Number($('sepoch').value);
        var r = P.parse($('sid').value.trim(), {epoch:epoch});
        if(r.error){ $('out').textContent='错误：'+r.error; return; }
        var lines=[];
        lines.push('ID:        ' + r.id);
        lines.push('时间(ms):  ' + r.timestamp);
        lines.push('日期:      ' + r.date);
        lines.push('机器ID:    ' + r.machineId + '  (数据中心 ' + r.datacenterId + ' / 节点 ' + r.workerId + ')');
        lines.push('序列号:    ' + r.sequence);
        lines.push('纪元:      ' + r.epoch);
        $('out').textContent = lines.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    }
    function gen(){
      $('err').textContent='';
      try {
        var epoch = $('sepoch').value.trim()==='' ? 1288834974657 : Number($('sepoch').value);
        var r = P.compose({timestamp:Number($('sts').value), datacenterId:Number($('sdc').value||0),
                           workerId:Number($('swk').value||0), sequence:Number($('sseq').value||0), epoch:epoch});
        if(r.error){ $('out').textContent='错误：'+r.error; return; }
        $('sid').value = r.id;
        $('out').textContent = '生成 ID: ' + r.id;
      } catch(e){ $('err').textContent=e.message; }
    }
    $('run').addEventListener('click', run);
    $('gen').addEventListener('click', gen);
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('sid').value=''; $('out').textContent='解析结果会显示在这里'; });
  })();
}
</script>
