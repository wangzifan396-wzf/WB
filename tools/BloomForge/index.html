  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}

     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}

<body>
<div class="app">
  <h1>BloomForge</h1>
  <p class="sub">布隆过滤器：概率型集合成员判定，去重 / 缓存防护 / 欺诈检测 · 单文件 · 零依赖 · 本地优先</p>

<label>元素（每行一个）</label>
<textarea id="items" rows="4">alice
bob
carol</textarea>
<div class="grid2">
  <label>位数 m</label><input id="m" type="number" value="1000" min="16">
  <label>哈希数 k</label><input id="k" type="number" value="4" min="1">
</div>
<label>查询词</label>
<input id="q" type="text" value="alice">
<div class="row">
  <button id="run">加入并查询</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">填入元素后运行</div>
<script>
function fnv1a(str, seed){
  var h=(0x811c9dc5 ^ (seed>>>0))>>>0;
  for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193)>>>0; }
  return h>>>0;
}
function bloomHashes(item, m, k, seed){
  var h1=fnv1a(item, seed);
  var h2=fnv1a(item, (seed ^ 0x9e3779b9)>>>0) || 1;
  if(h2===0) h2=1;
  var out=[];
  for(var i=0;i<k;i++){ out.push((h1 + i*h2) % m); }
  return out;
}
function bloomCreate(m, k, seed){
  return { m:m, k:k, seed:(seed===undefined?0x9e3779b9:seed)>>>0, bits:new Array(m).fill(0) };
}
function bloomAdd(bf, item){
  var hs=bloomHashes(item, bf.m, bf.k, bf.seed);
  for(var i=0;i<hs.length;i++) bf.bits[hs[i]]=1;
  return bf;
}
function bloomHas(bf, item){
  var hs=bloomHashes(item, bf.m, bf.k, bf.seed);
  for(var i=0;i<hs.length;i++) if(!bf.bits[hs[i]]) return false;
  return true;
}
function bloomFalsePositiveRate(k, m, n){
  var x=Math.exp(-k*n/m);
  return Math.pow(1-x, k);
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { bloomCreate:bloomCreate, bloomAdd:bloomAdd, bloomHas:bloomHas,
    bloomFalsePositiveRate:bloomFalsePositiveRate, fnv1a:fnv1a };
}
if (typeof window !== 'undefined') {
  window.BloomForgePure = { bloomCreate:bloomCreate, bloomAdd:bloomAdd, bloomHas:bloomHas,
    bloomFalsePositiveRate:bloomFalsePositiveRate };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.BloomForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var m=Number($('m').value), k=Number($('k').value);
        var bf=P.bloomCreate(m,k,0x9e3779b9);
        var items=$('items').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
        items.forEach(function(it){ P.bloomAdd(bf,it); });
        var has=P.bloomHas(bf,$('q').value.trim());
        var fp=P.bloomFalsePositiveRate(k,m,items.length);
        $('out').textContent='已加入 '+items.length+' 个元素\n查询「'+$('q').value+'」: '+(has?'\u53ef\u80fd\u5b58\u5728':'\u80af\u5b9a\u4e0d\u5b58\u5728')+'\n\u4f30\u8ba1\u8bef\u5224\u7387: '+(fp*100).toFixed(3)+'%';
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('out').textContent='\u586b\u5165\u5143\u7d20\u540e\u8fd0\u884c'; });
  })();
}
</script>
