<html lang="zh-CN">
<head>

<meta property="og:title" content="PromptDiffForge">
<meta property="og:description" content="提示词版本差异对比与成本影响测算，离线可用">

<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
</head>
<body>
<div class="app">
  <h1>PromptDiffForge</h1>
  <p class="sub">Prompt 版本管理：LCS 行级差异与词级高亮、token 估算与增减率、六款模型调用成本影响测算、变量占位符对比与 prompt lint · 单文件 · 零依赖 · 本地优先</p>

<div class="grid2">
  <section class="panel">
    <h2>版本 A（旧）</h2>
    <textarea id="old" rows="10">你是一个助手。

请帮助用户回答问题。
用户问题：{{question}}

请用中文回答，尽量详细。</textarea>
  </section>
  <section class="panel">
    <h2>版本 B（新）</h2>
    <textarea id="new" rows="10">你是一位严谨的技术助手。

## 任务
基于给定上下文回答用户问题。

## 上下文
{{context}}

## 问题
{{question}}

## 要求
- 用中文回答
- 不确定时明确说明
- 引用上下文中的原文</textarea>
  </section>
</div>
<section class="panel" style="margin-top:14px">
  <div class="row">
    <label>模型 <select id="model">
      <option value="gpt-4o-mini">gpt-4o-mini</option>
      <option value="gpt-4o">gpt-4o</option>
      <option value="claude-sonnet">claude-sonnet</option>
      <option value="claude-haiku">claude-haiku</option>
      <option value="deepseek-chat">deepseek-chat</option>
      <option value="qwen-plus">qwen-plus</option>
    </select></label>
    <label>日调用 <input id="calls" type="number" value="1000" min="1" style="width:100px" aria-label="calls"></label>
    <label>输出 token <input id="outtok" type="number" value="300" min="0" style="width:90px" aria-label="outtok"></label>
    <button id="run" class="primary">对比</button>
  </div>
  <div id="summary" style="margin-top:12px"></div>
</section>
<section class="panel" style="margin-top:14px">
  <h2>逐行差异</h2>
  <div id="diff" style="font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.6"></div>
</section>
<section class="panel" style="margin-top:14px">
  <h2>提示词体检</h2>
  <div id="lint"></div>
</section>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>

var PD_MODELS = {
  'gpt-4o':          { input: 2.50,  output: 10.00 },
  'gpt-4o-mini':     { input: 0.15,  output: 0.60  },
  'claude-sonnet':   { input: 3.00,  output: 15.00 },
  'claude-haiku':    { input: 0.80,  output: 4.00  },
  'deepseek-chat':   { input: 0.14,  output: 0.28  },
  'qwen-plus':       { input: 0.11,  output: 0.28  }
};

function estimateTokens(text){
  var s = String(text == null ? '' : text);
  if (!s) return 0;
  var cjk = 0, other = '';
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i);
    if ((c >= 0x4e00 && c <= 0x9fff) || (c >= 0x3040 && c <= 0x30ff) || (c >= 0xac00 && c <= 0xd7af)) cjk++;
    else other += s.charAt(i);
  }
  return Math.ceil(cjk * 1.6 + other.length / 4);
}

function splitLines(text){
  var s = String(text == null ? '' : text);
  if (s === '') return [];
  return s.replace(/\r\n/g, '\n').split('\n');
}

function lcsMatrix(a, b){
  var m = a.length, n = b.length, i, j;
  var d = [];
  for (i = 0; i <= m; i++){ d.push(new Array(n + 1)); d[i][0] = 0; }
  for (j = 0; j <= n; j++) d[0][j] = 0;
  for (i = 1; i <= m; i++)
    for (j = 1; j <= n; j++)
      d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] + 1 : (d[i - 1][j] > d[i][j - 1] ? d[i - 1][j] : d[i][j - 1]);
  return d;
}

function diffLines(oldText, newText){
  var a = splitLines(oldText), b = splitLines(newText);
  var d = lcsMatrix(a, b), out = [], i = a.length, j = b.length;
  while (i > 0 || j > 0){
    if (i > 0 && j > 0 && a[i - 1] === b[j - 1]){ out.push({ type: 'same', text: a[i - 1], oldNo: i, newNo: j }); i--; j--; }
    else if (j > 0 && (i === 0 || d[i][j - 1] >= d[i - 1][j])){ out.push({ type: 'add', text: b[j - 1], oldNo: null, newNo: j }); j--; }
    else { out.push({ type: 'del', text: a[i - 1], oldNo: i, newNo: null }); i--; }
  }
  out.reverse();
  return out;
}

function diffStats(rows){
  var s = { added: 0, removed: 0, same: 0 };
  for (var i = 0; i < rows.length; i++){
    if (rows[i].type === 'add') s.added++;
    else if (rows[i].type === 'del') s.removed++;
    else s.same++;
  }
  s.total = rows.length;
  s.changeRatio = rows.length ? Math.round((s.added + s.removed) / rows.length * 10000) / 10000 : 0;
  return s;
}

function wordDiff(oldLine, newLine){
  var a = String(oldLine || '').split(/(\s+)/).filter(function(x){ return x !== ''; });
  var b = String(newLine || '').split(/(\s+)/).filter(function(x){ return x !== ''; });
  var d = lcsMatrix(a, b), out = [], i = a.length, j = b.length;
  while (i > 0 || j > 0){
    if (i > 0 && j > 0 && a[i - 1] === b[j - 1]){ out.push({ type: 'same', text: a[i - 1] }); i--; j--; }
    else if (j > 0 && (i === 0 || d[i][j - 1] >= d[i - 1][j])){ out.push({ type: 'add', text: b[j - 1] }); j--; }
    else { out.push({ type: 'del', text: a[i - 1] }); i--; }
  }
  out.reverse();
  return out;
}

function tokenDelta(oldText, newText){
  var a = estimateTokens(oldText), b = estimateTokens(newText);
  return { before: a, after: b, delta: b - a,
           pct: a ? Math.round((b - a) / a * 10000) / 100 : (b ? 100 : 0) };
}

function costImpact(oldText, newText, model, callsPerDay, outputTokens){
  var m = PD_MODELS[model];
  if (!m) return { error: 'unknown model: ' + model };
  callsPerDay = callsPerDay == null ? 1000 : callsPerDay;
  outputTokens = outputTokens == null ? 300 : outputTokens;
  var t = tokenDelta(oldText, newText);
  function daily(inTok){
    return (inTok * m.input + outputTokens * m.output) / 1e6 * callsPerDay;
  }
  var before = daily(t.before), after = daily(t.after);
  return {
    error: null, model: model, tokens: t,
    dailyBefore: round4(before), dailyAfter: round4(after),
    dailyDelta: round4(after - before),
    monthlyDelta: round4((after - before) * 30),
    yearlyDelta: round4((after - before) * 365),
    monthlyDeltaCNY: round4((after - before) * 30 * 7.2)
  };
}

function round4(x){ return Math.round(x * 10000) / 10000; }

function extractVars(text){
  var s = String(text || ''), out = [], seen = {};
  var pats = [/\{\{\s*([\w.\-]+)\s*\}\}/g, /\{\s*([\w.\-]+)\s*\}/g, /\$\{\s*([\w.\-]+)\s*\}/g];
  for (var p = 0; p < pats.length; p++){
    var m;
    while ((m = pats[p].exec(s)) !== null){
      var k = m[1];
      if (!seen[k]){ seen[k] = 1; out.push(k); }
    }
  }
  return out;
}

function varDiff(oldText, newText){
  var a = extractVars(oldText), b = extractVars(newText);
  var sa = {}, sb = {}, i;
  for (i = 0; i < a.length; i++) sa[a[i]] = 1;
  for (i = 0; i < b.length; i++) sb[b[i]] = 1;
  var added = b.filter(function(x){ return !sa[x]; });
  var removed = a.filter(function(x){ return !sb[x]; });
  var kept = b.filter(function(x){ return sa[x]; });
  return { added: added, removed: removed, kept: kept,
           breaking: removed.length > 0 || added.length > 0 };
}

function lintPrompt(text){
  var s = String(text || ''), issues = [];
  var tk = estimateTokens(s);
  if (tk > 4000) issues.push({ level: 'warn', msg: '提示词超过 4000 token，考虑拆分或做检索' });
  if (!s.trim()) issues.push({ level: 'error', msg: '提示词为空' });
  if (/\bplease\b/i.test(s) && (s.match(/\bplease\b/gi) || []).length > 3)
    issues.push({ level: 'info', msg: '"please" 出现多次，礼貌用语不会提升效果，只增加 token' });
  if (/(?:sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16})/.test(s))
    issues.push({ level: 'error', msg: '疑似硬编码密钥，务必移除' });
  if (s.length > 200 && !/\n/.test(s))
    issues.push({ level: 'info', msg: '长提示词无换行，建议分段以提升可读性与稳定性' });
  var open = (s.match(/\{\{/g) || []).length, close = (s.match(/\}\}/g) || []).length;
  if (open !== close) issues.push({ level: 'error', msg: '模板占位符 {{ }} 不配对（' + open + ' vs ' + close + '）' });
  if (!/(?:^|\n)\s*(?:#|##|\d+\.|-\s)/.test(s) && tk > 300)
    issues.push({ level: 'info', msg: '较长提示词缺少结构化标记（标题/列表），模型解析更易漂移' });
  return { tokens: tk, chars: s.length, issues: issues,
           errors: issues.filter(function(x){ return x.level === 'error'; }).length,
           warnings: issues.filter(function(x){ return x.level === 'warn'; }).length };
}

function compare(oldText, newText, model, calls, outTok){
  var rows = diffLines(oldText, newText);
  return {
    rows: rows, stats: diffStats(rows),
    tokens: tokenDelta(oldText, newText),
    cost: costImpact(oldText, newText, model || 'gpt-4o-mini', calls, outTok),
    vars: varDiff(oldText, newText),
    lintOld: lintPrompt(oldText), lintNew: lintPrompt(newText)
  };
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { PD_MODELS:PD_MODELS, estimateTokens:estimateTokens, splitLines:splitLines, lcsMatrix:lcsMatrix, diffLines:diffLines, diffStats:diffStats, wordDiff:wordDiff, tokenDelta:tokenDelta, costImpact:costImpact, round4:round4, extractVars:extractVars, varDiff:varDiff, lintPrompt:lintPrompt, compare:compare }; }
if (typeof window !== 'undefined') { window.PromptDiffForgePure = { PD_MODELS:PD_MODELS, estimateTokens:estimateTokens, splitLines:splitLines, lcsMatrix:lcsMatrix, diffLines:diffLines, diffStats:diffStats, wordDiff:wordDiff, tokenDelta:tokenDelta, costImpact:costImpact, round4:round4, extractVars:extractVars, varDiff:varDiff, lintPrompt:lintPrompt, compare:compare }; }

</script>
<script>

(function(){
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function stat(label, val, color){
    return '<div style="flex:1;min-width:110px;padding:10px;background:var(--surface);border-radius:8px">'
      + '<div style="font-size:12px;color:var(--muted)">' + esc(label) + '</div>'
      + '<div style="font-size:19px;font-weight:700;color:' + (color || 'var(--fg)') + '">' + esc(val) + '</div></div>';
  }
  function run(){
    var r = compare($('old').value, $('new').value, $('model').value, +$('calls').value, +$('outtok').value);
    var t = r.tokens, c = r.cost;
    var dc = t.delta > 0 ? 'var(--warn)' : (t.delta < 0 ? 'var(--ok)' : 'var(--fg)');
    var h = '<div style="display:flex;gap:10px;flex-wrap:wrap">';
    h += stat('token 变化', (t.delta >= 0 ? '+' : '') + t.delta, dc);
    h += stat('变化率', (t.pct >= 0 ? '+' : '') + t.pct + '%', dc);
    h += stat('新增行', '+' + r.stats.added, 'var(--ok)');
    h += stat('删除行', '-' + r.stats.removed, 'var(--bad)');
    if (!c.error){
      h += stat('月成本变化', (c.monthlyDelta >= 0 ? '+$' : '-$') + Math.abs(c.monthlyDelta).toFixed(2), dc);
      h += stat('折合人民币/月', (c.monthlyDeltaCNY >= 0 ? '+¥' : '-¥') + Math.abs(c.monthlyDeltaCNY).toFixed(2), dc);
    }
    h += '</div>';
    var v = r.vars;
    h += '<div class="note" style="margin-top:10px">变量：';
    h += v.added.length ? '<span style="color:var(--ok)">新增 ' + esc(v.added.join(', ')) + '</span> ' : '';
    h += v.removed.length ? '<span style="color:var(--bad)">移除 ' + esc(v.removed.join(', ')) + '</span> ' : '';
    h += v.kept.length ? '保留 ' + esc(v.kept.join(', ')) : '';
    if (!v.added.length && !v.removed.length && !v.kept.length) h += '无';
    if (v.breaking) h += ' <span style="color:var(--warn)">· 调用方需同步改动</span>';
    h += '</div>';
    $('summary').innerHTML = h;

    var dh = '';
    for (var i = 0; i < r.rows.length; i++){
      var row = r.rows[i], bg = '', mark = '  ';
      if (row.type === 'add'){ bg = 'background:rgba(16,185,129,.12)'; mark = '+ '; }
      else if (row.type === 'del'){ bg = 'background:rgba(239,68,68,.12)'; mark = '- '; }
      dh += '<div style="' + bg + ';padding:1px 6px;white-space:pre-wrap">'
        + '<span style="color:var(--dim);display:inline-block;width:60px">'
        + (row.oldNo || '') + '/' + (row.newNo || '') + '</span>'
        + esc(mark + row.text) + '</div>';
    }
    $('diff').innerHTML = dh || '<span class="note">两版内容相同</span>';

    function lintBlock(title, l){
      var s = '<div style="margin-bottom:10px"><b>' + title + '</b> · ' + l.tokens + ' token / ' + l.chars + ' 字符';
      if (!l.issues.length) s += ' <span style="color:var(--ok)">✓ 无问题</span>';
      s += '</div>';
      for (var i = 0; i < l.issues.length; i++){
        var it = l.issues[i];
        var col = it.level === 'error' ? 'var(--bad)' : (it.level === 'warn' ? 'var(--warn)' : 'var(--muted)');
        s += '<div style="color:' + col + ';font-size:13px">• ' + esc(it.msg) + '</div>';
      }
      return s;
    }
    $('lint').innerHTML = '<div class="grid2"><div>' + lintBlock('版本 A', r.lintOld)
      + '</div><div>' + lintBlock('版本 B', r.lintNew) + '</div></div>';
  }
  $('run').addEventListener('click', run);
  ['old','new'].forEach(function(id){ $(id).addEventListener('input', run); });
  ['model','calls','outtok'].forEach(function(id){ $(id).addEventListener('input', run); });
  run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
