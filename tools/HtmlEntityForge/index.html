<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>HtmlEntityForge — HTML 实体编解码：命名/十进制/十六进制，XSS 安全转义</title>
<meta property="og:title" content="HtmlEntityForge">
<meta property="og:description" content="HTML 实体编解码：命名/十进制/十六进制，XSS 安全转义">
<meta property="og:image" content="./og.png">
<meta name="description" content="HTML 实体编解码：命名/十进制/十六进制，XSS 安全转义 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:140px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="app">
  <h1>HtmlEntityForge</h1>
  <p class="sub">HTML 实体编解码：命名/十进制/十六进制，XSS 安全转义 · 单文件 · 零依赖 · 本地优先</p>

<label for="hin">输入文本</label>
<textarea id="hin" rows="4">Tom &amp; Jerry &lt; "cat" &gt;</textarea>
<div class="opt">
  <label>编码模式
    <select id="hmode">
      <option value="named">命名实体 (&amp;lt;)</option>
      <option value="decimal">十进制 &#60;</option>
      <option value="hex">十六进制 &#x3c;</option>
    </select>
  </label>
</div>
<div class="row">
  <button id="enc">编码</button>
  <button id="dec">解码</button>
  <button id="copy" class="ghost">复制</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">选择编码或解码</div>
<script>
var HE_NAMED = {
  '\u0026':'amp', '\u003c':'lt', '\u003e':'gt', '\u0022':'quot', '\u0027':'apos',
  '\u00a0':'nbsp', '\u00a1':'iexcl', '\u00a2':'cent', '\u00a3':'pound', '\u00a5':'yen', '\u20ac':'euro',
  '\u00a7':'sect', '\u00a9':'copy', '\u00ae':'reg', '\u00b0':'deg', '\u00b1':'plusmn', '\u00b2':'sup2',
  '\u00b3':'sup3', '\u00d7':'times', '\u00f7':'divide', '\u2026':'hellip', '\u2018':'lsquo', '\u2019':'rsquo',
  '\u201c':'ldquo', '\u201d':'rdquo', '\u2013':'ndash', '\u2014':'mdash', '\u2122':'trade'
};
var HE_DECODE = {
  'amp':'\u0026','lt':'\u003c','gt':'\u003e','quot':'\u0022','apos':'\u0027',
  'nbsp':'\u00a0','iexcl':'\u00a1','cent':'\u00a2','pound':'\u00a3','yen':'\u00a5','euro':'\u20ac',
  'sect':'\u00a7','copy':'\u00a9','reg':'\u00ae','deg':'\u00b0','plusmn':'\u00b1','sup2':'\u00b2',
  'sup3':'\u00b3','times':'\u00d7','divide':'\u00f7','hellip':'\u2026','lsquo':'\u2018','rsquo':'\u2019',
  'ldquo':'\u201c','rdquo':'\u201d','ndash':'\u2013','mdash':'\u2014','trade':'\u2122'
};
function heEncode(str, opts){
  opts=opts||{};
  var mode=opts.mode||'named';
  if(typeof str!=='string') return {error:'Input must be string'};
  var out='';
  for(var i=0;i<str.length;i++){
    var ch=str.charAt(i);
    var code=str.charCodeAt(i);
    if(HE_NAMED[ch]!==undefined){
      if(mode==='decimal'){ out+='&#'+code+';'; continue; }
      if(mode==='hex'){ out+='&#x'+code.toString(16)+';'; continue; }
      out+='&'+HE_NAMED[ch]+';';
      continue;
    }
    if(code>127){
      if(mode==='decimal') out+='&#'+code+';';
      else if(mode==='hex') out+='&#x'+code.toString(16)+';';
      else out+='&#'+code+';';
    } else {
      out+=ch;
    }
  }
  return {value:out, error:null};
}
function heDecode(str){
  if(typeof str!=='string') return {error:'Input must be string'};
  var re=/&(#[xX][0-9a-fA-F]+;|#[0-9]+;|[a-zA-Z][a-zA-Z0-9]*;)/g;
  var out=str.replace(re, function(m){
    if(m.charAt(1)==='#'){
      var num = (m.charAt(2)==='x'||m.charAt(2)==='X') ? parseInt(m.slice(3,-1),16) : parseInt(m.slice(2,-1),10);
      if(isNaN(num)) return m;
      return String.fromCharCode(num);
    }
    var name=m.slice(1,-1);
    var ch=HE_DECODE[name];
    return ch!==undefined?ch:m;
  });
  return {value:out, error:null};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { encode:heEncode, decode:heDecode };
}
if (typeof window !== 'undefined') {
  window.HtmlEntityForgePure = { encode:heEncode, decode:heDecode };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.HtmlEntityForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    $('enc').addEventListener('click', function(){
      var r=P.encode($('hin').value, {mode:$('hmode').value});
      $('out').textContent=r.value;
    });
    $('dec').addEventListener('click', function(){
      var r=P.decode($('hin').value);
      $('out').textContent=r.value;
    });
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('hin').value=''; $('out').textContent='\u9009\u62e9\u7f16\u7801\u6216\u89e3\u7801'; });
  })();
}
</script>
