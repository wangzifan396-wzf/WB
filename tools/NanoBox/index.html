          while(ops.length && ops[ops.length-1].v!=='('){ out.push(ops.pop()); }
          if(!ops.length) throw new Error('mismatched parentheses');
          ops.pop();
          if(ops.length && ops[ops.length-1].func){ out.push(ops.pop()); }
        } else {
          var opv=v;
          var unary = (prev===null) || (prev.t==='op' && prev.v!==')');
          if(v==='-' && unary){ opv='u-'; }
          else if(v==='+' && unary){ prev=tk; continue; }
          var opvP = (opv==='u-')?PREC['u-']:PREC[opv];
          while(ops.length && ops[ops.length-1].v!=='('){
            var top=ops[ops.length-1];
            var tp = top.func?PREC['f']:PREC[top.v];
            if(tp > opvP || (tp===opvP && !RIGHT[opv])){ out.push(ops.pop()); }
            else break;
          }
          ops.push({t:'op', v:opv});
        }
      }
      prev=tk;
    }
    while(ops.length){ var o=ops.pop(); if(o.v==='(') throw new Error('mismatched parentheses'); out.push(o); }
    return out;
  }
  function evalRPN(rpn){
    var st=[];
    for(var i=0;i<rpn.length;i++){
      var tk=rpn[i];
      if(tk.t==='num'){ st.push(tk.v); }
      else if(tk.func){
        if(!st.length) throw new Error('bad expression');
        var a=st.pop(); st.push(FUNCS[tk.v](a));
      }       else if(tk.v==='u-'){
        if(!st.length) throw new Error('bad expression');
        st.push(-st.pop());
      }
      else {
        if(st.length<2) throw new Error('bad expression');
        var b=st.pop(), a2=st.pop(), r;
        switch(tk.v){
          case '+': r=a2+b; break;
          case '-': r=a2-b; break;
          case '*': r=a2*b; break;
          case '/': if(b===0) throw new Error('division by zero'); r=a2/b; break;
          case '%': if(b===0) throw new Error('modulo by zero'); r=a2%b; break;
          case '^': r=Math.pow(a2,b); break;
          default: throw new Error('bad op '+tk.v);
        }
        st.push(r);
      }
    }
    if(st.length!==1) throw new Error('bad expression');
    return st[0];
  }
  function evalExpr(s){ return evalRPN(toRPN(tokenize(s))); }
  function fmtNum(r){
    if(typeof r!=='number' || isNaN(r)) return '—';
    if(!isFinite(r)) return r>0?'∞':'-∞';
    if(Number.isInteger(r)) return String(r);
    return parseFloat(r.toPrecision(12)).toString();
  }
  function isMathExpr(s){
    s=(s||'').trim();
    if(!s) return false;
    if(!/^[\d\s+\-*/%^().a-zA-Z_]+$/.test(s)) return false;
    if(!/[\d.]/.test(s)) return false;
    try{ var r=evalExpr(s); return typeof r==='number' && isFinite(r); }catch(e){ return false; }
  }
  function buildDemoUrl(id){ return 'https://wangzifan396-wzf.github.io/'+id+'/'; }
  function recentAdd(state, id, max){
    max = max||6;
    var rec = (state.recent||[]).filter(function(x){ return x!==id; });
    rec.unshift(id);
    if(rec.length>max) rec = rec.slice(0,max);
    state.recent = rec; return state;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function defaultState(){ return {recent:[]}; }
  function loadState(){
    try{
      var raw=localStorage.getItem('nanobox.state.v1');
      if(raw){ var o=JSON.parse(raw); if(o && Array.isArray(o.recent)) return {recent:o.recent}; }
    }catch(e){}
    return defaultState();
  }
  function saveState(st){ try{ localStorage.setItem('nanobox.state.v1', JSON.stringify(st)); }catch(e){} }

  if(typeof module!=='undefined' && module.exports){
    module.exports = {
      TOOLS, CAT_COLORS, normalize, fuzzyScore, filterTools, tokenize, toRPN, evalRPN,
      evalExpr, fmtNum, isMathExpr, buildDemoUrl, recentAdd, escapeHtml, defaultState, loadState, saveState
    };
  }
  if(typeof window==='undefined' || !window.document) return;

  // ---------------- UI ----------------
  function $(s){ return document.querySelector(s); }
  function curLang(){ return (document.documentElement.getAttribute('data-lang')||'zh')==='en'; }
  function tr(s){ return curLang() ? ((window.NANO_I18N_EXTRA||{})[s]||s) : s; }
  var qEl=$('#q'), resultsEl=$('#results'), frameEl=$('#frame'),
      stageTitleEl=$('#stageTitle'), stageLinkEl=$('#stageLink');
  var state = defaultState();
  var sel = 0, curItems = [];

  function computeItems(q){
    if(!q){
      var rec = state.recent.map(function(id){ return TOOLS.filter(function(t){return t.id===id;})[0]; }).filter(Boolean);
      return rec.map(function(t){ return {type:'tool', tool:t}; });
    }
    var items=[];
    if(isMathExpr(q)){
      try{ var r=evalExpr(q); if(isFinite(r)) items.push({type:'calc', expr:q, result:r}); }catch(e){}
    }
    var matches = filterTools(TOOLS, q, 8).map(function(m){ return {type:'tool', tool:m.tool}; });
    return items.concat(matches);
  }
  function render(){
    var q = (qEl.value||'').trim();
    var items = computeItems(q);
    if(items.length===0){
      resultsEl.innerHTML = '<div class="empty">'+(q ? tr('没有匹配的工具。') : tr('输入表达式可直接计算，例如 2+2*3'))+'</div>';
      curItems = items; sel = 0; return;
    }
    sel = Math.max(0, Math.min(sel, items.length-1));
    resultsEl.innerHTML = items.map(function(it,i){
      if(it.type==='calc'){
        return '<div class="row calc'+(i===sel?' sel':'')+'" data-i="'+i+'">'+
          '<span class="calc-eq">'+escapeHtml(it.expr)+' =</span>'+
          '<span class="calc-val">'+fmtNum(it.result)+'</span>'+
          '<span class="copy" data-act="copy">'+tr('复制')+'</span></div>';
      }
      var t=it.tool, col=CAT_COLORS[t.cat]||'#5E6AD2';
      return '<div class="row'+(i===sel?' sel':'')+'" data-i="'+i+'">'+
        '<span class="dot" style="background:'+col+'"></span>'+
        '<span class="nm">'+escapeHtml(t.name)+'</span>'+
        '<span class="ds">'+escapeHtml(t.desc)+'</span></div>';
    }).join('');
    curItems = items;
  }
  function copyText(s){
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(s); return; } }catch(e){}
    try{ var ta=document.createElement('textarea'); ta.value=s; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }catch(e){}
  }
  function openTool(t){
    frameEl.src = buildDemoUrl(t.id);
    stageTitleEl.textContent = t.name;
    stageLinkEl.href = buildDemoUrl(t.id);
    state = recentAdd(state, t.id);
    saveState(state);
  }
  function activate(it){
    if(!it) return;
    if(it.type==='calc'){ copyText(fmtNum(it.result)); return; }
    openTool(it.tool);
  }
  qEl.addEventListener('input', function(){ sel=[]; sel=0; render(); });
  qEl.addEventListener('keydown', function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1, curItems.length-1); render(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); render(); }
    else if(e.key==='Enter'){ e.preventDefault(); activate(curItems[sel]); }
    else if(e.key==='Escape'){ if(qEl.value){ qEl.value=''; sel=0; render(); } else { qEl.blur(); } }
  });
  resultsEl.addEventListener('click', function(e){
    var row=e.target.closest('.row'); if(!row) return;
    var i=parseInt(row.getAttribute('data-i'),10); activate(curItems[i]);
  });
  document.addEventListener('keydown', function(e){
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); qEl.focus(); qEl.select(); }
  });
  function init(){
    state = loadState();
    frameEl.src = buildDemoUrl('WB');
    stageLinkEl.href = buildDemoUrl('WB');
    render();
    try{
      var obs=new MutationObserver(function(){ render(); });
      obs.observe(document.documentElement, {attributes:true, attributeFilter:['data-lang']});
    }catch(e){}
  }
  if(document.readyState!=='loading') init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>
<script>window.NANO_I18N_EXTRA={
"NanoBox — 单文件工具中枢":"NanoBox — single-file tool hub",
"一个文件，装下全部 nano-tools":"One file. Every nano-tool.",
"328 款工具 · 1 个文件":"31 tools · 1 file",
"回车打开 · ↑↓ 选择 · Esc 清空":"Enter to open · ↑↓ to select · Esc to clear",
"预览":"Preview","新标签打开":"Open in new tab",
"本地优先 · 单文件 · 零依赖":"Local-first · single-file · zero-dependency",
"访问 nano-tools 门户":"Visit the nano-tools portal →",
"没有匹配的工具。":"No matching tool.",
"输入表达式可直接计算，例如 2+2*3":"Type an expression to calculate, e.g. 2+2*3",
"复制":"Copy","已复制":"Copied","NanoBox":"NanoBox"
};</script>
<script>
/* NANO_I18N_RUNTIME */
(function(){
  var COMMON = {
    "复制":"Copy","清空":"Clear","搜索":"Search","结果":"Result","预览":"Preview",
    "设置":"Settings","主题":"Theme","语言":"Language","导出":"Export","导入":"Import",
    "保存":"Save","删除":"Delete","添加":"Add","重置":"Reset","关闭":"Close","输入":"Input",
    "输出":"Output","历史":"History","帮助":"Help","更多":"More","示例":"Example",
    "全选":"Select all","展开":"Expand","折叠":"Collapse","开始":"Start","随机":"Random",
    "全部":"All","中文":"中文","English":"English","浅色":"Light","深色":"Dark",
    "复制成功":"Copied","已复制":"Copied","加载中":"Loading…","暂无数据":"No data",
    "请输入":"Please enter","或":"or","字数":"Words","字符":"Characters",
    "复制链接":"Copy link","复制代码":"Copy code","复制结果":"Copy result",
    "新建":"New","编辑":"Edit","筛选":"Filter","排序":"Sort","刷新":"Refresh",
    "应用":"Apply","成功":"Success","失败":"Failed","完成":"Done","下一步":"Next",
    "当前":"Current","总计":"Total","打开文件":"Open file","保存文件":"Save file"
  };
  function full(){ return Object.assign({}, COMMON, (window.NANO_I18N_EXTRA||{})); }
  function skip(node){
    var p=node.parentElement;
    while(p){
      var t=p.tagName;
      if(t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA'||t==='INPUT'||t==='NOSCRIPT'||t==='TEMPLATE') return true;
      p=p.parentElement;
    }
    return false;
  }
  var current='zh';
  function applyLang(lang){
    var d=full();
    var root=document.documentElement;
    current=lang;
    var rawTitle=document.title;
    if(lang==='en'){ if(d[rawTitle]) document.title=d[rawTitle]; }
    else{
      var ex=window.NANO_I18N_EXTRA||{};
      for(var _k in ex){ if(ex[_k]===rawTitle){ document.title=_k; break; } }
    }
    if(lang==='en'){
      var w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode:function(n){
          if(!n.nodeValue||!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          if(skip(n)) return NodeFilter.FILTER_REJECT;
          return (d[n.nodeValue.trim()] && n.__zh===undefined) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
      });
      var n;
      while(n=w.nextNode()){ n.__zh=n.nodeValue; n.nodeValue=d[n.nodeValue.trim()]; }
    } else {
      var w2=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode:function(n){ return (n.__zh!==undefined) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
      });
      var m;
      while(m=w2.nextNode()){ m.nodeValue=m.__zh; m.__zh=undefined; }
    }
    root.setAttribute('lang', lang==='en'?'en':'zh-CN');
    root.setAttribute('data-lang', lang);
    try{ localStorage.setItem('nano-lang', lang); }catch(e){}
  }
  function toggle(){
    applyLang(current==='en'?'zh':'en');
    var b=document.getElementById('nano-lang-btn');
    if(b) b.textContent=(current==='en'?'中':'EN');
  }
  function mountBtn(){
    if(document.getElementById('nano-bar')) return;
    var bar=document.createElement('div');
    bar.id='nano-bar';
    bar.setAttribute('style','position:fixed;right:14px;bottom:14px;z-index:99999;display:flex;align-items:center;gap:8px;font:600 13px system-ui,-apple-system,sans-serif');
    var brand=document.createElement('a');
    brand.id='nano-brand';
    brand.href='https://wangzifan396-wzf.github.io/WB/';
    brand.target='_blank'; brand.rel='noopener'; brand.textContent='nano·tools';
    brand.title='nano-tools · 全部工具';
    brand.setAttribute('style','text-decoration:none;padding:0 13px;height:42px;border-radius:11px;border:1px solid var(--border,#222);background:var(--surface,#16181b);color:var(--text,#e6e6e6);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .12s ease,border-color .12s ease,color .12s ease');
    brand.onmouseenter=function(){ brand.style.transform='translateY(-2px)'; brand.style.borderColor='var(--accent,#5E6AD2)'; brand.style.color='var(--accent,#5E6AD2)'; };
    brand.onmouseleave=function(){ brand.style.transform='none'; brand.style.color='var(--text,#e6e6e6)'; };
    var b=document.createElement('button');
    b.id='nano-lang-btn'; b.title='Switch language / 切换语言';
    b.textContent='EN';
    b.setAttribute('style','width:42px;height:42px;border-radius:11px;border:1px solid var(--border,#222);background:var(--surface,#16181b);color:var(--text,#fff);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4);display:grid;place-items:center;transition:transform .12s ease,border-color .12s ease');
    b.onmouseenter=function(){ b.style.transform='translateY(-2px)'; b.style.borderColor='var(--accent,#5E6AD2)'; };
    b.onmouseleave=function(){ b.style.transform='none'; };
    b.onclick=toggle;
    bar.appendChild(brand); bar.appendChild(b);
    document.body.appendChild(bar);
  }
  function init(){
    var saved; try{ saved=localStorage.getItem('nano-lang'); }catch(e){}
    if(!saved){ saved=((navigator.language||'zh').slice(0,2).toLowerCase()==='en')?'en':'zh'; }
    applyLang(saved); mountBtn();
    var b=document.getElementById('nano-lang-btn');
    if(b) b.textContent=(saved==='en'?'中':'EN');
    [200,600,1200].forEach(function(ms){ setTimeout(function(){ applyLang(current); if(b) b.textContent=(current==='en'?'中':'EN'); }, ms); });
  }
  if(document.readyState!=='loading') init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>
