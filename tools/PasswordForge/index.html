<meta name="description" content="安全口令生成器：可配字符集、避开易混字符、实时熵估计 · 单文件 · 零依赖 · 本地优先">

<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:140px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
svg.out{background:var(--bg)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
.flag-ok{color:var(--ok)} .flag-bad{color:var(--warn)} .flag-info{color:var(--info)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <h1>PasswordForge</h1>
  <p class="sub">安全口令生成器：可配字符集、避开易混字符、实时熵估计 · 单文件 · 零依赖 · 本地优先</p>

<label for="plen">长度</label>
<input id="plen" type="number" value="16" min="4" max="64">
<div class="opt">
  <label><input type="checkbox" id="oLower" checked> 小写</label>
  <label><input type="checkbox" id="oUpper" checked> 大写</label>
  <label><input type="checkbox" id="oDigit" checked> 数字</label>
  <label><input type="checkbox" id="oSymbol"> 符号</label>
  <label><input type="checkbox" id="oAvoid" checked> 避开易混字符</label>
  <label><input type="checkbox" id="oReq" checked> 每类至少 1 个</label>
</div>
<label for="pcount">生成数量</label>
<input id="pcount" type="number" value="5" min="1" max="20">
<div class="row">
  <button id="gen">生成口令</button>
  <button id="copy" class="ghost">复制全部</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出（含熵估计）</label>
<div class="out" id="out" aria-live="polite">点击「生成口令」</div>
<script>
function pfMulberry32(seed){
  var a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pfBuildPool(opts){
  var lower='abcdefghijklmnopqrstuvwxyz';
  var upper='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var digit='0123456789';
  var sym='!@#$%^&*()-_=+[]{};:,.<>?';
  var pool='';
  if(opts.lower!==false) pool+=lower;
  if(opts.upper!==false) pool+=upper;
  if(opts.digit!==false) pool+=digit;
  if(opts.symbol) pool+=sym;
  if(opts.avoidAmbiguous) pool=pool.replace(/[Il1O0o]/g,'');
  if(pool==='') pool=lower+upper+digit;
  return pool;
}
function pfClasses(opts){
  var classes=[];
  if(opts.lower!==false) classes.push('abcdefghijklmnopqrstuvwxyz');
  if(opts.upper!==false) classes.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
  if(opts.digit!==false) classes.push('0123456789');
  if(opts.symbol) classes.push('!@#$%^&*()-_=+[]{};:,.<>?');
  if(opts.avoidAmbiguous) classes=classes.map(function(c){return c.replace(/[Il1O0o]/g,'');});
  return classes;
}
function pfGenerate(opts){
  opts=opts||{};
  var length=opts.length||16;
  var rng=(typeof opts.rng==='function')?opts.rng:Math.random;
  var pool=pfBuildPool(opts);
  var poolArr=pool.split('');
  var requireAll=opts.requireAll!==false;
  var classes=pfClasses(opts);
  var out=[];
  var i;
  for(i=0;i<length;i++) out.push(poolArr[Math.floor(rng()*poolArr.length)]);
  if(requireAll && classes.length>0 && classes.length<=length){
    for(var c=0;c<classes.length;c++){
      var clsArr=classes[c].split('');
      out[c]=clsArr[Math.floor(rng()*clsArr.length)];
    }
    for(var i2=length-1;i2>0;i2--){
      var j=Math.floor(rng()*(i2+1));
      var t=out[i2]; out[i2]=out[j]; out[j]=t;
    }
  }
  var pw=out.join('');
  var entropy=length*(Math.log(pool.length)/Math.log(2));
  return {password:pw, length:length, poolSize:pool.length, entropyBits:entropy, charset:pool};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { generate:pfGenerate, buildPool:pfBuildPool, mulberry32:pfMulberry32 };
}
if (typeof window !== 'undefined') {
  window.PasswordForgePure = { generate:pfGenerate, buildPool:pfBuildPool, mulberry32:pfMulberry32 };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.PasswordForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function gen(){
      $('err').textContent='';
      try {
        var opts={
          length:Math.max(4,Math.min(64, Number($('plen').value||16))),
          lower:$('oLower').checked, upper:$('oUpper').checked, digit:$('oDigit').checked,
          symbol:$('oSymbol').checked, avoidAmbiguous:$('oAvoid').checked, requireAll:$('oReq').checked
        };
        if(!opts.lower && !opts.upper && !opts.digit && !opts.symbol){ $('err').textContent='至少选择一类字符'; return; }
        var count=Math.max(1,Math.min(20, Number($('pcount').value||5)));
        var lines=[];
        for(var i=0;i<count;i++){
          var r=P.generate(opts);
          lines.push(r.password + '   (' + r.entropyBits.toFixed(1) + ' bits)');
        }
        var pool=P.buildPool(opts);
        lines.push('');
        lines.push('\u5b57\u7b26\u96c6 ' + pool.length + ' \u4e2a \u00b7 \u586b\u6ee1\u4f4d\u71b5 ' + (opts.length*(Math.log(pool.length)/Math.log(2))).toFixed(1) + ' bits');
        $('out').textContent=lines.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    }
    $('gen').addEventListener('click', gen);
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('out').textContent='\u70b9\u51fb\u300c\u751f\u6210\u53e3\u4ee4\u300d'; });
  })();
}
</script>
