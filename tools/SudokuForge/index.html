*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}

button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}

     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}

<body>
<div class="app">
  <h1>SudokuForge</h1>
  <p class="sub">数独：随机生成保证唯一解的题目，回溯求解，实时校验冲突。 · 单文件 · 零依赖 · 本地优先</p>

<label>难度（挖空数）</label>
<input id="holes" type="number" value="48" min="20" max="60">
<div class="row">
  <button id="gen">新游戏</button>
  <button id="solve">求解</button>
  <button id="check" class="ghost">校验</button>
</div>
<div class="err" id="err"></div>
<div class="board" id="board"></div>
<div class="out" id="out" aria-live="polite"></div>
<script>
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function sdEmpty(){ var g=[]; for(var r=0;r<9;r++){ g.push([0,0,0,0,0,0,0,0,0]); } return g; }
function sdClone(g){ return g.map(function(r){ return r.slice(); }); }
function sdShuffle(a, rnd){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function sdCellOk(g,r,c,v){
  for(var i=0;i<9;i++){ if(g[r][i]===v) return false; if(g[i][c]===v) return false; }
  var br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
  for(var i=0;i<3;i++) for(var j=0;j<3;j++) if(g[br+i][bc+j]===v) return false;
  return true;
}
function sdValid(g){
  for(var r=0;r<9;r++) for(var c=0;c<9;c++){ var v=g[r][c]; if(v!==0){ g[r][c]=0; var ok=sdCellOk(g,r,c,v); g[r][c]=v; if(!ok) return false; } }
  return true;
}
function sdSolveGrid(g, rnd){
  for(var r=0;r<9;r++) for(var c=0;c<9;c++) if(g[r][c]===0){
    var nums=sdShuffle([1,2,3,4,5,6,7,8,9], rnd||Math.random);
    for(var k=0;k<9;k++){ var v=nums[k]; if(sdCellOk(g,r,c,v)){ g[r][c]=v; var res=sdSolveGrid(g,rnd); if(res) return res; g[r][c]=0; } }
    return null;
  }
  return g;
}
function sdCountSolutions(g, limit){
  for(var r=0;r<9;r++) for(var c=0;c<9;c++) if(g[r][c]===0){
    var cnt=0;
    for(var v=1;v<=9;v++){ if(sdCellOk(g,r,c,v)){ g[r][c]=v; cnt+=sdCountSolutions(g, limit); g[r][c]=0; if(cnt>=limit) return cnt; } }
    return cnt;
  }
  return 1;
}
function sdGenerate(seed, holes){
  var rnd=mulberry32(seed||1);
  var full=sdClone(sdEmpty());
  sdSolveGrid(full, rnd);
  var puzzle=sdClone(full), cells=[];
  for(var r=0;r<9;r++) for(var c=0;c<9;c++) cells.push([r,c]);
  sdShuffle(cells, rnd);
  var removed=0, target=holes||48;
  for(var i=0;i<cells.length && removed<target;i++){
    var r=cells[i][0], c=cells[i][1], bak=puzzle[r][c];
    puzzle[r][c]=0;
    if(sdCountSolutions(sdClone(puzzle),2)!==1) puzzle[r][c]=bak; else removed++;
  }
  return {puzzle:puzzle, solution:full, holes:removed};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { sdEmpty:sdEmpty, sdClone:sdClone, sdValid:sdValid, sdSolveGrid:sdSolveGrid, sdCountSolutions:sdCountSolutions, sdGenerate:sdGenerate, mulberry32:mulberry32 };
}
if (typeof window !== 'undefined') {
  window.SudokuForgePure = { sdEmpty:sdEmpty, sdClone:sdClone, sdValid:sdValid, sdSolveGrid:sdSolveGrid, sdCountSolutions:sdCountSolutions, sdGenerate:sdGenerate, mulberry32:mulberry32 };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.SudokuForgePure, cur=null;
    function draw(g, fixed){
      var html='';
      for(var r=0;r<9;r++){ html+='<div class="row9">';
        for(var c=0;c<9;c++){ var v=g[r][c]; var cls='c'+(fixed&&fixed[r][c]?' f':'');
          html+='<input class="'+cls+'" data-r="'+r+'" data-c="'+c+'" maxlength="1" inputmode="numeric" value="'+(v||'')+'">'; }
        html+='</div>'; }
      $('board').innerHTML=html;
      Array.prototype.forEach.call($('board').querySelectorAll('input'), function(inp){
        if(inp.classList.contains('f')){ inp.readOnly=true; return; }
        inp.addEventListener('input', function(){ this.value=this.value.replace(/[^1-9]/g,'').slice(0,1); });
      });
    }
    function readGrid(){
      var g=P.sdEmpty();
      Array.prototype.forEach.call($('board').querySelectorAll('input'), function(inp){
        g[+inp.dataset.r][+inp.dataset.c]= inp.value? +inp.value : 0;
      });
      return g;
    }
    $('gen').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var seed=(Date.now()^(Math.random()*1e9))>>>0;
        var res=P.sdGenerate(seed, Number($('holes').value)||48);
        cur=res; var fixed=P.sdClone(res.puzzle).map(function(r){ return r.map(function(v){ return v?1:0; }); });
        draw(res.puzzle, fixed); $('out').textContent='已生成（挖空 '+res.holes+'，唯一解）';
      } catch(e){ $('err').textContent=e.message; }
    });
    $('solve').addEventListener('click', function(){
      var g=readGrid();
      var sol=P.sdClone(g);
      if(!P.sdSolveGrid(sol)){ $('out').textContent='当前盘面无解'; return; }
      var fixed=P.sdClone(g).map(function(r){ return r.map(function(v){ return v?1:0; }); });
      draw(sol, fixed); $('out').textContent='已求解';
    });
    $('check').addEventListener('click', function(){
      var g=readGrid();
      $('out').textContent = P.sdValid(g) ? '当前盘面无冲突 ✓' : '存在冲突 ✗';
    });
    $('gen').click();
  })();
}
</script>
