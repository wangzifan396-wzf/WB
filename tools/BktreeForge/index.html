<body>
<div class="app">
  <h1>BktreeForge</h1>
  <p class="sub">BK 树容错查找：编辑距离三角不等式剪枝，拼写纠错索引 · 单文件 · 零依赖 · 本地优先</p>

<label>词典（每行一个词）</label>
<textarea id="dict" rows="5">book
books
boo
cake
cape
cart
hello
help</textarea>
<div class="grid2">
  <label>查询词</label><input id="q" type="text" value="bok">
  <label>最大编辑距离</label><input id="maxd" type="number" value="1" min="0" max="10">
</div>
<div class="row">
  <button id="build">建树</button>
  <button id="search">容错查找</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">建树后查找</div>
<script>
function bkLevenshtein(a, b){
  a=String(a); b=String(b);
  var m=a.length, n=b.length;
  if(m===0) return n;
  if(n===0) return m;
  var prev=new Array(n+1), cur=new Array(n+1), i, j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;
    for(j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    var t=prev; prev=cur; cur=t;
  }
  return prev[n];
}
function bkCreate(){
  return { root:null, size:0 };
}
function bkAdd(tree, word){
  var w=String(word);
  if(!w) return tree;
  if(!tree.root){ tree.root={ word:w, children:{} }; tree.size=1; return tree; }
  var node=tree.root;
  for(;;){
    var d=bkLevenshtein(w, node.word);
    if(d===0) return tree;
    if(node.children[d]) node=node.children[d];
    else { node.children[d]={ word:w, children:{} }; tree.size++; return tree; }
  }
}
function bkBuild(words){
  var t=bkCreate();
  for(var i=0;i<words.length;i++) bkAdd(t, words[i]);
  return t;
}
function bkSearch(tree, word, maxDist){
  var w=String(word), md=Math.max(0, Math.floor(maxDist||0));
  var out=[];
  if(!tree||!tree.root) return out;
  var stack=[tree.root];
  while(stack.length){
    var node=stack.pop();
    var d=bkLevenshtein(w, node.word);
    if(d<=md) out.push({ word:node.word, dist:d });
    var lo=d-md, hi=d+md, k;
    for(k in node.children){
      var kd=Number(k);
      if(kd>=lo&&kd<=hi) stack.push(node.children[k]);
    }
  }
  out.sort(function(p,q){ return p.dist-q.dist || (p.word<q.word?-1:1); });
  return out;
}
function bkDepth(tree){
  if(!tree||!tree.root) return 0;
  var walk=function(node){
    var best=1, k;
    for(k in node.children){
      var d=1+walk(node.children[k]);
      if(d>best) best=d;
    }
    return best;
  };
  return walk(tree.root);
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { bkLevenshtein:bkLevenshtein, bkCreate:bkCreate, bkAdd:bkAdd,
    bkBuild:bkBuild, bkSearch:bkSearch, bkDepth:bkDepth };
}
if (typeof window !== 'undefined') {
  window.BktreeForgePure = { bkLevenshtein:bkLevenshtein, bkCreate:bkCreate, bkAdd:bkAdd,
    bkBuild:bkBuild, bkSearch:bkSearch, bkDepth:bkDepth };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.BktreeForgePure;
    var tree=null;
    function build(){
      var words=$('dict').value.split(/\n+/).map(function(x){ return x.trim(); }).filter(Boolean);
      tree=P.bkBuild(words);
      return words.length;
    }
    $('build').addEventListener('click', function(){
      $('err').textContent='';
      var n=build();
      $('out').textContent='已建树：输入 '+n+' 词，去重后 '+tree.size+' 节点，深度 '+P.bkDepth(tree);
    });
    $('search').addEventListener('click', function(){
      $('err').textContent='';
      if(!tree) build();
      var q=$('q').value.trim();
      if(!q){ $('err').textContent='请输入查询词'; return; }
      var res=P.bkSearch(tree, q, Number($('maxd').value));
      if(!res.length){ $('out').textContent='无匹配（距离 \u2264 '+$('maxd').value+'）'; return; }
      $('out').textContent=res.map(function(r){ return r.word+'  (距离 '+r.dist+')'; }).join('\n');
    });
    $('clear').addEventListener('click', function(){ tree=null; $('out').textContent='建树后查找'; });
  })();
}
</script>
