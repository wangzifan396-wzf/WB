<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE; --bad:#EF4444;
  /* Ardot 令牌：大圆角阶梯 + 扩散有色阴影 + 内层 hairline */
  --r-lg:20px; --r-md:14px; --r-sm:10px; --r-xs:8px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh;
     -webkit-font-smoothing:antialiased}
.app{width:100%;max-width:820px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;
     box-shadow:var(--hair),var(--lift),var(--glow)}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-.02em;font-weight:650}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
     color:var(--fg);padding:10px 12px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
     box-shadow:inset 0 1px 2px rgba(0,0,0,.25);transition:border-color .16s ease,box-shadow .16s ease}
textarea{resize:vertical}
textarea:hover,input:hover,select:hover{border-color:var(--line2)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);
     box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:var(--r-sm);padding:10px 16px;cursor:pointer;font-size:14px;
       letter-spacing:-.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
       transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{filter:brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;box-shadow:none}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none}
button.ghost:hover{border-color:var(--line2);color:var(--fg);filter:none;background:rgba(255,255,255,.03);box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;
     box-shadow:inset 0 1px 3px rgba(0,0,0,.35);
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:40px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.sec{font-size:14px;color:var(--muted);font-weight:600;margin:18px 0 8px;letter-spacing:-.01em}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
/* 分段控件 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:6px;box-shadow:var(--hair)}
.seg button{background:transparent;border:0;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:13px;border-radius:0;
            box-shadow:none;transition:background .15s ease,color .15s ease}
.seg button:hover{background:rgba(255,255,255,.04);color:var(--fg);filter:none;box-shadow:none}
.seg button+button{border-left:1px solid var(--line)}
.seg button.active{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
/* Bento 瓦片（非对称网格，避 3 等宽卡） */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.bento.span2 .tile{grid-column:1/-1}
.bento.c3{grid-template-columns:2fr 1fr}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;
      box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.tile:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.tile h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:-.01em}
.tile .big{font:20px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);word-break:break-all}
.tile .sub2{color:var(--dim);font-size:12px;margin-top:4px}
/* 状态色 */
.state.ok{color:var(--ok)} .state.warn{color:var(--warn)} .state.bad{color:var(--bad)}
/* 徽章 */
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.badge.tag{color:var(--muted);background:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#langBtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 13px;font-size:12px;cursor:pointer;flex:0 0 auto;box-shadow:none}
#langBtn:hover{border-color:var(--line2);color:var(--fg);background:rgba(255,255,255,.03);box-shadow:none;filter:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#nanoToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--surface);color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;max-width:80vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#nanoToast.bad{border-color:rgba(239,68,68,.55)}
@media (max-width:760px){.grid{grid-template-columns:1fr}.bento{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<input id="p" type="number" value="1000000" style="width:80px"/ aria-label="p"><input id="d" type="number" value="20" style="width:46px"/ aria-label="d"><input id="r" type="number" value="5" style="width:46px"/ aria-label="r"><input id="y" type="number" value="30" style="width:46px"/ aria-label="y"><input id="rent" type="number" value="3000" style="width:60px"/ aria-label="rent"><input id="ri" type="number" value="3" style="width:46px"/ aria-label="ri"><input id="g" type="number" value="6" style="width:46px"/ aria-label="g"><input id="h" type="number" value="3" style="width:46px"/ aria-label="h">

<label class="hint">模型：买房=月供还本付息；租房=把首付分摊+月供与房租之差按月投资，比较 N 年后净财富。</label>

<script>

function pmt(rate, n, principal){ if(!(principal>0)) return 0; if(rate<=0) return principal/n;
  var m=rate/12; return principal*m/(1-Math.pow(1+m,-n)); }
function rentVsBuy(o){
  o=o||{}; var P=o.price==null?1000000:+o.price, down=o.downPct==null?20:+o.downPct, r=o.rate==null?0.05:+o.rate, Y=o.years==null?30:+o.years;
  var R0=o.rent==null?3000:+o.rent, i=o.rentInfl==null?0.03:+o.rentInfl, g=o.investReturn==null?0.06:+o.investReturn, h=o.homeAppr==null?0.03:+o.homeAppr;
  if(!(P>0)||!(Y>0)) return {error:'房价与年限须为正'};
  var principal=P*(1-down/100); var M=pmt(r,Y*12,principal);
  var months=Y*12; var bal=principal; var buyNW, rentPort=0; var curRent=R0;
  for(var mo=1;mo<=months;mo++){
    if(mo>1) curRent*=(1+i/12);
    var interest=bal*(r/12); var principalPaid=M-interest; bal-=principalPaid; if(bal<0) bal=0;
    var surplus=(principal/Y/12)+M-curRent; rentPort=rentPort*(1+g/12)+surplus;
  }
  var homeValue=P*Math.pow(1+h,Y); buyNW=homeValue-bal;
  return {mortgage:Math.round(M), buyNW:Math.round(buyNW), rentNW:Math.round(rentPort),
          better: buyNW>=rentPort?'买房':'租房', homeValue:Math.round(homeValue)}; }
var EXPORTS={rentVsBuy:rentVsBuy, pmt:pmt};

if (typeof module !== 'undefined' && module.exports) { module.exports = EXPORTS; }
if (typeof window !== 'undefined') { window.RentVsBuyForgePure = EXPORTS; }

</script>
<script>

(function(){
  var $=function(id){return document.getElementById(id);};
  var A=window.RentVsBuyForgePure;
  function run(){ var r=A.rentVsBuy({price:+$("p").value,downPct:+$("d").value,rate:+$("r").value/100,
    years:+$("y").value,rent:+$("rent").value,rentInfl:+$("ri").value/100,investReturn:+$("g").value/100,homeAppr:+$("h").value/100});
    if(r.error){ $("out").textContent=r.error; return; }
    $("out").textContent='月供 ¥'+r.mortgage+'\n'+r.years+' 年后 房价估值 ¥'+r.homeValue+
      '\n买房净财富 ¥'+r.buyNW+'\n租房净财富 ¥'+r.rentNW+'\n更优：'+r.better; }
  $("go").addEventListener('click',run); run();
})();

</script>
