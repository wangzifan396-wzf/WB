<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>HttpHeadersForge — 安全响应头分析：HSTS/CSP/COOP 等逐项体检与评分。</title>
<meta property="og:title" content="HttpHeadersForge">
<meta property="og:description" content="安全响应头分析：HSTS/CSP/COOP 等 8 项体检与评分，离线可用">
<meta property="og:image" content="./og.png">
<meta name="description" content="安全响应头分析：HSTS/CSP/COOP 等 8 项体检与评分，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>HttpHeadersForge</h1>
  <p class="sub">安全响应头分析：HSTS、CSP、X-Frame-Options、COOP/COEP 等 8 项逐项体检、权重评分与 A-F 评级 · 单文件 · 零依赖 · 本地优先</p>

<label>响应头（每行 名称: 值）</label>
<textarea id="src" rows="9" spellcheck="false" style="font:13px ui-monospace,Consolas,monospace"></textarea>
<div class="row">
  <button id="run">分析</button>
  <button id="sample" class="ghost">示例</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>

function hhParse(text){
  var map={}, lines=String(text||'').split(/\n+/);
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim(); if(!l) continue;
    var c=l.indexOf(':');
    if(c<0) continue;
    var k=l.slice(0,c).trim(), v=l.slice(c+1).trim();
    map[k.toLowerCase()]=v;
  }
  return map;
}
var HH_CHECKS=[
  {name:'Strict-Transport-Security', key:'strict-transport-security', sev:'高', test:function(v){ return /max-age=\d+/.test(v) && !/max-age=0/.test(v); }, advice:'建议 max-age≥31536000 并加 includeSubDomains'},
  {name:'Content-Security-Policy', key:'content-security-policy', sev:'高', test:function(v){return !!v;}, advice:'建议定义 default-src 并尽量收紧'},
  {name:'X-Frame-Options', key:'x-frame-options', sev:'中', test:function(v){return /^(deny|sameorigin)$/i.test(v);}, advice:'设为 DENY 或 SAMEORIGIN 防点击劫持'},
  {name:'X-Content-Type-Options', key:'x-content-type-options', sev:'中', test:function(v){return /^nosniff$/i.test(v);}, advice:'设为 nosniff'},
  {name:'Referrer-Policy', key:'referrer-policy', sev:'中', test:function(v){return !!v;}, advice:'建议 no-referrer 或 strict-origin-when-cross-origin'},
  {name:'Permissions-Policy', key:'permissions-policy', sev:'中', test:function(v){return !!v;}, advice:'限制摄像头/麦克风/地理位置等敏感特性'},
  {name:'Cross-Origin-Opener-Policy', key:'cross-origin-opener-policy', sev:'中', test:function(v){return /^(same-origin|same-origin-allow-popups)$/i.test(v);}, advice:'设为 same-origin 缓解 XS-leaks'},
  {name:'Cross-Origin-Resource-Policy', key:'cross-origin-resource-policy', sev:'低', test:function(v){return /^(same-origin|same-site|cross-origin)$/i.test(v);}, advice:'设为 same-origin 防止跨源资源加载'}
];
function hhAnalyze(text){
  var map=hhParse(text), results=[], score=0;
  for(var i=0;i<HH_CHECKS.length;i++){
    var c=HH_CHECKS[i], v=map[c.key]||'', present=!!v, pass=present && c.test(v);
    var w = c.sev==='高'?16 : c.sev==='中'?12 : 8;
    if(pass) score+=w;
    results.push({name:c.name, present:present, pass:!!pass, value:v, severity:c.sev, weight:w, advice:c.advice});
  }
  score=Math.min(100, score);
  var grade = score>=90?'A':score>=75?'B':score>=60?'C':score>=40?'D':'F';
  return { score:score, max:100, grade:grade, results:results };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { hhParse:hhParse, hhAnalyze:hhAnalyze, HH_CHECKS:HH_CHECKS };
}
if (typeof window !== 'undefined') {
  window.HttpHeadersForgePure = { hhParse:hhParse, hhAnalyze:hhAnalyze, HH_CHECKS:HH_CHECKS };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.HttpHeadersForgePure;
  var SAMPLE='Strict-Transport-Security: max-age=31536000; includeSubDomains\nContent-Security-Policy: default-src \'self\'\nX-Frame-Options: DENY\nX-Content-Type-Options: nosniff\nReferrer-Policy: no-referrer\nPermissions-Policy: geolocation=()\nCross-Origin-Opener-Policy: same-origin\nCross-Origin-Resource-Policy: same-origin';
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function run(){
    if(!$('src').value.trim()){ $('err').textContent='请粘贴响应头或点击示例'; return; }
    var r=P.hhAnalyze($('src').value);
    $('err').textContent='';
    var g='<div class="grid"><div class="kv"><b>安全评分</b><span>'+r.grade+' ('+r.score+'/'+r.max+')</span></div>'+
      '<div class="kv"><b>已配置</b><span>'+r.results.filter(function(x){return x.present;}).length+' / '+r.results.length+'</span></div></div>';
    var t='';
    for(var i=0;i<r.results.length;i++){ var x=r.results[i];
      t+='<div class="kv"><b>'+(x.pass?'✓':'✗')+' '+esc(x.name)+' <span style="color:#71717A">('+x.severity+')</span></b><span>'+(x.present?esc(x.value.slice(0,28)):'缺失')+'</span></div>';
    }
    $('out').innerHTML=g+t;
  }
  $('run').addEventListener('click', run);
  $('sample').addEventListener('click', function(){ $('src').value=SAMPLE; run(); });
  $('src').value=SAMPLE; run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
