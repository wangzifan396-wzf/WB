<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<body>
<div class="app">
  <h1>RobotsForge</h1>
  <p class="sub">robots.txt 生成与测试：按 UA 选组、最长匹配判定、通配符与 $ 锚点、语法体检 · 单文件 · 零依赖 · 本地优先</p>

<label>robots.txt 内容</label>
<textarea id="src" rows="9" spellcheck="false"></textarea>
<div class="row">
  <label style="margin:0">测试 UA</label>
  <input type="text" id="ua" value="Googlebot" style="max-width:180px">
  <label style="margin:0">测试路径</label>
  <input type="text" id="url" value="/admin/panel" style="max-width:220px">
  <button id="run">测试</button>
  <button id="gen" class="ghost">生成模板</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>

function rbParse(text){
  var lines=String(text==null?'':text).replace(/\r\n?/g,'\n').split('\n');
  var groups=[], cur=null, sitemaps=[], errors=[];
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].replace(/#.*$/,'').trim();
    if(!ln) continue;
    var idx=ln.indexOf(':');
    if(idx<0){ errors.push({ line:i+1, msg:'\u7f3a\u5c11\u5192\u53f7\uff1a'+ln }); continue; }
    var field=ln.slice(0,idx).trim().toLowerCase(), value=ln.slice(idx+1).trim();
    if(field==='user-agent'){
      if(!cur || cur.rules.length || cur.crawlDelay!==null) { cur={ agents:[], rules:[], crawlDelay:null }; groups.push(cur); }
      cur.agents.push(value.toLowerCase());
    } else if(field==='allow' || field==='disallow'){
      if(!cur){ errors.push({ line:i+1, msg:field+' \u51fa\u73b0\u5728 User-agent \u4e4b\u524d' }); continue; }
      cur.rules.push({ allow: field==='allow', path:value });
    } else if(field==='sitemap'){
      sitemaps.push(value);
    } else if(field==='crawl-delay'){
      if(cur) cur.crawlDelay=parseFloat(value);
    } else {
      errors.push({ line:i+1, msg:'\u672a\u77e5\u5b57\u6bb5\uff1a'+field });
    }
  }
  return { groups:groups, sitemaps:sitemaps, errors:errors };
}
function rbMatchPattern(pattern, url){
  if(pattern==='') return false;
  var mustEnd = pattern.slice(-1)==='$';
  var p = mustEnd ? pattern.slice(0,-1) : pattern;
  var parts = p.split('*');
  var pos = 0;
  for(var i=0;i<parts.length;i++){
    if(parts[i]===''){ continue; }
    var at = url.indexOf(parts[i], pos);
    if(i===0 && at!==0) return false;
    if(at<0) return false;
    pos = at + parts[i].length;
  }
  if(mustEnd) return pos===url.length;
  return true;
}
function rbPickGroup(parsed, ua){
  var agent=String(ua||'*').toLowerCase(), best=null, bestLen=-1, star=null;
  for(var i=0;i<parsed.groups.length;i++){
    var g=parsed.groups[i];
    for(var j=0;j<g.agents.length;j++){
      var a=g.agents[j];
      if(a==='*'){ if(!star) star=g; continue; }
      if(agent.indexOf(a)>=0 && a.length>bestLen){ best=g; bestLen=a.length; }
    }
  }
  return best || star || null;
}
function rbAllowed(parsed, ua, url){
  var g=rbPickGroup(parsed, ua);
  if(!g) return { allowed:true, by:null, reason:'\u65e0\u5339\u914d\u89c4\u5219\u7ec4\uff0c\u9ed8\u8ba4\u5141\u8bb8' };
  var win=null;
  for(var i=0;i<g.rules.length;i++){
    var r=g.rules[i];
    if(!rbMatchPattern(r.path, url)) continue;
    var len=r.path.replace(/\$$/,'').length;
    if(!win || len>win.len || (len===win.len && r.allow)) win={ rule:r, len:len };
  }
  if(!win) return { allowed:true, by:null, reason:'\u672a\u547d\u4e2d\u4efb\u4f55\u89c4\u5219\uff0c\u9ed8\u8ba4\u5141\u8bb8' };
  return { allowed:win.rule.allow, by:(win.rule.allow?'Allow: ':'Disallow: ')+win.rule.path,
           reason:'\u547d\u4e2d\u6700\u957f\u5339\u914d\u89c4\u5219\uff08'+win.len+' \u5b57\u7b26\uff09' };
}
function rbBuild(cfg){
  cfg=cfg||{};
  var out='';
  var groups=cfg.groups||[{ agents:['*'], disallow:[], allow:[] }];
  for(var i=0;i<groups.length;i++){
    var g=groups[i];
    for(var a=0;a<g.agents.length;a++) out+='User-agent: '+g.agents[a]+'\n';
    for(var d=0; d<(g.disallow||[]).length; d++) out+='Disallow: '+g.disallow[d]+'\n';
    for(var w=0; w<(g.allow||[]).length; w++) out+='Allow: '+g.allow[w]+'\n';
    if(g.crawlDelay) out+='Crawl-delay: '+g.crawlDelay+'\n';
    out+='\n';
  }
  for(var s=0; s<(cfg.sitemaps||[]).length; s++) out+='Sitemap: '+cfg.sitemaps[s]+'\n';
  return out.replace(/\n{3,}/g,'\n\n').trim()+'\n';
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { rbParse:rbParse, rbMatchPattern:rbMatchPattern, rbPickGroup:rbPickGroup, rbAllowed:rbAllowed, rbBuild:rbBuild };
}
if (typeof window !== 'undefined') {
  window.RobotsForgePure = { rbParse:rbParse, rbMatchPattern:rbMatchPattern, rbPickGroup:rbPickGroup, rbAllowed:rbAllowed, rbBuild:rbBuild };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.RobotsForgePure;
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function run(){
    var p=P.rbParse($('src').value);
    var a=P.rbAllowed(p, $('ua').value, $('url').value);
    $('err').textContent = p.errors.length ? (p.errors.length+' 处语法问题：第 '+p.errors[0].line+' 行 '+p.errors[0].msg) : '';
    $('out').innerHTML='<div class="grid">'+
      '<div class="kv"><b>抓取判定</b><span style="color:'+(a.allowed?'#10B981':'#EF4444')+'">'+(a.allowed?'允许':'禁止')+'</span></div>'+
      '<div class="kv"><b>命中规则</b><span>'+esc(a.by||'无')+'</span></div>'+
      '<div class="kv"><b>说明</b><span>'+esc(a.reason)+'</span></div>'+
      '<div class="kv"><b>规则组</b><span>'+p.groups.length+'</span></div>'+
      '<div class="kv"><b>Sitemap</b><span>'+(p.sitemaps.length? esc(p.sitemaps.join(', ')) : '无')+'</span></div>'+
      '<div class="kv"><b>语法问题</b><span>'+p.errors.length+'</span></div></div>';
  }
  $('run').addEventListener('click', run);
  $('gen').addEventListener('click', function(){
    $('src').value=P.rbBuild({ groups:[
      { agents:['*'], disallow:['/admin/','/api/','/*.json$'], allow:['/admin/public/'] },
      { agents:['Googlebot'], disallow:[], allow:['/'] }
    ], sitemaps:['https://example.com/sitemap.xml'] });
    run();
  });
  $('src').value='User-agent: *\nDisallow: /admin/\nDisallow: /*.json$\nAllow: /admin/public/\n\nUser-agent: Googlebot\nAllow: /\n\nSitemap: https://example.com/sitemap.xml';
  run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
