:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{

button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}

button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}

  transition:border-color .18s ease,box-shadow .18s ease}

:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}

<body>
<div class="app">
  <h1>GeoForge</h1>
  <p class="sub">地理距离计算器：Haversine 大圆距离 + 方位角 + 目的地 + 包围盒 · 单文件 · 零依赖 · 本地优先</p>

<label>起点（纬度, 经度）</label>
<input id="pa" type="text" value="39.9042, 116.4074">
<label>终点（纬度, 经度）</label>
<input id="pb" type="text" value="31.2304, 121.4737">
<div class="row">
  <button id="run">计算大圆距离</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入两点经纬度后计算</div>
<script>
var EARTH_R = 6371.0088;
function toRad(d){ return d*Math.PI/180; }
function toDeg(r){ return r*180/Math.PI; }
function parseLatLng(s){
  var parts=String(s||'').trim().split(/[,\s]+/).filter(function(x){return x.length;});
  if(parts.length!==2) return { value:null, error:'需要「纬度, 经度」两个数' };
  var lat=Number(parts[0]), lng=Number(parts[1]);
  if(!isFinite(lat)||!isFinite(lng)) return { value:null, error:'非法数字' };
  if(lat<-90||lat>90) return { value:null, error:'纬度须在 [-90, 90]' };
  if(lng<-180||lng>180) return { value:null, error:'经度须在 [-180, 180]' };
  return { value:{lat:lat,lng:lng}, error:null };
}
function haversine(a, b){
  var dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  var s=Math.sin(dLat/2)*Math.sin(dLat/2) +
        Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*EARTH_R*Math.asin(Math.min(1, Math.sqrt(s)));
}
function bearing(a, b){
  var la=toRad(a.lat), lb=toRad(b.lat), dl=toRad(b.lng-a.lng);
  var y=Math.sin(dl)*Math.cos(lb);
  var x=Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(dl);
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function destination(a, bearingDeg, distKm){
  var la=toRad(a.lat), lo=toRad(a.lng), br=toRad(bearingDeg), dr=distKm/EARTH_R;
  var lat2=Math.asin(Math.sin(la)*Math.cos(dr)+Math.cos(la)*Math.sin(dr)*Math.cos(br));
  var lng2=lo+Math.atan2(Math.sin(br)*Math.sin(dr)*Math.cos(la), Math.cos(dr)-Math.sin(la)*Math.sin(lat2));
  var lngDeg=((toDeg(lng2)+540)%360)-180;
  return { lat:toDeg(lat2), lng:lngDeg };
}
function boundingBox(center, radiusKm){
  var dLat=toDeg(radiusKm/EARTH_R);
  var dLng=toDeg(radiusKm/(EARTH_R*Math.cos(toRad(center.lat))));
  return { minLat:center.lat-dLat, maxLat:center.lat+dLat,
           minLng:center.lng-dLng, maxLng:center.lng+dLng };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parseLatLng:parseLatLng, haversine:haversine, bearing:bearing,
    destination:destination, boundingBox:boundingBox, EARTH_R:EARTH_R };
}
if (typeof window !== 'undefined') {
  window.GeoForgePure = { parseLatLng:parseLatLng, haversine:haversine, bearing:bearing,
    destination:destination, boundingBox:boundingBox };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.GeoForgePure;
    function f(x){ return Math.round(x*10000)/10000; }
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var ra=P.parseLatLng($('pa').value), rb=P.parseLatLng($('pb').value);
        if(ra.error) throw new Error('起点: '+ra.error);
        if(rb.error) throw new Error('终点: '+rb.error);
        var d=P.haversine(ra.value, rb.value);
        var br=P.bearing(ra.value, rb.value);
        var bb=P.boundingBox(ra.value, d);
        var lines=['大圆距离: '+f(d)+' km', '初始方位角: '+f(br)+'°',
                   '', '以起点为圆心、距离为半径的包围盒:',
                   '  lat ['+f(bb.minLat)+', '+f(bb.maxLat)+']',
                   '  lng ['+f(bb.minLng)+', '+f(bb.maxLng)+']'];
        $('out').textContent=lines.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('pa').value=''; $('pb').value=''; $('out').textContent='输入两点经纬度后计算'; });
  })();
}
</script>
