<meta name="description" content="Base64 / Base64URL 编解码：UTF-8 安全，双字母表，可选填充 · 单文件 · 零依赖 · 本地优先">

<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="app">
  <h1>Base64Forge</h1>
  <p class="sub">Base64 / Base64URL 编解码：UTF-8 安全，双字母表，可选填充 · 单文件 · 零依赖 · 本地优先</p>

<label>输入文本 / Base64</label>
<textarea id="in" rows="4">hello, 世界</textarea>
<div class="opt">
  <label>字母表
    <select id="alpha">
      <option value="std">标准 (+/)</option>
      <option value="url">URL-safe (-_)</option>
    </select>
  </label>
  <label><input id="pad" type="checkbox" checked> 填充 =</label>
</div>
<div class="row">
  <button id="enc">编码</button>
  <button id="dec">解码</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入后编码或解码</div>
<script>
var _STD='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
var _URL='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function b64Utf8Bytes(str){
  var out=[];
  for(var i=0;i<str.length;i++){
    var c=str.codePointAt(i);
    if(c>0xFFFF) i++;
    if(c<0x80) out.push(c);
    else if(c<0x800){ out.push(0xC0|(c>>6),0x80|(c&63)); }
    else if(c<0x10000){ out.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63)); }
    else { out.push(0xF0|(c>>18),0x80|((c>>12)&63),0x80|((c>>6)&63),0x80|(c&63)); }
  }
  return out;
}
function b64BytesToUtf8(bytes){
  var out='',i=0;
  while(i<bytes.length){
    var b=bytes[i];
    if(b<0x80){ out+=String.fromCharCode(b); i++; }
    else if(b>=0xC0&&b<0xE0){ out+=String.fromCharCode(((b&31)<<6)|(bytes[i+1]&63)); i+=2; }
    else if(b>=0xE0&&b<0xF0){ out+=String.fromCharCode(((b&15)<<12)|((bytes[i+1]&63)<<6)|(bytes[i+2]&63)); i+=3; }
    else {
      var cp=((b&7)<<18)|((bytes[i+1]&63)<<12)|((bytes[i+2]&63)<<6)|(bytes[i+3]&63);
      out+=String.fromCodePoint(cp); i+=4;
    }
  }
  return out;
}
function b64EncodeBytes(bytes, opts){
  opts=opts||{};
  var alpha=opts.urlSafe?_URL:_STD;
  var pad=opts.pad===undefined?true:!!opts.pad;
  var out='';
  for(var i=0;i<bytes.length;i+=3){
    var b0=bytes[i], b1=i+1<bytes.length?bytes[i+1]:0, b2=i+2<bytes.length?bytes[i+2]:0;
    var trip=(b0<<16)|(b1<<8)|b2;
    out+=alpha[(trip>>18)&63]+alpha[(trip>>12)&63];
    out+= i+1<bytes.length ? alpha[(trip>>6)&63] : (pad?'=':'');
    out+= i+2<bytes.length ? alpha[trip&63] : (pad?'=':'');
  }
  return out;
}
function b64DecodeToBytes(s){
  s=String(s).replace(/[\r\n\s]/g,'').replace(/=+$/,'');
  if(!/^[A-Za-z0-9+\/\-_]*$/.test(s)) return {value:null, error:'含非法字符'};
  if(s.length%4===1) return {value:null, error:'长度非法（mod 4 == 1）'};
  var out=[];
  for(var i=0;i<s.length;i+=4){
    var n=0, have=0;
    for(var j=0;j<4;j++){
      var ch=s[i+j];
      var v = ch===undefined ? 0 : (_STD.indexOf(ch)>=0?_STD.indexOf(ch):_URL.indexOf(ch));
      if(ch!==undefined){ if(v<0) return {value:null, error:'非法字符 '+ch}; have++; }
      n=(n<<6)|(v<0?0:v);
    }
    out.push((n>>16)&255);
    if(have>2) out.push((n>>8)&255);
    if(have>3) out.push(n&255);
  }
  return {value:out, error:null};
}
function b64Encode(str, opts){ return b64EncodeBytes(b64Utf8Bytes(str), opts); }
function b64Decode(s){
  var r=b64DecodeToBytes(s);
  if(r.error) return r;
  try { return {value:b64BytesToUtf8(r.value), error:null}; }
  catch(e){ return {value:null, error:'UTF-8 解码失败'}; }
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { b64Encode:b64Encode, b64Decode:b64Decode,
    b64EncodeBytes:b64EncodeBytes, b64DecodeToBytes:b64DecodeToBytes, b64Utf8Bytes:b64Utf8Bytes };
}
if (typeof window !== 'undefined') {
  window.Base64ForgePure = { b64Encode:b64Encode, b64Decode:b64Decode,
    b64EncodeBytes:b64EncodeBytes, b64DecodeToBytes:b64DecodeToBytes };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.Base64ForgePure;
    $('enc').addEventListener('click', function(){
      $('err').textContent='';
      $('out').textContent=P.b64Encode($('in').value, {urlSafe:$('alpha').value==='url', pad:$('pad').checked});
    });
    $('dec').addEventListener('click', function(){
      $('err').textContent='';
      var r=P.b64Decode($('in').value.trim());
      if(r.error){ $('err').textContent=r.error; return; }
      $('out').textContent=r.value;
    });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('out').textContent='输入后编码或解码'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>

    <span class="badge flag">旗舰</span>

</div>
