<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
#nanoToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#1A1B1E;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:9px 16px;font-size:13px;line-height:1.4;letter-spacing:.01em;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;max-width:80vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#nanoToast.bad{border-color:rgba(239,68,68,.55)}
@media (prefers-reduced-motion:reduce){#nanoToast{transition:none}}

<body>
<div class="app">
  <h1>TimelineForge</h1>
  <p class="sub">时间线生成器：「日期 | 标题 | 描述」一行一事件，自动排序后渲染左右交替时间线 SVG，支持年月日三种粒度，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <button id="render">生成时间线</button>
  <button id="demo" class="ghost">示例</button>
  <button id="copy" class="ghost">复制 SVG</button>
  <span class="sub" id="stat" style="margin:0"></span>
</div>
<textarea id="src" rows="8" spellcheck="false" placeholder="2026-01 | 项目启动 | 首批 10 款工具上线"></textarea>
<div id="out" style="border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;overflow:auto;min-height:200px;padding:8px;text-align:center"></div>
<script>
function tmlParseDate(s){
  var m=/^(\d{4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?$/.exec(String(s||'').trim());
  if(!m) return null;
  var y=Number(m[1]), mo=m[2]?Number(m[2]):1, d=m[3]?Number(m[3]):1;
  if(mo<1||mo>12||d<1||d>31) return null;
  return { y:y, m:mo, d:d, key:y*10000+mo*100+d, label:m[1]+(m[2]?'-'+(mo<10?'0':'')+mo:'')+(m[3]?'-'+(d<10?'0':'')+d:'') };
}
function tmlParse(text){
  var events=[], lines=String(text||'').split('\n');
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln || ln.charAt(0)==='#') continue;
    var parts=ln.split('|').map(function(p){ return p.trim(); });
    if(parts.length<2) return { error:'第 '+(i+1)+' 行缺少「日期 | 标题」' };
    var dt=tmlParseDate(parts[0]);
    if(!dt) return { error:'第 '+(i+1)+' 行日期非法（YYYY[-MM[-DD]]）' };
    if(!parts[1]) return { error:'第 '+(i+1)+' 行标题为空' };
    events.push({ date:dt, title:parts[1], desc:parts[2]||'' });
  }
  if(!events.length) return { error:'没有可用事件' };
  return { error:null, events:events };
}
function tmlSort(events){
  return events.slice().sort(function(a,b){ return a.date.key-b.date.key; });
}
function tmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tmlSvg(events){
  var ev=tmlSort(events);
  var ROW=86, W=680, CX=W/2, PAD=30;
  var H=PAD*2+ev.length*ROW;
  var cols=['#5E6AD2','#22D3EE','#10B981','#A78BFA','#F5A623'];
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  s+='<rect width="'+W+'" height="'+H+'" fill="#0A0A0B"/>';
  s+='<line x1="'+CX+'" y1="'+PAD+'" x2="'+CX+'" y2="'+(H-PAD)+'" stroke="rgba(255,255,255,.15)" stroke-width="2"/>';
  for(var i=0;i<ev.length;i++){
    var y=PAD+i*ROW+ROW/2, left=(i%2===0), c=cols[i%cols.length];
    var bx=left ? CX-320 : CX+40, tx=bx+14, anchor='start';
    s+='<circle cx="'+CX+'" cy="'+y+'" r="7" fill="'+c+'" stroke="#0A0A0B" stroke-width="2"/>';
    s+='<line x1="'+(left?CX-40:CX+7)+'" y1="'+y+'" x2="'+(left?CX-7:CX+40)+'" y2="'+y+'" stroke="'+c+'" stroke-width="1.5"/>';
    s+='<rect x="'+bx+'" y="'+(y-30)+'" width="280" height="60" rx="10" fill="#141417" stroke="rgba(255,255,255,.08)"/>';
    s+='<text x="'+tx+'" y="'+(y-9)+'" font-family="system-ui,sans-serif" font-size="12" fill="'+c+'" text-anchor="'+anchor+'">'+tmlEsc(ev[i].date.label)+'</text>';
    s+='<text x="'+tx+'" y="'+(y+9)+'" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="'+anchor+'">'+tmlEsc(ev[i].title)+'</text>';
    if(ev[i].desc) s+='<text x="'+tx+'" y="'+(y+24)+'" font-family="system-ui,sans-serif" font-size="11" fill="#A1A1AA" text-anchor="'+anchor+'">'+tmlEsc(ev[i].desc.slice(0,34))+'</text>';
  }
  return s+'</svg>';
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { tmlParseDate:tmlParseDate, tmlParse:tmlParse, tmlSort:tmlSort, tmlSvg:tmlSvg, tmlEsc:tmlEsc };
}
if (typeof window !== 'undefined') {
  window.TimelineForgePure = { tmlParseDate:tmlParseDate, tmlParse:tmlParse, tmlSort:tmlSort, tmlSvg:tmlSvg, tmlEsc:tmlEsc };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.TimelineForgePure;
    var DEMO='# nano-tools 里程碑\n2026-07-24 | 项目启动 | 首批单文件工具上线\n2026-07-26 | 100 旗舰 | 批二十七冲线\n2026-07-28 | 150 旗舰 | 批三十二冲线\n2026-07-29 | 180 旗舰 | 批三十五冲线\n2026-07-30 | 200 旗舰 | 批三十七冲线';
    function render(){
      var p=P.tmlParse($('src').value);
      if(p.error){ $('stat').textContent=p.error; $('out').innerHTML=''; return; }
      $('out').innerHTML=P.tmlSvg(p.events);
      $('stat').textContent=p.events.length+' 个事件';
    }
    $('render').addEventListener('click', render);
    $('demo').addEventListener('click', function(){ $('src').value=DEMO; render(); });
    $('copy').addEventListener('click', function(){
      var svg=$('out').innerHTML;
      if(svg && navigator.clipboard) navigator.clipboard.writeText(svg);
    });
    $('src').value=DEMO; render();
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>

</div>

if ('serviceWorker' in navigator) {

<!-- nano-polish:toast -->
<div id="nanoToast" role="status" aria-live="polite"></div>
<script data-nano-polish>
(function(){var el=document.getElementById('nanoToast');if(!el)return;var t;
function zh(){try{var l=localStorage.getItem('nano-lang')||document.documentElement.lang||'zh';return String(l).indexOf('en')!==0;}catch(e){return true;}}
function show(m,bad){el.textContent=m;el.className='on'+(bad?' bad':'');clearTimeout(t);t=setTimeout(function(){el.className='';},1700);}
window.nanoToast=show;
try{var nc=navigator.clipboard;if(nc&&nc.writeText){var ow=nc.writeText.bind(nc);nc.writeText=function(s){return ow(s).then(function(r){show(zh()?'已复制':'Copied');return r;},function(e){show(zh()?'复制失败':'Copy failed',1);throw e;});};}}catch(e){}
try{if(document.execCommand){var oe=document.execCommand.bind(document);document.execCommand=function(c){var r=oe.apply(null,arguments);if(String(c).toLowerCase()==='copy'){show(r?(zh()?'已复制':'Copied'):(zh()?'复制失败':'Copy failed'),!r);}return r;};}}catch(e){}
})();
</script>
