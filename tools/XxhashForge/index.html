<script>
var _P1=2654435761, _P2=2246822519, _P3=3266489917, _P4=668265263, _P5=374761393;
function _rotl(x,r){ return ((x<<r)|(x>>>(32-r)))>>>0; }
function xxUtf8(str){
  var out=[];
  for(var i=0;i<str.length;i++){
    var c=str.codePointAt(i);
    if(c>0xFFFF) i++;
    if(c<0x80) out.push(c);
    else if(c<0x800){ out.push(0xC0|(c>>6),0x80|(c&63)); }
    else if(c<0x10000){ out.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63)); }
    else { out.push(0xF0|(c>>18),0x80|((c>>12)&63),0x80|((c>>6)&63),0x80|(c&63)); }
  }
  return out;
}
function _u32(bytes,i){
  return (bytes[i]|(bytes[i+1]<<8)|(bytes[i+2]<<16)|(bytes[i+3]<<24))>>>0;
}
function xxhash32Bytes(bytes, seed){
  seed=(seed||0)>>>0;
  var len=bytes.length, i=0, h;
  if(len>=16){
    var v1=(seed+_P1+_P2)>>>0, v2=(seed+_P2)>>>0, v3=seed>>>0, v4=(seed-_P1)>>>0;
    while(i<=len-16){
      v1=Math.imul(_rotl((v1+Math.imul(_u32(bytes,i),_P2))>>>0,13),_P1)>>>0; i+=4;
      v2=Math.imul(_rotl((v2+Math.imul(_u32(bytes,i),_P2))>>>0,13),_P1)>>>0; i+=4;
      v3=Math.imul(_rotl((v3+Math.imul(_u32(bytes,i),_P2))>>>0,13),_P1)>>>0; i+=4;
      v4=Math.imul(_rotl((v4+Math.imul(_u32(bytes,i),_P2))>>>0,13),_P1)>>>0; i+=4;
    }
    h=(_rotl(v1,1)+_rotl(v2,7)+_rotl(v3,12)+_rotl(v4,18))>>>0;
  } else {
    h=(seed+_P5)>>>0;
  }
  h=(h+len)>>>0;
  while(i<=len-4){
    h=(h+Math.imul(_u32(bytes,i),_P3))>>>0;
    h=Math.imul(_rotl(h,17),_P4)>>>0;
    i+=4;
  }
  while(i<len){
    h=(h+Math.imul(bytes[i],_P5))>>>0;
    h=Math.imul(_rotl(h,11),_P1)>>>0;
    i++;
  }
  h^=h>>>15; h=Math.imul(h,_P2)>>>0;
  h^=h>>>13; h=Math.imul(h,_P3)>>>0;
  h^=h>>>16;
  return h>>>0;
}
function xxhash32(str, seed){ return xxhash32Bytes(xxUtf8(str), seed); }
function xxhash32Hex(str, seed){
  var h=xxhash32(str, seed).toString(16);
  while(h.length<8) h='0'+h;
  return h;
}
if (typeof module !== 'undefined' && module.exports) {

}
if (typeof window !== 'undefined') {

}
</script>
