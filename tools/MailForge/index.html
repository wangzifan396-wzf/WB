<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>MailForge — 邮箱语法校验、解析与角色识别</title>
<meta property="og:title" content="MailForge">
<meta property="og:description" content="邮箱语法校验、解析与角色识别">
<meta property="og:image" content="./og.png">
<meta name="description" content="邮箱语法校验、解析与角色识别 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:140px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="app">
  <h1>MailForge</h1>
  <p class="sub">邮箱语法校验、解析与角色识别 · 单文件 · 零依赖 · 本地优先</p>

<label for="min">邮箱地址</label>
<input id="min" type="text" value="user+promo@example.com">
<div class="row">
  <button id="valid">校验</button>
  <button id="parse">解析</button>
  <button id="role">角色识别</button>
  <button id="copy" class="ghost">复制</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">选择一种操作</div>
<script>
var MAIL_ROLE=['admin','administrator','info','support','sales','billing','noreply','no-reply','hello','contact','help','postmaster','abuse','root','webmaster','office','team','mail','newsletter','marketing'];
function mailValidate(email){
  if(typeof email!=='string') return {valid:false, error:'not string'};
  email=email.trim();
  if(email.length===0) return {valid:false, error:'empty'};
  if(email.length>254) return {valid:false, error:'too long'};
  var at=email.lastIndexOf('@');
  if(at<1 || at===email.length-1) return {valid:false, error:'missing @'};
  var local=email.slice(0,at), domain=email.slice(at+1);
  if(local.length>64) return {valid:false, error:'local too long'};
  if(!/^[A-Za-z0-9.!#$%&'*+\/=?^_`{|}~-]+$/.test(local)) return {valid:false, error:'local invalid chars'};
  if(!/^[A-Za-z0-9.-]+$/.test(domain)) return {valid:false, error:'domain invalid chars'};
  if(domain.indexOf('..')>=0) return {valid:false, error:'domain has ..'};
  if(domain.indexOf('.')<0) return {valid:false, error:'domain missing dot'};
  var tld=domain.split('.').pop();
  if(tld.length<2) return {valid:false, error:'tld too short'};
  return {valid:true, local:local, domain:domain, tld:tld, error:null};
}
function mailParse(email){
  var r=mailValidate(email);
  if(!r.valid) return {valid:false, error:r.error};
  var plus=r.local.indexOf('+');
  var tag = plus>=0 ? r.local.slice(plus+1) : null;
  var baseLocal = plus>=0 ? r.local.slice(0,plus) : r.local;
  return {valid:true, local:r.local, baseLocal:baseLocal, tag:tag, domain:r.domain, tld:r.tld, isTagged: tag!==null, error:null};
}
function mailRole(email){
  var r=mailValidate(email);
  if(!r.valid) return {valid:false, error:r.error, role:null, type:null};
  var local=r.local.toLowerCase();
  if(MAIL_ROLE.indexOf(local)>=0) return {valid:true, role:true, type:'role', local:local};
  if(local.indexOf('no')===0 && /reply/.test(local)) return {valid:true, role:true, type:'role', local:local};
  return {valid:true, role:false, type:'personal', local:local};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { validate:mailValidate, parse:mailParse, role:mailRole };
}
if (typeof window !== 'undefined') {
  window.MailForgePure = { validate:mailValidate, parse:mailParse, role:mailRole };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.MailForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function show(r){ if(r.error){ $('out').textContent='错误：'+r.error; return; } $('out').textContent=JSON.stringify(r,null,2); }
    $('valid').addEventListener('click', function(){ show(P.validate($('min').value)); });
    $('parse').addEventListener('click', function(){ show(P.parse($('min').value)); });
    $('role').addEventListener('click', function(){ show(P.role($('min').value)); });
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('min').value=''; $('out').textContent='\u9009\u62e9\u4e00\u79cd\u64cd\u4f5c'; });
  })();
}
</script>
