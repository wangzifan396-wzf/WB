/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}

<body>
<div class="app">
  <h1>DitherForge</h1>
  <p class="sub">图像抖动：Floyd-Steinberg 误差扩散与 Bayer 有序抖动，1-bit 复古像素风转换，支持上传图片，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<label>算法</label>
<select id="algo">
  <option value="fs">Floyd-Steinberg 误差扩散</option>
  <option value="bayer">Bayer 4×4 有序抖动</option>
  <option value="threshold">纯阈值（对照）</option>
</select>
<label>上传图片（可选，默认内置渐变球）</label>
<input id="file" type="file" accept="image/*">
<div class="row">
  <button id="run">转换</button>
</div>
<div class="err" id="err"></div>
<div class="row" style="align-items:flex-start;">
  <canvas id="src" width="256" height="256" style="border:1px solid rgba(255,255,255,.08);border-radius:10px;"></canvas>
  <canvas id="dst" width="256" height="256" style="border:1px solid rgba(255,255,255,.08);border-radius:10px;"></canvas>
</div>
<script>
var DT_BAYER4 = [
  [ 0,  8,  2, 10],
  [12,  4, 14,  6],
  [ 3, 11,  1,  9],
  [15,  7, 13,  5]
];
function dtGray(r, g, b){ return 0.299*r + 0.587*g + 0.114*b; }
function dtThreshold(gray, w, h){
  var out = [];
  for(var i=0;i<w*h;i++) out.push(gray[i] >= 128 ? 255 : 0);
  return out;
}
function dtBayer(gray, w, h){
  var out = [];
  for(var y=0;y<h;y++){
    for(var x=0;x<w;x++){
      var t = (DT_BAYER4[y & 3][x & 3] + 0.5) / 16 * 255;
      out.push(gray[y*w+x] >= t ? 255 : 0);
    }
  }
  return out;
}
function dtFloyd(gray, w, h){
  var buf = gray.slice(), out = new Array(w*h);
  for(var y=0;y<h;y++){
    for(var x=0;x<w;x++){
      var i = y*w + x;
      var old = buf[i], nv = old >= 128 ? 255 : 0;
      out[i] = nv;
      var err = old - nv;
      if(x+1 < w) buf[i+1] += err * 7/16;
      if(y+1 < h){
        if(x > 0) buf[i+w-1] += err * 3/16;
        buf[i+w] += err * 5/16;
        if(x+1 < w) buf[i+w+1] += err * 1/16;
      }
    }
  }
  return out;
}
function dtDemo(size){
  // gradient sphere on gradient background
  var g = [];
  for(var y=0;y<size;y++){
    for(var x=0;x<size;x++){
      var v = (x / (size-1)) * 160;
      var dx = x - size*0.5, dy = y - size*0.45, r = size*0.32;
      var d2 = dx*dx + dy*dy;
      if(d2 < r*r){
        var z = Math.sqrt(r*r - d2);
        var lx = -0.5, ly = -0.6, lz = 0.62;
        var lum = Math.max(0, (dx/r)*lx + (dy/r)*ly + (z/r)*lz);
        v = 40 + lum * 215;
      }
      g.push(v);
    }
  }
  return g;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { DT_BAYER4:DT_BAYER4, dtGray:dtGray, dtThreshold:dtThreshold, dtBayer:dtBayer, dtFloyd:dtFloyd, dtDemo:dtDemo };
}
if (typeof window !== 'undefined') {
  window.DitherForgePure = { DT_BAYER4:DT_BAYER4, dtGray:dtGray, dtThreshold:dtThreshold, dtBayer:dtBayer, dtFloyd:dtFloyd, dtDemo:dtDemo };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.DitherForgePure;
    var S = 256, grayData = P.dtDemo(S);
    function paint(cv, gray){
      var ctx = cv.getContext('2d');
      if(!ctx) return;
      var img = ctx.createImageData(S, S);
      for(var i=0;i<S*S;i++){
        var v = Math.max(0, Math.min(255, Math.round(gray[i])));
        img.data[i*4] = v; img.data[i*4+1] = v; img.data[i*4+2] = v; img.data[i*4+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }
    function run(){
      paint($('src'), grayData);
      var algo = $('algo').value, out;
      if(algo === 'fs') out = P.dtFloyd(grayData, S, S);
      else if(algo === 'bayer') out = P.dtBayer(grayData, S, S);
      else out = P.dtThreshold(grayData, S, S);
      paint($('dst'), out);
    }
    $('file').addEventListener('change', function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      var img = new Image();
      img.onload = function(){
        var c = document.createElement('canvas');
        c.width = S; c.height = S;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, S, S);
        var d = ctx.getImageData(0, 0, S, S).data;
        grayData = [];
        for(var i=0;i<S*S;i++) grayData.push(P.dtGray(d[i*4], d[i*4+1], d[i*4+2]));
        run();
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(f);
    });
    $('run').addEventListener('click', run);
    $('algo').addEventListener('change', run);
    run();
  })();
}
</script>
