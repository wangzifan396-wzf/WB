<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}

/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<body>
<div class="app">
  <h1>SortForge</h1>
  <p class="sub">排序观察站：五大排序逐帧轨迹 + 比较/移动横评 · 单文件 · 零依赖 · 本地优先</p>

<div class="opt">
  <label>算法
    <select id="alg">
      <option value="bubble">冒泡 Bubble</option>
      <option value="insertion">插入 Insertion</option>
      <option value="selection">选择 Selection</option>
      <option value="quick">快排 Quick</option>
      <option value="merge">归并 Merge</option>
    </select>
  </label>
</div>
<label>数组（逗号或空格分隔）</label>
<textarea id="txt" rows="3">7, 3, 9, 1, 5, 8, 2, 6, 4</textarea>
<div class="row">
  <button id="run">排序并统计</button>
  <button id="cmp">五算法对比</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>结果</label>
<div class="out" id="out" aria-live="polite" style="overflow:auto">排序轨迹与统计显示在这里</div>
<script>
function stParse(text){
  if(typeof text!=='string'||!text.trim()) return { value:null, error:'数组为空' };
  var parts=text.split(/[\s,，]+/).filter(function(s){ return s!==''; });
  var arr=[];
  for(var i=0;i<parts.length;i++){
    var n=Number(parts[i]);
    if(!isFinite(n)) return { value:null, error:'"'+parts[i]+'" 不是数字' };
    arr.push(n);
  }
  if(arr.length<2) return { value:null, error:'至少需要 2 个数' };
  if(arr.length>64) return { value:null, error:'最多 64 个数' };
  return { value:arr, error:null };
}
function stSort(arr, alg){
  var a=arr.slice(), cmps=0, swaps=0, frames=[a.slice()];
  function snap(){ if(frames.length<400) frames.push(a.slice()); }
  function less(x,y){ cmps++; return x<y; }
  function swap(i,j){ if(i!==j){ var t=a[i]; a[i]=a[j]; a[j]=t; swaps++; snap(); } }
  if(alg==='bubble'){
    for(var i=0;i<a.length-1;i++){
      var moved=false;
      for(var j=0;j<a.length-1-i;j++) if(less(a[j+1],a[j])){ swap(j,j+1); moved=true; }
      if(!moved) break;
    }
  } else if(alg==='insertion'){
    for(var p=1;p<a.length;p++){
      var v=a[p], q=p-1;
      while(q>=0 && less(v,a[q])){ a[q+1]=a[q]; q--; swaps++; }
      a[q+1]=v; snap();
    }
  } else if(alg==='selection'){
    for(var s=0;s<a.length-1;s++){
      var mn=s;
      for(var t2=s+1;t2<a.length;t2++) if(less(a[t2],a[mn])) mn=t2;
      swap(s,mn);
    }
  } else if(alg==='quick'){
    (function qs(lo,hi){
      if(lo>=hi) return;
      var pv=a[hi], k=lo;
      for(var u=lo;u<hi;u++) if(less(a[u],pv)){ swap(u,k); k++; }
      swap(k,hi);
      qs(lo,k-1); qs(k+1,hi);
    })(0,a.length-1);
  } else if(alg==='merge'){
    (function ms(lo,hi){
      if(hi-lo<1) return;
      var mid=(lo+hi)>>1;
      ms(lo,mid); ms(mid+1,hi);
      var buf=[], x=lo, y=mid+1;
      while(x<=mid && y<=hi) buf.push(less(a[y],a[x])?a[y++]:a[x++]);
      while(x<=mid) buf.push(a[x++]);
      while(y<=hi) buf.push(a[y++]);
      for(var w=0;w<buf.length;w++){ a[lo+w]=buf[w]; swaps++; }
      snap();
    })(0,a.length-1);
  } else return { value:null, error:'未知算法: '+alg };
  return { value:{ sorted:a, comparisons:cmps, moves:swaps, frames:frames }, error:null };
}
function stIsSorted(arr){
  for(var i=1;i<arr.length;i++) if(arr[i]<arr[i-1]) return false;
  return true;
}
function stCompare(arr){
  var algs=['bubble','insertion','selection','quick','merge'], out=[];
  for(var i=0;i<algs.length;i++){
    var r=stSort(arr, algs[i]);
    out.push({ alg:algs[i], comparisons:r.value.comparisons, moves:r.value.moves });
  }
  return out;
}
function stSvg(frames){
  var last=frames[frames.length-1], first=frames[0];
  var n=first.length, BW=Math.max(6, Math.min(24, Math.floor(300/n)));
  var mx=Math.max.apply(null, first.concat([1]));
  var rows=[first, last], H=170, W=n*(BW+2)*2+60;
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  s+='<rect width="'+W+'" height="'+H+'" fill="#0A0A0B"/>';
  for(var r2=0;r2<2;r2++){
    var ox=10+r2*(n*(BW+2)+40);
    s+='<text x="'+ox+'" y="16" font-size="11" fill="#A1A1AA" font-family="system-ui,sans-serif">'+(r2===0?'排序前':'排序后')+'</text>';
    for(var i=0;i<n;i++){
      var h=Math.max(3, Math.round((rows[r2][i]/mx)*120));
      s+='<rect x="'+(ox+i*(BW+2))+'" y="'+(150-h)+'" width="'+BW+'" height="'+h+'" rx="2" fill="'+(r2===0?'#5E6AD2':'#10B981')+'"/>';
    }
  }
  s+='</svg>';
  return s;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { stParse:stParse, stSort:stSort, stIsSorted:stIsSorted, stCompare:stCompare, stSvg:stSvg };
}
if (typeof window !== 'undefined') {
  window.SortForgePure = { stParse:stParse, stSort:stSort, stIsSorted:stIsSorted, stCompare:stCompare, stSvg:stSvg };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.SortForgePure;
    var NAMES={ bubble:'冒泡', insertion:'插入', selection:'选择', quick:'快排', merge:'归并' };
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var p=P.stParse($('txt').value);
      if(p.error){ $('err').textContent=p.error; return; }
      var r=P.stSort(p.value, $('alg').value);
      if(r.error){ $('err').textContent=r.error; return; }
      $('out').innerHTML=P.stSvg(r.value.frames)+
        '<div style="margin-top:8px;color:#A1A1AA;font-size:12px">'+NAMES[$('alg').value]+
        ' · 比较 '+r.value.comparisons+' 次 · 移动 '+r.value.moves+' 次 · 快照 '+r.value.frames.length+' 帧</div>'+
        '<div style="margin-top:6px;color:#FFFFFF;font-size:13px">结果: '+r.value.sorted.join(', ')+'</div>';
    });
    $('cmp').addEventListener('click', function(){
      $('err').textContent='';
      var p=P.stParse($('txt').value);
      if(p.error){ $('err').textContent=p.error; return; }
      var rows=P.stCompare(p.value).sort(function(a,b){ return a.comparisons-b.comparisons; });
      var html='<table style="width:100%;border-collapse:collapse;font-size:13px">'+
        '<tr style="color:#A1A1AA"><th style="text-align:left;padding:6px">算法</th><th style="text-align:right;padding:6px">比较</th><th style="text-align:right;padding:6px">移动</th></tr>';
      rows.forEach(function(r,i){
        html+='<tr style="border-top:1px solid rgba(255,255,255,0.08);color:'+(i===0?'#10B981':'#FFFFFF')+'">'+
          '<td style="padding:6px">'+NAMES[r.alg]+(i===0?' ★':'')+'</td>'+
          '<td style="text-align:right;padding:6px">'+r.comparisons+'</td>'+
          '<td style="text-align:right;padding:6px">'+r.moves+'</td></tr>';
      });
      $('out').innerHTML=html+'</table>';
    });
    $('clear').addEventListener('click', function(){ $('txt').value=''; $('out').textContent='排序轨迹与统计显示在这里'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>

</script>
</body>
