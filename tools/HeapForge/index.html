<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);

}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}

input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}

.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}

     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}

footer{margin-top:20px;color:var(--dim);font-size:12px}

:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}

<body>
<div class="app">
  <h1>HeapForge</h1>
  <p class="sub">二叉堆：最小/最大堆，可持久化插入与弹出，堆排序 · 单文件 · 零依赖 · 本地优先</p>

<label>数组（逗号分隔，可重复）</label>
<input id="in" type="text" value="5,3,8,1,2,9,4">
<label>模式</label>
<select id="mode"><option value="min">最小堆（升序）</option><option value="max">最大堆（降序）</option></select>
<div class="row">
  <button id="run">堆排序</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入数组后排序</div>
<script>
function heapPush(arr, val, cmp){
  cmp = cmp || function(a,b){ return a<b; };
  var h = arr.slice();
  h.push(val);
  var i = h.length-1;
  while(i>0){
    var p=(i-1)>>1;
    if(cmp(h[i], h[p])){ var t=h[i]; h[i]=h[p]; h[p]=t; i=p; } else break;
  }
  return h;
}
function heapPop(arr, cmp){
  cmp = cmp || function(a,b){ return a<b; };
  if(arr.length===0) return {value:undefined, heap:[]};
  var h=arr.slice();
  var top=h[0];
  var last=h.pop();
  if(h.length>0){
    h[0]=last; var n=h.length, i=0;
    while(true){
      var l=2*i+1, r=2*i+2, m=i;
      if(l<n && cmp(h[l],h[m])) m=l;
      if(r<n && cmp(h[r],h[m])) m=r;
      if(m===i) break;
      var t=h[i]; h[i]=h[m]; h[m]=t; i=m;
    }
  }
  return {value:top, heap:h};
}
function heapify(arr, cmp){ cmp=cmp||function(a,b){return a<b;}; var h=[]; for(var i=0;i<arr.length;i++) h=heapPush(h,arr[i],cmp); return h; }
function heapSort(arr, cmp){
  cmp=cmp||function(a,b){return a<b;};
  var h=heapify(arr, cmp), out=[];
  while(h.length){ var r=heapPop(h, cmp); out.push(r.value); h=r.heap; }
  return out;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { heapPush:heapPush, heapPop:heapPop, heapify:heapify, heapSort:heapSort };
}
if (typeof window !== 'undefined') {
  window.HeapForgePure = { heapPush:heapPush, heapPop:heapPop, heapify:heapify, heapSort:heapSort };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.HeapForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var a=$('in').value.split(',').map(function(x){return Number(x.trim());}).filter(function(x){return !isNaN(x);});
        var cmp = $('mode').value==='max' ? function(a,b){return a>b;} : function(a,b){return a<b;};
        var s=P.heapSort(a, cmp);
        $('out').textContent=s.join(', ');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('out').textContent='输入数组后排序'; });
  })();
}
</script>
