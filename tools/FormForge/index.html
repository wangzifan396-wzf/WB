<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title data-i18n="meta_title">FormForge · 表单构建器</title>
<meta name="description" content="FormForge — 本地优先的离线表单构建器：拖拽式添加文本/选择/单选/多选/日期等字段，实时预览，一键导出独立 HTML 或 JSON Schema，零依赖纯前端，数据留在你自己的浏览器。">
<meta property="og:title" content="FormForge · 表单构建器">
<meta property="og:description" content="本地优先的离线表单构建器：可视化添加字段、实时预览、导出独立 HTML 或 JSON Schema。">
<meta property="og:image" content="og.svg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="FormForge · 表单构建器">
<meta name="twitter:description" content="本地优先的离线表单构建器：可视化添加字段、实时预览、导出独立 HTML 或 JSON Schema。">
<meta name="twitter:image" content="og.svg">
<style>
:root{
  --bg:#0A0A0B; --surface:#141417; --surface-2:#1A1B1E; --surface-3:#202125;
  --text:#FFFFFF; --muted:#A1A1AA; --faint:#71717A;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
  --accent:#5E6AD2; --accent-soft:rgba(94,106,210,0.16);
  --ok:#10B981; --warn:#F5A623; --danger:#F5365C;
  --radius:10px;
}
[data-theme="light"]{
  --bg:#FFFFFF; --surface:#F7F8FA; --surface-2:#EEF0F3; --surface-3:#E4E7EC;
  --text:#18181B; --muted:#52525B; --faint:#71717A;
  --border:rgba(0,0,0,0.10); --border-strong:rgba(0,0,0,0.18);
  --accent-soft:rgba(94,106,210,0.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;
}
.app{max-width:1240px;margin:0 auto;padding:18px 18px 64px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:22px;margin:0;letter-spacing:-.02em}
.brand .tag{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{
  background:var(--surface); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:8px 10px; font-size:13px;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{
  background:var(--surface); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:8px 12px; cursor:pointer; font-size:13px; font-weight:600;
  transition:border-color .12s ease,transform .12s ease,background .12s ease; white-space:nowrap;
}
.btn:hover{border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{padding:8px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.settings{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted)}
.field input{width:100%}
.fhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.fhead-t{font-weight:700;font-size:14px}
.fhead .row select{min-width:140px}
.field-list{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.frow .fname{font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftype{font-size:10px;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border:1px solid var(--border);border-radius:6px;padding:2px 6px;font-weight:700}
.freq{color:var(--danger);font-weight:800}
.fdot{background:var(--surface-3);border:none;color:var(--muted);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:11px;line-height:1;display:grid;place-items:center}
.fdot:hover:not(:disabled){color:var(--text)}
.frow .act{background:var(--surface-3);border:none;color:var(--muted);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:13px}
.frow .act:hover{color:var(--text)}
.frow .act.del:hover{color:var(--danger)}
.empty{color:var(--faint);text-align:center;padding:28px 0;font-size:13px}
.preview{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:sticky;top:18px}
.pv-head{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.pv-body{min-height:120px}
.valid{margin-top:12px;font-size:12px;font-weight:600}
.valid.ok{color:var(--ok)} .valid.bad{color:var(--danger)}
/* 预览内表单样式 */
.ff-form{font:14px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC",sans-serif;color:var(--text)}
.ff-form h2{font-size:18px;margin:0 0 4px}
.ff-desc{color:var(--muted);margin:0 0 14px;font-size:13px}
.ff-field{margin-bottom:14px}
.ff-label{display:block;font-weight:600;margin-bottom:6px;font-size:13px}
.ff-req{color:var(--danger);margin-left:4px}
.ff-form input,.ff-form select,.ff-form textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);font:inherit;box-sizing:border-box}
.ff-form textarea{min-height:84px;resize:vertical}
.ff-help{display:block;color:var(--faint);font-size:12px;margin-top:5px}
.ff-opt{display:block;font-weight:400;margin:6px 0;cursor:pointer;font-size:13px}
.ff-submit{margin-top:6px;background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:100;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;width:540px;max-width:100%;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:17px}
.modal .field textarea{min-height:64px;resize:vertical}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ck{display:flex;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
@media (max-width:640px){.row{width:100%}.main{grid-template-columns:1fr}.preview{position:static}}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>FormForge</h1>
      <span class="tag" data-i18n-html="Local-first form builder">本地优先的表单构建器</span>
    </div>
    <div class="row">
      <select id="formSel" title="表单"></select>
      <button class="btn" id="newForm" title="新建表单">＋ 新建表单</button>
    </div>
    <div class="row" style="margin-left:auto">
      <button class="btn" id="expHtml" title="导出为独立 HTML">导出 HTML</button>
      <button class="btn" id="expJson" title="导出 JSON Schema">导出 JSON</button>
      <button class="btn" id="impBtn" title="导入 JSON">导入</button>
      <input type="file" id="impFile" accept="application/json" hidden>
      <button class="btn icon" id="themeBtn" title="主题">◐</button>
    </div>
  </div>
  <div class="main">
    <section class="builder">
      <div class="card settings">
        <div class="field"><label>表单标题</label><input id="fTitle" placeholder="如：用户反馈" aria-label="如：用户反馈"></div>
        <div class="field"><label>表单说明</label><input id="fDesc" placeholder="一句话说明这个表单的用途" aria-label="一句话说明这个表单的用途"></div>
        <div class="field"><label>提交按钮文字</label><input id="fSubmit" placeholder="提交" aria-label="提交"></div>
      </div>
      <div class="card">
        <div class="fhead">
          <span class="fhead-t">字段</span>
          <span class="row"><select id="addType"></select><button class="btn primary" id="addBtn" type="button">添加字段</button></span>
        </div>
        <div id="fieldList" class="field-list"></div>
      </div>
    </section>
    <section class="preview">
      <div class="pv-head">预览</div>
      <div id="preview" class="pv-body"></div>
      <div id="validMsg" class="valid"></div>
    </section>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <h3 id="modalTitle">编辑字段</h3>
    <div class="field"><label>标签</label><input id="eLabel" placeholder="字段显示名称" aria-label="字段显示名称"></div>
    <div class="field"><label>字段名 (name)</label><input id="eName" placeholder="如：email" aria-label="如：email"></div>
    <div class="field"><label>占位符 placeholder</label><input id="ePlaceholder" placeholder="输入提示" aria-label="输入提示"></div>
    <div class="field"><label class="ck"><input type="checkbox" id="eRequired"> 必填</label></div>
    <div class="field"><label>帮助文字</label><input id="eHelp" placeholder="字段下方的说明" aria-label="字段下方的说明"></div>
    <div class="field" id="eOptsWrap"><label>选项（每行一个）</label><textarea id="eOpts" placeholder="选项一&#10;选项二"></textarea></div>
    <div class="grid3" id="eRangeWrap">
      <div class="field"><label>最小值</label><input id="eMin" placeholder="0" aria-label="0"></div>
      <div class="field"><label>最大值</label><input id="eMax" placeholder="100" aria-label="100"></div>
      <div class="field"><label>步长</label><input id="eStep" placeholder="1" aria-label="1"></div>
    </div>
    <div class="foot" style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px">
      <button class="btn" id="mCancel" type="button">取消</button>
      <button class="btn primary" id="mSave" type="button">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== FormForge 主脚本（纯函数 + UI） ===== */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function clone(o){ try{ return JSON.parse(JSON.stringify(o)); }catch(e){ return JSON.parse(JSON.stringify(o||{})); } }
function uid(p){ p=p||'id'; return p+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3); }

var FORM_CSS = '.ff-form{max-width:560px;margin:28px auto;font:14px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#18181B}'+
  '.ff-form h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}.ff-desc{color:#71717A;margin:0 0 18px;font-size:13px}'+
  '.ff-field{margin-bottom:15px}.ff-label{display:block;font-weight:600;margin-bottom:6px;font-size:13px}'+
  '.ff-req{color:#E5484D;margin-left:4px}'+
  '.ff-form input,.ff-form select,.ff-form textarea{width:100%;padding:10px 12px;border:1px solid #D6D9E0;border-radius:8px;font:inherit;box-sizing:border-box;background:#fff}'+
  '.ff-form textarea{min-height:90px;resize:vertical}.ff-help{display:block;color:#71717A;font-size:12px;margin-top:5px}'+
  '.ff-opt{display:block;font-weight:400;margin:6px 0;cursor:pointer;font-size:14px}'+
  '.ff-submit{margin-top:8px;background:#5E6AD2;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}'+
  '.ff-submit:hover{filter:brightness(1.06)}';

function fieldCatalog(){
  return [
    {type:'text',label:'单行文本'},{type:'textarea',label:'多行文本'},{type:'email',label:'邮箱'},
    {type:'number',label:'数字'},{type:'tel',label:'电话'},{type:'password',label:'密码'},
    {type:'url',label:'网址'},{type:'date',label:'日期'},{type:'select',label:'下拉选择'},
    {type:'radio',label:'单选'},{type:'checkbox',label:'多选'},{type:'range',label:'滑块'},
    {type:'color',label:'颜色'}
  ];
}
function newField(type){
  var cat=fieldCatalog(); var c=null;
  for(var i=0;i<cat.length;i++){ if(cat[i].type===type){ c=cat[i]; break; } }
  if(!c) c=cat[0];
  var isOpt=(c.type==='select'||c.type==='radio'||c.type==='checkbox');
  return { id:uid('f'), type:c.type, label:c.label, name:'', placeholder:'', required:false,
    help:'', options:isOpt?['选项一','选项二']:[], min:'', max:'', step:'' };
}
function newForm(name){
  var f=newField('text'); f.name='name'; f.label='姓名';
  return { id:uid('fm'), name:name||'我的表单', title:'未命名表单', description:'', submitLabel:'提交', fields:[f] };
}
function addField(form,field){ var f=clone(form); f.fields=(f.fields||[]).concat([clone(field)]); return f; }
function updateField(form,fieldId,patch){ var f=clone(form); f.fields=f.fields.map(function(x){ return x.id===fieldId?Object.assign(clone(x),patch):x; }); return f; }
function deleteField(form,fieldId){ var f=clone(form); f.fields=f.fields.filter(function(x){ return x.id!==fieldId; }); return f; }
function moveField(form,fieldId,toIndex){
  var f=clone(form); var arr=f.fields; var from=-1;
  for(var i=0;i<arr.length;i++){ if(arr[i].id===fieldId){ from=i; break; } }
  if(from<0) return f;
  var item=arr.splice(from,1)[0];
  var t=toIndex; if(t<0) t=0; if(t>arr.length) t=arr.length;
  arr.splice(t,0,item); return f;
}
function sanitizeName(s){
  s=String(s==null?'':s).trim().toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'');
  return s;
}
function uniqueName(form,base){
  var b=sanitizeName(base)||'field';
  var names={}; (form.fields||[]).forEach(function(x){ if(x.name) names[x.name]=1; });
  if(!names[b]) return b;
  var i=2; while(names[b+'_'+i]) i++;
  return b+'_'+i;
}
function rangeAttrs(f){
  var a='';
  if(f.min!==''&&f.min!=null) a+=' min="'+escapeHtml(f.min)+'"';
  if(f.max!==''&&f.max!=null) a+=' max="'+escapeHtml(f.max)+'"';
  if(f.step!==''&&f.step!=null) a+=' step="'+escapeHtml(f.step)+'"';
  return a;
}
function renderFieldHtml(f){
  var id='ff_'+f.id;
  var nm=escapeHtml(f.name||id);
  var lab=escapeHtml(f.label||'');
  var ph=escapeHtml(f.placeholder||'');
  var help=f.help?('<small class="ff-help">'+escapeHtml(f.help)+'</small>'):'';
  var req=f.required?' required':'';
  var reqMark=f.required?'<span class="ff-req">*</span>':'';
  var ctrl='';
  if(f.type==='textarea'){
    ctrl='<textarea id="'+id+'" name="'+nm+'" placeholder="'+ph+'"'+req+'></textarea>';
  } else if(f.type==='select'){
    var opts=(f.options&&f.options.length?f.options:['选项']).map(function(o){ return '<option value="'+escapeHtml(o)+'">'+escapeHtml(o)+'</option>'; }).join('');
    ctrl='<select id="'+id+'" name="'+nm+'"'+req+'>'+opts+'</select>';
  } else if(f.type==='radio'){
    ctrl=(f.options&&f.options.length?f.options:['选项']).map(function(o){ return '<label class="ff-opt"><input type="radio" name="'+nm+'" value="'+escapeHtml(o)+'"> '+escapeHtml(o)+'</label>'; }).join('');
  } else if(f.type==='checkbox'){
    ctrl=(f.options&&f.options.length?f.options:['选项']).map(function(o){ return '<label class="ff-opt"><input type="checkbox" name="'+nm+'[]" value="'+escapeHtml(o)+'"> '+escapeHtml(o)+'</label>'; }).join('');
  } else if(f.type==='range'){
    ctrl='<input type="range" id="'+id+'" name="'+nm+'"'+rangeAttrs(f)+req+'>';
  } else if(f.type==='number'){
    ctrl='<input type="number" id="'+id+'" name="'+nm+'" placeholder="'+ph+'"'+rangeAttrs(f)+req+'>';
  } else {
    ctrl='<input type="'+f.type+'" id="'+id+'" name="'+nm+'" placeholder="'+ph+'"'+req+'>';
  }
  return '<div class="ff-field"><label class="ff-label" for="'+id+'">'+lab+reqMark+'</label>'+ctrl+help+'</div>';
}
function renderFormInner(form){
  var fields=(form.fields||[]).map(renderFieldHtml).join('');
  var btn='<button type="submit" class="ff-submit">'+escapeHtml(form.submitLabel||'提交')+'</button>';
  return '<form class="ff-form" onsubmit="return false">'+fields+btn+'</form>';
}
function renderFormHtml(form){
  return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>'+escapeHtml(form.title||'Form')+'</title>\n<style>\n'+FORM_CSS+'\n</style>\n</head>\n<body>\n'+
    (form.title?('<h2>'+escapeHtml(form.title)+'</h2>'):'')+'\n'+
    (form.description?('<p class="ff-desc">'+escapeHtml(form.description)+'</p>'):'')+'\n'+
    renderFormInner(form)+'\n</body>\n</html>';
}
function validateForm(form){
  var errs=[]; var seen={};
  (form.fields||[]).forEach(function(f,i){
    if(!f.label||!f.label.trim()) errs.push('第'+(i+1)+'个字段缺少标签');
