<style>

body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}

     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}

<body>
<div class="app">
  <h1>DijkstraForge</h1>
  <p class="sub">Dijkstra 最短路径：非负权重图单源最短路与路径还原 · 单文件 · 零依赖 · 本地优先</p>

<label>图（邻接表，每行：起点 终点 权重）</label>
<textarea id="g" rows="4">A B 4
A C 2
B C 1
C D 3</textarea>
<label>起点</label>
<input id="src" type="text" value="A">
<label>终点</label>
<input id="dst" type="text" value="D">
<div class="row">
  <button id="run">最短路径</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入图后计算</div>
<script>
function dijkstra(graph, start){
  var dist={}, prev={}, Q={};
  for(var n in graph){ if(!(n in dist)){ dist[n]=Infinity; Q[n]=true; } }
  for(var n2 in graph){ var es=graph[n2]; for(var i=0;i<es.length;i++){ var v=es[i][0]; if(!(v in dist)){ dist[v]=Infinity; Q[v]=true; } } }
  if(!(start in dist)){ dist[start]=0; Q[start]=true; }
  else { dist[start]=0; }
  while(true){
    var u=null, best=Infinity;
    for(var k in Q){ if(dist[k]<best){ best=dist[k]; u=k; } }
    if(u===null) break;
    delete Q[u];
    var edges = graph[u] || [];
    for(var i=0;i<edges.length;i++){
      var v=edges[i][0], w=edges[i][1];
      var dv = (dist[v]===undefined ? Infinity : dist[v]);
      if(dist[u]+w < dv){ dist[v]=dist[u]+w; prev[v]=u; }
    }
  }
  return {dist:dist, prev:prev};
}
function dijkstraPath(result, start, target){
  if(result.dist[target]===undefined || result.dist[target]===Infinity) return null;
  var path=[], cur=target;
  while(cur!==undefined){
    path.unshift(cur);
    if(cur===start) break;
    cur=result.prev[cur];
  }
  return path;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { dijkstra:dijkstra, dijkstraPath:dijkstraPath };
}
if (typeof window !== 'undefined') {
  window.DijkstraForgePure = { dijkstra:dijkstra, dijkstraPath:dijkstraPath };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.DijkstraForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var graph={};
        $('g').value.trim().split('\n').forEach(function(line){
          var p=line.trim().split(/\s+/);
          if(p.length<3) return;
          if(!graph[p[0]]) graph[p[0]]=[];
          graph[p[0]].push([p[1], Number(p[2])]);
        });
        var r=P.dijkstra(graph, $('src').value.trim());
        var path=P.dijkstraPath(r, $('src').value.trim(), $('dst').value.trim());
        var d=r.dist[$('dst').value.trim()];
        $('out').textContent='距离: '+(d===Infinity?'不可达':d)+'\n路径: '+(path?path.join(' → '):'无');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('out').textContent='输入图后计算'; });
  })();
}
</script>
