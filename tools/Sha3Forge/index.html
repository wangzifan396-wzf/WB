*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}

.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}

     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}

<body>
<div class="app">
  <h1>Sha3Forge</h1>
  <p class="sub">SHA-3 / Keccak-256 哈希：FIPS 202 海绵结构，纯 JS 实现 · 单文件 · 零依赖 · 本地优先</p>

<label>输入文本</label>
<textarea id="in" rows="4">abc</textarea>
<div class="opt">
  <label>算法
    <select id="algo">
      <option value="sha3_256">SHA3-256</option>
      <option value="sha3_512">SHA3-512</option>
      <option value="keccak256">Keccak-256 (Ethereum)</option>
    </select>
  </label>
</div>
<div class="row">
  <button id="run">计算哈希</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入文本后运行</div>
<script>
var _B0=BigInt(0), _B1=BigInt(1), _B8=BigInt(8), _B64=BigInt(64);
var _M64=(_B1<<_B64)-_B1;
function _rotl64(x,n){ var bn=BigInt(n); return ((x<<bn)|(x>>(_B64-bn)))&_M64; }
var _RC=['1','8082','800000000000808a','8000000080008000','808b','80000001',
  '8000000080008081','8000000000008009','8a','88','80008009','8000000a',
  '8000808b','800000000000008b','8000000000008089','8000000000008003',
  '8000000000008002','8000000000000080','800a','800000008000000a',
  '8000000080008081','8000000000008080','80000001','8000000080008008']
  .map(function(h){ return BigInt('0x'+h); });
var _RHO=[0,1,62,28,27,36,44,6,55,20,3,10,43,25,39,41,45,15,21,8,18,2,61,56,14];
function keccakF(A){
  for(var round=0;round<24;round++){
    var C=[],D=[],x,y;
    for(x=0;x<5;x++) C[x]=A[x]^A[x+5]^A[x+10]^A[x+15]^A[x+20];
    for(x=0;x<5;x++) D[x]=C[(x+4)%5]^_rotl64(C[(x+1)%5],1);
    for(x=0;x<5;x++) for(y=0;y<5;y++) A[x+5*y]=A[x+5*y]^D[x];
    var B=[];
    for(x=0;x<5;x++) for(y=0;y<5;y++) B[y+5*((2*x+3*y)%5)]=_rotl64(A[x+5*y],_RHO[x+5*y]);
    for(x=0;x<5;x++) for(y=0;y<5;y++)
      A[x+5*y]=B[x+5*y]^(((~B[(x+1)%5+5*y])&_M64)&B[(x+2)%5+5*y]);
    A[0]=A[0]^_RC[round];
  }
  return A;
}
function utf8Bytes(str){
  var out=[];
  for(var i=0;i<str.length;i++){
    var c=str.codePointAt(i);
    if(c>0xFFFF) i++;
    if(c<0x80) out.push(c);
    else if(c<0x800){ out.push(0xC0|(c>>6),0x80|(c&63)); }
    else if(c<0x10000){ out.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63)); }
    else { out.push(0xF0|(c>>18),0x80|((c>>12)&63),0x80|((c>>6)&63),0x80|(c&63)); }
  }
  return out;
}
function keccakSponge(bytes, rateBytes, outBytes, padByte){
  var A=[],i,b;
  for(i=0;i<25;i++) A[i]=_B0;
  var msg=bytes.slice();
  msg.push(padByte);
  while(msg.length%rateBytes!==0) msg.push(0);
  msg[msg.length-1]|=0x80;
  for(var off=0;off<msg.length;off+=rateBytes){
    for(i=0;i<rateBytes/8;i++){
      var lane=_B0;
      for(b=7;b>=0;b--) lane=(lane<<_B8)|BigInt(msg[off+i*8+b]);
      A[i]=A[i]^lane;
    }
    keccakF(A);
  }
  var out=[];
  while(out.length<outBytes){
    for(i=0;i<rateBytes/8&&out.length<outBytes;i++){
      var l=A[i];
      for(b=0;b<8&&out.length<outBytes;b++){ out.push(Number(l&BigInt(255))); l=l>>_B8; }
    }
    if(out.length<outBytes) keccakF(A);
  }
  return out;
}
function toHex(bytes){
  var s='';
  for(var i=0;i<bytes.length;i++) s+=(bytes[i]<16?'0':'')+bytes[i].toString(16);
  return s;
}
function sha3_256(str){ return toHex(keccakSponge(utf8Bytes(str),136,32,0x06)); }
function sha3_512(str){ return toHex(keccakSponge(utf8Bytes(str),72,64,0x06)); }
function keccak256(str){ return toHex(keccakSponge(utf8Bytes(str),136,32,0x01)); }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { sha3_256:sha3_256, sha3_512:sha3_512, keccak256:keccak256, utf8Bytes:utf8Bytes };
}
if (typeof window !== 'undefined') {
  window.Sha3ForgePure = { sha3_256:sha3_256, sha3_512:sha3_512, keccak256:keccak256 };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.Sha3ForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var algo=$('algo').value;
        var h=P[algo]($('in').value);
        $('out').textContent=algo.replace('_','-').toUpperCase()+'\n'+h;
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('out').textContent='输入文本后运行'; });
  })();
}
</script>
