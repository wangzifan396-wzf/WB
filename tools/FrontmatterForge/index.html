:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);

*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}

/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<body>
<div class="app">
  <h1>FrontmatterForge</h1>
  <p class="sub">Markdown front-matter：YAML 子集解析、必填字段校验、重复键与 SEO 长度提醒、规范化回写 · 单文件 · 零依赖 · 本地优先</p>

<label>Markdown 全文（含 --- front-matter ---）</label>
<textarea id="src" rows="12" spellcheck="false"></textarea>
<div class="row">
  <label style="margin:0">必填字段（逗号分隔）</label>
  <input type="text" id="req" value="title,date" style="max-width:220px">
  <button id="run">解析并检查</button>
  <button id="fmt" class="ghost">规范化输出</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>

function fmScalar(raw){
  var v=String(raw).trim();
  if(v==='') return '';
  if((v[0]==='"' && v.slice(-1)==='"') || (v[0]==="'" && v.slice(-1)==="'")) return v.slice(1,-1);
  if(v==='true') return true;
  if(v==='false') return false;
  if(v==='null' || v==='~') return null;
  if(/^-?\d+$/.test(v)) return parseInt(v,10);
  if(/^-?\d*\.\d+$/.test(v)) return parseFloat(v);
  if(v[0]==='[' && v.slice(-1)===']'){
    var inner=v.slice(1,-1).trim();
    if(!inner) return [];
    return inner.split(',').map(function(x){ return fmScalar(x); });
  }
  return v;
}
function fmSplit(text){
  var s=String(text==null?'':text).replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  var m=s.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!m) return { has:false, raw:'', body:s };
  return { has:true, raw:m[1], body:m[2] };
}
function fmParse(text){
  var sp=fmSplit(text);
  if(!sp.has) return { error:null, has:false, data:{}, body:sp.body, order:[] };
  var lines=sp.raw.split('\n'), data={}, order=[], curKey=null, dup=[];
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    if(!ln.trim() || /^\s*#/.test(ln)) continue;
    var li=ln.match(/^\s*-\s+(.*)$/);
    if(li && curKey){
      if(!Array.isArray(data[curKey])) data[curKey]=[];
      data[curKey].push(fmScalar(li[1]));
      continue;
    }
    var kv=ln.match(/^([A-Za-z0-9_.\-]+)\s*:\s*(.*)$/);
    if(!kv) return { error:'第 '+(i+1)+' 行无法解析：'+ln.trim() };
    var k=kv[1];
    if(Object.prototype.hasOwnProperty.call(data,k)) dup.push(k);
    else order.push(k);
    curKey=k;
    data[k] = kv[2].trim()==='' ? [] : fmScalar(kv[2]);
  }
  return { error:null, has:true, data:data, body:sp.body, order:order, dup:dup };
}
function fmDump(value){
  if(Array.isArray(value)) return '['+value.map(function(v){ return fmDump(v); }).join(', ')+']';
  if(value===null) return 'null';
  if(typeof value==='boolean' || typeof value==='number') return String(value);
  var s=String(value);
  return /[:#\[\]{}]|^\s|\s$/.test(s) ? '"'+s.replace(/"/g,'\\"')+'"' : s;
}
function fmStringify(data, order, body){
  var keys=(order&&order.length? order : Object.keys(data)), out='---\n';
  for(var i=0;i<keys.length;i++){
    var k=keys[i], v=data[k];
    if(Array.isArray(v) && v.length && v.some(function(x){ return typeof x==='string' && x.length>18; })){
      out += k+':\n';
      for(var j=0;j<v.length;j++) out += '  - '+fmDump(v[j])+'\n';
    } else out += k+': '+fmDump(v)+'\n';
  }
  return out+'---\n'+(body||'');
}
function fmLint(parsed, required){
  var issues=[];
  if(!parsed.has){ issues.push({ level:'error', msg:'\u7f3a\u5c11 front-matter \u5757' }); return issues; }
  var req=required||[];
  for(var i=0;i<req.length;i++)
    if(!Object.prototype.hasOwnProperty.call(parsed.data, req[i]))
      issues.push({ level:'error', msg:'\u7f3a\u5c11\u5fc5\u586b\u5b57\u6bb5\uff1a'+req[i] });
  for(var d=0; d<(parsed.dup||[]).length; d++)
    issues.push({ level:'warn', msg:'\u91cd\u590d\u5b57\u6bb5\uff1a'+parsed.dup[d] });
  if(parsed.data.title && String(parsed.data.title).length>60)
    issues.push({ level:'warn', msg:'title \u8d85\u8fc7 60 \u5b57\u7b26\uff0c\u4e0d\u5229\u4e8e SEO' });
  if(parsed.data.description && String(parsed.data.description).length>160)
    issues.push({ level:'warn', msg:'description \u8d85\u8fc7 160 \u5b57\u7b26' });
  return issues;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { fmScalar:fmScalar, fmSplit:fmSplit, fmParse:fmParse, fmDump:fmDump, fmStringify:fmStringify, fmLint:fmLint };
}
if (typeof window !== 'undefined') {
  window.FrontmatterForgePure = { fmScalar:fmScalar, fmSplit:fmSplit, fmParse:fmParse, fmDump:fmDump, fmStringify:fmStringify, fmLint:fmLint };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.FrontmatterForgePure;
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function run(){
    var r=P.fmParse($('src').value);
    if(r.error){ $('err').textContent=r.error; $('out').innerHTML=''; return; }
    var req=$('req').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    var issues=P.fmLint(r, req);
    $('err').textContent = issues.length ? (issues.length+' 项待处理') : '';
    var h='<div class="kv"><b>字段数</b><span>'+Object.keys(r.data).length+'</span></div>'+
          '<div class="kv"><b>正文字数</b><span>'+r.body.replace(/\s/g,'').length+'</span></div>';
    for(var k in r.data) h+='<div class="kv"><b>'+esc(k)+'</b><span>'+esc(P.fmDump(r.data[k]))+'</span></div>';
    for(var i=0;i<issues.length;i++)
      h+='<div class="kv"><b style="color:'+(issues[i].level==='error'?'#EF4444':'#F5A623')+'">'+issues[i].level+'</b><span>'+esc(issues[i].msg)+'</span></div>';
    $('out').innerHTML=h;
  }
  $('run').addEventListener('click', run);
  $('fmt').addEventListener('click', function(){
    var r=P.fmParse($('src').value);
    if(r.error){ $('err').textContent=r.error; return; }
    $('src').value=P.fmStringify(r.data, r.order, r.body); run();
  });
  $('src').value='---\ntitle: nano-tools \u5355\u6587\u4ef6\u5de5\u5177\u77e9\u9635\ndate: 2026-07-30\ndraft: false\ntags: [offline, tools, html]\n---\n\n\u6b63\u6587\u4ece\u8fd9\u91cc\u5f00\u59cb\u3002';
  run();
})();

</script>
