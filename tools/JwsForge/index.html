function utf8Bytes(str){
  var b=[];

    var c=str.charCodeAt(i);
    if(c<0x80) b.push(c);
    else if(c<0x800) b.push(0xc0|(c>>6),0x80|(c&0x3f));
    else if(c>=0xd800&&c<=0xdbff){

  }

}
function bytesToUtf8(b){
  var s='',i=0;

    else if(c<0xe0){ s+=String.fromCharCode(((c&0x1f)<<6)|(b[i+1]&0x3f)); i+=2; }
    else if(c<0xf0){ s+=String.fromCharCode(((c&0x0f)<<12)|((b[i+1]&0x3f)<<6)|(b[i+2]&0x3f)); i+=3; }
    else {
      var cp=((c&0x07)<<18)|((b[i+1]&0x3f)<<12)|((b[i+2]&0x3f)<<6)|(b[i+3]&0x3f);
      cp-=0x10000; s+=String.fromCharCode(0xd800+(cp>>10),0xdc00+(cp&0x3ff)); i+=4;
    }

function toHex(b){ var s=''; for(var i=0;i<b.length;i++) s+=('0'+(b[i]&0xff).toString(16)).slice(-2); return s; }

function colonHex(b){ var p=[]; for(var i=0;i<b.length;i++) p.push(('0'+(b[i]&0xff).toString(16)).slice(-2)); return p.join(':'); }

    s+=B64A[(n>>18)&63]+B64A[(n>>12)&63]+B64A[(n>>6)&63]+B64A[n&63];

  if(rem===1){ var m=b[i]<<16; s+=B64A[(m>>18)&63]+B64A[(m>>12)&63]+'=='; }
  else if(rem===2){ var k=(b[i]<<16)|(b[i+1]<<8); s+=B64A[(k>>18)&63]+B64A[(k>>12)&63]+B64A[(k>>6)&63]+'='; }

  s=String(s).replace(/[\s\r\n]/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/=+$/,'');
  var b=[],buf=0,bits=0;
  for(var i=0;i<s.length;i++){
    var v=B64A.indexOf(s[i]);
    if(v<0) throw new Error('base64 含非法字符 "'+s[i]+'"（第 '+(i+1)+' 位）');
    buf=(buf<<6)|v; bits+=6;
    if(bits>=8){ bits-=8; b.push((buf>>bits)&0xff); }

function b64url(b){ return b64encode(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

function digestInfo(name, hash){
  var oid = name==='sha256' ? [0x60,0x86,0x48,0x01,0x65,0x03,0x04,0x02,0x01]

  var algid=[0x30,0x0d,0x06,0x09].concat(oid,[0x05,0x00]);

  return [0x30, algid.length+oct.length].concat(algid, oct);

  var N=bnFromBytes(nB), E=bnFromBytes(eB);
  var k=nB.length;
  if(sig.length>k || sig.length<11) return false;
  var s=bnFromBytes(sig);
  if(s>=N) return false;
  var em=bnToBytes(modExp(s, E, N), k);
  var T=digestInfo(hashName, hash);
  if(k < T.length+11) return false;
  var pslen=k-T.length-3;
  var want=[0x00,0x01];
  for(var i=0;i<pslen;i++) want.push(0xff);
  want.push(0x00); want=want.concat(T);
  if(want.length!==em.length) return false;
  for(var i=0;i<em.length;i++) if(em[i]!==want[i]) return false;
  return true;
}

  var pslen=k-T.length-3, EM=[0x00,0x01];
  for(var i=0;i<pslen;i++) EM.push(0xff);
  EM.push(0x00); EM=EM.concat(T);
  var m=bnFromBytes(EM);
  return bnToBytes(modExp(m, D, N), k);

function hashByName(name, msg){
  if(name==='sha256') return sha256Bytes(msg);
  if(name==='sha384') return sha384Bytes(msg);
  if(name==='sha512') return sha512Bytes(msg);
  throw new Error('不支持的哈希 '+name);
}
function hmacByName(name, key, msg){
  if(name==='sha256') return hmacSha256(key,msg);
  if(name==='sha384') return hmacSha384(key,msg);
  if(name==='sha512') return hmacSha512(key,msg);
  throw new Error('不支持的 HMAC '+name);
}

  try { asJson=JSON.parse(text); } catch(e){ asJson=null; }
  if(asJson && typeof asJson==='object'){
    if(asJson.signatures && Array.isArray(asJson.signatures)){
      var gens=asJson.signatures.map(function(sg){
        var prot=sg.protected||'';
        var hdr=sg.header||{};
        var ph=null; try { ph=JSON.parse(b64uStr(prot)||'{}'); } catch(e){ ph=null; }
        return {protectedB64:prot, unprotected:hdr, header:ph, signature:sg.signature||''};
      });
      return {format:'general', payloadB64:asJson.payload||'',
              detached:!(asJson.payload), signatures:gens};
    }
    if(typeof asJson.signature==='string'){
      var prot=asJson.protected||'';
      var ph=null; try { ph=JSON.parse(b64uStr(prot)||'{}'); } catch(e){ ph=null; }
      return {format:'flattened', payloadB64:asJson.payload||'', protectedB64:prot,
              detached:!(asJson.payload),
              unprotected:asJson.header||{}, header:ph, signature:asJson.signature,
              signatures:[{protectedB64:prot, unprotected:asJson.header||{},
                           header:ph, signature:asJson.signature}]};
    }
    return {error:'JSON 序列化缺少 signature / signatures 字段'};
  }
  // 紧凑
  var p=text.split('.');
  if(p.length!==3) return {error:'紧凑序列化必须是 header.payload.signature 三段（用 . 分隔），当前为 '+p.length+' 段'};
  var ph=null; try { ph=JSON.parse(b64uStr(p[0])||'{}'); } catch(e){ return {error:'受保护头不是合法 JSON：'+e.message}; }
  var detached=(p[1]==='');
  return {format:'compact', protectedB64:p[0], payloadB64:p[1], detached:detached,
          header:ph, signature:p[2],
          signatures:[{protectedB64:p[0], unprotected:{}, header:ph, signature:p[2]}]};
}

/* ---- 验签：对每个签名用给定 JWK 校核 ---- */
function verifyJws(text, jwk){
  var parsed=parseJws(text);
  if(parsed.error) return {verdict:'error', reason:parsed.error};
  var payloadBytes = parsed.payloadB64 ? (parsed.detached?null:b64urlDecode(parsed.payloadB64)) : null;
  var payloadText = parsed.payloadB64 ? (parsed.detached?'(detached)':b64uStr(parsed.payloadB64)) : null;
  var results = parsed.signatures.map(function(sg){
    var result = {protectedHeader:sg.header, unprotected:sg.unprotected, signatureB64:sg.signature};
    var alg = (sg.header&&sg.header.alg) || (sg.unprotected&&sg.unprotected.alg);
    var protStr = sg.protectedB64 || '';
    result.alg = alg;
    if(!alg) { result.valid=false; result.reason='找不到 alg'; return result; }
    var spec=JWS_ALGS[alg];
    if(!spec){ result.valid=false; result.reason='暂不支持的 alg '+alg; return result; }
    var signingInput = protStr + '.' + (parsed.payloadB64||'');
    var msg = utf8Bytes(signingInput);
    var hash = hashByName(spec.hash, msg);
    var sigBytes; try { sigBytes=b64urlDecode(sg.signature); } catch(e){ result.valid=false; result.reason='签名不是合法 base64url'; return result; }
    if(spec.fam==='HMAC'){
      if(!jwk || jwk.kty!=='oct' || !jwk.k){ result.valid=false; result.reason='HMAC 需要 oct 类型 JWK（带 k）'; return result; }
      var key=b64urlDecode(jwk.k), mac=hmacByName(spec.hash, key, msg);
      if(mac.length!==sigBytes.length){ result.valid=false; result.reason='HMAC 长度不符'; return result; }
      var ok=true; for(var i=0;i<mac.length;i++) if(mac[i]!==sigBytes[i]) ok=false;
      result.valid=ok; result.reason=ok?('HMAC-'+spec.hash.toUpperCase()+' 匹配'):'HMAC 不匹配';
    } else if(spec.fam==='RSA'){
      if(!jwk || jwk.kty!=='RSA' || !jwk.n || !jwk.e){ result.valid=false; result.reason='RSA 验签需要 n/e'; return result; }
      var ok=rsaPkcs1Verify(b64urlDecode(jwk.n), b64urlDecode(jwk.e), sigBytes, spec.hash, hash);
      result.valid=ok; result.reason=ok?'RSA PKCS#1 v1.5 验签通过':'RSA 验签失败';
    } else if(spec.fam==='EC'){
      if(!jwk || jwk.kty!=='EC' || !jwk.x || !jwk.y){ result.valid=false; result.reason='EC 验签需要 x/y'; return result; }
      if(sigBytes.length%2!==0){ result.valid=false; result.reason='ECDSA 签名长度应为偶数（r||s 等长）'; return result; }
      var hl=sigBytes.length/2;
      var r=bnFromBytes(sigBytes.slice(0,hl)), s=bnFromBytes(sigBytes.slice(hl));
      var Qx=bnFromBytes(b64urlDecode(jwk.x)), Qy=bnFromBytes(b64urlDecode(jwk.y));
      var ok=ecdsaVerify(spec.crv, Qx, Qy, r, s, hash);
      result.valid=ok; result.reason=ok?('ECDSA '+spec.crv+' 验签通过'):'ECDSA 验签失败';
    } else if(spec.fam==='RSAPSS'){
      result.valid=null; result.reason='RSA-PSS 验签请在浏览器端用 WebCrypto（纯 JS 内核仅解析）';
    } else { result.valid=false; result.reason='未知签名家族'; }
    return result;
  });
  var anyValid = results.some(function(r){ return r.valid===true; });
  return {verdict: anyValid?'VALID':'INVALID', format:parsed.format,
          payloadBytes:payloadBytes, payloadText:payloadText, detached:!!parsed.detached,
          results:results};
}

/* ---- 签发：用私钥 JWK 生成 JWS（紧凑序列化） ---- */
function signJws(headerObj, payloadStr, jwk, isRawBytes){
  var header = JSON.parse(JSON.stringify(headerObj||{}));
  if(!header.alg) header.alg='HS256';
  var spec=JWS_ALGS[header.alg];
  if(!spec) return {error:'不支持的 alg '+header.alg};
  var protectedB64 = b64url(utf8Bytes(JSON.stringify(header)));
  var payloadBytes = isRawBytes ? (Array.isArray(payloadStr)?payloadStr:fromHex(payloadStr)) : utf8Bytes(String(payloadStr));
  var payloadB64 = b64url(payloadBytes);
  var msg = utf8Bytes(protectedB64 + '.' + payloadB64);
  var hash = hashByName(spec.hash, msg);
  var sig;
  if(spec.fam==='HMAC'){
    if(!jwk || jwk.kty!=='oct' || !jwk.k) return {error:'HMAC 签发需要 oct JWK（带 k）'};
    sig = hmacByName(spec.hash, b64urlDecode(jwk.k), msg);
  } else if(spec.fam==='RSA'){
    if(!jwk || jwk.kty!=='RSA' || !jwk.n || !jwk.d) return {error:'RSA 签发需要 n/d'};
    sig = rsaPkcs1Sign(b64urlDecode(jwk.n), b64urlDecode(jwk.d), spec.hash, hash);
    if(sig.error) return sig;
  } else if(spec.fam==='EC'){
    if(!jwk || jwk.kty!=='EC' || !jwk.crv || !jwk.d) return {error:'EC 签发需要 crv/d'};
    var d=bnFromBytes(b64urlDecode(jwk.d));
    var ss=ecdsaSign(spec.crv, d, hash, spec.hash);
    if(!ss) return {error:'ECDSA 签名失败'};
    sig = bnToBytes(ss.r, EC[spec.crv].flen).concat(bnToBytes(ss.s, EC[spec.crv].flen));
  } else { return {error:'alg '+header.alg+' 不支持签发'}; }
  return {jws: protectedB64 + '.' + payloadB64 + '.' + b64url(sig)};
}

var JwsForgePure = {
  parseJws:parseJws, verifyJws:verifyJws, signJws:signJws,
  JWS_ALGS:JWS_ALGS, EC:EC,
  bnFromBytes:bnFromBytes, bnToBytes:bnToBytes, modExp:modExp, modInv:modInv,
  ecAdd:ecAdd, ecMul:ecMul, ecdsaVerify:ecdsaVerify, ecdsaSign:ecdsaSign, genK:genK,
  rsaPkcs1Verify:rsaPkcs1Verify, rsaPkcs1Sign:rsaPkcs1Sign, digestInfo:digestInfo,
  hashByName:hashByName, hmacByName:hmacByName, b64uStr:b64uStr, prettyJson:prettyJson, tryPretty:tryPretty,
  b64url:b64url, b64urlDecode:b64urlDecode, utf8Bytes:utf8Bytes, bytesToUtf8:bytesToUtf8,
  toHex:toHex, fromHex:fromHex, b64encode:b64encode, b64decode:b64decode,
  sha256Bytes:sha256Bytes, sha384Bytes:sha384Bytes, sha512Bytes:sha512Bytes,
  hmacSha256:hmacSha256, hmacSha384:hmacSha384, hmacSha512:hmacSha512
};
if (typeof module !== 'undefined' && module.exports) module.exports = JwsForgePure;
if (typeof window !== 'undefined') window.JwsForgePure = JwsForgePure;

</script>
<script>
(function(){
  if(typeof window==='undefined' || !window.document) return;
  var P=window.JwsForgePure;
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var TONE={ok:'var(--ok)', warn:'var(--warn)', info:'var(--info)'};

  var state={ tab:'verify', alg:'HS256' };

  /* ---------- 解码载荷辅助 ---------- */
  function decodePayload(b64){
    if(b64==='' || b64==null) return '(detached / 空载荷，不随 JWS 传输)';
    var raw; try{ raw=P.b64urlDecode(b64); }catch(e){ return '(载荷段不是合法 base64url)'; }
    if(!raw || !raw.length) return '(空载荷)';
    var txt=null; try{ txt=P.bytesToUtf8(raw); }catch(e){}
    if(typeof txt==='string' && txt.indexOf('�')<0 && txt.length){
      try{ var j=JSON.parse(txt); return JSON.stringify(j,null,2); }catch(e){ return txt; }
    }
    return P.toHex(raw);
  }
  function pretty(obj){ try{ return JSON.stringify(obj,null,2); }catch(e){ return String(obj); } }

  /* ---------- 示例 ---------- */
  var A1_JWS='eyJ0eXAiOiJKV1QiLA0KICJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJqb2UiLA0KICJleHAiOjEzMDA4MTkzODAsDQogImh0dHA6Ly9leGFtcGxlLmNvbS9pc19yb290Ijp0cnVlfQ.dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk';
  var A1_KEY='{"kty":"oct","k":"AyM1SysPpbyDfgZld3umj1qzKObwVMkoqQ-EstJQLr_T-1qS0gZH75aKtMN3Yj0iPS4hcgUuTwjAzZr1Z9CAow"}';

  /* ---------- 解析结构 ---------- */
  function renderParse(p){
    var h='<div class="line"><span class="tag">格式</span>'+esc(p.format);
    if(p.detached) h+=' <span class="tag" style="color:var(--info);border-color:var(--info)">detached</span>';
    h+='</div>';
    if(!p.detached) h+='<div class="line"><span class="tag">载荷</span><pre class="mono" style="white-space:pre-wrap;word-break:break-all;margin:4px 0 0">'+esc(decodePayload(p.payloadB64))+'</pre></div>';
    var sigs=p.signatures||[];
    for(var i=0;i<sigs.length;i++){
      var sg=sigs[i], ph=sg.header||{};
      h+='<div class="line" style="margin-top:8px"><span class="tag">签名 #'+(i+1)+'</span> alg='+esc(ph.alg||'(未声明)')+'</div>';
      h+='<div class="line"><span class="tag">protected</span><pre class="mono" style="white-space:pre-wrap;word-break:break-all;margin:4px 0 0">'+esc(pretty(ph))+'</pre></div>';
      if(sg.unprotected && Object.keys(sg.unprotected).length)
        h+='<div class="line"><span class="tag">unprotected</span><pre class="mono" style="white-space:pre-wrap;word-break:break-all;margin:4px 0 0">'+esc(pretty(sg.unprotected))+'</pre></div>';
      h+='<div class="line"><span class="tag">signature</span><span class="mono" style="word-break:break-all">'+esc(sg.signature)+'</span></div>';
    }
    return h;
  }

  /* ---------- detached 补验（内核验签需要原始载荷） ---------- */
  function detachedVerify(parsed, jwk, payloadText){
    var sg=(parsed.signatures||[])[0];
    if(!sg) return {valid:false, reason:'没有可验的签名'};
    var alg=(sg.header&&sg.header.alg)||(sg.unprotected&&sg.unprotected.alg);
    var spec=P.JWS_ALGS[alg];
    if(!spec) return {valid:false, reason:'不支持的 alg '+alg};
    var protStr=sg.protectedB64||'';
    var payloadB64=P.b64url(P.utf8Bytes(payloadText));
    var msg=P.utf8Bytes(protStr+'.'+payloadB64);
    var hash=P.hashByName(spec.hash, msg);
    var sigBytes; try{ sigBytes=P.b64urlDecode(sg.signature); }catch(e){ return {valid:false, reason:'签名不是合法 base64url'}; }
    if(spec.fam==='HMAC'){
      if(!jwk||jwk.kty!=='oct'||!jwk.k) return {valid:false, reason:'HMAC 需要 oct JWK（带 k）'};
      var mac=P.hmacByName(spec.hash, P.b64urlDecode(jwk.k), msg), ok=true;
      if(mac.length!==sigBytes.length) return {valid:false, reason:'HMAC 长度不符'};
      for(var i=0;i<mac.length;i++) if(mac[i]!==sigBytes[i]) ok=false;
      return {valid:ok, reason:ok?('HMAC-'+spec.hash.toUpperCase()+' 匹配'):'HMAC 不匹配'};
    }
    if(spec.fam==='RSA'){
      if(!jwk||jwk.kty!=='RSA'||!jwk.n||!jwk.e) return {valid:false, reason:'RSA 验签需要 n/e'};
      var ok=P.rsaPkcs1Verify(P.b64urlDecode(jwk.n), P.b64urlDecode(jwk.e), sigBytes, spec.hash, hash);
      return {valid:ok, reason:ok?'RSA PKCS#1 v1.5 验签通过':'RSA 验签失败'};
    }
    if(spec.fam==='EC'){
      if(!jwk||jwk.kty!=='EC'||!jwk.x||!jwk.y) return {valid:false, reason:'EC 验签需要 x/y'};
      if(sigBytes.length%2) return {valid:false, reason:'ECDSA 签名长度应为偶数（r||s 等长）'};
      var hl=sigBytes.length/2;
      var r=P.bnFromBytes(sigBytes.slice(0,hl)), s=P.bnFromBytes(sigBytes.slice(hl));
      var Qx=P.bnFromBytes(P.b64urlDecode(jwk.x)), Qy=P.bnFromBytes(P.b64urlDecode(jwk.y));
      var ok=P.ecdsaVerify(spec.crv, Qx, Qy, r, s, hash);
      return {valid:ok, reason:ok?('ECDSA '+spec.crv+' 验签通过'):'ECDSA 验签失败'};
    }
    return {valid:null, reason:'暂不支持 '+spec.fam+' 的 detached 补验'};
  }

  /* ---------- 事件 ---------- */
  function parseIn(){
    $('jws_err').textContent='';
    var txt=$('jws_in').value.trim();
    if(!txt){ $('jws_out').innerHTML=''; return; }
    var p=P.parseJws(txt);
    if(p.error){ $('jws_err').textContent=p.error; $('jws_out').innerHTML=''; return; }
    $('jws_out').innerHTML=renderParse(p);
  }

  function verifyIn(){
    $('jws_err').textContent='';
    var txt=$('jws_in').value.trim();
    if(!txt){ $('jws_err').textContent='先填 JWS'; return; }
    var p=P.parseJws(txt);
    if(p.error){ $('jws_err').textContent=p.error; return; }
    var keyJson=$('jws_key').value.trim();
    if(!keyJson){ $('jws_err').textContent='填一下验证用 JWK（看结构可只点「解析结构」）'; return; }
    var jwk; try{ jwk=JSON.parse(keyJson); }catch(e){ $('jws_err').textContent='JWK 不是合法 JSON：'+(e.message); return; }
    var v, tone;
    if(p.detached){
      var payload=$('jws_detached').value;
      if(!payload){ $('jws_err').textContent='detached JWS 验签需要原始载荷，填到「原始载荷」里'; return; }
      var r=detachedVerify(p, jwk, payload);
      v={verdict:r.valid?'VALID':'INVALID', format:p.format, results:[{alg:(p.signatures[0].header||{}).alg, valid:r.valid, reason:r.reason}]};
    } else {
      v=P.verifyJws(txt, jwk);
    }
    if(v.verdict==='error'){ $('jws_err').textContent=v.reason; return; }
    var h='<div class="line"><span class="tag" style="color:'+(v.verdict==='VALID'?'var(--ok)':'var(--warn)')+';border-color:'+(v.verdict==='VALID'?'var(--ok)':'var(--warn)')+'">'+v.verdict+'</span>'+esc(v.format)+'</div>';
    var res=v.results||[];
    for(var i=0;i<res.length;i++){
      var rr=res[i], t=rr.valid===true?'ok':(rr.valid===false?'warn':'info');
      var label=rr.valid===true?'有效':(rr.valid===false?'无效':'跳过');
      h+='<div class="line"><span class="tag" style="color:'+TONE[t]+';border-color:'+TONE[t]+'">'+label+'</span> alg='+esc(rr.alg||'?')+' · '+esc(rr.reason||'')+'</div>';
    }
    $('jws_out').innerHTML=h;
  }

  function loadExample(){
    $('jws_in').value=A1_JWS;
    $('jws_key').value=A1_KEY;
    $('jws_detached').value='';
    $('jws_err').textContent='';
    $('jws_out').innerHTML='';
  }

  function clearAll(){
    $('jws_in').value=''; $('jws_key').value=''; $('jws_detached').value='';
    $('jws_err').textContent=''; $('jws_out').innerHTML='';
  }

  /* ---------- 签发 ---------- */
  function renderAlgs(){
    var keys=Object.keys(P.JWS_ALGS), h='';
    for(var i=0;i<keys.length;i++){
      var k=keys[i], fam=P.JWS_ALGS[k].fam, on=(k===state.alg);
      var lab={HMAC:'对称', RSA:'RSA', EC:'EC', RSAPSS:'RSA-PSS'}[fam]||fam;
      h+='<button class="ghost'+(on?' on':'')+'" data-alg="'+k+'" title="'+esc(fam)+'">'+esc(k)+'</button>';
    }
    $('jws_algs').innerHTML=h;
  }
  function sign(){
    $('jws_signerr').textContent='';
    var alg=state.alg, spec=P.JWS_ALGS[alg];
    if(!spec){ $('jws_signerr').textContent='未知 alg'; return; }
    var jwkJson=$('jws_priv').value.trim();
    var jwk; try{ jwk=JSON.parse(jwkJson); }catch(e){ $('jws_signerr').textContent='私钥 JWK 不是合法 JSON：'+(e.message); return; }
    var hdrJson=$('jws_hdr').value.trim()||'{}';
    var extra; try{ extra=JSON.parse(hdrJson); }catch(e){ $('jws_signerr').textContent='附加头不是合法 JSON：'+(e.message); return; }
    var header=JSON.parse(JSON.stringify(extra||{}));
    header.alg=alg;
    var payload=$('jws_payload').value;
    var r=P.signJws(header, payload, jwk, false);
    if(r.error){ $('jws_signerr').textContent=r.error; return; }
    if($('jws_detach').checked){
      var parts=r.jws.split('.');
      r.jws=parts[0]+'.'+'.'+parts[2];
    }
    $('jws_result').value=r.jws;
  }
  function copyResult(){
    var v=$('jws_result').value; if(!v) return;
    var ta=document.createElement('textarea'); ta.value=v; ta.setAttribute('readonly','');
    ta.style.position='absolute'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    var b=$('jws_scopy'), t=b.textContent; b.textContent='已复制'; setTimeout(function(){ b.textContent=t; },1200);
  }

  /* ---------- tab 切换 ---------- */
  function switchTab(tab){
    state.tab=tab;
    $('jws_verify_sec').style.display=(tab==='verify')?'':'none';
    $('jws_sign_sec').style.display=(tab==='sign')?'':'none';
    var btns=$('jws_tabs').getElementsByTagName('button');
    for(var i=0;i<btns.length;i++) btns[i].className='ghost'+(btns[i].getAttribute('data-tab')===tab?' on':'');
  }

  /* ---------- 绑定 ---------- */
  $('jws_parse').addEventListener('click', parseIn);
  $('jws_verify').addEventListener('click', verifyIn);
  $('jws_load').addEventListener('click', loadExample);
  $('jws_clear').addEventListener('click', clearAll);
  $('jws_in').addEventListener('input', parseIn);
  $('jws_sign').addEventListener('click', sign);
  $('jws_scopy').addEventListener('click', copyResult);
  $('jws_detach').addEventListener('change', function(){});
  $('jws_tabs').addEventListener('click', function(e){
    var t=e.target.getAttribute && e.target.getAttribute('data-tab'); if(t) switchTab(t);
  });
  $('jws_algs').addEventListener('click', function(e){
    var k=e.target.getAttribute && e.target.getAttribute('data-alg'); if(!k) return;
    state.alg=k; renderAlgs();
  });

  renderAlgs();
  parseIn();
})();

</script>
