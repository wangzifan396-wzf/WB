<label>JSON</label>

}</textarea>

<script>
function jgParse(s){ return JSON.parse(s); }
function jgGraph(obj, rootId){
  var nodes=[], edges=[], idc=0;
  function walk(o, parent, key, depth){
    var id='n'+(idc++);
    var label = key!==null ? key : (rootId||'root');
    var type = Array.isArray(o)?'array': o&&typeof o==='object'?'object':'value';
    var val = type==='value' ? String(o) : (type==='array'?('['+o.length+']'):'{'+(Object.keys(o).length)+'}');
    nodes.push({id:id, label:label, type:type, val:val, depth:depth});
    if(parent) edges.push({from:parent, to:id});
    if(type==='object'){ var ks=Object.keys(o); for(var i=0;i<ks.length;i++) walk(o[ks[i]], id, ks[i], depth+1); }
    else if(type==='array'){ for(var i=0;i<o.length;i++) walk(o[i], id, '['+i+']', depth+1); }
    return id;
  }
  walk(obj, null, null, 0);
  return {nodes:nodes, edges:edges};
}
function jgLayout(graph, W, H){
  var byDepth={}, maxDepth=0;
  graph.nodes.forEach(function(n){ (byDepth[n.depth]=byDepth[n.depth]||[]).push(n); maxDepth=Math.max(maxDepth,n.depth); });
  var colW=(W-40)/(maxDepth+1), rowH=34;
  graph.nodes.forEach(function(n){ n.x=n.depth*colW+30; });
  Object.keys(byDepth).forEach(function(d){ var arr=byDepth[d]; arr.forEach(function(n,i){ n.y=20+i*rowH+10; }); });
  graph._h = 20 + (Math.max.apply(null, Object.keys(byDepth).map(function(d){ return byDepth[d].length; })))*rowH + 10;
  return graph;
}
function jgSvg(graph, W, H){
  graph=jgLayout(graph, W, H);
  var pos={}; graph.nodes.forEach(function(n){ pos[n.id]={x:n.x,y:n.y}; });
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+(graph._h||H)+'" viewBox="0 0 '+W+' '+(graph._h||H)+'"><rect width="'+W+'" height="'+(graph._h||H)+'" fill="#0A0A0B"/>';
  graph.edges.forEach(function(e){ var a=pos[e.from], b=pos[e.to]; s+='<path d="M'+(a.x+8)+' '+a.y+' C'+(a.x+60)+' '+a.y+' '+(b.x-60)+' '+b.y+' '+b.x+'" fill="none" stroke="#3f3f46" stroke-width="1.2"/>'; });
  graph.nodes.forEach(function(n){ var col=n.type==='object'?'#5E6AD2':n.type==='array'?'#22D3EE':'#10B981'; s+='<g transform="translate('+n.x+','+n.y+')"><rect x="0" y="-12" width="120" height="24" rx="6" fill="#141417" stroke="'+col+'" stroke-width="1.3"/>'; s+='<text x="8" y="4" fill="#E4E4E7" font-size="11">'+esc(n.label)+' <tspan fill="#71717A">'+(n.val.length>10?n.val.slice(0,9)+'…':esc(n.val))+'</tspan></text></g>'; });
  return s+'</svg>';
}
function esc(s){ return String(s).replace(/[&<>]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { jgParse:jgParse, jgGraph:jgGraph, jgLayout:jgLayout, jgSvg:jgSvg };
}
if (typeof window !== 'undefined') {
  window.JsonGraphForgePure = { jgParse:jgParse, jgGraph:jgGraph, jgLayout:jgLayout, jgSvg:jgSvg };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.JsonGraphForgePure;
    function draw(){ $('err').textContent=''; try { var g=P.jgGraph(P.jgParse($('src').value)); $('cv').innerHTML=P.jgSvg(g, 560, 360); } catch(e){ $('err').textContent=e.message; } }
    $('draw').addEventListener('click', draw);
    $('src').addEventListener('input', draw);
    draw();
  })();
}
</script>
