:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);

*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}

/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<body>
<div class="app">
  <h1>Base32Forge</h1>
  <p class="sub">Base32 编解码：RFC4648 / Base32Hex / Crockford / z-base-32 四变体 · 单文件 · 零依赖 · 本地优先</p>

<label>输入</label>
<textarea id="txt" rows="4">foobar</textarea>
<div class="opt">
  <label>变体
    <select id="variant">
      <option value="rfc4648">RFC 4648 (A-Z2-7)</option>
      <option value="base32hex">Base32Hex (0-9A-V)</option>
      <option value="crockford">Crockford (无 ILOU)</option>
      <option value="zbase32">z-base-32</option>
    </select>
  </label>
  <label>方向
    <select id="dir"><option value="enc">编码</option><option value="dec">解码</option></select>
  </label>
</div>
<div class="row">
  <button id="run">转换</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">选择变体后转换</div>
<script>
var B32_ALPHABETS={
  rfc4648:  'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',
  base32hex:'0123456789ABCDEFGHIJKLMNOPQRSTUV',
  crockford:'0123456789ABCDEFGHJKMNPQRSTVWXYZ',
  zbase32:  'ybndrfg8ejkmcpqxot1uwisza345h769'
};
var B32_PAD={ rfc4648:true, base32hex:true, crockford:false, zbase32:false };
function b32ToUtf8(str){
  var out=[];
  for(var i=0;i<str.length;i++){
    var c=str.charCodeAt(i);
    if(c<0x80) out.push(c);
    else if(c<0x800) out.push(0xC0|(c>>6),0x80|(c&63));
    else if(c>=0xD800&&c<=0xDBFF&&i+1<str.length){
      var c2=str.charCodeAt(i+1);
      if(c2>=0xDC00&&c2<=0xDFFF){
        var cp=0x10000+((c-0xD800)<<10)+(c2-0xDC00); i++;
        out.push(0xF0|(cp>>18),0x80|((cp>>12)&63),0x80|((cp>>6)&63),0x80|(cp&63));
      } else out.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));
    }
    else out.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));
  }
  return out;
}
function b32FromUtf8(bytes){
  var s='', i=0;
  while(i<bytes.length){
    var b=bytes[i];
    if(b<0x80){ s+=String.fromCharCode(b); i++; }
    else if(b>=0xC0&&b<0xE0){ s+=String.fromCharCode(((b&31)<<6)|(bytes[i+1]&63)); i+=2; }
    else if(b>=0xE0&&b<0xF0){ s+=String.fromCharCode(((b&15)<<12)|((bytes[i+1]&63)<<6)|(bytes[i+2]&63)); i+=3; }
    else {
      var cp=((b&7)<<18)|((bytes[i+1]&63)<<12)|((bytes[i+2]&63)<<6)|(bytes[i+3]&63); i+=4;
      cp-=0x10000; s+=String.fromCharCode(0xD800+(cp>>10),0xDC00+(cp&1023));
    }
  }
  return s;
}
function b32Encode(bytes, variant){
  var alpha=B32_ALPHABETS[variant];
  if(!alpha) return { value:null, error:'未知变体: '+variant };
  var out='', bits=0, acc=0;
  for(var i=0;i<bytes.length;i++){
    acc=(acc<<8)|bytes[i]; bits+=8;
    while(bits>=5){ bits-=5; out+=alpha[(acc>>bits)&31]; }
  }
  if(bits>0) out+=alpha[(acc<<(5-bits))&31];
  if(B32_PAD[variant]){ while(out.length%8!==0) out+='='; }
  return { value:out, error:null };
}
function b32Normalize(str, variant){
  var s=String(str).replace(/[\s-]/g,'');
  if(variant==='crockford'){
    s=s.toUpperCase().replace(/[IL]/g,'1').replace(/O/g,'0');
  } else if(variant==='rfc4648'||variant==='base32hex'){
    s=s.toUpperCase();
  } else if(variant==='zbase32'){
    s=s.toLowerCase();
  }
  return s.replace(/=+$/,'');
}
function b32Decode(str, variant){
  var alpha=B32_ALPHABETS[variant];
  if(!alpha) return { value:null, error:'未知变体: '+variant };
  var s=b32Normalize(str, variant);
  var out=[], bits=0, acc=0;
  for(var i=0;i<s.length;i++){
    var v=alpha.indexOf(s[i]);
    if(v<0) return { value:null, error:'非法字符: '+s[i] };
    acc=(acc<<5)|v; bits+=5;
    if(bits>=8){ bits-=8; out.push((acc>>bits)&255); }
  }
  return { value:out, error:null };
}
function b32EncodeStr(str, variant){ return b32Encode(b32ToUtf8(String(str)), variant); }
function b32DecodeStr(str, variant){
  var r=b32Decode(str, variant);
  if(r.error) return r;
  return { value:b32FromUtf8(r.value), error:null };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { B32_ALPHABETS:B32_ALPHABETS, b32ToUtf8:b32ToUtf8, b32FromUtf8:b32FromUtf8,
    b32Encode:b32Encode, b32Decode:b32Decode, b32Normalize:b32Normalize,
    b32EncodeStr:b32EncodeStr, b32DecodeStr:b32DecodeStr };
}
if (typeof window !== 'undefined') {
  window.Base32ForgePure = { B32_ALPHABETS:B32_ALPHABETS, b32ToUtf8:b32ToUtf8, b32FromUtf8:b32FromUtf8,
    b32Encode:b32Encode, b32Decode:b32Decode, b32Normalize:b32Normalize,
    b32EncodeStr:b32EncodeStr, b32DecodeStr:b32DecodeStr };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.Base32ForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var v=$('variant').value, d=$('dir').value, t=$('txt').value;
      var r=(d==='enc')?P.b32EncodeStr(t,v):P.b32DecodeStr(t,v);
      if(r.error){ $('err').textContent=r.error; return; }
      $('out').textContent=r.value===''?'(空)':r.value;
    });
    $('clear').addEventListener('click', function(){ $('txt').value=''; $('out').textContent='选择变体后转换'; });
  })();
}
</script>
