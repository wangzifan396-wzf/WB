<div class="app">
  <h1>PendulumForge</h1>
  <p class="sub">双摆混沌模拟：RK4 数值积分求解双摆运动方程，轨迹残影展示混沌敏感性，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <label style="flex:1;">初角1(°) <input id="a1" type="number" value="120" min="-180" max="180"></label>
  <label style="flex:1;">初角2(°) <input id="a2" type="number" value="60" min="-180" max="180"></label>
</div>
<div class="row">
  <button id="restart">重新开始</button>
  <button id="pause" class="ghost">暂停/继续</button>
</div>

<canvas id="cv" width="560" height="420" style="width:100%;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;"></canvas>
<script>
function dpDeriv(s, g, l1, l2, m1, m2){
  var t1 = s[0], w1 = s[1], t2 = s[2], w2 = s[3];
  var d = t1 - t2, cd = Math.cos(d), sd = Math.sin(d);
  var den = 2*m1 + m2 - m2*Math.cos(2*d);
  var dw1 = (-g*(2*m1+m2)*Math.sin(t1) - m2*g*Math.sin(t1-2*t2) - 2*sd*m2*(w2*w2*l2 + w1*w1*l1*cd)) / (l1*den);
  var dw2 = (2*sd*(w1*w1*l1*(m1+m2) + g*(m1+m2)*Math.cos(t1) + w2*w2*l2*m2*cd)) / (l2*den);
  return [w1, dw1, w2, dw2];
}
function dpRk4(s, dt, g, l1, l2, m1, m2){
  function add(a, b, f){ return [a[0]+b[0]*f, a[1]+b[1]*f, a[2]+b[2]*f, a[3]+b[3]*f]; }
  var k1 = dpDeriv(s, g, l1, l2, m1, m2);
  var k2 = dpDeriv(add(s, k1, dt/2), g, l1, l2, m1, m2);
  var k3 = dpDeriv(add(s, k2, dt/2), g, l1, l2, m1, m2);
  var k4 = dpDeriv(add(s, k3, dt), g, l1, l2, m1, m2);
  return [
    s[0] + dt/6*(k1[0] + 2*k2[0] + 2*k3[0] + k4[0]),
    s[1] + dt/6*(k1[1] + 2*k2[1] + 2*k3[1] + k4[1]),
    s[2] + dt/6*(k1[2] + 2*k2[2] + 2*k3[2] + k4[2]),
    s[3] + dt/6*(k1[3] + 2*k2[3] + 2*k3[3] + k4[3])
  ];
}
function dpEnergy(s, g, l1, l2, m1, m2){
  var t1 = s[0], w1 = s[1], t2 = s[2], w2 = s[3];
  var v1 = l1*w1, ke = 0.5*m1*v1*v1;
  var vx2 = l1*w1*Math.cos(t1) + l2*w2*Math.cos(t2);
  var vy2 = l1*w1*Math.sin(t1) + l2*w2*Math.sin(t2);
  ke += 0.5*m2*(vx2*vx2 + vy2*vy2);
  var y1 = -l1*Math.cos(t1), y2 = y1 - l2*Math.cos(t2);
  return ke + m1*g*y1 + m2*g*y2;
}
function dpPos(s, l1, l2){
  var x1 = l1*Math.sin(s[0]), y1 = l1*Math.cos(s[0]);
  return { x1: x1, y1: y1, x2: x1 + l2*Math.sin(s[2]), y2: y1 + l2*Math.cos(s[2]) };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { dpDeriv:dpDeriv, dpRk4:dpRk4, dpEnergy:dpEnergy, dpPos:dpPos };
}
if (typeof window !== 'undefined') {
  window.PendulumForgePure = { dpDeriv:dpDeriv, dpRk4:dpRk4, dpEnergy:dpEnergy, dpPos:dpPos };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.PendulumForgePure;
    var G = 9.81, L1 = 1, L2 = 1, M1 = 1, M2 = 1, DT = 0.01, SCALE = 90;
    var st = null, trail = [], paused = false;
    function restart(){
      st = [(Number($('a1').value)||120)*Math.PI/180, 0, (Number($('a2').value)||60)*Math.PI/180, 0];
      trail = [];
    }
    function frame(){
      if(!paused && st){
        for(var i=0;i<3;i++) st = P.dpRk4(st, DT, G, L1, L2, M1, M2);
        var p = P.dpPos(st, L1, L2);
        trail.push([p.x2, p.y2]); if(trail.length > 400) trail.shift();
        var cv = $('cv'), ctx = cv.getContext('2d'), cx = 280, cy = 160;
        if(ctx){
        ctx.fillStyle = '#0A0A0B'; ctx.fillRect(0,0,560,420);
        ctx.strokeStyle = 'rgba(34,211,238,0.5)'; ctx.lineWidth = 1.5; ctx.beginPath();
        for(var t=0;t<trail.length;t++){
          var tx = cx + trail[t][0]*SCALE, ty = cy + trail[t][1]*SCALE;
          if(t===0) ctx.moveTo(tx,ty); else ctx.lineTo(tx,ty);
        }
        ctx.stroke();
        var x1 = cx + p.x1*SCALE, y1 = cy + p.y1*SCALE, x2 = cx + p.x2*SCALE, y2 = cy + p.y2*SCALE;
        ctx.strokeStyle = '#71717A'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        ctx.fillStyle = '#5E6AD2'; ctx.beginPath(); ctx.arc(x1,y1,8,0,7); ctx.fill();
        ctx.fillStyle = '#F5A623'; ctx.beginPath(); ctx.arc(x2,y2,8,0,7); ctx.fill();
        }
      }
      if(typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
    }
    $('restart').addEventListener('click', restart);
    $('pause').addEventListener('click', function(){ paused = !paused; });
    restart();
    frame();
  })();
}
</script>
