<div class="app">
  <h1>TspForge</h1>
  <p class="sub">旅行商问题：随机城市最近邻贪心构造 + 2-opt 交换优化，路线长度对比可视化，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <label style="flex:1;">城市数 <input id="count" type="number" value="30" min="5" max="120"></label>
  <label style="flex:1;">种子 <input id="seed" type="number" value="42" min="0"></label>
</div>
<div class="row">
  <button id="solve">求解</button>
  <button id="rand" class="ghost">随机种子</button>
</div>
<div id="stats" style="color:#A1A1AA;font-size:13px;margin-top:8px;"></div>
<div class="err" id="err"></div>
<canvas id="cv" width="600" height="400" style="width:100%;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;"></canvas>
<script>
function tspRng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function tspCities(n, w, h, seed){
  var rnd = tspRng(seed||1), cs = [];
  for(var i=0;i<n;i++) cs.push({ x: 20 + rnd()*(w-40), y: 20 + rnd()*(h-40) });
  return cs;
}
function tspDist(a, b){ var dx = a.x-b.x, dy = a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function tspLength(cities, tour){
  var L = 0;
  for(var i=0;i<tour.length;i++) L += tspDist(cities[tour[i]], cities[tour[(i+1)%tour.length]]);
  return L;
}
function tspNearest(cities){
  var n = cities.length, used = new Array(n), tour = [0];
  used[0] = true;
  for(var k=1;k<n;k++){
    var last = tour[tour.length-1], best = -1, bd = Infinity;
    for(var i=0;i<n;i++){
      if(!used[i]){
        var d = tspDist(cities[last], cities[i]);
        if(d < bd){ bd = d; best = i; }
      }
    }
    used[best] = true; tour.push(best);
  }
  return tour;
}
function tspTwoOpt(cities, tour, maxPass){
  var t = tour.slice(), n = t.length, improved = true, pass = 0;
  while(improved && pass < (maxPass||50)){
    improved = false; pass++;
    for(var i=0;i<n-1;i++){
      for(var j=i+2;j<n;j++){
        if(i===0 && j===n-1) continue;
        var a = cities[t[i]], b = cities[t[i+1]], c = cities[t[j]], d = cities[t[(j+1)%n]];
        var delta = tspDist(a,c) + tspDist(b,d) - tspDist(a,b) - tspDist(c,d);
        if(delta < -1e-9){
          // reverse segment i+1..j
          for(var lo=i+1, hi=j; lo<hi; lo++, hi--){ var tmp=t[lo]; t[lo]=t[hi]; t[hi]=tmp; }
          improved = true;
        }
      }
    }
  }
  return t;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { tspRng:tspRng, tspCities:tspCities, tspDist:tspDist, tspLength:tspLength, tspNearest:tspNearest, tspTwoOpt:tspTwoOpt };
}
if (typeof window !== 'undefined') {
  window.TspForgePure = { tspRng:tspRng, tspCities:tspCities, tspDist:tspDist, tspLength:tspLength, tspNearest:tspNearest, tspTwoOpt:tspTwoOpt };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.TspForgePure;
    function solve(){
      var n = Math.max(5, Math.min(120, Number($('count').value)||30));
      var seed = Number($('seed').value)||0;
      var cs = P.tspCities(n, 600, 400, seed);
      var nn = P.tspNearest(cs);
      var opt = P.tspTwoOpt(cs, nn, 60);
      var l1 = P.tspLength(cs, nn), l2 = P.tspLength(cs, opt);
      var cv = $('cv'), ctx = cv.getContext('2d');
      if(ctx){
      ctx.fillStyle = '#0A0A0B'; ctx.fillRect(0,0,600,400);
      function path(tour, color, width){
        ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
        for(var i=0;i<=tour.length;i++){
          var c = cs[tour[i % tour.length]];
          if(i===0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y);
        }
        ctx.stroke();
      }
      path(nn, 'rgba(113,113,122,0.45)', 1);
      path(opt, '#22D3EE', 2);
      for(var i=0;i<cs.length;i++){
        ctx.fillStyle = i===0 ? '#F5A623' : '#5E6AD2';
        ctx.beginPath(); ctx.arc(cs[i].x, cs[i].y, i===0?5:3.5, 0, 7); ctx.fill();
      }
      }
      var gain = ((1 - l2/l1) * 100).toFixed(1);
      $('stats').innerHTML = '最近邻 <b style="color:#71717A;">' + l1.toFixed(0) + '</b> → 2-opt <b style="color:#22D3EE;">' + l2.toFixed(0) + '</b>（改进 <b style="color:#10B981;">' + gain + '%</b>）';
    }
    $('solve').addEventListener('click', solve);
    $('rand').addEventListener('click', function(){ $('seed').value = Math.floor(Math.random()*99999); solve(); });
    solve();
  })();
}
</script>
