function utf8Bytes(str){

    var c=str.charCodeAt(i);
    if(c<0x80) b.push(c);
    else if(c<0x800) b.push(0xc0|(c>>6),0x80|(c&0x3f));
    else if(c>=0xd800&&c<=0xdbff){

  }

}
function bytesToUtf8(b){
  var s='',i=0;

    else if(c<0xe0){ s+=String.fromCharCode(((c&0x1f)<<6)|(b[i+1]&0x3f)); i+=2; }

function spkiToJwk(der){

  if(kids.length<2 || kids[0].tag!==0x30 || kids[1].tag!==0x03)
    return {error:'SPKI 应为 SEQUENCE{ AlgorithmIdentifier, BIT STRING }'};
  var ai=readAlgId(kids[0]);
  if(ai.error) return ai;
  var bits=kids[1].content;
  if(!bits.length) return {error:'BIT STRING 是空的'};
  if(bits[0]!==0) return {error:'BIT STRING 有 '+bits[0]+' 个未用位，公钥不该出现这种情况'};

  var name=OID_REV[ai.oid];
  if(ai.oid===OID.rsa){
    var seq=derRead(key,0);
    if(!seq||seq.tag!==0x30) return {error:'RSA 公钥内层不是 SEQUENCE'};
    var nk=derChildren(seq.content);
    if(nk.length<2) return {error:'RSA 公钥应含 n 与 e 两个 INTEGER'};
    return {value:{kty:'RSA', n:bytesB64u(strip(nk[0].content)), e:bytesB64u(strip(nk[1].content))}};
  }
  if(ai.oid===OID.ecPublicKey){
    if(!ai.param || ai.param.tag!==0x06) return {error:'EC 公钥缺少曲线 OID 参数'};
    var crv=OID_REV[decodeOid(ai.param.content)];
    var ci=EC_CURVES[crv];
    if(!ci) return {error:'不支持的曲线 OID '+decodeOid(ai.param.content)};
    if(key[0]!==0x04) return {error:'EC 公钥点不是未压缩格式（首字节应为 0x04）'};
    if(key.length!==1+2*ci.coord) return {error:'曲线 '+crv+' 的点应为 '+(1+2*ci.coord)+' 字节，实际 '+key.length+' 字节'};
    return {value:{kty:'EC', crv:crv, x:bytesB64u(key.slice(1,1+ci.coord)), y:bytesB64u(key.slice(1+ci.coord))}};
  }
  if(OKP_CURVES[name]){

    return {value:{kty:'OKP', crv:name, x:bytesB64u(key)}};

function strip(b){ var o=b.slice(); while(o.length>1&&o[0]===0) o.shift(); return o; }
function pkcs8ToJwk(der){
  var top=derRead(der,0);

  if(kids.length<3 || kids[0].tag!==0x02 || kids[1].tag!==0x30 || kids[2].tag!==0x04)

    var p=derChildren(seq.content);
    if(p.length<9) return {error:'RSAPrivateKey 需要 9 个 INTEGER（含 CRT 参数），实际 '+p.length+' 个'};
    return {value:{kty:'RSA', n:bytesB64u(strip(p[1].content)), e:bytesB64u(strip(p[2].content)),
      d:bytesB64u(strip(p[3].content)), p:bytesB64u(strip(p[4].content)), q:bytesB64u(strip(p[5].content)),
      dp:bytesB64u(strip(p[6].content)), dq:bytesB64u(strip(p[7].content)), qi:bytesB64u(strip(p[8].content))}};
  }
  if(ai.oid===OID.ecPublicKey){
    if(!ai.param||ai.param.tag!==0x06) return {error:'EC 私钥缺少曲线 OID'};
    var crv=OID_REV[decodeOid(ai.param.content)], ci=EC_CURVES[crv];
    if(!ci) return {error:'不支持的曲线 OID '+decodeOid(ai.param.content)};

function pemToJwk(text){

    if(/ENCRYPTED/.test(u.label)) return {error:'这是加密的 PKCS#8，需要先用口令解密（本工具不做口令解密）'};
    if(u.label==='RSA PRIVATE KEY') return {error:'这是 PKCS#1 格式，请先用 openssl pkcs8 -topk8 转成 PKCS#8'};
    if(u.label==='EC PRIVATE KEY') return {error:'这是 SEC1 格式，请先用 openssl pkcs8 -topk8 转成 PKCS#8'};
    var r=pkcs8ToJwk(u.der);

  }
  if(u.label==='PUBLIC KEY'){
    var s=spkiToJwk(u.der);
    if(s.value) s.label=u.label;

  }
  if(u.label==='RSA PUBLIC KEY') return {error:'这是 PKCS#1 公钥，请先转成 SPKI（-----BEGIN PUBLIC KEY-----）'};

function jwkToPem(jwk, wantPrivate){

  if(r.error) return r;
  return {value:pemWrap(wantPrivate?'PRIVATE KEY':'PUBLIC KEY', r.value), der:r.value};
}

/* ---- 体检 ---- */
function lintKey(jwk, idx){
  var out=[], where=(idx===undefined?'':'keys['+idx+'] ');
  function add(l,m){ out.push({level:l, msg:where+m}); }
  if(!jwk || typeof jwk!=='object'){ add('bad','不是一个 JSON 对象'); return out; }
  if(!jwk.kty){ add('bad','缺少 kty，这是 JWK 唯一的必需成员'); return out; }
  var req=REQUIRED[jwk.kty];
  if(!req){ add('warn','kty "'+jwk.kty+'" 不在 RFC 7518 注册表里'); return out; }
  for(var i=0;i<req.length;i++)
    if(jwk[req[i]]===undefined) add('bad','kty='+jwk.kty+' 缺少必需成员 '+req[i]);
  var fields=['n','e','d','p','q','dp','dq','qi','x','y','k'];
  for(var f=0;f<fields.length;f++){
    var v=jwk[fields[f]];
    if(v===undefined) continue;
    var prob=b64uProblem(v);
    if(prob) add('bad','成员 '+fields[f]+' '+prob);
  }
  var priv=hasPrivate(jwk);
  if(priv) add('bad','含私钥成员 "'+priv+'"：JWKS 一旦对外发布，等于把私钥挂到了公网');
  if(jwk.kty==='RSA' && jwk.e && jwk.e!=='AQAB')
    add('warn','公钥指数 e="'+jwk.e+'" 不是常规的 AQAB（65537）');
  if(jwk.kty==='RSA' && jwk.n && !b64uProblem(jwk.n)){
    var bits=keyBits(jwk);
    if(bits<2048) add('bad','RSA 只有 '+bits+' 位，低于 2048 位下限');
    else if(bits<3072) add('info','RSA '+bits+' 位可用，长期密钥建议 3072 位起');
    else add('ok','RSA '+bits+' 位');
  }
  if(jwk.kty==='EC'){
    var ci=EC_CURVES[jwk.crv];
    if(!ci) add('bad','不认识的曲线 crv="'+jwk.crv+'"');
    else {
      ['x','y'].forEach(function(c){
        if(jwk[c] && !b64uProblem(jwk[c])){
          var len=b64uBytes(jwk[c]).length;
          if(len!==ci.coord) add('bad','曲线 '+jwk.crv+' 的 '+c+' 应为 '+ci.coord+' 字节，实际 '+len+' 字节（坐标必须左补零到固定长度）');
        }
      });
      if(jwk.crv==='secp256k1') add('warn','secp256k1 在 JOSE 里注册为 ES256K，部分库默认不启用');

  if(jwk.kty==='OKP'){
    var oc=OKP_CURVES[jwk.crv];
    if(!oc) add('bad','不认识的 OKP 曲线 crv="'+jwk.crv+'"');
    else if(jwk.x && !b64uProblem(jwk.x) && b64uBytes(jwk.x).length!==oc.len)

  }
  if(jwk.kty==='oct'){
    var kb=keyBits(jwk);
    if(kb && kb<256) add('warn','对称密钥只有 '+kb+' 位，HS256 建议至少 256 位（RFC 7518 要求不短于摘要长度）');
  }
  if(!jwk.kid) add('warn','没有 kid：轮换密钥时验证方无法定位该用哪一把');
  var sug=suggestAlg(jwk);
  if(jwk.alg && sug){
    var okAlg = jwk.kty==='RSA' ? /^(RS|PS)(256|384|512)$/.test(jwk.alg)
              : jwk.kty==='oct' ? /^HS(256|384|512)$/.test(jwk.alg) : jwk.alg===sug;
    if(!okAlg) add('bad','alg="'+jwk.alg+'" 与 kty='+jwk.kty+(jwk.crv?('/'+jwk.crv):'')+' 不匹配，应为 '+sug);
  } else if(!jwk.alg && sug) add('info','没写 alg，验证方只能靠猜；这把钥匙对应 '+sug);
  if(jwk.use && jwk.key_ops) add('warn','同时给了 use 与 key_ops，RFC 7517 要求两者信息必须一致，建议只留一个');

function lintJwks(obj){

  }
  if(Object.prototype.toString.call(obj.keys)!=='[object Array]')
    return [{level:'bad', msg:'keys 必须是数组'}];
  if(!obj.keys.length) out.push({level:'warn', msg:'keys 数组是空的，验证方拿不到任何密钥'});
  var kids={};
  for(var i=0;i<obj.keys.length;i++){

    }

</script>
<script>
(function(){
  if(typeof window==='undefined' || !window.document) return;
  var P=window.JwkForgePure;
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var LEVEL={bad:{c:'var(--warn)',t:'必须处理'},warn:{c:'var(--warn)',t:'注意'},
             ok:{c:'var(--ok)',t:'良好'},info:{c:'var(--info)',t:'提示'}};

  var SAMPLE_JWKS='{\n  "keys": [\n'+
    '    {"kty":"RSA","use":"sig","kid":"2019-prod","alg":"RS256","n":"0vx7agoebGcQSuuPiLJXZptN9nndrQmbXEps2aiAFbWhM78LhWx4cbbfAAtVT86zwu1RK7aPFFxuhDR1L6tSoc_BJECPebWKRXjBZCiFV4n3oknjhMstn64tZ_2W-5JsGY4Hc5n9yBXArwl93lqt7_RN5w6Cf0h4QyQ5v-65YGjQR0_FDW2QvzqY368QQMicAtaSqzs8KJZgnYb9c7d0zgdAZHzu6qMQvRL5hajrn1n91CbOpbISD08qNLyrdkt-bFTWhAI4vMQFh6WeZu0fM4lFd2NcRwr3XPksINHaQ-G_xBniIqbw0Ls1jF44-csFCur-kEgU8awapJzKnqDKgw","e":"AQAB"},\n'+
    '    {"kty":"EC","crv":"P-256","kid":"2019-prod","use":"sig","key_ops":["verify"],"x":"f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU","y":"x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0"},\n'+
    '    {"kty":"oct","kid":"hmac","k":"AyM1SysPpbyDfgZld3umj1qzKObwVMkoqQ-EstJQLr_T-1qS0gZH75aKtMN3Yj0iPS4hcgUuTwjAzZr1Z9CAow"},\n'+
    '    {"kty":"RSA","kid":"leaked","n":"sXchDaQe","e":"AQAB","d":"bWUC9B-EFRIo8kpGfh0ZuyGPvMNKvYWNtB_ikiH9k20eT-O1q_I78e"}\n'+

  var state={keys:[], primary:null, isJwks:false};

  function detect(text){

    if(t.indexOf('-----BEGIN')===0 || /-----BEGIN [A-Z0-9 ]+-----/.test(t)){

      '<div class="line"><span class="tag">第 2 步</span>成员按字典序排列、不留任何空白，这样两个人算出来才会一样</div>'+
      '<div class="line"><span class="tag">第 3 步</span>SHA-256 后 base64url，得到 kid 的标准候选值</div>'+
      '<div class="line mono" style="color:var(--ok)">'+esc(tp.value)+'</div>';
  }

  function renderLint(){
    var box=$('jwk_lint');
    var res = state.isJwks ? P.lintJwks(state.raw||{keys:state.keys}) : P.lintKey(state.primary);
    if(!res.length){ box.innerHTML='<div class="line" style="color:var(--ok)">没有发现问题。</div>'; return; }
    var order={bad:0,warn:1,info:2,ok:3}, h='';
    res.sort(function(a,b){ return (order[a.level]||9)-(order[b.level]||9); });
    for(var i=0;i<res.length;i++){
      var L=LEVEL[res[i].level]||LEVEL.info;
      h+='<div class="line"><span class="tag" style="color:'+L.c+';border-color:'+L.c+'">'+L.t+'</span>'+esc(res[i].msg)+'</div>';
    }
    box.innerHTML=h;
  }

  var lastDer=null;
  function renderPem(){
    var k=state.primary, want=$('jwk_priv').checked;
    var priv = want && P.hasPrivate(k);
    var d = priv ? P.jwkToPkcs8(k) : P.jwkToSpki(P.publicPart(k));
    if(d.error){ $('jwk_pem').value='无法导出：'+d.error; lastDer=null; return; }

  }

    $('jwk_out').value=JSON.stringify(out,null,2);
  }

  function renderAll(){
    if(!state.keys.length) return;
    renderSummary(); renderThumb(); renderLint(); renderPem(); renderJwks();
  }

  function go(){
    var r=detect($('jwk_in').value);
    var e=$('jwk_err');
    if(r.error){
      e.textContent=r.error;
      state={keys:[],primary:null,isJwks:false};
      ['jwk_sum','jwk_thumb','jwk_lint'].forEach(function(id){ $(id).innerHTML=''; });

    }
    e.textContent='';
    state={keys:r.keys, primary:r.keys[0], isJwks:r.isJwks, raw:r.raw};
    renderAll();
  }

  function copy(text,btn){
    if(!text) return;
    var ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.position='absolute'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta);
    if(btn){ var t=btn.textContent; btn.textContent='已复制'; setTimeout(function(){ btn.textContent=t; },1200); }
  }

  $('jwk_go').addEventListener('click', go);
  $('jwk_in').addEventListener('input', go);
  $('jwk_priv').addEventListener('change', function(){ if(state.primary) renderPem(); });
  $('jwk_autokid').addEventListener('change', function(){ if(state.primary) renderJwks(); });
  $('jwk_sample').addEventListener('click', function(){ $('jwk_in').value=SAMPLE_JWKS; go(); });
  $('jwk_pemsample').addEventListener('click', function(){ $('jwk_in').value=SAMPLE_PEM; go(); });
  $('jwk_clear').addEventListener('click', function(){ $('jwk_in').value=''; go(); });
  $('jwk_copypem').addEventListener('click', function(){ copy($('jwk_pem').value, this); });
  $('jwk_copyjwks').addEventListener('click', function(){ copy($('jwk_out').value, this); });
  $('jwk_copyder').addEventListener('click', function(){ copy(lastDer?P.toHex(lastDer):'', this); });
  $('jwk_dl').addEventListener('click', function(){
    var v=$('jwk_out').value; if(!v) return;
    var b=new Blob([v],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='jwks.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); },0);
  });

  go();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
