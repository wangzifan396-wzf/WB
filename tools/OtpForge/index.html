<title>OtpForge — TOTP/HOTP 生成器：纯 JS 实现 RFC 6238 / 4226，从 Base32 密钥或 otpauth:// URI 生成一次性口令，带时钟容错窗口与倒计时，离线可用。</title>
<meta property="og:title" content="OtpForge">
<meta property="og:description" content="一次性口令（OTP）生成器：粘贴 Base32 密钥或标准 otpauth:// URI，按 RFC 6238（TOTP）或 RFC 4226（HOTP）生成当前动态码，显示秒级倒计时与 ±1 周期时钟容错窗口，支持自定义位数与周期。可用于验证 Authenticator 配置、调试 2FA 集成，纯 JS 同步实现、零依赖、离线可用。">

<meta name="description" content="一次性口令（OTP）生成器：粘贴 Base32 密钥或标准 otpauth:// URI，按 RFC 6238（TOTP）或 RFC 4226（HOTP）生成当前动态码，显示秒级倒计时与 ±1 周期时钟容错窗口，支持自定义位数与周期。可用于验证 Authenticator 配置、调试 2FA 集成，纯 JS 同步实现、零依赖、离线可用。 · 单文件 · 零依赖 · 本地优先">

<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}

/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<body>
<div class="app">
  <h1>OtpForge</h1>
  <p class="sub">TOTP · HOTP · 2FA</p>

<label for="otp-in">密钥：Base32 字符串，或 otpauth:// URI</label>
<textarea id="otp-in" rows="4" placeholder="JBSWY3DPEHPK3PXP  或  otpauth://totp/ACME:alice?secret=JBSWY3DPEHPK3PXP&issuer=ACME&digits=6&period=30"></textarea>
<div class="row">
  <label>位数 <input id="otp-digits" type="number" min="4" max="10" value="6" style="width:64px"></label>
  <label>周期(秒) <input id="otp-period" type="number" min="10" max="120" value="30" style="width:64px"></label>
  <button id="otp-go">生成</button>
  <button class="ghost" id="otp-clr">清空</button>
</div>
<div class="err" id="otp-err"></div>
<div class="out" id="otp-out"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>

<script>

function OtpForgePure(){
  // ---- 纯 JS SHA-1（字节数组 -> 字节数组）----
  function sha1(msg){
    function rotl(x,n){return (x<<n)|(x>>>(32-n));}
    var H=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0];
    var m=msg.slice();
    var bitLen=m.length*8;
    m.push(0x80);
    while(m.length%64!==56) m.push(0);
    for(var s=7;s>=0;s--){ m.push((bitLen/Math.pow(2,8*s))&0xff); }
    for(var i=0;i<m.length;i+=64){
      var w=new Array(80);
      for(var t=0;t<16;t++){ w[t]=(m[i+t*4]<<24)|(m[i+t*4+1]<<16)|(m[i+t*4+2]<<8)|(m[i+t*4+3]); }
      for(var t=16;t<80;t++){ w[t]=rotl(w[t-3]^w[t-8]^w[t-14]^w[t-16],1); }
      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4];
      for(var t=0;t<80;t++){
        var f,k;
        if(t<20){f=(b&c)|((~b)&d);k=0x5A827999;}
        else if(t<40){f=b^c^d;k=0x6ED9EBA1;}
        else if(t<60){f=(b&c)|(b&d)|(c&d);k=0x8F1BBCDC;}
        else {f=b^c^d;k=0xCA62C1D6;}
        var tmp=(rotl(a,5)+f+e+k+w[t])>>>0;
        e=d;d=c;c=rotl(b,30)>>>0;b=a;a=tmp;
      }
      H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;
    }
    var out=[];
    for(var i=0;i<5;i++){ out.push((H[i]>>>24)&0xff,(H[i]>>>16)&0xff,(H[i]>>>8)&0xff,H[i]&0xff); }
    return out;
  }
  // ---- HMAC-SHA1 ----
  function hmacSha1(key, msg){
    var block=64;
    if(key.length>block){ key=sha1(key); }
    var k=new Array(block); for(var i=0;i<block;i++) k[i]=(i<key.length?key[i]:0);
    var ipad=new Array(block), opad=new Array(block);
    for(var i=0;i<block;i++){ ipad[i]=k[i]^0x36; opad[i]=k[i]^0x5c; }
    var inner=ipad.concat(msg);
    return sha1(opad.concat(sha1(inner)));
  }
  // ---- Base32 (RFC 4648) ----
  var B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  function b32decode(s){
    s=(s||'').toUpperCase().replace(/=+$/,'').replace(/[^A-Z2-7]/g,'');
    if(!s) return [];
    var bits=0,value=0,out=[];
    for(var i=0;i<s.length;i++){
      var v=B32.indexOf(s[i]); if(v<0) continue;
      value=(value<<5)|v; bits+=5;
      if(bits>=8){ bits-=8; out.push((value>>bits)&0xff); }
    }
    return out;
  }
  function b32encode(bytes){
    var bits=0,value=0,out='';
    for(var i=0;i<bytes.length;i++){
      value=(value<<8)|bytes[i]; bits+=8;
      while(bits>=5){ bits-=5; out+=B32[(value>>bits)&0x1f]; }
    }
    if(bits>0){ out+=B32[(value<<(5-bits))&0x1f]; }
    while(out.length%8!==0) out+='=';
    return out;
  }
  // ---- HOTP / TOTP ----
  function hotp(keyBytes, counter, digits){
    var msg=[];
    for(var i=7;i>=0;i--){ msg.push(Math.floor(counter / Math.pow(2, 8*i)) & 0xff); }
    var hs=hmacSha1(keyBytes, msg);
    var off=hs[19]&0x0f;
    var bin=((hs[off]&0x7f)<<24)|((hs[off+1]&0xff)<<16)|((hs[off+2]&0xff)<<8)|(hs[off+3]&0xff);
    var code=(bin%Math.pow(10,digits)).toString();
    while(code.length<digits) code='0'+code;
    return code;
  }
  function totp(keyBytes, time, digits, period){
    period=period||30; digits=digits||6;
    return hotp(keyBytes, Math.floor(time/period), digits);
  }
  function parseOtpauth(uri){
    if(uri.indexOf('otpauth://')!==0) return null;
    var m=uri.match(/^otpauth:\/\/([^/]+)\/([^?]+)(\?.*)?$/);
    if(!m) return null;
    var type=m[1].toLowerCase();
    var label=decodeURIComponent(m[2].replace(/\+/g,' '));
    var issuer=null, secret=null, alg='SHA1', digits=6, period=30, counter=0;
    if(m[3]){
      m[3].slice(1).split('&').forEach(function(p){
        var kv=p.split('=');
        var k=decodeURIComponent(kv[0]); var v=kv[1]!==undefined?decodeURIComponent(kv[1].replace(/\+/g,' ')):'';
        if(k==='secret') secret=v;
        else if(k==='issuer') issuer=v;
        else if(k==='algorithm') alg=v.toUpperCase();
        else if(k==='digits') digits=parseInt(v,10)||6;
        else if(k==='period') period=parseInt(v,10)||30;
        else if(k==='counter') counter=parseInt(v,10)||0;
      });
    }
    return {type:type, label:label, issuer:issuer, secret:secret, algorithm:alg, digits:digits, period:period, counter:counter};
  }
  function analyze(input, opts){
    opts=opts||{};
    var s=(input||'').trim();
    if(!s) return {error:'请输入 Base32 密钥或 otpauth:// URI'};
    var type='totp', label=null, issuer=null, digits=opts.digits||6, period=opts.period||30, counter=0, keyBytes=null;
    if(s.indexOf('otpauth://')===0){
      var p=parseOtpauth(s);
      if(!p) return {error:'无法解析 otpauth URI'};
      if(!p.secret) return {error:'otpauth URI 缺少 secret 参数'};
      keyBytes=b32decode(p.secret);
      type=p.type; label=p.label; issuer=p.issuer; digits=p.digits;
      if(type==='hotp'){ counter=p.counter; }
      else { period=p.period; }
    } else {
      keyBytes=b32decode(s);
      if(opts.digits) digits=opts.digits;
      if(opts.period) period=opts.period;
    }
    if(!keyBytes || !keyBytes.length) return {error:'密钥解码失败（应为 Base32：A-Z 与 2-7）'};
    if(type==='hotp'){
      var code=hotp(keyBytes, counter, digits);
      return {error:null, type:type, label:label, issuer:issuer, digits:digits,
              current:{code:code, counter:counter}, remaining:null, algorithm:'SHA1'};
    }
    var now=Math.floor(Date.now()/1000);
    var c=Math.floor(now/period);
    function at(cc){ return hotp(keyBytes, cc, digits); }
    var window=[-1,0,1].map(function(d){ return {counter:c+d, code:at(c+d)}; });
    return {error:null, type:type, label:label, issuer:issuer, digits:digits, period:period,
            current:{code:at(c), counter:c}, window:window,
            remaining:period-(now%period), now:now, algorithm:'SHA1'};
  }
  var api={sha1:sha1, hmacSha1:hmacSha1, b32decode:b32decode, b32encode:b32encode,
           hotp:hotp, totp:totp, parseOtpauth:parseOtpauth, analyze:analyze};
  if(typeof window!=='undefined'){ window.__PURE__=api; }
  if(typeof module!=='undefined'&&module.exports){ module.exports={OtpForgePure:OtpForgePure}; }
  return api;
}

</script>
<script>

(function(){
  var P=OtpForgePure();
  var $in=document.getElementById('otp-in'), $err=document.getElementById('otp-err'),
      $out=document.getElementById('otp-out'),
      $digits=document.getElementById('otp-digits'), $period=document.getElementById('otp-period');
  function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function go(){
    var r=P.analyze($in.value, {digits:parseInt($digits.value,10)||6, period:parseInt($period.value,10)||30});
    $err.textContent=r.error||'';
    if(r.error){ $out.innerHTML=''; return; }
    var h='';
    if(r.label) h+='<div class="kv"><b>标签</b><span>'+esc(r.label)+'</span></div>';
    if(r.issuer) h+='<div class="kv"><b>签发方</b><span>'+esc(r.issuer)+'</span></div>';
    h+='<div class="kv"><b>类型</b><span>'+esc(r.type.toUpperCase())+' · '+esc(r.algorithm)+' · '+r.digits+' 位</span></div>';
    h+='<div style="margin:14px 0;padding:16px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(94,106,210,.08);text-align:center">';
    h+='<div style="font-size:34px;font-weight:800;letter-spacing:3px;color:var(--accent)">'+esc(r.current.code)+'</div>';
    if(r.type==='totp'){
      h+='<div style="margin-top:8px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+(r.remaining/r.period*100)+'%;background:var(--accent)"></div></div>';
      h+='<div style="margin-top:6px;font-size:12px;color:var(--muted)">'+r.remaining+' 秒后刷新</div>';
    } else {
      h+='<div style="margin-top:6px;font-size:12px;color:var(--muted)">Counter = '+r.current.counter+'</div>';
    }
    h+='</div>';
    if(r.window){
      h+='<div style="font-size:13px;color:var(--muted);margin-bottom:6px">时钟容错窗口（±1 周期）</div>';
      r.window.forEach(function(w){
        var cur=w.counter===r.current.counter;
        h+='<div class="kv" style="'+(cur?'color:var(--accent);font-weight:700':'opacity:.6')+'"><b>'+(cur?'当前':'C'+w.counter)+'</b><span>'+esc(w.code)+'</span></div>';
      });
    }
    $out.innerHTML=h;
  }
  document.getElementById('otp-go').addEventListener('click',go);
  document.getElementById('otp-clr').addEventListener('click',function(){$in.value='';$out.innerHTML='';$err.textContent='';});
})();

</script>
