<meta name="description" content="本地 AES 对称加密与解密：支持 GCM/CBC/CTR 与原始十六进制密钥，或用口令经 PBKDF2 派生密钥；全部运算在浏览器内完成，数据不出本机。 · 单文件 · 零依赖 · 本地优先">

<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE; --bad:#EF4444;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:820px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;transition:border-color .15s ease}
textarea{resize:vertical}
textarea:hover,input:hover,select:hover{border-color:var(--line2)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px;
       transition:filter .15s ease,transform .05s ease}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
button.ghost:hover{border-color:var(--line2);color:var(--fg);filter:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:40px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.sec{font-size:14px;color:var(--muted);font-weight:600;margin:18px 0 8px}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
/* 分段控件 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.seg button{background:transparent;border:0;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:13px;
            transition:background .15s ease,color .15s ease}
.seg button+button{border-left:1px solid var(--line)}
.seg button.active{background:var(--accent);color:#fff}
.seg button:active{transform:none}
/* Bento 瓦片（非对称网格，避 3 等宽卡） */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.bento.span2 .tile{grid-column:1/-1}
.bento.c3{grid-template-columns:2fr 1fr}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.tile .big{font:20px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);word-break:break-all}
.tile .sub2{color:var(--dim);font-size:12px;margin-top:4px}
/* 状态色 */
.state.ok{color:var(--ok)} .state.warn{color:var(--warn)} .state.bad{color:var(--bad)}
/* 徽章 */
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.badge.tag{color:var(--muted);background:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#langBtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;flex:0 0 auto}
#langBtn:hover{border-color:var(--line2);color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#nanoToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--surface);color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;max-width:80vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#nanoToast.bad{border-color:rgba(239,68,68,.55)}
@media (max-width:760px){.grid{grid-template-columns:1fr}.bento{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>

<body>
<div class="app">
  <div class="hd">
    <div>
      <h1>AesForge</h1>
      <p class="sub" data-i18n="sub">本地 AES 对称加密 · 单文件 · 零依赖 · 本地优先</p>
    </div>
    <button id="langBtn" type="button" aria-label="Switch language">EN</button>
  </div>

  <div class="seg" id="seg2">
    <button data-a="enc" class="active">加密</button>
    <button data-a="dec">解密</button>
  </div>
  <label for="in">明文 / 密文</label>
  <textarea id="in" rows="4" placeholder="输入要加密的文字，或粘贴 mode:iv.ct / p:mode:salt.iv.ct 密文"></textarea>
  <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="usePass"> 使用口令派生密钥（PBKDF2）</label>
  <div id="keyWrap">
    <label for="key">十六进制密钥（16/24/32 字节 = 32/48/64 位 hex）</label>
    <input type="text" id="key" placeholder="000102030405060708090a0b0c0d0e0f">
  </div>
  <div id="passWrap" style="display:none">
    <label for="pass">口令</label>
    <input type="text" id="pass" placeholder="设置一个强口令">
  </div>
  <div class="seg" id="seg">
    <button data-m="GCM" class="active">AES-GCM</button>
    <button data-m="CBC">AES-CBC</button>
    <button data-m="CTR">AES-CTR</button>
  </div>
  <div class="row">
    <button id="run">运行</button>
    <button class="ghost" id="copy">复制结果</button>
  </div>
  <div class="err" id="err"></div>
  <div class="sec">输出结果</div>
  <div class="out" id="out"><span class="ph">就绪</span></div>

  <div class="badges">
    <span class="badge" data-i18n="b1">零依赖</span>
    <span class="badge" data-i18n="b2">离线可用</span>
    <span class="badge" data-i18n="b3">数据不出本机</span>
    <span class="badge flag" data-i18n="b4">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>

(function(){
var B64C='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function b64e(b){var s='',i;for(i=0;i+2<b.length;i+=3){var n=(b[i]<<16)|(b[i+1]<<8)|b[i+2];s+=B64C[n>>18&63]+B64C[n>>12&63]+B64C[n>>6&63]+B64C[n&63];}var r=b.length-i;if(r===1){var n1=b[i]<<16;s+=B64C[n1>>18&63]+B64C[n1>>12&63]+'==';}else if(r===2){var n2=(b[i]<<16)|(b[i+1]<<8);s+=B64C[n2>>18&63]+B64C[n2>>12&63]+B64C[n2>>6&63]+'=';}return s;}
function b64d(s){s=String(s).replace(/\s+/g,'').replace(/=+$/,'');var o=[],i;for(i=0;i+3<s.length;i+=4){var n=(B64C.indexOf(s[i])<<18)|(B64C.indexOf(s[i+1])<<12)|(B64C.indexOf(s[i+2])<<6)|B64C.indexOf(s[i+3]);o.push(n>>16&255,n>>8&255,n&255);}var r=s.length-i;if(r===2){var n3=(B64C.indexOf(s[i])<<18)|(B64C.indexOf(s[i+1])<<12);o.push(n3>>16&255);}else if(r===3){var n4=(B64C.indexOf(s[i])<<18)|(B64C.indexOf(s[i+1])<<12)|(B64C.indexOf(s[i+2])<<6);o.push(n4>>16&255,n4>>8&255);}return Uint8Array.from(o);}
  function hexToBytes(h){h=String(h).replace(/[^0-9a-fA-F]/g,'');if(h.length%2)return null;var o=[];for(var i=0;i<h.length;i+=2)o.push(parseInt(h.substr(i,2),16));return Uint8Array.from(o);}
  function bytesToHex(b){var s='';for(var i=0;i<b.length;i++)s+=('0'+(b[i]&255).toString(16)).slice(-2);return s;}
  function rand(n){var b=new Uint8Array(n);if(globalThis.crypto&&globalThis.crypto.getRandomValues)globalThis.crypto.getRandomValues(b);else for(var i=0;i<n;i++)b[i]=Math.floor(Math.random()*256);return b;}
  function algParams(mode,iv){var nm='AES-'+mode;if(mode==='CTR')return {name:nm,counter:iv,length:128};return {name:nm,iv:iv};}
  function enc(plain,keyHex,mode){
    return new Promise(function(res){
      try{
        var key=hexToBytes(keyHex);
        if(!key||[16,24,32].indexOf(key.length)<0){res({error:'密钥须为 16/24/32 字节（32/48/64 位十六进制）'});return;}
        if(!globalThis.crypto||!globalThis.crypto.subtle){res({error:'当前环境不支持 Web Crypto'});return;}
        var ivLen=(mode==='GCM')?12:16;var iv=rand(ivLen);
        globalThis.crypto.subtle.importKey('raw',key,{name:'AES-'+mode},false,['encrypt']).then(function(k){
          return globalThis.crypto.subtle.encrypt(algParams(mode,iv),k,new TextEncoder().encode(plain));
        }).then(function(ct){res({value:mode+':'+b64e(iv)+'.'+b64e(new Uint8Array(ct))});})
        .catch(function(e){res({error:String(e&&e.message||e)});});
      }catch(e){res({error:String(e&&e.message||e)});}
    });
  }
  function dec(pkg,keyHex,mode){
    return new Promise(function(res){
      try{
        var key=hexToBytes(keyHex);
        if(!key||[16,24,32].indexOf(key.length)<0){res({error:'密钥须为 16/24/32 字节'});return;}
        var parts=String(pkg).split(':');var body=parts.length===2?parts[1]:parts[0];
        var seg=body.split('.');if(seg.length!==2){res({error:'密文格式应为 mode:iv.ct'});return;}
        var iv=b64d(seg[0]),ct=b64d(seg[1]);
        globalThis.crypto.subtle.importKey('raw',key,{name:'AES-'+mode},false,['decrypt']).then(function(k){
          return globalThis.crypto.subtle.decrypt(algParams(mode,iv),k,ct);
        }).then(function(pt){res({value:new TextDecoder().decode(pt)});})
        .catch(function(e){res({error:String(e&&e.message||e)});});
      }catch(e){res({error:String(e&&e.message||e)});}
    });
  }
  function deriveKey(pass,salt){return globalThis.crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']).then(function(k){return globalThis.crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});}
  function encP(plain,pass,mode){var salt=rand(16),iv=rand(12);return deriveKey(pass,salt).then(function(k){return globalThis.crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(plain)).then(function(ct){return {value:'p:'+mode+':'+b64e(salt)+'.'+b64e(iv)+'.'+b64e(new Uint8Array(ct))};});});}
  function decP(pkg,pass,mode){var parts=String(pkg).split(':');if(parts[0]!=='p'||parts.length!==3)return Promise.resolve({error:'口令密文格式应为 p:mode:salt.iv.ct'});var seg=parts[2].split('.');if(seg.length!==3)return Promise.resolve({error:'密文分段错误'});var salt=b64d(seg[0]),iv=b64d(seg[1]),ct=b64d(seg[2]);return deriveKey(pass,salt).then(function(k){return globalThis.crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct).then(function(pt){return {value:new TextDecoder().decode(pt)};});}).catch(function(e){return {error:'解密失败：'+String(e&&e.message||e)};});}
  var API={hexToBytes:hexToBytes,bytesToHex:bytesToHex,encrypt:enc,decrypt:dec,encryptPass:encP,decryptPass:decP};
  if(typeof module!=='undefined'&&module.exports)module.exports=API;
  if(typeof window!=='undefined')window.__AesForge__=API;
})();

</script>
<script>

(function(){
  var P=window.__AesForge__;var mode='GCM',act='enc';
  var seg=document.getElementById('seg').querySelectorAll('button');
  seg.forEach(function(b){b.addEventListener('click',function(){seg.forEach(function(x){x.classList.remove('active');});b.classList.add('active');mode=b.getAttribute('data-m');});});
  var seg2=document.getElementById('seg2').querySelectorAll('button');
  seg2.forEach(function(b){b.addEventListener('click',function(){seg2.forEach(function(x){x.classList.remove('active');});b.classList.add('active');act=b.getAttribute('data-a');document.getElementById('keyWrap').style.display=(act==='enc'||act==='dec')&&!document.getElementById('usePass').checked?'block':'none';});});
  document.getElementById('usePass').addEventListener('change',function(){document.getElementById('keyWrap').style.display=this.checked?'none':'block';document.getElementById('passWrap').style.display=this.checked?'block':'none';});
  function run(){
    var out=document.getElementById('out'),err=document.getElementById('err');err.textContent='';
    var txt=document.getElementById('in').value;
    var pr;
    if(document.getElementById('usePass').checked){
      var pass=document.getElementById('pass').value;if(!pass){err.textContent='请输入口令';return;}
      pr=(act==='enc')?P.encryptPass(txt,pass,mode):P.decryptPass(txt,pass,mode);
    }else{
      var key=document.getElementById('key').value.trim();if(!key){err.textContent='请输入十六进制密钥';return;}
      pr=(act==='enc')?P.encrypt(txt,key,mode):P.decrypt(txt,key,mode);
    }
    pr.then(function(r){if(r.error){err.textContent=r.error;return;}out.textContent=r.value;}).catch(function(e){err.textContent=String(e);});
  }
  document.getElementById('run').addEventListener('click',run);
  document.getElementById('copy').addEventListener('click',function(){var t=document.getElementById('out').textContent;if(t&&navigator.clipboard)navigator.clipboard.writeText(t);});
})();

</script>
<div id="nanoToast" role="status" aria-live="polite"></div>
<script>
/* ---- 状态条：复制/错误统一反馈 ---- */
(function(){var el=document.getElementById('nanoToast');if(!el)return;var t;
function show(m,bad){el.textContent=m;el.className='on'+(bad?' bad':'');clearTimeout(t);t=setTimeout(function(){el.className='';},1700);}
window.nanoToast=show;
try{var nc=navigator.clipboard;if(nc&&nc.writeText){var ow=nc.writeText.bind(nc);
nc.writeText=function(s){return ow(s).then(function(r){show(window.nanoT?window.nanoT('copied'):'已复制');return r;},function(e){show(window.nanoT?window.nanoT('copyfail'):'复制失败',1);throw e;});};}}catch(e){}
})();
/* ---- i18n 运行时 ---- */
var I18N = {"en": {"b1": "Zero deps", "b2": "Offline", "b3": "Local only", "b4": "Flagship", "copied": "Copied", "copyfail": "Copy failed"}, "zh": {"b1": "零依赖", "b2": "离线可用", "b3": "数据不出本机", "b4": "旗舰", "copied": "已复制", "copyfail": "复制失败", "sub": "本地 AES 对称加密 · 单文件 · 零依赖 · 本地优先", "title": "AesForge — 本地 AES 对称加密"}};
(function(){
  function cur(){try{return localStorage.getItem('nano-lang')==='en'?'en':'zh';}catch(e){return 'zh';}}
  function dict(){return I18N[cur()]||I18N.zh;}
  function apply(){
    var l=cur(), d=dict();
    document.documentElement.lang = (l==='en'?'en':'zh-CN');
    var ns=document.querySelectorAll('[data-i18n]');
    for(var i=0;i<ns.length;i++){var k=ns[i].getAttribute('data-i18n');if(d[k]!=null)ns[i].textContent=d[k];}
    var ps=document.querySelectorAll('[data-i18n-ph]');
    for(var j=0;j<ps.length;j++){var k2=ps[j].getAttribute('data-i18n-ph');if(d[k2]!=null)ps[j].setAttribute('placeholder',d[k2]);}
    var b=document.getElementById('langBtn'); if(b) b.textContent=(l==='en'?'中文':'EN');
    if(d.title) document.title=d.title;
  }
  window.nanoT=function(k){var d=dict();return d[k]!=null?d[k]:k;};
  window.nanoApplyI18n=apply;
  var b=document.getElementById('langBtn');
  if(b) b.addEventListener('click', function(){
    try{localStorage.setItem('nano-lang', cur()==='en'?'zh':'en');}catch(e){}
    apply(); if(window.nanoRerender) window.nanoRerender();
  });
  apply();
})();
</script>
