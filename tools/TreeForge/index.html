<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>TreeForge — 目录树生成器：缩进/路径列表转 tree 连线图，支持 JSON 与 ASCII 互转。</title>
<meta property="og:title" content="TreeForge">
<meta property="og:description" content="目录树生成器：缩进与路径列表转 tree 连线图，JSON/ASCII 互转，离线可用">
<meta property="og:image" content="./og.png">
<meta name="description" content="目录树生成器：缩进与路径列表转 tree 连线图，JSON/ASCII 互转，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>TreeForge</h1>
  <p class="sub">目录树：缩进文本或路径列表转 tree 连线图、Unicode/ASCII 双风格、JSON 与路径列表互导 · 单文件 · 零依赖 · 本地优先</p>

<label>输入（缩进树 / tree 命令输出 / 路径列表）</label>
<textarea id="src" rows="9" spellcheck="false"></textarea>
<div class="row">
  <label style="margin:0">输入模式</label>
  <select id="mode" style="max-width:150px">
    <option value="indent">缩进树</option>
    <option value="paths">路径列表</option>
  </select>
  <button id="run">渲染树形图</button>
  <button id="json" class="ghost">导出 JSON</button>
  <button id="plist" class="ghost">导出路径</button>
  <button id="copy" class="ghost">复制输出</button>
</div>
<div class="row">
  <label style="margin:0"><input type="checkbox" id="ascii"> 使用 ASCII 连线</label>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>
<label>输出</label>
<textarea id="dst" rows="10" spellcheck="false"></textarea>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>

function trIndentWidth(line){
  var w=0;
  for(var i=0;i<line.length;i++){
    if(line[i]===' ') w++;
    else if(line[i]==='\t') w+=4;
    else break;
  }
  return w;
}
function trStripGlyph(line){
  return line.replace(/^[\s\u2502\u251c\u2514\u2500|`+\-]*[\s]?/, function(mm){
    return mm.replace(/[^\s]/g,' ');
  });
}
function trParseIndent(text){
  var raw=String(text||'').replace(/\r\n?/g,'\n').split('\n');
  var lines=[];
  for(var i=0;i<raw.length;i++){
    if(!raw[i].trim()) continue;
    var norm = /[\u2502\u251c\u2514\u2500]/.test(raw[i]) ? trStripGlyph(raw[i]) : raw[i];
    lines.push({ indent:trIndentWidth(norm), name:norm.trim().replace(/\/$/,''), dir:/\/$/.test(norm.trim()) });
  }
  if(!lines.length) return { error:'请输入树形文本' };
  var root={ name:'', children:[], indent:-1 }, stack=[root];
  for(var j=0;j<lines.length;j++){
    var l=lines[j];
    while(stack.length>1 && stack[stack.length-1].indent >= l.indent) stack.pop();
    var node={ name:l.name, children:[], indent:l.indent, dir:l.dir };
    stack[stack.length-1].children.push(node);
    stack.push(node);
  }
  return { error:null, root:root, count:lines.length };
}
function trRender(root, ascii){
  var G = ascii ? { tee:'|-- ', last:'`-- ', bar:'|   ', gap:'    ' }
                : { tee:'\u251c\u2500\u2500 ', last:'\u2514\u2500\u2500 ', bar:'\u2502   ', gap:'    ' };
  var out=[];
  function walk(node, prefix){
    for(var i=0;i<node.children.length;i++){
      var c=node.children[i], last = i===node.children.length-1;
      out.push(prefix + (last?G.last:G.tee) + c.name + (c.children.length?'/':''));
      walk(c, prefix + (last?G.gap:G.bar));
    }
  }
  walk(root, '');
  return out.join('\n');
}
function trToJson(root){
  function conv(node){
    if(!node.children.length) return null;
    var o={};
    for(var i=0;i<node.children.length;i++) o[node.children[i].name]=conv(node.children[i]);
    return o;
  }
  return conv(root) || {};
}
function trFromJson(obj){
  function build(o, name){
    var node={ name:name, children:[] };
    if(o && typeof o==='object' && !Array.isArray(o)){
      var keys=Object.keys(o);
      for(var i=0;i<keys.length;i++) node.children.push(build(o[keys[i]], keys[i]));
    } else if(Array.isArray(o)){
      for(var j=0;j<o.length;j++){
        if(o[j] && typeof o[j]==='object') node.children.push(build(o[j], '['+j+']'));
        else node.children.push({ name:String(o[j]), children:[] });
      }
    }
    return node;
  }
  return build(obj, '');
}
function trStats(root){
  var files=0, dirs=0, maxDepth=0;
  function walk(node, d){
    for(var i=0;i<node.children.length;i++){
      var c=node.children[i];
      if(c.children.length){ dirs++; } else { files++; }
      if(d>maxDepth) maxDepth=d;
      walk(c, d+1);
    }
  }
  walk(root, 1);
  return { files:files, dirs:dirs, total:files+dirs, maxDepth:maxDepth };
}
function trPaths(root){
  var out=[];
  function walk(node, prefix){
    for(var i=0;i<node.children.length;i++){
      var c=node.children[i], p=prefix + c.name + (c.children.length?'/':'');
      out.push(p);
      walk(c, prefix + c.name + '/');
    }
  }
  walk(root, '');
  return out;
}
function trFromPaths(text){
  var lines=String(text||'').split(/\n+/).filter(function(l){ return l.trim(); });
  if(!lines.length) return { error:'请输入路径列表' };
  var root={ name:'', children:[], index:{} };
  for(var i=0;i<lines.length;i++){
    var segs=lines[i].trim().replace(/^\.?\//,'').split('/').filter(function(s){ return s!==''; });
    var node=root;
    for(var j=0;j<segs.length;j++){
      var hit=null;
      for(var k=0;k<node.children.length;k++) if(node.children[k].name===segs[j]){ hit=node.children[k]; break; }
      if(!hit){ hit={ name:segs[j], children:[] }; node.children.push(hit); }
      node=hit;
    }
  }
  return { error:null, root:root, count:lines.length };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { trIndentWidth:trIndentWidth, trParseIndent:trParseIndent, trRender:trRender,
    trToJson:trToJson, trFromJson:trFromJson, trStats:trStats, trPaths:trPaths, trFromPaths:trFromPaths };
}
if (typeof window !== 'undefined') {
  window.TreeForgePure = { trIndentWidth:trIndentWidth, trParseIndent:trParseIndent, trRender:trRender,
    trToJson:trToJson, trFromJson:trFromJson, trStats:trStats, trPaths:trPaths, trFromPaths:trFromPaths };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.TreeForgePure;
  function build(){
    return $('mode').value==='paths' ? P.trFromPaths($('src').value) : P.trParseIndent($('src').value);
  }
  function run(kind){
    var r=build();
    if(r.error){ $('err').textContent=r.error; $('out').innerHTML=''; $('dst').value=''; return; }
    $('err').textContent='';
    var s=P.trStats(r.root);
    $('out').innerHTML='<div class="grid">'+
      '<div class="kv"><b>节点总数</b><span>'+s.total+'</span></div>'+
      '<div class="kv"><b>目录 / 叶子</b><span>'+s.dirs+' / '+s.files+'</span></div>'+
      '<div class="kv"><b>最大层级</b><span>'+s.maxDepth+'</span></div>'+
      '<div class="kv"><b>输入行数</b><span>'+r.count+'</span></div></div>';
    if(kind==='json') $('dst').value=JSON.stringify(P.trToJson(r.root), null, 2);
    else if(kind==='paths') $('dst').value=P.trPaths(r.root).join('\n');
    else $('dst').value=P.trRender(r.root, $('ascii').checked);
  }
  $('run').addEventListener('click', function(){ run('tree'); });
  $('json').addEventListener('click', function(){ run('json'); });
  $('plist').addEventListener('click', function(){ run('paths'); });
  $('mode').addEventListener('change', function(){ run('tree'); });
  $('ascii').addEventListener('change', function(){ run('tree'); });
  $('copy').addEventListener('click', function(){ if(navigator.clipboard) navigator.clipboard.writeText($('dst').value); });
  $('src').value='src\n  components\n    Button.tsx\n    Card.tsx\n  utils\n    format.ts\n  index.ts\npublic\n  favicon.svg\nREADME.md';
  run('tree');
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
