<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaultForge</title>
<meta name="description" content="Local-first zero-knowledge encrypted vault. AES-GCM + PBKDF2. Your data never leaves the device.">
<meta name="theme-color" content="#0A0A0B">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="og.svg" type="image/svg+xml">
<style>
:root{
  --canvas:#0A0A0B;
  --card:#141417;
  --surface:#1A1B1E;
  --text:#FFFFFF;
  --text-2:#A1A1AA;
  --text-3:#71717A;
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.14);
  --accent:#5E6AD2;
  --success:#10B981;
  --warning:#F5A623;
  --info:#22D3EE;
  --purple:#A78BFA;
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
[data-theme="light"]{
  --canvas:#FFFFFF;
  --card:#F4F4F5;
  --surface:#EAEAEC;
  --text:#18181B;
  --text-2:#52525B;
  --text-3:#71717A;
  --border:rgba(0,0,0,0.08);
  --border-strong:rgba(0,0,0,0.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--canvas);
  color:var(--text);
  font-family:var(--font);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.muted{color:var(--text-2)}
.small{font-size:12px}
.hidden{display:none !important}
.err{color:var(--warning);font-size:12px;margin:6px 0 0}
button{font-family:inherit}
.btn{
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);
  padding:8px 14px;
  cursor:pointer;
  font-size:13px;
  transition:transform .12s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
}
.btn:hover{background:var(--card); border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn-primary:hover{background:#6b77e0; border-color:#6b77e0}
.btn.block{width:100%;margin-bottom:12px}
.btn-ghost{
  background:transparent;border:1px solid var(--border);color:var(--text-2);
  border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:13px;
  transition:color .15s ease,border-color .15s ease,background .15s ease;
}
.btn-ghost:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface)}
.btn-ghost.danger:hover{color:#fff;border-color:var(--warning);background:rgba(245,166,35,.12)}
.input{
  width:100%;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 11px;font-size:13px;outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,106,210,.18)}
.lbl{display:block;font-size:12px;color:var(--text-2);margin:10px 0 5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg)}
.icon{display:inline-flex;width:18px;height:18px;color:var(--text-2)}
.icon svg{width:100%;height:100%}

/* modal */
.modal-overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:50;padding:20px;
}
.modal{width:100%;max-width:420px;padding:26px;border-radius:var(--radius-lg);
  animation:pop .22s ease;box-shadow:0 20px 60px rgba(0,0,0,.5)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.modal-head h2{font-size:17px;margin:0}
.modal-body{padding:6px 0}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.brand-logo{width:42px;height:42px;color:var(--accent);margin-bottom:12px}
.modal h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
.modal form{margin-top:18px}

/* topbar */
.topbar{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border)}
.brand{font-weight:600;letter-spacing:-.2px;font-size:15px}
.brand b{color:var(--accent)}
.spacer{flex:1}

/* layout */
.layout{display:grid;grid-template-columns:240px 340px 1fr;height:calc(100vh - 57px);min-height:0}
.sidebar{border-right:1px solid var(--border);padding:16px;overflow:auto}
.listpane{border-right:1px solid var(--border);overflow:auto}
.detailpane{overflow:auto;padding:22px}
.catnav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.catnav button{
  display:flex;align-items:center;gap:9px;background:transparent;border:none;color:var(--text-2);
  padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;text-align:left;font-size:13px;width:100%;
  transition:background .12s ease,color .12s ease}
.catnav button:hover{background:var(--surface);color:var(--text)}
.catnav button.active{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.catnav .count{margin-left:auto;font-size:11px;color:var(--text-3)}

/* entry list */
.entry-list{padding:10px}
.entry{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--radius);
  border:1px solid transparent;cursor:pointer;transition:background .12s ease,border-color .12s ease;
}
.entry:hover{background:var(--surface)}
.entry.active{background:var(--surface);border-color:var(--border-strong)}
.entry .eicon{width:32px;height:32px;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.entry .emeta{min-width:0;flex:1}
.entry .etitle{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .esub{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .fav{color:var(--warning);flex:none}
.empty{color:var(--text-3);text-align:center;padding:40px 16px;font-size:13px}

/* detail */
.detail-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.detail-head .dicon{width:40px;height:40px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}
.detail-head h2{margin:0;font-size:18px}
.detail-head .cat{font-size:12px;color:var(--text-3)}
.detail-actions{display:flex;gap:6px;margin-left:auto}
.field-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--border)}
.field-row .fk{width:130px;color:var(--text-2);font-size:12px;flex:none}
.field-row .fv{flex:1;min-width:0;word-break:break-all;font-size:13px}
.field-row .fv.mask{letter-spacing:2px;color:var(--text)}
.field-row .facts{display:flex;gap:4px;flex:none}
.mini{background:var(--surface);border:1px solid var(--border);color:var(--text-2);border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12px;transition:color .12s, border-color .12s}
.mini:hover{color:var(--text);border-color:var(--border-strong)}
.meta-line{font-size:12px;color:var(--text-3);margin-top:14px}

/* strength */
.strength{height:6px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:7px}
.strength > i{display:block;height:100%;width:0;border-radius:99px;transition:width .2s ease,background .2s ease}
.strength-lbl{font-size:11px;margin-top:4px}

/* generator modal */
.gen-out{display:flex;gap:8px;margin:6px 0}
.gen-out .input{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:8px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer}
.toggle input{accent-color:var(--accent)}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input[type=range]{flex:1;accent-color:var(--accent)}
.range-row .rv{min-width:28px;text-align:right;color:var(--text)}

/* brand strip */
.brand-strip{
  position:fixed;right:14px;bottom:12px;z-index:40;
  font-size:11px;color:var(--text-3);letter-spacing:.4px;
  background:var(--card);border:1px solid var(--border);border-radius:99px;
  padding:5px 12px;pointer-events:none;user-select:none;
}
.brand-strip b{color:var(--accent);font-weight:600}

/* toast */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);
  background:var(--surface);border:1px solid var(--border-strong);color:var(--text);
  padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;z-index:60;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* reveal */
.reveal{opacity:0;transform:translateY(8px);transition:opacity .4s ease, transform .4s ease}
.reveal.in{opacity:1;transform:none}

@media (max-width:860px){
  .layout{grid-template-columns:1fr;height:auto}
  .sidebar,.listpane{border-right:none;border-bottom:1px solid var(--border)}
  .detailpane{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  .reveal{opacity:1;transform:none}
}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */

  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
</head>

<script>
var __LS=(function(){try{var s=(typeof window!=='undefined'&&window.localStorage)?window.localStorage:null;if(!s)throw 0;s.setItem('__lsprobe','1');s.removeItem('__lsprobe');return s;}catch(e){var m={};return{getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];},clear:function(){m={};},key:function(i){return Object.keys(m)[i]||null;}};}})();

/* ======================= PURE LOGIC (Node + Browser) ======================= */
'use strict';

function arrayBufferToBase64(buf){
  const bytes = new Uint8Array(buf);
  let bin = '';
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    bin += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(bin);
}
function base64ToArrayBuffer(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function generateSalt(len){ return crypto.getRandomValues(new Uint8Array(len)); }

async function deriveKey(password, salt, iterations){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:salt, iterations:iterations, hash:'SHA-256' },
    base,
    { name:'AES-GCM', length:256 },
    false,
    ['encrypt','decrypt']
  );
}
async function aesEncrypt(key, str){
  const enc = new TextEncoder();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv:iv }, key, enc.encode(str));
  return { iv: arrayBufferToBase64(iv.buffer), ct: arrayBufferToBase64(ct) };
}
async function aesDecrypt(key, ivB64, ctB64){
  const iv = new Uint8Array(base64ToArrayBuffer(ivB64));
  const ct = base64ToArrayBuffer(ctB64);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:iv }, key, ct);
  return new TextDecoder().decode(pt);
}
async function encryptObj(key, obj){
  const r = await aesEncrypt(key, JSON.stringify(obj));
  return { iv:r.iv, ct:r.ct };
}
async function decryptObj(key, blob){
  const json = await aesDecrypt(key, blob.iv, blob.ct);
  return JSON.parse(json);
}
async function sealVault(password, obj, iter){
  iter = iter || 200000;
  const salt = generateSalt(16);
  const key = await deriveKey(password, salt, iter);
  const enc = await encryptObj(key, obj);
  return { v:1, salt: arrayBufferToBase64(salt.buffer), iv: enc.iv, ct: enc.ct, iter: iter };
}
async function unsealVault(blob, password){
  const salt = base64ToArrayBuffer(blob.salt);
  const key = await deriveKey(password, salt, blob.iter);
  return decryptObj(key, blob);
}
function isSequence(s){
  if(s.length < 3) return false;
  let asc = true, desc = true;
  for(let i=1;i<s.length;i++){ if(s.charCodeAt(i)-s.charCodeAt(i-1)!==1){ asc=false; break; } }
  for(let i=1;i<s.length;i++){ if(s.charCodeAt(i)-s.charCodeAt(i-1)!==-1){ desc=false; break; } }
  return asc || desc;
}
function estimateStrength(pw){
  if(!pw || !pw.length) return { score:0, label:'Weak' };
  let charset = 0;
  if(/[a-z]/.test(pw)) charset += 26;
  if(/[A-Z]/.test(pw)) charset += 26;
  if(/[0-9]/.test(pw)) charset += 10;
  if(/[^a-zA-Z0-9]/.test(pw)) charset += 33;
  let entropy = pw.length * Math.log2(charset || 1);
  if(/(.)\1{2,}/.test(pw)) entropy *= 0.6;     // repeated chars
  if(isSequence(pw)) entropy *= 0.5;           // sequential chars
  let score, label;
  if(entropy < 40){ score = Math.max(0, entropy/40); label='Weak'; }
  else if(entropy < 60){ score = 0.5; label='Medium'; }
  else if(entropy < 80){ score = 0.75; label='Strong'; }
  else { score = 1; label='VeryStrong'; }
  return { score: Math.round(score*100)/100, label: label };
}
function generatePassword(opts){
  opts = opts || {};
  const len = opts.length || 16;
  const upper = opts.upper !== false;
  const lower = opts.lower !== false;
  const digit = opts.digit !== false;
  const symbol = opts.symbol !== false;
  const excl = opts.excludeAmbiguous || false;
  const U='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const L='abcdefghijklmnopqrstuvwxyz';
  const D='0123456789';
  const S='!@#$%^&*()-_=+[]{};:,.<>?';
  const filt = (s)=> excl ? s.replace(/[Il1O0o|`]/g,'') : s;
  let pool = '';
  if(upper) pool += filt(U);
  if(lower) pool += filt(L);
  if(digit) pool += filt(D);
  if(symbol) pool += S;
  if(!pool) pool = L;
  const out = [];
  const rnd = new Uint32Array(len);
  crypto.getRandomValues(rnd);
  for(let i=0;i<len;i++) out.push(pool[rnd[i] % pool.length]);
  return out.join('');
}
function validateEntry(cat, fields){
  const errors = [];
  if(!cat) errors.push('category required');
  fields = fields || {};
  const title = (fields.title||'').toString().trim();
  if(!title) errors.push('title required');
  if(title.length > 200) errors.push('title too long');
  return { ok: errors.length === 0, errors: errors };
}
function genId(){
  return 'e_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9);
}
function normalizeEntry(e){
  return {
    id: e.id || genId(),
    cat: e.cat,
    title: (e.title||'').toString(),
    fields: e.fields || {},
    fav: !!e.fav,
    createdAt: e.createdAt || Date.now(),
    updatedAt: e.updatedAt || Date.now()
  };
}

/* Module exports (must precede the window guard) */
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    arrayBufferToBase64, base64ToArrayBuffer, generateSalt,
    deriveKey, aesEncrypt, aesDecrypt, encryptObj, decryptObj,
    sealVault, unsealVault, estimateStrength, generatePassword,
    validateEntry, normalizeEntry, isSequence
  };
}

  /* ---------- crypto glue ---------- */
  async function createVault(password){
    const salt = generateSalt(16);
    const key = await deriveKey(password, salt, state.iter);
    const data = { entries:[], settings:{} };
    const enc = await encryptObj(key, data);
    const blob = { v:1, salt: arrayBufferToBase64(salt.buffer), iv: enc.iv, ct: enc.ct, iter: state.iter };
    __LS.setItem(LS_KEY, JSON.stringify(blob));
    state.key = key; state.data = data; state.saltB64 = blob.salt; state.locked = false;
  }
  async function unlockVault(password){
    const raw = __LS.getItem(LS_KEY);
    const blob = JSON.parse(raw);
    const salt = base64ToArrayBuffer(blob.salt);
    const key = await deriveKey(password, salt, blob.iter);
    const data = await decryptObj(key, blob); // throws on wrong password
    state.key = key; state.data = data; state.saltB64 = blob.salt; state.iter = blob.iter; state.locked = false;
  }
  async function saveVault(){
    if(!state.key || !state.data) return;
    const enc = await encryptObj(state.key, state.data);
    const blob = { v:1, salt: state.saltB64, iv: enc.iv, ct: enc.ct, iter: state.iter };
    __LS.setItem(LS_KEY, JSON.stringify(blob));
  }

      cnt.textContent = n; b.appendChild(cnt);
      if(state.filter===key) b.classList.add('active');
      b.addEventListener('click', ()=>{ state.filter=key; renderCatNav(); renderList(); });
      return b;
    };
    nav.appendChild(mkItem('all', t('catAll')));
    CATS.forEach(c=> nav.appendChild(mkItem(c, catLabel(c))));
  }

  function visibleEntries(){
    let es = state.data.entries.slice();
    if(state.filter!=='all') es = es.filter(e=>e.cat===state.filter);
    const q = state.search.trim().toLowerCase();
    if(q){
      es = es.filter(e=>{
        if(e.title.toLowerCase().includes(q)) return true;
        return Object.values(e.fields).some(v=> v!=null && String(v).toLowerCase().includes(q));
      });
    }
    es.sort((a,b)=> (b.fav?1:0)-(a.fav?1:0) || (b.updatedAt-a.updatedAt));
    return es;
  }
  function fieldSummary(e){
    const f = e.fields||{};
    if(e.cat==='login') return f.username || f.url || '';
    if(e.cat==='card') return f.holder || f.number || '';
    if(e.cat==='identity') return f.email || f.phone || '';
    if(e.cat==='note') return (f.text||'').slice(0,40);
    return '';
  }

  function closeEntryModal(){ const m=$('entryModal'); if(m){ m.classList.remove('open'); m.textContent=''; } }
  function renderEmFields(e, wrap){
    wrap.textContent='';
    const schema = SCHEMAS[e.cat] || [];
    schema.forEach(field=>{
      const lbl = mk('label','lbl', field.l[state.lang]||field.k); wrap.appendChild(lbl);

  function updateFieldStrength(pw){

  function commitEntry(base){
    const title = $('emTitle').value.trim();
    const cat = $('emCat').value;
    const fields = {};
    (SCHEMAS[cat]||[]).forEach(f=>{ const el=$('em_'+f.k); if(el) fields[f.k]=el.value; });
    fields.title = title;
    const v = validateEntry(cat, fields);
    if(!v.ok){ toast(v.errors[0]); return; }
    if(editingId){
      const e = state.data.entries.find(x=>x.id===editingId);
      e.title=title; e.cat=cat; e.fields=fields; e.updatedAt=Date.now();
    } else {
      state.data.entries.push(normalizeEntry({ id:base.id, cat, title, fields, fav:false, createdAt:Date.now(), updatedAt:Date.now() }));

    saveVault(); closeEntryModal(); renderAll();

  function closeGenModal(){ const m=$('genModal'); if(m){ m.classList.remove('open'); m.textContent=''; } }
  function doGenerate(){
    const len = parseInt($('genLen').value,10);
    const opts = { length:len };
    ['genU','genL','genD','genS','genX'].forEach(id=>{
      const cb=$(''+id); if(cb) opts[cb.dataset.opt] = cb.checked;
    });
    const pw = generatePassword(opts);
    $('genOut').value = pw;
    const r = estimateStrength(pw);
    const i=$('gen_strength_i'); const l=$('gen_strength_lbl');
    if(i){ i.style.width=Math.round(r.score*100)+'%'; i.style.background=STRENGTH_COLOR[r.label]; }
    if(l){ l.textContent=t('strength')+': '+r.label; l.style.color=STRENGTH_COLOR[r.label]; }
  }

  /* ---------- export / import ---------- */
  function exportVault(){
    const raw = __LS.getItem(LS_KEY);
    if(!raw){ toast('No vault'); return; }
    const blob = new Blob([raw], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='vaultforge.vault.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast(t('exported'));
  }
  function onImport(e){
    const file = e.target.files && e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const obj = JSON.parse(reader.result);
        if(!obj || obj.v!==1 || !obj.salt || !obj.iv || !obj.ct || !obj.iter) throw new Error('bad');
        __LS.setItem(LS_KEY, JSON.stringify(obj));
        toast(t('imported'));
        closeEntryModal(); closeGenModal();
        showUnlock();
      }catch(err){ toast(t('invalidFile')); }
    };
    reader.readAsText(file);
    e.target.value='';
  }

  /* ---------- lock / unlock ---------- */
  function showCreate(){
    mode='create';
    $('lockTitle').textContent='VaultForge';
    $('lockSub').textContent = t('createSub');
    $('lockPwLbl').textContent = t('pwLabel');
    $('lockPw2Lbl').textContent = t('pwConfirmLabel');
    $('lockPw2').hidden = false;
    $('lockSubmit').textContent = t('createBtn');
    $('lockPw').value=''; $('lockPw2').value=''; hideLockErr();
    $('unlockModal').classList.add('open');
  }
  function showUnlock(){
    mode='unlock';
    $('lockTitle').textContent='VaultForge';
    $('lockSub').textContent = t('unlockSub');
    $('lockPwLbl').textContent = t('pwLabel');
    $('lockPw2Lbl').textContent = t('pwConfirmLabel');
    $('lockPw2').hidden = true;
    $('lockSubmit').textContent = t('unlockBtn');
    $('lockPw').value=''; hideLockErr();
    $('unlockModal').classList.add('open');
  }
  function showLockErr(msg){ const e=$('lockErr'); e.textContent=msg; e.hidden=false; }
  function hideLockErr(){ const e=$('lockErr'); e.hidden=true; }
  async function onLockSubmit(ev){
    ev.preventDefault();
    const pw = $('lockPw').value;
    if(mode==='create'){
      const pw2 = $('lockPw2').value;
      if(pw.length<8){ showLockErr(t('pwShort')); return; }
      if(pw!==pw2){ showLockErr(t('pwMismatch')); return; }
      if(!hasCrypto()){ showLockErr(t('secureWarn')); return; }
      await createVault(pw); afterUnlock();
    } else {
      if(!hasCrypto()){ showLockErr(t('secureWarn')); return; }
      try{ await unlockVault(pw); afterUnlock(); }
      catch(err){ showLockErr(t('wrongPw')); }
    }
  }
  function afterUnlock(){
    $('unlockModal').classList.remove('open');
    $('main').classList.remove('hidden');
    renderAll(); resetLockTimer();
  }
  function lockNow(){
    state.key=null; state.data=null; state.selectedId=null; state.locked=true;
    $('main').classList.add('hidden');
    $('entryList').textContent=''; $('detailPane').textContent=''; $('catNav').textContent='';
    closeEntryModal(); closeGenModal();
    showUnlock();
  }

  /* ---------- auto-lock ---------- */
  let lockTimer=null, hiddenTimer=null;
  function startLockTimer(){ resetLockTimer(); }
  function resetLockTimer(){
    if(lockTimer) clearTimeout(lockTimer);
    if(state.locked) return;
    lockTimer = setTimeout(lockNow, 5*60*1000);
  }
  function scheduleHiddenLock(){
    if(hiddenTimer) clearTimeout(hiddenTimer);
    if(state.locked) return;
    hiddenTimer = setTimeout(()=>{ if(document.hidden) lockNow(); }, 30*1000);
  }

  /* ---------- theme / lang ---------- */
  function applyLang(){
    const L=I18N[state.lang];
    $('langBtn').textContent = L.lang;
    $('lockBtn').textContent = L.lock;
    $('addBtn').textContent = '+ ' + L.newEntry;
    $('search').placeholder = L.search;
    $('exportBtn').textContent = L.exportBtn;
    $('importBtn').textContent = L.importBtn;
    document.documentElement.lang = state.lang;
    if(state.data) renderAll();
    if(!state.locked){ if(mode==='create') showCreate(); else showUnlock(); }
  }
  function toggleLang(){
    state.lang = (state.lang==='zh')?'en':'zh';
    __LS.setItem('vaultforge.lang', state.lang);
    applyLang();
  }
  function toggleTheme(){
    const cur = document.documentElement.getAttribute('data-theme')||'dark';
    const next = cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme', next);
    __LS.setItem('vaultforge.theme', next);
  }

  /* ---------- reveal animation ---------- */
  function applyReveal(){
    const nodes = document.querySelectorAll('.reveal');
    if('IntersectionObserver' in window){
      const io = new IntersectionObserver((ents)=>{
        ents.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
      }, { threshold:0.05 });
      nodes.forEach(n=>io.observe(n));
    } else {
      nodes.forEach(n=>n.classList.add('in'));
    }
  }

  /* ---------- init ---------- */
  function init(){
    $('lockLogo').innerHTML = ICONS.vault;
    const lang = __LS.getItem('vaultforge.lang');
    if(lang==='en') state.lang='en';
    const theme = __LS.getItem('vaultforge.theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    applyLang();
    if(!hasCrypto()){ $('secureNote').textContent = t('secureWarn'); }
    else { $('secureNote').textContent = t('secureNote'); }

    $('lockForm').addEventListener('submit', onLockSubmit);
    $('langBtn').addEventListener('click', toggleLang);
    $('themeBtn').addEventListener('click', toggleTheme);
    $('lockBtn').addEventListener('click', lockNow);
    $('addBtn').addEventListener('click', ()=>openEntryModal(null));
    $('search').addEventListener('input', (e)=>{ state.search=e.target.value; renderList(); });
    $('exportBtn').addEventListener('click', exportVault);
    $('importBtn').addEventListener('click', ()=>$('importInput').click());
    $('importInput').addEventListener('change', onImport);

    ['click','keydown','mousemove','touchstart'].forEach(ev=>window.addEventListener(ev, resetLockTimer, {passive:true}));
    document.addEventListener('visibilitychange', ()=>{ if(document.hidden) scheduleHiddenLock(); else resetLockTimer(); });
    startLockTimer();

    if(__LS.getItem(LS_KEY)) showUnlock(); else showCreate();

    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} });
    }
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
}
</script>
