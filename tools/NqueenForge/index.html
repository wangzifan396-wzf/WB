<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <h1>NqueenForge</h1>
  <p class="sub">N 皇后：回溯剪枝求解 + 解数表 + 棋盘渲染 · 单文件 · 零依赖 · 本地优先</p>

<div class="opt">
  <label>棋盘 N <input id="n" type="number" value="8" min="1" max="12" style="width:70px"></label>
  <label>展示第几个解 <input id="idx" type="number" value="1" min="1" style="width:80px"></label>
</div>
<div class="row">
  <button id="run">求解</button>
  <button id="table">1-10 解数表</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>结果</label>
<div class="out" id="out" aria-live="polite" style="overflow:auto">解与棋盘显示在这里</div>
<script>
function nqSolve(n, limit){
  if(!Number.isInteger(n)||n<1||n>13) return { value:null, error:'N 须为 1-13 的整数' };
  var cap=(limit===undefined)?100:limit;
  var sols=[], cols=[], nodes=0;
  var colUsed={}, d1={}, d2={};
  function bt(row){
    if(row===n){ if(sols.length<cap) sols.push(cols.slice()); return; }
    for(var c=0;c<n;c++){
      if(colUsed[c]||d1[row-c]||d2[row+c]) continue;
      nodes++;
      colUsed[c]=1; d1[row-c]=1; d2[row+c]=1; cols.push(c);
      bt(row+1);
      cols.pop(); delete colUsed[c]; delete d1[row-c]; delete d2[row+c];
      if(sols.length>=cap && cap>0 && countAll===false) return;
    }
  }
  var countAll=true;
  var total=0;
  // full count pass (fast, no storage)
  (function cnt(row){
    if(row===n){ total++; return; }
    for(var c=0;c<n;c++){
      if(colUsed[c]||d1[row-c]||d2[row+c]) continue;
      colUsed[c]=1; d1[row-c]=1; d2[row+c]=1;
      cnt(row+1);
      delete colUsed[c]; delete d1[row-c]; delete d2[row+c];
    }
  })(0);
  countAll=false;
  bt(0);
  return { value:{ n:n, total:total, solutions:sols, nodes:nodes }, error:null };
}
function nqValidate(cols){
  if(!Array.isArray(cols)||!cols.length) return false;
  var n=cols.length;
  for(var i=0;i<n;i++){
    if(!Number.isInteger(cols[i])||cols[i]<0||cols[i]>=n) return false;
    for(var j=i+1;j<n;j++){
      if(cols[i]===cols[j]) return false;
      if(Math.abs(cols[i]-cols[j])===Math.abs(i-j)) return false;
    }
  }
  return true;
}
function nqCounts(maxN){
  var out=[];
  for(var n=1;n<=maxN;n++) out.push({ n:n, count:nqSolve(n, 0).value.total });
  return out;
}
function nqSvg(cols){
  var n=cols.length, C=Math.max(18, Math.min(44, Math.floor(400/n)));
  var W=n*C+4, H=n*C+4;
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  s+='<rect width="'+W+'" height="'+H+'" fill="#0A0A0B"/>';
  for(var y=0;y<n;y++) for(var x=0;x<n;x++){
    s+='<rect x="'+(x*C+2)+'" y="'+(y*C+2)+'" width="'+C+'" height="'+C+'" fill="'+((x+y)%2?'#141417':'#1A1B1E')+'"/>';
  }
  for(var r=0;r<n;r++){
    var cx=cols[r]*C+2+C/2, cy=r*C+2+C/2;
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(C*0.32)+'" fill="#5E6AD2" stroke="#A78BFA" stroke-width="1.5"/>';
    s+='<text x="'+cx+'" y="'+(cy+C*0.13)+'" text-anchor="middle" font-size="'+(C*0.38)+'" fill="#FFFFFF" font-family="system-ui,sans-serif">♛</text>';
  }
  s+='</svg>';
  return s;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { nqSolve:nqSolve, nqValidate:nqValidate, nqCounts:nqCounts, nqSvg:nqSvg };
}
if (typeof window !== 'undefined') {
  window.NqueenForgePure = { nqSolve:nqSolve, nqValidate:nqValidate, nqCounts:nqCounts, nqSvg:nqSvg };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.NqueenForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var n=Number($('n').value), idx=Number($('idx').value)||1;
      var r=P.nqSolve(n);
      if(r.error){ $('err').textContent=r.error; return; }
      if(!r.value.total){ $('out').innerHTML='<div style="color:#EF4444">N='+n+' 无解</div>'; return; }
      if(idx>r.value.solutions.length) idx=r.value.solutions.length;
      var sol=r.value.solutions[idx-1];
      $('out').innerHTML=P.nqSvg(sol)+
        '<div style="margin-top:8px;color:#A1A1AA;font-size:12px">N='+n+' 共 '+r.value.total+' 个解 · 展示第 '+idx+' 个 · 列序 ['+sol.join(', ')+']</div>';
    });
    $('table').addEventListener('click', function(){
      $('err').textContent='';
      var rows=P.nqCounts(10);
      var html='<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:#A1A1AA"><th style="text-align:left;padding:6px">N</th><th style="text-align:right;padding:6px">解数</th></tr>';
      rows.forEach(function(r){
        html+='<tr style="border-top:1px solid rgba(255,255,255,0.08);color:#FFFFFF"><td style="padding:6px">'+r.n+'</td><td style="text-align:right;padding:6px">'+r.count+'</td></tr>';
      });
      $('out').innerHTML=html+'</table>';
    });
    $('clear').addEventListener('click', function(){ $('out').textContent='解与棋盘显示在这里'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
