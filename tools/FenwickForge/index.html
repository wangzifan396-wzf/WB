/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}

<body>
<div class="app">
  <h1>FenwickForge</h1>
  <p class="sub">树状数组：O(log n) 单点更新与前缀 / 区间和，树上二分 · 单文件 · 零依赖 · 本地优先</p>

<label>初始数组（逗号分隔）</label>
<input id="arr" type="text" value="3, 2, -1, 6, 5, 4, -3, 3" aria-label="arr">
<div class="grid2">
  <label>单点更新：下标 i（0 起）</label><input id="ui" type="number" value="2" min="0" aria-label="ui">
  <label>增量 delta</label><input id="ud" type="number" value="4" aria-label="ud">
</div>
<div class="grid2">
  <label>区间查询 l</label><input id="ql" type="number" value="1" min="0" aria-label="ql">
  <label>区间查询 r（含）</label><input id="qr" type="number" value="5" min="0" aria-label="qr">
</div>
<div class="row">
  <button id="build">建树</button>
  <button id="upd">更新</button>
  <button id="query">区间和</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">建树后更新与查询</div>
<script>
function fwCreate(n){
  return { n:n, tree:new Array(n+1).fill(0) };
}
function fwBuild(arr){
  var fw=fwCreate(arr.length);
  for(var i=0;i<arr.length;i++) fwUpdate(fw, i, arr[i]);
  return fw;
}
function fwUpdate(fw, i, delta){
  if(i<0||i>=fw.n) throw new Error('index out of range: '+i);
  for(var x=i+1;x<=fw.n;x+=x&(-x)) fw.tree[x]+=delta;
  return fw;
}
function fwPrefix(fw, i){
  if(i<0) return 0;
  if(i>=fw.n) i=fw.n-1;
  var s=0;
  for(var x=i+1;x>0;x-=x&(-x)) s+=fw.tree[x];
  return s;
}
function fwRange(fw, l, r){
  if(l>r) return 0;
  return fwPrefix(fw, r)-fwPrefix(fw, l-1);
}
function fwGet(fw, i){
  return fwRange(fw, i, i);
}
function fwToArray(fw){
  var out=[];
  for(var i=0;i<fw.n;i++) out.push(fwGet(fw,i));
  return out;
}
function fwLowerBound(fw, target){
  var pos=0, rem=target, log=1;
  while((log<<1)<=fw.n) log<<=1;
  for(var step=log;step>0;step>>=1){
    if(pos+step<=fw.n && fw.tree[pos+step]<rem){
      pos+=step; rem-=fw.tree[pos];
    }
  }
  return pos<fw.n?pos:-1;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { fwCreate:fwCreate, fwBuild:fwBuild, fwUpdate:fwUpdate, fwPrefix:fwPrefix,
    fwRange:fwRange, fwGet:fwGet, fwToArray:fwToArray, fwLowerBound:fwLowerBound };
}
if (typeof window !== 'undefined') {
  window.FenwickForgePure = { fwCreate:fwCreate, fwBuild:fwBuild, fwUpdate:fwUpdate, fwPrefix:fwPrefix,
    fwRange:fwRange, fwGet:fwGet, fwToArray:fwToArray, fwLowerBound:fwLowerBound };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.FenwickForgePure;
    var fw=null;
    function parse(){
      return $('arr').value.split(',').map(function(x){ return Number(x.trim()); }).filter(function(x){ return !isNaN(x); });
    }
    $('build').addEventListener('click', function(){
      $('err').textContent='';
      var a=parse();
      if(!a.length){ $('err').textContent='数组为空'; return; }
      fw=P.fwBuild(a);
      $('out').textContent='已建树 n='+fw.n+'\n当前数组: ['+P.fwToArray(fw).join(', ')+']\n总和: '+P.fwPrefix(fw, fw.n-1);
    });
    $('upd').addEventListener('click', function(){
      $('err').textContent='';
      if(!fw){ $('err').textContent='请先建树'; return; }
      try {
        P.fwUpdate(fw, Number($('ui').value), Number($('ud').value));
        $('out').textContent='更新后: ['+P.fwToArray(fw).join(', ')+']\n总和: '+P.fwPrefix(fw, fw.n-1);
      } catch(e){ $('err').textContent=e.message; }
    });
    $('query').addEventListener('click', function(){
      $('err').textContent='';
      if(!fw){ $('err').textContent='请先建树'; return; }
      var l=Number($('ql').value), r=Number($('qr').value);
      $('out').textContent='sum['+l+'..'+r+'] = '+P.fwRange(fw, l, r);
    });
    $('clear').addEventListener('click', function(){ fw=null; $('out').textContent='建树后更新与查询'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
