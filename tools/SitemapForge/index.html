<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>SitemapForge — sitemap.xml 生成器：从 URL 列表生成标准站点地图，支持频率/优先级/日期。</title>
<meta property="og:title" content="SitemapForge">
<meta property="og:description" content="sitemap.xml 生成器：URL 列表生成标准站点地图，离线可用">
<meta property="og:image" content="./og.png">
<meta name="description" content="sitemap.xml 生成器：URL 列表生成标准站点地图，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>SitemapForge</h1>
  <p class="sub">sitemap.xml 生成器：URL 列表一键生成标准站点地图，支持更新频率 / 优先级 / 日期 · 单文件 · 零依赖 · 本地优先</p>

<label>URL 列表（每行一个，以 http(s):// 开头）</label>
<textarea id="src" rows="6" spellcheck="false" placeholder="https://example.com/&#10;https://example.com/about"></textarea>
<div class="row">
  <label style="margin:0 8px 0 0">更新频率 <select id="cf"><option value="">—</option><option>daily</option><option>weekly</option><option>monthly</option></select></label>
  <label style="margin:0 8px 0 0">优先级 <input type="text" id="pr" value="0.8" style="max-width:70px"></label>
  <label style="margin:0 8px 0 0"><input type="checkbox" id="lm" checked> 含今天日期</label>
</div>
<div class="row">
  <button id="gen">生成 sitemap.xml</button>
  <button id="copy" class="ghost">复制</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>

function smParse(text){
  var lines=String(text||'').split(/\r?\n/), urls=[], errors=[];
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim(); if(!l) continue;
    if(/^https?:\/\/.+/i.test(l)) urls.push(l); else errors.push(l);
  }
  return { urls:urls, errors:errors };
}
function smEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function smBuild(urls, opts){
  opts=opts||{};
  var xml='<?xml version="1.0" encoding="UTF-8"?>\n';
  xml+='<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
  for(var i=0;i<urls.length;i++){
    xml+='  <url><loc>'+smEsc(urls[i])+'</loc>';
    if(opts.lastmod) xml+='<lastmod>'+smEsc(opts.lastmod)+'</lastmod>';
    if(opts.changefreq) xml+='<changefreq>'+smEsc(opts.changefreq)+'</changefreq>';
    if(opts.priority!=null) xml+='<priority>'+opts.priority+'</priority>';
    xml+='</url>\n';
  }
  xml+='</urlset>';
  return xml;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { smParse:smParse, smBuild:smBuild, smEsc:smEsc };
}
if (typeof window !== 'undefined') {
  window.SitemapForgePure = { smParse:smParse, smBuild:smBuild, smEsc:smEsc };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.SitemapForgePure;
  function gen(){
    var p=P.smParse($('src').value);
    if(p.urls.length===0){ $('err').textContent='没有有效的 URL'; $('out').innerHTML=''; return; }
    $('err').textContent = p.errors.length? ('已忽略 '+p.errors.length+' 个非法行') : '';
    var opts={ changefreq:$('cf').value||null, priority: $('pr').value? Number($('pr').value):null };
    if($('lm').checked) opts.lastmod=new Date().toISOString().slice(0,10);
    var xml=P.smBuild(p.urls, opts);
    $('out').innerHTML='<pre style="white-space:pre-wrap;word-break:break-all;font:12px/1.5 ui-monospace,monospace">'+P.smEsc(xml)+'</pre>';
  }
  $('gen').addEventListener('click', gen);
  $('copy').addEventListener('click', function(){ if(navigator.clipboard) navigator.clipboard.writeText($('out').textContent); });
  $('src').value='https://example.com/\nhttps://example.com/about';
  gen();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
