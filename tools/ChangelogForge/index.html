<label for="commits">Commit 列表（每行一条 Conventional Commits）</label>
<textarea id="commits" rows="7" placeholder="feat(api): 新增缓存&#10;fix: 修复空指针&#10;feat!: 破坏性变更示例">feat(api): 新增缓存
fix: 修复空指针

<script>
var CC_TYPES = {feat:'Features', fix:'Bug Fixes', perf:'Performance', docs:'Documentation', style:'Styles', refactor:'Refactoring', test:'Tests', build:'Build', ci:'CI', chore:'Chores', revert:'Reverts'};
function ccParseLine(line){
  line=line.trim();
  if(!line) return null;
  var m=/^(\w+)(\(([^)]*)\))?(!)?\s*:\s*(.*)$/.exec(line);
  if(!m) return null;
  return {type:m[1].toLowerCase(), scope:m[3]||null, breaking:!!m[4], subject:m[5].trim()};
}
function ccBump(commits){
  var hasBreaking=false, hasFeat=false, hasFix=false;
  for(var i=0;i<commits.length;i++){
    if(commits[i].breaking) hasBreaking=true;
    if(commits[i].type==='feat') hasFeat=true;
    if(commits[i].type==='fix') hasFix=true;
  }
  if(hasBreaking) return 'major';
  if(hasFeat) return 'minor';
  if(hasFix) return 'patch';
  return 'none';
}
function ccNextVersion(ver, bump){
  var m=/^v?(\d+)\.(\d+)\.(\d+)/.exec(ver.trim());
  if(!m) return null;
  var major=+m[1], minor=+m[2], patch=+m[3];
  if(bump==='major') return (major+1)+'.0.0';
  if(bump==='minor') return major+'.'+(minor+1)+'.0';
  if(bump==='patch') return major+'.'+minor+'.'+(patch+1);
  return ver;
}
function ccGroup(commits){
  var g={};
  for(var i=0;i<commits.length;i++){ var c=commits[i]; (g[c.type]||(g[c.type]=[])).push(c); }
  return g;
}
function ccParse(text){
  var lines=String(text).split(/\r?\n/);
  var out=[];
  for(var i=0;i<lines.length;i++){
    if(/BREAKING CHANGE:/.test(lines[i]) && out.length) out[out.length-1].breaking=true;
    var c=ccParseLine(lines[i]);
    if(c) out.push(c);
  }
  return out;
}
function ccChangelog(text, opts){
  opts=opts||{};
  var commits=ccParse(text);
  var groups=ccGroup(commits);
  var order=['feat','fix','perf','refactor','docs','style','test','build','ci','chore','revert'];
  var lines=[];
  var title = opts.version ? ('## '+opts.version) : '## Changes';
  if(opts.date) title += ' ('+opts.date+')';
  lines.push(title); lines.push('');
  var any=false;
  for(var i=0;i<order.length;i++){
    var t=order[i];
    if(groups[t]){
      any=true;
      lines.push('### '+(CC_TYPES[t]||t));
      for(var j=0;j<groups[t].length;j++){
        var c=groups[t][j];
        lines.push('- '+(c.scope?('**'+c.scope+'**: '):'')+c.subject+(c.breaking?' (BREAKING)':''));
      }
      lines.push('');
    }
  }
  if(!any) lines.push('_无变更_');
  return lines.join('\n');
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parse:ccParse, parseLine:ccParseLine, bump:ccBump, nextVersion:ccNextVersion, group:ccGroup, changelog:ccChangelog };
}
if (typeof window !== 'undefined') {
  window.ChangelogForgePure = { parse:ccParse, bump:ccBump, nextVersion:ccNextVersion, changelog:ccChangelog };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.ChangelogForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    $('gen').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var cur=$('cur').value.trim()||'0.0.0';
        var bump=P.bump(P.parse($('commits').value));
        var next=P.nextVersion(cur, bump) || cur;
        var md=P.changelog($('commits').value, {version:next});
        md += '\n\n> 推断升级：' + bump + '  →  ' + next;
        $('out').textContent = md;
      } catch(e){ $('err').textContent=e.message; }
    });
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('commits').value=''; $('out').textContent='变更日志会显示在这里'; });
  })();
}
</script>

function zh(){try{var l=localStorage.getItem('nano-lang')||document.documentElement.lang||'zh';return String(l).indexOf('en')!==0;}catch(e){return true;}}

window.nanoToast=show;

try{if(document.execCommand){var oe=document.execCommand.bind(document);document.execCommand=function(c){var r=oe.apply(null,arguments);if(String(c).toLowerCase()==='copy'){show(r?(zh()?'已复制':'Copied'):(zh()?'复制失败':'Copy failed'),!r);}return r;};}}catch(e){}
})();
