/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}

<body>
<div class="app">
  <h1>VectorForge</h1>
  <p class="sub">向量相似度计算器：余弦 / 欧氏 / 曼哈顿 / 点积 + Top-K 检索，RAG 向量度量 · 单文件 · 零依赖 · 本地优先</p>

<label>向量 A（逗号或空格分隔）</label>
<input id="va" type="text" value="1, 2, 3">
<label>向量 B</label>
<input id="vb" type="text" value="4, 5, 6">
<div class="opt">
  <label>度量
    <select id="metric"><option value="cosine">余弦相似度 Cosine</option><option value="euclidean">欧氏距离 Euclidean</option><option value="manhattan">曼哈顿距离 Manhattan</option><option value="dot">点积 Dot</option></select>
  </label>
</div>
<div class="row">
  <button id="run">计算</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入两个等长向量后计算</div>
<script>
function parseVec(s){
  if(!s || !String(s).trim()) return { value:null, error:'向量为空' };
  var parts=String(s).trim().split(/[,\s]+/).filter(function(x){return x.length;});
  var out=[];
  for(var i=0;i<parts.length;i++){
    var n=Number(parts[i]);
    if(!isFinite(n)) return { value:null, error:'非法数字: '+parts[i] };
    out.push(n);
  }
  return { value:out, error:null };
}
function dot(a,b){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]*b[i]; return s; }
function norm(a){ return Math.sqrt(dot(a,a)); }
function cosineSim(a,b){
  if(a.length!==b.length) throw new Error('DIM_MISMATCH');
  var na=norm(a), nb=norm(b);
  if(na===0||nb===0) throw new Error('ZERO_VECTOR');
  return dot(a,b)/(na*nb);
}
function euclidean(a,b){
  if(a.length!==b.length) throw new Error('DIM_MISMATCH');
  var s=0; for(var i=0;i<a.length;i++){ var d=a[i]-b[i]; s+=d*d; }
  return Math.sqrt(s);
}
function manhattan(a,b){
  if(a.length!==b.length) throw new Error('DIM_MISMATCH');
  var s=0; for(var i=0;i<a.length;i++) s+=Math.abs(a[i]-b[i]);
  return s;
}
function topK(query, docs, k, metric){
  metric = metric || 'cosine';
  var scored = docs.map(function(d, idx){
    var s;
    if(metric==='cosine') s=cosineSim(query, d.vec);
    else if(metric==='dot') s=dot(query, d.vec);
    else if(metric==='manhattan') s=-manhattan(query, d.vec);
    else s=-euclidean(query, d.vec);
    return { id:(d.id!==undefined?d.id:idx), score:s };
  });
  scored.sort(function(x,y){ return y.score-x.score; });
  return scored.slice(0, k||scored.length);
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parseVec:parseVec, dot:dot, norm:norm, cosineSim:cosineSim,
    euclidean:euclidean, manhattan:manhattan, topK:topK };
}
if (typeof window !== 'undefined') {
  window.VectorForgePure = { parseVec:parseVec, dot:dot, norm:norm, cosineSim:cosineSim,
    euclidean:euclidean, manhattan:manhattan, topK:topK };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.VectorForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var ra=P.parseVec($('va').value), rb=P.parseVec($('vb').value);
        if(ra.error) throw new Error('A: '+ra.error);
        if(rb.error) throw new Error('B: '+rb.error);
        var m=$('metric').value, v;
        if(m==='cosine') v=P.cosineSim(ra.value, rb.value);
        else if(m==='dot') v=P.dot(ra.value, rb.value);
        else if(m==='manhattan') v=P.manhattan(ra.value, rb.value);
        else v=P.euclidean(ra.value, rb.value);
        var lines=['维度: '+ra.value.length, m+' = '+ (Math.round(v*1e6)/1e6),
                   '|A| = '+(Math.round(P.norm(ra.value)*1e6)/1e6), '|B| = '+(Math.round(P.norm(rb.value)*1e6)/1e6)];
        $('out').textContent=lines.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('va').value=''; $('vb').value=''; $('out').textContent='输入两个等长向量后计算'; });
  })();
}
</script>
