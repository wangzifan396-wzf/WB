<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>HarmonographForge — 谐振图（Harmonograph）：多摆正弦叠加生成优雅的衰减曲线图案，可调频率/相位/阻尼，离线可用。</title>
<meta property="og:title" content="HarmonographForge">
<meta property="og:description" content="谐振图（Harmonograph）：多摆正弦叠加生成优雅的衰减曲线图案，可调频率/相位/阻尼，离线可用。">
<meta property="og:image" content="./og.png">
<meta name="description" content="谐振图（Harmonograph）：多摆正弦叠加生成优雅的衰减曲线图案，可调频率/相位/阻尼，离线可用。 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="app">
  <h1>HarmonographForge</h1>
  <p class="sub">谐振图（Harmonograph）：多摆正弦叠加生成优雅的衰减曲线图案，可调频率/相位/阻尼，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="grid2">
  <label>频率 f1</label><input id="f1" type="number" value="2.01" step="0.01">
  <label>频率 f2</label><input id="f2" type="number" value="3" step="0.01">
  <label>相位 p1 (rad)</label><input id="p1" type="number" value="0" step="0.1">
  <label>阻尼 d</label><input id="d" type="number" value="0.004" step="0.001" min="0">
</div>
<div class="row">
  <button id="draw">绘制</button>
  <button id="rand" class="ghost">随机</button>
</div>
<div class="err" id="err"></div>
<canvas id="cv" width="520" height="360" style="width:100%;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;"></canvas>
<script>
function hmgPoints(p){
  var pts=[]; var N=p.N||2200; var dt=p.dt||0.03;
  for(var i=0;i<N;i++){ var t=i*dt;
    var x=p.A1*Math.sin(p.f1*t+p.p1)*Math.exp(-p.d1*t) + p.A2*Math.sin(p.f2*t+p.p2)*Math.exp(-p.d2*t);
    var y=p.A3*Math.sin(p.f3*t+p.p3)*Math.exp(-p.d3*t) + p.A4*Math.sin(p.f4*t+p.p4)*Math.exp(-p.d4*t);
    pts.push({x:x,y:y});
  }
  return pts;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { hmgPoints:hmgPoints };
}
if (typeof window !== 'undefined') {
  window.HarmonographForgePure = { hmgPoints:hmgPoints };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.HarmonographForgePure;
    function params(){ return { A1:1,A2:1,A3:1,A4:1, f1:Number($('f1').value)||2, f2:Number($('f2').value)||3, f3:Number($('f1').value)||2, f4:Number($('f2').value)||3, p1:Number($('p1').value)||0, p2:Math.PI/2, p3:Math.PI/4, p4:0, d1:Number($('d').value)||0, d2:Number($('d').value)||0, d3:Number($('d').value)||0, d4:Number($('d').value)||0 }; }
    function draw(){
      $('err').textContent='';
      try {
        var pts=P.hmgPoints(params());
        var cv=$('cv'); var ctx=cv.getContext('2d'); if(!ctx) return;
        var W=cv.width, H=cv.height; ctx.fillStyle='#0A0A0B'; ctx.fillRect(0,0,W,H);
        var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
        for(var i=0;i<pts.length;i++){ if(pts[i].x<minx)minx=pts[i].x; if(pts[i].x>maxx)maxx=pts[i].x; if(pts[i].y<miny)miny=pts[i].y; if(pts[i].y>maxy)maxy=pts[i].y; }
        var sx=(W-40)/((maxx-minx)||1), sy=(H-40)/((maxy-miny)||1), s=Math.min(sx,sy);
        ctx.strokeStyle='#22D3EE'; ctx.lineWidth=1; ctx.globalAlpha=0.85; ctx.beginPath();
        for(var i=0;i<pts.length;i++){ var x=20+(pts[i].x-minx)*s, y=20+(pts[i].y-miny)*s; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
        ctx.stroke(); ctx.globalAlpha=1;
      } catch(e){ $('err').textContent=e.message; }
    }
    $('draw').addEventListener('click', draw);
    $('rand').addEventListener('click', function(){ $('f1').value=(2+Math.random()*2).toFixed(2); $('f2').value=(2+Math.random()*2).toFixed(2); $('p1').value=(Math.random()*6.28).toFixed(2); $('d').value=(Math.random()*0.01).toFixed(3); draw(); });
    draw();
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>

</div>

}
</script>
</body>
</html>
