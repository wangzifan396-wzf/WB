*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}

<body>
<div class="app">
  <h1>MinesweeperForge</h1>
  <p class="sub">扫雷：种子化布雷 +  Flood-fill 翻开 + 旗标，自动判定胜负，经典逻辑游戏，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <label>难度
    <select id="diff"><option value="9,9,10">初级 9×9</option><option value="16,16,40">中级 16×16</option><option value="16,30,99">高级 16×30</option></select>
  </label>
  <button id="restart">重新开始</button>
  <span class="sub" id="status" style="margin:0">左键翻开 · 右键插旗</span>
</div>
<canvas id="cv" width="480" height="480" style="width:100%;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;cursor:pointer;"></canvas>
<script>
function msRng(seed){ var s=seed>>>0; return function(){ s=(s+0x6D2B79F5)|0; var t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function msCreate(w,h,mines,seed){ var rng=msRng(seed); var grid=new Int8Array(w*h); var placed=0; while(placed<mines){ var idx=Math.floor(rng()*w*h); if(grid[idx]===0){ grid[idx]=1; placed++; } } var count=new Int8Array(w*h); for(var y=0;y<h;y++) for(var x=0;x<w;x++){ var i=y*w+x; if(grid[i]===1) continue; var c=0; for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){ var nx=x+dx,ny=y+dy; if(nx>=0&&nx<w&&ny>=0&&ny<h&&grid[ny*w+nx]===1) c++; } count[i]=c; } return {w:w,h:h,mines:mines,grid:grid,count:count,revealed:new Uint8Array(w*h),flags:new Uint8Array(w*h),hit:false}; }
function msClone(s){ return {w:s.w,h:s.h,mines:s.mines,grid:s.grid,count:s.count,revealed:Uint8Array.from(s.revealed),flags:Uint8Array.from(s.flags),hit:s.hit}; }
function msReveal(s,x,y){ if(x<0||x>=s.w||y<0||y>=s.h||s.flags[y*s.w+x]||s.revealed[y*s.w+x]) return s; var ns=msClone(s); var stack=[[x,y]]; while(stack.length){ var p=stack.pop(); var i=p[1]*s.w+p[0]; if(ns.revealed[i]||ns.flags[i]) continue; if(s.grid[i]===1){ ns.hit=true; ns.revealed[i]=1; return ns; } ns.revealed[i]=1; if(s.count[i]===0){ for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){ var nx=p[0]+dx,ny=p[1]+dy; if(nx>=0&&nx<s.w&&ny>=0&&ny<s.h && !ns.revealed[ny*s.w+nx] && !ns.flags[ny*s.w+nx] && s.grid[ny*s.w+nx]!==1) stack.push([nx,ny]); } } } return ns; }
function msToggleFlag(s,x,y){ if(s.revealed[y*s.w+x]) return s; var ns=msClone(s); ns.flags[y*s.w+x]=ns.flags[y*s.w+x]?0:1; return ns; }
function msWin(s){ for(var i=0;i<s.revealed.length;i++){ if(s.grid[i]!==1 && !s.revealed[i]) return false; } return true; }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { msCreate:msCreate, msReveal:msReveal, msToggleFlag:msToggleFlag, msWin:msWin };
}
if (typeof window !== 'undefined') {
  window.MinesweeperForgePure = { msCreate:msCreate, msReveal:msReveal, msToggleFlag:msToggleFlag, msWin:msWin };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.MinesweeperForgePure;
    var state=null;
    function restart(){ var p=$('diff').value.split(',').map(Number); state=P.msCreate(p[0],p[1],p[2], (Date.now()&0xffff)+1); render(); }
    function render(){
      var cv=$('cv'); var ctx=cv.getContext('2d'); if(!ctx) return;
      var W=cv.width, H=cv.height, cw=W/state.w, ch=H/state.h;
      ctx.fillStyle='#0A0A0B'; ctx.fillRect(0,0,W,H);
      for(var y=0;y<state.h;y++){ for(var x=0;x<state.w;x++){ var i=y*state.w+x; var px=x*cw, py=y*ch;
        if(state.revealed[i]){ ctx.fillStyle='#1A1B1E'; ctx.fillRect(px,py,cw,ch); if(state.grid[i]===1){ ctx.fillStyle='#EF4444'; ctx.beginPath(); ctx.arc(px+cw/2,py+ch/2,cw*0.3,0,Math.PI*2); ctx.fill(); } else if(state.count[i]>0){ ctx.fillStyle='#22D3EE'; ctx.font=Math.floor(ch*0.6)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(state.count[i], px+cw/2, py+ch/2); } }
        else { ctx.fillStyle = state.flags[i] ? '#F5A623' : '#141417'; ctx.fillRect(px+1,py+1,cw-2,ch-2); if(state.flags[i]){ ctx.fillStyle='#0A0A0B'; ctx.font=Math.floor(ch*0.5)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('⚑', px+cw/2, py+ch/2); } }
      } }
      if(state.hit) $('status').textContent='踩雷了！点「重新开始」';
      else if(P.msWin(state)) $('status').textContent='胜利！全部安全格已翻开';
      else $('status').textContent='剩余雷: '+(state.mines - state.flags.reduce(function(a,b){return a+b;},0));
    }
    function cellAt(e){ var r=$('cv').getBoundingClientRect(); var cw=$('cv').width/state.w, ch=$('cv').height/state.h; return [Math.floor((e.clientX-r.left)/r.width*$('cv').width/cw), Math.floor((e.clientY-r.top)/r.height*$('cv').height/ch)]; }
    $('restart').addEventListener('click', restart);
    $('cv').addEventListener('click', function(e){ if(!state||state.hit||P.msWin(state)) return; var c=cellAt(e); state=P.msReveal(state,c[0],c[1]); render(); });
    $('cv').addEventListener('contextmenu', function(e){ e.preventDefault(); if(!state||state.hit||P.msWin(state)) return; var c=cellAt(e); state=P.msToggleFlag(state,c[0],c[1]); render(); });
    $('diff').addEventListener('change', restart);
    restart();
  })();
}
</script>
