<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>ExpenseForge — 记账与预算：录入收支、按分类与月份汇总，本地保存，离线可用。</title>
<meta property="og:title" content="ExpenseForge">
<meta property="og:description" content="记账与预算：录入收支、按分类与月份汇总，本地保存，离线可用。">
<meta property="og:image" content="./og.png">
<meta name="description" content="记账与预算：分类/月度汇总 + 本地保存 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A; --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:10px 0 6px}
input[type=text],input[type=number]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flex{display:flex;gap:10px}.flex>div{flex:1}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px}
.box h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:500}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{color:var(--muted);font-weight:500}
.total{font-size:18px;color:var(--ok);margin-top:8px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>ExpenseForge</h1>
  <p class="sub">记账与预算：分类/月度汇总 + 本地保存 · 单文件 · 零依赖 · 本地优先</p>

  <div class="flex">
    <div><label>金额</label><input id="amount" type="number" step="0.01" placeholder="50" aria-label="50"></div>
    <div><label>分类</label><input id="cat" type="text" placeholder="餐饮" aria-label="餐饮"></div>
  </div>
  <div class="flex">
    <div><label>日期</label><input id="date" type="text" placeholder="2026-07-30" aria-label="2026-07-30"></div>
    <div><label>备注</label><input id="note" type="text" placeholder="午饭" aria-label="午饭"></div>
  </div>
  <div class="row">
    <button id="add">记一笔</button>
    <button id="clear" class="ghost">清空</button>
  </div>
  <div class="err" id="err"></div>
  <div id="list"></div>
  <div class="box">
    <h3>分类汇总</h3><div id="byCat"></div>
    <h3 style="margin-top:12px">月度汇总</h3><div id="byMonth"></div>
    <div class="total" id="total"></div>
  </div>

  <div class="badges">
    <span class="badge">零依赖</span><span class="badge">离线可用</span><span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>
function expenseParseEntry(s){
  s=String(s||'').trim(); if(!s) return { error:'空' };
  var parts = s.indexOf(',')>=0 ? s.split(',') : s.split(/\s+/);
  var amount=Number(parts[0]);
  if(!isFinite(amount)) return { error:'金额非法' };
  return { amount:amount, cat:(parts[1]||'').trim(), date:(parts[2]||'').trim(), note:(parts[3]||'').trim() };
}
function expenseSummary(list){
  var total=0, byCat={}, byMonth={};
  for(var i=0;i<list.length;i++){ var e=list[i]; total+=e.amount;
    var c=e.cat||'未分类'; byCat[c]=(byCat[c]||0)+e.amount;
    var mk=String(e.date||'').slice(0,7); if(mk) byMonth[mk]=(byMonth[mk]||0)+e.amount;
  }
  function rnd(x){ return Math.round(x*100)/100; }
  var bc={}, bm={};
  for(var k in byCat) bc[k]=rnd(byCat[k]);
  for(var k2 in byMonth) bm[k2]=rnd(byMonth[k2]);
  return { total:rnd(total), byCat:bc, byMonth:bm };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { expenseParseEntry:expenseParseEntry, expenseSummary:expenseSummary };
}
if (typeof window !== 'undefined') {
  window.ExpenseForgePure = { expenseParseEntry:expenseParseEntry, expenseSummary:expenseSummary };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.ExpenseForgePure;
    var store=null; try{ store=window.localStorage; }catch(e){}
    var list=[];
    function save(){ if(store) store.setItem('expense_list', JSON.stringify(list)); }
    function load(){ if(store){ try{ list=JSON.parse(store.getItem('expense_list'))||[]; }catch(e){ list=[]; } } }
    function money(x){ return '¥'+x.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function kv(obj){
      var html=''; for(var k in obj){ html+='<div class="kv"><b>'+k+'</b><span>'+money(obj[k])+'</span></div>'; }
      return html||'<div class="kv"><span>暂无数据</span></div>';
    }
    function render(){
      var s=P.expenseSummary(list);
      var t='<table><tr><th>日期</th><th>分类</th><th>备注</th><th>金额</th><th></th></tr>';
      for(var i=0;i<list.length;i++){ var e=list[i];
        t+='<tr><td>'+e.date+'</td><td>'+e.cat+'</td><td>'+e.note+'</td><td>'+money(e.amount)+'</td>'+
           '<td><button class="rm" data-i="'+i+'" style="background:transparent;border:1px solid var(--line);color:var(--dim);padding:2px 8px;font-size:12px;border-radius:6px;cursor:pointer">×</button></td></tr>';
      }
      $('list').innerHTML=t+'</table>';
      $('byCat').innerHTML=kv(s.byCat);
      $('byMonth').innerHTML=kv(s.byMonth);
      $('total').textContent='总支出 '+money(s.total);
      var btns=$('list').querySelectorAll('.rm');
      for(var j=0;j<btns.length;j++) btns[j].addEventListener('click', function(){ list.splice(Number(this.getAttribute('data-i')),1); save(); render(); });
    }
    $('add').addEventListener('click', function(){
      var e=P.expenseParseEntry($('amount').value+( $('cat').value?' '+$('cat').value:'')+( $('date').value?' '+$('date').value:'')+( $('note').value?' '+$('note').value:''));
      if(e.error){ $('err').textContent=e.error; return; }
      $('err').textContent='';
      list.unshift(e); save(); render();
      $('amount').value=''; $('note').value='';
    });
    $('clear').addEventListener('click', function(){ list=[]; save(); render(); });
    load(); render();
  })();
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
