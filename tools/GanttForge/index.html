<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

<body>
<div class="app">
  <h1>GanttForge</h1>
  <p class="sub">甘特图：任务表一键出图 + 加权进度 + 重叠冲突检测 · 单文件 · 零依赖 · 本地优先</p>

<label>任务表（每行：任务名, 开始日 YYYY-MM-DD, 天数[, 进度%]）</label>
<textarea id="txt" rows="8">需求评审, 2026-08-03, 2, 100
内核开发, 2026-08-05, 5, 60
接线联调, 2026-08-10, 3, 20
矩阵测试, 2026-08-12, 2, 0
发布上线, 2026-08-14, 1, 0</textarea>
<div class="row">
  <button id="run">生成甘特图</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>SVG 甘特图</label>
<div class="out" id="out" aria-live="polite" style="overflow:auto">生成结果显示在这里</div>
<script>
function gtDate(s){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
  if(!m) return null;
  var d=Date.UTC(+m[1], +m[2]-1, +m[3]);
  var chk=new Date(d);
  if(chk.getUTCMonth()!==+m[2]-1||chk.getUTCDate()!==+m[3]) return null;
  return d;
}
function gtParse(text){
  if(typeof text!=='string'||!text.trim()) return { value:null, error:'任务表为空' };
  var lines=text.split('\n'), tasks=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line||line.charAt(0)==='#') continue;
    var parts=line.split(/[,，]/).map(function(s){ return s.trim(); });
    if(parts.length<3) return { value:null, error:'第 '+(i+1)+' 行: 至少需要 任务名, 开始日, 天数' };
    var start=gtDate(parts[1]);
    if(start===null) return { value:null, error:'第 '+(i+1)+' 行: 日期格式应为 YYYY-MM-DD' };
    var days=Number(parts[2]);
    if(!isFinite(days)||days<1||days!==Math.floor(days)) return { value:null, error:'第 '+(i+1)+' 行: 天数必须是正整数' };
    var prog=parts.length>3?Number(parts[3]):0;
    if(!isFinite(prog)||prog<0||prog>100) return { value:null, error:'第 '+(i+1)+' 行: 进度须在 0-100' };
    tasks.push({ name:parts[0], start:start, days:days, progress:prog });
  }
  if(!tasks.length) return { value:null, error:'没有有效任务行' };
  return { value:tasks, error:null };
}
var GT_DAY=86400000;
function gtStats(tasks){
  var min=Infinity, max=-Infinity, i;
  for(i=0;i<tasks.length;i++){
    if(tasks[i].start<min) min=tasks[i].start;
    var end=tasks[i].start+tasks[i].days*GT_DAY;
    if(end>max) max=end;
  }
  var total=Math.round((max-min)/GT_DAY);
  var wsum=0, dsum=0;
  for(i=0;i<tasks.length;i++){ wsum+=tasks[i].progress*tasks[i].days; dsum+=tasks[i].days; }
  return { minStart:min, maxEnd:max, spanDays:total,
    weightedProgress:Math.round(wsum/dsum*100)/100 };
}
function gtOverlaps(tasks){
  var out=[];
  for(var i=0;i<tasks.length;i++)
    for(var j=i+1;j<tasks.length;j++){
      var aEnd=tasks[i].start+tasks[i].days*GT_DAY, bEnd=tasks[j].start+tasks[j].days*GT_DAY;
      if(tasks[i].start<bEnd && aEnd>tasks[j].start) out.push([tasks[i].name, tasks[j].name]);
    }
  return out;
}
function gtEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function gtSvg(text){
  var p=gtParse(text);
  if(p.error) return { value:null, error:p.error };
  var tasks=p.value, st=gtStats(tasks);
  var LEFT=150, ROW=34, DAYW=Math.max(18, Math.min(46, Math.floor(560/Math.max(st.spanDays,1))));
  var W=LEFT+st.spanDays*DAYW+30, H=46+tasks.length*ROW+26;
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  s+='<rect width="'+W+'" height="'+H+'" fill="#0A0A0B"/>';
  for(var d=0;d<=st.spanDays;d++){
    var gx=LEFT+d*DAYW;
    s+='<line x1="'+gx+'" y1="40" x2="'+gx+'" y2="'+(H-20)+'" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
    if(d<st.spanDays && (st.spanDays<=14 || d%2===0)){
      var dd=new Date(st.minStart+d*GT_DAY);
      s+='<text x="'+(gx+DAYW/2)+'" y="32" text-anchor="middle" font-size="9" fill="#71717A" font-family="system-ui,sans-serif">'+(dd.getUTCMonth()+1)+'/'+dd.getUTCDate()+'</text>';
    }
  }
  for(var i=0;i<tasks.length;i++){
    var t=tasks[i], y=46+i*ROW;
    var x=LEFT+Math.round((t.start-st.minStart)/GT_DAY)*DAYW, w=t.days*DAYW;
    s+='<text x="'+(LEFT-10)+'" y="'+(y+15)+'" text-anchor="end" font-size="12" fill="#FFFFFF" font-family="system-ui,sans-serif">'+gtEsc(t.name.length>10?t.name.slice(0,9)+'…':t.name)+'</text>';
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="20" rx="5" fill="#1A1B1E" stroke="rgba(255,255,255,0.14)"/>';
    if(t.progress>0) s+='<rect x="'+x+'" y="'+y+'" width="'+Math.round(w*t.progress/100)+'" height="20" rx="5" fill="'+(t.progress>=100?'#10B981':'#5E6AD2')+'"/>';
    s+='<text x="'+(x+w+6)+'" y="'+(y+15)+'" font-size="10" fill="#A1A1AA" font-family="system-ui,sans-serif">'+t.progress+'%</text>';
  }
  s+='<text x="'+LEFT+'" y="'+(H-6)+'" font-size="11" fill="#A1A1AA" font-family="system-ui,sans-serif">总跨度 '+st.spanDays+' 天 · 加权进度 '+st.weightedProgress+'%</text>';
  s+='</svg>';
  return { value:s, error:null };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { gtDate:gtDate, gtParse:gtParse, gtStats:gtStats, gtOverlaps:gtOverlaps, gtSvg:gtSvg, gtEsc:gtEsc };
}
if (typeof window !== 'undefined') {
  window.GanttForgePure = { gtDate:gtDate, gtParse:gtParse, gtStats:gtStats, gtOverlaps:gtOverlaps, gtSvg:gtSvg, gtEsc:gtEsc };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.GanttForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var r=P.gtSvg($('txt').value);
      if(r.error){ $('err').textContent=r.error; return; }
      $('out').innerHTML=r.value;
    });
    $('clear').addEventListener('click', function(){ $('txt').value=''; $('out').textContent='生成结果显示在这里'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>

    <span class="badge flag">旗舰</span>

</div>
