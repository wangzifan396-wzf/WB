<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>TwForge — CSS 与 Tailwind 互译</title>
<meta property="og:title" content="TwForge">
<meta property="og:description" content="CSS 声明与 Tailwind 原子类双向互译：覆盖布局、间距、字号、圆角、颜色与 flex 相关常用属性，间距按 4px 刻度换算，未覆盖的写成任意值语法。">
<meta property="og:image" content="./og.png">
<meta name="description" content="CSS 声明与 Tailwind 原子类双向互译：覆盖布局、间距、字号、圆角、颜色与 flex 相关常用属性，间距按 4px 刻度换算，未覆盖的写成任意值语法。 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE; --bad:#EF4444;
  /* Ardot 令牌：大圆角阶梯 + 扩散有色阴影 + 内层 hairline */
  --r-lg:20px; --r-md:14px; --r-sm:10px; --r-xs:8px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh;
     -webkit-font-smoothing:antialiased}
.app{width:100%;max-width:820px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;
     box-shadow:var(--hair),var(--lift),var(--glow)}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-.02em;font-weight:650}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
     color:var(--fg);padding:10px 12px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
     box-shadow:inset 0 1px 2px rgba(0,0,0,.25);transition:border-color .16s ease,box-shadow .16s ease}
textarea{resize:vertical}
textarea:hover,input:hover,select:hover{border-color:var(--line2)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);
     box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:var(--r-sm);padding:10px 16px;cursor:pointer;font-size:14px;
       letter-spacing:-.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
       transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{filter:brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;box-shadow:none}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none}
button.ghost:hover{border-color:var(--line2);color:var(--fg);filter:none;background:rgba(255,255,255,.03);box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;
     box-shadow:inset 0 1px 3px rgba(0,0,0,.35);
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:40px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.sec{font-size:14px;color:var(--muted);font-weight:600;margin:18px 0 8px;letter-spacing:-.01em}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
/* 分段控件 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:6px;box-shadow:var(--hair)}
.seg button{background:transparent;border:0;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:13px;border-radius:0;
            box-shadow:none;transition:background .15s ease,color .15s ease}
.seg button:hover{background:rgba(255,255,255,.04);color:var(--fg);filter:none;box-shadow:none}
.seg button+button{border-left:1px solid var(--line)}
.seg button.active{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
/* Bento 瓦片（非对称网格，避 3 等宽卡） */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.bento.span2 .tile{grid-column:1/-1}
.bento.c3{grid-template-columns:2fr 1fr}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;
      box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.tile:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.tile h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:-.01em}
.tile .big{font:20px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);word-break:break-all}
.tile .sub2{color:var(--dim);font-size:12px;margin-top:4px}
/* 状态色 */
.state.ok{color:var(--ok)} .state.warn{color:var(--warn)} .state.bad{color:var(--bad)}
/* 徽章 */
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.badge.tag{color:var(--muted);background:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#langBtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 13px;font-size:12px;cursor:pointer;flex:0 0 auto;box-shadow:none}
#langBtn:hover{border-color:var(--line2);color:var(--fg);background:rgba(255,255,255,.03);box-shadow:none;filter:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#nanoToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--surface);color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;max-width:80vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#nanoToast.bad{border-color:rgba(239,68,68,.55)}
@media (max-width:760px){.grid{grid-template-columns:1fr}.bento{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <div>
      <h1>TwForge</h1>
      <p class="sub" data-i18n="sub">CSS 与 Tailwind 互译 · 单文件 · 零依赖 · 本地优先</p>
    </div>
    <button id="langBtn" type="button" aria-label="Switch language">EN</button>
  </div>

  <div class="seg" role="group" aria-label="转换方向">
    <button type="button" id="m1" class="active">CSS &rarr; Tailwind</button>
    <button type="button" id="m2">Tailwind &rarr; CSS</button>
  </div>
  <label for="src" id="lsrc">CSS 声明</label>
  <textarea id="src" rows="8" spellcheck="false">display: flex;
align-items: center;
justify-content: space-between;
padding: 16px 24px;
margin-top: 8px;
border-radius: 12px;
font-size: 14px;
font-weight: 600;
color: #fff;
background-color: #5E6AD2;</textarea>
  <div class="row"><button id="go">转换</button><button class="ghost" id="copy">复制结果</button></div>
  <div class="err" id="err"></div>
  <div class="sec">输出结果</div>
  <div class="bento span2" id="stat"></div>
  <div class="out" id="out"></div>
  <p class="hint">按 4px = 1 单位的间距刻度换算；非刻度值自动降级为任意值语法（如 w-[13px]）。</p>

  <div class="badges">
    <span class="badge" data-i18n="b1">零依赖</span>
    <span class="badge" data-i18n="b2">离线可用</span>
    <span class="badge" data-i18n="b3">数据不出本机</span>
    <span class="badge flag" data-i18n="b4">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 412 款工具 &rarr;</a></footer>
</div>
<script>

(function(){
  var STEPS=[0,0.5,1,1.5,2,2.5,3,3.5,4,5,6,7,8,9,10,11,12,14,16,20,24,28,32,36,40,44,48,52,56,60,64,72,80,96];
  var STEPSET={}; for(var si=0;si<STEPS.length;si++) STEPSET[STEPS[si]]=1;
  var ENUM={
    'display':{'block':'block','inline-block':'inline-block','inline':'inline','flex':'flex',
               'inline-flex':'inline-flex','grid':'grid','inline-grid':'inline-grid','none':'hidden',
               'table':'table','contents':'contents','flow-root':'flow-root'},
    'position':{'static':'static','fixed':'fixed','absolute':'absolute','relative':'relative','sticky':'sticky'},
    'flex-direction':{'row':'flex-row','row-reverse':'flex-row-reverse','column':'flex-col','column-reverse':'flex-col-reverse'},
    'flex-wrap':{'wrap':'flex-wrap','nowrap':'flex-nowrap','wrap-reverse':'flex-wrap-reverse'},
    'justify-content':{'flex-start':'justify-start','flex-end':'justify-end','center':'justify-center',
                       'space-between':'justify-between','space-around':'justify-around','space-evenly':'justify-evenly',
                       'start':'justify-start','end':'justify-end'},
    'align-items':{'flex-start':'items-start','flex-end':'items-end','center':'items-center',
                   'baseline':'items-baseline','stretch':'items-stretch','start':'items-start','end':'items-end'},
    'text-align':{'left':'text-left','center':'text-center','right':'text-right','justify':'text-justify'},
    'text-transform':{'uppercase':'uppercase','lowercase':'lowercase','capitalize':'capitalize','none':'normal-case'},
    'font-style':{'italic':'italic','normal':'not-italic'},
    'overflow':{'auto':'overflow-auto','hidden':'overflow-hidden','visible':'overflow-visible',
                'scroll':'overflow-scroll','clip':'overflow-clip'},
    'cursor':{'pointer':'cursor-pointer','default':'cursor-default','not-allowed':'cursor-not-allowed',
              'wait':'cursor-wait','text':'cursor-text','move':'cursor-move','grab':'cursor-grab'},
    'object-fit':{'contain':'object-contain','cover':'object-cover','fill':'object-fill',
                  'none':'object-none','scale-down':'object-scale-down'},
    'white-space':{'normal':'whitespace-normal','nowrap':'whitespace-nowrap','pre':'whitespace-pre',
                   'pre-wrap':'whitespace-pre-wrap','pre-line':'whitespace-pre-line'},
    'font-weight':{'100':'font-thin','200':'font-extralight','300':'font-light','400':'font-normal',
                   '500':'font-medium','600':'font-semibold','700':'font-bold','800':'font-extrabold',
                   '900':'font-black','normal':'font-normal','bold':'font-bold'},
    'text-decoration-line':{'underline':'underline','line-through':'line-through','none':'no-underline'},
    'visibility':{'visible':'visible','hidden':'invisible','collapse':'collapse'},
    'box-sizing':{'border-box':'box-border','content-box':'box-content'},
    'flex-grow':{'1':'grow','0':'grow-0'},
    'flex-shrink':{'1':'shrink','0':'shrink-0'}
  };
  var FONTSIZE={'12':'text-xs','14':'text-sm','16':'text-base','18':'text-lg','20':'text-xl','24':'text-2xl',
                '30':'text-3xl','36':'text-4xl','48':'text-5xl','60':'text-6xl','72':'text-7xl'};
  var RADIUS={'0':'rounded-none','2':'rounded-sm','4':'rounded','6':'rounded-md','8':'rounded-lg',
              '12':'rounded-xl','16':'rounded-2xl','24':'rounded-3xl','9999':'rounded-full'};
  var COLORS={'#fff':'white','#ffffff':'white','#000':'black','#000000':'black','white':'white',
              'black':'black','transparent':'transparent','currentcolor':'current','inherit':'inherit'};
  var SPACE={'padding':'p','padding-top':'pt','padding-right':'pr','padding-bottom':'pb','padding-left':'pl',
             'margin':'m','margin-top':'mt','margin-right':'mr','margin-bottom':'mb','margin-left':'ml',
             'gap':'gap','row-gap':'gap-y','column-gap':'gap-x','width':'w','height':'h',
             'min-width':'min-w','min-height':'min-h','max-width':'max-w','max-height':'max-h',
             'top':'top','right':'right','bottom':'bottom','left':'left','inset':'inset',
             'flex-basis':'basis'};

  function px(v){
    v=String(v).trim();
    var m=v.match(/^(-?[\d.]+)px$/); if(m) return parseFloat(m[1]);
    var r=v.match(/^(-?[\d.]+)rem$/); if(r) return parseFloat(r[1])*16;
    if(v==='0') return 0;
    return null;
  }
  function spaceToken(v){
    var n=px(v);
    if(n===null){
      if(v==='auto') return 'auto';
      if(v==='100%') return 'full';
      if(v==='100vw'||v==='100vh') return 'screen';
      if(v==='50%') return '1/2';
      if(v==='fit-content') return 'fit';
      return null;
    }
    var neg=n<0; var a=Math.abs(n);
    if(a===1) return (neg?'-':'')+'px';
    var st=a/4;
    if(STEPSET[st]) return (neg?'-':'')+String(st);
    return null;
  }
  function normColor(v){
    var k=String(v).trim().toLowerCase();
    if(COLORS[k]) return COLORS[k];
    return null;
  }
  function parseDecls(text){
    var out=[],raw=String(text||'').replace(/\/\*[\s\S]*?\*\//g,'');
    var body=raw;
    var b=raw.indexOf('{');
    if(b>=0){ var e=raw.lastIndexOf('}'); body=raw.slice(b+1, e<0?raw.length:e); }
    var parts=body.split(';');
    for(var i=0;i<parts.length;i++){
      var p=parts[i]; if(!p.trim()) continue;
      var c=p.indexOf(':'); if(c<0) continue;
      out.push([p.slice(0,c).trim().toLowerCase(), p.slice(c+1).trim().replace(/\s*!important$/,'')]);
    }
    return out;
  }
  function cssToTw(text){
    var decls=parseDecls(text);
    if(!decls.length) return {error:'未解析到 CSS 声明'};
    var cls=[],un=[];
    for(var i=0;i<decls.length;i++){
      var prop=decls[i][0],val=decls[i][1],lv=val.toLowerCase();
      if(ENUM[prop]&&ENUM[prop][lv]){ cls.push(ENUM[prop][lv]); continue; }
      if(prop==='font-size'){ var fp=px(val); cls.push((fp!==null&&FONTSIZE[String(fp)])||('text-['+val+']')); continue; }
      if(prop==='border-radius'){ var rp=px(val); cls.push((rp!==null&&RADIUS[String(rp)])||('rounded-['+val+']')); continue; }
      if(prop==='color'){ var c1=normColor(val); cls.push('text-'+(c1||'['+val+']')); continue; }
      if(prop==='background-color'||prop==='background'){ var c2=normColor(val); cls.push('bg-'+(c2||'['+val+']')); continue; }
      if(prop==='border-color'){ var c3=normColor(val); cls.push('border-'+(c3||'['+val+']')); continue; }
      if(prop==='opacity'){ var o=parseFloat(val); cls.push('opacity-'+Math.round(o*100)); continue; }
      if(prop==='z-index'){ cls.push('z-'+val); continue; }
      if(prop==='line-height'){ var lp=px(val); cls.push(lp!==null?('leading-['+val+']'):('leading-['+val+']')); continue; }
      if(prop==='letter-spacing'){ cls.push('tracking-['+val+']'); continue; }
      if(prop==='border-width'){ var bp=px(val); cls.push(bp===1?'border':('border-'+(bp===null?'['+val+']':bp))); continue; }
      if(prop==='box-shadow'){ cls.push(lv==='none'?'shadow-none':'shadow'); continue; }
      if(SPACE[prop]){
        var pieces=val.split(/\s+/);
        if(pieces.length===2&&(prop==='padding'||prop==='margin')){
          var pre=(prop==='padding')?'p':'m';
          var ty=spaceToken(pieces[0]),tx=spaceToken(pieces[1]);
          cls.push(ty!==null?(pre+'y-'+ty):(pre+'y-['+pieces[0]+']'));
          cls.push(tx!==null?(pre+'x-'+tx):(pre+'x-['+pieces[1]+']'));
          continue;
        }
        var t=spaceToken(pieces[0]);
        var pfx=SPACE[prop];
        if(t===null){ cls.push(pfx+'-['+val+']'); }
        else if(t.charAt(0)==='-'){ cls.push('-'+pfx+'-'+t.slice(1)); }
        else { cls.push(pfx+'-'+t); }
        continue;
      }
      un.push(prop);
      cls.push('['+prop+':'+val.replace(/\s/g,'_')+']');
    }
    return {value:{classes:cls.join(' '),count:cls.length,unknown:un}};
  }

  var REV=null;
  function buildRev(){
    if(REV) return REV;
    REV={};
    for(var prop in ENUM){ var m=ENUM[prop];
      for(var v in m){ if(!REV[m[v]]) REV[m[v]]=[prop,v]; } }
    for(var f in FONTSIZE) REV[FONTSIZE[f]]=['font-size',f+'px'];
    for(var rr in RADIUS) REV[RADIUS[rr]]=['border-radius',(rr==='9999'?'9999px':rr+'px')];
    return REV;
  }
  var SPACEREV=null;
  function buildSpaceRev(){
    if(SPACEREV) return SPACEREV;
    SPACEREV={};
    for(var prop in SPACE) SPACEREV[SPACE[prop]]=prop;
    SPACEREV['px']='padding-left|padding-right';
    SPACEREV['py']='padding-top|padding-bottom';
    SPACEREV['mx']='margin-left|margin-right';
    SPACEREV['my']='margin-top|margin-bottom';
    return SPACEREV;
  }
  function remOf(tok){
    if(tok==='px') return '1px';
    if(tok==='auto') return 'auto';
    if(tok==='full') return '100%';
    if(tok==='screen') return '100vh';
    var n=parseFloat(tok);
    if(isNaN(n)) return null;
    if(n===0) return '0';
    return (n*0.25)+'rem';
  }
  function twToCss(classes){
    var list=String(classes||'').trim().split(/\s+/).filter(Boolean);
    if(!list.length) return {error:'请输入 Tailwind class'};
    var rev=buildRev(),sr=buildSpaceRev(),out=[],un=[];
    for(var i=0;i<list.length;i++){
      var c=list[i],neg=false;
      if(c.charAt(0)==='-'){ neg=true; c=c.slice(1); }
      if(rev[c]){ out.push([rev[c][0],rev[c][1]]); continue; }
      var arb=c.match(/^(-?[a-z-]+)-\[(.+)\]$/);
      if(arb){
        var ap=arb[1],av=arb[2].replace(/_/g,' ');
        if(ap==='text') out.push(['color',av]);
        else if(ap==='bg') out.push(['background-color',av]);
        else if(sr[ap]) pushSpace(out,sr[ap],av);
        else out.push([ap,av]);
        continue;
      }
      var m=c.match(/^(-?[a-z]+(?:-[a-z]+)*)-([0-9.\/]+|px|auto|full|screen)$/);
      if(m&&sr[m[1]]){
        var v=remOf(m[2]);
        if(v!==null){ pushSpace(out,sr[m[1]],(neg?'-':'')+v); continue; }
      }
      if(/^opacity-(\d+)$/.test(c)){ out.push(['opacity',String(parseInt(c.slice(8),10)/100)]); continue; }
      if(/^z-(\d+)$/.test(c)){ out.push(['z-index',c.slice(2)]); continue; }
      if(c==='border'){ out.push(['border-width','1px']); continue; }
      if(/^border-(\d+)$/.test(c)){ out.push(['border-width',c.slice(7)+'px']); continue; }
      if(c==='shadow'){ out.push(['box-shadow','0 1px 3px rgb(0 0 0 / 0.1)']); continue; }
      if(c==='text-white'||c==='text-black'){ out.push(['color',c.slice(5)]); continue; }
      if(c==='bg-white'||c==='bg-black'){ out.push(['background-color',c.slice(3)]); continue; }
      un.push(c);
    }
    if(!out.length) return {error:'无法识别任何 class：'+un.join(' ')};
    var css=out.map(function(d){return d[0]+': '+d[1]+';';}).join('\n');
    return {value:{css:css,count:out.length,unknown:un}};
  }
  function pushSpace(out,prop,val){
    var ps=prop.split('|');
    for(var i=0;i<ps.length;i++) out.push([ps[i],val]);
  }

  var API={cssToTw:cssToTw,twToCss:twToCss,parseDecls:parseDecls,spaceToken:spaceToken,px:px};
  if(typeof module!=='undefined'&&module.exports)module.exports=API;
  if(typeof window!=='undefined')window.__TwForge__=API;
})();

</script>
<script>

(function(){
  var P=window.__TwForge__,mode=1;
  var src=document.getElementById('src'),out=document.getElementById('out'),err=document.getElementById('err');
  var S1='display: flex;\nalign-items: center;\njustify-content: space-between;\npadding: 16px 24px;\nmargin-top: 8px;\nborder-radius: 12px;\nfont-size: 14px;\nfont-weight: 600;\ncolor: #fff;\nbackground-color: #5E6AD2;';
  var S2='flex items-center justify-between px-6 py-4 mt-2 rounded-xl text-sm font-semibold text-white';
  function setMode(m){
    mode=m;
    document.getElementById('m1').className=(m===1?'active':'');
    document.getElementById('m2').className=(m===2?'active':'');
    document.getElementById('lsrc').textContent=(m===1?(window.nanoT?window.nanoT('lcss'):'CSS 声明'):(window.nanoT?window.nanoT('ltw'):'Tailwind class'));
    src.value=(m===1?S1:S2);
    run();
  }
  function run(){
    err.textContent='';
    var r=(mode===1)?P.cssToTw(src.value):P.twToCss(src.value);
    if(r.error){ out.textContent=''; document.getElementById('stat').innerHTML=''; err.textContent=r.error; return; }
    var v=r.value;
    out.textContent=(mode===1?v.classes:v.css);
    document.getElementById('stat').innerHTML=
      '<div class="tile"><h3>'+(window.nanoT?window.nanoT('t1'):'转换条目')+'</h3><div class="big">'+v.count+'</div></div>'+
      '<div class="tile"><h3>'+(window.nanoT?window.nanoT('t2'):'未识别')+'</h3><div class="big">'+(v.unknown.length||0)+'</div></div>';
    if(v.unknown&&v.unknown.length) err.textContent=(window.nanoT?window.nanoT('unk'):'未识别')+'：'+v.unknown.join(' ');
  }
  document.getElementById('m1').addEventListener('click',function(){setMode(1);});
  document.getElementById('m2').addEventListener('click',function(){setMode(2);});
  document.getElementById('go').addEventListener('click',run);
  src.addEventListener('input',run);
  document.getElementById('copy').addEventListener('click',function(){
    if(out.textContent&&navigator.clipboard)navigator.clipboard.writeText(out.textContent);});
  window.nanoRerender=run;
  run();
})();

</script>
<div id="nanoToast" role="status" aria-live="polite"></div>
<script>
/* ---- 状态条：复制/错误统一反馈 ---- */
(function(){var el=document.getElementById('nanoToast');if(!el)return;var t;
function show(m,bad){el.textContent=m;el.className='on'+(bad?' bad':'');clearTimeout(t);t=setTimeout(function(){el.className='';},1700);}
window.nanoToast=show;
try{var nc=navigator.clipboard;if(nc&&nc.writeText){var ow=nc.writeText.bind(nc);
nc.writeText=function(s){return ow(s).then(function(r){show(window.nanoT?window.nanoT('copied'):'已复制');return r;},function(e){show(window.nanoT?window.nanoT('copyfail'):'复制失败',1);throw e;});};}}catch(e){}
})();
/* ---- i18n 运行时 ---- */
var I18N = {"en": {"b1": "Zero deps", "b2": "Offline", "b3": "Local only", "b4": "Flagship", "copied": "Copied", "copyfail": "Copy failed"}, "zh": {"b1": "零依赖", "b2": "离线可用", "b3": "数据不出本机", "b4": "旗舰", "copied": "已复制", "copyfail": "复制失败", "sub": "CSS 与 Tailwind 互译 · 单文件 · 零依赖 · 本地优先", "title": "TwForge — CSS 与 Tailwind 互译"}};
(function(){
  function cur(){try{return localStorage.getItem('nano-lang')==='en'?'en':'zh';}catch(e){return 'zh';}}
  function dict(){return I18N[cur()]||I18N.zh;}
  function apply(){
    var l=cur(), d=dict();
    document.documentElement.lang = (l==='en'?'en':'zh-CN');
    var ns=document.querySelectorAll('[data-i18n]');
    for(var i=0;i<ns.length;i++){var k=ns[i].getAttribute('data-i18n');if(d[k]!=null)ns[i].textContent=d[k];}
    var ps=document.querySelectorAll('[data-i18n-ph]');
    for(var j=0;j<ps.length;j++){var k2=ps[j].getAttribute('data-i18n-ph');if(d[k2]!=null)ps[j].setAttribute('placeholder',d[k2]);}
    var b=document.getElementById('langBtn'); if(b) b.textContent=(l==='en'?'中文':'EN');
    if(d.title) document.title=d.title;
  }
  window.nanoT=function(k){var d=dict();return d[k]!=null?d[k]:k;};
  window.nanoApplyI18n=apply;
  var b=document.getElementById('langBtn');
  if(b) b.addEventListener('click', function(){
    try{localStorage.setItem('nano-lang', cur()==='en'?'zh':'en');}catch(e){}
    apply(); if(window.nanoRerender) window.nanoRerender();
  });
  apply();
})();
</script>
