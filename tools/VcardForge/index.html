<script>

(function(){
  'use strict';
  function unescape(v){
    return String(v)
      .replace(/\\n/gi,'\n')
      .replace(/\\,/g,',')
      .replace(/\\;/g,';')
      .replace(/\\\\/g,'\\');
  }
  function vescape(v){
    return String(v)
      .replace(/\\/g,'\\\\')
      .replace(/\n/g,'\\n')
      .replace(/,/g,'\\,')
      .replace(/;/g,'\\;');
  }
  function splitParams(p){
    if(!p) return [];
    return p.split(';').map(function(x){ var kv=x.split('='); return {k:(kv[0]||'').toUpperCase(), v:kv[1]||''}; });
  }
  function parse(text){
    if(!text || !String(text).trim()) return {value:null,error:'输入为空'};
    var norm='\n'+String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    var blocks=norm.split('\nBEGIN:VCARD');
    var cards=[];
    for(var bi=1; bi<blocks.length; bi++){
      var body='BEGIN:VCARD'+blocks[bi];
      var end=body.indexOf('END:VCARD');
      if(end<0) continue;
      body=body.slice(0,end);
      var raw=body.split('\n'), lines=[], i=0;
      while(i<raw.length){
        var line=raw[i];
        while(i+1<raw.length && /^[ \t]/.test(raw[i+1])) line+=raw[++i].slice(1);
        i++;
        if(/^\s*$/.test(line)) continue;
        lines.push(line);
      }
      var card={};
      for(var li=0; li<lines.length; li++){
        var mm=/^([^:;]+)((?:;[^:;]+)*):([\s\S]*)$/.exec(lines[li]);
        if(!mm) continue;
        var name=mm[1].toUpperCase();
        var params=splitParams(mm[2]?mm[2].slice(1):'');
        var val=unescape(mm[3]);
        (card[name]=card[name]||[]).push({params:params, value:val});
      }
      cards.push(card);
    }
    if(!cards.length) return {value:null,error:'未找到 BEGIN:VCARD'};
    return {value:cards, error:''};
  }
  function first(card,name){ return (card[name]&&card[name][0])?card[name][0].value:''; }
  function summary(card){
    return {
      fn:first(card,'FN'), n:first(card,'N'), org:first(card,'ORG'),
      title:first(card,'TITLE'), url:first(card,'URL'), adr:first(card,'ADR'),
      tel:(card.TEL||[]).map(function(t){return t.value;}),
      email:(card.EMAIL||[]).map(function(t){return t.value;}),
      version:first(card,'VERSION')
    };
  }
  function toV3(card){
    // 把 4.0 的某些属性回退到 3.0 写法（简化：复制并改 VERSION）
    return card;
  }
  function gen(fields, ver){
    ver=ver||'3.0';
    var L=['BEGIN:VCARD','VERSION:'+ver];
    if(fields.fn) L.push('FN:'+vescape(fields.fn));
    if(fields.n) L.push('N:'+vescape(fields.n));
    if(fields.org) L.push('ORG:'+vescape(fields.org));
    if(fields.title) L.push('TITLE:'+vescape(fields.title));
    if(fields.tel){ (Array.isArray(fields.tel)?fields.tel:[fields.tel]).forEach(function(t){ if(t) L.push('TEL;TYPE=CELL:'+vescape(t)); }); }
    if(fields.email){ (Array.isArray(fields.email)?fields.email:[fields.email]).forEach(function(e){ if(e) L.push('EMAIL;TYPE=INTERNET:'+vescape(e)); }); }
    if(fields.url) L.push('URL:'+vescape(fields.url));
    if(fields.adr) L.push('ADR;TYPE=HOME:'+vescape(fields.adr));
    L.push('END:VCARD');
    return L.join('\n');
  }
  var API={parse:parse, summary:summary, gen:gen, unescape:unescape, vescape:vescape, toV3:toV3};
  if(typeof module!=='undefined' && module.exports) module.exports=API;
  if(typeof window!=='undefined') window.__VcardForge__=API;
})();

</script>
<script>

(function(){
  if(typeof window==='undefined' || !window.document) return;
  var C=window.__VcardForge__, D=document, $=function(i){return D.getElementById(i);};
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function T(k){return (window.nanoT||function(x){return x;})(k);}
  var lastText='';
  function fields(){
    return {fn:$('vc_fn').value, n:$('vc_n').value, org:$('vc_org').value, title:$('vc_title').value,
      tel:$('vc_tel').value.split(',').map(function(s){return s.trim();}).filter(Boolean),
      email:$('vc_email').value.split(',').map(function(s){return s.trim();}).filter(Boolean),
      url:$('vc_url').value, adr:''};
  }
  function renderGen(){
    var txt=C.gen(fields(), $('vc_ver').value);
    lastText=txt; $('vc_out').textContent=txt;
  }
  function parseUI(){
    var r=C.parse($('vc_in').value);
    if(r.error){ $('vc_err').textContent=r.error; $('vc_sum').textContent=''; return; }
    $('vc_err').textContent='';
    var L=[];
    r.value.forEach(function(card,idx){
      var s=C.summary(card);
      L.push('# '+(idx+1)+'  '+(s.fn||s.n||'(无 FN)'));
      if(s.org) L.push('  组织: '+s.org);
      if(s.title) L.push('  职位: '+s.title);
      if(s.tel.length) L.push('  电话: '+s.tel.join(', '));
      if(s.email.length) L.push('  邮箱: '+s.email.join(', '));
      if(s.url) L.push('  网址: '+s.url);
      L.push('');
    });
    $('vc_sum').textContent=L.join('\n');
  }
  window.nanoRerender=renderGen;
  ['vc_fn','vc_n','vc_org','vc_title','vc_tel','vc_email','vc_url'].forEach(function(id){
    $(id).addEventListener('input',renderGen);
  });
  $('vc_ver').addEventListener('change',renderGen);
  $('vc_gen').addEventListener('click',renderGen);
  $('vc_copy').addEventListener('click',function(){
    if(!lastText){ if(window.nanoToast)window.nanoToast(T('nores'),1); return; }
    if(navigator.clipboard) navigator.clipboard.writeText(lastText);
  });
  $('vc_parse').addEventListener('click',parseUI);
  renderGen();
})();

</script>

(function(){
  function cur(){try{return localStorage.getItem('nano-lang')==='en'?'en':'zh';}catch(e){return 'zh';}}
  function dict(){return I18N[cur()]||I18N.zh;}
  function apply(){
    var l=cur(), d=dict();
    document.documentElement.lang = (l==='en'?'en':'zh-CN');
    var ns=document.querySelectorAll('[data-i18n]');
    for(var i=0;i<ns.length;i++){var k=ns[i].getAttribute('data-i18n');if(d[k]!=null)ns[i].textContent=d[k];}

    apply(); if(window.nanoRerender) window.nanoRerender();
