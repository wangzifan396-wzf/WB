body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}

<body>
<div class="app">
  <h1>HeatmapForge</h1>
  <p class="sub">日历热力图：GitHub 风格贡献格、四分位自适应配色、最长/当前连续打卡、SVG 导出 · 单文件 · 零依赖 · 本地优先</p>

<label>日期数据（每行 <code>YYYY-MM-DD 数值</code>，数值可省略默认 1）</label>
<textarea id="src" rows="7" spellcheck="false"></textarea>
<div class="row">
  <label style="margin:0">起</label><input type="text" id="from" style="max-width:130px" aria-label="from">
  <label style="margin:0">止</label><input type="text" id="to" style="max-width:130px" aria-label="to">
  <button id="run">绘制热力图</button>

  <button id="copy" class="ghost">复制 SVG</button>
</div>

    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>

function hmParseDate(s){
  var m=String(s).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(!m) return null;
  var y=+m[1], mo=+m[2], d=+m[3];
  if(mo<1||mo>12||d<1||d>31) return null;
  var dt=new Date(Date.UTC(y, mo-1, d));
  if(dt.getUTCFullYear()!==y || dt.getUTCMonth()!==mo-1 || dt.getUTCDate()!==d) return null;
  return dt;
}
function hmFmtDate(dt){
  function p(x){ return (x<10?'0':'')+x; }
  return dt.getUTCFullYear()+'-'+p(dt.getUTCMonth()+1)+'-'+p(dt.getUTCDate());
}
function hmParse(text){
  var lines=String(text||'').split(/\n+/), map={}, bad=0, count=0;
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();
    if(!l || l.charAt(0)==='#') continue;
    var parts=l.split(/[\s,\t]+/);
    var dt=hmParseDate(parts[0]);
    if(!dt){ bad++; continue; }
    var v = parts.length>1 ? parseFloat(parts[1]) : 1;
    if(isNaN(v)){ bad++; continue; }
    var key=hmFmtDate(dt);
    map[key]=(map[key]||0)+v;
    count++;
  }
  if(!count) return { error:'未解析到有效数据（格式：2026-07-30 3）', bad:bad };
  return { error:null, map:map, bad:bad, count:count };
}
function hmDayIndex(dt){ return Math.floor(dt.getTime()/86400000); }
function hmRange(map){
  var keys=Object.keys(map).sort();
  return { first:keys[0], last:keys[keys.length-1], days:keys.length };
}
function hmGrid(map, startStr, endStr){
  var start=hmParseDate(startStr), end=hmParseDate(endStr);
  if(!start || !end || end<start) return { error:'起止日期无效' };
  var s=new Date(start.getTime());
  s.setUTCDate(s.getUTCDate() - s.getUTCDay());
  var weeks=[], cur=new Date(s.getTime()), guard=0;
  while(cur<=end && guard<400){
    var col=[];
    for(var d=0; d<7; d++){
      var key=hmFmtDate(cur);
      var inRange = cur>=start && cur<=end;
      col.push({ date:key, value: inRange ? (map[key]||0) : null, dow:d });
      cur=new Date(cur.getTime()+86400000);
    }
    weeks.push(col); guard++;
  }
  return { error:null, weeks:weeks, start:hmFmtDate(start), end:hmFmtDate(end) };
}
function hmLevels(map, buckets){
  buckets = buckets || 4;
  var vals=[];
  for(var k in map) if(map[k]>0) vals.push(map[k]);
  if(!vals.length) return [];
  vals.sort(function(a,b){ return a-b; });
  var cuts=[];
  for(var i=1;i<=buckets;i++){
    var idx=Math.min(vals.length-1, Math.ceil(vals.length*i/buckets)-1);
    cuts.push(vals[idx]);
  }
  return cuts;
}
function hmLevelOf(v, cuts){
  if(v===null || v===undefined) return -1;
  if(v<=0) return 0;
  for(var i=0;i<cuts.length;i++) if(v<=cuts[i]) return i+1;
  return cuts.length;
}
function hmStreak(map, startStr, endStr){
  var start=hmParseDate(startStr), end=hmParseDate(endStr);
  if(!start || !end) return { best:0, current:0, active:0 };
  var cur=new Date(start.getTime()), run=0, best=0, active=0, total=0, guard=0;
  while(cur<=end && guard<3000){
    var v=map[hmFmtDate(cur)]||0;
    if(v>0){ run++; total++; if(run>best) best=run; } else run=0;
    cur=new Date(cur.getTime()+86400000); guard++;
  }
  active=run;
  return { best:best, current:active, active:total };
}
function hmStats(map){
  var vals=[], sum=0, mx=0, mxKey=null;
  for(var k in map){ vals.push(map[k]); sum+=map[k]; if(map[k]>mx){ mx=map[k]; mxKey=k; } }
  if(!vals.length) return { total:0, days:0, avg:0, max:0, maxDate:null };
  return { total:Math.round(sum*100)/100, days:vals.length,
           avg:Math.round(sum/vals.length*100)/100, max:mx, maxDate:mxKey };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { hmParseDate:hmParseDate, hmFmtDate:hmFmtDate, hmParse:hmParse, hmRange:hmRange,
    hmGrid:hmGrid, hmLevels:hmLevels, hmLevelOf:hmLevelOf, hmStreak:hmStreak, hmStats:hmStats };
}
if (typeof window !== 'undefined') {
  window.HeatmapForgePure = { hmParseDate:hmParseDate, hmFmtDate:hmFmtDate, hmParse:hmParse, hmRange:hmRange,
    hmGrid:hmGrid, hmLevels:hmLevels, hmLevelOf:hmLevelOf, hmStreak:hmStreak, hmStats:hmStats };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.HeatmapForgePure;
  var PAL=['#1A1B1E','#1e3a5f','#2b5f9e','#3f7fd6','#5E6AD2'];
  var lastSvg='';
  function run(){
    var r=P.hmParse($('src').value);
    if(r.error){ $('err').textContent=r.error; $('out').innerHTML=''; $('map').innerHTML=''; $('streak').innerHTML=''; return; }
    var g=P.hmGrid(r.map, $('from').value, $('to').value);
    if(g.error){ $('err').textContent=g.error; return; }
    $('err').textContent = r.bad ? ('跳过 '+r.bad+' 行无效数据') : '';
    var cuts=P.hmLevels(r.map,4), st=P.hmStats(r.map), sk=P.hmStreak(r.map, g.start, g.end);
    $('out').innerHTML='<div class="grid">'+
      '<div class="kv"><b>累计值</b><span>'+st.total+'</span></div>'+
      '<div class="kv"><b>有记录天数</b><span>'+st.days+'</span></div>'+
      '<div class="kv"><b>日均（有记录）</b><span>'+st.avg+'</span></div>'+
      '<div class="kv"><b>峰值</b><span>'+st.max+' @ '+(st.maxDate||'-')+'</span></div></div>';
    var cw=14, W=g.weeks.length*cw+40, H=7*cw+30;
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
    svg+='<rect width="'+W+'" height="'+H+'" fill="#0A0A0B"/>';
    var lbl=['','一','','三','','五',''];
    for(var d=0; d<7; d++) if(lbl[d]) svg+='<text x="4" y="'+(d*cw+22)+'" font-size="9" fill="#71717A">'+lbl[d]+'</text>';
    for(var w=0; w<g.weeks.length; w++){
      for(var i=0;i<7;i++){
        var cell=g.weeks[w][i];
        if(cell.value===null) continue;
        var lv=P.hmLevelOf(cell.value, cuts);
        svg+='<rect x="'+(w*cw+24)+'" y="'+(i*cw+12)+'" width="'+(cw-3)+'" height="'+(cw-3)+'" rx="2" fill="'+PAL[Math.max(0,Math.min(4,lv))]+'"><title>'+cell.date+' : '+cell.value+'</title></rect>';
      }
    }
    for(var q=0;q<5;q++) svg+='<rect x="'+(W-90+q*15)+'" y="'+(H-14)+'" width="11" height="11" rx="2" fill="'+PAL[q]+'"/>';
    svg+='<text x="'+(W-118)+'" y="'+(H-5)+'" font-size="9" fill="#71717A">少</text>';
    lastSvg=svg+'</svg>';
    $('map').innerHTML=lastSvg;
    $('streak').innerHTML='<div class="grid">'+
      '<div class="kv"><b>最长连续</b><span>'+sk.best+' 天</span></div>'+
      '<div class="kv"><b>当前连续</b><span>'+sk.current+' 天</span></div>'+
      '<div class="kv"><b>区间活跃天</b><span>'+sk.active+'</span></div>'+
      '<div class="kv"><b>分级阈值</b><span>'+cuts.join(' / ')+'</span></div></div>';
  }
  function autoRange(){
    var r=P.hmParse($('src').value);
    if(r.error) return;
    var rg=P.hmRange(r.map);
    $('from').value=rg.first; $('to').value=rg.last; run();
  }
  $('run').addEventListener('click', run);
  $('auto').addEventListener('click', autoRange);
  $('copy').addEventListener('click', function(){ if(navigator.clipboard) navigator.clipboard.writeText(lastSvg); });
  var demo=[], base=Date.UTC(2026,3,1);
  for(var i=0;i<120;i++){
    var t=base+i*86400000, d=new Date(t);
    var v=(i*7919)%11;
    if(v>3) demo.push(P.hmFmtDate(d)+' '+(v-3));
  }
  $('src').value=demo.join('\n');
  $('from').value='2026-04-01'; $('to').value='2026-07-29';
  run();
})();

</script>
