<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CryptoForge — 本地 AES-GCM 加密</title>
<style>
  :root{
    --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
    --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
  .app{width:100%;max-width:700px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
  textarea,input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
       color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
       font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:64px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .badge.flag{color:#fff;background:var(--accent);border-color:transparent}
  .err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
  footer{margin-top:20px;color:var(--dim);font-size:12px}
  a{color:var(--info);text-decoration:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="本地 AES-GCM 加密与解密：Web Crypto + PBKDF2 派生密钥、随机盐与 IV 打包，敏感数据不出本机。">
</head>
<body>
<div class="app">
  <h1>CryptoForge</h1>
  <p class="sub">本地 AES-GCM 加密与解密 · 单文件 · 零依赖 · 本地优先</p>

  <label for="text">明文 / 密文</label>
  <textarea id="text" rows="5" placeholder="输入要加密的文字，或粘贴 v1|... 密文"></textarea>

  <label for="pass">口令（用于派生密钥，不会离开本机）</label>
  <input id="pass" type="text" placeholder="设置一个强口令">

  <div class="row">
    <button id="enc">加密</button>
    <button id="dec">解密</button>
    <button id="copy" class="ghost">复制结果</button>
    <button id="clear" class="ghost">清空</button>
  </div>
  <div class="err" id="err"></div>

  <label>结果</label>
  <div class="out" id="out" aria-live="polite">结果会显示在这里</div>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>

  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>

<script>
/* ===== 纯函数区（第一个无属性 script）：可被 Node _test.js 提取并断言 ===== */
var B64C='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function strToBytes(s){ return new TextEncoder().encode(s); }
function bytesToStr(b){ return new TextDecoder().decode(b); }
function bytesToB64(bytes){
  var out='', i;
  for(i=0;i+2<bytes.length;i+=3){
    var n=(bytes[i]<<16)|(bytes[i+1]<<8)|bytes[i+2];
    out+=B64C[(n>>18)&63]+B64C[(n>>12)&63]+B64C[(n>>6)&63]+B64C[n&63];
  }
  var rem=bytes.length-i;
  if(rem===1){ var n1=bytes[i]<<16; out+=B64C[(n1>>18)&63]+B64C[(n1>>12)&63]+'=='; }
  else if(rem===2){ var n2=(bytes[i]<<16)|(bytes[i+1]<<8); out+=B64C[(n2>>18)&63]+B64C[(n2>>12)&63]+B64C[(n2>>6)&63]+'='; }
  return out;
}
function b64ToBytes(s){
  s=String(s).replace(/\s+/g,'').replace(/=+$/,'');
  var out=[], i;
  for(i=0;i+3<s.length;i+=4){
    var n=(B64C.indexOf(s[i])<<18)|(B64C.indexOf(s[i+1])<<12)|(B64C.indexOf(s[i+2])<<6)|B64C.indexOf(s[i+3]);
    out.push((n>>16)&255,(n>>8)&255,n&255);
  }
  var rem=s.length-i;
  if(rem===2){ var n3=(B64C.indexOf(s[i])<<18)|(B64C.indexOf(s[i+1])<<12); out.push((n3>>16)&255); }
  else if(rem===3){ var n4=(B64C.indexOf(s[i])<<18)|(B64C.indexOf(s[i+1])<<12)|(B64C.indexOf(s[i+2])<<6); out.push((n4>>16)&255,(n4>>8)&255); }
  return Uint8Array.from(out);
}
function randomBytes(n){
  var b=new Uint8Array(n);
  if(typeof globalThis!=='undefined' && globalThis.crypto && globalThis.crypto.getRandomValues) globalThis.crypto.getRandomValues(b);
  else for(var i=0;i<n;i++) b[i]=Math.floor(Math.random()*256);
  return b;
}
function formatPackage(salt, iv, ct){
  return 'v1|'+bytesToB64(salt)+'|'+bytesToB64(iv)+'|'+bytesToB64(ct);
}
function parsePackage(pkg){
  var p=String(pkg).split('|');
  if(p.length!==4 || p[0]!=='v1') return null;
  try{ return { salt:b64ToBytes(p[1]), iv:b64ToBytes(p[2]), ct:b64ToBytes(p[3]) }; }
  catch(e){ return null; }
}
async function deriveKey(passphrase, salt){
  var baseKey=await globalThis.crypto.subtle.importKey('raw', strToBytes(passphrase), 'PBKDF2', false, ['deriveKey']);
  return globalThis.crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:salt, iterations:100000, hash:'SHA-256'},
    baseKey, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encrypt(plaintext, passphrase){
  var salt=randomBytes(16), iv=randomBytes(12);
  var key=await deriveKey(passphrase, salt);
  var ct=await globalThis.crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, strToBytes(plaintext));
  return formatPackage(salt, iv, new Uint8Array(ct));
}
async function decrypt(pkg, passphrase){
  var parts=parsePackage(pkg);
  if(!parts) throw new Error('密文格式无法识别');
  var key=await deriveKey(passphrase, parts.salt);
  var pt=await globalThis.crypto.subtle.decrypt({name:'AES-GCM', iv:parts.iv}, key, parts.ct);
  return bytesToStr(new Uint8Array(pt));
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { strToBytes:strToBytes, bytesToStr:bytesToStr, bytesToB64:bytesToB64, b64ToBytes:b64ToBytes,
    randomBytes:randomBytes, formatPackage:formatPackage, parsePackage:parsePackage, deriveKey:deriveKey, encrypt:encrypt, decrypt:decrypt };
}
if (typeof window !== 'undefined') {
  window.CryptoForgePure = { strToBytes:strToBytes, bytesToStr:bytesToStr, bytesToB64:bytesToB64, b64ToBytes:b64ToBytes,
    randomBytes:randomBytes, formatPackage:formatPackage, parsePackage:parsePackage, deriveKey:deriveKey, encrypt:encrypt, decrypt:decrypt };
}
</script>

<script>
/* ===== UI 区（第二个 script）：仅在浏览器中运行 ===== */
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.CryptoForgePure;
    function setErr(e){ $('err').textContent = e || ''; }
    async function doEncrypt(){
      setErr('');
      var t=$('text').value, pw=$('pass').value;
      if(!t){ setErr('请先输入要加密的内容'); return; }
      if(!pw){ setErr('请设置口令'); return; }
      try{
        var pkg=await P.encrypt(t, pw);
        $('out').textContent=pkg;
      }catch(e){ setErr('加密失败：'+e.message); }
    }
    async function doDecrypt(){
      setErr('');
      var t=$('text').value, pw=$('pass').value;
      if(!t){ setErr('请粘贴 v1|... 密文'); return; }
      if(!pw){ setErr('请输入加密时使用的口令'); return; }
      try{
        var pt=await P.decrypt(t, pw);
        $('out').textContent=pt;
      }catch(e){ setErr('解密失败：口令错误或密文损坏'); }
    }
    function copy(){
      var t=$('out').textContent;
      if(!t || t==='结果会显示在这里') return;
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    $('enc').addEventListener('click', doEncrypt);
    $('dec').addEventListener('click', doDecrypt);
    $('copy').addEventListener('click', copy);
    $('clear').addEventListener('click', function(){ $('text').value=''; $('pass').value=''; $('out').textContent='结果会显示在这里'; setErr(''); });
  })();
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
