<div class="app">
  <h1>ULIDForge</h1>
  <p class="sub">离线 ULID 工具：时间有序唯一 ID 生成与解码（Crockford Base32） · 单文件 · 零依赖 · 本地优先</p>

<label for="uid">ULID（留空则生成）</label>
<input id="uid" type="text" placeholder="如 01ARYZ6S41XXXXXXX...">
<div class="row">
  <button id="gen">生成 ULID</button>
  <button id="dec">解码 ULID</button>
  <button id="copy" class="ghost">复制</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">结果会显示在这里</div>
<script>
var ULID_ENCODING='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
var ULID_DECODING={};
(function(){ for(var i=0;i<ULID_ENCODING.length;i++){ ULID_DECODING[ULID_ENCODING.charAt(i)]=i; }
  ULID_DECODING['I']=1; ULID_DECODING['L']=1; ULID_DECODING['O']=0; ULID_DECODING['U']=0; })();
function ulidEncodeTime(now, len){
  now=Math.floor(Number(now));
  if(now<0 || now>Math.pow(2,48)-1) return null;
  var str=''; var l=len||10;
  for(; l>0; l--){ var mod=now%32; str=ULID_ENCODING.charAt(mod)+str; now=(now-mod)/32; }
  return str;
}
function ulidEncodeRandom(len, rng){
  rng = rng || Math.random;
  var str=''; var l=len||16;
  while(l--){ str+=ULID_ENCODING.charAt(Math.floor(rng()*32)); }
  return str;
}
function ulidGenerate(time, rng){
  var t = (time===undefined||time===null) ? Date.now() : Number(time);
  return ulidEncodeTime(t,10) + ulidEncodeRandom(16, rng);
}
function ulidDecode(ulid){
  if(typeof ulid!=='string') return {error:'ULID 必须为字符串'};
  ulid=ulid.toUpperCase();
  if(!/^[0-9A-HJKMNP-TV-Z]{26}$/.test(ulid)) return {error:'ULID 须为 26 位 Crockford Base32'};
  var timeStr=ulid.slice(0,10), randStr=ulid.slice(10);
  var t=0;
  for(var i=0;i<timeStr.length;i++){ var td=ULID_DECODING[timeStr.charAt(i)]; if(td===undefined) return {error:'非法字符'}; t=t*32+td; }
  var r=0n;
  for(var j=0;j<randStr.length;j++){ var rd=ULID_DECODING[randStr.charAt(j)]; if(rd===undefined) return {error:'非法字符'}; r=r*32n+BigInt(rd); }
  var date=new Date(t);
  return { time:t, date:isNaN(date.getTime())?null:date.toISOString(), randomness:r.toString(16).padStart(20,'0'), length:ulid.length, error:null };
}
function ulidIsValid(ulid){
  return typeof ulid==='string' && /^[0-9A-HJKMNP-TV-Z]{26}$/.test(ulid.toUpperCase());
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { encodeTime:ulidEncodeTime, encodeRandom:ulidEncodeRandom, generate:ulidGenerate, decode:ulidDecode, isValid:ulidIsValid, ENCODING:ULID_ENCODING };
}
if (typeof window !== 'undefined') {
  window.ULIDForgePure = { encodeTime:ulidEncodeTime, generate:ulidGenerate, decode:ulidDecode, isValid:ulidIsValid };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.ULIDForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    $('gen').addEventListener('click', function(){
      $('err').textContent='';
      try { var id=P.generate(); $('uid').value=id; var r=P.decode(id);
        $('out').textContent='ULID:     '+id+'\n时间(ms): '+r.time+'\n日期:     '+r.date+'\n随机:    '+r.randomness; }
      catch(e){ $('err').textContent=e.message; }
    });
    $('dec').addEventListener('click', function(){
      $('err').textContent='';
      try { var r=P.decode($('uid').value.trim());
        if(r.error){ $('out').textContent='错误：'+r.error; return; }
        $('out').textContent='ULID:     '+$('uid').value.trim()+'\n时间(ms): '+r.time+'\n日期:     '+r.date+'\n随机:    '+r.randomness; }
      catch(e){ $('err').textContent=e.message; }
    });
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('uid').value=''; $('out').textContent='结果会显示在这里'; });
  })();
}
</script>

<div id="nanoToast" role="status" aria-live="polite"></div>
<script data-nano-polish>
(function(){var el=document.getElementById('nanoToast');if(!el)return;var t;
function zh(){try{var l=localStorage.getItem('nano-lang')||document.documentElement.lang||'zh';return String(l).indexOf('en')!==0;}catch(e){return true;}}
function show(m,bad){el.textContent=m;el.className='on'+(bad?' bad':'');clearTimeout(t);t=setTimeout(function(){el.className='';},1700);}
window.nanoToast=show;
try{var nc=navigator.clipboard;if(nc&&nc.writeText){var ow=nc.writeText.bind(nc);nc.writeText=function(s){return ow(s).then(function(r){show(zh()?'已复制':'Copied');return r;},function(e){show(zh()?'复制失败':'Copy failed',1);throw e;});};}}catch(e){}
try{if(document.execCommand){var oe=document.execCommand.bind(document);document.execCommand=function(c){var r=oe.apply(null,arguments);if(String(c).toLowerCase()==='copy'){show(r?(zh()?'已复制':'Copied'):(zh()?'复制失败':'Copy failed'),!r);}return r;};}}catch(e){}
})();
</script>
