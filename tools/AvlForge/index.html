.badge.flag{color:#fff;background:var(--accent);border-color:transparent}

footer{margin-top:20px;color:var(--dim);font-size:12px}

/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<body>
<div class="app">
  <h1>AvlForge</h1>
  <p class="sub">AVL 自平衡树，LL/RR/LR/RL 四旋转 + 平衡校验 + ASCII 树形 · 单文件 · 零依赖 · 本地优先</p>

<label>插入序列（逗号分隔整数，按序插入）</label>
<textarea id="txt" rows="2">10, 20, 30, 40, 50, 25</textarea>
<div class="row">
  <button id="run">构建 AVL</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>树结构</label>
<div class="out" id="out" aria-live="polite">插入后展示旋转过程与树形</div>
<script>
function avlHeight(n){ return n?n.h:0; }
function avlBalance(n){ return n?avlHeight(n.left)-avlHeight(n.right):0; }
function avlFix(n){ n.h=1+Math.max(avlHeight(n.left),avlHeight(n.right)); return n; }
function avlRotRight(y){
  var x=y.left, t2=x.right;
  x.right=y; y.left=t2;
  avlFix(y); avlFix(x);
  return x;
}
function avlRotLeft(x){
  var y=x.right, t2=y.left;
  y.left=x; x.right=t2;
  avlFix(x); avlFix(y);
  return y;
}
function avlInsert(root, key, log){
  if(typeof key!=='number'||!isFinite(key)) return { value:root, error:'键必须是有限数' };
  var dup=false;
  function ins(node){
    if(!node) return { key:key, left:null, right:null, h:1 };
    if(key<node.key) node.left=ins(node.left);
    else if(key>node.key) node.right=ins(node.right);
    else { dup=true; return node; }
    avlFix(node);
    var b=avlBalance(node);
    if(b>1 && key<node.left.key){ if(log) log.push('LL@'+node.key+' 右旋'); return avlRotRight(node); }
    if(b<-1 && key>node.right.key){ if(log) log.push('RR@'+node.key+' 左旋'); return avlRotLeft(node); }
    if(b>1 && key>node.left.key){ if(log) log.push('LR@'+node.key+' 先左后右'); node.left=avlRotLeft(node.left); return avlRotRight(node); }
    if(b<-1 && key<node.right.key){ if(log) log.push('RL@'+node.key+' 先右后左'); node.right=avlRotRight(node.right); return avlRotLeft(node); }
    return node;
  }
  var r=ins(root);
  if(dup) return { value:root, error:'重复键 '+key };
  return { value:r, error:null };
}
function avlInorder(root){
  var out=[];
  (function walk(n){ if(!n) return; walk(n.left); out.push(n.key); walk(n.right); })(root);
  return out;
}
function avlValidate(root){
  var okBST=true, okBal=true;
  (function chk(n,lo,hi){
    if(!n) return 0;
    if((lo!==null&&n.key<=lo)||(hi!==null&&n.key>=hi)) okBST=false;
    var hl=chk(n.left,lo,n.key), hr=chk(n.right,n.key,hi);
    if(Math.abs(hl-hr)>1) okBal=false;
    var h=1+Math.max(hl,hr);
    if(n.h!==h) okBal=false;
    return h;
  })(root,null,null);
  return { bst:okBST, balanced:okBal };
}
function avlRender(root){
  if(!root) return '(空树)';
  var lines=[];
  (function draw(n, prefix, isLeft){
    if(!n) return;
    draw(n.right, prefix+(isLeft?'|   ':'    '), false);
    lines.push(prefix+(isLeft?'\\-- ':'/-- ')+n.key+' (h'+n.h+')');
    draw(n.left, prefix+(isLeft?'    ':'|   '), true);
  })(root, '', true);
  return lines.join('\n');
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { avlInsert:avlInsert, avlInorder:avlInorder, avlValidate:avlValidate,
    avlHeight:avlHeight, avlBalance:avlBalance, avlRender:avlRender };
}
if (typeof window !== 'undefined') {
  window.AvlForgePure = { avlInsert:avlInsert, avlInorder:avlInorder, avlValidate:avlValidate,
    avlHeight:avlHeight, avlBalance:avlBalance, avlRender:avlRender };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.AvlForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var keys=$('txt').value.split(',').map(function(x){ return Number(x.trim()); }).filter(function(x){ return !isNaN(x); });
      if(!keys.length){ $('err').textContent='请输入至少一个整数'; return; }
      var root=null, log=[];
      for(var i=0;i<keys.length;i++){
        var r=P.avlInsert(root, keys[i], log);
        if(r.error){ log.push('跳过: '+r.error); }
        root=r.value;
      }
      var v=P.avlValidate(root);
      $('out').textContent='旋转记录:\n'+(log.length?log.join('\n'):'(无旋转)')+
        '\n\n中序: '+P.avlInorder(root).join(', ')+
        '\n高度: '+P.avlHeight(root)+' | BST:'+(v.bst?'OK':'BAD')+' 平衡:'+(v.balanced?'OK':'BAD')+
        '\n\n'+P.avlRender(root);
    });
    $('clear').addEventListener('click', function(){ $('txt').value=''; $('out').textContent='插入后展示旋转过程与树形'; });
  })();
}
</script>
