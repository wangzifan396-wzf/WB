<body>
<div class="app">
  <h1>RateLimitForge</h1>
  <p class="sub">限流算法：令牌桶/漏桶/滑动窗口的可用量、剩余量与容量估算，附算法说明 · 单文件 · 零依赖 · 本地优先</p>

<label>算法</label>
<select id="algo"><option value="tb">令牌桶</option><option value="lb">漏桶</option><option value="sw">滑动窗口</option></select>
<label>容量 / 上限</label><input type="text" id="cap" value="10">
<label>速率 (个/秒)</label><input type="text" id="rate" value="2">
<label>经过秒数</label><input type="text" id="el" value="3">
<div class="row"><button id="calc">计算</button></div>
<div class="out" id="out">当前可用令牌将显示在这里</div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>

function tokenBucket(capacity, refillPerSec, elapsedSec, start){
  start=start||0;
  var added=elapsedSec*refillPerSec;
  return Math.max(0, Math.min(capacity, start+added));
}
function leakyBucket(capacity, leakPerSec, elapsedSec, start){
  start=start||0;
  var leaked=elapsedSec*leakPerSec;
  return Math.max(0, Math.min(capacity, start-leaked));
}
function slidingWindow(max, windowSec, nowSec, hits){
  var cnt=0; for(var i=0;i<hits.length;i++){ var d=nowSec-hits[i]; if(d>=0 && d<=windowSec) cnt++; }
  return {count:cnt, allowed:cnt<max, remaining:Math.max(0,max-cnt)};
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { tokenBucket:tokenBucket, leakyBucket:leakyBucket, slidingWindow:slidingWindow }; }
if (typeof window !== 'undefined') { window.RateLimitForgePure = { tokenBucket:tokenBucket, leakyBucket:leakyBucket, slidingWindow:slidingWindow }; }

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.RateLimitForgePure;
  function calc(){
    var algo=$('algo').value, cap=parseInt($('cap').value,10)||0, rate=parseInt($('rate').value,10)||0, el=parseInt($('el').value,10)||0;
    var v, label;
    if(algo==='tb'){ v=P.tokenBucket(cap,rate,el,cap); label='令牌桶 当前可用'; }
    else if(algo==='lb'){ v=P.leakyBucket(cap,rate,el,cap); label='漏桶 当前水量'; }
    else { var sw=P.slidingWindow(cap,10,el,[1,2,3,9,15]); v=sw.count; label='滑动窗口 窗口内请求数 ('+sw.remaining+' 剩余)'; }
    $('out').innerHTML='<div class="grid"><div class="kv"><b>'+label+'</b><span>'+v+'</span></div><div class="kv"><b>容量/上限</b><span>'+cap+'</span></div></div>';
  }
  $('calc').addEventListener('click', calc);
  calc();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
