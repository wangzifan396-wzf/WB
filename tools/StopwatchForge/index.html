<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>StopwatchForge — 秒表 / 计圈计时：毫秒精度、暂停继续、圈速最佳最差，离线可用。</title>
<meta property="og:title" content="StopwatchForge">
<meta property="og:description" content="秒表与计圈计时：毫秒精度、暂停继续、圈速统计，离线可用">
<meta property="og:image" content="./og.png">
<meta name="description" content="秒表与计圈计时：毫秒精度、暂停继续、圈速统计，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>StopwatchForge</h1>
  <p class="sub">秒表与计圈计时：毫秒精度、暂停 / 继续、圈速最佳最差统计 · 单文件 · 零依赖 · 本地优先</p>

<div class="out" id="disp" style="text-align:center;font:42px/1.2 ui-monospace,monospace;padding:18px 0">00:00.000</div>
<div class="row" style="justify-content:center">
  <button id="start">开始</button>
  <button id="lap" class="ghost">计圈</button>
  <button id="reset" class="ghost">重置</button>
</div>
<div class="out" id="laps"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>

function swFormat(ms){
  if(ms<0) ms=0;
  var total=Math.floor(ms/1000);
  var h=Math.floor(total/3600);
  var m=Math.floor((total%3600)/60);
  var s=total%60;
  var mm=ms%1000;
  function p2(x){ return (x<10?'0':'')+x; }
  function p3(x){ x=Math.floor(x); return (x<10?'00':(x<100?'0':''))+x; }
  return (h>0? (p2(h)+':'):'') + p2(m)+':'+p2(s)+'.'+p3(mm);
}
function swLaps(laps){
  if(!laps.length) return { total:0, best:0, worst:0 };
  var total=0,best=laps[0],worst=laps[0];
  for(var i=0;i<laps.length;i++){ total+=laps[i]; if(laps[i]<best) best=laps[i]; if(laps[i]>worst) worst=laps[i]; }
  return { total:total, best:best, worst:worst };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { swFormat:swFormat, swLaps:swLaps };
}
if (typeof window !== 'undefined') {
  window.StopwatchForgePure = { swFormat:swFormat, swLaps:swLaps };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.StopwatchForgePure;
  var elapsed=0, startT=0, running=false, timer=null;
  function now(){ return (typeof performance!=='undefined' && performance.now)? performance.now(): Date.now(); }
  function fmtNow(){
    var el=elapsed + (running? now()-startT : 0);
    $('disp').textContent=P.swFormat(el);
    if(running) timer=setTimeout(fmtNow, 53);
  }
  function start(){
    if(running){ running=false; elapsed+=now()-startT; clearTimeout(timer); $('start').textContent='继续'; }
    else { running=true; startT=now(); $('start').textContent='暂停'; fmtNow(); }
  }
  function reset(){ running=false; clearTimeout(timer); elapsed=0; $('disp').textContent='00:00.000'; $('laps').innerHTML=''; $('start').textContent='开始'; }
  function lap(){
    if(!running && elapsed===0) return;
    var cur=elapsed+(running? now()-startT:0);
    var laps=P._laps||(P._laps=[]); laps.push(cur);
    var s=P.swLaps(laps);
    $('laps').innerHTML='<div class="grid">'+
      '<div class="kv"><b>圈数</b><span>'+laps.length+'</span></div>'+
      '<div class="kv"><b>最佳</b><span>'+P.swFormat(s.best)+'</span></div>'+
      '<div class="kv"><b>最差</b><span>'+P.swFormat(s.worst)+'</span></div>'+
      '</div>';
  }
  $('start').addEventListener('click', start);
  $('reset').addEventListener('click', reset);
  $('lap').addEventListener('click', lap);
  fmtNow();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
