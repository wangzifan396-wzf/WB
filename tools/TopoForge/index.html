<body>
<div class="app">
  <h1>TopoForge</h1>
  <p class="sub">拓扑排序 / DAG 编排器：Kahn 算法 + 并行批次分层 + 环检测 · 单文件 · 零依赖 · 本地优先</p>

<label>依赖边（每行一条 a -> b，表示 a 先于 b）</label>
<textarea id="edges" rows="6">build -> test
test -> deploy
lint -> test
fetch -> build</textarea>
<div class="row">
  <button id="run">拓扑排序</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入依赖边后排序</div>
<script>
function parseEdges(text){
  var nodes={}, edges=[];
  var lines=String(text||'').split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln) continue;
    var m=ln.split(/\s*(?:->|=>)\s*/);
    if(m.length!==2 || !m[0] || !m[1]) return { nodes:null, edges:null, error:'第 '+(i+1)+' 行格式错误（需 a -> b）' };
    nodes[m[0]]=1; nodes[m[1]]=1;
    edges.push([m[0], m[1]]);
  }
  return { nodes:Object.keys(nodes), edges:edges, error:null };
}
function topoSort(nodes, edges){
  var indeg={}, adj={};
  nodes.forEach(function(n){ indeg[n]=0; adj[n]=[]; });
  edges.forEach(function(e){
    if(!(e[0] in indeg) || !(e[1] in indeg)) throw new Error('UNKNOWN_NODE');
    adj[e[0]].push(e[1]); indeg[e[1]]++;
  });
  var q=nodes.filter(function(n){ return indeg[n]===0; }).sort();
  var order=[];
  while(q.length){
    var n=q.shift(); order.push(n);
    adj[n].sort().forEach(function(m){ indeg[m]--; if(indeg[m]===0){ q.push(m); q.sort(); } });
  }
  if(order.length!==nodes.length){
    var cyc=nodes.filter(function(n){ return order.indexOf(n)<0; });
    return { order:null, cycle:cyc };
  }
  return { order:order, cycle:null };
}
function levels(nodes, edges){
  var indeg={}, adj={};
  nodes.forEach(function(n){ indeg[n]=0; adj[n]=[]; });
  edges.forEach(function(e){ adj[e[0]].push(e[1]); indeg[e[1]]++; });
  var out=[], cur=nodes.filter(function(n){ return indeg[n]===0; }).sort();
  var seen=0;
  while(cur.length){
    out.push(cur);
    seen+=cur.length;
    var next={};
    cur.forEach(function(n){ adj[n].forEach(function(m){ indeg[m]--; if(indeg[m]===0) next[m]=1; }); });
    cur=Object.keys(next).sort();
  }
  if(seen!==nodes.length) return null;
  return out;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parseEdges:parseEdges, topoSort:topoSort, levels:levels };
}
if (typeof window !== 'undefined') {
  window.TopoForgePure = { parseEdges:parseEdges, topoSort:topoSort, levels:levels };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.TopoForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var p=P.parseEdges($('edges').value);
        if(p.error) throw new Error(p.error);
        var r=P.topoSort(p.nodes, p.edges);
        if(r.cycle){ $('out').textContent='存在环，无法排序。环上节点: '+r.cycle.join(', '); return; }
        var lv=P.levels(p.nodes, p.edges);
        var lines=['执行顺序: '+r.order.join(' → '), '', '并行批次:'];
        lv.forEach(function(g,i){ lines.push('  阶段 '+(i+1)+': '+g.join(', ')); });
        $('out').textContent=lines.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('edges').value=''; $('out').textContent='输入依赖边后排序'; });
  })();
}
</script>
