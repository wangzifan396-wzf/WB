<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}

label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;

input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}

.badge.flag{color:#fff;background:var(--accent);border-color:transparent}

<div class="app">
  <h1>ClipForge</h1>
  <p class="sub">CSS clip-path 编辑器：内置三角/箭头/星形/六边形等预设，可增删顶点、生成 polygon() 代码并实时预览，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <label style="margin:0">预设</label>
  <select id="preset">
    <option value="triangle">三角形</option>
    <option value="arrow">箭头</option>
    <option value="star" selected>五角星</option>
    <option value="hexagon">六边形</option>
    <option value="message">对话框</option>
  </select>
  <button id="apply">应用预设</button>
  <button id="addpt" class="ghost">增加顶点</button>
  <span class="sub" id="stat" style="margin:0"></span>
</div>
<div id="stage" style="height:260px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;display:flex;align-items:center;justify-content:center;">
  <div id="shape" style="width:200px;height:200px;background:linear-gradient(135deg,#5E6AD2,#22D3EE);"></div>
</div>
<textarea id="out" rows="4" readonly spellcheck="false"></textarea>
<script>
function cpPresets(){
  return {
    triangle:[[50,0],[0,100],[100,100]],
    arrow:[[0,20],[60,20],[60,0],[100,50],[60,100],[60,80],[0,80]],
    star:[[50,0],[61,35],[98,35],[68,57],[79,91],[50,70],[21,91],[32,57],[2,35],[39,35]],
    hexagon:[[25,0],[75,0],[100,50],[75,100],[25,100],[0,50]],
    message:[[0,0],[100,0],[100,75],[75,75],[75,100],[50,75],[0,75]]
  };
}
function cpClamp(v){ var x=Number(v); if(!isFinite(x)) x=0; return Math.min(100,Math.max(0,Math.round(x*100)/100)); }
function cpToCss(pts){
  if(!pts || pts.length<3) return '';
  return 'polygon('+pts.map(function(p){ return cpClamp(p[0])+'% '+cpClamp(p[1])+'%'; }).join(', ')+')';
}
function cpParse(css){
  var m=/polygon\(([^)]*)\)/.exec(String(css||''));
  if(!m) return null;
  var pts=m[1].split(',').map(function(seg){
    var mm=/([\d.]+)%\s+([\d.]+)%/.exec(seg.trim());
    return mm ? [Number(mm[1]),Number(mm[2])] : null;
  });
  if(pts.indexOf(null)>=0 || pts.length<3) return null;
  return pts;
}
function cpMidInsert(pts, i){
  if(!pts || pts.length<3) return pts;
  var a=pts[i%pts.length], b=pts[(i+1)%pts.length];
  var mid=[cpClamp((a[0]+b[0])/2), cpClamp((a[1]+b[1])/2)];
  var out=pts.slice(0,i+1); out.push(mid); return out.concat(pts.slice(i+1));
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { cpPresets:cpPresets, cpClamp:cpClamp, cpToCss:cpToCss, cpParse:cpParse, cpMidInsert:cpMidInsert };
}
if (typeof window !== 'undefined') {
  window.ClipForgePure = { cpPresets:cpPresets, cpClamp:cpClamp, cpToCss:cpToCss, cpParse:cpParse, cpMidInsert:cpMidInsert };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.ClipForgePure;
    var pts = P.cpPresets().star;
    function render(){
      var css=P.cpToCss(pts);
      $('shape').style.clipPath=css;
      $('out').value='clip-path: '+css+';';
      $('stat').textContent=pts.length+' 个顶点';
    }
    $('apply').addEventListener('click', function(){
      var k=$('preset').value; var pre=P.cpPresets()[k];
      if(pre){ pts=pre.map(function(p){ return [p[0],p[1]]; }); render(); }
    });
    $('addpt').addEventListener('click', function(){ pts=P.cpMidInsert(pts,0); render(); });
    render();
  })();
}
</script>
