:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}

<body>
<div class="app">
  <h1>StegForge</h1>
  <p class="sub">零宽隐写：把秘密消息藏进不可见字符，检测/提取/防篡改 · 单文件 · 零依赖 · 本地优先</p>

<label>载体文本（公开可见；提取 / 检测时把带隐写的文本粘回这里）</label>
<textarea id="cover" rows="3">本季度矩阵新增十款工具，欢迎试用并反馈。</textarea>
<label>秘密消息（将以零宽字符隐藏）</label>
<textarea id="secret" rows="2">codeword: nano-33</textarea>
<div class="row">
  <button id="hide">隐藏</button>
  <button id="reveal">提取</button>
  <button id="detect">检测</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite" style="word-break:break-all">结果显示在这里</div>
<script>
var SG0='\u200B', SG1='\u200C', SGS='\u200D', SGE='\u2060';
function sgUtf8Encode(str){
  var out=[], i=0;
  while(i<str.length){
    var c=str.codePointAt(i);
    i+=c>0xFFFF?2:1;
    if(c<0x80) out.push(c);
    else if(c<0x800){ out.push(0xC0|(c>>6), 0x80|(c&63)); }
    else if(c<0x10000){ out.push(0xE0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63)); }
    else { out.push(0xF0|(c>>18), 0x80|((c>>12)&63), 0x80|((c>>6)&63), 0x80|(c&63)); }
  }
  return out;
}
function sgUtf8Decode(bytes){
  var s='', i=0;
  while(i<bytes.length){
    var b=bytes[i];
    if(b<0x80){ s+=String.fromCodePoint(b); i++; }
    else if((b&0xE0)===0xC0){
      if(i+1>=bytes.length) return null;
      s+=String.fromCodePoint(((b&31)<<6)|(bytes[i+1]&63)); i+=2;
    } else if((b&0xF0)===0xE0){
      if(i+2>=bytes.length) return null;
      s+=String.fromCodePoint(((b&15)<<12)|((bytes[i+1]&63)<<6)|(bytes[i+2]&63)); i+=3;
    } else if((b&0xF8)===0xF0){
      if(i+3>=bytes.length) return null;
      s+=String.fromCodePoint(((b&7)<<18)|((bytes[i+1]&63)<<12)|((bytes[i+2]&63)<<6)|(bytes[i+3]&63)); i+=4;
    } else return null;
  }
  return s;
}
function sgHide(cover, secret){
  if(typeof cover!=='string'||!cover.length) return { value:null, error:'载体文本为空' };
  if(typeof secret!=='string'||!secret.length) return { value:null, error:'秘密消息为空' };
  if(/[\u200B\u200C\u200D\u2060]/.test(cover)) return { value:null, error:'载体已含零宽字符（可能已有隐写）' };
  var bytes=sgUtf8Encode(secret), bits='';
  for(var i=0;i<bytes.length;i++){
    var b=bytes[i].toString(2);
    while(b.length<8) b='0'+b;
    bits+=b;
  }
  var payload=SGS;
  for(var j=0;j<bits.length;j++) payload+=bits.charAt(j)==='0'?SG0:SG1;
  payload+=SGE;
  var cut=Math.min(1, cover.length);
  return { value:cover.slice(0,cut)+payload+cover.slice(cut), error:null };
}
function sgReveal(text){
  if(typeof text!=='string'||!text.length) return { value:null, error:'文本为空' };
  var s=text.indexOf(SGS), e=text.indexOf(SGE);
  if(s===-1||e===-1||e<s) return { value:null, error:'未发现隐写载荷（缺起止标记）' };
  var body=text.slice(s+1, e), bits='';
  for(var i=0;i<body.length;i++){
    var ch=body.charAt(i);
    if(ch===SG0) bits+='0';
    else if(ch===SG1) bits+='1';
    else return { value:null, error:'载荷中混入非法字符' };
  }
  if(!bits.length||bits.length%8!==0) return { value:null, error:'载荷位数不是 8 的倍数（已损坏）' };
  var bytes=[];
  for(var k=0;k<bits.length;k+=8) bytes.push(parseInt(bits.slice(k,k+8),2));
  var msg=sgUtf8Decode(bytes);
  if(msg===null) return { value:null, error:'UTF-8 解码失败（载荷损坏）' };
  return { value:msg, error:null };
}
function sgDetect(text){
  if(typeof text!=='string') return { zeroWidthCount:0, hasPayload:false, visibleLength:0 };
  var zw=(text.match(/[\u200B\u200C\u200D\u2060]/g)||[]).length;
  return {
    zeroWidthCount:zw,
    hasPayload:text.indexOf(SGS)!==-1 && text.indexOf(SGE)>text.indexOf(SGS),
    visibleLength:text.replace(/[\u200B\u200C\u200D\u2060]/g,'').length
  };
}
function sgStrip(text){
  return String(text).replace(/[\u200B\u200C\u200D\u2060]/g,'');
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { sgHide:sgHide, sgReveal:sgReveal, sgDetect:sgDetect, sgStrip:sgStrip, sgUtf8Encode:sgUtf8Encode, sgUtf8Decode:sgUtf8Decode };
}
if (typeof window !== 'undefined') {
  window.StegForgePure = { sgHide:sgHide, sgReveal:sgReveal, sgDetect:sgDetect, sgStrip:sgStrip, sgUtf8Encode:sgUtf8Encode, sgUtf8Decode:sgUtf8Decode };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.StegForgePure;
    $('hide').addEventListener('click', function(){
      $('err').textContent='';
      var r=P.sgHide($('cover').value, $('secret').value);
      if(r.error){ $('err').textContent=r.error; return; }
      var d=P.sgDetect(r.value);
      $('out').textContent=r.value;
      $('cover').value=r.value;
      $('err').textContent='已注入 '+d.zeroWidthCount+' 个零宽字符（肉眼不可见），输出可直接复制';
    });
    $('reveal').addEventListener('click', function(){
      $('err').textContent='';
      var r=P.sgReveal($('cover').value);
      if(r.error){ $('err').textContent=r.error; return; }
      $('out').textContent='提取到秘密消息: '+r.value;
    });
    $('detect').addEventListener('click', function(){
      $('err').textContent='';
      var d=P.sgDetect($('cover').value);
      $('out').textContent='零宽字符 '+d.zeroWidthCount+' 个 · '+(d.hasPayload?'检测到完整载荷 ✓':'无完整载荷')+' · 可见长度 '+d.visibleLength;
    });
    $('clear').addEventListener('click', function(){ $('cover').value=''; $('secret').value=''; $('out').textContent='结果显示在这里'; });
  })();
}
</script>

</div>
