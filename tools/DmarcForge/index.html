<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>DmarcForge — DMARC 记录分析：标签逐条解读、防护评分与分级、语法体检与记录生成。</title>
<meta property="og:title" content="DmarcForge">
<meta property="og:description" content="DMARC 记录分析：标签解读、防护评分分级、语法体检与记录生成，离线可用">
<meta property="og:image" content="./og.png">
<meta name="description" content="DMARC 记录分析：标签解读、防护评分分级、语法体检与记录生成，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>DmarcForge</h1>
  <p class="sub">DMARC 记录：标签逐条中文解读、0-100 防护评分与 A-F 分级、语法体检、一键生成合规记录 · 单文件 · 零依赖 · 本地优先</p>

<label>DMARC 记录（_dmarc.example.com 的 TXT 值）</label>
<textarea id="src" rows="3" spellcheck="false"></textarea>
<div class="row">
  <button id="run">分析记录</button>
  <label style="margin:0">生成策略</label>
  <select id="p" style="max-width:130px">
    <option value="none">p=none</option>
    <option value="quarantine">p=quarantine</option>
    <option value="reject">p=reject</option>
  </select>
  <input type="text" id="rua" placeholder="dmarc@example.com" style="max-width:210px">
  <button id="gen" class="ghost">生成记录</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>
<div class="out" id="detail"></div>
<div class="out" id="lint"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>

function dmSplitTags(record){
  var out={}, order=[], parts=String(record||'').split(';');
  for(var i=0;i<parts.length;i++){
    var p=parts[i].trim();
    if(!p) continue;
    var eq=p.indexOf('=');
    if(eq<0){ continue; }
    var k=p.slice(0,eq).trim().toLowerCase(), v=p.slice(eq+1).trim();
    if(out[k]===undefined){ out[k]=v; order.push(k); }
  }
  return { tags:out, order:order };
}
function dmParse(record){
  var raw=String(record||'').trim().replace(/^"|"$/g,'');
  if(!raw) return { error:'请输入 DMARC 记录' };
  var r=dmSplitTags(raw), t=r.tags;
  if(!t.v) return { error:'缺少 v 标签，DMARC 记录必须以 v=DMARC1 开头' };
  if(t.v.toUpperCase()!=='DMARC1') return { error:'v 标签必须为 DMARC1，当前为 '+t.v };
  if(r.order[0]!=='v') return { error:'v 必须是第一个标签' };
  return { error:null, tags:t, order:r.order, raw:raw };
}
function dmPolicyScore(t){
  var p=(t.p||'none').toLowerCase(), sp=(t.sp||p).toLowerCase();
  var pct=t.pct===undefined ? 100 : parseInt(t.pct,10);
  if(isNaN(pct)) pct=100;
  var base = p==='reject' ? 60 : p==='quarantine' ? 40 : 10;
  var sub  = sp==='reject' ? 15 : sp==='quarantine' ? 10 : 2;
  var cov  = Math.round(pct/100*15);
  var rep  = (t.rua?7:0) + (t.ruf?3:0);
  return Math.max(0, Math.min(100, base+sub+cov+rep));
}
function dmGrade(score){
  if(score>=90) return 'A';
  if(score>=75) return 'B';
  if(score>=60) return 'C';
  if(score>=40) return 'D';
  return 'F';
}
function dmMailtos(v){
  if(!v) return [];
  return String(v).split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
}
function dmLint(parsed){
  if(!parsed || parsed.error) return [];
  var t=parsed.tags, out=[];
  var p=(t.p||'').toLowerCase();
  if(!t.p) out.push({ level:'错误', msg:'缺少必填的 p 标签（none / quarantine / reject）' });
  else if(['none','quarantine','reject'].indexOf(p)<0) out.push({ level:'错误', msg:'p 取值非法：'+t.p });
  else if(p==='none') out.push({ level:'建议', msg:'p=none 仅监控不拦截，建议逐步升级到 quarantine 再到 reject' });
  if(t.pct!==undefined){
    var pct=parseInt(t.pct,10);
    if(isNaN(pct)||pct<0||pct>100) out.push({ level:'错误', msg:'pct 必须是 0-100 的整数' });
    else if(pct<100) out.push({ level:'建议', msg:'pct='+pct+' 表示只对部分邮件应用策略，全量防护应设为 100' });
  }
  if(!t.rua) out.push({ level:'建议', msg:'未配置 rua，收不到聚合报告将难以观测认证失败情况' });
  var rua=dmMailtos(t.rua);
  for(var i=0;i<rua.length;i++) if(rua[i].indexOf('mailto:')!==0) out.push({ level:'错误', msg:'rua 地址必须以 mailto: 开头：'+rua[i] });
  var ruf=dmMailtos(t.ruf);
  for(var j=0;j<ruf.length;j++) if(ruf[j].indexOf('mailto:')!==0) out.push({ level:'错误', msg:'ruf 地址必须以 mailto: 开头：'+ruf[j] });
  if(t.adkim!==undefined && ['r','s'].indexOf(String(t.adkim).toLowerCase())<0) out.push({ level:'错误', msg:'adkim 只能是 r 或 s' });
  if(t.aspf!==undefined && ['r','s'].indexOf(String(t.aspf).toLowerCase())<0) out.push({ level:'错误', msg:'aspf 只能是 r 或 s' });
  if(t.fo!==undefined && !/^[01ds](:[01ds])*$/.test(String(t.fo))) out.push({ level:'错误', msg:'fo 取值应为 0/1/d/s 的冒号组合' });
  if(t.ri!==undefined && !(parseInt(t.ri,10)>0)) out.push({ level:'错误', msg:'ri 必须是正整数秒数' });
  var known=['v','p','sp','pct','rua','ruf','adkim','aspf','fo','ri','rf'];
  for(var k=0;k<parsed.order.length;k++)
    if(known.indexOf(parsed.order[k])<0) out.push({ level:'建议', msg:'未知标签：'+parsed.order[k] });
  return out;
}
function dmExplain(parsed){
  if(!parsed || parsed.error) return [];
  var t=parsed.tags, out=[];
  var pmap={ none:'仅监控，不做任何拦截', quarantine:'认证失败的邮件进入垃圾箱', reject:'认证失败的邮件直接拒收' };
  out.push(['p 主策略', pmap[(t.p||'none').toLowerCase()] || t.p]);
  out.push(['sp 子域策略', t.sp ? (pmap[String(t.sp).toLowerCase()]||t.sp) : '未设置，继承主策略']);
  out.push(['pct 应用比例', (t.pct===undefined?'100':t.pct)+'% 的邮件应用该策略']);
  out.push(['adkim DKIM 对齐', String(t.adkim||'r').toLowerCase()==='s' ? '严格：域名必须完全一致' : '宽松：允许子域']);
  out.push(['aspf SPF 对齐', String(t.aspf||'r').toLowerCase()==='s' ? '严格：域名必须完全一致' : '宽松：允许子域']);
  out.push(['rua 聚合报告', dmMailtos(t.rua).length ? dmMailtos(t.rua).join(', ') : '未配置']);
  out.push(['ruf 取证报告', dmMailtos(t.ruf).length ? dmMailtos(t.ruf).join(', ') : '未配置']);
  out.push(['ri 报告周期', (t.ri ? t.ri : '86400')+' 秒']);
  return out;
}
function dmBuild(opt){
  opt = opt || {};
  var parts=['v=DMARC1', 'p='+(opt.p||'none')];
  if(opt.sp) parts.push('sp='+opt.sp);
  if(opt.rua) parts.push('rua=mailto:'+opt.rua);
  if(opt.ruf) parts.push('ruf=mailto:'+opt.ruf);
  if(opt.pct!==undefined && opt.pct!=='' && String(opt.pct)!=='100') parts.push('pct='+opt.pct);
  if(opt.adkim) parts.push('adkim='+opt.adkim);
  if(opt.aspf) parts.push('aspf='+opt.aspf);
  return parts.join('; ') + ';';
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { dmSplitTags:dmSplitTags, dmParse:dmParse, dmPolicyScore:dmPolicyScore,
    dmGrade:dmGrade, dmMailtos:dmMailtos, dmLint:dmLint, dmExplain:dmExplain, dmBuild:dmBuild };
}
if (typeof window !== 'undefined') {
  window.DmarcForgePure = { dmSplitTags:dmSplitTags, dmParse:dmParse, dmPolicyScore:dmPolicyScore,
    dmGrade:dmGrade, dmMailtos:dmMailtos, dmLint:dmLint, dmExplain:dmExplain, dmBuild:dmBuild };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.DmarcForgePure;
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function run(){
    var r=P.dmParse($('src').value);
    if(r.error){ $('err').textContent=r.error; $('out').innerHTML=''; $('detail').innerHTML=''; $('lint').innerHTML=''; return; }
    $('err').textContent='';
    var sc=P.dmPolicyScore(r.tags), errs=P.dmLint(r).filter(function(x){ return x.level==='错误'; });
    $('out').innerHTML='<div class="grid">'+
      '<div class="kv"><b>防护评分</b><span>'+sc+' / 100</span></div>'+
      '<div class="kv"><b>等级</b><span>'+P.dmGrade(sc)+'</span></div>'+
      '<div class="kv"><b>标签数</b><span>'+r.order.length+'</span></div>'+
      '<div class="kv"><b>语法错误</b><span>'+errs.length+'</span></div></div>';
    var ex=P.dmExplain(r), h='';
    for(var i=0;i<ex.length;i++) h+='<div class="kv"><b>'+esc(ex[i][0])+'</b><span>'+esc(ex[i][1])+'</span></div>';
    $('detail').innerHTML=h;
    var l=P.dmLint(r), t='';
    if(!l.length) t='<div class="kv"><b>体检</b><span>未发现问题</span></div>';
    else for(var j=0;j<l.length;j++) t+='<div class="kv"><b>'+l[j].level+'</b><span>'+esc(l[j].msg)+'</span></div>';
    $('lint').innerHTML=t;
  }
  $('run').addEventListener('click', run);
  $('gen').addEventListener('click', function(){
    $('src').value=P.dmBuild({ p:$('p').value, rua:$('rua').value||'dmarc@example.com' });
    run();
  });
  $('src').value='v=DMARC1; p=quarantine; sp=reject; pct=100; rua=mailto:dmarc@example.com; adkim=s; aspf=r;';
  run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
