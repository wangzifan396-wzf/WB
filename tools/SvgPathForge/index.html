<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>SvgPathForge — SVG path 工具箱：相对/绝对互转、包围盒计算与数值简化。</title>
<meta property="og:title" content="SvgPathForge">
<meta property="og:description" content="SVG path 工具箱：互转/包围盒/简化，离线可用">

<meta name="description" content="SVG path 工具箱：互转/包围盒/简化，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>SvgPathForge</h1>
  <p class="sub">SVG path 处理：命令解析、相对↔绝对互转、包围盒计算、坐标数值简化取整 · 单文件 · 零依赖 · 本地优先</p>

<label>SVG path d 属性</label>
<textarea id="src" rows="4" spellcheck="false">M10 10 h5 v5 h-5 Z</textarea>
<div class="row">
  <button id="abs">转绝对</button>
  <button id="bbox" class="ghost">包围盒</button>
  <button id="simp" class="ghost">简化(1位)</button>
</div>
<div class="out" id="out">结果将显示在这里</div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>

function pathParse(d){
  if(!d) return [];
  var groups=d.match(/[MmLlHhVvCcSsQqTtAaZz][^MmLlHhVvCcSsQqTtAaZz]*/g);
  if(!groups) return [];
  var out=[];
  for(var i=0;i<groups.length;i++){
    var g=groups[i], c=g[0];
    var nums=(g.slice(1).match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi)||[]).map(Number);
    out.push({cmd:c, nums:nums});
  }
  return out;
}
function pathToAbsolute(d){
  var cmds=pathParse(d), cx=0, cy=0, sx=0, sy=0, out=[];
  for(var i=0;i<cmds.length;i++){
    var c=cmds[i].cmd, n=cmds[i].nums, res=[c.toUpperCase()];
    if('MmLl'.indexOf(c)>=0){ var x=n[0], y=n[1];
      if(c==='m'){ x+=cx; y+=cy; sx+=n[0]; sy+=n[1]; } else { sx=x; sy=y; }
      res.push(x,y); cx=x; cy=y;
    } else if('Hh'.indexOf(c)>=0){ var xh=n[0]; if(c==='h') xh+=cx; res.push(xh); cx=xh; }
    else if('Vv'.indexOf(c)>=0){ var yv=n[0]; if(c==='v') yv+=cy; res.push(yv); cy=yv; }
    else if('Cc'.indexOf(c)>=0){ var x1=n[0],y1=n[1],x2=n[2],y2=n[3],x=n[4],y=n[5];
      if(c==='c'){ x1+=cx;y1+=cy;x2+=cx;y2+=cy;x+=cx;y+=cy; } res.push(x1,y1,x2,y2,x,y); cx=x;cy=y;
    } else if('Ss'.indexOf(c)>=0){ var sx2=n[0],sy2=n[1],x=n[2],y=n[3];
      if(c==='s'){ sx2+=cx;sy2+=cy;x+=cx;y+=cy; } res.push(sx2,sy2,x,y); cx=x;cy=y;
    } else if('Zz'.indexOf(c)>=0){ res=['Z']; cx=sx;cy=sy; }
    else { res=res.concat(n); }
    out.push(res[0] + res.slice(1).join(' '));
  }
  return out.join(' ');
}
function pathBBox(d){
  var cmds=pathParse(d), cx=0, cy=0, pts=[];
  for(var i=0;i<cmds.length;i++){
    var c=cmds[i].cmd, n=cmds[i].nums;
    if('MmLl'.indexOf(c)>=0){ var x=n[0],y=n[1]; if(c==='m'||c==='l'){x+=cx;y+=cy;} cx=x;cy=y; pts.push([x,y]); }
    else if('Hh'.indexOf(c)>=0){ var xh=n[0]; if(c==='h')xh+=cx; cx=xh; pts.push([cx,cy]); }
    else if('Vv'.indexOf(c)>=0){ var yv=n[0]; if(c==='v')yv+=cy; cy=yv; pts.push([cx,cy]); }
    else if('Cc'.indexOf(c)>=0){ var x=n[4],y=n[5]; if(c==='c'){x+=cx;y+=cy;} cx=x;cy=y; pts.push([x,y]); }
  }
  if(!pts.length) return null;
  var minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  for(var j=0;j<pts.length;j++){ minx=Math.min(minx,pts[j][0]); miny=Math.min(miny,pts[j][1]); maxx=Math.max(maxx,pts[j][0]); maxy=Math.max(maxy,pts[j][1]); }
  return {minX:minx,minY:miny,maxX:maxx,maxY:maxy,width:maxx-minx,height:maxy-miny};
}
function pathSimplify(d, prec){
  prec=(prec==null?1:prec); var f=Math.pow(10,prec);
  var cmds=pathParse(d), out=[];
  for(var i=0;i<cmds.length;i++){ var c=cmds[i].cmd, n=cmds[i].nums, r=[c];
    for(var j=0;j<n.length;j++){ r.push(Math.round(n[j]*f)/f); }
    out.push(r[0] + r.slice(1).join(' '));
  }
  return out.join(' ');
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { pathParse:pathParse, pathToAbsolute:pathToAbsolute, pathBBox:pathBBox, pathSimplify:pathSimplify }; }
if (typeof window !== 'undefined') { window.SvgPathForgePure = { pathParse:pathParse, pathToAbsolute:pathToAbsolute, pathBBox:pathBBox, pathSimplify:pathSimplify }; }

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.SvgPathForgePure;
  $('abs').addEventListener('click', function(){ $('out').textContent=P.pathToAbsolute($('src').value); });
  $('bbox').addEventListener('click', function(){ var b=P.pathBBox($('src').value);
    if(!b){ $('out').textContent='无法解析'; return; }
    $('out').innerHTML='<div class="grid"><div class="kv"><b>minX</b><span>'+b.minX+'</span></div><div class="kv"><b>minY</b><span>'+b.minY+'</span></div><div class="kv"><b>maxX</b><span>'+b.maxX+'</span></div><div class="kv"><b>maxY</b><span>'+b.maxY+'</span></div><div class="kv"><b>宽</b><span>'+b.width+'</span></div><div class="kv"><b>高</b><span>'+b.height+'</span></div></div>';
  });
  $('simp').addEventListener('click', function(){ $('out').textContent=P.pathSimplify($('src').value,1); });
  $('abs').click();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
