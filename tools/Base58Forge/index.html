<script>
var B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function b58encode(bytes){
  if(!bytes.length) return '';
  var digits=[];
  for(var i=0;i<bytes.length;i++){
    var carry=bytes[i];
    for(var j=0;j<digits.length;j++){ carry += digits[j] << 8; digits[j]=carry % 58; carry=(carry-digits[j])/58; }
    while(carry>0){ digits.push(carry % 58); carry=(carry-carry%58)/58; }
  }
  var s='';
  for(var z=0; z<bytes.length && bytes[z]===0; z++) s+=B58[0];
  for(var k=digits.length-1;k>=0;k--) s+=B58[digits[k]];
  return s;
}
function b58decode(str){
  if(!str.length) return [];
  var bytes=[];
  for(var i=0;i<str.length;i++){
    var val=B58.indexOf(str[i]);
    if(val<0) throw new Error('INVALID_CHAR');
    var carry=val;
    for(var j=0;j<bytes.length;j++){ carry += bytes[j]*58; bytes[j]=carry & 0xFF; carry=carry>>8; }
    while(carry>0){ bytes.push(carry & 0xFF); carry=carry>>8; }
  }
  var out=[]; var zeros=0;
  for(var z=0; z<str.length && str[z]===B58[0]; z++) out.push(0);
  for(var k=bytes.length-1;k>=0;k--) out.push(bytes[k]);
  return out;
}
function utf8Bytes(str){ var b=[]; for(var i=0;i<str.length;i++){ var c=str.charCodeAt(i); if(c<0x80) b.push(c); else if(c<0x800){ b.push(0xC0|(c>>6), 0x80|(c&0x3F)); } else { b.push(0xE0|(c>>12), 0x80|((c>>6)&0x3F), 0x80|(c&0x3F)); } } return b; }
function bytesToUtf8(bytes){ var s='',i=0; while(i<bytes.length){ var c=bytes[i++]; if(c<0x80) s+=String.fromCharCode(c); else if(c<0xE0){ var c2=bytes[i++]; s+=String.fromCharCode(((c&0x1F)<<6)|(c2&0x3F)); } else { var c2=bytes[i++],c3=bytes[i++]; s+=String.fromCharCode(((c&0x0F)<<12)|((c2&0x3F)<<6)|(c3&0x3F)); } } return s; }
function b58encodeStr(str){ return b58encode(utf8Bytes(str)); }
function b58decodeStr(str){ return bytesToUtf8(b58decode(str)); }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { b58encode:b58encode, b58decode:b58decode, b58encodeStr:b58encodeStr, b58decodeStr:b58decodeStr, B58:B58 };
}
if (typeof window !== 'undefined') {
  window.Base58ForgePure = { b58encode:b58encode, b58decode:b58decode, b58encodeStr:b58encodeStr, b58decodeStr:b58decodeStr };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };

    $('enc').addEventListener('click', function(){ $('err').textContent=''; try { $('out').textContent=P.b58encodeStr($('in').value); } catch(e){ $('err').textContent=e.message; } });
    $('dec').addEventListener('click', function(){ $('err').textContent=''; try { $('out').textContent=P.b58decodeStr($('in').value); } catch(e){ $('err').textContent='解码失败：'+e.message; } });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('out').textContent='编码或解码 Base58'; });
  })();
}
</script>
