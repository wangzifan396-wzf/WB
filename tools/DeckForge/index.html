# DeckForge
## Markdown 一键变幻灯片

左边写 **Markdown**，右边实时预览幻灯片。

- 支持 `#` / `##` / `###` 标题
- 支持 `-` 无序列表 与 `1.` 有序列表
- 支持 **加粗**、*斜体*、`代码` 与 [链接](https://github.com/wangzifan396-wzf)
- 支持 `>` 引用 与 ![Markdown](https://upload.wikimedia.org/wikipedia/commons/thumb/4/48/Markdown-mark.svg/64px-Markdown-mark.svg.png)

用一行 `---` 分隔每一页。

---

## 代码块

```js
function greet(name){
  return `Hello, ${name}!`;
}
```

> 提示：按 `→` 翻页，`F` 全屏，空格下一页。

---

## 导出与分享

1. 点击「打印 / PDF」用浏览器导出 PDF
2. 点击「导出 HTML」得到单文件独立幻灯片
3. 完全离线，数据不出本机

**现在就开始制作你自己的幻灯片吧！**

  /* ===================== Pure functions (testable in Node) ===================== */
  function escapeHtml(s){
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // Only allow safe URL schemes (block javascript:, data: except images, etc.)
  function safeUrl(u){
    const t = String(u || '').trim().toLowerCase();
    if (/^javascript:/i.test(t)) return false;
    if (/^data:/.test(t) && !/^data:image\//i.test(t)) return false;
    if (/^vbscript:/i.test(t)) return false;
    return true;
  }

  // Split markdown into slides on lines that are exactly "---"
  function parseSlides(md){
    const text = String(md == null ? '' : md).replace(/\r\n/g, '\n');
    const lines = text.split('\n');
    const slides = [];
    let cur = [];
    for (const line of lines){
      if (/^---\s*$/.test(line)){ slides.push(cur.join('\n')); cur = []; }
      else cur.push(line);
    }
    slides.push(cur.join('\n'));
    let res = slides.map(s => s.trim());
    while (res.length > 1 && res[0] === '') res.shift();
    while (res.length > 1 && res[res.length - 1] === '') res.pop();
    return res;
  }

  function countSlides(md){ return parseSlides(md).length; }

  // Inline markdown -> HTML (text is escaped first, then formatted)
  function inlineMd(text){
    let s = escapeHtml(text);
    // images: ![alt](src)
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(m0, alt, src){
      if (!safeUrl(src)) return m0;
      return '<img src="' + src + '" alt="' + alt + '" />';
    });
    // links: [text](url)
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m0, txt, url){
      if (!safeUrl(url)) return m0;
      return '<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>';
    });
    // bold **text**
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    // italic *text*
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    // inline code `code`
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    return s;
  }

  // Render a single slide's markdown into an HTML fragment
  function renderSlide(md){
    const lines = String(md == null ? '' : md).replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    let para = [];
    function flushPara(){
      if (para.length){ html += '<p>' + inlineMd(para.join(' ')) + '</p>'; para = []; }
    }
    while (i < lines.length){
      const line = lines[i];
      // fenced code block
      if (/^```/.test(line)){
        flushPara();
        const buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
        i++; // skip closing fence
        html += '<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre>';
        continue;
      }
      // headings
      let m = line.match(/^(#{1,3})\s+(.*)$/);
      if (m){ flushPara(); const lvl = m[1].length; html += '<h' + lvl + '>' + inlineMd(m[2]) + '</h' + lvl + '>'; i++; continue; }
      // blockquote
      if (/^>\s?/.test(line)){
        flushPara();
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/, '')); i++; }
        html += '<blockquote>' + inlineMd(buf.join(' ')) + '</blockquote>';
        continue;
      }
      // unordered list
      if (/^[-*]\s+/.test(line)){
        flushPara();
        const items = [];
        while (i < lines.length && /^[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^[-*]\s+/, '')); i++; }
        html += '<ul>' + items.map(it => '<li>' + inlineMd(it) + '</li>').join('') + '</ul>';
        continue;
      }
      // ordered list
      if (/^\d+\.\s+/.test(line)){
        flushPara();
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i])){ items.push(lines[i].replace(/^\d+\.\s+/, '')); i++; }
        html += '<ol>' + items.map(it => '<li>' + inlineMd(it) + '</li>').join('') + '</ol>';
        continue;
      }
      // blank line
      if (/^\s*$/.test(line)){ flushPara(); i++; continue; }
      // paragraph text
      para.push(line); i++;
    }
    flushPara();
    return html;
  }

  function validateMd(md){
    const slides = parseSlides(md);
    const nonempty = slides.filter(s => s.trim() !== '').length;
    const ok = slides.length >= 1 && nonempty >= 1;
    return {
      ok: ok,
      slides: slides.length,
      note: ok ? ('OK · 共 ' + slides.length + ' 页') : '内容为空或没有有效幻灯片'
    };
  }

  // CSS used by the exported standalone deck
  const DECK_CSS = [
    ':root{--bg:#0A0A0B;--surface:#141417;--text:#FFFFFF;--text2:#A1A1AA;--accent:#5E6AD2;--border:rgba(255,255,255,.1)}',
    '*{box-sizing:border-box;margin:0}',
    'body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,"Microsoft YaHei",sans-serif;min-height:100vh}',
    '[data-theme=light]{--bg:#fff;--surface:#f7f7f8;--text:#18191c;--text2:#52525b;--border:rgba(0,0,0,.1)}',
    '.deck{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px}',
    '.slide{width:100%;max-width:960px;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:48px;overflow:auto}',
    '.slide .page{width:100%;font-size:22px;line-height:1.6}',
    '.slide h1{font-size:46px;margin:0 0 16px}',
    '.slide h2{font-size:34px;margin:0 0 14px}',
    '.slide h3{font-size:26px;margin:0 0 12px}',
    '.slide p{margin:0 0 12px}',
    '.slide ul,.slide ol{margin:8px 0 12px 28px;padding:0}',
    '.slide li{margin:6px 0}',
    '.slide blockquote{border-left:4px solid var(--accent);padding:8px 16px;color:var(--text2);margin:0 0 12px}',
    '.slide code{background:rgba(94,106,210,.15);padding:2px 6px;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:.9em}',
    '.slide pre{background:rgba(0,0,0,.3);padding:16px;border-radius:8px;overflow:auto;margin:0 0 12px}',
    '.slide pre code{background:none;padding:0}',
    '.slide a{color:var(--accent)}',
    '.slide img{max-width:100%;max-height:240px;border-radius:8px;margin:4px 0 12px}',
    '.bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 16px}',
    '.bar button{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer}',
    '.bar span{color:var(--text2);min-width:60px;text-align:center;font-family:ui-monospace,monospace}',
    '@media print{.bar{display:none}.deck{gap:0;padding:0}.slide{margin:0;border:none;border-radius:0;page-break-after:always;break-after:page;max-width:none}}'
  ].join('');

  // Minimal nav JS for the exported standalone deck (no closing script tag literal)
  const DECK_NAV = [
    "var i=0,s=document.querySelectorAll('.slide'),ct=document.getElementById('ct');",
    "function show(n){if(n<0)n=0;if(n>=s.length)n=s.length-1;i=n;for(var k=0;k<s.length;k++){s[k].style.display=(k===i)?'flex':'none';}ct.textContent=(i+1)+' / '+s.length;}",
    "document.getElementById('pv').onclick=function(){show(i-1);};",
    "document.getElementById('nx').onclick=function(){show(i+1);};",
    "document.getElementById('fs').onclick=function(){if(!document.fullscreenElement){(document.documentElement.requestFullscreen||function(){})();}else{document.exitFullscreen&&document.exitFullscreen();}};",
    "document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '){show(i+1);e.preventDefault();}else if(e.key==='ArrowLeft'){show(i-1);}else if(e.key==='Home'){show(0);}else if(e.key==='End'){show(s.length-1);}});",
    "show(0);"
  ].join('');

  // Build a full standalone HTML deck string for export
  function deckHtml(md, opts){
    opts = opts || {};
    const theme = opts.theme || 'dark';
    const title = opts.title || 'DeckForge 幻灯片';
    const slides = parseSlides(md);
    const body = slides.map(function(s){
      return '<section class="slide"><div class="page">' + renderSlide(s) + '</div></section>';
    }).join('\n');
    return '<!DOCTYPE html>\n' +
      '<html lang="zh" data-theme="' + theme + '">\n' +
      '<head>\n<meta charset="UTF-8">\n' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
      '<title>' + escapeHtml(title) + '</title>\n' +
      '<style>' + DECK_CSS + '</style>\n' +
      '</head>\n<body>\n' +
      '<div class="deck">' + body + '</div>\n' +
      '<div class="bar"><button id="pv">‹</button><span id="ct">1 / ' + slides.length + '</span><button id="nx">›</button><button id="fs">⛶</button></div>\n' +
      '<' + 'script>' + DECK_NAV + '<' + '/script>' +
      '\n</body>\n</html>';
  }

  if (typeof module !== 'undefined' && module.exports){
    module.exports = {
      escapeHtml, safeUrl, parseSlides, countSlides, inlineMd, renderSlide,
      validateMd, deckHtml, DECK_CSS, DECK_NAV
    };
  }

  /* ===================== Browser app ===================== */
  if (typeof window !== 'undefined'){
    const I18N = {
      zh: {
        subtitle:'· Markdown 幻灯片编辑器', new:'新建', prev:'上一张', next:'下一张',
        thumbs:'缩略图', navHint:'← → / 空格 翻页 · F 全屏', print:'打印 / PDF',
        exportHtml:'导出 HTML', editor:'Markdown 编辑器', sample:'载入模板',
        exported:'已导出独立 HTML', copied:'已复制', themeSwitched:'主题已切换',
        slideOf:'第 {n} 页'
      },
      en: {
        subtitle:'· Markdown Slide Editor', new:'New', prev:'Prev', next:'Next',
        thumbs:'Thumbs', navHint:'← → / Space to navigate · F fullscreen', print:'Print / PDF',
        exportHtml:'Export HTML', editor:'Markdown Editor', sample:'Load Template',
        exported:'Standalone HTML exported', copied:'Copied', themeSwitched:'Theme switched',
        slideOf:'Slide {n}'
      }
    };

    const $ = id => document.getElementById(id);
    let CURRENT = 0;
    let SLIDES = [];
    let LANG = (typeof __LS !== 'undefined' && __LS.getItem('deckforge.lang')) || 'zh';

    function t(key){ return (I18N[LANG] && I18N[LANG][key]) || (I18N.zh[key]) || key; }
    function applyLang(){
      document.documentElement.lang = (LANG === 'zh') ? 'zh' : 'en';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (I18N[LANG][k]) el.textContent = I18N[LANG][k];
      });
    }
    function toast(msg){
      const el = $('toast'); if (!el) return;
      el.textContent = msg; el.classList.add('show');
      clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2000);
    }
    function download(filename, content, mime){
      const blob = new Blob([content], { type: mime || 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function parseAndRender(){
      const md = $('md').value;
      SLIDES = parseSlides(md);
      if (CURRENT >= SLIDES.length) CURRENT = SLIDES.length - 1;
      if (CURRENT < 0) CURRENT = 0;
      renderCurrent();
      renderThumbs();
      renderPrint();
      updateCounter();
    }
    function renderCurrent(){
      const el = $('slidePage');
      el.innerHTML = SLIDES.length ? renderSlide(SLIDES[CURRENT]) : '';
    }
    function renderThumbs(){
      const box = $('thumbs');
      box.innerHTML = SLIDES.map((s, idx) => {
        const inner = SLIDES.length ? renderSlide(s) : '';
        return '<div class="thumb' + (idx === CURRENT ? ' active' : '') + '" data-i="' + idx + '">' +
          '<span class="badge">' + (idx + 1) + '</span>' +
          '<div class="inner">' + inner + '</div></div>';
      }).join('');
    }
    function renderPrint(){
      $('printRoot').innerHTML = SLIDES.map(s => '<div class="slide-page">' + renderSlide(s) + '</div>').join('');
    }
    function updateCounter(){
      $('counter').textContent = (SLIDES.length ? (CURRENT + 1) : 0) + ' / ' + SLIDES.length;
    }
    function go(n){
      CURRENT = Math.max(0, Math.min(SLIDES.length - 1, n));
      renderCurrent();
      renderThumbs();
      updateCounter();
    }
    function toggleFs(){
      const el = $('previewPane');
      if (!document.fullscreenElement){
        const fn = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fn) fn.call(el);
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyLang();
      // theme
      const savedTheme = (typeof __LS !== 'undefined') && __LS.getItem('deckforge.theme');
      if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
      // load starter
      if ($('starter')) $('md').value = $('starter').textContent;
      // events
      $('md').addEventListener('input', parseAndRender);
      $('newBtn').onclick = () => { if ($('starter')) $('md').value = $('starter').textContent; CURRENT = 0; parseAndRender(); };
      $('sampleBtn').onclick = () => { if ($('starter')) $('md').value = $('starter').textContent; CURRENT = 0; parseAndRender(); };
      $('prevBtn').onclick = () => go(CURRENT - 1);
      $('nextBtn').onclick = () => go(CURRENT + 1);
      $('pPrev').onclick = () => go(CURRENT - 1);
      $('pNext').onclick = () => go(CURRENT + 1);
      $('pFs').onclick = toggleFs;
      $('thumbsBtn').onclick = () => $('layout').classList.toggle('no-thumbs');
      $('printBtn').onclick = () => window.print();
      $('exportBtn').onclick = () => {
        const html = deckHtml($('md').value, {
          theme: document.documentElement.getAttribute('data-theme') || 'dark',
          title: 'DeckForge 幻灯片'
        });
        download('deckforge-deck.html', html, 'text/html');
        toast(t('exported'));
      };
      $('thumbs').onclick = e => {
        const tnode = e.target.closest('.thumb');
        if (tnode) go(parseInt(tnode.dataset.i, 10));
      };
      $('themeBtn').onclick = () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        if (typeof __LS !== 'undefined') __LS.setItem('deckforge.theme', next);
        toast(t('themeSwitched'));
      };
      $('langBtn').onclick = () => {
        LANG = LANG === 'zh' ? 'en' : 'zh';
        if (typeof __LS !== 'undefined') __LS.setItem('deckforge.lang', LANG);
        applyLang();
      };
      // keyboard nav (ignore while typing in the editor)
      document.addEventListener('keydown', e => {
        if (document.activeElement === $('md')) return;
        if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(CURRENT + 1); }
        else if (e.key === 'ArrowLeft'){ e.preventDefault(); go(CURRENT - 1); }
        else if (e.key === 'Home'){ e.preventDefault(); go(0); }
        else if (e.key === 'End'){ e.preventDefault(); go(SLIDES.length - 1); }
        else if (e.key === 'f' || e.key === 'F'){ e.preventDefault(); toggleFs(); }
      });
      parseAndRender();

      // PWA: register service worker (offline cache). Guarded for non-browser envs.
      if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator){
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    });
  }
  </script>
</body>
</html>
