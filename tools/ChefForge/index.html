<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;

*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}

#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){#nanoToast{transition:none}}

<body>
<div class="app">
  <h1>ChefForge</h1>
  <p class="sub">链式编解码：13 种操作自由组合成配方，逐步中间结果可见、香农熵实时计算 · 单文件 · 零依赖 · 本地优先</p>

<label>输入</label>

<script>

function cfB64Encode(s){
  var bytes=cfUtf8Bytes(s), tbl='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/', out='';
  for(var i=0;i<bytes.length;i+=3){
    var b0=bytes[i], b1=bytes[i+1], b2=bytes[i+2];
    out += tbl[b0>>2] + tbl[((b0&3)<<4)|((b1===undefined?0:b1)>>4)];
    out += (b1===undefined)?'=':tbl[((b1&15)<<2)|((b2===undefined?0:b2)>>6)];
    out += (b2===undefined)?'=':tbl[b2&63];
  }
  return out;
}
function cfB64Decode(s){
  var tbl='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  var clean=String(s).replace(/[\s]/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/=+$/,'');
  if(/[^A-Za-z0-9+/]/.test(clean)) return null;
  var bytes=[], buf=0, bits=0;
  for(var i=0;i<clean.length;i++){
    buf=(buf<<6)|tbl.indexOf(clean[i]); bits+=6;
    if(bits>=8){ bits-=8; bytes.push((buf>>bits)&255); }
  }
  return cfBytesUtf8(bytes);
}
function cfUtf8Bytes(s){
  var out=[];
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c<128) out.push(c);
    else if(c<2048){ out.push(192|(c>>6), 128|(c&63)); }
    else if(c>=55296 && c<56320 && i+1<s.length){
      var c2=s.charCodeAt(i+1), cp=65536+((c-55296)<<10)+(c2-56320); i++;
      out.push(240|(cp>>18), 128|((cp>>12)&63), 128|((cp>>6)&63), 128|(cp&63));
    } else { out.push(224|(c>>12), 128|((c>>6)&63), 128|(c&63)); }
  }
  return out;
}
function cfBytesUtf8(b){
  var out='', i=0;
  while(i<b.length){
    var c=b[i];
    if(c<128){ out+=String.fromCharCode(c); i++; }
    else if(c<224){ out+=String.fromCharCode(((c&31)<<6)|(b[i+1]&63)); i+=2; }
    else if(c<240){ out+=String.fromCharCode(((c&15)<<12)|((b[i+1]&63)<<6)|(b[i+2]&63)); i+=3; }
    else {
      var cp=((c&7)<<18)|((b[i+1]&63)<<12)|((b[i+2]&63)<<6)|(b[i+3]&63); cp-=65536;
      out+=String.fromCharCode(55296+(cp>>10), 56320+(cp&1023)); i+=4;
    }
  }
  return out;
}
function cfHexEncode(s){
  var b=cfUtf8Bytes(s), out=[];
  for(var i=0;i<b.length;i++) out.push(('0'+b[i].toString(16)).slice(-2));
  return out.join(' ');
}
function cfHexDecode(s){
  var clean=String(s).replace(/0x/gi,'').replace(/[\s,:]/g,'');
  if(clean.length%2) return null;
  if(/[^0-9a-fA-F]/.test(clean)) return null;
  var b=[];
  for(var i=0;i<clean.length;i+=2) b.push(parseInt(clean.substr(i,2),16));
  return cfBytesUtf8(b);
}
function cfRot(s, n){
  n=((n%26)+26)%26;
  return String(s).replace(/[a-zA-Z]/g, function(ch){
    var base = ch<='Z' ? 65 : 97;
    return String.fromCharCode((ch.charCodeAt(0)-base+n)%26+base);
  });
}
function cfUrlEncode(s){ return encodeURIComponent(String(s)); }
function cfUrlDecode(s){ try { return decodeURIComponent(String(s)); } catch(e){ return null; } }
function cfReverse(s){ return String(s).split('').reverse().join(''); }
function cfXor(s, key){
  if(!key) return s;
  var out='';
  for(var i=0;i<s.length;i++) out+=String.fromCharCode(s.charCodeAt(i)^key.charCodeAt(i%key.length));
  return out;
}
function cfEntropy(s){
  if(!s || !s.length) return 0;
  var freq={}, i;
  for(i=0;i<s.length;i++) freq[s[i]]=(freq[s[i]]||0)+1;
  var h=0;
  for(var k in freq){ var p=freq[k]/s.length; h -= p*Math.log(p)/Math.LN2; }
  return Math.round(h*1000)/1000;
}
var CF_OPS = {
  b64e:{label:'Base64 编码', fn:function(s){ return cfB64Encode(s); }},
  b64d:{label:'Base64 解码', fn:function(s){ return cfB64Decode(s); }},
  hexe:{label:'Hex 编码', fn:function(s){ return cfHexEncode(s); }},
  hexd:{label:'Hex 解码', fn:function(s){ return cfHexDecode(s); }},
  urle:{label:'URL 编码', fn:function(s){ return cfUrlEncode(s); }},
  urld:{label:'URL 解码', fn:function(s){ return cfUrlDecode(s); }},
  rot13:{label:'ROT13', fn:function(s){ return cfRot(s,13); }},
  rev:{label:'反转字符串', fn:function(s){ return cfReverse(s); }},
  upper:{label:'转大写', fn:function(s){ return String(s).toUpperCase(); }},
  lower:{label:'转小写', fn:function(s){ return String(s).toLowerCase(); }},
  trim:{label:'去除首尾空白', fn:function(s){ return String(s).trim(); }},
  strip:{label:'删除所有空白', fn:function(s){ return String(s).replace(/\s+/g,''); }},
  xor:{label:'XOR（需密钥）', fn:function(s,arg){ return cfXor(s,arg||''); }}
};
function cfRun(input, recipe){
  var cur=String(input==null?'':input), steps=[];
  if(!recipe || !recipe.length) return { error:null, output:cur, steps:[] };
  for(var i=0;i<recipe.length;i++){
    var st=recipe[i], op=CF_OPS[st.op];
    if(!op) return { error:'未知操作：'+st.op, output:null, steps:steps, failAt:i };
    var next;
    try { next = op.fn(cur, st.arg); } catch(e){ next = null; }
    if(next===null || next===undefined)
      return { error:'第 '+(i+1)+' 步「'+op.label+'」失败：输入格式不匹配', output:null, steps:steps, failAt:i };
    cur = next;
    steps.push({ op:st.op, label:op.label, out:cur, len:cur.length });
  }
  return { error:null, output:cur, steps:steps };
}
function cfParseRecipe(text){
  var lines=String(text||'').split(/\n+/), out=[];
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();
    if(!l || l.charAt(0)==='#') continue;
    var sp=l.indexOf(' '), op = sp<0 ? l : l.slice(0,sp), arg = sp<0 ? '' : l.slice(sp+1).trim();
    out.push({ op:op, arg:arg });
  }
  return out;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { cfB64Encode:cfB64Encode, cfB64Decode:cfB64Decode, cfHexEncode:cfHexEncode,
    cfHexDecode:cfHexDecode, cfRot:cfRot, cfUrlEncode:cfUrlEncode, cfUrlDecode:cfUrlDecode,
    cfReverse:cfReverse, cfXor:cfXor, cfEntropy:cfEntropy, cfRun:cfRun, cfParseRecipe:cfParseRecipe, CF_OPS:CF_OPS };
}
if (typeof window !== 'undefined') {
  window.ChefForgePure = { cfB64Encode:cfB64Encode, cfB64Decode:cfB64Decode, cfHexEncode:cfHexEncode,
    cfHexDecode:cfHexDecode, cfRot:cfRot, cfUrlEncode:cfUrlEncode, cfUrlDecode:cfUrlDecode,
    cfReverse:cfReverse, cfXor:cfXor, cfEntropy:cfEntropy, cfRun:cfRun, cfParseRecipe:cfParseRecipe, CF_OPS:CF_OPS };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.ChefForgePure;
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  var sel=$('add');
  for(var k in P.CF_OPS){
    var o=document.createElement('option'); o.value=k; o.textContent=P.CF_OPS[k].label; sel.appendChild(o);
  }
  sel.insertBefore(new Option('+ 追加操作',''), sel.firstChild);
  sel.value='';
  function run(){
    var recipe=P.cfParseRecipe($('recipe').value);
    var r=P.cfRun($('src').value, recipe);
    if(r.error){
      $('err').textContent=r.error; $('dst').value='';
      $('out').innerHTML='<div class="kv"><b>状态</b><span>失败于第 '+((r.failAt||0)+1)+' 步</span></div>';
      $('trace').innerHTML=''; return;
    }
    $('err').textContent='';
    $('dst').value=r.output;
    $('out').innerHTML='<div class="grid">'+
      '<div class="kv"><b>操作步数</b><span>'+r.steps.length+'</span></div>'+
      '<div class="kv"><b>输入长度</b><span>'+$('src').value.length+'</span></div>'+
      '<div class="kv"><b>输出长度</b><span>'+r.output.length+'</span></div>'+
      '<div class="kv"><b>香农熵</b><span>'+P.cfEntropy(r.output)+' bit/字符</span></div></div>';
    var t='';
    for(var i=0;i<r.steps.length;i++){
      var s=r.steps[i], prev=s.out.length>90 ? s.out.slice(0,90)+'…' : s.out;
      t+='<div class="kv"><b>'+(i+1)+'. '+esc(s.label)+'</b><span>'+esc(prev)+'</span></div>';
    }
    $('trace').innerHTML = t || '<div class="kv"><b>中间结果</b><span>配方为空，原样输出</span></div>';
  }
  $('run').addEventListener('click', run);
  $('clear').addEventListener('click', function(){ $('recipe').value=''; run(); });
  $('copy').addEventListener('click', function(){ if(navigator.clipboard) navigator.clipboard.writeText($('dst').value); });
  sel.addEventListener('change', function(){
    if(!sel.value) return;
    var v=$('recipe').value;
    $('recipe').value = (v && !/\n$/.test(v) ? v+'\n' : v) + sel.value + (sel.value==='xor' ? ' mykey' : '') + '\n';
    sel.value=''; run();
  });
  $('src').value='nano-tools \u94fe\u5f0f\u5904\u7406';
  $('recipe').value='# \u6bcf\u884c\u4e00\u4e2a\u64cd\u4f5c\nb64e\nrot13';
  run();
})();

</script>
