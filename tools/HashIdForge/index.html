<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.cards{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card b{color:var(--accent);font-size:15px}
.card .note{color:var(--muted);font-size:13px;margin-top:3px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}

footer{margin-top:20px;color:var(--dim);font-size:12px}

<body>
<div class="app">
  <h1>HashIdForge</h1>
  <p class="sub">哈希类型识别：根据长度、字符集与特征前缀判断 md5/sha 系列/bcrypt/argon2/ntlm 等 · 单文件 · 零依赖 · 本地优先</p>

  <label>哈希串</label>
  <textarea id="src" rows="3" spellcheck="false" placeholder="5d41402abc4b2a76b9719d911017c592"></textarea>
  <div class="row">
    <button id="run">识别</button>
    <button id="demo" class="ghost">示例</button>
    <button id="clear" class="ghost">清空</button>
  </div>
  <div class="err" id="err"></div>
  <div class="cards" id="out"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>
var HEX_RE=/^[0-9a-fA-F]+$/;
var B64_RE=/^[A-Za-z0-9+/]+={0,2}$/;
var HEXLEN={
  8:['crc32 (8 hex)','NT (LM/NTLM 半段 8 hex)'],
  32:['MD5 (32 hex)','NTLM (32 hex)','LM hash (32 hex)'],
  40:['SHA-1 (40 hex)','RIPEMD-160 (40 hex)'],
  48:['Tiger-192 (48 hex)','HAVAL-192 (48 hex)'],
  56:['SHA-224 (56 hex)','HAVAL-224 (56 hex)'],
  64:['SHA-256 (64 hex)','SHA3-256 (64 hex)','BLAKE2b-256 (64 hex)','Keccak-256 (64 hex)'],
  96:['SHA-384 (96 hex)','SHA3-384 (96 hex)'],
  128:['SHA-512 (128 hex)','SHA3-512 (128 hex)','BLAKE2b-512 (128 hex)','Whirlpool (128 hex)']
};
function hashIsHex(s){ return HEX_RE.test(s); }
function hashIsB64(s){ return s.length%4===0 && B64_RE.test(s); }
function hashIdentify(s){
  s=String(s||'').trim();
  if(!s) return { error:'空输入' };
  var out=[];
  if(/^\$2[aby]\$/.test(s)) out.push({type:'bcrypt',note:'$2a$/$2b$/$2y$ 前缀，60 字符，加盐可移植哈希'});
  else if(/^\$argon2/i.test(s)) out.push({type:'Argon2',note:'$argon2i/$argon2d/$argon2id 前缀，内存硬 KDF'});
  else if(/^\$P\$|\$H\$/.test(s)) out.push({type:'phpass (WordPress)',note:'$P$/$H$ 前缀，Portable PHP 哈希'});
  else if(/^\$1\$/.test(s)) out.push({type:'MD5-Crypt',note:'$1$ 前缀（Unix crypt）'});
  else if(/^\$5\$/.test(s)) out.push({type:'SHA-256-Crypt',note:'$5$ 前缀（Unix crypt）'});
  else if(/^\$6\$/.test(s)) out.push({type:'SHA-512-Crypt',note:'$6$ 前缀（Unix crypt）'});
  else if(/^\$7\$/.test(s)) out.push({type:'scrypt (draft)',note:'$7$ 前缀草案'});
  else if(/^\*[0-9A-F]{40}$/i.test(s)) out.push({type:'MySQL PASSWORD',note:'* + 40 hex'});
  else if(hashIsHex(s)){
    var L=s.length;
    if(HEXLEN[L]) for(var i=0;i<HEXLEN[L].length;i++) out.push({type:HEXLEN[L][i].split(' ')[0],note:HEXLEN[L][i]});
    else out.push({type:'未知十六进制',note:'长度 '+L+' 不符常见哈希'});
  } else if(hashIsB64(s)) {
    out.push({type:'可能 Base64',note:'非十六进制，'+s.length+' 字符 Base64，可能是二进制哈希编码或 JWT 体'});
  } else {
    out.push({type:'未知格式',note:'非十六进制且非标准 Base64'});
  }
  return { error:null, candidates:out };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { hashIsHex:hashIsHex, hashIsB64:hashIsB64, hashIdentify:hashIdentify, HEXLEN:HEXLEN };
}
if (typeof window !== 'undefined') {
  window.HashIdForgePure = { hashIsHex:hashIsHex, hashIsB64:hashIsB64, hashIdentify:hashIdentify, HEXLEN:HEXLEN };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.HashIdForgePure;
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    var DEMO='5d41402abc4b2a76b9719d911017c592';
    function run(){
      var r=P.hashIdentify($('src').value);
      if(r.error){ $('err').textContent=''; $('out').innerHTML=''; return; }
      $('err').textContent='';
      var html='';
      for(var i=0;i<r.candidates.length;i++){
        var c=r.candidates[i];
        html+='<div class="card"><b>'+esc(c.type)+'</b><div class="note">'+esc(c.note)+'</div></div>';
      }
      $('out').innerHTML=html;
    }
    $('run').addEventListener('click', run);
    $('demo').addEventListener('click', function(){ $('src').value=DEMO; run(); });
    $('clear').addEventListener('click', function(){ $('src').value=''; $('out').innerHTML=''; });
    $('src').value=DEMO; run();
  })();
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
