/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{

button{border-radius:var(--r-sm);letter-spacing:-.01em;

.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);

<div class="app">
  <h1>WfcForge</h1>
  <p class="sub">波函数坍缩（WFC）地形生成器：海/滩/草/林/山邻接约束，最小熵坍缩 + 约束传播，种子可复现，SVG 网格渲染，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <label style="margin:0">种子</label>
  <input id="seed" type="number" value="42" style="width:90px">
  <label style="margin:0">尺寸</label>
  <select id="size"><option value="12">12×12</option><option value="16" selected>16×16</option><option value="24">24×24</option></select>
  <button id="gen">生成地形</button>
  <button id="rand" class="ghost">随机种子</button>
  <span class="sub" id="stat" style="margin:0"></span>
</div>
<div id="out" style="border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;overflow:auto;min-height:200px;padding:8px;text-align:center"></div>
<script>
function wfcTiles(){
  return {
    names:['sea','sand','grass','forest','rock'],
    colors:{ sea:'#22D3EE', sand:'#F5A623', grass:'#10B981', forest:'#0B7A55', rock:'#71717A' },
    adj:{
      sea:['sea','sand'],
      sand:['sea','sand','grass'],
      grass:['sand','grass','forest'],
      forest:['grass','forest','rock'],
      rock:['forest','rock']
    }
  };
}
function wfcRng(seed){
  var t=seed>>>0;
  return function(){
    t += 0x6D2B79F5;
    var r=Math.imul(t ^ (t>>>15), 1|t);
    r = (r + Math.imul(r ^ (r>>>7), 61|r)) ^ r;
    return ((r ^ (r>>>14))>>>0)/4294967296;
  };
}
function wfcRun(w, h, seed){
  var T=wfcTiles(), rng=wfcRng(seed), N=T.names, i;
  var cells=[];
  for(i=0;i<w*h;i++) cells.push(N.slice());
  function propagate(idx){
    var stack=[idx];
    while(stack.length){
      var cur=stack.pop(), cx=cur%w, cy=Math.floor(cur/w);
      var allowed={};
      for(var a=0;a<cells[cur].length;a++){
        var opts=T.adj[cells[cur][a]];
        for(var b=0;b<opts.length;b++) allowed[opts[b]]=1;
      }
      var nbs=[];
      if(cx>0) nbs.push(cur-1);
      if(cx<w-1) nbs.push(cur+1);
      if(cy>0) nbs.push(cur-w);
      if(cy<h-1) nbs.push(cur+w);
      for(var k=0;k<nbs.length;k++){
        var nb=nbs[k], before=cells[nb].length;
        cells[nb]=cells[nb].filter(function(t){ return allowed[t]; });
        if(!cells[nb].length) return false;
        if(cells[nb].length<before) stack.push(nb);
      }
    }
    return true;
  }
  for(var step=0;step<w*h;step++){
    var best=-1, bestE=1e9;
    for(i=0;i<w*h;i++) if(cells[i].length>1 && cells[i].length<bestE){ bestE=cells[i].length; best=i; }
    if(best<0) break;
    var pick=cells[best][Math.floor(rng()*cells[best].length)];
    cells[best]=[pick];
    if(!propagate(best)) return { error:'坍缩矛盾（种子 '+seed+'）', grid:null };
  }
  var grid=[];
  for(var y=0;y<h;y++){
    var row=[];
    for(var x=0;x<w;x++) row.push(cells[y*w+x][0]);
    grid.push(row);
  }
  return { error:null, grid:grid };
}
function wfcValidate(grid){
  var T=wfcTiles(), h=grid.length, w=grid[0].length;
  function okPair(a,b){ return T.adj[a].indexOf(b)>=0; }
  for(var y=0;y<h;y++) for(var x=0;x<w;x++){
    if(x+1<w && !okPair(grid[y][x],grid[y][x+1])) return false;
    if(y+1<h && !okPair(grid[y][x],grid[y+1][x])) return false;
  }
  return true;
}
function wfcSvg(grid){
  var T=wfcTiles(), h=grid.length, w=grid[0].length, C=22;
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+(w*C)+'" height="'+(h*C)+'" viewBox="0 0 '+(w*C)+' '+(h*C)+'">';
  for(var y=0;y<h;y++) for(var x=0;x<w;x++)
    s+='<rect x="'+(x*C)+'" y="'+(y*C)+'" width="'+C+'" height="'+C+'" fill="'+T.colors[grid[y][x]]+'" stroke="#0A0A0B" stroke-width="1"/>';
  return s+'</svg>';
}
function wfcCounts(grid){
  var out={};
  for(var y=0;y<grid.length;y++) for(var x=0;x<grid[0].length;x++) out[grid[y][x]]=(out[grid[y][x]]||0)+1;
  return out;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { wfcTiles:wfcTiles, wfcRng:wfcRng, wfcRun:wfcRun, wfcValidate:wfcValidate, wfcSvg:wfcSvg, wfcCounts:wfcCounts };
}
if (typeof window !== 'undefined') {
  window.WfcForgePure = { wfcTiles:wfcTiles, wfcRng:wfcRng, wfcRun:wfcRun, wfcValidate:wfcValidate, wfcSvg:wfcSvg, wfcCounts:wfcCounts };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.WfcForgePure;
    function run(){
      var n=Number($('size').value), seed=Number($('seed').value)>>>0;
      var r=P.wfcRun(n, n, seed);
      if(r.error){ $('stat').textContent=r.error+'，请换种子'; $('out').innerHTML=''; return; }
      $('out').innerHTML=P.wfcSvg(r.grid);
      var c=P.wfcCounts(r.grid);
      $('stat').textContent='海 '+(c.sea||0)+' / 滩 '+(c.sand||0)+' / 草 '+(c.grass||0)+' / 林 '+(c.forest||0)+' / 山 '+(c.rock||0);
    }
    $('gen').addEventListener('click', run);
    $('rand').addEventListener('click', function(){ $('seed').value=Math.floor(Math.random()*100000); run(); });
    run();
  })();
}
</script>
