<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>AgentSchemaForge</h1>
  <p class="sub">Agent 工具 Schema：参数行速写生成 JSON Schema，支持 OpenAI/Anthropic/MCP 三种风格、lint 检查与调用参数校验、token 开销估算 · 单文件 · 零依赖 · 本地优先</p>

<label>工具名称</label>
<input type="text" id="name" value="search_docs">
<label>工具描述（模型据此决定何时调用）</label>
<input type="text" id="desc" value="在项目文档库中按关键词检索相关段落并返回摘要">
<label>参数定义（每行：名称 | 类型 | 描述 | 是否必填 | 枚举值逗号分隔）</label>
<textarea id="params" rows="5">query | string | 检索关键词 | yes
top_k | integer | 返回条数，默认 5 | no
scope | string | 检索范围 | no | all,code,docs</textarea>
<label>输出规范</label>
<select id="style">
  <option value="openai">OpenAI function calling</option>
  <option value="anthropic">Anthropic tool use</option>
  <option value="mcp">MCP tool definition</option>
</select>
<div class="row"><button id="gen">生成 Schema</button><button class="ghost" id="copy">复制</button></div>
<div class="err" id="err"></div>
<div class="out" id="out">Schema 将显示在这里</div>
<label>模拟一次调用参数（校验是否符合 schema）</label>
<textarea id="call" rows="3">{"query":"rag chunking","top_k":5,"scope":"docs"}</textarea>
<div class="row"><button id="check">校验调用</button></div>
<div class="out" id="callout">校验结果将显示在这里</div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>

var JSON_TYPES = ['string','number','integer','boolean','array','object'];
function parseParamLines(text){
  var out=[], lines=String(text||'').split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln || ln.charAt(0)==='#') continue;
    var parts=ln.split('|');
    var name=(parts[0]||'').trim();
    if(!name) continue;
    var type=(parts[1]||'string').trim().toLowerCase();
    var desc=(parts[2]||'').trim();
    var req=/^(y|yes|true|1|required)$/i.test((parts[3]||'').trim());
    var en=(parts[4]||'').trim();
    var p={name:name, type:type, description:desc, required:req};
    if(en) p['enum']=en.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    out.push(p);
  }
  return out;
}
function buildSchema(name, description, params, style){
  var props={}, required=[];
  for(var i=0;i<params.length;i++){
    var p=params[i];
    var s={type: JSON_TYPES.indexOf(p.type)>=0 ? p.type : 'string'};
    if(p.description) s.description=p.description;
    if(p['enum'] && p['enum'].length) s['enum']=p['enum'];
    if(s.type==='array') s.items={type:'string'};
    props[p.name]=s;
    if(p.required) required.push(p.name);
  }
  var parameters={type:'object', properties:props};
  if(required.length) parameters.required=required;
  parameters.additionalProperties=false;
  if(style==='anthropic'){
    return {name:name, description:description, input_schema:parameters};
  }
  if(style==='mcp'){
    return {name:name, description:description, inputSchema:parameters};
  }
  return {type:'function', 'function':{name:name, description:description, parameters:parameters}};
}
function lintSchema(name, description, params){
  var errs=[], warns=[];
  if(!name) errs.push('工具名不能为空');
  else if(!/^[a-zA-Z0-9_-]{1,64}$/.test(name)) errs.push('工具名须为 1-64 位字母/数字/下划线/连字符');
  if(!description) warns.push('缺少描述，模型难以判断何时调用该工具');
  else if(description.length<15) warns.push('描述过短（建议 >=15 字），模型选择准确率会下降');
  if(!params.length) warns.push('未定义参数，若工具确实无入参可忽略');
  var seen={};
  for(var i=0;i<params.length;i++){
    var p=params[i];
    if(seen[p.name]) errs.push('参数名重复：'+p.name);
    seen[p.name]=1;
    if(!/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(p.name)) errs.push('参数名非法：'+p.name);
    if(JSON_TYPES.indexOf(p.type)<0) errs.push('未知类型：'+p.type+'（'+p.name+'）');
    if(!p.description) warns.push('参数 '+p.name+' 缺少描述');
  }
  if(params.length>10) warns.push('参数过多（'+params.length+'），建议拆分为多个工具');
  return {valid: errs.length===0, errors:errs, warnings:warns};
}
function schemaTokenCost(schema){
  var s=JSON.stringify(schema);
  return {chars:s.length, approxTokens:Math.ceil(s.length/4)};
}
function validateCall(schema, argsObj){
  var params = schema && (schema.parameters || schema.input_schema || schema.inputSchema
              || (schema['function'] && schema['function'].parameters));
  if(!params) return {valid:false, errors:['无法从 schema 中定位参数定义']};
  var errs=[], props=params.properties||{}, req=params.required||[];
  for(var i=0;i<req.length;i++){
    if(!(req[i] in argsObj)) errs.push('缺少必填参数：'+req[i]);
  }
  for(var k in argsObj){
    if(!argsObj.hasOwnProperty(k)) continue;
    if(!props[k]){ errs.push('未声明的参数：'+k); continue; }
    var want=props[k].type, got=Array.isArray(argsObj[k])?'array':typeof argsObj[k];
    if(want==='integer'){ if(got!=='number' || argsObj[k]%1!==0) errs.push(k+' 应为 integer'); }
    else if(want==='number'){ if(got!=='number') errs.push(k+' 应为 number'); }
    else if(want && want!==got) errs.push(k+' 应为 '+want+'，实际 '+got);
    if(props[k]['enum'] && props[k]['enum'].indexOf(argsObj[k])<0) errs.push(k+' 不在枚举范围内');
  }
  return {valid: errs.length===0, errors:errs};
}
if (typeof module !== 'undefined' && module.exports) { module.exports = { parseParamLines:parseParamLines, buildSchema:buildSchema, lintSchema:lintSchema, schemaTokenCost:schemaTokenCost, validateCall:validateCall, JSON_TYPES:JSON_TYPES }; }
if (typeof window !== 'undefined') { window.AgentSchemaForgePure = { parseParamLines:parseParamLines, buildSchema:buildSchema, lintSchema:lintSchema, schemaTokenCost:schemaTokenCost, validateCall:validateCall, JSON_TYPES:JSON_TYPES }; }

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.AgentSchemaForgePure;
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var lastSchema=null;
  function gen(){
    var name=$('name').value.trim(), desc=$('desc').value.trim();
    var params=P.parseParamLines($('params').value);
    var lint=P.lintSchema(name, desc, params);
    $('err').textContent = lint.errors.join('；');
    var schema=P.buildSchema(name, desc, params, $('style').value);
    lastSchema=schema;
    var cost=P.schemaTokenCost(schema);
    var warn = lint.warnings.length
      ? '<div style="color:var(--muted);font-size:13px;margin-top:8px">⚠ '+lint.warnings.map(esc).join('<br>⚠ ')+'</div>' : '';
    $('out').innerHTML='<div class="grid">'
      +'<div class="kv"><b>参数数</b><span>'+params.length+'</span></div>'
      +'<div class="kv"><b>Schema 约 token</b><span>'+cost.approxTokens+'</span></div>'
      +'</div><pre style="margin:10px 0 0;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace">'
      + esc(JSON.stringify(schema,null,2)) + '</pre>' + warn;
    return schema;
  }
  function check(){
    var schema=lastSchema||gen();
    var target = schema['function'] ? schema['function'] : schema;
    var obj;
    try { obj=JSON.parse($('call').value); }
    catch(e){ $('callout').innerHTML='<span style="color:var(--warn)">JSON 解析失败：'+esc(e.message)+'</span>'; return; }
    var v=P.validateCall(target, obj);
    if(v.valid){ $('callout').innerHTML='<span style="color:var(--ok)">✓ 调用参数符合 schema</span>'; return; }
    $('callout').innerHTML=v.errors.map(function(e){
      return '<div style="color:var(--warn);font-size:13px">✗ '+esc(e)+'</div>'; }).join('');
  }
  $('gen').addEventListener('click', gen);
  $('check').addEventListener('click', check);
  $('style').addEventListener('change', gen);
  ['name','desc','params'].forEach(function(id){ $(id).addEventListener('input', gen); });
  $('copy').addEventListener('click', function(){
    if(navigator.clipboard && lastSchema) navigator.clipboard.writeText(JSON.stringify(lastSchema,null,2));
  });
  gen(); check();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
