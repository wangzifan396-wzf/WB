:root{

*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;

.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}

button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}

/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<body>
<div class="app">
  <h1>ClothForge</h1>
  <p class="sub">布料模拟：Verlet 积分 + 距离约束，顶部钉住，重力下垂，可拖拽扰动，实时观察弹性形变，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <button id="reset">重置</button>
  <button id="pause" class="ghost">暂停/继续</button>
  <label style="flex:1;">重力 <input id="g" type="range" min="0" max="0.6" step="0.02" value="0.25"></label>
</div>
<div class="err" id="err"></div>
<canvas id="cv" width="480" height="360" style="width:100%;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;cursor:grab;"></canvas>
<script>
function clInit(cols, rows, spacing, ox, oy){
  var pts=[]; 
  for(var y=0;y<rows;y++){ for(var x=0;x<cols;x++){ var px=ox+x*spacing, py=oy+y*spacing; pts.push({x:px,y:py,px:px,py:py,pin:(y===0 && x%2===0)}); } }
  var cons=[];
  for(var y=0;y<rows;y++){ for(var x=0;x<cols;x++){ var i=y*cols+x; if(x<cols-1) cons.push([i, y*cols+x+1]); if(y<rows-1) cons.push([i, (y+1)*cols+x]); } }
  return {cols:cols, rows:rows, spacing:spacing, pts:pts, cons:cons};
}
function clStep(s, gravity, drag, iterations){
  var pts=s.pts.map(function(p){ return {x:p.x,y:p.y,px:p.px,py:p.py,pin:p.pin}; });
  var i;
  for(i=0;i<pts.length;i++){ var p=pts[i]; if(p.pin) continue; var vx=(p.x-p.px)*drag, vy=(p.y-p.py)*drag; p.px=p.x; p.py=p.y; p.x+=vx; p.y+=vy+gravity; }
  for(var k=0;k<iterations;k++){
    for(var c=0;c<s.cons.length;c++){ var a=s.cons[c][0], b=s.cons[c][1]; var pa=pts[a], pb=pts[b]; var dx=pb.x-pa.x, dy=pb.y-pa.y; var d=Math.sqrt(dx*dx+dy*dy)||0.0001; var diff=(d-s.spacing)/d*0.5; var ox=dx*diff, oy=dy*diff; if(!pa.pin){ pa.x+=ox; pa.y+=oy; } if(!pb.pin){ pb.x-=ox; pb.y-=oy; } }
  }
  return {cols:s.cols, rows:s.rows, spacing:s.spacing, pts:pts, cons:s.cons};
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { clInit:clInit, clStep:clStep };
}
if (typeof window !== 'undefined') {
  window.ClothForgePure = { clInit:clInit, clStep:clStep };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.ClothForgePure;
    var W=480, H=360, state=null, paused=false, dragIdx=-1;
    function reset(){ state=P.clInit(22, 16, 18, 60, 30); }
    function frame(){
      if(!paused && state){
        state=P.clStep(state, Number($('g').value)||0.25, 0.99, 3);
        draw();
      }
      if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
    }
    function draw(){
      var cv=$('cv'); var ctx=cv.getContext('2d'); if(!ctx) return;
      ctx.fillStyle='#0A0A0B'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(34,211,238,.7)'; ctx.lineWidth=1;
      for(var c=0;c<state.cons.length;c++){ var a=state.cons[c][0], b=state.cons[c][1]; var pa=state.pts[a], pb=state.pts[b]; ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke(); }
      for(var i=0;i<state.pts.length;i++){ var p=state.pts[i]; ctx.fillStyle=p.pin?'#F5A623':'#A1A1AA'; ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill(); }
    }
    function pick(x,y){ var best=-1, bd=1e9; for(var i=0;i<state.pts.length;i++){ var dx=state.pts[i].x-x, dy=state.pts[i].y-y, d=dx*dx+dy*dy; if(d<bd){bd=d;best=i;} } return bd<200?best:-1; }
    $('reset').addEventListener('click', reset);
    $('pause').addEventListener('click', function(){ paused=!paused; });
    $('cv').addEventListener('mousedown', function(e){ var r=$('cv').getBoundingClientRect(); dragIdx=pick((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H); });
    $('cv').addEventListener('mousemove', function(e){ if(dragIdx<0) return; var r=$('cv').getBoundingClientRect(); var x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H; state.pts[dragIdx].x=x; state.pts[dragIdx].y=y; state.pts[dragIdx].px=x; state.pts[dragIdx].py=y; });
    window.addEventListener('mouseup', function(){ dragIdx=-1; });
    reset(); frame();
  })();
}
</script>
