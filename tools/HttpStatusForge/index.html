<body>
<div class="app">
  <h1>HttpStatusForge</h1>
  <p class="sub">HTTP 状态码速查：语义说明、5 大分类、可重试 / 可缓存决策、关键词检索 · 单文件 · 零依赖 · 本地优先</p>

<label>状态码或关键词（如 404 / gateway / 限流）</label>
<input type="text" id="q" value="429">
<div class="row">
  <button id="run">查询</button>
  <button id="all" class="ghost">列出全部</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>

  <div class="badges">

</div>
<script>

var HS_DATA = {
  100:['Continue','\u5ba2\u6237\u7aef\u5e94\u7ee7\u7eed\u53d1\u9001\u8bf7\u6c42\u4f53'],
  101:['Switching Protocols','\u534f\u8bae\u5347\u7ea7\uff08\u5982 WebSocket\uff09'],
  200:['OK','\u8bf7\u6c42\u6210\u529f'],
  201:['Created','\u8d44\u6e90\u5df2\u521b\u5efa\uff0c\u5e94\u8fd4\u56de Location'],
  202:['Accepted','\u5df2\u63a5\u53d7\uff0c\u5f02\u6b65\u5904\u7406\u4e2d'],
  204:['No Content','\u6210\u529f\u4f46\u65e0\u54cd\u5e94\u4f53'],
  206:['Partial Content','\u8303\u56f4\u8bf7\u6c42\u6210\u529f\uff08\u65ad\u70b9\u7eed\u4f20\uff09'],
  301:['Moved Permanently','\u6c38\u4e45\u91cd\u5b9a\u5411\uff0cSEO \u4f20\u9012\u6743\u91cd'],
  302:['Found','\u4e34\u65f6\u91cd\u5b9a\u5411\uff0c\u53ef\u80fd\u53d8\u66f4\u65b9\u6cd5'],
  303:['See Other','\u91cd\u5b9a\u5411\u5230 GET\uff0cPOST-Redirect-GET'],
  304:['Not Modified','\u534f\u5546\u7f13\u5b58\u547d\u4e2d\uff0c\u4f7f\u7528\u672c\u5730\u526f\u672c'],
  307:['Temporary Redirect','\u4e34\u65f6\u91cd\u5b9a\u5411\u4e14\u4fdd\u6301\u65b9\u6cd5'],
  308:['Permanent Redirect','\u6c38\u4e45\u91cd\u5b9a\u5411\u4e14\u4fdd\u6301\u65b9\u6cd5'],
  400:['Bad Request','\u8bf7\u6c42\u8bed\u6cd5/\u53c2\u6570\u9519\u8bef'],
  401:['Unauthorized','\u672a\u8ba4\u8bc1\uff0c\u5e94\u5e26 WWW-Authenticate'],
  403:['Forbidden','\u5df2\u8ba4\u8bc1\u4f46\u65e0\u6743\u9650'],
  404:['Not Found','\u8d44\u6e90\u4e0d\u5b58\u5728'],
  405:['Method Not Allowed','\u65b9\u6cd5\u4e0d\u5141\u8bb8\uff0c\u5e94\u5e26 Allow'],
  409:['Conflict','\u72b6\u6001\u51b2\u7a81\uff08\u5e76\u53d1\u5199/\u552f\u4e00\u7ea6\u675f\uff09'],
  410:['Gone','\u8d44\u6e90\u5df2\u6c38\u4e45\u5220\u9664'],
  413:['Payload Too Large','\u8bf7\u6c42\u4f53\u8fc7\u5927'],
  415:['Unsupported Media Type','Content-Type \u4e0d\u652f\u6301'],
  418:['I am a teapot','\u5f69\u86cb\u72b6\u6001\u7801\uff08RFC 2324\uff09'],
  422:['Unprocessable Content','\u8bed\u6cd5\u6b63\u786e\u4f46\u8bed\u4e49\u6821\u9a8c\u5931\u8d25'],
  429:['Too Many Requests','\u9650\u6d41\uff0c\u5e94\u5e26 Retry-After'],
  500:['Internal Server Error','\u670d\u52a1\u7aef\u672a\u6355\u83b7\u5f02\u5e38'],
  501:['Not Implemented','\u670d\u52a1\u7aef\u4e0d\u652f\u6301\u8be5\u529f\u80fd'],
  502:['Bad Gateway','\u7f51\u5173\u4ece\u4e0a\u6e38\u6536\u5230\u65e0\u6548\u54cd\u5e94'],
  503:['Service Unavailable','\u670d\u52a1\u4e0d\u53ef\u7528\uff08\u8fc7\u8f7d/\u7ef4\u62a4\uff09'],
  504:['Gateway Timeout','\u7f51\u5173\u7b49\u5f85\u4e0a\u6e38\u8d85\u65f6']
};
function hsClass(code){
  var c=Number(code);
  if(!(c>=100 && c<=599)) return null;
  return [null,'1xx \u4fe1\u606f','2xx \u6210\u529f','3xx \u91cd\u5b9a\u5411','4xx \u5ba2\u6237\u7aef\u9519\u8bef','5xx \u670d\u52a1\u7aef\u9519\u8bef'][Math.floor(c/100)];
}
function hsLookup(code){
  var c=Number(code);
  var cls=hsClass(c);
  if(!cls) return { error:'\u8bf7\u8f93\u5165 100\u2013599 \u7684\u72b6\u6001\u7801' };
  var d=HS_DATA[c];
  return { error:null, code:c, cls:cls, name:d?d[0]:'Unassigned', desc:d?d[1]:'\u672a\u5206\u914d\u6216\u81ea\u5b9a\u4e49\u72b6\u6001\u7801',
           known:!!d, retriable:hsRetriable(c), cacheable:hsCacheable(c) };
}
function hsRetriable(code){
  var c=Number(code);
  return c===408 || c===429 || c===500 || c===502 || c===503 || c===504;
}
function hsCacheable(code){
  var c=Number(code);
  return c===200 || c===203 || c===204 || c===206 || c===300 || c===301 || c===308 || c===404 || c===410;
}
function hsSearch(q){
  var s=String(q||'').trim().toLowerCase(), out=[];
  for(var k in HS_DATA){
    if(!s || k.indexOf(s)===0 || HS_DATA[k][0].toLowerCase().indexOf(s)>=0 || HS_DATA[k][1].indexOf(s)>=0)
      out.push(hsLookup(k));
  }
  return out.sort(function(a,b){ return a.code-b.code; });
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { hsClass:hsClass, hsLookup:hsLookup, hsRetriable:hsRetriable, hsCacheable:hsCacheable, hsSearch:hsSearch, HS_DATA:HS_DATA };
}
if (typeof window !== 'undefined') {
  window.HttpStatusForgePure = { hsClass:hsClass, hsLookup:hsLookup, hsRetriable:hsRetriable, hsCacheable:hsCacheable, hsSearch:hsSearch, HS_DATA:HS_DATA };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.HttpStatusForgePure;
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function card(r){
    return '<div class="kv"><b>'+r.code+' '+esc(r.name)+'</b><span>'+esc(r.cls)+'</span></div>'+
           '<div class="kv"><b>说明</b><span>'+esc(r.desc)+'</span></div>'+
           '<div class="kv"><b>可重试</b><span>'+(r.retriable?'是（配合退避）':'否')+'</span></div>'+
           '<div class="kv"><b>默认可缓存</b><span>'+(r.cacheable?'是':'否')+'</span></div>';
  }
  function run(){
    var q=$('q').value.trim();
    if(/^\d+$/.test(q)){
      var r=P.hsLookup(q);
      if(r.error){ $('err').textContent=r.error; $('out').innerHTML=''; return; }
      $('err').textContent = r.known ? '' : '该状态码未在内置表中登记';
      $('out').innerHTML=card(r); return;
    }
    var list=P.hsSearch(q);
    $('err').textContent = list.length ? '' : '未找到匹配项';
    $('out').innerHTML = list.map(function(r){
      return '<div class="kv"><b>'+r.code+' '+esc(r.name)+'</b><span>'+esc(r.desc)+'</span></div>';
    }).join('');
  }
  $('run').addEventListener('click', run);
  $('all').addEventListener('click', function(){ $('q').value=''; run(); });
  $('q').addEventListener('keydown', function(e){ if(e.key==='Enter') run(); });
  run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
