<html lang="zh-CN">

<title>SolitaireForge — 空当接龙（Klondike）：经典纸牌，把四色 A→K 收进基础堆</title>
<meta property="og:title" content="SolitaireForge">
<meta property="og:description" content="空当接龙（Klondike 纸牌）：七列牌堆中把牌按“异色 + 点数递减”叠放，把四种花色的 A 到 K 依次收进上方的四个基础堆。支持重新发牌、自动收牌、撤销，纯前端离线可玩。">
<meta property="og:image" content="./og.png">
<meta name="description" content="空当接龙（Klondike 纸牌）：七列牌堆中把牌按“异色 + 点数递减”叠放，把四种花色的 A 到 K 依次收进上方的四个基础堆。支持重新发牌、自动收牌、撤销，纯前端离线可玩。 · 单文件 · 零依赖 · 本地优先">

<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE; --bad:#EF4444;
  /* Ardot 令牌：大圆角阶梯 + 扩散有色阴影 + 内层 hairline */
  --r-lg:20px; --r-md:14px; --r-sm:10px; --r-xs:8px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh;
     -webkit-font-smoothing:antialiased}
.app{width:100%;max-width:820px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;
     box-shadow:var(--hair),var(--lift),var(--glow)}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-.02em;font-weight:650}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
     color:var(--fg);padding:10px 12px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
     box-shadow:inset 0 1px 2px rgba(0,0,0,.25);transition:border-color .16s ease,box-shadow .16s ease}
textarea{resize:vertical}
textarea:hover,input:hover,select:hover{border-color:var(--line2)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);
     box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:var(--r-sm);padding:10px 16px;cursor:pointer;font-size:14px;
       letter-spacing:-.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
       transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{filter:brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;box-shadow:none}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none}
button.ghost:hover{border-color:var(--line2);color:var(--fg);filter:none;background:rgba(255,255,255,.03);box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;
     box-shadow:inset 0 1px 3px rgba(0,0,0,.35);
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:40px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.sec{font-size:14px;color:var(--muted);font-weight:600;margin:18px 0 8px;letter-spacing:-.01em}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
/* 分段控件 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:6px;box-shadow:var(--hair)}
.seg button{background:transparent;border:0;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:13px;border-radius:0;
            box-shadow:none;transition:background .15s ease,color .15s ease}
.seg button:hover{background:rgba(255,255,255,.04);color:var(--fg);filter:none;box-shadow:none}
.seg button+button{border-left:1px solid var(--line)}
.seg button.active{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
/* Bento 瓦片（非对称网格，避 3 等宽卡） */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.bento.span2 .tile{grid-column:1/-1}
.bento.c3{grid-template-columns:2fr 1fr}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;
      box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.tile:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.tile h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:-.01em}
.tile .big{font:20px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);word-break:break-all}
.tile .sub2{color:var(--dim);font-size:12px;margin-top:4px}
/* 状态色 */
.state.ok{color:var(--ok)} .state.warn{color:var(--warn)} .state.bad{color:var(--bad)}
/* 徽章 */
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.badge.tag{color:var(--muted);background:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#langBtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 13px;font-size:12px;cursor:pointer;flex:0 0 auto;box-shadow:none}
#langBtn:hover{border-color:var(--line2);color:var(--fg);background:rgba(255,255,255,.03);box-shadow:none;filter:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#nanoToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--surface);color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;max-width:80vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#nanoToast.bad{border-color:rgba(239,68,68,.55)}
@media (max-width:760px){.grid{grid-template-columns:1fr}.bento{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <div>
      <h1>SolitaireForge</h1>
      <p class="sub" data-i18n="sub">空当接龙 · 单文件 · 零依赖 · 本地优先</p>
    </div>
    <button id="langBtn" type="button" aria-label="Switch language">EN</button>
  </div>

<div class="sec">空当接龙（Klondike）：把 4 种花色的 A→K 全部收进上方基础堆</div>
<div class="row"><button id="deal">重新发牌</button><button id="auto" class="ghost">自动收牌</button><button id="undo" class="ghost">撤销</button></div>
<div id="top" style="display:flex;gap:8px;align-items:flex-start;margin-top:12px"></div>
<div id="tableau" style="display:flex;gap:8px;margin-top:12px"></div>
<div class="err" id="err"></div>
<div class="out" id="status" aria-live="polite" style="margin-top:8px">点牌堆顶/废牌选牌，点目标列或基础堆落子</div>

  <div class="badges">
    <span class="badge" data-i18n="b1">零依赖</span>
    <span class="badge" data-i18n="b2">离线可用</span>
    <span class="badge" data-i18n="b3">数据不出本机</span>
    <span class="badge flag" data-i18n="b4">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>

var SL_SUITS=['s','h','d','c'];
function slLabel(r){ return r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r); }
function slNewDeck(){ var d=[]; SL_SUITS.forEach(function(s){ for(var r=1;r<=13;r++) d.push({r:r,s:s,f:false}); }); return d; }
function slShuffle(d,seed){ var a=d.slice(),s=seed||1; function rnd(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;} for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function slDeal(seed){ var d=slShuffle(slNewDeck(),seed); var st={tableau:[[],[],[],[],[],[],[]], stock:[], waste:[], foundations:{s:0,h:0,d:0,c:0} }; var k=0; for(var pile=0;pile<7;pile++){ for(var n=0;n<=pile;n++){ var card=d[k++]; card.f=(n===pile); st.tableau[pile].push(card); } } while(k<52) st.stock.push(d[k++]); return st; }
function slColor(s){ return (s==='h'||s==='d')?'red':'black'; }
function slFoundationOk(card, fobj){ if(fobj[card.s]===0) return card.r===1; return card.r===fobj[card.s]+1; }
function slStackOk(moving, target){ if(!target.f) return false; return slColor(moving.s)!==slColor(target.s) && target.r===moving.r+1; }
function slTop(pile){ return pile.length?pile[pile.length-1]:null; }
var EXPORTS={slNewDeck:slNewDeck,slShuffle:slShuffle,slDeal:slDeal,slColor:slColor,slFoundationOk:slFoundationOk,slStackOk:slStackOk,slTop:slTop,slLabel:slLabel};


if (typeof module !== 'undefined' && module.exports) { module.exports = EXPORTS; }
if (typeof window !== 'undefined') { window.SolitaireForgePure = EXPORTS; }

</script>
<script>

if (typeof window !== 'undefined') { (function(){
  var $=function(id){return document.getElementById(id);};
  var P=window.SolitaireForgePure;
  var st=P.slDeal((Math.random()*1e9)|0), history=[], sel=null;
  function cardFace(card){ var sym={s:'♠',h:'♥',d:'♦',c:'♣'}[card.s]; var col=slColor(card.s)==='red'?'#ef4444':'#0A0A0B'; var label=P.slLabel(card.r); return {sym:sym,col:col,label:label}; }
  function slColor(s){ return (s==='h'||s==='d')?'red':'black'; }
  function snapshot(){ return JSON.stringify({t:st.tableau,s:st.stock,w:st.waste,f:st.foundations}); }
  function pushHist(){ history.push(snapshot()); if(history.length>50) history.shift(); }
  function render(){
    var top=$('top'); top.innerHTML='';
    SL_SUITS.forEach(function(s){ var slot=document.createElement('div'); slot.style.cssText='width:46px;height:64px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px'; var v=st.foundations[s]; if(v){ var fc={s:s,r:v}; var f=cardFace(fc); slot.textContent=f.label+f.sym; slot.style.color=f.col; } slot.addEventListener('click',function(){ tryMove({type:'foundation',suit:s}); }); top.appendChild(slot); });
    var stock=document.createElement('div'); stock.style.cssText='width:46px;height:64px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px'; stock.textContent=st.stock.length?('▼ '+st.stock.length):'↻'; stock.addEventListener('click',draw); top.appendChild(stock);
    var waste=document.createElement('div'); waste.style.cssText='width:46px;height:64px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer'; if(st.waste.length){ var wc=st.waste[st.waste.length-1]; var wf=cardFace(wc); waste.innerHTML='<span style="color:'+wf.col+';font-size:20px">'+wf.label+wf.sym+'</span>'; waste.addEventListener('click',function(){ tryMove({type:'waste'}); }); } top.appendChild(waste);
    var tab=$('tableau'); tab.innerHTML='';
    st.tableau.forEach(function(pile,pi){ var col=document.createElement('div'); col.style.cssText='display:flex;flex-direction:column;cursor:pointer'; col.addEventListener('click',function(){ tryMove({type:'tableau',pile:pi}); });
      if(!pile.length){ var ph=document.createElement('div'); ph.style.cssText='width:46px;height:64px;border-radius:8px;border:1px dashed var(--line)'; col.appendChild(ph); }
      pile.forEach(function(card,ci){ var f=cardFace(card); var d=document.createElement('div'); d.style.cssText='width:46px;height:64px;border-radius:8px;border:1px solid var(--line);margin-top:'+(ci===0?0:-38)+'px;background:'+(card.f?'#fff':'#475569')+';display:flex;align-items:center;justify-content:center;font-size:20px'; if(card.f){ d.innerHTML='<span style="color:'+f.col+'">'+f.label+f.sym+'</span>'; d.addEventListener('click',function(e){ e.stopPropagation(); selectCard({type:'tableau',pile:pi,idx:ci}); }); } col.appendChild(d); }); tab.appendChild(col); });
    var won=SL_SUITS.every(function(s){return st.foundations[s]===13;}); if(won) $('status').textContent='🎉 全部收完，你赢了！';
  }
  function selectCard(ref){ if(ref.type==='waste'){ var c=st.waste[st.waste.length-1]; if(!c) return; sel={card:c, from:{type:'waste'}}; } else { var c2=st.tableau[ref.pile][ref.idx]; if(!c2||!c2.f) return; sel={card:c2, from:{type:'tableau',pile:ref.pile,idx:ref.idx}}; } $('status').textContent='已选 '+P.slLabel(sel.card.r)+'，点目标列或基础堆'; render(); }
  function draw(){ pushHist(); if(!st.stock.length){ if(!st.waste.length) return; st.stock=st.waste.reverse(); st.waste=[]; } else { st.waste.push(st.stock.pop()); } sel=null; render(); }
  function tryMove(ref){ if(!sel) return; var card=sel.card;
    if(ref.type==='foundation'){ if(!P.slFoundationOk(card, st.foundations)){ $('err').textContent='该牌不能进此基础堆'; return; } }
    else if(ref.type==='tableau'){ var pile=st.tableau[ref.pile]; var topc=P.slTop(pile); if(topc){ if(!P.slStackOk(card, topc)){ $('err').textContent='必须按 异色+递减 叠放'; return; } } else { if(card.r!==13){ $('err').textContent='空列只能放 K'; return; } } }
    pushHist(); applyMove(ref); sel=null; render(); }
  function applyMove(ref){ var card=sel.card; if(sel.from.type==='waste'){ st.waste.pop(); } else { var pile=st.tableau[sel.from.pile]; pile.splice(sel.from.idx,1); }
    if(ref.type==='foundation'){ st.foundations[card.s]=card.r; }
    else { st.tableau[ref.pile].push(card); } }
  function autoMove(){ var moved=false; function tryOne(card,from){ // try foundations then tableau
      SL_SUITS.forEach(function(s){ if(P.slFoundationOk(card,st.foundations)){ pushHist(); if(from.type==='waste')st.waste.pop(); else st.tableau[from.pile].splice(from.idx,1); st.foundations[s]=card.r; moved=true; return true; } }); return false; }
    // attempt waste + tableau tops
    var attempts=[]; if(st.waste.length) attempts.push({card:st.waste[st.waste.length-1],from:{type:'waste'}}); st.tableau.forEach(function(p,i){ var t=P.slTop(p); if(t) attempts.push({card:t,from:{type:'tableau',pile:i,idx:p.length-1}}); });
    for(var k=0;k<attempts.length;k++){ if(tryOne(attempts[k].card,attempts[k].from)){ render(); return autoMove(); } }
    if(!moved) $('status').textContent='没有可自动收的牌'; }
  $('deal').addEventListener('click',function(){ st=P.slDeal((Math.random()*1e9)|0); history=[]; sel=null; $('status').textContent='重新发牌'; render(); });
  $('auto').addEventListener('click',autoMove);
  $('undo').addEventListener('click',function(){ if(history.length){ var h=history.pop(); var o=JSON.parse(h); st.tableau=o.t; st.stock=o.s; st.waste=o.w; st.foundations=o.f; sel=null; render(); } });
  render();
})(); }

</script>

<script>

function show(m,bad){el.textContent=m;el.className='on'+(bad?' bad':'');clearTimeout(t);t=setTimeout(function(){el.className='';},1700);}

(function(){
  function cur(){try{return localStorage.getItem('nano-lang')==='en'?'en':'zh';}catch(e){return 'zh';}}

    var ns=document.querySelectorAll('[data-i18n]');
    for(var i=0;i<ns.length;i++){var k=ns[i].getAttribute('data-i18n');if(d[k]!=null)ns[i].textContent=d[k];}
    var ps=document.querySelectorAll('[data-i18n-ph]');

    var b=document.getElementById('langBtn'); if(b) b.textContent=(l==='en'?'中文':'EN');
    if(d.title) document.title=d.title;
  }
  window.nanoT=function(k){var d=dict();return d[k]!=null?d[k]:k;};
  window.nanoApplyI18n=apply;
  var b=document.getElementById('langBtn');
  if(b) b.addEventListener('click', function(){
    try{localStorage.setItem('nano-lang', cur()==='en'?'zh':'en');}catch(e){}
    apply(); if(window.nanoRerender) window.nanoRerender();
  });
  apply();
})();
</script>
