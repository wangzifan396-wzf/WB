:root{

*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;

label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}

.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}

    {name:'export', cat:'环境', desc:'设置环境变量', keys:['env','variable'], examples:[
      {d:'导出变量', c:'export {{NAME}}={{value}}'},
      {d:'持久化到 profile', c:'echo "export {{NAME}}={{value}}" >> ~/.bashrc'}
    ]},
    {name:'echo', cat:'shell', desc:'输出文本', keys:['print','shell'], examples:[
      {d:'输出到文件', c:'echo "{{text}}" > {{file}}'},
      {d:'追加', c:'echo "{{text}}" >> {{file}}'}
    ]}
  ];

  function norm(s){ return String(s).toLowerCase(); }
  function search(q){
    q = norm(q).trim();
    if(!q) return DB.slice();
    return DB.filter(function(e){
      if(norm(e.name).indexOf(q)>=0) return true;
      if(norm(e.desc).indexOf(q)>=0) return true;
      if((e.keys||[]).some(function(k){ return norm(k).indexOf(q)>=0; })) return true;
      if(e.examples.some(function(x){ return norm(x.c).indexOf(q)>=0 || norm(x.d).indexOf(q)>=0; })) return true;
      return false;
    });
  }
  function get(name){ for(var i=0;i<DB.length;i++) if(DB[i].name===name) return DB[i]; return null; }
  function all(){ return DB.slice(); }
  function cats(){ var m={}; DB.forEach(function(e){ m[e.cat]=(m[e.cat]||0)+1; }); return m; }

  return { search:search, get:get, all:all, cats:cats, DB:DB };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = TldrForgePure;
if (typeof window !== 'undefined') window.TldrForgePure = TldrForgePure;

</script>
<script>

(function(){
  var P = window.TldrForgePure;
  var $ = function(id){ return document.getElementById(id); };
  var q = $('tl_q'), catsBox = $('tl_cats'), out = $('tl_out');
  var curCat = '';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function escAttr(s){ return esc(s).replace(/'/g,'&#39;'); }
  function renderCats(){
    var cs = P.cats(); var html='';
    html += '<span class="tl-chip'+(curCat===''?' on':'')+'" data-c="">全部</span>';
    Object.keys(cs).forEach(function(c){ html += '<span class="tl-chip'+(curCat===c?' on':'')+'" data-c="'+escAttr(c)+'">'+esc(c)+' · '+cs[c]+'</span>'; });
    catsBox.innerHTML = html;
    catsBox.querySelectorAll('.tl-chip').forEach(function(el){ el.addEventListener('click', function(){ curCat = el.getAttribute('data-c'); renderCats(); render(); }); });
  }
  function render(){
    var list = P.search(q.value);
    if(curCat) list = list.filter(function(e){ return e.cat===curCat; });
    if(!list.length){ out.innerHTML = '<div class="err">没有匹配的命令，换个关键词试试。</div>'; return; }
    out.innerHTML = list.map(function(e){
      var ex = e.examples.map(function(x){
        return '<div class="tl-ex"><div class="tl-d">'+esc(x.d)+'</div>'
          + '<div class="tl-c"><code>'+esc(x.c)+'</code>'
          + '<button class="tl-cp" data-c="'+escAttr(x.c)+'">复制</button></div></div>';
      }).join('');
      return '<div class="tl-card"><div class="tl-name">'+esc(e.name)+'</div>'
        + '<div class="tl-desc">'+esc(e.desc)+'</div>'+ex+'</div>';
    }).join('');
    out.querySelectorAll('.tl-cp').forEach(function(b){
      b.addEventListener('click', function(){
        var txt = b.getAttribute('data-c');
        if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(function(){});
        b.textContent='已复制'; setTimeout(function(){ b.textContent='复制'; }, 1200);
      });
    });
  }
  q.addEventListener('input', render);
  renderCats(); render();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
