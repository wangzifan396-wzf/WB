<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0B">
<title>SnipForge — Local-first code snippet manager</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --canvas:#0A0A0B;
    --card:#141417;
    --surface:#1A1B1E;
    --text:#FFFFFF;
    --text-dim:#A1A1AA;
    --text-mute:#71717A;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.14);
    --accent:#5E6AD2;
    --success:#10B981;
    --warning:#F5A623;
    --info:#22D3EE;
    --purple:#A78BFA;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--canvas); color:var(--text);
    font-family:var(--font); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  ::selection{background:rgba(94,106,210,0.35)}
  button{font-family:inherit}
  input,textarea,select{font-family:inherit}
  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.18);background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}

  #app{display:flex;flex-direction:column;height:100vh}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:0 16px;height:56px;flex:0 0 56px;
    border-bottom:1px solid var(--border);background:rgba(20,20,23,0.6);
    backdrop-filter:blur(8px);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:.2px;white-space:nowrap}
  .brand svg{color:var(--accent);display:block}
  .brand .sub{color:var(--text-mute);font-weight:400;font-size:11px;margin-left:2px}
  .search-wrap{flex:1;max-width:560px;position:relative;display:flex;align-items:center}
  .search-wrap svg{position:absolute;left:11px;color:var(--text-mute);pointer-events:none}
  #search{
    width:100%;height:36px;padding:0 12px 0 34px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-md);color:var(--text);font-size:13px;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  #search::placeholder{color:var(--text-mute)}
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,106,210,0.18)}
  .hint{position:absolute;right:10px;font-size:11px;color:var(--text-mute);pointer-events:none}
  .actions{display:flex;align-items:center;gap:8px}
  .btn{
    height:34px;padding:0 13px;border-radius:var(--r-md);
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s,border-color .15s,color .15s,transform .1s;
    white-space:nowrap;
  }
  .btn:hover{background:#222327;color:var(--text);border-color:var(--border-strong)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.primary:hover{background:#6b77e0}
  .btn.icon{padding:0;width:34px;justify-content:center}

  /* ---------- layout ---------- */
  .layout{flex:1;display:flex;min-height:0}
  .sidebar{
    width:236px;flex:0 0 236px;border-right:1px solid var(--border);
    overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:16px;
  }
  .side-group .side-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--text-mute);padding:0 8px 6px;font-weight:600;
  }
  .side-item{
    display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r-sm);
    color:var(--text-dim);cursor:pointer;font-size:13px;user-select:none;
    transition:background .12s,color .12s;
  }
  .side-item:hover{background:var(--surface);color:var(--text)}
  .side-item.active{background:rgba(94,106,210,0.14);color:#fff}
  .side-item .dot{width:7px;height:7px;border-radius:50%;background:var(--text-mute);flex:0 0 7px}
  .side-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-item .cnt{font-size:11px;color:var(--text-mute);font-variant-numeric:tabular-nums}
  .side-item .x{opacity:0;color:var(--text-mute);font-size:12px;padding:0 2px;border-radius:4px}
  .side-item:hover .x{opacity:1}
  .side-item .x:hover{color:var(--warning)}
  .fav-star{color:var(--warning)}

  .list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .list-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
  .list-head h2{margin:0;font-size:14px;font-weight:600}
  .list-head .meta{font-size:12px;color:var(--text-mute)}
  .empty{
    margin-top:48px;text-align:center;color:var(--text-mute);font-size:13px;
    border:1px dashed var(--border);border-radius:var(--r-lg);padding:40px 20px;
  }

  .card{
    border:1px solid var(--border);background:var(--card);border-radius:var(--r-md);
    padding:13px 14px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;
    display:flex;flex-direction:column;gap:8px;position:relative;
  }
  .card:hover{border-color:var(--border-strong);background:#17171b}
  .card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .card .row1{display:flex;align-items:center;gap:9px}
  .card .star{color:var(--text-mute);cursor:pointer;flex:0 0 auto;line-height:0}
  .card .star.on{color:var(--warning)}
  .card .title{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .desc{color:var(--text-dim);font-size:12.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .row2{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .badge{
    font-size:11px;padding:2px 8px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
  }
  .badge.lang{color:var(--info);border-color:rgba(34,211,238,0.25);background:rgba(34,211,238,0.08)}
  .badge.folder{color:var(--purple);border-color:rgba(167,139,250,0.25);background:rgba(167,139,250,0.08)}
  .chip{
    font-size:11px;padding:2px 8px;border-radius:999px;
    background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-mute);
  }
  mark{background:rgba(94,106,210,0.45);color:#fff;border-radius:3px;padding:0 1px}

  /* ---------- detail ---------- */
  .detail{
    width:400px;flex:0 0 400px;border-left:1px solid var(--border);
    overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;
  }
  .detail .placeholder{color:var(--text-mute);font-size:13px;margin-top:40px;text-align:center}
  .detail h1{margin:0;font-size:18px;font-weight:600;line-height:1.3}
  .detail .meta-row{display:flex;gap:7px;flex-wrap:wrap}
  .detail .tags{display:flex;gap:6px;flex-wrap:wrap}
  .detail .desc-box{color:var(--text-dim);font-size:13px;white-space:pre-wrap}
  .detail .code-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .detail .code-head .t{font-size:12px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.06em}
  .code-wrap{border:1px solid var(--border);border-radius:var(--r-md);background:#0d0d0f;overflow:hidden}
  pre{margin:0;padding:14px;overflow:auto;max-height:360px}
  pre code{font-family:var(--mono);font-size:12.5px;color:#e4e4e7;white-space:pre;line-height:1.55}
  .copy-btn{height:28px;padding:0 10px;font-size:12px}
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;transition:opacity .18s;
  }
  .modal-overlay.show{opacity:1}
  .modal{
    width:min(620px,100%);max-height:90vh;overflow:auto;
    background:var(--card);border:1px solid var(--border-strong);
    border-radius:var(--r-lg);box-shadow:0 24px 70px rgba(0,0,0,0.6);
    padding:20px;
  }
  .modal h3{margin:0 0 14px;font-size:16px;font-weight:600}
  .field{margin-bottom:13px;display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--text-dim)}
  .inp,.sel,.txt{
    width:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-sm);color:var(--text);font-size:13px;padding:9px 10px;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .txt{font-family:var(--mono);font-size:12.5px;resize:vertical;min-height:160px;line-height:1.5}
  .inp:focus,.sel:focus,.txt:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(94,106,210,0.18)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:6px}
  .confirm-msg{color:var(--text-dim);font-size:13px;margin:0 0 16px}

  /* ---------- toast ---------- */
  .toast-wrap{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .toast{
    background:var(--surface);border:1px solid var(--border-strong);color:var(--text);
    padding:10px 14px;border-radius:var(--r-md);font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,0.4);
    transform:translateY(8px);opacity:0;transition:opacity .25s,transform .25s;max-width:320px;
  }
  .toast.show{transform:none;opacity:1}
  .toast.ok{border-left:3px solid var(--success)}
  .toast.warn{border-left:3px solid var(--warning)}

  /* ---------- brand strip ---------- */
  .brandstrip{
    position:fixed;right:14px;bottom:12px;z-index:40;pointer-events:none;
    font-size:11px;color:var(--text-mute);letter-spacing:.04em;
    display:flex;align-items:center;gap:6px;opacity:.75;
  }
  .brandstrip .b{color:var(--accent)}

  .reveal{opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
  .reveal.in{opacity:1;transform:none}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
    .reveal{opacity:1;transform:none}
  }
  @media (max-width:880px){
    .detail{display:none}
    .sidebar{width:180px;flex-basis:180px}
  }
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
<meta name="description" content="本地优先的代码片段管理器：分类、标签、全文搜索，一键复制，JSON 导入导出，离线可用。">

a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}

<body>
<h1 class="nt-sr-only">SnipForge — Local-first code snippet manager</h1>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg>
      <span>SnipForge</span><span class="sub" id="brandSub">snippets</span>
    </div>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="搜索片段、代码、标签…">
      <span class="hint">/</span>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnNew">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span id="lblNew">新片段</span>
      </button>
      <button class="btn" id="btnFolder"><span id="lblFolder">+ 文件夹</span></button>
      <button class="btn" id="btnImport"><span id="lblImport">导入</span></button>
      <button class="btn" id="btnExport"><span id="lblExport">导出</span></button>
      <button class="btn icon" id="btnLang" title="切换语言">EN</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="list" id="list"></main>
    <section class="detail" id="detail"></section>
  </div>
  <div class="brandstrip">nano·tools · <span class="b">SnipForge</span></div>
  <div class="toast-wrap" id="toasts"></div>
  <input type="file" id="fileInput" accept="application/json,.json" hidden>
</div>

<script>
/* ============================================================
   SnipForge — pure logic (no DOM). Exported for Node tests.
   ============================================================ */
function uid(){
  return 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}

function normalizeSnippet(input){
  input = input || {};
  var ts = new Date().toISOString();
  var tags = Array.isArray(input.tags) ? input.tags.filter(function(t){return t != null;}).map(String) : [];
  return {
    id: input.id || uid(),
    folder: (input.folder && String(input.folder).trim()) || 'General',
    title: (input.title != null ? String(input.title) : '') || 'Untitled',
    desc: input.desc != null ? String(input.desc) : '',
    lang: (input.lang && String(input.lang).trim()) || 'text',
    code: input.code != null ? String(input.code) : '',
    tags: tags,
    fav: !!input.fav,
    createdAt: input.createdAt || ts,
    updatedAt: input.updatedAt || ts
  };
}

function addSnippet(input){ return normalizeSnippet(input); }

function removeSnippet(snippets, id){
  return (snippets || []).filter(function(s){ return s.id !== id; });
}

function updateSnippet(snippet, patch){
  var merged = Object.assign({}, snippet, patch || {});
  merged.updatedAt = new Date().toISOString();
  return merged;
}

function toggleFavorite(snippet){
  return Object.assign({}, snippet, { fav: !snippet.fav, updatedAt: new Date().toISOString() });
}

function searchSnippets(snippets, query){
  var q = (query || '').trim().toLowerCase();
  if(!q) return (snippets || []).slice();
  return (snippets || []).filter(function(s){
    if((s.title || '').toLowerCase().indexOf(q) !== -1) return true;
    if((s.code || '').toLowerCase().indexOf(q) !== -1) return true;
    return (s.tags || []).some(function(t){ return (t || '').toLowerCase().indexOf(q) !== -1; });
  });
}

function filterByLang(snippets, lang){
  if(!lang || lang === 'all') return (snippets || []).slice();
  return (snippets || []).filter(function(s){ return s.lang === lang; });
}

function groupByFolder(snippets){
  var out = {};
  (snippets || []).forEach(function(s){
    var f = s.folder || 'General';
    if(!out[f]) out[f] = [];
    out[f].push(s);
  });
  return out;
}

function exportJSON(snippets){
  return JSON.stringify({ version: 1, snippets: snippets || [] }, null, 2);
}

function importJSON(str){
  if(typeof str !== 'string') throw new Error('Invalid shape');
  var data;
  try { data = JSON.parse(str); } catch(e){ throw new Error('Malformed JSON'); }
  var arr;
  if(Array.isArray(data)) arr = data;
  else if(data && typeof data === 'object' && Array.isArray(data.snippets)) arr = data.snippets;
  else throw new Error('Invalid shape');
  if(!arr.every(function(x){ return x && typeof x === 'object'; })) throw new Error('Invalid shape');
  return arr.map(normalizeSnippet);
}

function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ---- Node test export (BEFORE the window guard) ---- */
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    uid: uid,
    normalizeSnippet: normalizeSnippet,
    addSnippet: addSnippet,
    removeSnippet: removeSnippet,
    updateSnippet: updateSnippet,
    toggleFavorite: toggleFavorite,
    searchSnippets: searchSnippets,
    filterByLang: filterByLang,
    groupByFolder: groupByFolder,
    exportJSON: exportJSON,
    importJSON: importJSON,
    escapeHtml: escapeHtml
  };
}

/* ============================================================
   UI layer — browser only.
   ============================================================ */
if (typeof window !== 'undefined') {
  (function(){
    'use strict';
    var LS_KEY = 'snipforge.v1';
    var LS_LANG = 'snipforge.lang';

    var LANGS = ['javascript','typescript','python','go','rust','java','sql','bash','css','html','json','yaml','regex','markdown','text'];

    var I18N = {
      zh: {
        search:'搜索片段、代码、标签…', new:'新片段', newFolder:'+ 文件夹', import:'导入', export:'导出',
        all:'全部', fav:'收藏', folders:'文件夹', langs:'语言', noSnippet:'还没有片段，点击「新片段」开始。',
        selectHint:'从左侧选择片段查看详情', copy:'复制', copied:'已复制', edit:'编辑', del:'删除',
        folder:'文件夹', title:'标题', desc:'描述', lang:'语言', tags:'标签（逗号分隔）', code:'代码',
        save:'保存', cancel:'取消', needTitle:'请填写标题', saved:'已保存', conDel:'确定删除该片段？',

    function highlight(text, q){
      var frag = document.createDocumentFragment();

      var lower = (text || '').toLowerCase(), ql = q.toLowerCase(), i = 0, idx;

        i = idx + ql.length;

      if(i < text.length) frag.appendChild(document.createTextNode(text.slice(i)));

    /* ---------- reveal animation (guarded for non-IO envs) ---------- */
    function revealAll(root){

      Array.prototype.forEach.call(nodes, function(n){ io.observe(n); });

        document.body.appendChild(ta); ta.focus(); ta.select();

      var root = el('div');
      root.appendChild(el('h3', { text: T('conDelTitle') }));
      root.appendChild(el('p', { class: 'confirm-msg', text: T('conDel') + ' “' + s.title + '”' }));
      var acts = el('div', { class: 'modal-actions' });
      var cancel = el('button', { class: 'btn', onclick: function(){ closeModal(ov); } });
      cancel.appendChild(document.createTextNode(T('cancel')));
      var yes = el('button', { class: 'btn primary', onclick: function(){
        state.snippets = removeSnippet(state.snippets, id);
        if(state.selectedId === id) state.selectedId = null;
        saveState(); renderAll(); closeModal(ov); toast(T('del'), 'ok');
      } });
      yes.appendChild(document.createTextNode(T('del')));
      acts.appendChild(cancel); acts.appendChild(yes); root.appendChild(acts);
      var ov = openModal(root);
    }

    function confirmDeleteFolder(name){
      var root = el('div');
      root.appendChild(el('h3', { text: T('conFolderTitle') }));
      root.appendChild(el('p', { class: 'confirm-msg', text: T('conFolder') }));
      var acts = el('div', { class: 'modal-actions' });
      var cancel = el('button', { class: 'btn', onclick: function(){ closeModal(ov); } });
      cancel.appendChild(document.createTextNode(T('cancel')));
      var yes = el('button', { class: 'btn primary', onclick: function(){
        state.snippets.forEach(function(s){ if(s.folder === name) s.folder = 'General'; });
        state.folders = state.folders.filter(function(f){ return f !== name; });
        if(state.filter.folder === name) state.filter.folder = 'all';
        saveState(); renderAll(); closeModal(ov); toast(T('del'), 'ok');
      } });
      yes.appendChild(document.createTextNode(T('del')));
      acts.appendChild(cancel); acts.appendChild(yes); root.appendChild(acts);
      var ov = openModal(root);
    }

    /* ---------- import / export ---------- */
    function exportAll(){
      try {
        var data = exportJSON(state.snippets);
        var blob = new Blob([data], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = el('a', { href: url, download: 'snipforge-snippets.json' });
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
        toast(T('exportOk'), 'ok');
      } catch(e){ toast(T('exportOk'), 'warn'); }
    }
    function importAll(text){
      try {
        var imported = importJSON(text);
        var existing = {};
        state.snippets.forEach(function(s){ existing[s.id] = true; });
        var added = 0;
        imported.forEach(function(s){
          if(existing[s.id]) s.id = uid();
          ensureFolder(s.folder);
          state.snippets.push(s); added++;
        });
        saveState(); renderAll();
        toast(T('importOk') + ' (' + added + ')', 'ok');
      } catch(e){
        toast(T('importFail'), 'warn');
      }
    }

    /* ---------- toast ---------- */
    function toast(msg, type){
      var wrap = document.getElementById('toasts');
      var t = el('div', { class: 'toast' + (type ? ' ' + type : ''), text: msg });
      wrap.appendChild(t);
      if(typeof requestAnimationFrame === 'function') requestAnimationFrame(function(){ t.classList.add('show'); });
      else t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300); }, 2600);
    }

    /* ---------- language ---------- */
    function applyLang(){
      document.documentElement.lang = (lang === 'zh') ? 'zh' : 'en';
      document.getElementById('search').placeholder = T('search');
      document.getElementById('lblNew').textContent = T('new');
      document.getElementById('lblFolder').textContent = T('newFolder');
      document.getElementById('lblImport').textContent = T('import');
      document.getElementById('lblExport').textContent = T('export');
      document.getElementById('btnLang').textContent = (lang === 'zh') ? 'EN' : '中';
      document.getElementById('brandSub').textContent = T('brandSub');
    }
    function toggleLang(){
      lang = (lang === 'zh') ? 'en' : 'zh';
      saveLang(); applyLang(); renderAll();
    }

    /* ---------- init ---------- */
    function init(){
      lang = loadLang();
      var raw = loadRaw();
      if(raw){
        try {
          var data = JSON.parse(raw);
          state.snippets = Array.isArray(data.snippets) ? data.snippets.map(normalizeSnippet) : [];
          state.folders = Array.isArray(data.folders) ? data.folders : [];
        } catch(e){ state.snippets = []; state.folders = []; }
      }
      if(state.snippets.length === 0){
        state.snippets = SAMPLES.map(function(s){ return normalizeSnippet(s); });
        state.folders = uniqueFolders();
        saveState();
      }
      applyLang();
      renderAll();

      // events
      document.getElementById('btnNew').addEventListener('click', function(){ openEditor(null); });
      document.getElementById('btnFolder').addEventListener('click', function(){
        promptText(T('newFolderTitle'), T('folderName'), '', function(name){ ensureFolder(name); saveState(); renderAll(); toast(name, 'ok'); });
      });
      document.getElementById('btnImport').addEventListener('click', function(){ document.getElementById('fileInput').click(); });
      document.getElementById('btnExport').addEventListener('click', exportAll);
      document.getElementById('btnLang').addEventListener('click', toggleLang);

      var search = document.getElementById('search');
      search.addEventListener('input', function(){ state.filter.query = search.value; renderList(); });

      var fileInput = document.getElementById('fileInput');
      fileInput.addEventListener('change', function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(){ importAll(String(reader.result || '')); fileInput.value = ''; };
        reader.onerror = function(){ toast(T('importFail'), 'warn'); fileInput.value = ''; };
        reader.readAsText(file);
      });

      document.addEventListener('keydown', function(e){
        var t = e.target;
        var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
        if(e.key === '/' && !typing){ e.preventDefault(); search.focus(); }
        else if((e.key === 'n' || e.key === 'N') && !typing){ e.preventDefault(); openEditor(null); }
        else if(e.key === 'Escape'){ var ov = document.querySelector('.modal-overlay'); if(ov) closeModal(ov); }
      });

      if('serviceWorker' in navigator){
        navigator.serviceWorker.register('sw.js').catch(function(){ /* offline only */ });
      }
    }

    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();
}
</script>
