function utf8Bytes(str){
  var b=[];
  for(var i=0;i<str.length;i++){
    var c=str.charCodeAt(i);
    if(c<0x80) b.push(c);
    else if(c<0x800) b.push(0xc0|(c>>6),0x80|(c&0x3f));
    else if(c>=0xd800&&c<=0xdbff){
      var c2=str.charCodeAt(i+1), cp=0x10000+((c&0x3ff)<<10)+(c2&0x3ff);
      b.push(0xf0|(cp>>18),0x80|((cp>>12)&0x3f),0x80|((cp>>6)&0x3f),0x80|(cp&0x3f)); i++;
    } else b.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f));
  }
  return b;
}
function bytesToUtf8(b){
  var s='',i=0;
  while(i<b.length){
    var c=b[i];
    if(c<0x80){ s+=String.fromCharCode(c); i++; }
    else if(c<0xe0){ s+=String.fromCharCode(((c&0x1f)<<6)|(b[i+1]&0x3f)); i+=2; }
    else if(c<0xf0){ s+=String.fromCharCode(((c&0x0f)<<12)|((b[i+1]&0x3f)<<6)|(b[i+2]&0x3f)); i+=3; }
    else {
      var cp=((c&0x07)<<18)|((b[i+1]&0x3f)<<12)|((b[i+2]&0x3f)<<6)|(b[i+3]&0x3f);
      cp-=0x10000; s+=String.fromCharCode(0xd800+(cp>>10),0xdc00+(cp&0x3ff)); i+=4;
    }

function toHex(b){ var s=''; for(var i=0;i<b.length;i++) s+=('0'+(b[i]&0xff).toString(16)).slice(-2); return s; }
function fromHex(h){

  s=String(s).replace(/[\s\r\n]/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/=+$/,'');

        algId(OID.ecPublicKey, tlv(0x06, encodeOid(OID[jwk.crv]))), tlv(0x04, tlv(0x30, body))))};
    }
    if(jwk.kty==='OKP'){
      if(!OKP_CURVES[jwk.crv]) return {error:'不认识的 OKP 曲线 "'+jwk.crv+'"'};
      return {value:tlv(0x30, [].concat(derUInt([0]), algId(OID[jwk.crv], null),
        tlv(0x04, tlv(0x04, b64uBytes(jwk.d)))))};
    }
    return {error:'kty "'+jwk.kty+'" 没有 PKCS#8 表示'};
  } catch(e){ return {error:'编码失败：'+e.message}; }
}

/* ---- DER → JWK ---- */
function readAlgId(node){
  var kids=derChildren(node.content);
  if(!kids.length || kids[0].tag!==0x06) return {error:'算法标识里没有 OID'};
  return {oid:decodeOid(kids[0].content), param:kids[1]||null};
}
function spkiToJwk(der){
  var top=derRead(der,0);
  if(!top||top.tag!==0x30) return {error:'最外层不是 SEQUENCE，这不像 SPKI'};
  var kids=derChildren(top.content);
  if(kids.length<2 || kids[0].tag!==0x30 || kids[1].tag!==0x03)
    return {error:'SPKI 应为 SEQUENCE{ AlgorithmIdentifier, BIT STRING }'};
  var ai=readAlgId(kids[0]);
  if(ai.error) return ai;
  var bits=kids[1].content;
  if(!bits.length) return {error:'BIT STRING 是空的'};
  if(bits[0]!==0) return {error:'BIT STRING 有 '+bits[0]+' 个未用位，公钥不该出现这种情况'};
  var key=bits.slice(1);
  var name=OID_REV[ai.oid];
  if(ai.oid===OID.rsa){
    var seq=derRead(key,0);
    if(!seq||seq.tag!==0x30) return {error:'RSA 公钥内层不是 SEQUENCE'};
    var nk=derChildren(seq.content);
    if(nk.length<2) return {error:'RSA 公钥应含 n 与 e 两个 INTEGER'};
    return {value:{kty:'RSA', n:bytesB64u(strip(nk[0].content)), e:bytesB64u(strip(nk[1].content))}};
  }
  if(ai.oid===OID.ecPublicKey){
    if(!ai.param || ai.param.tag!==0x06) return {error:'EC 公钥缺少曲线 OID 参数'};
    var crv=OID_REV[decodeOid(ai.param.content)];
    var ci=EC_CURVES[crv];
    if(!ci) return {error:'不支持的曲线 OID '+decodeOid(ai.param.content)};
    if(key[0]!==0x04) return {error:'EC 公钥点不是未压缩格式（首字节应为 0x04）'};
    if(key.length!==1+2*ci.coord) return {error:'曲线 '+crv+' 的点应为 '+(1+2*ci.coord)+' 字节，实际 '+key.length+' 字节'};
    return {value:{kty:'EC', crv:crv, x:bytesB64u(key.slice(1,1+ci.coord)), y:bytesB64u(key.slice(1+ci.coord))}};
  }
  if(OKP_CURVES[name]){
    if(key.length!==OKP_CURVES[name].len)
      return {error:name+' 公钥应为 '+OKP_CURVES[name].len+' 字节，实际 '+key.length+' 字节'};
    return {value:{kty:'OKP', crv:name, x:bytesB64u(key)}};
  }

}
function strip(b){ var o=b.slice(); while(o.length>1&&o[0]===0) o.shift(); return o; }
function pkcs8ToJwk(der){
  var top=derRead(der,0);

  var kids=derChildren(top.content);
  if(kids.length<3 || kids[0].tag!==0x02 || kids[1].tag!==0x30 || kids[2].tag!==0x04)
    return {error:'PKCS#8 应为 SEQUENCE{ INTEGER version, AlgorithmIdentifier, OCTET STRING }'};
  var ai=readAlgId(kids[1]);
  if(ai.error) return ai;
  var inner=kids[2].content, name=OID_REV[ai.oid];
  if(ai.oid===OID.rsa){
    var seq=derRead(inner,0);
    if(!seq||seq.tag!==0x30) return {error:'RSAPrivateKey 内层不是 SEQUENCE'};
    var p=derChildren(seq.content);
    if(p.length<9) return {error:'RSAPrivateKey 需要 9 个 INTEGER（含 CRT 参数），实际 '+p.length+' 个'};
    return {value:{kty:'RSA', n:bytesB64u(strip(p[1].content)), e:bytesB64u(strip(p[2].content)),
      d:bytesB64u(strip(p[3].content)), p:bytesB64u(strip(p[4].content)), q:bytesB64u(strip(p[5].content)),
      dp:bytesB64u(strip(p[6].content)), dq:bytesB64u(strip(p[7].content)), qi:bytesB64u(strip(p[8].content))}};
  }
  if(ai.oid===OID.ecPublicKey){
    if(!ai.param||ai.param.tag!==0x06) return {error:'EC 私钥缺少曲线 OID'};
    var crv=OID_REV[decodeOid(ai.param.content)], ci=EC_CURVES[crv];
    if(!ci) return {error:'不支持的曲线 OID '+decodeOid(ai.param.content)};
    var es=derRead(inner,0);
    if(!es||es.tag!==0x30) return {error:'ECPrivateKey 内层不是 SEQUENCE'};
    var ek=derChildren(es.content), out={kty:'EC', crv:crv};
    for(var i=0;i<ek.length;i++){

          out.x=bytesB64u(bs.content.slice(2,2+ci.coord));
          out.y=bytesB64u(bs.content.slice(2+ci.coord));
        }
      }
    }
    if(!out.d) return {error:'ECPrivateKey 里没找到私钥 OCTET STRING'};
    return {value:out};
  }
  if(OKP_CURVES[name]){
    var oc=derRead(inner,0);
    if(!oc||oc.tag!==0x04) return {error:name+' 私钥内层应再套一层 OCTET STRING'};
    return {value:{kty:'OKP', crv:name, d:bytesB64u(oc.content)}};
  }

}
function pemToJwk(text){
  var u=pemUnwrap(text);
  if(u.error) return u;
  if(/PRIVATE KEY/.test(u.label)){
    if(/ENCRYPTED/.test(u.label)) return {error:'这是加密的 PKCS#8，需要先用口令解密（本工具不做口令解密）'};
    if(u.label==='RSA PRIVATE KEY') return {error:'这是 PKCS#1 格式，请先用 openssl pkcs8 -topk8 转成 PKCS#8'};
    if(u.label==='EC PRIVATE KEY') return {error:'这是 SEC1 格式，请先用 openssl pkcs8 -topk8 转成 PKCS#8'};
    var r=pkcs8ToJwk(u.der);
    if(r.value) r.label=u.label;
    return r;
  }
  if(u.label==='PUBLIC KEY'){
    var s=spkiToJwk(u.der);
    if(s.value) s.label=u.label;
    return s;
  }
  if(u.label==='RSA PUBLIC KEY') return {error:'这是 PKCS#1 公钥，请先转成 SPKI（-----BEGIN PUBLIC KEY-----）'};
  if(u.label==='CERTIFICATE') return {error:'这是证书不是裸公钥，先用 openssl x509 -pubkey -noout 取出公钥'};

}
function jwkToPem(jwk, wantPrivate){
  var r = wantPrivate ? jwkToPkcs8(jwk) : jwkToSpki(jwk);
  if(r.error) return r;
  return {value:pemWrap(wantPrivate?'PRIVATE KEY':'PUBLIC KEY', r.value), der:r.value};
}

var SSH_TO_ALG = {
  'ssh-ed25519':'ed25519',
  'ecdsa-sha2-nistp256':'p256',
  'ecdsa-sha2-nistp384':'p384',
  'ecdsa-sha2-nistp521':'p521',
  'ssh-rsa':'rsa2048'
};
var SSH_CURVE_NAME = {'p256':'nistp256','p384':'nistp384','p521':'nistp521'};

function algOf(jwk){
  if(!jwk || !jwk.kty) return null;
  if(jwk.kty==='OKP'){
    if(jwk.crv==='Ed25519') return 'ed25519';
    if(jwk.crv==='X25519') return 'x25519';
    return null;
  }
  if(jwk.kty==='EC'){
    if(jwk.crv==='P-256') return 'p256';
    if(jwk.crv==='P-384') return 'p384';
    if(jwk.crv==='P-521') return 'p521';
    return null;
  }
  if(jwk.kty==='RSA'){
    var n=b64decode(jwk.n||''), bits=bitLen(n);
    if(bits<=2048) return 'rsa2048';
    if(bits<=3072) return 'rsa3072';
    return 'rsa4096';
  }
  return null;
}

/* ---- SSH wire ---- */
function mpint(mag){
  var i=0;
  while(i<mag.length-1 && mag[i]===0) i++;
  var m=mag.slice(i);
  if(m.length && (m[0]&0x80)) m=[0].concat(m);
  return sshStr(m);
}
function sshTypeOf(jwk){
  var a=algOf(jwk);
  if(!a) return null;
  return KP_ALGS[a].ssh;
}
function jwkToSshBlob(jwk){
  var a=algOf(jwk);
  if(!a) return {error:'认不出这是什么密钥，无法转成 OpenSSH 格式'};
  var spec=KP_ALGS[a];
  if(!spec.ssh) return {error:spec.label+' 不能做 SSH 认证密钥（它只用于密钥协商）'};
  if(jwk.kty==='OKP'){
    var A=b64decode(jwk.x||'');
    if(A.length!==32) return {error:'Ed25519 公钥应为 32 字节，实际 '+A.length+' 字节'};
    return {value: sshStr(utf8Bytes('ssh-ed25519')).concat(sshStr(A)), type:'ssh-ed25519'};
  }
  if(jwk.kty==='EC'){
    var L=spec.coordLen, x=b64decode(jwk.x||''), y=b64decode(jwk.y||'');
    if(x.length!==L || y.length!==L)
      return {error:spec.label+' 坐标应各为 '+L+' 字节，实际 x='+x.length+' y='+y.length};
    var pt=[4].concat(x, y);
    return {value: sshStr(utf8Bytes(spec.ssh)).concat(sshStr(utf8Bytes(SSH_CURVE_NAME[a])), sshStr(pt)),
            type: spec.ssh};
  }
  if(jwk.kty==='RSA'){
    var e=b64decode(jwk.e||''), n=b64decode(jwk.n||'');
    if(!e.length || !n.length) return {error:'RSA 公钥缺少 n 或 e'};
    return {value: sshStr(utf8Bytes('ssh-rsa')).concat(mpint(e), mpint(n)), type:'ssh-rsa'};
  }
  return {error:'kty '+jwk.kty+' 没有对应的 OpenSSH 表示'};
}
function stripLeadZero(b){
  var i=0;
  while(i<b.length-1 && b[i]===0) i++;
  return b.slice(i);
}
function padLeft(b, n){
  var out=stripLeadZero(b);
  if(out.length>n) return null;
  while(out.length<n) out=[0].concat(out);
  return out;
}
function sshBlobToJwk(blob){
  var r=sshRead(blob);
  if(r.trunc) return {error:'OpenSSH 数据在第 '+r.trunc.at+' 字节被截断（'+r.trunc.reason+'）'};
  if(!r.fields.length) return {error:'OpenSSH 数据是空的'};
  var type=bytesToUtf8(r.fields[0]);
  if(type==='ssh-ed25519'){
    if(r.fields.length<2) return {error:'ssh-ed25519 缺少公钥字段'};
    if(r.fields[1].length!==32) return {error:'ssh-ed25519 公钥应为 32 字节，实际 '+r.fields[1].length};
    return {value:{kty:'OKP', crv:'Ed25519', x:b64url(r.fields[1])}, type:type};
  }
  if(type.indexOf('ecdsa-sha2-')===0){
    if(r.fields.length<3) return {error:type+' 需要曲线名与坐标两个字段'};
    var cname=bytesToUtf8(r.fields[1]), pt=r.fields[2];
    var map={nistp256:['P-256',32], nistp384:['P-384',48], nistp521:['P-521',66]};
    var m=map[cname];
    if(!m) return {error:'不认识的曲线 "'+cname+'"'};
    if(pt[0]!==4) return {error:'这是压缩点（首字节 0x0'+pt[0]+'），JWK 只接受未压缩点，需要先解压'};
    if(pt.length!==1+m[1]*2) return {error:'坐标长度不对：'+cname+' 应为 '+(1+m[1]*2)+' 字节，实际 '+pt.length};
    return {value:{kty:'EC', crv:m[0],
                   x:b64url(pt.slice(1,1+m[1])), y:b64url(pt.slice(1+m[1]))}, type:type};
  }
  if(type==='ssh-rsa'){
    if(r.fields.length<3) return {error:'ssh-rsa 需要 e 与 n 两个字段'};
    return {value:{kty:'RSA', e:b64url(stripLeadZero(r.fields[1])), n:b64url(stripLeadZero(r.fields[2]))}, type:type};
  }
  if(type==='ssh-dss') return {error:'ssh-dss（DSA）已在 OpenSSH 7.0 默认禁用、9.8 起编译期移除，JWK 里也没有对应 kty。请直接换成 Ed25519。'};
  if(type.indexOf('sk-')===0) return {error:'这是 FIDO/U2F 硬件密钥（'+type+'），公钥后面还跟着 application 字段，不能直接当普通 JWK 用'};
  if(type.indexOf('-cert-v01@openssh.com')>0) return {error:'这是 SSH 证书而不是裸公钥，请先用 ssh-keygen -L 查看，或取出其中的 CA 公钥'};

}
function opensshToJwk(line){
  var t=String(line||'').trim();
  if(!t) return {error:'输入是空的'};
  var parts=t.split(/\s+/);
  var i=0;
  while(i<parts.length && !/^(ssh-|ecdsa-sha2-|sk-)/.test(parts[i])) i++;
  if(i>=parts.length) return {error:'这一行里找不到 ssh-* / ecdsa-sha2-* 开头的密钥类型'};
  if(i+1>=parts.length) return {error:'密钥类型 "'+parts[i]+'" 后面没有 base64 数据'};
  var b64=parts[i+1], blob;
  try { blob=b64decode(b64); }
  catch(e){ return {error:'base64 解不开：'+e.message}; }
  var r=sshBlobToJwk(blob);
  if(r.error) return r;
  var declared=parts[i], comment=parts.slice(i+2).join(' ');
  if(declared!==r.type)
    return {error:'行首写的是 "'+declared+'"，但 base64 里实际是 "'+r.type+'"。多半是复制时把两把密钥的片段拼在了一起。'};
  return {value:r.value, type:r.type, comment:comment, blob:blob};
}
function jwkToOpenssh(jwk, comment){
  var b=jwkToSshBlob(jwk);
  if(b.error) return b;
  var line=b.type+' '+b64encode(b.value);
  if(comment) line+=' '+String(comment).replace(/\s+/g,' ').trim();
  return {value:line, type:b.type, blob:b.value};
}

/* ---- 指纹 ---- */
function sshFingerprints(blob){
  return {
    sha256:'SHA256:'+b64encode(sha256Bytes(blob)).replace(/=+$/,''),
    md5:'MD5:'+colonHex(md5Bytes(blob))
  };
}
function spkiBitString(der){
  var seq=derRead(der,0);
  if(seq.error || seq.tag!==0x30) return null;
  var kids=derChildren(seq.content);
  if(!kids || kids.length<2) return null;
  var bs=kids[1];
  if(bs.tag!==0x03 || !bs.content.length) return null;
  return bs.content.slice(1);
}
function fingerprints(jwk){
  var out={}, pub=publicPart(jwk);
  var tp=thumbprint(pub);
  out.jwkThumb = tp.value || null;
  out.jwkThumbErr = tp.error || null;
  var spki=jwkToSpki(pub);
  if(spki.value){
    out.spkiPin='sha256/'+b64encode(sha256Bytes(spki.value));
    out.spkiSha256=colonHex(sha256Bytes(spki.value)).toUpperCase();
    var raw=spkiBitString(spki.value);
    out.x509Ski = raw ? toHex(sha1Bytes(raw)).toUpperCase() : null;
    out.spkiLen = spki.value.length;
  } else {
    out.spkiErr=spki.error;
  }
  var blob=jwkToSshBlob(pub);
  if(blob.value){
    var f=sshFingerprints(blob.value);
    out.sshSha256=f.sha256; out.sshMd5=f.md5; out.sshType=blob.type;
  } else {
    out.sshErr=blob.error;
  }
  return out;
}

/* ---- 配对校验 ---- */
function samePublic(a, b){
  var pa=publicPart(a), pb=publicPart(b);
  var ta=thumbprint(pa), tb=thumbprint(pb);
  if(ta.error) return {match:false, reason:'左边这把算不出指纹：'+ta.error};
  if(tb.error) return {match:false, reason:'右边这把算不出指纹：'+tb.error};
  if(ta.value===tb.value) return {match:true, thumbprint:ta.value, reason:'两边的 RFC 7638 指纹一致，是同一把密钥的公私两面。'};
  var why='指纹不同：'+ta.value+' ≠ '+tb.value;
  if(pa.kty!==pb.kty) why+='。kty 就已经不一样了（'+pa.kty+' vs '+pb.kty+'）';
  else if(pa.crv!==pb.crv) why+='。曲线不一样（'+pa.crv+' vs '+pb.crv+'）';
  return {match:false, reason:why};
}

/* ---- 全格式导出 ---- */
function allFormats(jwk, comment){
  var out={}, pub=publicPart(jwk), priv=hasPrivate(jwk);
  out.hasPrivate=!!priv;
  out.alg=algOf(pub);
  out.spec=out.alg?KP_ALGS[out.alg]:null;
  out.jwkPublic=JSON.stringify(pub,null,2);
  if(priv) out.jwkPrivate=JSON.stringify(jwk,null,2);
  var spki=jwkToSpki(pub);
  if(spki.value){ out.derPublic=spki.value; out.pemPublic=pemWrap('PUBLIC KEY',spki.value); }
  else out.pemPublicErr=spki.error;
  if(priv){
    var p8=jwkToPkcs8(jwk);
    if(p8.value){ out.derPrivate=p8.value; out.pemPrivate=pemWrap('PRIVATE KEY',p8.value); }
    else out.pemPrivateErr=p8.error;
  }
  var ssh=jwkToOpenssh(pub, comment);
  if(ssh.value){ out.openssh=ssh.value; out.sshType=ssh.type; }
  else out.opensshErr=ssh.error;
  out.fingerprints=fingerprints(pub);
  return out;
}

/* ---- 生成命令 ---- */
function genCommands(algKey, opts){
  opts=opts||{};
  var spec=KP_ALGS[algKey];
  if(!spec) return [];
  var comment=opts.comment||'you@example.com';
  var f=opts.file||'key';
  var cmds=[];
  function add(tool, cmd, note){ cmds.push({tool:tool, cmd:cmd, note:note}); }
  if(algKey==='ed25519'){
    add('ssh-keygen','ssh-keygen -t ed25519 -a 100 -C "'+comment+'" -f '+f,
        '-a 100 是 KDF 轮数，只影响私钥文件的口令保护强度，不影响密钥本身。');
    add('openssl','openssl genpkey -algorithm ed25519 -out '+f+'.pem',
        'OpenSSL 3.x 直出 PKCS#8，不需要再 -topk8。');
  } else if(algKey==='x25519'){
    add('openssl','openssl genpkey -algorithm x25519 -out '+f+'.pem',
        'X25519 只能做 ECDH，ssh-keygen 不会生成它。');
  } else if(algKey.indexOf('p')===0){
    var oname={p256:'prime256v1', p384:'secp384r1', p521:'secp521r1'}[algKey];
    var sshb={p256:256, p384:384, p521:521}[algKey];
    add('openssl','openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:'+oname+' -out '+f+'.pem',
        'OpenSSL 里 P-256 叫 prime256v1，这个别名坑过很多人。');
    add('ssh-keygen','ssh-keygen -t ecdsa -b '+sshb+' -C "'+comment+'" -f '+f, null);
  } else {
    var bits={rsa2048:2048, rsa3072:3072, rsa4096:4096}[algKey];
    add('openssl','openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:'+bits+' -out '+f+'.pem',
        '别再用 openssl genrsa，它默认吐 PKCS#1，很多语言的库读不了。');
    add('ssh-keygen','ssh-keygen -t rsa -b '+bits+' -C "'+comment+'" -f '+f, null);
  }
  add('导出公钥','openssl pkey -in '+f+'.pem -pubout -out '+f+'.pub.pem', null);
  if(spec.ssh)
    add('PEM → OpenSSH','ssh-keygen -y -f '+f+'.pem > '+f+'.pub',
        'ssh-keygen -y 要求私钥文件权限是 600，否则直接拒绝读。');
  add('转 PKCS#8','openssl pkcs8 -topk8 -nocrypt -in '+f+'.pem -out '+f+'.p8.pem',
      '已经是 PKCS#8 时这条是幂等的，Java / Go 只认这个格式。');
  if(spec.ssh)
    add('SSH 指纹','ssh-keygen -lf '+f+'.pub', '输出的 SHA256: 值应与本页算出的一致。');
  add('证书固定指纹',
      'openssl pkey -pubin -in '+f+'.pub.pem -outform der | openssl dgst -sha256 -binary | openssl base64',
      '这就是 HPKP / 移动端证书固定用的那个 sha256/ 值。');
  return cmds;
}

/* ---- 选型建议 ---- */
var KP_SCENES = {
  ssh:      {label:'SSH 登录与部署', pick:'ed25519', also:['p256'], avoid:['rsa2048','x25519'],
             why:'OpenSSH 8.2 起 ed25519 是默认推荐；密钥短到能直接贴进配置文件，且没有曲线参数可以选错。'},
  jwt:      {label:'JWT / OIDC 签名', pick:'ed25519', also:['p256','rsa2048'],
             avoid:[],
             why:'新系统首选 EdDSA；若验证方是老 Java 或第三方 IdP，退回 ES256，再不行才用 RS256。'},
  tls:      {label:'TLS 服务器证书', pick:'p256', also:['rsa2048','p384'], avoid:['ed25519','x25519'],
             why:'截至 2026 年主流公共 CA 仍不签发 Ed25519 证书，P-256 是握手最快又全兼容的选择。'},
  device:   {label:'嵌入式 / IoT 设备', pick:'ed25519', also:['p256'], avoid:['rsa3072','rsa4096'],
             why:'RSA 在 MCU 上生成一次密钥可能要几十秒，Ed25519 是毫秒级，栈占用也小一个量级。'},
  longterm: {label:'离线根密钥 / CA', pick:'p384', also:['rsa4096','ed25519'], avoid:[],
             why:'根密钥要活十几年，选强度冗余大的；同时确认你的 HSM 支持——很多 HSM 至今不支持 Ed25519。'},
  exchange: {label:'密钥协商 / 加密信封', pick:'x25519', also:['p256'], avoid:['ed25519','rsa2048'],
             why:'签名密钥和协商密钥必须分开。Ed25519 与 X25519 数学上相关但用途不可互换。'}
};
function advise(scene){
  var s=KP_SCENES[scene];
  if(!s) return {error:'没有这个场景'};
  function line(k, tone){
    var a=KP_ALGS[k];
    return {alg:k, label:a.label, tone:tone, bits:a.sec+' 位安全强度', good:a.good, bad:a.bad};
  }
  var rows=[line(s.pick,'ok')];
  for(var i=0;i<s.also.length;i++) rows.push(line(s.also[i],'info'));
  for(var j=0;j<s.avoid.length;j++) rows.push(line(s.avoid[j],'warn'));
  return {label:s.label, why:s.why, rows:rows};
}

/* ---- 输入识别 ---- */
function detectKey(text){
  var t=String(text||'').replace(/^\uFEFF/,'').trim();
  if(!t) return {error:'输入是空的'};
  if(/-----BEGIN [A-Z0-9 ]+-----/.test(t)){
    var r=pemToJwk(t);
    if(r.error) return {error:r.error};
    return {value:r.value, from:'PEM'};
  }
  if(/^(ssh-|ecdsa-sha2-|sk-)/.test(t) || /\s(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp\d+)\s/.test(t)){
    var s=opensshToJwk(t.split(/\r?\n/)[0]);
    if(s.error) return {error:s.error};
    return {value:s.value, from:'OpenSSH', comment:s.comment};
  }
  if(t.charAt(0)==='{'){
    var j=jsonParse(t);
    if(j.error) return {error:j.error};
    var o=j.value;
    if(o && o.keys && o.keys.length) return {value:o.keys[0], from:'JWKS 的第一把'};
    return {value:o, from:'JWK'};
  }
  if(/^[0-9a-fA-F\s]+$/.test(t) && t.replace(/\s/g,'').length>=40){
    try {
      var der=fromHex(t.replace(/\s/g,''));
      var k=spkiToJwk(der);
      if(k.value) return {value:k.value, from:'DER（hex）'};
      var k2=pkcs8ToJwk(der);
      if(k2.value) return {value:k2.value, from:'DER（hex，PKCS#8）'};
      return {error:k.error};
    } catch(e){ return {error:'hex 解不开：'+e.message}; }
  }
  return {error:'认不出输入格式。支持 PEM、JWK/JWKS、OpenSSH 单行公钥，以及 DER 的十六进制。'};
}

var KeypairForgePure = {
  KP_ALGS:KP_ALGS, KP_SCENES:KP_SCENES, algOf:algOf,
  mpint:mpint, jwkToSshBlob:jwkToSshBlob, sshBlobToJwk:sshBlobToJwk,
  opensshToJwk:opensshToJwk, jwkToOpenssh:jwkToOpenssh, sshTypeOf:sshTypeOf,
  sshFingerprints:sshFingerprints, fingerprints:fingerprints, spkiBitString:spkiBitString,
  samePublic:samePublic, allFormats:allFormats, genCommands:genCommands, advise:advise,
  detectKey:detectKey, padLeft:padLeft, stripLeadZero:stripLeadZero,
  publicPart:publicPart, hasPrivate:hasPrivate, thumbprint:thumbprint, keyBits:keyBits,
  jwkToSpki:jwkToSpki, jwkToPkcs8:jwkToPkcs8, spkiToJwk:spkiToJwk, pkcs8ToJwk:pkcs8ToJwk,
  pemToJwk:pemToJwk, jwkToPem:jwkToPem, jsonParse:jsonParse,
  b64url:b64url, b64encode:b64encode, b64decode:b64decode, toHex:toHex, fromHex:fromHex,
  colonHex:colonHex, sha256Bytes:sha256Bytes, sha1Bytes:sha1Bytes, md5Bytes:md5Bytes,
  utf8Bytes:utf8Bytes, bytesToUtf8:bytesToUtf8, pemWrap:pemWrap, pemUnwrap:pemUnwrap, bitLen:bitLen
};
if (typeof module !== 'undefined' && module.exports) module.exports = KeypairForgePure;
if (typeof window !== 'undefined') window.KeypairForgePure = KeypairForgePure;

</script>
<script>
(function(){
  if(typeof window==='undefined' || !window.document) return;
  var P=window.KeypairForgePure;
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var TONE={ok:'var(--ok)', warn:'var(--warn)', info:'var(--info)'};

  var state={jwk:null, alg:'ed25519', fmt:'openssh', formats:null, scene:'ssh'};

  /* ---------- 算法选择 ---------- */
  function renderAlgs(){
    var keys=Object.keys(P.KP_ALGS), h='';
    for(var i=0;i<keys.length;i++){
      var k=keys[i], a=P.KP_ALGS[k], on=(k===state.alg);
      h+='<div class="line pick'+(on?' on':'')+'" data-alg="'+k+'" role="button" tabindex="0">'+
         '<span class="tag"'+(on?' style="color:var(--accent);border-color:var(--accent)"':'')+'>'+esc(a.label)+'</span>'+
         '<span class="mono" style="color:var(--muted)">'+a.sec+' 位强度</span>'+
         '<div style="margin-top:4px">'+esc(a.good)+'</div>'+
         '<div style="margin-top:2px;color:var(--muted)">'+esc(a.bad)+'</div></div>';
    }
    $('kp_algs').innerHTML=h;
  }
  $('kp_algs').addEventListener('click', function(e){
    var t=e.target;
    while(t && t!==this && !t.getAttribute('data-alg')) t=t.parentNode;
    if(!t || t===this) return;
    state.alg=t.getAttribute('data-alg');
    renderAlgs(); renderCmds();
  });

  /* ---------- WebCrypto 生成 ---------- */
  var WC_PARAMS={
    ed25519:{name:'Ed25519'},
    x25519:{name:'X25519'},
    p256:{name:'ECDSA', namedCurve:'P-256'},
    p384:{name:'ECDSA', namedCurve:'P-384'},
    p521:{name:'ECDSA', namedCurve:'P-521'},
    rsa2048:{name:'RSASSA-PKCS1-v1_5', modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256'},
    rsa3072:{name:'RSASSA-PKCS1-v1_5', modulusLength:3072, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256'},
    rsa4096:{name:'RSASSA-PKCS1-v1_5', modulusLength:4096, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256'}
  };
  function usagesFor(k){
    if(k==='x25519') return ['deriveBits'];
    return ['sign','verify'];
  }
  $('kp_gen').addEventListener('click', function(){
    var msg=$('kp_genmsg'), btn=this;
    var subtle = window.crypto && window.crypto.subtle;
    if(!subtle){
      msg.textContent='这个浏览器没有 WebCrypto（多半是用 http:// 而不是 https:// 或 file:// 打开的）。可以改用下面的命令在本地生成，再把结果贴回来。';
      return;
    }
    var p=WC_PARAMS[state.alg];
    msg.textContent='生成中…'+(state.alg.indexOf('rsa')===0?'（RSA 可能要几秒）':'');
    btn.disabled=true;
    var t0=Date.now();
    Promise.resolve()
      .then(function(){ return subtle.generateKey(p, true, usagesFor(state.alg)); })
      .then(function(kp){ return subtle.exportKey('jwk', kp.privateKey); })
      .then(function(jwk){
        delete jwk.key_ops; delete jwk.ext;
        state.jwk=jwk;
        msg.textContent='生成完毕，用时 '+(Date.now()-t0)+' ms。私钥只存在于这个页面的内存里，刷新就没了——需要就先复制走。';
        msg.style.color='var(--ok)';
        $('kp_in').value=JSON.stringify(jwk,null,2);
        refresh();
      })
      .catch(function(e){
        msg.style.color='';
        var name=(e&&e.name)||'';
        if(name==='NotSupportedError' || /not supported|unsupported/i.test(String(e&&e.message)))
          msg.textContent='这个浏览器的 WebCrypto 还不支持 '+P.KP_ALGS[state.alg].label+
            '（Ed25519/X25519 在部分版本里需要手动开启）。用下面的 openssl 命令生成后贴回来，其余功能照常。';
        else msg.textContent='生成失败：'+(e&&e.message||e);
      })
      .then(function(){ btn.disabled=false; });
  });

  /* ---------- 解析 ---------- */
  function parseIn(){
    var r=P.detectKey($('kp_in').value);
    if(r.error){ $('kp_err').textContent=r.error; state.jwk=null; blank(); return; }
    $('kp_err').textContent='';
    state.jwk=r.value;
    if(r.comment && !$('kp_comment').value) $('kp_comment').value=r.comment;
    var a=P.algOf(r.value);
    if(a){ state.alg=a; renderAlgs(); }
    refresh();
  }
  function blank(){
    ['kp_sum','kp_fp','kp_tabs','kp_cmds'].forEach(function(id){
      if(id!=='kp_cmds') $(id).innerHTML='';
    });
    $('kp_fmt').value=''; $('kp_match').innerHTML='';
  }

  /* ---------- 概览 ---------- */
  function cell(k,v,tone){
    return '<div class="cell"><div class="k">'+esc(k)+'</div><div class="v"'+
      (tone?' style="color:'+tone+'"':'')+'>'+esc(v)+'</div></div>';
  }
  function renderSum(){
    var j=state.jwk, f=state.formats;
    var spec=f.spec, priv=P.hasPrivate(j);
    $('kp_sum').innerHTML=
      cell('算法', spec?spec.label:(j.kty||'未知')) +
      cell('安全强度', spec?spec.sec+' 位':'—') +
      cell('手上这份', priv?'私钥（含 '+priv+'）':'只有公钥', priv?'var(--warn)':'var(--ok)') +
      cell('SSH 类型', f.sshType||'不适用') +
      cell('JWS alg', spec&&spec.jwsAlg?spec.jwsAlg:'不能签名') +
      cell('公钥 DER', f.derPublic?f.derPublic.length+' 字节':'—');
  }

  /* ---------- 指纹 ---------- */
  var FP_NOTE=[
    ['sshSha256','SSH 指纹','首次 ssh 连接时终端问你 "Are you sure…" 的那一串，和 ssh-keygen -lf 一致'],
    ['jwkThumb','JWK 指纹','RFC 7638，OIDC / JWKS 里 kid 的标准取值'],
    ['spkiPin','证书固定值','HPKP 与移动端 pinning 用的 sha256/，只认公钥所以换证书不换密钥时不会失效'],
    ['x509Ski','X.509 SKI','证书里 Subject Key Identifier 扩展的值，用来把证书链串起来'],
    ['sshMd5','SSH 旧指纹','OpenSSH 6.8 之前的显示格式，只有对老系统时才需要']
  ];
  function renderFp(){
    var f=state.formats.fingerprints, h='';
    for(var i=0;i<FP_NOTE.length;i++){
      var k=FP_NOTE[i][0], v=f[k];
      if(!v) continue;
      h+='<div class="line"><span class="tag">'+esc(FP_NOTE[i][1])+'</span>'+
         '<span style="color:var(--muted)">'+esc(FP_NOTE[i][2])+'</span>'+
         '<div class="mono" style="margin-top:4px;word-break:break-all">'+esc(v)+'</div></div>';
    }
    if(f.sshErr) h+='<div class="line"><span class="tag" style="color:var(--info);border-color:var(--info)">没有 SSH 指纹</span>'+esc(f.sshErr)+'</div>';
    if(f.jwkThumbErr) h+='<div class="line"><span class="tag" style="color:var(--warn);border-color:var(--warn)">没有 JWK 指纹</span>'+esc(f.jwkThumbErr)+'</div>';
    $('kp_fp').innerHTML=h;
  }

  /* ---------- 六种形态 ---------- */
  var FORMATS=[
    ['openssh','OpenSSH 公钥','id.pub'],
    ['pemPublic','PEM 公钥 (SPKI)','key.pub.pem'],
    ['pemPrivate','PEM 私钥 (PKCS#8)','key.pem'],
    ['jwkPublic','JWK 公钥','key.pub.json'],
    ['jwkPrivate','JWK 私钥','key.json'],
    ['derHex','DER 公钥 (hex)','key.der.txt']
  ];
  function fmtValue(k){
    var f=state.formats;
    if(k==='derHex') return f.derPublic?P.toHex(f.derPublic):null;
    return f[k]||null;
  }
  function renderTabs(){
    var h='', f=state.formats, first=null;
    for(var i=0;i<FORMATS.length;i++){
      var k=FORMATS[i][0], v=fmtValue(k);
      var errKey={openssh:'opensshErr', pemPublic:'pemPublicErr', pemPrivate:'pemPrivateErr'}[k];
      var err=errKey?f[errKey]:null;
      if(!v && !err) continue;
      if(!first && v) first=k;
      var on=(k===state.fmt && v);
      h+='<button class="ghost'+(on?' on':'')+'" data-fmt="'+k+'"'+(v?'':' disabled title="'+esc(err||'不适用')+'"')+'>'+
         esc(FORMATS[i][1])+'</button>';
    }
    $('kp_tabs').innerHTML=h;
    if(!fmtValue(state.fmt)) state.fmt=first||'jwkPublic';
    showFmt();
  }
  function showFmt(){
    var v=fmtValue(state.fmt);
    var f=state.formats;
    if(!v){
      var errKey={openssh:'opensshErr', pemPublic:'pemPublicErr', pemPrivate:'pemPrivateErr'}[state.fmt];
      $('kp_fmt').value=(errKey&&f[errKey])?('这一格不适用：'+f[errKey]):'（这把密钥没有这个形态）';
      return;
    }
    $('kp_fmt').value=v;
    var btns=$('kp_tabs').getElementsByTagName('button');
    for(var i=0;i<btns.length;i++)
      btns[i].className='ghost'+(btns[i].getAttribute('data-fmt')===state.fmt?' on':'');
  }
  $('kp_tabs').addEventListener('click', function(e){
    var k=e.target.getAttribute && e.target.getAttribute('data-fmt');
    if(!k || e.target.disabled) return;
    state.fmt=k; showFmt();
  });

  /* ---------- 配对 ---------- */
  function renderMatch(){
    var txt=$('kp_other').value.trim(), box=$('kp_match');
    if(!txt || !state.jwk){ box.innerHTML=''; return; }
    var o=P.detectKey(txt);
    if(o.error){ box.innerHTML='<div class="line" style="color:var(--warn)">'+esc(o.error)+'</div>'; return; }
    var r=P.samePublic(state.jwk, o.value);
    box.innerHTML='<div class="line"><span class="tag" style="color:'+(r.match?'var(--ok)':'var(--warn)')+
      ';border-color:'+(r.match?'var(--ok)':'var(--warn)')+'">'+(r.match?'是同一把':'对不上')+'</span>'+esc(r.reason)+'</div>';
  }

  /* ---------- 命令 ---------- */
  function renderCmds(){
    var c=P.genCommands(state.alg, {comment:$('kp_comment').value||'you@example.com', file:'id_'+state.alg});
    var h='';
    for(var i=0;i<c.length;i++){
      h+='<div class="line"><span class="tag">'+esc(c[i].tool)+'</span>'+
         '<div class="mono" style="margin-top:4px;word-break:break-all">'+esc(c[i].cmd)+'</div>'+
         (c[i].note?'<div style="margin-top:2px;color:var(--muted)">'+esc(c[i].note)+'</div>':'')+'</div>';
    }
    $('kp_cmds').innerHTML=h;
  }

  /* ---------- 场景建议 ---------- */
  function renderScenes(){
    var keys=Object.keys(P.KP_SCENES), h='';
    for(var i=0;i<keys.length;i++)
      h+='<button class="ghost'+(keys[i]===state.scene?' on':'')+'" data-scene="'+keys[i]+'">'+
         esc(P.KP_SCENES[keys[i]].label)+'</button>';
    $('kp_scenes').innerHTML=h;
    renderAdvice();
  }
  function renderAdvice(){
    var a=P.advise(state.scene);
    if(a.error){ $('kp_advice').innerHTML=''; return; }
    var h='<div class="line" style="color:var(--muted)">'+esc(a.why)+'</div>';
    var word={ok:'就用它', info:'也行', warn:'别用'};
    for(var i=0;i<a.rows.length;i++){
      var r=a.rows[i];
      h+='<div class="line"><span class="tag" style="color:'+TONE[r.tone]+';border-color:'+TONE[r.tone]+'">'+
         word[r.tone]+'</span><b>'+esc(r.label)+'</b> · '+esc(r.bits)+
         '<div style="margin-top:2px;color:var(--muted)">'+esc(r.tone==='warn'?r.bad:r.good)+'</div></div>';
    }
    $('kp_advice').innerHTML=h;
  }
  $('kp_scenes').addEventListener('click', function(e){
    var s=e.target.getAttribute && e.target.getAttribute('data-scene');
    if(!s) return;
    state.scene=s; renderScenes();
  });

  /* ---------- 汇总刷新 ---------- */
  function refresh(){
    if(!state.jwk){ blank(); return; }
    state.formats=P.allFormats(state.jwk, $('kp_comment').value);
    renderSum(); renderFp(); renderTabs(); renderMatch(); renderCmds();
  }

  function copy(text, btn){
    if(!text) return;
    var ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.position='absolute'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta);
    if(btn){ var t=btn.textContent; btn.textContent='已复制'; setTimeout(function(){ btn.textContent=t; },1200); }
  }

  $('kp_parse').addEventListener('click', parseIn);
  $('kp_in').addEventListener('input', parseIn);
  $('kp_other').addEventListener('input', renderMatch);
  $('kp_comment').addEventListener('input', function(){ if(state.jwk) refresh(); else renderCmds(); });
  $('kp_clear').addEventListener('click', function(){ $('kp_in').value=''; parseIn(); });
  $('kp_copy').addEventListener('click', function(){ copy($('kp_fmt').value, this); });
  $('kp_dl').addEventListener('click', function(){
    var v=$('kp_fmt').value; if(!v) return;
    var name='key.txt';
    for(var i=0;i<FORMATS.length;i++) if(FORMATS[i][0]===state.fmt) name=FORMATS[i][2];
    var b=new Blob([v],{type:'text/plain'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); },0);
  });

  renderAlgs(); renderScenes(); parseIn();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
