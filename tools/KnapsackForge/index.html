<div class="app">
  <h1>KnapsackForge</h1>
  <p class="sub">0/1 背包问题：动态规划表格逐行填充可视化，回溯高亮选中物品，贪心对比，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<label>物品（每行：名称,重量,价值）</label>
<textarea id="items" rows="6">水壶,3,10
干粮,4,40
地图,1,15
帐篷,7,50
相机,2,30
绳索,3,25</textarea>
<label>背包容量</label>
<input id="cap" type="number" value="10" min="1" max="60">
<div class="row">
  <button id="solve">求解</button>
</div>
<div id="result" style="margin-top:10px;"></div>
<div class="err" id="err"></div>
<div id="table" style="margin-top:12px;overflow:auto;font-family:ui-monospace,monospace;font-size:11px;"></div>
<script>
function ksParse(text){
  var items = [], lines = String(text||'').split(/\n/);
  for(var i=0;i<lines.length;i++){
    var s = lines[i].trim();
    if(!s) continue;
    var p = s.split(/[,\uFF0C]/).map(function(x){ return x.trim(); });
    if(p.length < 3) return { error: '第 ' + (i+1) + ' 行格式错误（需：名称,重量,价值）' };
    var wt = Number(p[1]), val = Number(p[2]);
    if(!isFinite(wt) || !isFinite(val) || wt <= 0 || val < 0) return { error: '第 ' + (i+1) + ' 行数值非法' };
    items.push({ name: p[0], w: wt, v: val });
  }
  if(!items.length) return { error: '至少需要一件物品' };
  return { items: items };
}
function ksSolve(items, cap){
  var n = items.length, W = Math.floor(cap);
  var dp = [];
  for(var i=0;i<=n;i++){ dp.push(new Array(W+1).fill(0)); }
  for(var i=1;i<=n;i++){
    var it = items[i-1];
    for(var w=0;w<=W;w++){
      dp[i][w] = dp[i-1][w];
      if(it.w <= w){
        var cand = dp[i-1][w - it.w] + it.v;
        if(cand > dp[i][w]) dp[i][w] = cand;
      }
    }
  }
  var picked = [], w = W;
  for(var i=n;i>=1;i--){
    if(dp[i][w] !== dp[i-1][w]){ picked.push(i-1); w -= items[i-1].w; }
  }
  picked.reverse();
  return { best: dp[n][W], dp: dp, picked: picked };
}
function ksGreedy(items, cap){
  var idx = items.map(function(_, i){ return i; });
  idx.sort(function(a, b){ return items[b].v/items[b].w - items[a].v/items[a].w || a - b; });
  var total = 0, wsum = 0, picked = [];
  for(var k=0;k<idx.length;k++){
    var it = items[idx[k]];
    if(wsum + it.w <= cap){ wsum += it.w; total += it.v; picked.push(idx[k]); }
  }
  return { best: total, picked: picked.sort(function(a,b){ return a-b; }) };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { ksParse:ksParse, ksSolve:ksSolve, ksGreedy:ksGreedy };
}
if (typeof window !== 'undefined') {
  window.KnapsackForgePure = { ksParse:ksParse, ksSolve:ksSolve, ksGreedy:ksGreedy };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.KnapsackForgePure;
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function solve(){
      var pr = P.ksParse($('items').value);
      if(pr.error){ $('err').textContent = pr.error; $('result').innerHTML=''; $('table').innerHTML=''; return; }
      $('err').textContent = '';
      var cap = Math.max(1, Math.min(60, Number($('cap').value)||10));
      var r = P.ksSolve(pr.items, cap);
      var g = P.ksGreedy(pr.items, cap);
      var names = r.picked.map(function(i){ return '<span style="background:#10B98122;border:1px solid #10B98166;color:#10B981;border-radius:6px;padding:2px 8px;margin:2px;display:inline-block;">' + esc(pr.items[i].name) + ' (' + pr.items[i].w + 'kg/' + pr.items[i].v + ')</span>'; }).join('');
      $('result').innerHTML = '<b style="color:#FFF;">DP 最优 = ' + r.best + '</b>（贪心按性价比 = ' + g.best + (g.best < r.best ? '，<span style="color:#F5A623;">贪心非最优！</span>' : '') + '）<br>' + names;
      var W = Math.floor(cap), pickSet = {};
      r.picked.forEach(function(i){ pickSet[i+1] = true; });
      var h = '<table style="border-collapse:collapse;"><tr><th style="padding:3px 6px;color:#71717A;">i\\w</th>';
      for(var w=0;w<=W;w++) h += '<th style="padding:3px 6px;color:#71717A;">' + w + '</th>';
      h += '</tr>';
      for(var i=0;i<=pr.items.length;i++){
        h += '<tr><td style="padding:3px 6px;color:' + (pickSet[i]?'#10B981':'#A1A1AA') + ';">' + (i===0?'-':esc(pr.items[i-1].name)) + '</td>';
        for(var w=0;w<=W;w++){
          var hot = i>0 && r.dp[i][w] !== r.dp[i-1][w];
          h += '<td style="padding:3px 6px;text-align:center;border:1px solid rgba(255,255,255,.06);color:' + (hot?'#22D3EE':'#71717A') + ';">' + r.dp[i][w] + '</td>';
        }
        h += '</tr>';
      }
      $('table').innerHTML = h + '</table>';
    }
    $('solve').addEventListener('click', solve);
    solve();
  })();
}
</script>
