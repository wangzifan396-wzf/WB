/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{

button{border-radius:var(--r-sm);letter-spacing:-.01em;

button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}

<body>
<div class="app">
  <h1>MetronomeForge</h1>
  <p class="sub">节拍器：BPM 30-260、多拍号强弱拍、WebAudio 前瞻调度精准发声、Tap Tempo 敲击测速，视觉节拍灯，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <label style="margin:0">BPM</label>
  <input id="bpm" type="number" value="120" min="30" max="260" style="width:80px">
  <label style="margin:0">拍号</label>
  <select id="sig">
    <option value="4" selected>4/4</option>
    <option value="3">3/4</option>
    <option value="2">2/4</option>
    <option value="6">6/8</option>
  </select>
  <button id="toggle">开始/停止</button>
  <button id="tap" class="ghost">Tap</button>
  <span class="sub" id="stat" style="margin:0"></span>
</div>
<div id="lights" style="display:flex;gap:10px;"></div>
<script>
function mtInterval(bpm){
  var b=Number(bpm);
  if(!isFinite(b)) b=120;
  b=Math.min(260,Math.max(30,b));
  return 60/b;
}
function mtClampBpm(bpm){ var b=Number(bpm); if(!isFinite(b)) b=120; return Math.min(260,Math.max(30,Math.round(b))); }
function mtAccent(beatIndex, beatsPerBar){
  var bpb=Math.max(1,Math.floor(beatsPerBar)||4);
  var i=((Math.floor(beatIndex)%bpb)+bpb)%bpb;
  return i===0 ? 'strong' : (bpb===6 && i===3 ? 'medium' : 'weak');
}
function mtFreq(accent){ return accent==='strong'?1568:accent==='medium'?1175:880; }
function mtTap(times){
  var ts=(times||[]).slice(-6);
  if(ts.length<2) return null;
  var gaps=[];
  for(var i=1;i<ts.length;i++){
    var g=ts[i]-ts[i-1];
    if(g>0 && g<3000) gaps.push(g);
  }
  if(!gaps.length) return null;
  var avg=gaps.reduce(function(a,b){return a+b;},0)/gaps.length;
  return mtClampBpm(60000/avg);
}
function mtSchedule(nextTime, currentTime, lookahead, interval){
  var out=[];
  var t=nextTime;
  while(t < currentTime + lookahead){ out.push(Math.round(t*1000)/1000); t+=interval; }
  return { beats:out, nextTime:t };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { mtInterval:mtInterval, mtClampBpm:mtClampBpm, mtAccent:mtAccent, mtFreq:mtFreq, mtTap:mtTap, mtSchedule:mtSchedule };
}
if (typeof window !== 'undefined') {
  window.MetronomeForgePure = { mtInterval:mtInterval, mtClampBpm:mtClampBpm, mtAccent:mtAccent, mtFreq:mtFreq, mtTap:mtTap, mtSchedule:mtSchedule };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.MetronomeForgePure;
    var actx=null, running=false, nextTime=0, beat=0, timer=null, taps=[];
    function lights(){
      var bpb=Number($('sig').value)||4;
      var el=$('lights'); el.innerHTML='';
      for(var i=0;i<bpb;i++){
        var d=document.createElement('div');
        d.id='li'+i;
        d.style.cssText='width:26px;height:26px;border-radius:50%;background:#26272B;border:1px solid rgba(255,255,255,.08);transition:background .05s;';
        el.appendChild(d);
      }
    }
    function flash(i,acc){
      var bpb=Number($('sig').value)||4;
      for(var k=0;k<bpb;k++){ var d=$('li'+k); if(d) d.style.background='#26272B'; }
      var el=$('li'+i);
      if(el) el.style.background = acc==='strong'?'#F5A623':acc==='medium'?'#5E6AD2':'#22D3EE';
    }
    function tick(){
      if(!running || !actx) return;
      var bpm=P.mtClampBpm($('bpm').value);
      var bpb=Number($('sig').value)||4;
      var sch=P.mtSchedule(nextTime, actx.currentTime, 0.12, P.mtInterval(bpm));
      nextTime=sch.nextTime;
      sch.beats.forEach(function(t){
        var acc=P.mtAccent(beat,bpb);
        try{
          var osc=actx.createOscillator(), g=actx.createGain();
          osc.frequency.value=P.mtFreq(acc);
          g.gain.setValueAtTime(acc==='strong'?0.5:0.28, t);
          g.gain.exponentialRampToValueAtTime(0.001, t+0.06);
          osc.connect(g); g.connect(actx.destination);
          osc.start(t); osc.stop(t+0.07);
        }catch(e){}
        var bi=beat % bpb, a2=acc;
        setTimeout(function(){ flash(bi,a2); }, Math.max(0,(t-actx.currentTime)*1000));
        beat++;
      });
      timer=setTimeout(tick, 30);
    }
    $('toggle').addEventListener('click', function(){
      if(running){ running=false; if(timer) clearTimeout(timer); $('stat').textContent='已停止'; return; }
      try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ $('stat').textContent='WebAudio 不可用（逻辑仍可测）'; }
      running=true; beat=0;
      nextTime = actx ? actx.currentTime+0.05 : 0;
      $('stat').textContent=P.mtClampBpm($('bpm').value)+' BPM';
      if(actx) tick();
    });
    $('tap').addEventListener('click', function(){
      taps.push(Date.now());
      var bpm=P.mtTap(taps);
      if(bpm){ $('bpm').value=bpm; $('stat').textContent='Tap: '+bpm+' BPM'; }
      else { $('stat').textContent='继续敲…'; }
    });
    $('sig').addEventListener('change', lights);
    lights();
  })();
}
</script>
