<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>ColorContrastForge — WCAG 对比度检查：前景/背景相对亮度与 AA/AAA 评级。</title>
<meta property="og:title" content="ColorContrastForge">
<meta property="og:description" content="WCAG 对比度检查：相对亮度与 AA/AAA 评级，离线可用">
<meta property="og:image" content="./og.png">
<meta name="description" content="WCAG 对比度检查：相对亮度与 AA/AAA 评级，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>ColorContrastForge</h1>
  <p class="sub">WCAG 对比度检查：相对亮度计算、对比度比值、AA/AAA 与大字规则评级、实时预览 · 单文件 · 零依赖 · 本地优先</p>

<label>前景色</label>
<input type="text" id="fg" value="#111111" style="max-width:160px" spellcheck="false">
<label>背景色</label>
<input type="text" id="bg" value="#FFFFFF" style="max-width:160px" spellcheck="false">
<div class="row"><button id="run">计算对比度</button></div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>
<div class="out" id="preview" style="display:flex;align-items:center;justify-content:center;height:90px;font-size:22px;font-weight:600;border-radius:8px"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 328 款工具 &rarr;</a></footer>
</div>
<script>

function ccParseColor(str){
  str=String(str||'').trim();
  var m;
  if((m=str.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i))){
    var h=m[1];
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return {r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16)};
  }
  if((m=str.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i))){
    return {r:+m[1], g:+m[2], b:+m[3]};
  }
  return null;
}
function ccLin(c){
  c=c/255;
  return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
}
function ccLum(c){
  return 0.2126*ccLin(c.r)+0.7152*ccLin(c.g)+0.0722*ccLin(c.b);
}
function ccContrast(fg, bg){
  var l1=ccLum(fg), l2=ccLum(bg);
  var hi=Math.max(l1,l2), lo=Math.min(l1,l2);
  return Math.round((hi+0.05)/(lo+0.05)*100)/100;
}
function ccLevel(ratio){
  return { AA: ratio>=4.5, AALarge: ratio>=3, AAA: ratio>=7, AAALarge: ratio>=4.5 };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { ccParseColor:ccParseColor, ccLum:ccLum, ccContrast:ccContrast, ccLevel:ccLevel };
}
if (typeof window !== 'undefined') {
  window.ColorContrastForgePure = { ccParseColor:ccParseColor, ccLum:ccLum, ccContrast:ccContrast, ccLevel:ccLevel };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.ColorContrastForgePure;
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function run(){
    var fg=P.ccParseColor($('fg').value), bg=P.ccParseColor($('bg').value);
    if(!fg || !bg){ $('err').textContent='颜色格式应为 #hex 或 rgb(r,g,b)'; $('out').innerHTML=''; return; }
    var ratio=P.ccContrast(fg,bg), lv=P.ccLevel(ratio);
    $('err').textContent='';
    var g='<div class="grid">'+
      '<div class="kv"><b>对比度</b><span>'+ratio+':1</span></div>'+
      '<div class="kv"><b>WCAG AA</b><span>'+(lv.AA?'通过':'失败')+'</span></div>'+
      '<div class="kv"><b>WCAG AAA</b><span>'+(lv.AAA?'通过':'失败')+'</span></div>'+
      '<div class="kv"><b>大字 AA</b><span>'+(lv.AALarge?'通过':'失败')+'</span></div></div>';
    $('out').innerHTML=g;
    var pv=$('preview');
    pv.style.background='rgb('+bg.r+','+bg.g+','+bg.b+')';
    pv.style.color='rgb('+fg.r+','+fg.g+','+fg.b+')';
    pv.textContent='Aa 对比度 '+ratio+':1';
  }
  $('run').addEventListener('click', run);
  run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
