<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DockerForge — 离线 docker run 转 docker-compose 转换器</title>
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:110px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.preview{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:90px}
.preview svg{max-width:100%}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.big{font:40px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin:8px 0}
.kv{color:var(--muted);font-size:13px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
#nanoToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#1A1B1E;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:9px 16px;font-size:13px;line-height:1.4;letter-spacing:.01em;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;max-width:80vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#nanoToast.bad{border-color:rgba(239,68,68,.55)}
@media (prefers-reduced-motion:reduce){#nanoToast{transition:none}}

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5E6AD2">
<meta name="description" content="离线 docker run → docker-compose.yml 转换：支持 30+ 参数，YAML 安全转义。">
</head>
<body>
<div class="app">
  <h1>DockerForge</h1>
  <p class="sub">离线 docker run 转 docker-compose 转换器 · 单文件 · 零依赖 · 本地优先</p>

<label for="in">docker run 命令</label>
<textarea id="in" rows="5" placeholder="docker run -d --name web -p 8080:80 -v ./html:/usr/share/nginx/html -e TZ=Asia/Shanghai --restart unless-stopped nginx:alpine">docker run -d --name web -p 8080:80 -e TZ=Asia/Shanghai --restart unless-stopped nginx:alpine</textarea>
<div class="row">
  <button id="run">转换为 Compose</button>
  <button id="copy" class="ghost">复制结果</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>docker-compose.yml</label>
<div class="out" id="out" aria-live="polite">结果会显示在这里</div>
<script>
function tokenize(cmd){
  cmd=String(cmd||'').replace(/\\\r?\n/g,' ').trim();
  var out=[],cur='',q=null;
  for(var i=0;i<cmd.length;i++){
    var c=cmd[i];
    if(q){ if(c===q) q=null; else cur+=c; }
    else if(c==='"'||c==="'") q=c;
    else if(/\s/.test(c)){ if(cur){ out.push(cur); cur=''; } }
    else cur+=c;
  }
  if(cur) out.push(cur);
  return out;
}
var FLAG_ARG={'-p':1,'--publish':1,'-v':1,'--volume':1,'-e':1,'--env':1,'--name':1,'--restart':1,'--network':1,'--net':1,'--hostname':1,'-h':1,'--user':1,'-u':1,'-w':1,'--workdir':1,'--entrypoint':1,'--label':1,'-l':1,'--add-host':1,'--dns':1,'--env-file':1,'--memory':1,'-m':1,'--cpus':1,'--device':1,'--cap-add':1,'--cap-drop':1,'--health-cmd':1,'--log-driver':1,'--platform':1,'--pull':1,'--shm-size':1,'--expose':1};
var FLAG_BOOL={'-d':1,'--detach':1,'-i':1,'--interactive':1,'-t':1,'--tty':1,'--rm':1,'--privileged':1,'--init':1,'--read-only':1,'--no-healthcheck':1,'-P':1,'--publish-all':1};
function parseDockerRun(cmd){
  var t=tokenize(cmd);
  if(t[0]==='docker') t.shift();
  if(t[0]==='container') t.shift();
  if(t[0]==='run'||t[0]==='create') t.shift();
  var o={image:null,command:[],name:null,ports:[],volumes:[],env:[],restart:null,networks:[],hostname:null,user:null,workdir:null,entrypoint:null,labels:[],extraHosts:[],dns:[],envFiles:[],devices:[],capAdd:[],capDrop:[],privileged:false,readOnly:false,init:false,tty:false,stdinOpen:false,memory:null,cpus:null,platform:null,shmSize:null,expose:[],unknown:[]};
  var i=0;
  while(i<t.length){
    var a=t[i];
    if(o.image){ o.command.push(a); i++; continue; }
    if(a[0]!=='-'){ o.image=a; i++; continue; }
    var key=a,val=null,eq=a.indexOf('=');
    if(a.slice(0,2)==='--'&&eq>0){ key=a.slice(0,eq); val=a.slice(eq+1); }
    if(FLAG_BOOL[key]){
      if(key==='-d'||key==='--detach'){} 
      else if(key==='--rm'){}
      else if(key==='--privileged') o.privileged=true;
      else if(key==='--read-only') o.readOnly=true;
      else if(key==='--init') o.init=true;
      else if(key==='-t'||key==='--tty') o.tty=true;
      else if(key==='-i'||key==='--interactive') o.stdinOpen=true;
      i++; continue;
    }
    if(FLAG_ARG[key]){
      if(val===null){ val=t[i+1]; i+=2; } else i++;
      if(val===undefined){ o.unknown.push(key); break; }
      if(key==='-p'||key==='--publish') o.ports.push(val);
      else if(key==='-v'||key==='--volume') o.volumes.push(val);
      else if(key==='-e'||key==='--env') o.env.push(val);
      else if(key==='--name') o.name=val;
      else if(key==='--restart') o.restart=val;
      else if(key==='--network'||key==='--net') o.networks.push(val);
      else if(key==='--hostname'||key==='-h') o.hostname=val;
      else if(key==='--user'||key==='-u') o.user=val;
      else if(key==='-w'||key==='--workdir') o.workdir=val;
      else if(key==='--entrypoint') o.entrypoint=val;
      else if(key==='--label'||key==='-l') o.labels.push(val);
      else if(key==='--add-host') o.extraHosts.push(val);
      else if(key==='--dns') o.dns.push(val);
      else if(key==='--env-file') o.envFiles.push(val);
      else if(key==='--memory'||key==='-m') o.memory=val;
      else if(key==='--cpus') o.cpus=val;
      else if(key==='--device') o.devices.push(val);
      else if(key==='--cap-add') o.capAdd.push(val);
      else if(key==='--cap-drop') o.capDrop.push(val);
      else if(key==='--platform') o.platform=val;
      else if(key==='--shm-size') o.shmSize=val;
      else if(key==='--expose') o.expose.push(val);
      continue;
    }
    o.unknown.push(a); i++;
  }
  if(!o.image) throw new Error('未找到镜像名，请检查命令');
  return o;
}
function yq(s){
  s=String(s);
  if(/^[A-Za-z0-9._\/:@-]+$/.test(s)) return s;
  return '"'+s.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
}
function yqq(s){
  s=String(s);
  return '"'+s.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
}
function toCompose(cmd){
  var o=parseDockerRun(cmd);
  var svc=o.name||String(o.image).split(':')[0].split('/').pop().replace(/[^A-Za-z0-9_-]/g,'')||'app';
  var L=[];
  L.push('services:');
  L.push('  '+svc+':');
  L.push('    image: '+yq(o.image));
  if(o.name) L.push('    container_name: '+yq(o.name));
  if(o.platform) L.push('    platform: '+yq(o.platform));
  if(o.hostname) L.push('    hostname: '+yq(o.hostname));
  if(o.user) L.push('    user: '+yq(o.user));
  if(o.workdir) L.push('    working_dir: '+yq(o.workdir));
  if(o.entrypoint) L.push('    entrypoint: '+yq(o.entrypoint));
  if(o.restart) L.push('    restart: '+yq(o.restart));
  if(o.privileged) L.push('    privileged: true');
  if(o.readOnly) L.push('    read_only: true');
  if(o.init) L.push('    init: true');
  if(o.tty) L.push('    tty: true');
  if(o.stdinOpen) L.push('    stdin_open: true');
  if(o.memory) L.push('    mem_limit: '+yq(o.memory));
  if(o.cpus) L.push('    cpus: '+yq(o.cpus));
  if(o.shmSize) L.push('    shm_size: '+yq(o.shmSize));
  function list(kk,arr,force){ if(arr.length){ L.push('    '+kk+':'); arr.forEach(function(v){ L.push('      - '+(force?yqq(v):yq(v))); }); } }
  list('ports',o.ports,true);
  list('expose',o.expose);
  list('volumes',o.volumes);
  list('environment',o.env);
  list('env_file',o.envFiles);
  list('labels',o.labels);
  list('extra_hosts',o.extraHosts);
  list('dns',o.dns);
  list('devices',o.devices);
  list('cap_add',o.capAdd);
  list('cap_drop',o.capDrop);
  if(o.networks.length){
    list('networks',o.networks);
  }
  if(o.command.length) L.push('    command: '+yq(o.command.join(' ')));
  if(o.networks.length){
    L.push('networks:');
    o.networks.forEach(function(n){ L.push('  '+n+':'); L.push('    external: true'); });
  }
  var warn=o.unknown.length?('# 警告: 未识别参数 '+o.unknown.join(' ')+'\n'):'';
  return warn+L.join('\n')+'\n';
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { tokenize:tokenize, parseDockerRun:parseDockerRun, toCompose:toCompose };
}
if (typeof window !== 'undefined') {
  window.DockerForgePure = { tokenize:tokenize, parseDockerRun:parseDockerRun, toCompose:toCompose };
}
</script>
<script>
if (typeof window !== 'undefined' && window.document) {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.DockerForgePure;
    function copyText(t){
      if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t);
      else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
             try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
    }
    function run(){
      $('err').textContent='';
      try { $('out').textContent=P.toCompose($('in').value); }
      catch(e){ $('err').textContent=e.message; $('out').textContent='结果会显示在这里'; }
    }
    $('run').addEventListener('click', run);
    $('in').addEventListener('input', run);
    $('copy').addEventListener('click', function(){ copyText($('out').textContent); });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('out').textContent='结果会显示在这里'; });
    run();
  })();
}
</script>

    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>

<div id="nanoToast" role="status" aria-live="polite"></div>
<script data-nano-polish>
(function(){var el=document.getElementById('nanoToast');if(!el)return;var t;
function zh(){try{var l=localStorage.getItem('nano-lang')||document.documentElement.lang||'zh';return String(l).indexOf('en')!==0;}catch(e){return true;}}
function show(m,bad){el.textContent=m;el.className='on'+(bad?' bad':'');clearTimeout(t);t=setTimeout(function(){el.className='';},1700);}
window.nanoToast=show;
try{var nc=navigator.clipboard;if(nc&&nc.writeText){var ow=nc.writeText.bind(nc);nc.writeText=function(s){return ow(s).then(function(r){show(zh()?'已复制':'Copied');return r;},function(e){show(zh()?'复制失败':'Copy failed',1);throw e;});};}}catch(e){}
try{if(document.execCommand){var oe=document.execCommand.bind(document);document.execCommand=function(c){var r=oe.apply(null,arguments);if(String(c).toLowerCase()==='copy'){show(r?(zh()?'已复制':'Copied'):(zh()?'复制失败':'Copy failed'),!r);}return r;};}}catch(e){}
})();
</script>
