:root{

*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;

input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;

.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}

button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}

     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}

<body>
<div class="app">
  <h1>MurmurForge</h1>
  <p class="sub">MurmurHash3 x86_32 哈希：UTF-8 输入、自定义种子、分桶路由 · 单文件 · 零依赖 · 本地优先</p>

<label>输入文本（按 UTF-8 编码）</label>
<textarea id="txt" rows="4">Hello, world!</textarea>
<div class="grid2">
  <label>种子 seed（无符号 32 位）</label><input id="seed" type="number" value="0" min="0">
  <label>分桶数（可选，&gt;0 时输出 hash % n）</label><input id="buckets" type="number" value="0" min="0">
</div>
<div class="row">
  <button id="run">计算哈希</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入文本后计算</div>
<script>
function mmToUtf8(str){
  var out=[];
  for(var i=0;i<str.length;i++){
    var c=str.charCodeAt(i);
    if(c<0x80){ out.push(c); }
    else if(c<0x800){ out.push(0xC0|(c>>6),0x80|(c&63)); }
    else if(c>=0xD800&&c<=0xDBFF&&i+1<str.length){
      var c2=str.charCodeAt(i+1);
      if(c2>=0xDC00&&c2<=0xDFFF){
        var cp=0x10000+((c-0xD800)<<10)+(c2-0xDC00); i++;
        out.push(0xF0|(cp>>18),0x80|((cp>>12)&63),0x80|((cp>>6)&63),0x80|(cp&63));
      } else out.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));
    }
    else { out.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63)); }
  }
  return out;
}
function mmMul32(a,b){
  var ah=(a>>>16)&0xffff, al=a&0xffff;
  return (((ah*b)<<16)+(al*b))>>>0;
}
function mmRotl32(x,r){ return ((x<<r)|(x>>>(32-r)))>>>0; }
function murmur3_32(bytes, seed){
  var h1=(seed||0)>>>0, c1=0xcc9e2d51, c2=0x1b873593;
  var len=bytes.length, nblocks=len>>2, i;
  for(i=0;i<nblocks;i++){
    var k1=(bytes[i*4]|(bytes[i*4+1]<<8)|(bytes[i*4+2]<<16)|(bytes[i*4+3]<<24))>>>0;
    k1=mmMul32(k1,c1); k1=mmRotl32(k1,15); k1=mmMul32(k1,c2);
    h1=(h1^k1)>>>0; h1=mmRotl32(h1,13); h1=(mmMul32(h1,5)+0xe6546b64)>>>0;
  }
  var k=0, tail=nblocks*4, rem=len&3;
  if(rem===3) k=(k^(bytes[tail+2]<<16))>>>0;
  if(rem>=2) k=(k^(bytes[tail+1]<<8))>>>0;
  if(rem>=1){
    k=(k^bytes[tail])>>>0;
    k=mmMul32(k,c1); k=mmRotl32(k,15); k=mmMul32(k,c2);
    h1=(h1^k)>>>0;
  }
  h1=(h1^len)>>>0;
  h1=(h1^(h1>>>16))>>>0; h1=mmMul32(h1,0x85ebca6b);
  h1=(h1^(h1>>>13))>>>0; h1=mmMul32(h1,0xc2b2ae35);
  h1=(h1^(h1>>>16))>>>0;
  return h1>>>0;
}
function murmurStr(str, seed){ return murmur3_32(mmToUtf8(String(str)), seed||0); }
function murmurHex(str, seed){
  var h=murmurStr(str, seed).toString(16);
  while(h.length<8) h='0'+h;
  return h;
}
function murmurBucket(str, seed, n){
  if(!n||n<=0) return { value:null, error:'桶数必须大于 0' };
  return { value: murmurStr(str, seed)%n, error:null };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { mmToUtf8:mmToUtf8, murmur3_32:murmur3_32, murmurStr:murmurStr,
    murmurHex:murmurHex, murmurBucket:murmurBucket };
}
if (typeof window !== 'undefined') {
  window.MurmurForgePure = { mmToUtf8:mmToUtf8, murmur3_32:murmur3_32, murmurStr:murmurStr,
    murmurHex:murmurHex, murmurBucket:murmurBucket };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.MurmurForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var txt=$('txt').value, seed=Number($('seed').value)>>>0, n=Number($('buckets').value);
      var h=P.murmurStr(txt, seed);
      var lines=['输入字节数: '+P.mmToUtf8(txt).length,
                 'MurmurHash3 x86_32 (seed='+seed+')',
                 '十六进制: 0x'+P.murmurHex(txt, seed),
                 '无符号十进制: '+h];
      if(n>0){
        var b=P.murmurBucket(txt, seed, n);
        lines.push('分桶 hash % '+n+' = '+b.value);
      }
      $('out').textContent=lines.join('\n');
    });
    $('clear').addEventListener('click', function(){ $('txt').value=''; $('out').textContent='输入文本后计算'; });
  })();
}
</script>
