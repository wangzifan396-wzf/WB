<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <h1>ArchForge</h1>
  <p class="sub">架构图即代码：用「web -> api」式 DSL 描述依赖，自动分层布局生成 SVG 架构图，支持环检测与 SVG 导出，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <button id="render">生成架构图</button>
  <button id="demo" class="ghost">示例</button>
  <button id="copy" class="ghost">复制 SVG</button>
  <span class="sub" id="stat" style="margin:0"></span>
</div>
<textarea id="src" rows="7" spellcheck="false" placeholder="每行一条边：web -> api"></textarea>
<div id="out" style="border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;overflow:auto;min-height:200px;padding:8px"></div>
<script>
function archParse(text){
  var edges=[], nodes=[], seen={};
  var lines=String(text||'').split('\n');
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln || ln.charAt(0)==='#') continue;
    var m=/^(.+?)\s*->\s*(.+)$/.exec(ln);
    if(!m) return { error:'第 '+(i+1)+' 行格式错误（应为 A -> B）', nodes:[], edges:[] };
    var a=m[1].trim(), b=m[2].trim();
    if(!a||!b) return { error:'第 '+(i+1)+' 行节点为空', nodes:[], edges:[] };
    if(!seen[a]){ seen[a]=1; nodes.push(a); }
    if(!seen[b]){ seen[b]=1; nodes.push(b); }
    edges.push([a,b]);
  }
  return { error:null, nodes:nodes, edges:edges };
}
function archLayers(nodes, edges){
  var indeg={}, adj={}, i;
  for(i=0;i<nodes.length;i++){ indeg[nodes[i]]=0; adj[nodes[i]]=[]; }
  for(i=0;i<edges.length;i++){ adj[edges[i][0]].push(edges[i][1]); indeg[edges[i][1]]++; }
  var depth={}, q=[], order=[];
  for(i=0;i<nodes.length;i++) if(indeg[nodes[i]]===0){ q.push(nodes[i]); depth[nodes[i]]=0; }
  while(q.length){
    var u=q.shift(); order.push(u);
    for(i=0;i<adj[u].length;i++){
      var v=adj[u][i];
      depth[v]=Math.max(depth[v]||0, depth[u]+1);
      if(--indeg[v]===0) q.push(v);
    }
  }
  if(order.length!==nodes.length) return { error:'检测到循环依赖，无法分层', layers:[] };
  var maxd=0; for(i=0;i<nodes.length;i++) maxd=Math.max(maxd, depth[nodes[i]]);
  var layers=[]; for(i=0;i<=maxd;i++) layers.push([]);
  for(i=0;i<nodes.length;i++) layers[depth[nodes[i]]].push(nodes[i]);
  return { error:null, layers:layers, depth:depth };
}
function archEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function archSvg(parsed){
  if(parsed.error) return '';
  var L=archLayers(parsed.nodes, parsed.edges);
  if(L.error) return '';
  var layers=L.layers, NW=150, NH=44, GX=40, GY=64, PAD=24;
  var maxCols=1, i, j;
  for(i=0;i<layers.length;i++) maxCols=Math.max(maxCols, layers[i].length);
  var W=PAD*2+maxCols*NW+(maxCols-1)*GX, H=PAD*2+layers.length*NH+(layers.length-1)*GY;
  var pos={};
  for(i=0;i<layers.length;i++){
    var row=layers[i], rw=row.length*NW+(row.length-1)*GX, x0=(W-rw)/2;
    for(j=0;j<row.length;j++) pos[row[j]]={ x:x0+j*(NW+GX), y:PAD+i*(NH+GY) };
  }
  var cols=['#5E6AD2','#22D3EE','#10B981','#A78BFA','#F5A623'];
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  s+='<rect width="'+W+'" height="'+H+'" fill="#0A0A0B"/>';
  s+='<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#71717A"/></marker></defs>';
  for(i=0;i<parsed.edges.length;i++){
    var a=pos[parsed.edges[i][0]], b=pos[parsed.edges[i][1]];
    s+='<path d="M'+(a.x+NW/2)+','+(a.y+NH)+' C'+(a.x+NW/2)+','+(a.y+NH+GY/2)+' '+(b.x+NW/2)+','+(b.y-GY/2)+' '+(b.x+NW/2)+','+(b.y-2)+'" fill="none" stroke="#71717A" stroke-width="1.5" marker-end="url(#ah)"/>';
  }
  for(i=0;i<layers.length;i++) for(j=0;j<layers[i].length;j++){
    var n=layers[i][j], p=pos[n], c=cols[i%cols.length];
    s+='<rect x="'+p.x+'" y="'+p.y+'" width="'+NW+'" height="'+NH+'" rx="10" fill="#141417" stroke="'+c+'" stroke-width="1.5"/>';
    s+='<text x="'+(p.x+NW/2)+'" y="'+(p.y+NH/2+5)+'" font-family="system-ui,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">'+archEsc(n)+'</text>';
  }
  return s+'</svg>';
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { archParse:archParse, archLayers:archLayers, archSvg:archSvg, archEsc:archEsc };
}
if (typeof window !== 'undefined') {
  window.ArchForgePure = { archParse:archParse, archLayers:archLayers, archSvg:archSvg, archEsc:archEsc };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.ArchForgePure;
    var DEMO='# 三层 Web 架构\nweb -> api\nadmin -> api\napi -> auth\napi -> db\napi -> cache\nauth -> db';
    function render(){
      var parsed=P.archParse($('src').value);
      if(parsed.error){ $('stat').textContent=parsed.error; $('out').innerHTML=''; return; }
      var L=P.archLayers(parsed.nodes,parsed.edges);
      if(L.error){ $('stat').textContent=L.error; $('out').innerHTML=''; return; }
      $('out').innerHTML=P.archSvg(parsed);
      $('stat').textContent=parsed.nodes.length+' 节点 / '+parsed.edges.length+' 边 / '+L.layers.length+' 层';
    }
    $('render').addEventListener('click', render);
    $('demo').addEventListener('click', function(){ $('src').value=DEMO; render(); });
    $('copy').addEventListener('click', function(){
      var svg=$('out').innerHTML;
      if(svg && navigator.clipboard) navigator.clipboard.writeText(svg);
    });
    $('src').value=DEMO; render();
  })();
}
</script>

  <div class="badges" id="badges">

</div>
