<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <h1>BezierForge</h1>
  <p class="sub">贝塞尔曲线：可视化编辑三次贝塞尔控制点，实时预览曲线，导出 SVG path。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <button id="copy">复制 path</button>
  <button id="reset" class="ghost">重置</button>
  <span class="out" id="out">拖动方块调整控制点</span>
</div>
<svg id="cv" viewBox="0 0 380 240" width="380" height="240"></svg>
<script>
function bzAt(t, p0, c1, c2, p3){
  var u=1-t, a=u*u*u, b=3*u*u*t, c=3*u*t*t, d=t*t*t;
  return [a*p0[0]+b*c1[0]+c*c2[0]+d*p3[0], a*p0[1]+b*c1[1]+c*c2[1]+d*p3[1]];
}
function bzPolyline(pts, n){
  // pts: [p0,c1,c2,p3, c1,c2,p3, ...] -> k=(len-1)/3 segments
  n=n||60; var segs=(pts.length-1)/3, out=[];
  for(var s=0;s<segs;s++){
    var i=s*3, p0=pts[i], c1=pts[i+1], c2=pts[i+2], p3=pts[i+3];
    var start=s===0?0:1;
    for(var k=start;k<=n;k++){ out.push(bzAt(k/n, p0,c1,c2,p3)); }
  }
  return out;
}
function bzPath(pts){
  var segs=(pts.length-1)/3, d='M'+pts[0][0]+' '+pts[0][1];
  for(var s=0;s<segs;s++){ var i=s*3; d+=' C'+pts[i+1][0]+' '+pts[i+1][1]+' '+pts[i+2][0]+' '+pts[i+2][1]+' '+pts[i+3][0]+' '+pts[i+3][1]; }
  return d;
}
function bzSvg(pts){
  var d=bzPath(pts), poly='', handles='';
  for(var i=0;i<pts.length;i++){ poly+=(i?'L':'M')+pts[i][0]+' '+pts[i][1]; }
  for(var i=0;i<pts.length;i++){ handles+='<circle class="cp" data-i="'+i+'" cx="'+pts[i][0]+'" cy="'+pts[i][1]+'" r="'+(i%3===0?6:5)+'" fill="'+(i%3===0?'#5E6AD2':'#22D3EE')+'"/>'; }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240">'
    +'<rect width="380" height="240" fill="#0A0A0B"/>'
    +'<path d="'+poly+'" fill="none" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 3"/>'
    +'<path d="'+d+'" fill="none" stroke="#5E6AD2" stroke-width="2.5"/>'+handles+'</svg>';
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { bzAt:bzAt, bzPolyline:bzPolyline, bzPath:bzPath, bzSvg:bzSvg };
}
if (typeof window !== 'undefined') {
  window.BezierForgePure = { bzAt:bzAt, bzPolyline:bzPolyline, bzPath:bzPath, bzSvg:bzSvg };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.BezierForgePure;
    var DEFAULT=[[40,200],[120,40],[260,360],[340,200]];
    var pts=DEFAULT.map(function(p){ return p.slice(); });
    var drag=null;
    function render(){
      $('cv').innerHTML = P.bzSvg(pts).replace('<svg xmlns="http://www.w3.org/2000/svg" ','<svg id="inner" ');
      var inner=$('cv').querySelector('#inner');
      Array.prototype.forEach.call($('cv').querySelectorAll('.cp'), function(c){
        c.style.cursor='grab';
        c.addEventListener('pointerdown', function(e){ drag=+this.dataset.i; e.preventDefault(); });
      });
      $('cv').onpointermove=function(e){
        if(drag===null) return;
        var r=$('cv').getBoundingClientRect(), sx=380/r.width, sy=240/r.height;
        pts[drag]=[ (e.clientX-r.left)*sx, (e.clientY-r.top)*sy ];
        render();
      };
      $('cv').onpointerup=function(){ drag=null; };
    }
    $('copy').addEventListener('click', function(){ navigator.clipboard && navigator.clipboard.writeText(P.bzPath(pts)); $('out').textContent='已复制 path'; });
    $('reset').addEventListener('click', function(){ pts=DEFAULT.map(function(p){ return p.slice(); }); render(); });
    render();
  })();
}
</script>
