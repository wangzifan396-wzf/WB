<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>BenchForge — 基准统计：mean/median/MAD/P95 + 离群点检测 + A/B 速度比</title>
<meta property="og:title" content="BenchForge">
<meta property="og:description" content="基准统计：mean/median/MAD/P95 + 离群点检测 + A/B 速度比">
<meta property="og:image" content="./og.png">
<meta name="description" content="基准统计：mean/median/MAD/P95 + 离群点检测 + A/B 速度比 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="app">
  <h1>BenchForge</h1>
  <p class="sub">基准统计：mean/median/MAD/P95 + 离群点检测 + A/B 速度比 · 单文件 · 零依赖 · 本地优先</p>

<label>样本 A：耗时序列（ms，逗号/空格/换行分隔）</label>
<textarea id="sa" rows="3">12.1, 11.8, 12.3, 12.0, 11.9, 12.2, 30.5, 12.1</textarea>
<label>样本 B（可选，填写后做 A/B 对比）</label>
<textarea id="sb" rows="3">24.0, 23.6, 24.4, 23.9, 24.1</textarea>
<div class="row">
  <button id="run">统计分析</button>
  <button id="cmp">A/B 对比</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">粘贴耗时样本后分析</div>
<script>
function bfParse(text){
  return String(text).split(/[\s,]+/).map(Number).filter(function(x){ return isFinite(x); });
}
function bfMean(xs){
  var s=0; for(var i=0;i<xs.length;i++) s+=xs[i];
  return s/xs.length;
}
function bfMedian(xs){
  var a=xs.slice().sort(function(p,q){ return p-q; });
  var mid=a.length>>1;
  return a.length%2 ? a[mid] : (a[mid-1]+a[mid])/2;
}
function bfStddev(xs){
  if(xs.length<2) return 0;
  var m=bfMean(xs), s=0;
  for(var i=0;i<xs.length;i++) s+=(xs[i]-m)*(xs[i]-m);
  return Math.sqrt(s/(xs.length-1));
}
function bfMad(xs){
  var med=bfMedian(xs);
  return bfMedian(xs.map(function(x){ return Math.abs(x-med); }));
}
function bfStats(xs){
  if(!xs||xs.length===0) return { value:null, error:'样本为空' };
  var a=xs.slice().sort(function(p,q){ return p-q; });
  return { value:{ n:xs.length, mean:bfMean(xs), median:bfMedian(xs), stddev:bfStddev(xs),
    mad:bfMad(xs), min:a[0], max:a[a.length-1],
    p95:a[Math.min(a.length-1, Math.ceil(a.length*0.95)-1)] }, error:null };
}
function bfOutliers(xs){
  if(!xs||xs.length<3) return { value:{ outliers:[], indexes:[] }, error:null };
  var med=bfMedian(xs), mad=bfMad(xs), out=[], idx=[];
  for(var i=0;i<xs.length;i++){
    var bad;
    if(mad===0) bad = xs[i]!==med;
    else bad = Math.abs(0.6745*(xs[i]-med)/mad) > 3.5;
    if(bad){ out.push(xs[i]); idx.push(i); }
  }
  return { value:{ outliers:out, indexes:idx }, error:null };
}
function bfCompare(a, b){
  var sa=bfStats(a), sb=bfStats(b);
  if(sa.error||sb.error) return { value:null, error:sa.error||sb.error };
  var A=sa.value, B=sb.value;
  if(A.mean<=0||B.mean<=0) return { value:null, error:'均值必须为正' };
  var fast = A.mean<=B.mean ? 'A' : 'B';
  var ratio = A.mean<=B.mean ? B.mean/A.mean : A.mean/B.mean;
  var relErr = Math.sqrt(Math.pow(A.stddev/A.mean,2)+Math.pow(B.stddev/B.mean,2));
  return { value:{ faster:fast, ratio:ratio, ratioErr:ratio*relErr, meanA:A.mean, meanB:B.mean }, error:null };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { bfParse:bfParse, bfMean:bfMean, bfMedian:bfMedian, bfStddev:bfStddev,
    bfMad:bfMad, bfStats:bfStats, bfOutliers:bfOutliers, bfCompare:bfCompare };
}
if (typeof window !== 'undefined') {
  window.BenchForgePure = { bfParse:bfParse, bfMean:bfMean, bfMedian:bfMedian, bfStddev:bfStddev,
    bfMad:bfMad, bfStats:bfStats, bfOutliers:bfOutliers, bfCompare:bfCompare };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.BenchForgePure;
    function fmt(x){ return Number(x.toFixed(3)); }
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      var xs=P.bfParse($('sa').value);
      var r=P.bfStats(xs);
      if(r.error){ $('err').textContent=r.error; return; }
      var v=r.value, o=P.bfOutliers(xs).value;
      $('out').textContent=['n = '+v.n,
        'mean \u00b1 stddev: '+fmt(v.mean)+' \u00b1 '+fmt(v.stddev)+' ms',
        'median: '+fmt(v.median)+' ms   MAD: '+fmt(v.mad),
        'min \u2026 max: '+fmt(v.min)+' \u2026 '+fmt(v.max)+' ms   P95: '+fmt(v.p95),
        o.outliers.length?('\u26a0 离群点 ('+o.outliers.length+'): '+o.outliers.map(fmt).join(', ')+' \u2014 建议预热或隔离环境')
                         :'无统计离群点 (modified z-score \u2264 3.5)'].join('\n');
    });
    $('cmp').addEventListener('click', function(){
      $('err').textContent='';
      var r=P.bfCompare(P.bfParse($('sa').value), P.bfParse($('sb').value));
      if(r.error){ $('err').textContent=r.error; return; }
      var v=r.value;
      $('out').textContent=['mean A: '+fmt(v.meanA)+' ms    mean B: '+fmt(v.meanB)+' ms',
        '更快: 样本 '+v.faster,
        '速度比: '+fmt(v.ratio)+'x \u00b1 '+fmt(v.ratioErr)].join('\n');
    });
    $('clear').addEventListener('click', function(){ $('sa').value=''; $('sb').value=''; $('out').textContent='粘贴耗时样本后分析'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>

</div>
