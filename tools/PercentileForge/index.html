<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}

<body>
<div class="app">
  <h1>PercentileForge</h1>
  <p class="sub">延迟分位数分析器：p50/p90/p95/p99 插值 + 标准差 + ASCII 直方图 · 单文件 · 零依赖 · 本地优先</p>

<label>延迟样本（毫秒，逗号 / 空格 / 换行分隔）</label>
<textarea id="data" rows="5">12, 15, 11, 240, 18, 22, 13, 480, 16, 14, 19, 25, 17, 900, 21</textarea>
<div class="row">
  <button id="run">计算分位数</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">输入样本后计算 p50 / p90 / p95 / p99</div>
<script>
function parseNums(s){
  var parts=String(s||'').trim().split(/[,\s]+/).filter(function(x){return x.length;});
  if(!parts.length) return { value:null, error:'\u6837\u672c\u4e3a\u7a7a' };
  var out=[];
  for(var i=0;i<parts.length;i++){
    var n=Number(parts[i]);
    if(!isFinite(n)) return { value:null, error:'\u975e\u6cd5\u6570\u5b57: '+parts[i] };
    out.push(n);
  }
  return { value:out, error:null };
}
function percentile(arr, p){
  if(!arr.length) throw new Error('EMPTY');
  if(p<0||p>100) throw new Error('P_RANGE');
  var a=arr.slice().sort(function(x,y){return x-y;});
  if(a.length===1) return a[0];
  var idx=(p/100)*(a.length-1);
  var lo=Math.floor(idx), hi=Math.ceil(idx);
  if(lo===hi) return a[lo];
  return a[lo]+(a[hi]-a[lo])*(idx-lo);
}
function mean(arr){
  if(!arr.length) throw new Error('EMPTY');
  return arr.reduce(function(a,b){return a+b;},0)/arr.length;
}
function stddev(arr){
  if(arr.length<2) return 0;
  var m=mean(arr);
  return Math.sqrt(arr.reduce(function(s,x){return s+(x-m)*(x-m);},0)/(arr.length-1));
}
function summary(arr){
  return { count:arr.length, min:Math.min.apply(null,arr), max:Math.max.apply(null,arr),
    mean:mean(arr), stddev:stddev(arr),
    p50:percentile(arr,50), p90:percentile(arr,90), p95:percentile(arr,95), p99:percentile(arr,99) };
}
function histogram(arr, buckets){
  buckets=buckets||8;
  var mn=Math.min.apply(null,arr), mx=Math.max.apply(null,arr);
  var w=(mx-mn)/buckets || 1;
  var out=[];
  for(var i=0;i<buckets;i++) out.push({ from:mn+i*w, to:mn+(i+1)*w, count:0 });
  arr.forEach(function(x){
    var i=Math.min(buckets-1, Math.floor((x-mn)/w));
    out[i].count++;
  });
  return out;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parseNums:parseNums, percentile:percentile, mean:mean, stddev:stddev,
    summary:summary, histogram:histogram };
}
if (typeof window !== 'undefined') {
  window.PercentileForgePure = { parseNums:parseNums, percentile:percentile, mean:mean, stddev:stddev,
    summary:summary, histogram:histogram };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.PercentileForgePure;
    function f2(x){ return Math.round(x*100)/100; }
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try {
        var r=P.parseNums($('data').value);
        if(r.error) throw new Error(r.error);
        var s=P.summary(r.value);
        var lines=['n='+s.count+'  min='+f2(s.min)+'  max='+f2(s.max),
                   'mean='+f2(s.mean)+'  stddev='+f2(s.stddev), '',
                   'p50 = '+f2(s.p50)+' ms', 'p90 = '+f2(s.p90)+' ms',
                   'p95 = '+f2(s.p95)+' ms', 'p99 = '+f2(s.p99)+' ms', '', '\u76f4\u65b9\u56fe:'];
        var h=P.histogram(r.value, 8);
        var mx=Math.max.apply(null, h.map(function(b){return b.count;}));
        h.forEach(function(b){
          var bar='\u2588'.repeat(mx?Math.round(b.count/mx*24):0);
          lines.push('['+f2(b.from)+', '+f2(b.to)+')  '+bar+' '+b.count);
        });
        $('out').textContent=lines.join('\n');
      } catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('data').value=''; $('out').textContent='\u8f93\u5165\u6837\u672c\u540e\u8ba1\u7b97 p50 / p90 / p95 / p99'; });
  })();
}
</script>
