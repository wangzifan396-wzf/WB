<body>
<div class="app">
  <h1>SkipForge</h1>
  <p class="sub">跳表：种子化分层可复现，O(log n) 查找/插入/区间（Redis zset 内核） · 单文件 · 零依赖 · 本地优先</p>

<label>批量插入（逗号分隔的 数字键 或 键=值）</label>
<input id="bulk" type="text" value="30, 10, 50, 20=twenty, 40, 5">
<div class="grid2">
  <label>单键操作 key</label><input id="key" type="number" value="20">
  <label>值 value（可选）</label><input id="val" type="text" value="">
</div>
<div class="grid2">
  <label>区间查询 lo</label><input id="lo" type="number" value="10">
  <label>区间查询 hi（含）</label><input id="hi" type="number" value="40">
</div>
<div class="row">
  <button id="binsert">批量插入</button>
  <button id="find">查找</button>
  <button id="del">删除</button>
  <button id="range">区间</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出</label>
<div class="out" id="out" aria-live="polite">插入后查询；层级由种子 PRNG 决定（可复现）</div>
<script>
var SL_MAX_LEVEL=16, SL_P=0.5;
function slRng(state){
  var x=state>>>0;
  x^=x<<13; x>>>=0;
  x^=x>>>17;
  x^=x<<5; x>>>=0;
  return x>>>0;
}
function slCreate(seed){
  return { head:{ key:null, val:null, next:new Array(SL_MAX_LEVEL).fill(null) },
    level:1, size:0, rng:(seed===undefined?88675123:seed)>>>0 };
}
function slRandLevel(sl){
  var lvl=1;
  for(;;){
    sl.rng=slRng(sl.rng);
    if((sl.rng%1000)/1000<SL_P && lvl<SL_MAX_LEVEL) lvl++;
    else break;
  }
  return lvl;
}
function slInsert(sl, key, val){
  if(typeof key!=='number'||isNaN(key)) return { ok:false, error:'键必须是数字' };
  var update=new Array(SL_MAX_LEVEL), node=sl.head, i;
  for(i=sl.level-1;i>=0;i--){
    while(node.next[i]&&node.next[i].key<key) node=node.next[i];
    update[i]=node;
  }
  var cand=node.next[0];
  if(cand&&cand.key===key){ cand.val=val===undefined?null:val; return { ok:true, updated:true }; }
  var lvl=slRandLevel(sl);
  if(lvl>sl.level){
    for(i=sl.level;i<lvl;i++) update[i]=sl.head;
    sl.level=lvl;
  }
  var nn={ key:key, val:val===undefined?null:val, next:new Array(lvl).fill(null) };
  for(i=0;i<lvl;i++){
    nn.next[i]=update[i].next[i];
    update[i].next[i]=nn;
  }
  sl.size++;
  return { ok:true, updated:false };
}
function slSearch(sl, key){
  var node=sl.head, i;
  for(i=sl.level-1;i>=0;i--){
    while(node.next[i]&&node.next[i].key<key) node=node.next[i];
  }
  node=node.next[0];
  if(node&&node.key===key) return { found:true, key:node.key, val:node.val };
  return { found:false };
}
function slDelete(sl, key){
  var update=new Array(SL_MAX_LEVEL), node=sl.head, i;
  for(i=sl.level-1;i>=0;i--){
    while(node.next[i]&&node.next[i].key<key) node=node.next[i];
    update[i]=node;
  }
  node=node.next[0];
  if(!node||node.key!==key) return false;
  for(i=0;i<sl.level;i++){
    if(update[i].next[i]===node) update[i].next[i]=node.next[i];
  }
  while(sl.level>1&&!sl.head.next[sl.level-1]) sl.level--;
  sl.size--;
  return true;
}
function slRange(sl, lo, hi){
  var out=[], node=sl.head, i;
  for(i=sl.level-1;i>=0;i--){
    while(node.next[i]&&node.next[i].key<lo) node=node.next[i];
  }
  node=node.next[0];
  while(node&&node.key<=hi){ out.push(node.key); node=node.next[0]; }
  return out;
}
function slToArray(sl){
  var out=[], node=sl.head.next[0];
  while(node){ out.push(node.key); node=node.next[0]; }
  return out;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { slCreate:slCreate, slInsert:slInsert, slSearch:slSearch,
    slDelete:slDelete, slRange:slRange, slToArray:slToArray, slRandLevel:slRandLevel, slRng:slRng };
}
if (typeof window !== 'undefined') {
  window.SkipForgePure = { slCreate:slCreate, slInsert:slInsert, slSearch:slSearch,
    slDelete:slDelete, slRange:slRange, slToArray:slToArray, slRandLevel:slRandLevel, slRng:slRng };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $=function(id){ return document.getElementById(id); };
    var P=window.SkipForgePure;
    var sl=P.slCreate(20260729);
    function dump(){
      return '['+P.slToArray(sl).join(', ')+']  size='+sl.size+' level='+sl.level;
    }
    $('binsert').addEventListener('click', function(){
      $('err').textContent='';
      var parts=$('bulk').value.split(',');
      for(var i=0;i<parts.length;i++){
        var kv=parts[i].split('='), k=Number(kv[0].trim());
        if(isNaN(k)) continue;
        P.slInsert(sl, k, kv.length>1?kv[1].trim():null);
      }
      $('out').textContent='有序链: '+dump();
    });
    $('find').addEventListener('click', function(){
      $('err').textContent='';
      var r=P.slSearch(sl, Number($('key').value));
      $('out').textContent=r.found?('命中 key='+r.key+(r.val!==null?' val='+r.val:'')):'未找到';
    });
    $('del').addEventListener('click', function(){
      $('err').textContent='';
      var okd=P.slDelete(sl, Number($('key').value));
      $('out').textContent=(okd?'已删除':'键不存在')+'\n'+dump();
    });
    $('range').addEventListener('click', function(){
      $('err').textContent='';
      var r=P.slRange(sl, Number($('lo').value), Number($('hi').value));
      $('out').textContent='range = ['+r.join(', ')+']';
    });
    $('clear').addEventListener('click', function(){ sl=P.slCreate(20260729); $('out').textContent='已重置'; });
  })();
}
</script>
