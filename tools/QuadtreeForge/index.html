<body>
<div class="app">
  <h1>QuadtreeForge</h1>
  <p class="sub">四叉树图像近似：按方差阈值递归细分灰度场，块状马赛克风格重建，节点数实时统计，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<label>误差阈值（越小越精细）</label>
<input id="thr" type="range" min="1" max="60" step="1" value="12">
<label>图案</label>
<select id="pattern">
  <option value="circles">同心圆</option>
  <option value="gradient">对角渐变</option>
  <option value="checker">棋盘</option>
</select>
<div class="row">
  <button id="draw">重建</button>
</div>
<div id="stats" style="color:#A1A1AA;font-size:13px;margin-top:8px;"></div>
<div class="err" id="err"></div>
<canvas id="cv" width="512" height="512" style="width:100%;max-width:512px;border:1px solid rgba(255,255,255,.08);border-radius:10px;"></canvas>
<script>
function qtPattern(kind, size){
  var g = [];
  for(var y=0;y<size;y++){
    var row = [];
    for(var x=0;x<size;x++){
      var v;
      if(kind === 'gradient'){ v = ((x + y) / (2*size - 2)) * 255; }
      else if(kind === 'checker'){ v = ((Math.floor(x/(size/8)) + Math.floor(y/(size/8))) % 2) ? 220 : 40; }
      else { var dx = x - size/2, dy = y - size/2; v = (Math.sin(Math.sqrt(dx*dx+dy*dy) * 0.15) + 1) / 2 * 255; }
      row.push(v);
    }
    g.push(row);
  }
  return g;
}
function qtStats(grid, x, y, s){
  var sum = 0, sum2 = 0, n = s*s;
  for(var j=y;j<y+s;j++) for(var i=x;i<x+s;i++){ var v = grid[j][i]; sum += v; sum2 += v*v; }
  var mean = sum / n;
  return { mean: mean, std: Math.sqrt(Math.max(0, sum2/n - mean*mean)) };
}
function qtBuild(grid, x, y, s, thr, minSize){
  var st = qtStats(grid, x, y, s);
  if(s <= (minSize||4) || st.std <= thr){
    return { x:x, y:y, s:s, v: st.mean, leaf: true };
  }
  var h = s/2;
  return { x:x, y:y, s:s, leaf: false, kids: [
    qtBuild(grid, x, y, h, thr, minSize),
    qtBuild(grid, x+h, y, h, thr, minSize),
    qtBuild(grid, x, y+h, h, thr, minSize),
    qtBuild(grid, x+h, y+h, h, thr, minSize)
  ]};
}
function qtLeaves(node, out){
  out = out || [];
  if(node.leaf) out.push(node);
  else for(var i=0;i<4;i++) qtLeaves(node.kids[i], out);
  return out;
}
function qtCount(node){
  if(node.leaf) return { nodes: 1, leaves: 1, depth: 1 };
  var nodes = 1, leaves = 0, depth = 0;
  for(var i=0;i<4;i++){
    var c = qtCount(node.kids[i]);
    nodes += c.nodes; leaves += c.leaves; depth = Math.max(depth, c.depth);
  }
  return { nodes: nodes, leaves: leaves, depth: depth + 1 };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { qtPattern:qtPattern, qtStats:qtStats, qtBuild:qtBuild, qtLeaves:qtLeaves, qtCount:qtCount };
}
if (typeof window !== 'undefined') {
  window.QuadtreeForgePure = { qtPattern:qtPattern, qtStats:qtStats, qtBuild:qtBuild, qtLeaves:qtLeaves, qtCount:qtCount };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.QuadtreeForgePure;
    var SIZE = 256, SC = 2;
    function draw(){
      var grid = P.qtPattern($('pattern').value, SIZE);
      var thr = Number($('thr').value) || 12;
      var tree = P.qtBuild(grid, 0, 0, SIZE, thr, 4);
      var leaves = P.qtLeaves(tree), c = P.qtCount(tree);
      var cv = $('cv'), ctx = cv.getContext('2d');
      if(ctx){
        ctx.fillStyle = '#0A0A0B'; ctx.fillRect(0,0,512,512);
        for(var i=0;i<leaves.length;i++){
          var L = leaves[i], g = Math.round(L.v);
          ctx.fillStyle = 'rgb(' + Math.round(g*0.35) + ',' + Math.round(g*0.75) + ',' + Math.round(g*0.9) + ')';
          ctx.fillRect(L.x*SC, L.y*SC, L.s*SC, L.s*SC);
          ctx.strokeStyle = 'rgba(255,255,255,0.10)';
          ctx.strokeRect(L.x*SC + 0.5, L.y*SC + 0.5, L.s*SC - 1, L.s*SC - 1);
        }
      }
      var full = SIZE*SIZE;
      $('stats').textContent = '叶子块 ' + c.leaves + ' / 节点 ' + c.nodes + ' / 深度 ' + c.depth
        + ' — 相当于用 ' + c.leaves + ' 块表示 ' + full + ' 像素（压缩比 ' + (full/c.leaves).toFixed(1) + ':1）';
    }
    $('draw').addEventListener('click', draw);
    $('thr').addEventListener('input', draw);
    $('pattern').addEventListener('change', draw);
    draw();
  })();
}
</script>
