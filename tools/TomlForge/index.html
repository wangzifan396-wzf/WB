<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>TomlForge — TOML 解析器：字符串/数值/数组/表/数组表，零依赖解析</title>
<meta property="og:title" content="TomlForge">
<meta property="og:description" content="TOML 解析器：字符串/数值/数组/表/数组表，零依赖解析">
<meta property="og:image" content="./og.png">
<meta name="description" content="TOML 解析器：字符串/数值/数组/表/数组表，零依赖解析 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">

<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <h1>TomlForge</h1>
  <p class="sub">TOML 解析器：字符串/数值/数组/表/数组表，零依赖解析 · 单文件 · 零依赖 · 本地优先</p>

<label>TOML 文本</label>
<textarea id="in" rows="6">title = "TOML demo"
[server]
host = "localhost"
port = 8080
[[users]]
name = "alice"
[[users]]
name = "bob"</textarea>
<div class="row">
  <button id="run">解析</button>
  <button id="clear" class="ghost">清空</button>
</div>
<div class="err" id="err"></div>
<label>输出 (JSON)</label>
<div class="out" id="out" aria-live="polite">输入 TOML 后解析</div>
<script>
function tomlStripComment(line){
  var i=line.indexOf(' #');
  if(i>=0) line=line.slice(0,i);
  if(line.charAt(0)==='#') line='';
  return line;
}
function tomlParseValue(raw){
  raw=raw.trim();
  if(raw.charAt(0)==='"'){ var inner=raw.slice(1,-1).replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\"/g,'"').replace(/\\\\/g,'\\'); return inner; }
  if(raw.charAt(0)==="'"){ return raw.slice(1,-1); }
  if(raw.charAt(0)==='['){ var inner=raw.slice(1,-1).trim(); if(inner==='') return []; return inner.split(',').map(function(x){ return tomlParseValue(x); }); }
  if(raw==='true') return true;
  if(raw==='false') return false;
  if(/^-?\d+$/.test(raw)) return parseInt(raw,10);
  if(/^-?\d*\.\d+$/.test(raw)) return parseFloat(raw);
  return raw;
}
function tomlParse(text){
  var root={}, cur=root;
  var lines=text.split('\n');
  for(var li=0; li<lines.length; li++){
    var line=tomlStripComment(lines[li]).trim();
    if(line==='') continue;
    if(line.charAt(0)==='['){
      var close=line.lastIndexOf(']');
      var header=line.slice(1,close);
      var isArray = header.charAt(0)==='[';
      if(isArray) header=header.slice(1,-1);
      var keys=header.split('.').map(function(x){ return x.trim(); });
      if(isArray){
        var parent=root;
        for(var i=0;i<keys.length-1;i++){ if(parent[keys[i]]===undefined) parent[keys[i]]={}; parent=parent[keys[i]]; }
        var last=keys[keys.length-1];
        if(!Array.isArray(parent[last])) parent[last]=[];
        var newObj={}; parent[last].push(newObj); cur=newObj;
      } else {
        var p=root;
        for(var i2=0;i2<keys.length;i2++){ if(p[keys[i2]]===undefined) p[keys[i2]]={}; p=p[keys[i2]]; }
        cur=p;
      }
      continue;
    }
    var eq=line.indexOf('=');
    if(eq<0) continue;
    var k=line.slice(0,eq).trim();
    cur[k]=tomlParseValue(line.slice(eq+1));
  }
  return root;
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { tomlParse:tomlParse, tomlParseValue:tomlParseValue };
}
if (typeof window !== 'undefined') {
  window.TomlForgePure = { tomlParse:tomlParse, tomlParseValue:tomlParseValue };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.TomlForgePure;
    $('run').addEventListener('click', function(){
      $('err').textContent='';
      try { $('out').textContent=JSON.stringify(P.tomlParse($('in').value), null, 2); }
      catch(e){ $('err').textContent=e.message; }
    });
    $('clear').addEventListener('click', function(){ $('in').value=''; $('out').textContent='输入 TOML 后解析'; });
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>

</div>
