<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>SigForge — HTML 邮件签名生成器：填姓名/职位/公司/联系方式，生成 table 布局的兼容签名（Outlook/Gmail 可用），实时预览可复制源码，离线可用。</title>
<meta property="og:title" content="SigForge">
<meta property="og:description" content="HTML 邮件签名生成器：填姓名/职位/公司/联系方式，生成 table 布局的兼容签名（Outlook/Gmail 可用），实时预览可复制源码，离线可用。">
<meta property="og:image" content="./og.png">
<meta name="description" content="HTML 邮件签名生成器：填姓名/职位/公司/联系方式，生成 table 布局的兼容签名（Outlook/Gmail 可用），实时预览可复制源码，离线可用。 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<style>

:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input[type=number]{max-width:160px}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}
.opt label{display:inline-flex;align-items:center;gap:6px;margin:0;cursor:pointer}
.opt input{width:auto}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:44px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */
</style>
</head>
<body>
<div class="app">
  <h1>SigForge</h1>
  <p class="sub">HTML 邮件签名生成器：填姓名/职位/公司/联系方式，生成 table 布局的兼容签名（Outlook/Gmail 可用），实时预览可复制源码，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <input id="name" type="text" value="Zifan Wang" placeholder="姓名" style="flex:1">
  <input id="title" type="text" value="Software Engineer" placeholder="职位" style="flex:1">
</div>
<div class="row">
  <input id="company" type="text" value="nano-tools" placeholder="公司" style="flex:1">
  <input id="phone" type="text" value="+86 138 0000 0000" placeholder="电话" style="flex:1">
</div>
<div class="row">
  <input id="email" type="text" value="hi@example.com" placeholder="邮箱" style="flex:1">
  <input id="site" type="text" value="https://example.com" placeholder="网站" style="flex:1">
</div>
<div class="row">
  <label style="margin:0">主色</label>
  <input id="accent" type="text" value="#5E6AD2" style="width:110px">
  <button id="gen">生成签名</button>
  <button id="copy" class="ghost">复制 HTML</button>
  <span class="sub" id="stat" style="margin:0"></span>
</div>
<div id="preview" style="border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#fff;padding:16px;"></div>
<textarea id="out" rows="8" readonly spellcheck="false"></textarea>
<script>
function sgEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function sgColor(c){ var s=String(c||'').trim(); return /^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(s) ? s : '#5E6AD2'; }
function sgInitials(name){ var parts=String(name||'').trim().split(/\s+/).filter(Boolean); if(!parts.length) return '?'; var a=parts[0][0]||'', b=parts.length>1?(parts[parts.length-1][0]||''):''; return (a+b).toUpperCase(); }
function sgUrlLabel(url){ return String(url||'').replace(/^https?:\/\//,'').replace(/\/$/,''); }
function sgBuild(d){
  d=d||{};
  var accent=sgColor(d.accent);
  var rows=[];
  if(d.phone) rows.push('<span style="color:#6b7280;">Tel</span>&nbsp; '+sgEsc(d.phone));
  if(d.email) rows.push('<span style="color:#6b7280;">Mail</span>&nbsp; <a href="mailto:'+sgEsc(d.email)+'" style="color:'+accent+';text-decoration:none;">'+sgEsc(d.email)+'</a>');
  if(d.site) rows.push('<span style="color:#6b7280;">Web</span>&nbsp; <a href="'+sgEsc(d.site)+'" style="color:'+accent+';text-decoration:none;">'+sgEsc(sgUrlLabel(d.site))+'</a>');
  var contact=rows.map(function(r){ return '<div style="margin:2px 0;">'+r+'</div>'; }).join('');
  return '<table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#111827;">'
    +'<tr>'
    +'<td style="padding-right:14px;vertical-align:top;">'
    +'<table cellpadding="0" cellspacing="0" border="0"><tr><td width="52" height="52" align="center" style="background:'+accent+';border-radius:26px;color:#ffffff;font-size:18px;font-weight:bold;">'+sgEsc(sgInitials(d.name))+'</td></tr></table>'
    +'</td>'
    +'<td style="border-left:2px solid '+accent+';padding-left:14px;vertical-align:top;">'
    +'<div style="font-size:15px;font-weight:bold;color:#111827;">'+sgEsc(d.name||'')+'</div>'
    +'<div style="color:#6b7280;margin:2px 0 6px;">'+sgEsc(d.title||'')+(d.title&&d.company?' · ':'')+sgEsc(d.company||'')+'</div>'
    +contact
    +'</td>'
    +'</tr></table>';
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { sgEsc:sgEsc, sgColor:sgColor, sgInitials:sgInitials, sgUrlLabel:sgUrlLabel, sgBuild:sgBuild };
}
if (typeof window !== 'undefined') {
  window.SigForgePure = { sgEsc:sgEsc, sgColor:sgColor, sgInitials:sgInitials, sgUrlLabel:sgUrlLabel, sgBuild:sgBuild };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.SigForgePure;
    function gen(){
      var htmlSig=P.sgBuild({ name:$('name').value, title:$('title').value, company:$('company').value, phone:$('phone').value, email:$('email').value, site:$('site').value, accent:$('accent').value });
      $('preview').innerHTML=htmlSig;
      $('out').value=htmlSig;
      $('stat').textContent=htmlSig.length+' 字符';
    }
    $('gen').addEventListener('click', gen);
    $('copy').addEventListener('click', function(){
      var t=$('out'); t.select();
      try{ document.execCommand('copy'); $('stat').textContent='已复制'; }catch(e){ $('stat').textContent='复制失败，请手动复制'; }
    });
    gen();
  })();
}
</script>

  <div class="badges" id="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
</body>
</html>
