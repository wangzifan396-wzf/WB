<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}
#langBtn{border-radius:999px}
.seg{border-radius:var(--r-sm);box-shadow:var(--hair)}
.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .app,.tile,button,textarea,input,select{transition:none!important}
  button:active{transform:none}
}
/* ardot-polish:end v1 */

<body>
<div class="app">
  <h1>SeoForge</h1>
  <p class="sub">SEO 体检：标题与描述长度、Open Graph、canonical、viewport、JSON-LD、h1 计数与评分、正文关键词密度 · 单文件 · 零依赖 · 本地优先</p>

<label>粘贴页面 HTML 源码</label>
<textarea id="src" rows="7" spellcheck="false"></textarea>
<label>正文文本（可选，用于关键词密度；留空则取 HTML 正文）</label>
<textarea id="bodytext" rows="3" spellcheck="false"></textarea>
<div class="row">
  <button id="run">分析 SEO</button>
  <button id="sample" class="ghost">载入示例</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>
<div class="out" id="kw"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>

function seoStripTags(html){
  return String(html||'').replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
}
function seoGet(html, re){
  var m = String(html||'').match(re);
  return m ? (m[1]!==undefined ? m[1] : m[0]) : '';
}
function seoExtractMeta(html){
  var h = String(html||'');
  var meta = {};
  meta.title = seoGet(h, /<title[^>]*>([\s\S]*?)<\/title>/i);
  meta.description = seoGet(h, /<meta[^>]+name=["']description["'][^>]*content=["']([^"']*)["']/i) || seoGet(h, /<meta[^>]+content=["']([^"']*)["'][^>]*name=["']description["']/i);
  var mm, ogRe = /<meta[^>]+property=["']og:([a-z]+)["'][^>]*content=["']([^"']*)["']/gi;
  while((mm = ogRe.exec(h))) meta['og_'+mm[1]] = mm[2];
  var ogRe2 = /<meta[^>]+content=["']([^"']*)["'][^>]*property=["']og:([a-z]+)["']/gi;
  while((mm = ogRe2.exec(h))) if(!meta['og_'+mm[2]]) meta['og_'+mm[2]] = mm[1];
  var twRe = /<meta[^>]+name=["']twitter:([a-z]+)["'][^>]*content=["']([^"']*)["']/gi;
  while((mm = twRe.exec(h))) meta['tw_'+mm[1]] = mm[2];
  meta.canonical = seoGet(h, /<link[^>]+rel=["']canonical["'][^>]*href=["']([^"']*)["']/i) || seoGet(h, /<link[^>]+href=["']([^"']*)["'][^>]*rel=["']canonical["']/i);
  meta.viewport = seoGet(h, /<meta[^>]+name=["']viewport["'][^>]*content=["']([^"']*)["']/i);
  meta.jsonld = (h.match(/application\/ld\+json/gi)||[]).length;
  meta.h1 = (h.match(/<h1[\s\S]*?<\/h1>/gi)||[]).length;
  meta.h2 = (h.match(/<h2[\s\S]*?<\/h2>/gi)||[]).length;
  meta.lang = seoGet(h, /<html[^>]+lang=["']([^"']*)["']/i);
  return meta;
}
function seoLen(s){ return String(s||'').length; }
function seoScore(m){
  var checks = [];
  function add(name, pass, weight){ checks.push({name:name, pass:!!pass, weight:weight||0}); }
  add('标题存在', seoLen(m.title)>0, 15);
  add('标题长度 30-60', seoLen(m.title)>=30 && seoLen(m.title)<=60, 5);
  add('描述存在', seoLen(m.description)>0, 15);
  add('描述长度 70-160', seoLen(m.description)>=70 && seoLen(m.description)<=160, 5);
  add('og:title', seoLen(m.og_title)>0, 8);
  add('og:description', seoLen(m.og_description)>0, 6);
  add('og:image', seoLen(m.og_image)>0, 8);
  add('canonical', seoLen(m.canonical)>0, 6);
  add('viewport', seoLen(m.viewport)>0, 7);
  add('结构化数据', m.jsonld>0, 10);
  add('h1 恰好一个', m.h1===1, 8);
  add('lang 属性', seoLen(m.lang)>0, 7);
  var total=0, got=0;
  for(var i=0;i<checks.length;i++){ total+=checks[i].weight; if(checks[i].pass) got+=checks[i].weight; }
  return { score: got, max: total, checks: checks };
}
function seoKeywordDensity(text, topN){
  var clean = String(text||'').toLowerCase().replace(/[^a-z\u4e00-\u9fa5\s]/g,' ').split(/\s+/).filter(function(w){ return w.length>1; });
  var freq={}, i, total=clean.length;
  for(i=0;i<clean.length;i++) freq[clean[i]]=(freq[clean[i]]||0)+1;
  var arr=[];
  for(var k in freq) arr.push({word:k, count:freq[k], density: total? Math.round(freq[k]/total*1000)/10 : 0});
  arr.sort(function(a,b){ return b.count-a.count; });
  return arr.slice(0, topN||10);
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { seoStripTags:seoStripTags, seoExtractMeta:seoExtractMeta, seoScore:seoScore, seoKeywordDensity:seoKeywordDensity, seoLen:seoLen };
}
if (typeof window !== 'undefined') {
  window.SeoForgePure = { seoStripTags:seoStripTags, seoExtractMeta:seoExtractMeta, seoScore:seoScore, seoKeywordDensity:seoKeywordDensity, seoLen:seoLen };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.SeoForgePure;
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  var SAMPLE='<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>示例页面 - 一个关于工具的示例</title><meta name="description" content="这是一个用于演示 SEO 分析的示例页面，包含完整的结构化元数据。"><meta property="og:title" content="示例页面"><meta property="og:description" content="演示用"><meta property="og:image" content="https://x.com/a.png"><meta name="twitter:card" content="summary"><link rel="canonical" href="https://x.com/p"><meta name="viewport" content="width=device-width,initial-scale=1"><script type="application/ld+json">{}<\/script></head><body><h1>标题</h1><h2>小节</h2><p>正文内容用于关键词密度分析</p></body></html>';
  function run(){
    var html=$('src').value;
    if(!html.trim()){ $('err').textContent='请粘贴 HTML 或点击「载入示例」'; return; }
    var m=P.seoExtractMeta(html);
    var s=P.seoScore(m);
    $('err').textContent='';
    var g='<div class="grid">';
    g+='<div class="kv"><b>SEO 评分</b><span>'+s.score+' / '+s.max+'</span></div>';
    g+='<div class="kv"><b>标题长度</b><span>'+P.seoLen(m.title)+'</span></div>';
    g+='<div class="kv"><b>描述长度</b><span>'+P.seoLen(m.description)+'</span></div>';
    g+='<div class="kv"><b>结构化数据</b><span>'+m.jsonld+' 处</span></div></div>';
    var ch='';
    for(var i=0;i<s.checks.length;i++){ var c=s.checks[i]; ch+='<div class="kv"><b>'+(c.pass?'✓':'✗')+' '+esc(c.name)+'</b><span>'+c.weight+'</span></div>'; }
    $('out').innerHTML=g+'<div style="margin-top:6px">'+ch+'</div>';
    var body=$('bodytext').value || P.seoStripTags(html);
    var kw=P.seoKeywordDensity(body, 12);
    var t='<div class="grid">';
    for(var j=0;j<kw.length;j++) t+='<div class="kv"><b>'+esc(kw[j].word)+'</b><span>'+kw[j].count+' 次 · '+kw[j].density+'%</span></div>';
    $('kw').innerHTML='<label style="margin:0">关键词密度 Top '+kw.length+'</label>'+t+'</div>';
  }
  $('run').addEventListener('click', run);
  $('sample').addEventListener('click', function(){ $('src').value=SAMPLE; run(); });
  $('src').value=SAMPLE; run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
