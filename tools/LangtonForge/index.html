/* ardot-polish:begin v1 */
/* Ardot 设计令牌精修层：大圆角 + 扩散有色阴影 + 内层 hairline + 触感反馈 */
:root{
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
body{-webkit-font-smoothing:antialiased}
.app{border-radius:var(--r-lg);box-shadow:var(--hair),var(--lift),var(--glow)}
h1{letter-spacing:-.02em;font-weight:650}
.sec,.tile h3{letter-spacing:-.01em}
textarea,input[type=text],input[type=number],input[type=search],select{
  border-radius:var(--r-sm);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  transition:border-color .16s ease,box-shadow .16s ease}
textarea:focus,input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,select:focus{
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
button{border-radius:var(--r-sm);letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
  transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{box-shadow:none;opacity:.45}
button.ghost,#langBtn{box-shadow:none}
button.ghost:hover,#langBtn:hover{background:rgba(255,255,255,.03);box-shadow:none;filter:none}

.seg button{border-radius:0;box-shadow:none}
.seg button:hover{background:rgba(255,255,255,.04);box-shadow:none;filter:none}
.seg button.active{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
.tile{border-radius:var(--r-md);box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);
  transition:border-color .18s ease,box-shadow .18s ease}
.tile:hover{box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.out{border-radius:var(--r-md);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}

<body>
<div class="app">
  <h1>LangtonForge</h1>
  <p class="sub">Langton's Ant 蚂蚁自动机：黑格左转白格右转的极简规则涌现出高速公路结构，支持多蚂蚁、暂停/单步/加速，环面网格，离线可用。 · 单文件 · 零依赖 · 本地优先</p>

<div class="row">
  <label style="margin:0">蚂蚁数</label>
  <input id="ants" type="number" value="1" min="1" max="8" style="width:70px">
  <label style="margin:0">每帧步数</label>
  <input id="speed" type="number" value="40" min="1" max="500" style="width:80px">
  <button id="restart">重置</button>
  <button id="toggle" class="ghost">暂停/继续</button>
  <button id="step" class="ghost">单步</button>
  <span class="sub" id="stat" style="margin:0"></span>
</div>
<canvas id="cv" width="480" height="320" style="width:100%;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#0A0A0B;image-rendering:pixelated;"></canvas>
<script>
function laInit(w,h,nAnts){
  w=Math.max(8,Math.floor(w)); h=Math.max(8,Math.floor(h));
  nAnts=Math.max(1,Math.min(8,Math.floor(nAnts)||1));
  var grid=[];
  for(var y=0;y<h;y++){ var row=[]; for(var x=0;x<w;x++){ row.push(0); } grid.push(row); }
  var ants=[];
  for(var i=0;i<nAnts;i++){
    ants.push({ x: Math.floor(w/2 + (i%4)*7 - 10), y: Math.floor(h/2 + Math.floor(i/4)*7 - 3), dir: i%4 });
  }
  ants=ants.map(function(a){ return { x:((a.x%w)+w)%w, y:((a.y%h)+h)%h, dir:a.dir }; });
  return { w:w, h:h, grid:grid, ants:ants, steps:0 };
}
function laStep(st){
  var grid=st.grid.map(function(row){ return row.slice(); });
  var dx=[0,1,0,-1], dy=[-1,0,1,0];
  var ants=st.ants.map(function(a){
    var cell=grid[a.y][a.x];
    var dir = cell===0 ? (a.dir+1)%4 : (a.dir+3)%4;
    grid[a.y][a.x] = cell===0 ? 1 : 0;
    var nx=((a.x+dx[dir])%st.w+st.w)%st.w;
    var ny=((a.y+dy[dir])%st.h+st.h)%st.h;
    return { x:nx, y:ny, dir:dir };
  });
  return { w:st.w, h:st.h, grid:grid, ants:ants, steps:st.steps+1 };
}
function laRun(st,n){ for(var i=0;i<n;i++){ st=laStep(st); } return st; }
function laCount(st){ var c=0; for(var y=0;y<st.h;y++){ for(var x=0;x<st.w;x++){ if(st.grid[y][x]) c++; } } return c; }
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { laInit:laInit, laStep:laStep, laRun:laRun, laCount:laCount };
}
if (typeof window !== 'undefined') {
  window.LangtonForgePure = { laInit:laInit, laStep:laStep, laRun:laRun, laCount:laCount };
}
</script>
<script>
if (typeof window !== 'undefined') {
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    var P = window.LangtonForgePure;
    var W=120, H=80, CELL=4, st=P.laInit(W,H,1), running=true;
    function draw(){
      var cv=$('cv'); var ctx=cv.getContext('2d');
      if(ctx){
        ctx.fillStyle='#0A0A0B'; ctx.fillRect(0,0,W*CELL,H*CELL);
        ctx.fillStyle='#22D3EE';
        for(var y=0;y<H;y++){ for(var x=0;x<W;x++){ if(st.grid[y][x]) ctx.fillRect(x*CELL,y*CELL,CELL,CELL); } }
        ctx.fillStyle='#F5A623';
        for(var i=0;i<st.ants.length;i++){ ctx.fillRect(st.ants[i].x*CELL,st.ants[i].y*CELL,CELL,CELL); }
      }
      $('stat').textContent=st.steps+' 步 · '+P.laCount(st)+' 黑格';
    }
    function frame(){
      if(running){ st=P.laRun(st, Math.max(1,Math.min(500,Number($('speed').value)||40))); draw(); }
      requestAnimationFrame(frame);
    }
    $('restart').addEventListener('click', function(){ st=P.laInit(W,H,Number($('ants').value)||1); draw(); });
    $('toggle').addEventListener('click', function(){ running=!running; });
    $('step').addEventListener('click', function(){ running=false; st=P.laStep(st); draw(); });
    draw();
    requestAnimationFrame(frame);
  })();
}
</script>
