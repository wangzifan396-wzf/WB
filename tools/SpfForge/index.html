<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0B">
<title>SpfForge — SPF 记录分析：机制/限定符逐条解读、DNS 查询计数与防护评级。</title>
<meta property="og:title" content="SpfForge">
<meta property="og:description" content="SPF 记录分析：机制解读、DNS 查询计数与防护评级，离线可用">
<meta property="og:image" content="./og.png">
<meta name="description" content="SPF 记录分析：机制解读、DNS 查询计数与防护评级，离线可用 · 单文件 · 零依赖 · 本地优先">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh}
.app{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
     color:var(--fg);padding:10px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
textarea{resize:vertical}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-size:14px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* nano-polish:v1 */
:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px;border-radius:4px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent,#5E6AD2);outline-offset:2px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <h1>SpfForge</h1>
  <p class="sub">SPF 记录分析：机制与限定符中文解读、DNS 查询次数计数、防护评分与 A-F 评级 · 单文件 · 零依赖 · 本地优先</p>

<label>SPF 记录（TXT 值）</label>
<textarea id="src" rows="3" spellcheck="false" style="font:13px ui-monospace,Consolas,monospace"></textarea>
<div class="row">
  <button id="run">分析</button>
  <button id="sample" class="ghost">示例</button>
</div>
<div class="err" id="err"></div>
<div class="out" id="out"></div>

  <div class="badges">
    <span class="badge">零依赖</span>
    <span class="badge">离线可用</span>
    <span class="badge">数据不出本机</span>
    <span class="badge flag">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部 387 款工具 &rarr;</a></footer>
</div>
<script>

function spParse(record){
  record=String(record||'').trim();
  var parts=record.split(/\s+/).filter(Boolean);
  var mechs=[];
  if(parts[0] && /^v=spf1$/i.test(parts[0])){
    for(var i=1;i<parts.length;i++){
      var tok=parts[i], q='+', body=tok;
      if('+-?~'.indexOf(tok[0])>=0){ q=tok[0]; body=tok.slice(1); }
      var mm=body.match(/^([a-z0-9]+)(:(.*))?$/i);
      mechs.push({ raw:tok, qualifier:q, mechanism: mm?mm[1].toLowerCase():body, value: (mm&&mm[3]!==undefined)?mm[3]:'' });
    }
    return { version:'spf1', mechanisms:mechs, ok:true };
  }
  return { version:'', mechanisms:[], ok:false };
}
function spExplainQual(q){
  return {'+':'放行','-':'硬失败（拒绝）','~':'软失败（标记）','?':'中立（放行但不保证）'}[q]||q;
}
function spDnsLookups(mechs){
  var n=0;
  for(var i=0;i<mechs.length;i++){ var m=mechs[i].mechanism; if(m==='include'||m==='a'||m==='mx'||m==='exists'||m==='redirect'||m==='ptr') n++; }
  return n;
}
function spScore(mechs){
  var lookups=spDnsLookups(mechs), last=null;
  for(var i=0;i<mechs.length;i++) if(mechs[i].mechanism==='all') last=mechs[i];
  var checks=[];
  function add(name,pass,weight){ checks.push({name:name,pass:!!pass,weight:weight}); }
  add('含 v=spf1 版本', true, 10);
  add('以 all 收尾', !!last, 20);
  add('硬失败 -all', last && last.qualifier==='-', 25);
  add('无 +all 开放放行', !(last && last.qualifier==='+'), 20);
  add('DNS 查询 ≤ 10', lookups<=10, 15);
  add('无 ptr 机制', mechs.every(function(m){return m.mechanism!=='ptr';}), 10);
  var got=0,total=0;
  for(var j=0;j<checks.length;j++){ total+=checks[j].weight; if(checks[j].pass) got+=checks[j].weight; }
  var grade='F';
  if(got>=90)grade='A'; else if(got>=75)grade='B'; else if(got>=60)grade='C'; else if(got>=40)grade='D';
  return { score:got, max:total, grade:grade, lookups:lookups, checks:checks };
}
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { spParse:spParse, spExplainQual:spExplainQual, spDnsLookups:spDnsLookups, spScore:spScore };
}
if (typeof window !== 'undefined') {
  window.SpfForgePure = { spParse:spParse, spExplainQual:spExplainQual, spDnsLookups:spDnsLookups, spScore:spScore };
}

</script>
<script>

(function(){
  var $=function(id){ return document.getElementById(id); };
  var P=window.SpfForgePure;
  var SAMPLE='v=spf1 a mx ip4:192.0.2.0/24 include:_spf.google.com include:_spf.microsoft.com -all';
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function run(){
    var rec=P.spParse($('src').value);
    if(!rec.ok){ $('err').textContent='不是有效的 SPF 记录（应以 v=spf1 开头）'; $('out').innerHTML=''; return; }
    var s=P.spScore(rec.mechanisms);
    $('err').textContent='';
    var g='<div class="grid"><div class="kv"><b>防护评级</b><span>'+s.grade+' ('+s.score+'/'+s.max+')</span></div>'+
      '<div class="kv"><b>DNS 查询</b><span>'+s.lookups+' / 10</span></div></div>';
    var t='';
    for(var i=0;i<rec.mechanisms.length;i++){ var me=rec.mechanisms[i]; t+='<div class="kv"><b>'+esc(me.raw)+'</b><span>'+esc(P.spExplainQual(me.qualifier))+'</span></div>'; }
    var c='';
    for(var j=0;j<s.checks.length;j++) c+='<div class="kv"><b>'+(s.checks[j].pass?'✓':'✗')+' '+esc(s.checks[j].name)+'</b><span>'+s.checks[j].weight+'</span></div>';
    $('out').innerHTML=g+'<div style="margin-top:6px"><b style="color:#A1A1AA;font-size:13px">机制</b>'+t+'</div><div style="margin-top:6px">'+c+'</div>';
  }
  $('run').addEventListener('click', run);
  $('sample').addEventListener('click', function(){ $('src').value=SAMPLE; run(); });
  $('src').value=SAMPLE; run();
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
