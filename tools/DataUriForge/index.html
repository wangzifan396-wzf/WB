<style>
:root{
  --bg:#0A0A0B; --card:#141417; --surface:#1A1B1E; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#FFFFFF; --muted:#A1A1AA; --dim:#71717A;
  --accent:#5E6AD2; --ok:#10B981; --warn:#F5A623; --info:#22D3EE; --bad:#EF4444;
  /* Ardot 令牌：大圆角阶梯 + 扩散有色阴影 + 内层 hairline */
  --r-lg:20px; --r-md:14px; --r-sm:10px; --r-xs:8px;
  --hair:inset 0 1px 0 rgba(255,255,255,.05);
  --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02);
  --glow:0 10px 40px -20px rgba(94,106,210,.55);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;justify-content:center;padding:32px 16px;min-height:100vh;
     -webkit-font-smoothing:antialiased}
.app{width:100%;max-width:820px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;
     box-shadow:var(--hair),var(--lift),var(--glow)}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-.02em;font-weight:650}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
     color:var(--fg);padding:10px 12px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
     box-shadow:inset 0 1px 2px rgba(0,0,0,.25);transition:border-color .16s ease,box-shadow .16s ease}
textarea{resize:vertical}
textarea:hover,input:hover,select:hover{border-color:var(--line2)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);
     box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 0 3px rgba(94,106,210,.18)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
button{background:var(--accent);color:#fff;border:0;border-radius:var(--r-sm);padding:10px 16px;cursor:pointer;font-size:14px;
       letter-spacing:-.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px -10px rgba(94,106,210,.85);
       transition:filter .16s ease,transform .08s ease,box-shadow .16s ease}
button:hover{filter:brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 26px -12px rgba(94,106,210,.95)}
button:active{transform:translateY(1px) scale(.988)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;box-shadow:none}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);box-shadow:none}
button.ghost:hover{border-color:var(--line2);color:var(--fg);filter:none;background:rgba(255,255,255,.03);box-shadow:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:14px}
.kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:5px 0;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.kv span{font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.out{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;
     box-shadow:inset 0 1px 3px rgba(0,0,0,.35);
     font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:40px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
.sec{font-size:14px;color:var(--muted);font-weight:600;margin:18px 0 8px;letter-spacing:-.01em}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
/* 分段控件 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:6px;box-shadow:var(--hair)}
.seg button{background:transparent;border:0;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:13px;border-radius:0;
            box-shadow:none;transition:background .15s ease,color .15s ease}
.seg button:hover{background:rgba(255,255,255,.04);color:var(--fg);filter:none;box-shadow:none}
.seg button+button{border-left:1px solid var(--line)}
.seg button.active{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.seg button:active{transform:none}
/* Bento 瓦片（非对称网格，避 3 等宽卡） */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.bento.span2 .tile{grid-column:1/-1}
.bento.c3{grid-template-columns:2fr 1fr}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;
      box-shadow:var(--hair),0 1px 2px rgba(0,0,0,.3);transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.tile:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:var(--hair),0 8px 24px -14px rgba(0,0,0,.9)}
.tile h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:-.01em}
.tile .big{font:20px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);word-break:break-all}
.tile .sub2{color:var(--dim);font-size:12px;margin-top:4px}
/* 状态色 */
.state.ok{color:var(--ok)} .state.warn{color:var(--warn)} .state.bad{color:var(--bad)}
/* 徽章 */
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.flag{color:#fff;background:var(--accent);border-color:transparent}
.badge.tag{color:var(--muted);background:transparent}
footer{margin-top:20px;color:var(--dim);font-size:12px}
a{color:var(--info);text-decoration:none}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#langBtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 13px;font-size:12px;cursor:pointer;flex:0 0 auto;box-shadow:none}
#langBtn:hover{border-color:var(--line2);color:var(--fg);background:rgba(255,255,255,.03);box-shadow:none;filter:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#nanoToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--surface);color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:9999;max-width:80vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#nanoToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#nanoToast.bad{border-color:rgba(239,68,68,.55)}
@media (max-width:760px){.grid{grid-template-columns:1fr}.bento{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <div class="hd">
    <div>
      <h1>DataUriForge</h1>
      <p class="sub" data-i18n="sub">文件与 Data URI 互转 · 单文件 · 零依赖 · 本地优先</p>
    </div>
    <button id="langBtn" type="button" aria-label="Switch language">EN</button>
  </div>

  <div class="seg" role="group" aria-label="模式">

    <button type="button" id="m2">解析 Data URI</button>

  <div id="encPane">
    <div class="row"><input type="file" id="file" aria-label="选择文件"></div>
    <label for="txt">或直接输入文本</label>
    <textarea id="txt" rows="4" spellcheck="false">&lt;svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"&gt;&lt;circle cx="8" cy="8" r="7" fill="#5E6AD2"/&gt;&lt;/svg&gt;</textarea>
    <div class="grid">
      <div><label for="mime">MIME 类型</label><input type="text" id="mime" value="image/svg+xml"></div>
      <div><label for="mode">编码方式</label>
        <select id="mode"><option value="base64">base64</option><option value="pct">百分号编码（文本更短）</option></select></div>
    </div>
  </div>
  <div id="decPane" style="display:none">
    <label for="uri">Data URI</label>
    <textarea id="uri" rows="5" spellcheck="false">data:text/plain;base64,SGVsbG8gbmFuby10b29scw==</textarea>
  </div>
  <div class="row"><button id="go">执行</button><button class="ghost" id="copy">复制结果</button></div>
  <div class="err" id="err"></div>
  <div class="sec">输出结果</div>
  <div class="bento span2" id="stat"></div>
  <div class="out" id="out"></div>
  <p class="hint">文件不会离开浏览器。SVG/CSS 等文本资源用百分号编码通常比 base64 体积更小。</p>

  <div class="badges">
    <span class="badge" data-i18n="b1">零依赖</span>
    <span class="badge" data-i18n="b2">离线可用</span>
    <span class="badge" data-i18n="b3">数据不出本机</span>
    <span class="badge flag" data-i18n="b4">旗舰</span>
  </div>
  <footer>由 nano-tools 脚手架生成 · <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub</a> · <a href="https://wangzifan396-wzf.github.io/WB/" target="_blank" rel="noopener" style="color:inherit">浏览全部工具 &rarr;</a></footer>
</div>
<script>

(function(){
  var B64C='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  function b64e(b){var s='',i;for(i=0;i+2<b.length;i+=3){var n=(b[i]<<16)|(b[i+1]<<8)|b[i+2];
    s+=B64C[n>>18&63]+B64C[n>>12&63]+B64C[n>>6&63]+B64C[n&63];}
    var r=b.length-i;
    if(r===1){var n1=b[i]<<16;s+=B64C[n1>>18&63]+B64C[n1>>12&63]+'==';}
    else if(r===2){var n2=(b[i]<<16)|(b[i+1]<<8);s+=B64C[n2>>18&63]+B64C[n2>>12&63]+B64C[n2>>6&63]+'=';}
    return s;}
  function b64d(s){s=String(s).replace(/\s+/g,'').replace(/=+$/,'');
    if(/[^A-Za-z0-9+/]/.test(s)) return null;
    var o=[],i;
    for(i=0;i+3<s.length;i+=4){var n=(B64C.indexOf(s[i])<<18)|(B64C.indexOf(s[i+1])<<12)|(B64C.indexOf(s[i+2])<<6)|B64C.indexOf(s[i+3]);
      o.push(n>>16&255,n>>8&255,n&255);}
    var r=s.length-i;
    if(r===1) return null;
    if(r===2){var n3=(B64C.indexOf(s[i])<<18)|(B64C.indexOf(s[i+1])<<12);o.push(n3>>16&255);}
    else if(r===3){var n4=(B64C.indexOf(s[i])<<18)|(B64C.indexOf(s[i+1])<<12)|(B64C.indexOf(s[i+2])<<6);o.push(n4>>16&255,n4>>8&255);}
    return Uint8Array.from(o);}
  function utf8(s){
    var o=[],i,c;
    for(i=0;i<s.length;i++){
      c=s.charCodeAt(i);
      if(c<128)o.push(c);
      else if(c<2048){o.push(192|c>>6,128|c&63);}
      else if(c>=55296&&c<56320&&i+1<s.length){
        var c2=s.charCodeAt(i+1);i++;
        var cp=65536+((c-55296)<<10)+(c2-56320);
        o.push(240|cp>>18,128|cp>>12&63,128|cp>>6&63,128|cp&63);
      } else {o.push(224|c>>12,128|c>>6&63,128|c&63);}
    }
    return Uint8Array.from(o);}
  function fromUtf8(b){
    var s='',i=0;
    while(i<b.length){
      var c=b[i++];
      if(c<128)s+=String.fromCharCode(c);
      else if(c>191&&c<224)s+=String.fromCharCode((c&31)<<6|(b[i++]&63));
      else if(c>239){
        var cp=((c&7)<<18|(b[i++]&63)<<12|(b[i++]&63)<<6|(b[i++]&63))-65536;
        s+=String.fromCharCode(55296+(cp>>10),56320+(cp&1023));
      } else s+=String.fromCharCode((c&15)<<12|(b[i++]&63)<<6|(b[i++]&63));
    }
    return s;}

  var MIME={txt:'text/plain',md:'text/markdown',csv:'text/csv',html:'text/html',htm:'text/html',
    css:'text/css',js:'text/javascript',mjs:'text/javascript',json:'application/json',
    xml:'application/xml',yaml:'text/yaml',yml:'text/yaml',svg:'image/svg+xml',png:'image/png',
    jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',avif:'image/avif',
    ico:'image/x-icon',bmp:'image/bmp',pdf:'application/pdf',zip:'application/zip',
    gz:'application/gzip',wasm:'application/wasm',woff:'font/woff',woff2:'font/woff2',
    ttf:'font/ttf',otf:'font/otf',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',
    mp4:'video/mp4',webm:'video/webm',bin:'application/octet-stream'};
  function guessMime(name){
    var m=String(name||'').toLowerCase().match(/\.([a-z0-9]+)$/);
    return (m&&MIME[m[1]])||'application/octet-stream';
  }
  // 对 SVG 等文本资源，百分号编码通常比 base64 更短
  function pctEncode(bytes){
    var s='';
    for(var i=0;i<bytes.length;i++){
      var c=bytes[i];
      var ch=String.fromCharCode(c);
      if(c>32&&c<127&&'#%<>?[\\]^`{|}"'.indexOf(ch)<0) s+=ch;
      else if(c===32) s+='%20';
      else s+='%'+('0'+c.toString(16).toUpperCase()).slice(-2);
    }
    return s;
  }
  function pctDecode(s){
    var o=[];
    for(var i=0;i<s.length;i++){
      if(s[i]==='%'&&i+2<s.length){ o.push(parseInt(s.substr(i+1,2),16)); i+=2; }
      else if(s[i]==='+') o.push(32);
      else o.push(s.charCodeAt(i));
    }
    return Uint8Array.from(o);
  }
  function encode(bytes,mime,opt){
    opt=opt||{};
    if(!bytes||typeof bytes.length!=='number') return {error:'请提供字节数组'};
    mime=mime||'application/octet-stream';
    var charset=opt.charset?(';charset='+opt.charset):'';
    var uri,mode;
    if(opt.mode==='pct'){ uri='data:'+mime+charset+','+pctEncode(bytes); mode='pct'; }
    else { uri='data:'+mime+charset+';base64,'+b64e(bytes); mode='base64'; }
    var over=bytes.length?((uri.length-bytes.length)/bytes.length*100):0;
    return {value:{uri:uri,mode:mode,raw:bytes.length,len:uri.length,
                   overhead:Math.round(over*10)/10,
                   css:'url("'+uri.replace(/"/g,'\\"')+'")'}};
  }
  function parse(uri){
    var s=String(uri||'').trim();
    if(s.slice(0,5).toLowerCase()!=='data:') return {error:'不是合法的 data: URI'};
    var comma=s.indexOf(',');
    if(comma<0) return {error:'缺少逗号分隔符'};
    var head=s.slice(5,comma),body=s.slice(comma+1);
    var segs=head.split(';'),mime=segs[0]||'text/plain',isB64=false,params={};
    for(var i=1;i<segs.length;i++){
      if(segs[i].toLowerCase()==='base64'){ isB64=true; continue; }
      var eq=segs[i].indexOf('=');
      if(eq>0) params[segs[i].slice(0,eq)]=segs[i].slice(eq+1);
    }
    var bytes=isB64?b64d(body):pctDecode(body);
    if(bytes===null) return {error:'base64 数据非法'};
    var isText=/^text\/|json|xml|javascript|svg|yaml/.test(mime);
    return {value:{mime:mime,base64:isB64,params:params,bytes:bytes,size:bytes.length,
                   text:isText?fromUtf8(bytes):null,isText:isText}};
  }
  function encodeText(text,mime,opt){ return encode(utf8(String(text)),mime||'text/plain',opt); }
  function fmtSize(n){
    if(n<1024) return n+' B';
    if(n<1048576) return (n/1024).toFixed(1)+' KB';
    return (n/1048576).toFixed(2)+' MB';
  }
  var API={encode:encode,parse:parse,encodeText:encodeText,guessMime:guessMime,
           b64e:b64e,b64d:b64d,utf8:utf8,fromUtf8:fromUtf8,pctEncode:pctEncode,
           pctDecode:pctDecode,fmtSize:fmtSize};
  if(typeof module!=='undefined'&&module.exports)module.exports=API;
  if(typeof window!=='undefined')window.__DataUriForge__=API;
})();

</script>
<script>

(function(){
  var P=window.__DataUriForge__,mode=1,fileBytes=null,fileName='';
  var out=document.getElementById('out'),err=document.getElementById('err');
  function tile(t,v){return '<div class="tile"><h3>'+t+'</h3><div class="big">'+v+'</div></div>';}
  function setMode(m){
    mode=m;
    document.getElementById('m1').className=(m===1?'active':'');
    document.getElementById('m2').className=(m===2?'active':'');
    document.getElementById('encPane').style.display=(m===1?'':'none');
    document.getElementById('decPane').style.display=(m===2?'':'none');
    run();
  }
  function run(){
    err.textContent=''; out.textContent='';
    var st=document.getElementById('stat'); st.innerHTML='';
    if(mode===1){
      var mime=document.getElementById('mime').value||'text/plain';
      var opt={mode:document.getElementById('mode').value};
      var r=fileBytes?P.encode(fileBytes,mime,opt):P.encodeText(document.getElementById('txt').value,mime,opt);
      if(r.error){ err.textContent=r.error; return; }
      out.textContent=r.value.uri;
      st.innerHTML=tile(window.nanoT?window.nanoT('t1'):'原始大小',P.fmtSize(r.value.raw))
                  +tile(window.nanoT?window.nanoT('t2'):'URI 长度',P.fmtSize(r.value.len))
                  +tile(window.nanoT?window.nanoT('t3'):'膨胀率',r.value.overhead+'%')
                  +tile(window.nanoT?window.nanoT('t4'):'编码',r.value.mode);
    } else {
      var d=P.parse(document.getElementById('uri').value);
      if(d.error){ err.textContent=d.error; return; }
      var v=d.value;
      out.textContent=v.isText?(v.text||''):('[二进制数据 '+v.size+' 字节]');
      st.innerHTML=tile(window.nanoT?window.nanoT('t5'):'MIME',v.mime)
                  +tile(window.nanoT?window.nanoT('t6'):'解码大小',P.fmtSize(v.size))
                  +tile(window.nanoT?window.nanoT('t4'):'编码',v.base64?'base64':'percent')
                  +tile(window.nanoT?window.nanoT('t7'):'字符集',v.params.charset||'-');
    }
  }
  document.getElementById('file').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    fileName=f.name;
    document.getElementById('mime').value=P.guessMime(f.name);
    var fr=new FileReader();
    fr.onload=function(){ fileBytes=new Uint8Array(fr.result); run(); };
    fr.onerror=function(){ err.textContent='文件读取失败'; };
    fr.readAsArrayBuffer(f);
  });
  document.getElementById('txt').addEventListener('input',function(){ fileBytes=null; run(); });
  ['mime','mode','uri'].forEach(function(id){
    var el=document.getElementById(id);
    el.addEventListener('input',run); el.addEventListener('change',run);});
  document.getElementById('m1').addEventListener('click',function(){setMode(1);});
  document.getElementById('m2').addEventListener('click',function(){setMode(2);});
  document.getElementById('go').addEventListener('click',run);
  document.getElementById('copy').addEventListener('click',function(){
    if(out.textContent&&navigator.clipboard)navigator.clipboard.writeText(out.textContent);});
  window.nanoRerender=run;
  run();
})();

</script>

<script>

window.nanoToast=show;

nc.writeText=function(s){return ow(s).then(function(r){show(window.nanoT?window.nanoT('copied'):'已复制');return r;},function(e){show(window.nanoT?window.nanoT('copyfail'):'复制失败',1);throw e;});};}}catch(e){}
})();
/* ---- i18n 运行时 ---- */
var I18N = {"en": {"b1": "Zero deps", "b2": "Offline", "b3": "Local only", "b4": "Flagship", "copied": "Copied", "copyfail": "Copy failed"}, "zh": {"b1": "零依赖", "b2": "离线可用", "b3": "数据不出本机", "b4": "旗舰", "copied": "已复制", "copyfail": "复制失败", "sub": "文件与 Data URI 互转 · 单文件 · 零依赖 · 本地优先", "title": "DataUriForge — 文件与 Data URI 互转"}};
(function(){
  function cur(){try{return localStorage.getItem('nano-lang')==='en'?'en':'zh';}catch(e){return 'zh';}}
  function dict(){return I18N[cur()]||I18N.zh;}
  function apply(){
    var l=cur(), d=dict();
    document.documentElement.lang = (l==='en'?'en':'zh-CN');
    var ns=document.querySelectorAll('[data-i18n]');
    for(var i=0;i<ns.length;i++){var k=ns[i].getAttribute('data-i18n');if(d[k]!=null)ns[i].textContent=d[k];}
    var ps=document.querySelectorAll('[data-i18n-ph]');
    for(var j=0;j<ps.length;j++){var k2=ps[j].getAttribute('data-i18n-ph');if(d[k2]!=null)ps[j].setAttribute('placeholder',d[k2]);}
    var b=document.getElementById('langBtn'); if(b) b.textContent=(l==='en'?'中文':'EN');
    if(d.title) document.title=d.title;
  }
  window.nanoT=function(k){var d=dict();return d[k]!=null?d[k]:k;};
  window.nanoApplyI18n=apply;
  var b=document.getElementById('langBtn');
  if(b) b.addEventListener('click', function(){
    try{localStorage.setItem('nano-lang', cur()==='en'?'zh':'en');}catch(e){}
    apply(); if(window.nanoRerender) window.nanoRerender();
  });
  apply();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
