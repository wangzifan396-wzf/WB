name: nano-tools audit gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install audit deps (jsdom, dev-only)
        run: npm install --no-save jsdom

      - name: Render gate (each tool page must be valid JS, not truncated)
        run: node .github/audit/audit_render.js tools

      - name: Matrix audit v3 (SW/DOM/CSS/head runtime defects)
        run: python .github/audit/audit_matrix_v3.py tools

      - name: Portal consistency (TOOLS/EN/ICONS parse + count alignment)
        run: node .github/audit/audit_portal.js

      - name: Runtime regression (jsdom boots every tool, catches init errors)
        run: node .github/audit/audit_runtime.js tools

      - name: MCP manifest gate (structure + consistency of tools/*/mcp.json)
        run: python .github/audit/audit_mcp.py tools
