name: 缺陷报告
description: 报告某个工具的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: tool
    attributes:
      label: 受影响工具
      placeholder: 例如 RegexLab / GraphForge
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: 复现步骤与现象
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望行为
