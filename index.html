<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nano-tools · 单文件零依赖工具集</title>
<meta name="description" content="A collection of single-file, zero-dependency, offline-first developer tools. 单文件、零依赖、本地优先的开发者工具矩阵。">
<style>
  :root{
    --bg:#08090A; --surface:#101113; --surface2:#1C1D1F; --border:#26282B;
    --text:#F7F8F8; --text2:#9CA0A8; --text3:#6B6F76;
    --accent:#5E6AD2; --accent2:#8B93E8; --accent-soft:rgba(94,106,210,.14);
    --green:#2EA043; --amber:#E0A030; --pink:#E06AA0; --cyan:#3AB7C7; --red:#E5484D;
    --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.4);
    --maxw:1160px;
  }
  html[data-theme="light"]{
    --bg:#FBFBFC; --surface:#FFFFFF; --surface2:#F4F5F7; --border:#E6E8EB;
    --text:#0D0E10; --text2:#5B616B; --text3:#8A9099;
    --accent:#5E6AD2; --accent2:#4550C0; --accent-soft:rgba(94,106,210,.10);
    --shadow:0 6px 24px rgba(20,22,40,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;
    transition:background .4s ease,color .4s ease;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

  /* backdrop */
  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .aurora::before,.aurora::after{
    content:"";position:absolute;width:60vw;height:60vw;border-radius:50%;filter:blur(90px);opacity:.5;
    will-change:transform;
  }
  .aurora::before{background:radial-gradient(circle,#5E6AD2,transparent 60%);top:-20vw;left:-10vw;animation:float1 22s ease-in-out infinite}
  .aurora::after{background:radial-gradient(circle,#E06AA0,transparent 60%);top:10vw;right:-15vw;animation:float2 26s ease-in-out infinite}
  html[data-theme="light"] .aurora::before{opacity:.22}
  html[data-theme="light"] .aurora::after{opacity:.16}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(6vw,4vw)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vw,3vw)}}
  .dots{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:26px 26px;
    mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 75%);
    -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 75%);}

  /* nav */
  nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
    background:color-mix(in srgb,var(--bg) 72%,transparent);
    border-bottom:1px solid var(--border);}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--pink));
    display:grid;place-items:center;color:#fff;font-size:16px;font-weight:800;box-shadow:0 4px 14px var(--accent-soft)}
  .nav-actions{display:flex;align-items:center;gap:8px}
  .btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;
    border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:600;
    cursor:pointer;transition:transform .18s ease,background .2s ease,border-color .2s ease;white-space:nowrap}
  .btn:hover{transform:translateY(-1px);border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent2)}
  .icon-btn{width:38px;height:38px;padding:0;justify-content:center;font-size:16px}

  /* hero */
  header.hero{position:relative;z-index:1;text-align:center;padding:80px 0 48px}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;
    border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--text2);margin-bottom:24px}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
  h1.title{font-size:clamp(38px,6vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-bottom:20px}
  h1.title .grad{background:linear-gradient(120deg,var(--accent2),var(--pink) 60%,var(--cyan));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{font-size:clamp(15px,2vw,19px);color:var(--text2);max-width:600px;margin:0 auto 34px}
  .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  /* stats */
  .stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:48px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 26px;min-width:130px;transition:transform .2s ease,border-color .2s ease}
  .stat:hover{transform:translateY(-3px);border-color:var(--accent)}
  .stat .num{font-size:30px;font-weight:800;letter-spacing:-.03em;
    background:linear-gradient(120deg,var(--accent2),var(--pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .stat .lab{font-size:12.5px;color:var(--text2);margin-top:4px}

  /* controls */
  .controls{position:relative;z-index:1;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:56px 0 26px}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;height:46px;padding:0 16px 0 44px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:14.5px;outline:none;transition:border-color .2s ease}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:9px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
    color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:all .18s ease;white-space:nowrap}
  .chip:hover{border-color:var(--accent);color:var(--text)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

  /* grid */
  .grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding-bottom:40px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;
    display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;
    transition:transform .22s cubic-bezier(.2,.7,.3,1),border-color .22s ease,box-shadow .22s ease;
    opacity:0;transform:translateY(14px);animation:cardIn .5s forwards}
  @keyframes cardIn{to{opacity:1;transform:translateY(0)}}
  .card::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),var(--accent-soft),transparent 40%);
    opacity:0;transition:opacity .3s ease;pointer-events:none}
  .card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:var(--shadow)}
  .card:hover::before{opacity:1}
  .card-top{display:flex;align-items:flex-start;gap:14px}
  .card-ico{width:48px;height:48px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:24px;
    background:var(--surface2);border:1px solid var(--border)}
  .card-h{flex:1;min-width:0}
  .card-h h3{font-size:17px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .card-h .cat{font-size:11.5px;color:var(--text3);margin-top:2px}
  .card p{font-size:13.5px;color:var(--text2);line-height:1.55;flex:1}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;padding:3px 9px;border-radius:6px;background:var(--surface2);color:var(--text3);border:1px solid var(--border)}
  .card-actions{display:flex;gap:9px;margin-top:2px}
  .card-actions .btn{height:36px;font-size:13px;flex:1;justify-content:center}
  .no-result{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--text3)}

  /* footer */
  footer{position:relative;z-index:1;border-top:1px solid var(--border);margin-top:40px;padding:40px 0;text-align:center;color:var(--text3);font-size:13px}
  footer a{color:var(--text2);border-bottom:1px dashed var(--border)}
  footer a:hover{color:var(--accent)}
  .foot-links{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}

  @media(max-width:640px){
    header.hero{padding:52px 0 32px}
    .stat{min-width:calc(50% - 7px);padding:14px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="dots"></div>

<nav>
  <div class="wrap nav-in">
    <a class="brand" href="#top">
      <span class="logo">n</span><span>nano-tools</span>
    </a>
    <div class="nav-actions">
      <a class="btn" href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">
        <span>★</span><span>GitHub</span>
      </a>
      <button class="btn icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">◐</button>
    </div>
  </div>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <span class="pill"><span class="dot"></span>全部开源 · MIT License · 持续更新</span>
    <h1 class="title">一套<span class="grad">单文件</span>开发者工具<br>零依赖 · 本地优先 · 即开即用</h1>
    <p class="subtitle">每个工具都是一个 <code>index.html</code>——无需安装、无需构建、无需联网。下载即用，数据永远留在你的浏览器里。</p>
    <div class="hero-cta">
      <a class="btn primary" href="#tools">浏览工具 ↓</a>
      <a class="btn" href="trends.html">AI 发展趋势 →</a>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap" id="tools">
  <div class="controls">
    <div class="search">
      <span class="si">⌕</span>
      <input type="text" id="search" placeholder="搜索工具… 试试 regex / json / 颜色 / 压缩" autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-links">
      <a href="https://github.com/wangzifan396-wzf" target="_blank" rel="noopener">GitHub Profile</a>
      <a href="trends.html">AI 趋势</a>
      <a href="#tools">全部工具</a>
    </div>
    <div>Built with HTML5 + Vanilla JS · Zero dependency · <span id="year"></span> · Crafted with care</div>
  </div>
</footer>

<script>
(function(){
  "use strict";
  var USER = "wangzifan396-wzf";
  var base = "https://" + USER + ".github.io/";
  var repo = "https://github.com/" + USER + "/";

  // 工具数据 —— 单一数据源
  var TOOLS = [
    {id:"RegexLab", name:"RegexLab", icon:"⚡", cat:"文本处理", color:"#E0A030",
     desc:"正则表达式实时测试器：匹配高亮、捕获组、替换预览、14 组常用正则库与速查表。",
     tags:["regex","testing","cheatsheet"]},
    {id:"CronText", name:"CronText", icon:"⏰", cat:"开发辅助",
     desc:"Cron 表达式翻译成人话，并预测未来 8 次运行时间；内置常见调度示例库。",
     tags:["cron","scheduler","parser"]},
    {id:"DiffLens", name:"DiffLens", icon:"⇄", cat:"文本处理",
     desc:"基于 LCS 的文本 / JSON 差异对比，并排与内联双视图，JSON 规范化后按结构比对。",
     tags:["diff","json","lcs"]},
    {id:"ContextLens", name:"ContextLens", icon:"◎", cat:"AI 工具",
     desc:"LLM 上下文与成本可视化器：token 估算、多模型价格对比、上下文窗口占用分析。",
     tags:["llm","token","cost"]},
    {id:"BoxKit", name:"BoxKit", icon:"⬢", cat:"开发辅助",
     desc:"19 合 1 离线开发者工具箱：JSON/YAML、Base64、哈希、时间戳、正则、颜色等一站搞定。",
     tags:["toolbox","json","utility"]},
    {id:"Inkwell", name:"Inkwell", icon:"✒", cat:"效率笔记",
     desc:"本地优先 Markdown 知识库：双向链接、力导向关系图、实时预览，数据全存本地。",
     tags:["markdown","wiki","notes"]},
    {id:"Graphite", name:"Graphite", icon:"◈", cat:"可视化",
     desc:"SVG 可视化节点编辑器：拖拽连线、自动布局，导出 SVG / PNG / JSON / Markdown。",
     tags:["node-editor","svg","graph"]},
    {id:"Chartify", name:"Chartify", icon:"▦", cat:"可视化",
     desc:"CSV / JSON 秒变 SVG 图表：柱状、折线、饼图，可导出矢量图，纯前端渲染。",
     tags:["chart","csv","svg"]},
    {id:"UniConvert", name:"UniConvert", icon:"⇌", cat:"实用计算",
     desc:"12 类万能单位换算：长度、重量、温度、数据、时间、货币格式等，实时联动。",
     tags:["converter","calculator","units"]},
    {id:"SnapCompress", name:"SnapCompress", icon:"🗜", cat:"图像工具",
     desc:"纯 Canvas 图片压缩：JPEG/PNG/WebP、质量与最大宽度可调、压缩前后实时对比。",
     tags:["image","compress","canvas"]},
    {id:"PalettePro", name:"PalettePro", icon:"◑", cat:"设计工具",
     desc:"颜色 / 配色工作台：WCAG 对比度检测、和谐配色生成、渐变构造、取色板管理。",
     tags:["color","wcag","palette"]},
    {id:"HashKit", name:"HashKit", icon:"#", cat:"编码加密", color:"#3AB7C7",
     desc:"编码与哈希工具箱：Base64/URL/HTML 编解码、SHA 哈希、JWT 解码、UUID 与密码生成。",
     tags:["encode","hash","jwt"], soon:false},
    {id:"JsonForge", name:"JsonForge", icon:"{}", cat:"文本处理", color:"#2EA043",
     desc:"JSON 工作台：格式化 / 压缩 / 校验、转 TypeScript 类型、JSONPath 查询、树形浏览。",
     tags:["json","typescript","jsonpath"], soon:false}
  ];

  var CATS = ["全部"];
  TOOLS.forEach(function(t){ if(CATS.indexOf(t.cat)<0) CATS.push(t.cat); });

  var $ = function(s,el){return (el||document).querySelector(s);};
  var state = {q:"", cat:"全部"};

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  // 过滤逻辑（纯函数，可测）
  function filterTools(list, q, cat){
    q = (q||"").trim().toLowerCase();
    return list.filter(function(t){
      if(cat && cat!=="全部" && t.cat!==cat) return false;
      if(!q) return true;
      var hay = (t.name+" "+t.desc+" "+t.cat+" "+t.tags.join(" ")).toLowerCase();
      return hay.indexOf(q)>=0;
    });
  }

  function renderStats(){
    var el = $("#stats"); if(!el) return;
    var cats = {};
    TOOLS.forEach(function(t){cats[t.cat]=1;});
    var data = [
      {num:TOOLS.length, lab:"开源工具"},
      {num:Object.keys(cats).length, lab:"工具分类"},
      {num:"0", lab:"外部依赖"},
      {num:"100%", lab:"本地运行"}
    ];
    el.innerHTML = data.map(function(d){
      return '<div class="stat"><div class="num">'+d.num+'</div><div class="lab">'+d.lab+'</div></div>';
    }).join("");
  }

  function renderFilters(){
    var el = $("#filters"); if(!el) return;
    el.innerHTML = CATS.map(function(c){
      return '<button class="chip'+(c===state.cat?' active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';
    }).join("");
  }

  function renderGrid(){
    var el = $("#grid"); if(!el) return;
    var list = filterTools(TOOLS, state.q, state.cat);
    if(!list.length){
      el.innerHTML = '<div class="no-result">没有匹配的工具，换个关键词试试 🔍</div>';
      return;
    }
    el.innerHTML = list.map(function(t,i){
      var demo = base + t.id + "/";
      var src = repo + t.id;
      var icoStyle = t.color ? ' style="color:'+t.color+'"' : '';
      return ''+
      '<article class="card" style="animation-delay:'+(i*45)+'ms">'+
        '<div class="card-top">'+
          '<div class="card-ico"'+icoStyle+'>'+esc(t.icon)+'</div>'+
          '<div class="card-h"><h3>'+esc(t.name)+'</h3><div class="cat">'+esc(t.cat)+'</div></div>'+
        '</div>'+
        '<p>'+esc(t.desc)+'</p>'+
        '<div class="tags">'+t.tags.map(function(x){return '<span class="tag">'+esc(x)+'</span>';}).join("")+'</div>'+
        '<div class="card-actions">'+
          '<a class="btn primary" href="'+demo+'" target="_blank" rel="noopener">在线试用</a>'+
          '<a class="btn" href="'+src+'" target="_blank" rel="noopener">源码</a>'+
        '</div>'+
      '</article>';
    }).join("");
    // 卡片跟随鼠标高光
    Array.prototype.forEach.call(el.querySelectorAll(".card"),function(card){
      card.addEventListener("mousemove",function(e){
        var r = card.getBoundingClientRect();
        card.style.setProperty("--mx",(e.clientX-r.left)+"px");
        card.style.setProperty("--my",(e.clientY-r.top)+"px");
      });
    });
  }

  function applyTheme(t){
    document.documentElement.setAttribute("data-theme",t);
    try{localStorage.setItem("nano-theme",t);}catch(e){}
    var b = $("#themeBtn"); if(b) b.textContent = t==="dark"?"◐":"◑";
  }

  function init(){
    renderStats();
    renderFilters();
    renderGrid();
    var y = $("#year"); if(y) y.textContent = new Date().getFullYear();

    var s = $("#search");
    if(s) s.addEventListener("input",function(){ state.q=s.value; renderGrid(); });

    var f = $("#filters");
    if(f) f.addEventListener("click",function(e){
      var b = e.target.closest(".chip"); if(!b) return;
      state.cat = b.getAttribute("data-cat");
      renderFilters(); renderGrid();
    });

    var tb = $("#themeBtn");
    if(tb) tb.addEventListener("click",function(){
      var cur = document.documentElement.getAttribute("data-theme");
      applyTheme(cur==="dark"?"light":"dark");
    });
    var saved="dark";
    try{saved = localStorage.getItem("nano-theme")||"dark";}catch(e){}
    applyTheme(saved);
  }

  // 测试导出
  if(typeof module!=="undefined" && module.exports){
    module.exports = {filterTools:filterTools, TOOLS:TOOLS, CATS:CATS};
  }
  if(typeof window==="undefined") return;

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
  else init();
})();
</script>
</body>
</html>
